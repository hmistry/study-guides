orders\nWHERE created_at >= timestamptz '2026-03-20 00:00Z'\n  AND created_at <  timestamptz '2026-03-21 00:00Z'\n  AND status = 'paid'\nORDER BY id;\n", "expect": {"cols": ["id", "user_id"], "rows": [[10, 3], [11, 6]]}, "insight": "`created_at::date = '2026-03-20'` gives the same rows but wraps the column in a cast, so the index on `created_at` can't be used; and in another session time zone it's a different day. The half-open range (`>=` start, `<` next day) is sargable, exact at the boundary (order 11 at 22:10 is included, midnight of the 21st is not) and independent of the session zone because the literals carry `Z`.", "mysql": "Same rewrite: `WHERE DATE(created_at) = …` also defeats MySQL indexes (unless you add a functional index on `(DATE(created_at))`)."}, {"id": "keyset-page", "title": "The next page, without OFFSET", "variant": "disguise", "statement": "Ana's activity feed shows her events newest first, 3 per page, with an index on `events (user_id, at, id)` (see Setup). Page 1 ended at the event with `at = 2026-03-03 09:59Z` and `id = 5`. Return page 2: `id`, `type`, `at`. The plan must use `events_user_at_idx`.", "hint": "Instead of counting rows to skip, start right after the last row you showed. Ties on `at` need the id too.", "setup": "CREATE INDEX events_user_at_idx ON events (user_id, at, id);", "uses_index": "events_user_at_idx", "solution": "SELECT id, type, at\nFROM events\nWHERE user_id = 1\n  AND (at, id) < (timestamptz '2026-03-03 09:59Z', 5)\nORDER BY at DESC, id DESC\nLIMIT 3;\n", "expect": {"cols": ["id", "type", "at"], "rows": [[4, "view", "2026-03-03 09:50:00+00"], [3, "checkout", "2026-03-01 09:14:00+00"], [2, "add_to_cart", "2026-03-01 09:05:00+00"]]}, "insight": "Keyset (seek) pagination: the row comparison `(at, id) < (…)` continues exactly after the last row, and with the index on `(user_id, at, id)` the scan starts there and stops after 3 entries, whatever the page number. OFFSET would read and discard every earlier row, and shows duplicates or gaps when new events arrive between page loads. The trade-off: no “jump to page 50”, only next / previous.", "mysql": "MySQL supports row constructors too, but historically didn't use indexes well for them; write `at < ? OR (at = ? AND id < ?)`."}], "part": "B"}, {"id": "isolation", "name": "Transactions & Isolation", "signal": ["money, stock, seats: read a value, then write based on it", "“two requests at the same time” / double booking", "a rule across rows (“at least one doctor on call”)", "“how did the balance go negative?”", "choosing an isolation level or a retry policy"], "idea": "Isolation decides which interleavings of concurrent transactions the database allows. Postgres's default, Read Committed, gives each statement a fresh snapshot. Repeatable Read gives the whole transaction one snapshot and aborts on write-write conflicts. Serializable also aborts on read-write dependency cycles. Stronger levels don't block more, they abort more, so every caller needs a retry loop.", "diagram": {"type": "timeline", "caption": "two sessions, time flowing down; accounts(id 1, balance 100) unless noted", "sessions": ["T1", "T2"], "frames": [{"title": "Lost update · Read Committed", "steps": [{"t": "T1", "sql": "BEGIN;"}, {"t": "T2", "sql": "BEGIN;"}, {"t": "T1", "sql": "SELECT balance FROM accounts WHERE id = 1;", "out": "100", "mark": "sees"}, {"t": "T2", "sql": "SELECT balance FROM accounts WHERE id = 1;", "out": "100", "mark": "sees"}, {"t": "T1", "sql": "UPDATE accounts SET balance = 150 WHERE id = 1;", "out": "app computed 100 + 50"}, {"t": "T2", "sql": "UPDATE accounts SET balance = 70 WHERE id = 1;", "out": "waits for T1's row lock", "mark": "wait"}, {"t": "T1", "sql": "COMMIT;"}, {"t": "T2", "sql": "(update proceeds)", "out": "UPDATE 1"}, {"t": "T2", "sql": "COMMIT;", "out": "balance = 70: T1's +50 is lost", "mark": "bad"}], "note": "Both read 100 and write a value computed in the app. The row lock only serializes the two writes, not the read-modify-write, so T2 overwrites T1's committed change."}, {"title": "Fix · atomic UPDATE", "steps": [{"t": "T1", "sql": "BEGIN;"}, {"t": "T2", "sql": "BEGIN;"}, {"t": "T1", "sql": "UPDATE accounts SET balance = balance + 50 WHERE id = 1;"}, {"t": "T2", "sql": "UPDATE accounts SET balance = balance - 30 WHERE id = 1;", "out": "waits for T1's row lock", "mark": "wait"}, {"t": "T1", "sql": "COMMIT;"}, {"t": "T2", "sql": "(update proceeds)", "out": "re-reads the row: 150 − 30", "mark": "sees"}, {"t": "T2", "sql": "COMMIT;", "out": "balance = 120 ✓", "mark": "ok"}], "note": "Let the database do the arithmetic. After a lock wait, Read Committed re-evaluates the UPDATE against the newly committed row, so increments compose. With a precondition, add it to the WHERE (`AND balance >= 30`) and check the row count. `SELECT … FOR UPDATE` before the read works too."}, {"title": "Lost update · Repeatable Read", "steps": [{"t": "T1", "sql": "BEGIN ISOLATION LEVEL REPEATABLE READ;"}, {"t": "T2", "sql": "BEGIN ISOLATION LEVEL REPEATABLE READ;"}, {"t": "T1", "sql": "SELECT balance FROM accounts WHERE id = 1;", "out": "100", "mark": "sees"}, {"t": "T2", "sql": "SELECT balance FROM accounts WHERE id = 1;", "out": "100", "mark": "sees"}, {"t": "T1", "sql": "UPDATE accounts SET balance = 150 WHERE id = 1;"}, {"t": "T2", "sql": "UPDATE accounts SET balance = 70 WHERE id = 1;", "out": "waits for T1's row lock", "mark": "wait"}, {"t": "T1", "sql": "COMMIT;"}, {"t": "T2", "sql": "(update resumes)", "out": "ERROR 40001: could not serialize access due to concurrent update", "mark": "error"}, {"t": "T2", "sql": "ROLLBACK;", "out": "retry from BEGIN: reads 150, writes 120 ✓", "mark": "ok"}], "note": "Same code, stronger level. T2's snapshot predates T1's commit, so Postgres refuses to overwrite a row changed since the snapshot (first updater wins). The app must retry the whole transaction. MySQL's Repeatable Read does **not** do this: the update succeeds and the +50 is lost."}, {"title": "Write skew · Repeatable Read", "steps": [{"t": "T1", "sql": "BEGIN ISOLATION LEVEL REPEATABLE READ;"}, {"t": "T2", "sql": "BEGIN ISOLATION LEVEL REPEATABLE READ;"}, {"t": "T1", "sql": "SELECT count(*) FROM doctors WHERE on_call;", "out": "2: Alice can leave", "mark": "sees"}, {"t": "T2", "sql": "SELECT count(*) FROM doctors WHERE on_call;", "out": "2: Bob can leave", "mark": "sees"}, {"t": "T1", "sql": "UPDATE doctors SET on_call = false WHERE name = 'alice';"}, {"t": "T2", "sql": "UPDATE doctors SET on_call = false WHERE name = 'bob';", "out": "different row: no wait"}, {"t": "T1", "sql": "COMMIT;"}, {"t": "T2", "sql": "COMMIT;", "out": "0 doctors on call", "mark": "bad"}], "note": "Each transaction checks a rule across rows, then writes a **different** row. No row is written twice, so snapshot isolation sees no conflict, and the rule breaks. Double bookings and overdrawn joint accounts have the same shape."}, {"title": "Write skew · Serializable", "steps": [{"t": "T1", "sql": "BEGIN ISOLATION LEVEL SERIALIZABLE;"}, {"t": "T2", "sql": "BEGIN ISOLATION LEVEL SERIALIZABLE;"}, {"t": "T1", "sql": "SELECT count(*) FROM doctors WHERE on_call;", "out": "2", "mark": "sees"}, {"t": "T2", "sql": "SELECT count(*) FROM doctors WHERE on_call;", "out": "2", "mark": "sees"}, {"t": "T1", "sql": "UPDATE doctors SET on_call = false WHERE name = 'alice';"}, {"t": "T2", "sql": "UPDATE doctors SET on_call = false WHERE name = 'bob';"}, {"t": "T1", "sql": "COMMIT;", "mark": "ok"}, {"t": "T2", "sql": "COMMIT;", "out": "ERROR 40001: could not serialize access due to read/write dependencies", "mark": "error"}], "note": "SSI tracks what each transaction read (predicate locks that never block). Each one read rows the other then changed, a cycle no serial order allows, so one aborts. Retrying T2 sees 1 doctor on call and refuses."}]}, "tables": [{"title": "Anomalies by isolation level (Postgres)", "cols": ["Anomaly", "What happens", "Read Committed", "Repeatable Read", "Serializable"], "rows": [["**Dirty read**", "See another transaction's uncommitted write", "prevented", "prevented", "prevented"], ["**Non-repeatable read**", "Same row read twice, different values", "possible", "prevented", "prevented"], ["**Phantom**", "Same predicate re-run, new rows appear", "possible", "prevented (snapshot)", "prevented"], ["**Lost update**", "Read-modify-write overwrites a concurrent write", "possible", "prevented: 40001", "prevented: 40001"], ["**Write skew**", "Both read overlapping data, write different rows, break a rule", "possible", "possible", "prevented: 40001"]]}, {"title": "Postgres vs MySQL (InnoDB)", "cols": ["", "Postgres", "MySQL InnoDB"], "rows": [["**Default level**", "Read Committed", "Repeatable Read"], ["**Repeatable Read**", "Snapshot isolation; first updater wins, the other gets 40001", "Snapshot for plain SELECTs; UPDATE and locking reads use the latest committed row, so lost updates slip through"], ["**Phantoms**", "None under RR (one snapshot)", "None for plain reads; locking reads take gap / next-key locks"], ["**Serializable**", "SSI: optimistic, no extra blocking, aborts with 40001", "Every plain SELECT becomes `FOR SHARE`: blocking and deadlock-prone"], ["**Read Uncommitted**", "Behaves as Read Committed", "Real dirty reads"]]}], "snippets": [{"task": "Default level of this server", "sql": "SHOW default_transaction_isolation;", "out": {"cols": ["default_transaction_isolation"], "rows": [["read committed"]]}}, {"task": "Raise the level for one transaction", "tx": false, "sql": "BEGIN ISOLATION LEVEL REPEATABLE READ;\nSELECT current_setting('transaction_isolation') AS level;\nCOMMIT;\n", "out": {"cols": ["level"], "rows": [["repeatable read"]]}, "note": "Or `BEGIN;` then `SET TRANSACTION ISOLATION LEVEL REPEATABLE READ;`, which must come before the transaction's first query."}, {"task": "Long read-only report that never aborts", "sql": "BEGIN ISOLATION LEVEL SERIALIZABLE READ ONLY DEFERRABLE;", "run": false, "note": "Waits until it can take a snapshot that no concurrent transaction can invalidate, then runs without serialization failures or predicate-lock overhead."}, {"task": "Guard against forgotten open transactions", "sql": "SET idle_in_transaction_session_timeout = '30s';", "note": "Kills sessions that sit idle inside a transaction, which would otherwise hold locks and block VACUUM. Usually set per role or in the server config."}], "pitfalls": ["**Assuming Read Committed sees a stable world.** Each statement takes a new snapshot, so two SELECTs in one transaction can disagree, and a report that queries several tables can be internally inconsistent. Use Repeatable Read for multi-statement reads.", "**Read-modify-write in the app.** `SELECT balance`, compute, `UPDATE … SET balance = $new` loses updates under Read Committed. Write `SET balance = balance - 30 WHERE balance >= 30`, or lock first with `FOR UPDATE`.", "**Raising the level without a retry loop.** Repeatable Read and Serializable report conflicts as SQLSTATE 40001 (deadlocks are 40P01). The whole transaction, reads included, must rerun. Without retries you've swapped silent corruption for 500 errors.", "**Side effects inside a transaction that may retry.** Emails, HTTP calls and queue publishes don't roll back. Do them after commit, or write them to an outbox table in the same transaction.", "**Long transactions.** An open transaction, even idle, pins its snapshot: VACUUM can't remove rows it might see, and Serializable keeps tracking its reads. Keep transactions to milliseconds and set `idle_in_transaction_session_timeout`.", "**Check-then-insert for uniqueness.** `SELECT … WHERE email = $1` then `INSERT` races below Serializable. Let a unique index decide and handle 23505, or use `ON CONFLICT`."], "depth": ["**Postgres Repeatable Read is snapshot isolation:** stronger than the SQL standard's RR (no phantoms), weaker than Serializable (write skew). Name the anomaly first, then pick the cheapest tool: an atomic statement, a row lock, a constraint, and only then Serializable.", "**How SSI works (PG 9.1+):** reads take SIRead predicate locks that never block; Postgres tracks read-write dependencies and aborts one transaction when two consecutive rw-edges form a dangerous structure. False positives happen, and more with seq scans, because predicate locks escalate to the whole relation. Good indexes mean fewer aborts.", "**Materialize the conflict** instead of going Serializable. Write skew becomes a plain write-write conflict if both transactions lock a shared row (`SELECT … FROM shifts WHERE id = $1 FOR UPDATE`), and double-booking is better stated as an exclusion constraint (`EXCLUDE USING gist (room_id WITH =, during WITH &&)`).", "**Read Committed re-check (EvalPlanQual):** when an UPDATE waits on a row lock and the row changes, Postgres re-evaluates the WHERE on the new version and proceeds only if it still matches. That makes `SET x = x + 1` safe, but conditions that read other tables (subqueries) still use the old snapshot.", "**Retry design:** retry 40001 and 40P01 a few times (3–5) with jittered backoff, rerun the whole function from BEGIN, and return 409 when retries run out. An idempotency key covers the case where the commit succeeded but the response was lost.", "**Replicas:** a hot standby can't run Serializable transactions (Read Committed and Repeatable Read only), and its snapshots lag the primary. Read-your-writes needs routing to the primary or waiting until the replica has replayed the write's LSN."], "mysql": ["Default is Repeatable Read. Plain SELECTs read the snapshot, but UPDATE, DELETE and `SELECT … FOR UPDATE` read the latest committed row, so lost updates with app-computed values are **not** caught. Use atomic updates or `FOR UPDATE`.", "Under RR, InnoDB takes gap and next-key locks on ranges it reads with locking reads or writes, to block phantoms. Inserts into a locked range wait, and deadlocks are more common than in Postgres.", "Deadlocks are error 1213 (SQLSTATE 40001) and roll back the transaction. Lock-wait timeouts are error 1205 (`innodb_lock_wait_timeout`, 50 s by default) and roll back only the statement unless `innodb_rollback_on_timeout` is on."], "checks": [{"q": "Two concurrent withdrawals each run `SELECT balance` and then `UPDATE accounts SET balance = :computed`. Balance 100, withdrawals 30 and 50, Postgres defaults. What final balances are possible, and what's the smallest fix?", "a": "70 or 50: a lost update, whichever writes last wins. The correct 20 happens only when the two don't overlap. Smallest fix: `UPDATE accounts SET balance = balance - :amt WHERE id = :id AND balance >= :amt`, then check that one row was updated (0 means insufficient funds). Alternatively `SELECT … FOR UPDATE` before computing."}, {"q": "You move the withdraw transaction to Repeatable Read. What new failure must the code handle?", "a": "SQLSTATE 40001, “could not serialize access due to concurrent update”, when another transaction committed a change to the same row after this snapshot was taken. Roll back and rerun the whole transaction, including the read, with a small retry cap and backoff."}, {"q": "Room booking: two transactions each check for overlapping bookings, see none, and insert. Which anomaly is it, which level stops it, and what's better?", "a": "Write skew via a phantom: each inserts a row the other's check would have found. Read Committed and Repeatable Read both allow it; Serializable catches it with a 40001. Better: an exclusion constraint, `EXCLUDE USING gist (room_id WITH =, during WITH &&)` (needs `btree_gist`). The database rejects the overlap at any level, without retries."}, {"q": "A nightly report runs 40 queries in one transaction under Read Committed, and its totals don't add up. Why, and how do you fix it without blocking writers?", "a": "Every statement takes a new snapshot, so the queries see different points in time. Run the transaction at Repeatable Read, or `SERIALIZABLE READ ONLY DEFERRABLE`: one snapshot for all 40 queries, and MVCC readers never block writers. Run it on a replica if it's long, because a long snapshot holds back VACUUM on the primary."}, {"q": "Why can Serializable in Postgres abort a transaction that wrote no row anyone else wrote?", "a": "SSI aborts on read-write dependency cycles, not only write-write conflicts. If T1 read data that T2 then changed, and T2 read data that T1 changed, no serial order explains both results, so one is aborted. Reads are tracked with predicate locks, which never block, which is why Serializable rarely waits but can still fail."}], "part": "B"}, {"id": "locking", "name": "Locking & Concurrency", "signal": ["“deadlock detected” in the logs", "a job queue or work distribution in Postgres", "a migration that took the site down", "a user edits a record for minutes", "only one worker / cron may run this"], "idea": "Readers and writers don't block each other (MVCC), but writers block writers on the same row, and DDL blocks everyone on the table. Row locks live in the row itself and are released at commit. Deadlocks come from locking in different orders; outages come from lock queues, where one waiting ALTER TABLE makes every later query wait behind it. Keep lock-holding transactions short and ordered, and give DDL a timeout.", "diagram": {"type": "timeline", "caption": "time flows down; T1, T2, T3 are separate sessions", "sessions": ["T1", "T2"], "frames": [{"title": "Deadlock", "steps": [{"t": "T1", "sql": "BEGIN;"}, {"t": "T2", "sql": "BEGIN;"}, {"t": "T1", "sql": "UPDATE accounts SET balance = balance - 10 WHERE id = 1;", "out": "locks row 1"}, {"t": "T2", "sql": "UPDATE accounts SET balance = balance - 20 WHERE id = 2;", "out": "locks row 2"}, {"t": "T1", "sql": "UPDATE accounts SET balance = balance + 10 WHERE id = 2;", "out": "waits for T2", "mark": "wait"}, {"t": "T2", "sql": "UPDATE accounts SET balance = balance + 20 WHERE id = 1;", "out": "waits for T1: a cycle", "mark": "wait"}, {"t": "T2", "sql": "(after deadlock_timeout, 1 s)", "out": "ERROR 40P01: deadlock detected; T2 is rolled back", "mark": "error"}, {"t": "T1", "sql": "(update proceeds)", "out": "UPDATE 1, then COMMIT", "mark": "ok"}], "note": "Transfer A→B and transfer B→A lock the same two rows in opposite orders. Fix: always lock in a consistent order (lowest id first, or `SELECT … WHERE id IN (1, 2) ORDER BY id FOR UPDATE` up front), and retry 40P01."}, {"title": "Queue with SKIP LOCKED", "steps": [{"t": "T1", "sql": "BEGIN;"}, {"t": "T2", "sql": "BEGIN;"}, {"t": "T1", "sql": "SELECT id FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED;", "out": "1", "mark": "sees"}, {"t": "T2", "sql": "SELECT id FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED;", "out": "2: skips the locked job 1, no waiting", "mark": "sees"}, {"t": "T1", "sql": "UPDATE jobs SET status = 'done' WHERE id = 1; COMMIT;", "mark": "ok"}, {"t": "T2", "sql": "UPDATE jobs SET status = 'done' WHERE id = 2; COMMIT;", "mark": "ok"}], "note": "Plain `FOR UPDATE` would make T2 wait for job 1, so 20 workers would process one job at a time. SKIP LOCKED gives each worker a different row. NOWAIT instead errors (55P03) when the row is locked."}, {"title": "DDL lock queue", "sessions": ["T1", "T2", "T3"], "steps": [{"t": "T1", "sql": "BEGIN; SELECT count(*) FROM orders JOIN order_items …;", "out": "a 10-minute report holds ACCESS SHARE"}, {"t": "T2", "sql": "ALTER TABLE orders ADD COLUMN note text;", "out": "needs ACCESS EXCLUSIVE: waits for T1", "mark": "wait"}, {"t": "T3", "sql": "SELECT * FROM orders WHERE id = 5;", "out": "queues behind T2's request", "mark": "bad"}, {"t": "T3", "sql": "(every new query on orders)", "out": "also queues: the site is down", "mark": "bad"}, {"t": "T1", "sql": "COMMIT;"}, {"t": "T2", "sql": "(ALTER runs, instantly)", "mark": "ok"}], "note": "Adding a nullable column is instant, but it first has to **get** the lock. While it waits, every new request on the table queues behind it, even plain SELECTs. A metadata-only migration turns into an outage."}, {"title": "Fix · lock_timeout", "sessions": ["T1", "T2", "T3"], "steps": [{"t": "T1", "sql": "BEGIN; SELECT count(*) FROM orders JOIN order_items …;", "out": "long report"}, {"t": "T2", "sql": "SET lock_timeout = '2s'; ALTER TABLE orders ADD COLUMN note text;", "out": "waits for T1…", "mark": "wait"}, {"t": "T3", "sql": "SELECT * FROM orders WHERE id = 5;", "out": "queued, at most 2 s", "mark": "wait"}, {"t": "T2", "sql": "(after 2 s)", "out": "ERROR 55P03: canceling statement due to lock timeout", "mark": "error"}, {"t": "T3", "sql": "(proceeds)", "out": "1 row", "mark": "ok"}, {"t": "T2", "sql": "(retry in a few seconds)", "out": "ALTER TABLE", "mark": "ok"}], "note": "Cap how long DDL may wait and retry in a loop. Also cap `statement_timeout` for reports, and run them on a replica."}]}, "tables": [{"title": "Row lock modes", "cols": ["Mode", "Taken by", "Conflicts with"], "rows": [["`FOR KEY SHARE`", "Foreign key checks (inserting a child row)", "`FOR UPDATE` only (deleting the parent or changing its key)"], ["`FOR SHARE`", "Explicit: “don't change this row until I commit”", "`FOR NO KEY UPDATE`, `FOR UPDATE`"], ["`FOR NO KEY UPDATE`", "Plain UPDATE of non-key columns", "`FOR SHARE`, `FOR NO KEY UPDATE`, `FOR UPDATE`"], ["`FOR UPDATE`", "DELETE, key updates, `SELECT … FOR UPDATE`", "Every row lock mode"]]}, {"title": "Table locks taken by common commands", "cols": ["Command", "Lock", "Blocks"], "rows": [["SELECT", "ACCESS SHARE", "Only ACCESS EXCLUSIVE"], ["INSERT, UPDATE, DELETE", "ROW EXCLUSIVE", "SHARE and stronger (e.g. plain CREATE INDEX)"], ["VACUUM, ANALYZE, CREATE INDEX CONCURRENTLY, VALIDATE CONSTRAINT", "SHARE UPDATE EXCLUSIVE", "Other schema changes and vacuums, not reads or writes"], ["CREATE INDEX", "SHARE", "All writes"], ["Most ALTER TABLE, DROP, TRUNCATE, VACUUM FULL, CLUSTER", "ACCESS EXCLUSIVE", "Everything, including SELECT"]]}], "snippets": [{"task": "Lock or fail fast", "sql": "SELECT id FROM orders WHERE id = 13 FOR UPDATE NOWAIT;", "out": {"cols": ["id"], "rows": [[13]]}, "note": "If another transaction holds the row, this fails at once with 55P03 instead of waiting: good for “someone else is editing this”."}, {"task": "An application-level mutex (advisory lock)", "sql": "SELECT pg_try_advisory_xact_lock(42) AS got_it;", "out": {"cols": ["got_it"], "rows": [[true]]}, "note": "Locks an arbitrary number, released at commit. Use it to make a cron job run on one node only. Session-level `pg_advisory_lock` survives commits, which leaks across clients behind a transaction-mode pooler."}, {"task": "Give DDL a timeout", "sql": "SET LOCAL lock_timeout = '2s';\nALTER TABLE orders ADD COLUMN note text;\n"}, {"task": "Who is blocking whom", "sql": "SELECT pid, pg_blocking_pids(pid) AS blocked_by, state,\n       now() - xact_start AS xact_age, left(query, 60) AS query\nFROM pg_stat_activity\nWHERE cardinality(pg_blocking_pids(pid)) > 0;\n", "note": "Then `pg_cancel_backend(pid)` stops a query and `pg_terminate_backend(pid)` ends the session."}], "pitfalls": ["**Locking rows in different orders.** Two transactions updating the same rows in opposite orders deadlock. Sort first: `SELECT … WHERE id = ANY($ids) ORDER BY id FOR UPDATE`, then update.", "**Holding locks across slow work.** A transaction that locks a row and then calls a payment API holds the lock for seconds, and everyone queues. Lock, write, commit; do remote calls outside the transaction.", "**DDL without `lock_timeout`** on busy tables (see the timeline): an instant change can still cause an outage while it waits.", "**`FOR UPDATE` when `FOR NO KEY UPDATE` is enough.** FOR UPDATE also blocks inserts of child rows that reference the locked row (their FK check needs KEY SHARE).", "**Session advisory locks behind PgBouncer in transaction mode.** The lock stays on a server connection that other clients reuse. Use the `_xact_` variants.", "**Plain FOR UPDATE for work queues.** Workers wait on the same first row and run one at a time. SKIP LOCKED."], "depth": ["**Row locks are stored in the tuple header** (`xmax` plus info bits), not in a lock table, so locking a million rows costs no memory but dirties every page touched. Shared row locks held by several transactions use MultiXact ids, which have their own wraparound to watch on hot parent rows.", "**Queues in Postgres** work well up to thousands of jobs per second: claim with `UPDATE … WHERE id = (SELECT … FOR UPDATE SKIP LOCKED LIMIT 1) RETURNING`, commit, then process. Track a lease (`locked_until`) so crashed workers' jobs are retried. High churn makes the table bloat: keep it small, vacuum aggressively, or partition it.", "**Deadlock detection is lazy.** After `deadlock_timeout` (1 s) a waiting backend checks for a cycle and aborts one transaction with 40P01. Most deadlocks are a lock-ordering bug; the retry is the safety net.", "**Optimistic vs pessimistic.** `FOR UPDATE` suits short critical sections inside one request. For edits spanning user think time, use a version column (`UPDATE … WHERE id = $1 AND version = $2`; zero rows means someone else saved first), or compare `xmin`.", "**Lock queues are FIFO by conflict.** A queued ACCESS EXCLUSIVE request blocks later weaker requests that conflict with it, even if they don't conflict with the current holder. That's why the waiting ALTER, not the long SELECT, takes the site down.", "**Hot rows serialize writers.** One inventory row for a flash-sale item or one global counter turns every write into a queue. Split it (N counter rows summed on read), batch updates, or move the hot path to a queue."], "mysql": ["InnoDB takes gap and next-key locks under Repeatable Read: `SELECT … FOR UPDATE` on a missing key locks the gap, so two sessions doing “check, then insert” for the same new key deadlock.", "`SKIP LOCKED` and `NOWAIT` exist since 8.0.", "DDL waits on metadata locks (MDL) with the same queueing problem, and `lock_wait_timeout` defaults to one year. Set it to a few seconds for migrations.", "Advisory locks: `GET_LOCK('name', timeout)` / `RELEASE_LOCK('name')`, held per session."], "checks": [{"q": "Two money transfers occasionally fail with 40P01. Why, and how do you stop it?", "a": "Transfer A→B locks A then B; a concurrent B→A locks B then A: a cycle. Lock both accounts in a fixed order (by id) at the start of the transaction, e.g. `SELECT … WHERE id IN ($a, $b) ORDER BY id FOR UPDATE`, then update. Keep a retry on 40P01 anyway."}, {"q": "A migration that only added a nullable column caused a three-minute outage. What happened?", "a": "The ALTER needed ACCESS EXCLUSIVE and queued behind a long-running query (or an idle-in-transaction session). Every query that arrived after it queued behind the ALTER. Use `SET lock_timeout = '2s'` with retries for DDL, and `statement_timeout` / `idle_in_transaction_session_timeout` for the rest."}, {"q": "Twenty workers poll a jobs table with `SELECT … ORDER BY id LIMIT 1 FOR UPDATE`, yet throughput equals one worker. Why, and the fix?", "a": "All of them select the same first row; nineteen wait on its lock. Add `SKIP LOCKED` so each takes the first row nobody holds, and keep the claiming transaction short (claim, commit, then do the work)."}, {"q": "A user edits a product form for ten minutes. How do you avoid overwriting someone else's save without holding a lock that long?", "a": "Optimistic locking: read the row with its `version`; save with `UPDATE … SET …, version = version + 1 WHERE id = $1 AND version = $2`. Zero rows updated means someone saved first: show a conflict and let the user merge (the second problem)."}, {"q": "Inserting order rows sometimes waits on an update to `users`. How can a child insert be blocked by the parent?", "a": "The FK check takes FOR KEY SHARE on the parent user row. That conflicts with FOR UPDATE, taken by a DELETE of the user, an update of its key, or an explicit `SELECT … FOR UPDATE` on it. Ordinary updates of non-key columns take FOR NO KEY UPDATE and don't conflict. Use NO KEY UPDATE for explicit locks."}], "problems": [{"id": "claim-next-job", "title": "Claim the next job", "variant": "canonical", "statement": "`jobs` (see Setup) is a work queue shared by many workers. Write **one statement** that worker `w1` runs to claim the next due job: the queued job with the oldest `run_at` that is due now, set it to `running` with `locked_by = 'w1'`, and return `id`, `status`, `locked_by`. It must be safe with many workers polling at once.", "hint": "Pick the row in a subquery that locks it but doesn't wait for rows other workers already hold.", "setup": "CREATE TABLE jobs (\n  id        bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  status    text NOT NULL DEFAULT 'queued',\n  run_at    timestamptz NOT NULL,\n  locked_by text\n);\nINSERT INTO jobs (status, run_at) VALUES\n  ('done',   '2026-03-01 08:00Z'),\n  ('queued', '2026-03-01 10:00Z'),\n  ('queued', '2026-03-01 09:00Z'),\n  ('queued', '2099-01-01 00:00Z');\n", "solution": "UPDATE jobs\nSET status = 'running', locked_by = 'w1'\nWHERE id = (\n  SELECT id FROM jobs\n  WHERE status = 'queued' AND run_at <= now()\n  ORDER BY run_at\n  FOR UPDATE SKIP LOCKED\n  LIMIT 1\n)\nRETURNING id, status, locked_by;\n", "expect": {"cols": ["id", "status", "locked_by"], "rows": [[3, "running", "w1"]]}, "insight": "Job 3 is due earliest (09:00); job 4 isn't due; job 1 is done. `FOR UPDATE SKIP LOCKED` in the subquery means a concurrent worker skips job 3 and takes job 2 instead of waiting. Without SKIP LOCKED they'd all queue on job 3; with a plain SELECT and no lock, two workers could claim the same job. Commit right after claiming; add a partial index `ON jobs (run_at) WHERE status = 'queued'` so the pick stays cheap as `done` rows pile up.", "mysql": "MySQL can't select from the table being updated in a subquery: `SELECT id … FOR UPDATE SKIP LOCKED` first, then `UPDATE … WHERE id = ?` in the same transaction."}, {"id": "optimistic-save", "title": "Save only if unchanged", "variant": "disguise", "statement": "Products now carry a `version` (see Setup). An editor loaded product 2 at version 1 and wants to set its price to 42.00. Write the save so that it only succeeds if nobody changed the product since, bumps the version, and returns `id`, `price`, `version` (no row means “conflict”).", "hint": "Make “nobody changed it” part of the UPDATE's WHERE clause.", "setup": "ALTER TABLE products ADD COLUMN version int NOT NULL DEFAULT 1;\nUPDATE products SET price = 38.00, version = 2 WHERE id = 4;\n", "solution": "UPDATE products\nSET price = 42.00, version = version + 1\nWHERE id = 2 AND version = 1\nRETURNING id, price, version;\n", "expect": {"cols": ["id", "price", "version"], "rows": [[2, 42.0, 2]]}, "insight": "Optimistic concurrency: no lock is held while the user thinks; the check and the write are one atomic statement. A concurrent save that already bumped the version makes this update match zero rows, which the app reports as a conflict. The same statement shape works through an ORM (`@Version` in JPA, `lock_version` in Rails). Without a version column, compare the system column `xmin` the row had when read.", "mysql": "Same statement; check the affected-rows count instead of RETURNING."}], "part": "B"}, {"id": "mvcc-wal", "name": "MVCC, WAL & VACUUM", "signal": ["a table keeps growing while its row count is flat", "“autovacuum runs constantly” or never finishes", "a forgotten open transaction or replication slot", "transaction ID wraparound warnings", "write spikes, checkpoints, crash recovery, `synchronous_commit`"], "idea": "An UPDATE writes a new row version and marks the old one dead; each transaction picks the versions its snapshot can see, so readers never block writers. The price is cleanup: VACUUM removes dead versions nobody can see any more and freezes old ones, and anything holding an old snapshot stops it. Durability comes from the write-ahead log: a commit is safe once its WAL is flushed, and data pages catch up at checkpoints.", "diagram": {"type": "table", "partition": false, "caption": "one product row through two updates; xids 741 < 790 < 802 < 815", "cols": ["ctid", "xmin", "price"], "rows": [["(0,1)", "741", "120.00"], ["(0,9)", "802", "108.00"], ["(0,10)", "815", "97.20"]], "frames": [{"title": "INSERT", "expr": "INSERT INTO products … VALUES ('Mechanical keyboard', …, 120.00);  -- xid 741", "col": "state", "cur": 0, "out": ["xmax 0 · live", "—", "—"], "note": "Every row version carries `xmin`, the transaction that created it, and `xmax`, the one that deleted or replaced it (0 = nobody). `ctid` is its physical address: (page, slot)."}, {"title": "UPDATE", "expr": "UPDATE products SET price = 108.00 WHERE id = 1;  -- xid 802", "col": "state", "cur": 1, "win": [0], "out": ["xmax 802 · dead once 802 commits", "xmax 0 · live", "—"], "note": "The update doesn't overwrite: it writes a new version and stamps the old one's `xmax`. No indexed column changed and page 0 had room, so it's a **HOT** update: indexes still point at (0,1), which links to (0,9)."}, {"title": "An old snapshot", "expr": "-- xid 790 began before 802 committed:  SELECT price FROM products WHERE id = 1;  → 120.00", "col": "state", "cur": 0, "out": ["visible to 790", "invisible to 790 (802 wasn't committed in its snapshot)", "—"], "note": "Transaction 790 still sees the old price, without locks, because 802 wasn't committed when 790's snapshot was taken. That's MVCC, and it's also why (0,1) can't be removed while 790 is open."}, {"title": "Second UPDATE", "expr": "UPDATE products SET price = 97.20 WHERE id = 1;  -- xid 815", "col": "state", "cur": 2, "win": [0, 1], "out": ["dead", "dead (xmax 815)", "live"], "note": "Each update leaves another dead version behind. A row updated a thousand times between vacuums takes a thousand slots."}, {"title": "VACUUM", "expr": "VACUUM products;  -- after 790 has ended", "col": "state", "win": [2], "out": ["removed: slot reusable", "removed: slot reusable", "live"], "note": "VACUUM removes versions older than every running snapshot (the xmin horizon), marks the space reusable, and updates the visibility map. It doesn't shrink the file; VACUUM FULL and pg_repack do, by rewriting it."}]}, "numbers": [{"k": "Row version header", "v": "~23 B + alignment"}, {"k": "Autovacuum trigger", "v": "50 rows + 20% of the table dead (scale_factor 0.2)"}, {"k": "XID space", "v": "2³² ids; wraparound protection at ~2.1B in use"}, {"k": "autovacuum_freeze_max_age", "v": "200M transactions"}, {"k": "WAL", "v": "16 MB segments · checkpoint every 5 min or 1 GB of WAL by default"}], "tables": [{"title": "What stops VACUUM from removing dead rows (the xmin horizon)", "cols": ["Holder", "Find it", "Fix"], "rows": [["Long or idle-in-transaction session", "`pg_stat_activity`: old `xact_start`, `state = 'idle in transaction'`", "`idle_in_transaction_session_timeout`, `statement_timeout`; terminate it"], ["Replication slot nobody consumes (dead replica, stalled CDC)", "`pg_replication_slots`: `active = false`, old `xmin` / `restart_lsn`", "Drop the slot; cap it with `max_slot_wal_keep_size`"], ["Long queries on a standby with `hot_standby_feedback = on`", "`pg_stat_replication.backend_xmin`", "Shorter queries on the replica, or accept query cancellations instead"], ["Forgotten prepared transactions (2PC)", "`pg_prepared_xacts`", "`COMMIT PREPARED` / `ROLLBACK PREPARED`"]]}, {"title": "Cleanup tools", "cols": ["Tool", "Lock", "Does"], "rows": [["autovacuum / `VACUUM`", "SHARE UPDATE EXCLUSIVE (reads and writes continue)", "Removes dead versions, freezes, updates the visibility map; space reused, file not shrunk"], ["`VACUUM FULL`", "ACCESS EXCLUSIVE for the whole rewrite", "Rewrites the table compactly; an outage on big tables"], ["`pg_repack` (extension)", "Brief exclusive locks at start and end", "Online rewrite to remove bloat"], ["`REINDEX CONCURRENTLY`", "Doesn't block writes (PG 12+)", "Rebuilds bloated indexes"]]}], "snippets": [{"task": "See versions inside a page", "sql": "CREATE EXTENSION IF NOT EXISTS pageinspect;\nCREATE TABLE t (id int PRIMARY KEY, v int);\nINSERT INTO t VALUES (1, 10), (2, 20);\nUPDATE t SET v = 11 WHERE id = 1;\nSELECT lp, t_ctid,\n       t_xmax <> 0 AS has_xmax,\n       (t_infomask2 & 16384) <> 0 AS hot_updated,\n       (t_infomask2 & 32768) <> 0 AS heap_only\nFROM heap_page_items(get_raw_page('t', 0));\n", "out": {"cols": ["lp", "t_ctid", "has_xmax", "hot_updated", "heap_only"], "rows": [[1, "(0,3)", true, true, false], [2, "(0,2)", false, false, false], [3, "(0,3)", false, false, true]]}, "note": "Slot 1 is the old version of id 1: its `xmax` is set and its `t_ctid` points to the new version in slot 3. The new version is heap-only (no index entry), because `v` isn't indexed: a HOT update. `pageinspect` needs superuser."}, {"task": "Dead rows and the last vacuum per table", "sql": "SELECT relname, n_live_tup, n_dead_tup, last_autovacuum, last_autoanalyze\nFROM pg_stat_user_tables\nORDER BY n_dead_tup DESC\nLIMIT 10;\n"}, {"task": "Sessions holding back cleanup", "sql": "SELECT pid, state, now() - xact_start AS xact_age, backend_xmin, left(query, 60) AS query\nFROM pg_stat_activity\nWHERE backend_xmin IS NOT NULL\nORDER BY age(backend_xmin) DESC;\n"}, {"task": "How close to wraparound", "sql": "SELECT datname, age(datfrozenxid) AS xid_age\nFROM pg_database\nORDER BY xid_age DESC;\n", "note": "Alert well before 1 billion. Autovacuum forces anti-wraparound vacuums from 200M (`autovacuum_freeze_max_age`)."}, {"task": "Vacuum one table now", "tx": false, "sql": "VACUUM (VERBOSE, ANALYZE) products;"}, {"task": "Vacuum a hot table more eagerly", "sql": "ALTER TABLE orders SET (autovacuum_vacuum_scale_factor = 0.01,\n                        autovacuum_vacuum_cost_limit = 2000);\n", "note": "The 20% default means a 1B-row table accumulates 200M dead rows before a vacuum starts. Per-table settings for big, busy tables are normal."}], "pitfalls": ["**Long transactions anywhere.** One session left open for hours (a debugging psql, a stuck job, `idle in transaction`) stops VACUUM in the whole database, so every busy table bloats. Set `idle_in_transaction_session_timeout` and alert on old `xact_start`.", "**Default autovacuum on big tables.** A 20% threshold is far too lazy for a billion-row table, and the default cost limit throttles vacuum on fast disks. Tune per table.", "**Turning autovacuum off** to “save I/O”. Dead rows and unfrozen XIDs pile up until an emergency anti-wraparound vacuum runs anyway, at the worst time.", "**VACUUM FULL in production** takes ACCESS EXCLUSIVE for the whole rewrite. Use pg_repack, or partition so old data can be dropped.", "**Abandoned replication slots** keep WAL (disk fills) and hold back the xmin horizon (bloat). Monitor `pg_replication_slots`.", "**Mass UPDATEs that touch every row** double the table: each update writes a new version. Batch them with vacuums in between, or rebuild into a new table."], "depth": ["**Visibility:** a snapshot records which transactions were running when it was taken. A version is visible if its `xmin` committed before the snapshot and its `xmax` didn't. Commit status lives in the commit log (pg_xact); the first reader sets hint bits on the tuple, which is why the first SELECT after a bulk load writes to disk.", "**HOT updates and fillfactor:** if no indexed column changes and the page has room, the new version stays on the same page with no index writes, and old versions are pruned on the fly. `fillfactor = 80–90` leaves room on update-heavy tables; check `n_tup_hot_upd` vs `n_tup_upd`.", "**Freezing and wraparound:** XIDs are 32-bit and compared modulo 2³², so old rows must be marked frozen (visible to everyone) before they look like they're from the future. Anti-wraparound vacuums can't be cancelled; if freezing falls ~2B behind, Postgres stops assigning XIDs until you vacuum. PG 14+ has a failsafe that skips index cleanup to finish faster. MultiXacts wrap too.", "**WAL and checkpoints:** a commit writes and flushes its WAL records (group commit batches fsyncs); data pages are written later. A checkpoint flushes all dirty pages so recovery can start from it. The first change to each page after a checkpoint logs the full 8 KB page (`full_page_writes`, protecting against torn pages), so WAL volume spikes right after checkpoints. Size `max_wal_size` so checkpoints are timed, not forced.", "**`synchronous_commit = off`** returns before the WAL flush: a crash can lose the last few hundred milliseconds of acknowledged commits, but never corrupts data. It can be set per transaction for low-value writes (analytics events) while payments stay synchronous.", "**One log, many uses:** crash recovery replays WAL; streaming replicas apply it; PITR restores a base backup and replays archived WAL to any moment; logical decoding turns it into change events (CDC)."], "mysql": ["InnoDB updates rows in place and keeps old versions in undo logs; a purge thread removes them. A long transaction grows the “history list length”: the same disease as Postgres bloat, in a different place.", "Redo log plus a doublewrite buffer play the roles of WAL and full_page_writes. The binlog (for replication) is a second log, kept consistent with redo via an internal two-phase commit.", "No VACUUM and no XID wraparound. `OPTIMIZE TABLE` rebuilds a table to reclaim space."], "checks": [{"q": "A table holds 5M live rows but takes 60 GB and keeps growing. How do you find the cause and fix it?", "a": "Bloat: dead versions aren't being reclaimed. Check `n_dead_tup` and `last_autovacuum` in `pg_stat_user_tables`, then the xmin horizon: old transactions in `pg_stat_activity`, inactive replication slots, prepared transactions, standby feedback. Remove the blocker, tune autovacuum for the table, and reclaim the space already lost with pg_repack (VACUUM alone won't shrink the file)."}, {"q": "Why does one idle connection that ran BEGIN hours ago hurt the whole database?", "a": "Its snapshot might still need any row version created since it started, so VACUUM can't remove dead versions newer than its xmin, in every table. Busy tables bloat, index-only scans stop being index-only, and query plans degrade. If it also holds locks, DDL queues behind it."}, {"q": "The logs warn “database must be vacuumed within 10,000,000 transactions”. What is it and what do you do?", "a": "XID wraparound protection: rows haven't been frozen and the cluster is close to the point where Postgres stops accepting writes. Find what blocked freezing (long transactions, old slots, prepared transactions, autovacuum constantly cancelled or throttled), remove it, and run `VACUUM (FREEZE, VERBOSE)` on the oldest tables by `age(relfrozenxid)`. Don't keep restarting: it doesn't help."}, {"q": "After adding an index on a frequently updated column, the table started bloating. Why?", "a": "Updates to that column can no longer be HOT: every update now needs new index entries and can't be pruned within the page. Dead versions and index entries accumulate until VACUUM. Drop the index if you can, or move the hot column to a narrow side table."}, {"q": "What exactly can you lose with `synchronous_commit = off`?", "a": "Commits acknowledged in roughly the last 3 × `wal_writer_delay` (about 600 ms by default) before a crash of the server. They roll back as if never committed. There's no corruption and no partial transaction. It's a per-transaction choice, so keep it on for money."}], "part": "B"}, {"id": "scaling", "name": "Running Postgres at Scale", "signal": ["“too many connections” / connection storms", "read traffic outgrowing one server", "tables in the billions of rows; data retention", "schema changes on a live, busy table", "“how would you shard this?”, failover, backups"], "idea": "Scale Postgres in order of cost: fix queries and indexes, pool connections, scale up, add read replicas, partition big tables, and only then shard. Every step adds a failure mode: poolers break session state, replicas lag, partitions want the key in every query, and shards push cross-shard joins and transactions onto the application. Changes to live tables go through lock timeouts and expand-contract migrations.", "numbers": [{"k": "Per connection", "v": "one backend process, ~5–10 MB+"}, {"k": "Useful active connections", "v": "~2–4 × CPU cores"}, {"k": "Replica lag", "v": "ms normally; minutes under heavy writes or long replays"}, {"k": "Partitions", "v": "hundreds fine; thousands cost planning time"}, {"k": "Major upgrade", "v": "pg_upgrade --link: minutes of downtime"}], "tables": [{"title": "The scaling ladder", "cols": ["Step", "Buys", "Costs"], "rows": [["Query and index tuning", "Often 10–100×", "Engineering time; the cheapest step"], ["Connection pooling (PgBouncer)", "Thousands of clients on a few hundred backends", "Session state limits in transaction mode"], ["Vertical scaling", "2–10× (CPU, RAM, faster disks)", "Price, and a ceiling"], ["Read replicas", "Read throughput; isolation for reports", "Stale reads (lag); routing; failover complexity"], ["Partitioning", "Manageable huge tables; instant retention (drop a partition); pruning", "Partition key in queries; unique keys must include it"], ["Sharding (Citus, app-level)", "Write throughput and storage beyond one node", "Cross-shard joins and transactions, resharding, operations"]]}, {"title": "PgBouncer pool modes", "cols": ["Mode", "Server connection held for", "Breaks"], "rows": [["session", "The client's whole session", "Nothing, but little multiplexing"], ["transaction", "One transaction", "Session `SET`, session advisory locks, `LISTEN`, temp tables and `WITH HOLD` cursors across transactions; named prepared statements unless PgBouncer 1.21+ with `max_prepared_statements`"], ["statement", "One statement", "Multi-statement transactions"]]}, {"title": "Zero-downtime schema changes", "cols": ["Change", "Risky way", "Safe way"], "rows": [["Add a column", "With a volatile default (rewrite)", "Nullable or constant default (instant), then backfill in batches"], ["Add an index", "`CREATE INDEX` (blocks writes)", "`CREATE INDEX CONCURRENTLY`"], ["Add NOT NULL / FK / CHECK", "Directly (scan under exclusive lock)", "`NOT VALID`, then `VALIDATE` (see Constraints)"], ["Rename a column", "`RENAME` while old code still runs", "Expand-contract: add new, dual-write, backfill, switch reads, drop old"], ["Change a column type", "`ALTER … TYPE` (rewrite under ACCESS EXCLUSIVE)", "New column + backfill + switch; `varchar(n)` → `text` is instant"], ["Drop a column", "Before the code stops using it", "Deploy code that ignores it, then drop"], ["Any DDL", "No timeout", "`SET lock_timeout = '2s'` and retry (see Locking)"]]}], "snippets": [{"task": "Partition by time", "sql": "CREATE TABLE events_p (LIKE events) PARTITION BY RANGE (at);\nCREATE TABLE events_2026_03 PARTITION OF events_p\n  FOR VALUES FROM ('2026-03-01') TO ('2026-04-01');\nCREATE TABLE events_2026_04 PARTITION OF events_p\n  FOR VALUES FROM ('2026-04-01') TO ('2026-05-01');\nINSERT INTO events_p SELECT * FROM events;\nSELECT tableoid::regclass AS partition, count(*)\nFROM events_p GROUP BY 1 ORDER BY 1;\n", "out": {"cols": ["partition", "count"], "rows": [["events_2026_03", 22], ["events_2026_04", 2]]}, "note": "Rows route to their partition automatically. Queries filtering on `at` scan only matching partitions (pruning); queries that don't, scan all of them."}, {"task": "Retention by dropping a partition", "tx": false, "since": "PG 14", "sql": "CREATE TABLE logs (at timestamptz NOT NULL, msg text) PARTITION BY RANGE (at);\nCREATE TABLE logs_2026_03 PARTITION OF logs FOR VALUES FROM ('2026-03-01') TO ('2026-04-01');\nALTER TABLE logs DETACH PARTITION logs_2026_03 CONCURRENTLY;\nDROP TABLE logs_2026_03;\n", "note": "Deleting a month of rows means hours of DELETE, WAL and vacuum; detaching and dropping a partition takes milliseconds. `pg_partman` creates future partitions and retires old ones."}, {"task": "Expand-contract rename, step 1", "sql": "ALTER TABLE users ADD COLUMN full_name text;\nUPDATE users SET full_name = name WHERE full_name IS NULL;  -- batch this on big tables\n", "note": "Then: deploy code that writes both columns, backfill the rest, switch reads to `full_name`, stop writing `name`, and finally drop it, each step its own deploy."}, {"task": "Replica lag", "sql": "SELECT now() - pg_last_xact_replay_timestamp() AS replica_lag;", "out": {"cols": ["replica_lag"], "rows": [[null]]}, "note": "Run on a standby; on a primary it's NULL, as here. On the primary, `pg_stat_replication` shows `write_lag`, `flush_lag` and `replay_lag` per replica."}, {"task": "Base backup and point-in-time recovery (shell)", "shell": true, "sql": "pg_basebackup -D /backups/base -X stream -P      # physical copy of the cluster\n# postgresql.conf: archive_mode = on, archive_command ships each WAL segment\n# restore: copy the base backup, set restore_command and recovery_target_time,\n# create recovery.signal, start: Postgres replays WAL up to that moment\npgbackrest --stanza=main backup                   # what most teams use instead\n"}], "pitfalls": ["**One connection per app thread.** 40 app instances × 50 threads is 2,000 backends, mostly idle, each a process with its own memory. Put PgBouncer (transaction mode) in front and keep server connections near a few × cores.", "**Reading your own write from a replica.** The user saves, the next page reads a lagging replica, and the change is “gone”. Route a session's reads to the primary for a few seconds after it writes, or wait for the replica to replay the write's LSN.", "**Partitioning without the partition key in queries.** Every query then scans every partition, slower than one big table. Unique and primary keys must include the partition key.", "**Sharding too early, or on the wrong key.** Cross-shard queries and transactions become application problems. Shard by the key nearly every query includes (tenant_id), and plan for one tenant outgrowing a shard.", "**Failover without fencing.** Promoting a replica while the old primary still accepts writes is split brain. Use Patroni (or a managed service) with a consensus store, not a script.", "**Backups never restored.** A backup you haven't restored is a hope. Restore regularly and measure how long it takes (that's your RTO)."], "depth": ["**Pooling math.** Throughput is bounded by cores and I/O, not connections: past ~2–4 active connections per core, more just adds contention. Little's law sizes the pool: connections ≈ requests/s × seconds per transaction. Transaction-mode pooling needs `SET LOCAL` (e.g. `SET LOCAL app.tenant_id`) instead of session state.", "**Replication modes.** Streaming replication is asynchronous by default (a failover can lose the last commits). `synchronous_standby_names = 'ANY 1 (r1, r2)'` makes commits wait for one replica: RPO 0 at the cost of commit latency. `synchronous_commit = remote_apply` also makes the write visible on the replica before the commit returns.", "**Standby queries vs replay.** Long queries on a replica conflict with replay of vacuum on the primary: either they're cancelled (`max_standby_streaming_delay`) or, with `hot_standby_feedback = on`, the primary keeps dead rows for them and bloats.", "**Partitioning mechanics.** Pruning happens at plan time and at execution time (for parameters); partition-wise joins and aggregates help when both sides share the key. Create future partitions ahead of time, and index the parent so every partition gets the index.", "**Sharding with Citus:** pick a distribution column (tenant_id); tables distributed on it are co-located, so joins and transactions within a tenant stay on one node; small shared tables become reference tables copied to every node. App-level sharding needs a directory (tenant → shard) and a story for moving tenants.", "**Backups and upgrades.** Continuous WAL archiving + base backups give PITR with RPO near the archive interval; pg_dump is for small databases and migrations, not disaster recovery. Major upgrades: `pg_upgrade --link` (minutes of downtime) or logical replication into the new version and a switchover (seconds)."], "mysql": ["Connections are threads, cheaper than Postgres processes, but pools still matter; ProxySQL pools and routes reads to replicas.", "Replication is binlog-based (row format), with semi-sync for no-loss failover; Group Replication / InnoDB Cluster for HA; Vitess for sharding.", "Partitioned tables: unique keys must include the partition column, and foreign keys aren't supported at all.", "Online schema changes use `ALGORITHM=INSTANT` / `INPLACE` where possible, otherwise gh-ost or pt-online-schema-change."], "checks": [{"q": "40 app instances with pools of 20 connections exhaust `max_connections = 500`, but database CPU is mostly idle. What do you change?", "a": "The connections are idle most of the time; the database doesn't need 800 of them. Put PgBouncer in transaction mode between the app and Postgres, point each instance's pool at it, and give PgBouncer a server pool of a few × cores. Fix any session state the app relies on (`SET` → `SET LOCAL`, session advisory locks, prepared statements on old PgBouncer)."}, {"q": "A user saves a profile change, reloads, and sees the old value. Reads go to replicas. What are your options?", "a": "Read-your-writes: route that user's reads to the primary for a short window after a write (a cookie or session flag); or record the commit's LSN (`pg_current_wal_lsn()`) and read from a replica only once `pg_last_wal_replay_lsn()` has passed it; or use `synchronous_commit = remote_apply` for those writes, accepting slower commits."}, {"q": "`events` has 4 billion rows and must keep 90 days. Nightly deletes take hours and bloat the table. Redesign?", "a": "Partition by day or week on `at` and drop (or detach and archive) whole partitions past 90 days: milliseconds, no dead rows, no vacuum debt. Create partitions ahead with pg_partman, keep the primary key as `(id, at)`, and make sure queries filter on `at` so they prune."}, {"q": "Rename a column used by a live service, with zero downtime. Steps?", "a": "Expand-contract: add the new column; deploy code that writes both; backfill in batches; deploy code that reads the new column; stop writing the old one; drop it. Each step is backward compatible with the previous deploy, so rolling deploys and rollbacks are safe. A view or generated column can bridge readers temporarily."}, {"q": "When would you shard a multi-tenant Postgres, and on what?", "a": "After tuning, pooling, vertical scaling and replicas can't keep up with writes or storage on one node. Shard on `tenant_id`: almost every query is per tenant, so it stays on one shard with local joins and transactions. Keep global data as reference tables, and plan for big tenants: isolate them on their own nodes."}], "problems": [{"id": "monthly-partitions", "title": "A monthly-partitioned audit log", "variant": "canonical", "statement": "Create `audit_log(id bigint, at timestamptz, action text)`, all required, partitioned by month with partitions for March and April 2026, and a primary key. Rows outside those months must be rejected (no default partition).", "hint": "Declare the parent with PARTITION BY, then each partition with FOR VALUES. Try a primary key on `id` alone and read the error.", "solution": "CREATE TABLE audit_log (\n  id     bigint NOT NULL,\n  at     timestamptz NOT NULL,\n  action text NOT NULL,\n  PRIMARY KEY (id, at)\n) PARTITION BY RANGE (at);\nCREATE TABLE audit_log_2026_03\n  PARTITION OF audit_log\n  FOR VALUES FROM ('2026-03-01') TO ('2026-04-01');\nCREATE TABLE audit_log_2026_04\n  PARTITION OF audit_log\n  FOR VALUES FROM ('2026-04-01') TO ('2026-05-01');\n", "tests": [{"sql": "INSERT INTO audit_log VALUES (1, '2026-03-10 12:00Z', 'login')", "ok": true}, {"sql": "INSERT INTO audit_log VALUES (2, '2026-04-30 23:59Z', 'logout')", "ok": true}, {"sql": "INSERT INTO audit_log VALUES (3, '2026-05-01 00:00Z', 'login')", "error": "check_violation", "note": "no partition for May"}, {"sql": "INSERT INTO audit_log VALUES (1, '2026-03-10 12:00Z', 'again')", "error": "unique_violation"}], "check": "SELECT tableoid::regclass AS partition, count(*) FROM audit_log GROUP BY 1 ORDER BY 1", "expect": {"cols": ["partition", "count"], "rows": [["audit_log_2026_03", 1], ["audit_log_2026_04", 1]]}, "insight": "A primary key on `id` alone is rejected: unique indexes are per partition, so uniqueness can only be enforced for keys that include the partition column. If `id` must be globally unique, generate it from a single sequence and accept that the database can't prove it. A row with no matching partition fails with 23514; a `DEFAULT` partition would catch it, but then adding a new partition must scan the default. Upper bounds are exclusive, so midnight on May 1 belongs to May.", "mysql": "`PARTITION BY RANGE (UNIX_TIMESTAMP(at))` with `PARTITION p2026_03 VALUES LESS THAN (…)`; the same rule applies: every unique key must include the partition column."}], "part": "B"}], "pages": {"cheat": {"topics": [{"id": "setup-ddl", "when": "Creating databases, tables, columns, roles", "move": "`bigint` identity keys, `timestamptz`, `numeric` money, `text`; wrap migrations in BEGIN … COMMIT", "gotcha": "Adding NOT NULL to a table with rows: add nullable, backfill, then enforce"}, {"id": "joins", "when": "Combining tables; “never”, “without”, “including zero”", "move": "`NOT EXISTS` for anti-joins; optional-side filters in ON; aggregate children before joining", "gotcha": "`NOT IN` + a NULL returns nothing; two 1:N joins multiply sums"}, {"id": "aggregation", "when": "Counts and totals per group, pivots, subtotals", "move": "Decide the grain first; `count(*) FILTER (WHERE …)` for pivots; `ROLLUP` for totals", "gotcha": "`sum()` of no rows is NULL; `count(col)` skips NULLs"}, {"id": "nulls-types", "when": "Missing values, ratios, money, days and time zones", "move": "`IS DISTINCT FROM`, `coalesce`, `numeric`, half-open time ranges, `AT TIME ZONE 'Zone/Name'`", "gotcha": "`7 / 2 = 3`; `::date` on a timestamptz uses the session zone"}, {"id": "subqueries", "when": "Compare with an aggregate; top-N for each row; named steps", "move": "`LEFT JOIN LATERAL (… ORDER BY … LIMIT n) ON true`; CTEs for readability; `WITH x AS (DELETE … RETURNING *)`", "gotcha": "Scalar subquery returning 2 rows errors; CTEs are inlined since PG 12 unless MATERIALIZED"}, {"id": "windows", "when": "Rank, running total, previous row, share of group, keep every row", "move": "`fn() OVER (PARTITION BY … ORDER BY … ROWS …)`; filter in an outer query", "gotcha": "Default frame with ORDER BY is RANGE (ties share); WHERE runs before windows"}, {"id": "recursive", "when": "Hierarchies, chains, graph walks, unknown depth", "move": "Anchor `UNION ALL` recursive step joined to the previous level; carry depth and path", "gotcha": "No cycle guard = runaway query; add `CYCLE` (PG 14+) or a path / depth check"}, {"id": "patterns", "when": "Top-N per group, latest per key, streaks, sessions, funnels, medians", "move": "`rank() … <= N`; `DISTINCT ON`; `day - row_number()` islands; LAG + running sum for sessions", "gotcha": "`row_number` drops ties; LAG without PARTITION BY mixes users"}, {"id": "writes", "when": "Upserts, counters, syncs, dedup, backfills, purges", "move": "`ON CONFLICT … DO UPDATE SET x = t.x + EXCLUDED.x`; `RETURNING`; `DELETE … USING`; batch big changes", "gotcha": "ON CONFLICT needs an exact unique index; UPDATE … FROM with duplicate sources picks one silently"}, {"id": "schema-design", "when": "Designing tables, keys, tenancy, flexible attributes", "move": "Model from access patterns; `bigint` or UUIDv7 keys; `(tenant_id, id)` keys; JSONB for sparse attributes", "gotcha": "EAV, polymorphic FKs, comma lists; snapshots (price paid) aren't denormalization"}, {"id": "constraints", "when": "Rules that must always hold: uniqueness, references, no overlaps", "move": "NOT NULL, CHECK, UNIQUE, FK, `EXCLUDE USING gist`; `NOT VALID` + `VALIDATE` on live tables", "gotcha": "CHECK can't see other rows; NULLs don't collide in UNIQUE; index FK columns yourself"}, {"id": "indexes", "when": "Slow lookups, ORDER BY … LIMIT, uniqueness rules", "move": "Composite: equality columns, then range / sort column; partial and expression indexes", "gotcha": "Functions or casts on the column skip the index; every index slows writes and kills HOT"}, {"id": "query-planning", "when": "Slow queries, bad plans, deep pagination, picking what to optimize", "move": "`EXPLAIN (ANALYZE, BUFFERS)`; find where estimated ≠ actual rows; `CREATE STATISTICS`; keyset pagination", "gotcha": "Per-loop numbers; generic plans for prepared statements; tuning on a toy database"}, {"id": "isolation", "when": "Read-then-write on money, stock, seats; rules across rows", "move": "Atomic `UPDATE … SET x = x - n WHERE x >= n`; constraints; Serializable + retry on 40001", "gotcha": "Read Committed loses app-computed updates; RR still allows write skew"}, {"id": "locking", "when": "Deadlocks, job queues, migrations on busy tables, long edits", "move": "Lock in a fixed order; `FOR UPDATE SKIP LOCKED`; `lock_timeout` on DDL; version column for long edits", "gotcha": "A waiting ALTER blocks every later query; session advisory locks leak through poolers"}, {"id": "mvcc-wal", "when": "Bloat, vacuum trouble, wraparound warnings, WAL and checkpoints", "move": "Find the xmin horizon (old transactions, slots); tune autovacuum per table; keep HOT updates possible", "gotcha": "One idle-in-transaction session stops cleanup everywhere; VACUUM doesn't shrink files"}, {"id": "scaling", "when": "Connection limits, read scale, huge tables, live migrations, sharding", "move": "PgBouncer (transaction mode); replicas with read-your-writes; time partitions; expand-contract", "gotcha": "Unique keys must include the partition key; failover needs fencing; untested backups"}], "syntax": [{"group": "Setup & DDL", "rows": [{"task": "Fresh database", "sql": "DROP DATABASE IF EXISTS shop WITH (FORCE); CREATE DATABASE shop;", "run": false}, {"task": "Describe a table (psql)", "sql": "\\d+ orders", "run": false}, {"task": "Create a table", "sql": "CREATE TABLE notes (id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY, body text NOT NULL, created_at timestamptz NOT NULL DEFAULT now());"}, {"task": "Add a column", "sql": "ALTER TABLE orders ADD COLUMN note text;"}, {"task": "Drop if present", "sql": "DROP TABLE IF EXISTS notes CASCADE;"}, {"task": "Read-only access", "sql": "CREATE ROLE ro NOLOGIN; GRANT SELECT ON ALL TABLES IN SCHEMA public TO ro;"}]}, {"group": "Querying", "rows": [{"task": "Anti-join", "sql": "SELECT * FROM users u WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id);"}, {"task": "Conditional counts", "sql": "SELECT count(*) FILTER (WHERE status = 'paid') AS paid, count(*) AS total FROM orders;"}, {"task": "Latest row per key", "sql": "SELECT DISTINCT ON (user_id) * FROM events ORDER BY user_id, at DESC;"}, {"task": "Top 1 for each row", "sql": "SELECT u.name, o.id FROM users u LEFT JOIN LATERAL (SELECT id FROM orders WHERE user_id = u.id ORDER BY created_at DESC LIMIT 1) o ON true;"}, {"task": "Rank within groups", "sql": "SELECT name, rank() OVER (PARTITION BY dept ORDER BY salary DESC) FROM employees;"}, {"task": "Previous row", "sql": "SELECT id, lag(created_at) OVER (PARTITION BY user_id ORDER BY created_at) FROM orders;"}, {"task": "Running total", "sql": "SELECT order_id, sum(qty) OVER (ORDER BY order_id, product_id ROWS UNBOUNDED PRECEDING) FROM order_items;"}, {"task": "A row per day", "sql": "SELECT d::date FROM generate_series(timestamptz '2026-03-01', timestamptz '2026-03-07', interval '1 day') AS d;"}, {"task": "Walk a tree", "sql": "WITH RECURSIVE t AS (SELECT id FROM employees WHERE id = 2 UNION ALL SELECT e.id FROM employees e JOIN t ON e.manager_id = t.id) SELECT * FROM t;"}, {"task": "Local day of an instant", "sql": "SELECT (created_at AT TIME ZONE 'Asia/Tokyo')::date FROM orders;"}, {"task": "NULL-safe comparison", "sql": "SELECT * FROM users WHERE country IS DISTINCT FROM 'US';"}]}, {"group": "Writing", "rows": [{"task": "Upsert", "sql": "INSERT INTO users (email, name, created_at) VALUES ('ana@example.com', 'Ana', now()) ON CONFLICT (email) DO UPDATE SET name = EXCLUDED.name RETURNING id;"}, {"task": "Update from a list", "sql": "UPDATE products p SET price = v.price FROM (VALUES (1, 99.00)) AS v(id, price) WHERE p.id = v.id;"}, {"task": "Delete duplicates", "sql": "DELETE FROM events e USING events k WHERE k.user_id = e.user_id AND k.type = e.type AND k.at = e.at AND k.id < e.id;"}, {"task": "Claim work", "sql": "SELECT id FROM orders WHERE status = 'pending' ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED;"}, {"task": "Atomic decrement with a guard", "sql": "UPDATE products SET price = price - 5 WHERE id = 1 AND price >= 5 RETURNING price;"}]}, {"group": "Operations", "rows": [{"task": "Real plan", "sql": "EXPLAIN (ANALYZE, BUFFERS) SELECT * FROM orders WHERE user_id = 1;"}, {"task": "Index without blocking writes", "sql": "CREATE INDEX CONCURRENTLY orders_user_idx ON orders (user_id);", "run": false}, {"task": "DDL with a timeout", "sql": "SET LOCAL lock_timeout = '2s'; ALTER TABLE orders ADD COLUMN note text;"}, {"task": "Add a FK online", "sql": "ALTER TABLE orders ADD CONSTRAINT orders_user_fk FOREIGN KEY (user_id) REFERENCES users (id) NOT VALID; ALTER TABLE orders VALIDATE CONSTRAINT orders_user_fk;"}, {"task": "Who blocks whom", "sql": "SELECT pid, pg_blocking_pids(pid), left(query, 50) FROM pg_stat_activity WHERE cardinality(pg_blocking_pids(pid)) > 0;"}, {"task": "Dead rows per table", "sql": "SELECT relname, n_dead_tup, last_autovacuum FROM pg_stat_user_tables ORDER BY n_dead_tup DESC;"}, {"task": "Wraparound age", "sql": "SELECT datname, age(datfrozenxid) FROM pg_database ORDER BY 2 DESC;"}, {"task": "Serializable transaction", "sql": "BEGIN ISOLATION LEVEL SERIALIZABLE;", "run": false}]}]}, "drill": {"items": [{"prompt": "Find the customers who have never placed an order.", "answer": "joins", "distractors": ["aggregation", "subqueries", "patterns"], "why": "An anti-join: `WHERE NOT EXISTS (…)`. Avoid `NOT IN` when the subquery column can be NULL."}, {"prompt": "Revenue per customer jumped sevenfold after someone joined the events table into the report.", "answer": "joins", "distractors": ["aggregation", "windows", "query-planning"], "why": "Join fan-out: two one-to-many children joined on the same key multiply rows. Aggregate each child before joining."}, {"prompt": "Show each order next to the date of the same customer's previous order.", "answer": "windows", "distractors": ["subqueries", "patterns", "joins"], "why": "`lag(created_at) OVER (PARTITION BY user_id ORDER BY created_at)`: the previous row in the customer's partition."}, {"prompt": "List the top 3 products per category by units sold, keeping ties.", "answer": "patterns", "distractors": ["aggregation", "indexes", "recursive"], "why": "Top-N per group: `rank() OVER (PARTITION BY category ORDER BY units DESC) <= 3`, filtered in an outer query."}, {"prompt": "Everyone in a manager's organization, at any depth.", "answer": "recursive", "distractors": ["joins", "windows", "schema-design"], "why": "Unknown depth means a recursive CTE: anchor on the manager's reports, then repeatedly join the previous level."}, {"prompt": "Daily revenue for March, with days that had no sales shown as 0.", "answer": "nulls-types", "distractors": ["aggregation", "joins", "windows"], "why": "Drive the query from a calendar (`generate_series`) and LEFT JOIN the sales, with `coalesce(sum(…), 0)`."}, {"prompt": "A conversion-rate column comes back as 0 for almost every campaign.", "answer": "nulls-types", "distractors": ["aggregation", "windows", "query-planning"], "why": "Integer division: `conversions / visits` truncates. Cast one side to numeric or multiply by `100.0` first."}, {"prompt": "Record a page view: increment the product's counter, or create it at 1 if missing, in one statement.", "answer": "writes", "distractors": ["locking", "isolation", "constraints"], "why": "`INSERT … ON CONFLICT (product_id) DO UPDATE SET views = t.views + EXCLUDED.views`: an atomic upsert."}, {"prompt": "Two app servers occasionally create two open carts for the same user.", "answer": "indexes", "distractors": ["isolation", "locking", "writes"], "why": "A partial unique index, `ON orders (user_id) WHERE status = 'cart'`, makes the second insert fail no matter the timing."}, {"prompt": "Meeting-room bookings sometimes overlap even though the app checks for conflicts first.", "answer": "constraints", "distractors": ["locking", "indexes", "query-planning"], "why": "Check-then-insert races. An exclusion constraint, `EXCLUDE USING gist (room_id WITH =, during WITH &&)`, rejects the overlap at commit time."}, {"prompt": "Two simultaneous withdrawals leave an account balance that's too high.", "answer": "isolation", "distractors": ["constraints", "writes", "mvcc-wal"], "why": "A lost update from read-modify-write in the app. Use `SET balance = balance - $amt WHERE balance >= $amt`, a row lock, or Repeatable Read with retries."}, {"prompt": "Two money transfers occasionally fail with “deadlock detected”.", "answer": "locking", "distractors": ["isolation", "mvcc-wal", "scaling"], "why": "They lock the same two rows in opposite orders. Lock in a consistent order (by id) and retry 40P01."}, {"prompt": "Twenty queue workers together process jobs no faster than one.", "answer": "locking", "distractors": ["scaling", "indexes", "query-planning"], "why": "They all wait on the same first row's lock. `FOR UPDATE SKIP LOCKED` lets each take a different job."}, {"prompt": "A migration that only added a nullable column caused a three-minute outage.", "answer": "locking", "distractors": ["setup-ddl", "mvcc-wal", "query-planning"], "why": "The ALTER queued for ACCESS EXCLUSIVE behind a long query, and every new query queued behind the ALTER. Set `lock_timeout` and retry."}, {"prompt": "A table holds 5 million rows but takes 60 GB on disk and keeps growing.", "answer": "mvcc-wal", "distractors": ["indexes", "scaling", "schema-design"], "why": "Bloat: dead row versions aren't being vacuumed, usually because an old transaction or replication slot holds back the xmin horizon."}, {"prompt": "The logs warn that the database must be vacuumed within 10 million transactions.", "answer": "mvcc-wal", "distractors": ["scaling", "isolation", "locking"], "why": "XID wraparound protection. Find what blocks freezing (old transactions, slots, prepared transactions) and vacuum the oldest tables."}, {"prompt": "A query takes 20 ms in psql and 3 seconds from the application.", "answer": "query-planning", "distractors": ["indexes", "scaling", "locking"], "why": "Often a generic plan for a prepared statement or a parameter type mismatch. auto_explain shows the plan the app actually got."}, {"prompt": "EXPLAIN ANALYZE shows a node estimated at 40 rows that returned 52,000.", "answer": "query-planning", "distractors": ["indexes", "mvcc-wal", "joins"], "why": "A misestimate, often from correlated columns. Fix the statistics (`CREATE STATISTICS`, ANALYZE) and the join choice fixes itself."}, {"prompt": "`WHERE created_at::date = $1` ignores the index on created_at.", "answer": "indexes", "distractors": ["nulls-types", "mvcc-wal", "writes"], "why": "The cast wraps the column. Rewrite as a half-open range on the raw column, which is sargable."}, {"prompt": "Updates got slower and the table started bloating right after an index on `last_seen_at` was added.", "answer": "indexes", "distractors": ["writes", "scaling", "query-planning"], "why": "Indexing a constantly updated column ends HOT updates: every update now writes every index. Drop it or move the column to a side table."}, {"prompt": "“Too many connections” errors, while database CPU sits mostly idle.", "answer": "scaling", "distractors": ["locking", "mvcc-wal", "query-planning"], "why": "Idle connections exhaust the limit. Put PgBouncer in transaction mode in front and size the server pool to the cores."}, {"prompt": "Users don't see their own profile change when the page reloads right after saving.", "answer": "scaling", "distractors": ["isolation", "mvcc-wal", "locking"], "why": "The reload read a lagging replica. Route a user's reads to the primary briefly after a write, or wait for the replica to pass the write's LSN."}, {"prompt": "Deleting events older than 90 days takes hours every night and bloats the table.", "answer": "scaling", "distractors": ["writes", "mvcc-wal", "indexes"], "why": "Partition by time and drop whole partitions: milliseconds, no dead rows."}, {"prompt": "Product attributes differ by category: shoe size, wattage, screen resolution.", "answer": "schema-design", "distractors": ["constraints", "indexes", "setup-ddl"], "why": "JSONB for the varying attributes (GIN-indexed), with frequently filtered ones promoted to columns. Avoid EAV tables."}, {"prompt": "Add a required, unique SKU to a products table that already has a million rows.", "answer": "setup-ddl", "distractors": ["writes", "schema-design", "recursive"], "why": "Add the column nullable, backfill in batches, then enforce NOT NULL and UNIQUE (online: NOT VALID check, unique index CONCURRENTLY)."}, {"prompt": "Which customers spent more than the average customer?", "answer": "subqueries", "distractors": ["aggregation", "windows", "patterns"], "why": "Per-customer totals in a CTE, compared with `(SELECT avg(spent) FROM spend)`. The average order is a different, smaller number."}, {"prompt": "Count visits per user, where a visit ends after 30 minutes without activity.", "answer": "patterns", "distractors": ["aggregation", "nulls-types", "recursive"], "why": "Sessionization: flag events whose gap from the previous one (LAG) is 30 minutes or more, then sum the flags."}, {"prompt": "Remove the duplicate rows a retrying client inserted, keeping the first copy.", "answer": "writes", "distractors": ["patterns", "constraints", "joins"], "why": "`DELETE … USING` a self-join on the duplicate columns with `keep.id < e.id`, then add a unique constraint so it can't recur."}, {"prompt": "A nightly report runs 40 queries in one transaction, and its totals don't add up.", "answer": "isolation", "distractors": ["mvcc-wal", "query-planning", "aggregation"], "why": "Read Committed takes a new snapshot per statement. Run the report at Repeatable Read (or `SERIALIZABLE READ ONLY DEFERRABLE`)."}, {"prompt": "Page 5,000 of an activity feed is slow while page 1 is instant.", "answer": "query-planning", "distractors": ["indexes", "scaling", "windows"], "why": "OFFSET reads and discards every earlier row. Keyset pagination continues from the last seen `(at, id)`."}]}, "glossary": {"terms": [{"term": "ACCESS EXCLUSIVE lock", "see": "locking", "def": "The table lock most ALTER TABLE, DROP, TRUNCATE and VACUUM FULL take. Conflicts with everything, even SELECT, and queued requests for it block later queries."}, {"term": "Advisory lock", "see": "locking", "def": "A lock on an arbitrary number, meaningful only to your app (`pg_try_advisory_xact_lock`). Use for “only one runner” jobs; the session variant leaks through transaction pooling."}, {"term": "Anti-join", "see": "joins", "def": "Rows of A with no match in B: `NOT EXISTS` or `LEFT JOIN … WHERE b.id IS NULL`. `NOT IN` breaks when B has NULLs."}, {"term": "Autovacuum", "see": "mvcc-wal", "def": "Background workers that vacuum and analyze tables once enough rows change. Defaults (20% dead) are too lazy for big tables; tune per table."}, {"term": "Bitmap heap scan", "see": "query-planning", "def": "Collects matching row locations from one or more indexes into a bitmap, then reads heap pages in physical order. Good for medium selectivity and AND / OR of indexes."}, {"term": "BRIN index", "see": "indexes", "def": "Stores min / max per block range: tiny, and effective only when the column follows physical order (append-only time series)."}, {"term": "Checkpoint", "see": "mvcc-wal", "def": "Flushes all dirty pages so crash recovery can start from that point. The first change to each page afterwards logs a full page image, so WAL spikes after checkpoints."}, {"term": "Composite index", "see": "indexes", "def": "An index on several columns. Serves queries on a leftmost prefix; put equality columns first, then one range or sort column."}, {"term": "Covering index", "see": "indexes", "def": "An index holding every column a query needs (`INCLUDE (…)`), enabling an index-only scan."}, {"term": "CTE", "see": "subqueries", "def": "A named subquery (`WITH x AS (…)`). Inlined since PG 12 unless MATERIALIZED, recursive, or referenced more than once."}, {"term": "ctid", "see": "mvcc-wal", "def": "A row version's physical address, (page, slot). Changes on every update; never use it as an identifier."}, {"term": "Deadlock", "see": "locking", "def": "Two transactions each waiting for a lock the other holds. Postgres detects it after `deadlock_timeout` and aborts one with 40P01."}, {"term": "Deferrable constraint", "see": "constraints", "def": "A UNIQUE, FK or EXCLUDE constraint checked at the end of the statement or at commit instead of per row. Enables swaps and circular references; can't arbitrate ON CONFLICT."}, {"term": "DISTINCT ON", "see": "patterns", "def": "Postgres-only: keep the first row per key according to ORDER BY. The idiomatic “latest row per user”."}, {"term": "EXCLUDED", "see": "writes", "def": "In `ON CONFLICT DO UPDATE`, the row that would have been inserted. The bare table name refers to the existing row."}, {"term": "Exclusion constraint", "see": "constraints", "def": "No two rows may satisfy a set of operator comparisons, such as same room and overlapping time range. A generalized UNIQUE, backed by GiST."}, {"term": "Expand-contract", "see": "scaling", "def": "Changing a schema in backward-compatible steps (add new, dual-write, backfill, switch reads, remove old) so rolling deploys never break."}, {"term": "Extended statistics", "see": "query-planning", "def": "`CREATE STATISTICS` on several columns (dependencies, ndistinct, mcv) so the planner stops assuming correlated columns are independent."}, {"term": "Fan-out", "see": "joins", "def": "Row multiplication when joining one-to-many relations. Inflates counts and sums; aggregate the many side before joining."}, {"term": "FILTER clause", "see": "aggregation", "def": "`count(*) FILTER (WHERE status = 'paid')`: a conditional aggregate, the clean way to pivot values into columns."}, {"term": "Freezing", "see": "mvcc-wal", "def": "Marking old row versions as visible to everyone so their 32-bit transaction ids can be reused. Prevents XID wraparound."}, {"term": "Functional dependency", "see": "aggregation", "def": "When grouping by a table's primary key, Postgres lets you select its other columns without grouping by them."}, {"term": "Gaps and islands", "see": "patterns", "def": "Finding runs of consecutive values: `value - row_number()` is constant within a run, so it works as a GROUP BY key."}, {"term": "Generated column", "see": "schema-design", "def": "A column computed from others (`GENERATED ALWAYS AS (…) STORED`), kept in sync by the database."}, {"term": "Generic plan", "see": "query-planning", "def": "A cached plan for a prepared statement that ignores parameter values. Postgres may switch to it after five executions; bad for skewed data."}, {"term": "GIN index", "see": "indexes", "def": "An inverted index: from each element (array item, JSON key, word, trigram) to the rows containing it. Powers `@>`, full-text and `LIKE '%x%'` with pg_trgm."}, {"term": "GiST index", "see": "indexes", "def": "A balanced tree for overlap, containment and nearest-neighbour queries: ranges, geometry, exclusion constraints."}, {"term": "Hash join", "see": "query-planning", "def": "Builds a hash table on the smaller input and probes it with the larger. Best for big equa
