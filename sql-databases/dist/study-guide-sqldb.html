<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.0">
<title>SQL Databases</title>
<style>
:root {
  /* Ocean: calm deep teal-blue on white (shared with algo-patterns and system-design) */
  --bg: #ffffff; --surface: #ffffff;
  --ink: #14262e; --ink-2: #4a5f68; --ink-3: #74878f;
  --rule: #d6e1e5; --code-bg: #f4f8f9; --code-rule: #d6e1e5;
  --accent: #0b6a87; --accent-tint: #e2f2f6; --hit: #dff3e4;
  --easy: #1a7f37;   --easy-bg: #dafbe1;
  --medium: #9a6700; --medium-bg: #fff8c5;
  --hard: #c0303a;   --hard-bg: #fdecea;
  --t-comment: #6b7d85; --t-keyword: #b4235a; --t-string: #2f6b1f; --t-number: #0b6a87;
  --t-fn: #7a3fb8; --t-builtin: #9a5b13; --t-op: #33454d;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --side-w: 240px;
}
[hidden] { display: none !important; }   /* component display rules must never beat [hidden] */
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--sans); }
code, pre { font-family: var(--mono); }
pre { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, textarea { font-family: var(--sans); }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.brand { font-size: 19px; font-weight: 700; letter-spacing: -.015em; color: var(--accent); text-decoration: none; white-space: nowrap; }
.ver { margin-left: -8px; font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
.tprog { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--ink-2); text-decoration: none; }
.tprog:hover { color: var(--accent); }

/* layout */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
.side { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; padding: 20px 12px 24px 20px; }
.side .grp { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 14px 10px 4px; }
.side .grp:first-child { padding-top: 0; }
.side a { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink-2); border-radius: 6px; padding: 5px 10px; font-weight: 550; font-size: 14px; }
.side a .n { font: 12px var(--mono); color: var(--ink-3); min-width: 22px; }
.side a .dot { margin-left: auto; }
.side .soon { display: flex; gap: 8px; padding: 3px 10px; font-size: 13px; color: var(--ink-3); }
.side .soon .n { font: 12px var(--mono); min-width: 22px; }
.side a:hover { background: var(--code-bg); color: var(--ink); }
.side a.active { background: var(--accent-tint); color: var(--accent); }
.side a.active .n { color: var(--accent); }
main { padding: 32px 44px 96px; min-width: 0; }

/* progress meter + small buttons */
.meter { width: 90px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 7px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--ink-3); }
.btn.danger { color: var(--hard); border-color: color-mix(in srgb, var(--hard) 45%, transparent); }
.btn.danger:hover { background: var(--hard-bg); border-color: var(--hard); }
.link { border: 0; background: none; font: 12.5px var(--sans); color: var(--ink-3); cursor: pointer; padding: 2px 4px; }
.link:hover { color: var(--ink); }

/* pager */
.pager { display: flex; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); }
.pbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface);
  border-radius: 8px; padding: 8px 16px; font: 550 14px var(--sans); text-decoration: none; cursor: pointer; }
.pbtn:hover { background: var(--accent-tint); }
.pbtn.fill { background: var(--accent); color: #fff; }
.pbtn.fill:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.pager .next { margin-left: auto; }

/* home */
.hero h1 { margin: 4px 0 8px; font-size: 32px; letter-spacing: -.025em; color: var(--accent); }
.hero .lead { max-width: 72ch; font-size: 16px; }
.hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 32px 0; }
.hcard { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; }
.hcard ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.hcard ol li { margin: 8px 0; }
.hcard a { color: var(--accent); text-decoration: none; font-weight: 550; }
.hcard p { margin: 8px 0 12px; color: var(--ink-2); font-size: 14px; }
.stats { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 6px; }
.stats b { font-size: 28px; letter-spacing: -.02em; }
.stats span { color: var(--ink-2); font-size: 14px; }
.meter.big { width: 100%; height: 8px; border-radius: 4px; }
.rlist { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.rlist li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
.rlist a { color: var(--accent); text-decoration: none; font-weight: 550; }
.rlist small { color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 12px 0 32px; }
.pcard { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--rule); border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; padding: 11px 14px; }
a.pcard:hover { border-color: var(--accent); }
.pcard .n { font: 12px var(--mono); color: var(--accent); }
.pcard .cnt { margin-left: auto; font: 11.5px var(--mono); color: var(--ink-3); font-weight: 400; }
.pcard.soon { border-style: dashed; color: var(--ink-3); font-weight: 450; }
.pcard.soon .n { color: var(--ink-3); }
.pcard.soon small { margin-left: auto; font-size: 11px; }
.dot { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); transform: translateY(-1px); }
.dot.st-done { background: var(--easy); border-color: var(--easy); }
.dot.st-review { background: var(--medium); border-color: var(--medium); }
.dot.st-part { background: linear-gradient(90deg, var(--easy) 50%, transparent 50%); border-color: var(--easy); }

/* page head + shared section parts */
.sec { padding-bottom: 8px; }
.p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 20px; }
.p-num { font: 600 14px var(--mono); color: var(--accent); }
.p-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.p-head .right { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { display: flex; gap: 6px; }
.st { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-3); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.st:hover { color: var(--ink); }
.st[data-st="done"][aria-pressed="true"] { background: var(--easy-bg); color: var(--easy); border-color: var(--easy); }
.st[data-st="review"][aria-pressed="true"] { background: var(--medium-bg); color: var(--medium); border-color: var(--medium); }
.lbl { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.signal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 28px; }
.signal .lbl { margin-right: 4px; }
.chip { font-size: 13px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); }
.blk { margin-bottom: 36px; }
.blk > p { margin: 10px 0 0; color: var(--ink-2); max-width: 85ch; }
.blk ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); max-width: 95ch; }
.blk li { margin: 9px 0; padding-left: 2px; }
.blk-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
code { font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre code { font-size: inherit; background: none; padding: 0; border-radius: 0; }
b { font-weight: 650; color: var(--ink); }
pre.code { padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 8px; font-size: 13px; line-height: 1.6; overflow-x: auto; white-space: pre; }

/* MySQL notes */
.mysql { border: 1px solid color-mix(in srgb, var(--medium) 35%, var(--rule)); background: linear-gradient(to right, var(--medium-bg), var(--surface) 70%); border-radius: 12px; padding: 16px 22px; }
.mysql .lbl { color: var(--medium); }
.mysql ul { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14.5px; }
.mysql li { margin: 7px 0; }
.mnote { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.mnote .tag { font: 600 10.5px var(--mono); color: var(--medium); background: var(--medium-bg); padding: 1px 6px; border-radius: 4px; margin-right: 6px; letter-spacing: .04em; }

/* concept: diagram beside key numbers */
.concept { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 24px; margin-bottom: 36px; align-items: start; }
.concept.solo { grid-template-columns: minmax(0, 1fr); }
.nums { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.nums dl { margin: 10px 0 0; display: grid; gap: 12px; }
.nums dt { font-size: 12.5px; color: var(--ink-3); }
.nums dd { margin: 0; font: 13px var(--mono); color: var(--ink); }

/* diagrams: frame tabs over one figure */
.fig { margin: 0; border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px; min-width: 0; }
.fr-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.fr-tabs button { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; }
.fr-tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.fr-note { margin: 14px 0 0; font-size: 14px; color: var(--ink-2); }
.fig figcaption { font: 12px var(--mono); color: var(--ink-3); margin-top: 8px; }
.fr-expr { font: 12.5px var(--mono); color: var(--ink); background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 7px; padding: 7px 12px; margin-bottom: 12px; overflow-x: auto; white-space: pre; }
.scrollx { overflow-x: auto; }

/* table diagram: highlighted rows of a small result */
table.dt { border-collapse: collapse; font: 13px var(--mono); min-width: 100%; }
.dt th, .dt td { padding: 6px 14px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
.dt th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.dt th.o, .dt td.o { color: var(--accent); font-weight: 600; border-left: 2px solid var(--accent-tint); }
.dt tr.win td { background: var(--accent-tint); }
.dt tr.cur td { background: var(--hit); font-weight: 600; }
.dt tr.cur td:first-child { box-shadow: inset 3px 0 0 var(--easy); }
.dt tr.split td { border-top: 2px solid var(--ink-3); }
.dt .nul { color: var(--ink-3); font-style: italic; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* timeline diagram: sessions side by side, time flowing down */
table.tl { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13px; table-layout: fixed; }
.tl th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); text-align: left; padding: 4px 12px 8px; border-bottom: 1.5px solid var(--rule); }
.tl th:first-child, .tl td:first-child { width: 34px; color: var(--ink-3); font: 11px var(--mono); text-align: right; padding-right: 8px; }
.tl td { padding: 6px 12px; vertical-align: top; border-bottom: 1px dashed var(--rule); }
.tl td + td + td { border-left: 1px solid var(--rule); }
.tl td + td { border-left: 1px solid var(--rule); }
.tl .sql { font: 12.5px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.tl .out { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-2); }
.tl .out::before { content: "→ "; color: var(--ink-3); }
.tl td.m-sees .out { color: var(--accent); }
.tl td.m-wait { background: var(--medium-bg); } .tl td.m-wait .out { color: var(--medium); font-weight: 600; }
.tl td.m-error { background: var(--hard-bg); } .tl td.m-error .out { color: var(--hard); font-weight: 600; }
.tl td.m-bad { background: var(--hard-bg); } .tl td.m-bad .out { color: var(--hard); font-weight: 650; }
.tl td.m-ok { background: var(--easy-bg); } .tl td.m-ok .out { color: var(--easy); font-weight: 650; }

/* plan diagram: an EXPLAIN tree */
.plan { list-style: none; margin: 0; padding: 0; min-width: 560px; }
.plan li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline;
  padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; margin-top: 8px; }
.plan li::before { content: ""; position: absolute; left: -14px; top: -9px; width: 12px; height: 26px; border-left: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); border-bottom-left-radius: 6px; }
.plan li.d0::before { display: none; }
.plan .op { font: 600 13.5px var(--sans); }
.plan .on { font: 12.5px var(--mono); color: var(--ink-2); margin-left: 6px; }
.plan .det { grid-column: 1 / -1; font: 12px var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
.plan .rows { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.plan .ms { color: var(--accent); font-weight: 600; margin-left: 10px; }
.plan li.bad { border-color: var(--hard); background: var(--hard-bg); }
.plan li.good { border-color: var(--easy); background: var(--easy-bg); }

/* markdown content */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 12px 0; }
.md ul, .md ol { margin: 10px 0; padding-left: 22px; }
.md li { margin: 7px 0; }
.md pre.code { margin: 12px 0; font-size: 12.5px; }
.md .tablewrap { margin: 14px 0; }
.callout { margin: 16px 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; color: var(--ink); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table.ref { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.6; }
.ref th, .ref td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ref tr:last-child td { border-bottom: 0; }
.ref th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--code-bg); white-space: nowrap; }
.ref td { color: var(--ink-2); }
.ref td:first-child { color: var(--ink); font-weight: 550; }
.tables { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; margin-bottom: 36px; }
/* query results: monospace, compact */
table.res { border-collapse: collapse; font: 12.5px var(--mono); min-width: 100%; }
.res th, .res td { padding: 5px 14px; text-align: left; border-bottom: 1px solid var(--rule); white-space: pre; }
.res tr:last-child td { border-bottom: 0; }
.res th { font-weight: 600; color: var(--ink-2); background: var(--code-bg); }
.res td { color: var(--ink); }
.res td.num { text-align: right; }
.res .nul { color: var(--ink-3); font-style: italic; }
.reswrap { overflow-x: auto; border: 1px solid var(--code-rule); border-radius: 8px; width: max-content; max-width: 100%; }

/* snippets: task, then code, result and note stacked */
.snip { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 8px 24px; padding: 20px 0; border-top: 1px solid var(--rule); }
.snip:last-child { border-bottom: 1px solid var(--rule); }
.snip-task { font-size: 14px; font-weight: 600; color: var(--ink); padding-top: 4px; }
.snip-task .tag { display: inline-block; margin-left: 4px; font: 600 10.5px var(--mono); color: var(--ink-3); border: 1px solid var(--rule); padding: 0 5px; border-radius: 4px; vertical-align: 1px; }
.snip-body { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.snip-note { font-size: 13.5px; color: var(--ink-2); }
.cbox { position: relative; }
.cbox .copy { position: absolute; top: 6px; right: 6px; opacity: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
.cbox:hover .copy, .cbox .copy:focus-visible { opacity: 1; }

pre.shell { color: var(--ink); }
pre.shell .ps { color: var(--ink-3); user-select: none; }
pre.shell .cm { color: var(--t-comment); font-style: italic; }
.req { font-size: 13.5px; color: var(--ink-2); }
.req b { color: var(--accent); }

/* cheat sheet */
.cheat-sec { margin-bottom: 40px; }
.cheat-sec > .lbl { display: block; margin-bottom: 12px; }
.ref td.num { font: 12px var(--mono); color: var(--accent); width: 1%; white-space: nowrap; }
.ref td.nm { font-weight: 600; white-space: nowrap; }
.ref td.nm a { color: var(--ink); text-decoration: none; }
.ref td.nm a:hover { color: var(--accent); }
.ref td.sx { font: 12.5px/1.55 var(--mono); color: var(--ink); white-space: pre-wrap; }
.ref td.sx code { background: none; padding: 0; font-size: inherit; }

/* technique drill */
.drill { border: 1px solid var(--rule); border-radius: 12px; padding: 24px 28px; }
.drill-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-3); }
.drill-q { font-size: 17.5px; margin: 0 0 20px; line-height: 1.6; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1px solid var(--rule); background: var(--surface); padding: 12px 14px; border-radius: 9px; cursor: pointer; font-size: 14.5px; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--easy); background: var(--easy-bg); }
.opt.wrong { border-color: var(--hard); background: var(--hard-bg); }
.opt kbd { font: 11px var(--mono); color: var(--ink-3); margin-right: 8px; }
.verdict { margin-top: 18px; padding: 14px 18px; border-radius: 9px; font-size: 14.5px; background: var(--code-bg); }
.verdict b.ok { color: var(--easy); }
.verdict b.no { color: var(--hard); }
.verdict a { color: var(--accent); font-weight: 550; text-decoration: none; }
.drill-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }

/* glossary */
.gl-tools { position: sticky; top: 56px; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 12px 0; margin-bottom: 8px; background: var(--bg); border-bottom: 1px solid var(--rule); }
.gl-tools input { flex: 1; max-width: 420px; font: 14px var(--sans); padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); background: var(--surface); }
.gl-tools input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.gl-tools span { font-size: 13px; color: var(--ink-3); }
.gl-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 6px 24px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.gl-term { font-weight: 650; }
.gl-def { color: var(--ink-2); }
.gl-def .pchip { margin-left: 6px; font-size: 12px; vertical-align: 1px; }
.pchip { display: inline-block; font-size: 13px; font-weight: 550; padding: 1px 9px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); text-decoration: none; white-space: nowrap; }
a.pchip:hover { text-decoration: underline; }
.pchip.soon { background: none; border: 1px dashed var(--rule); color: var(--ink-3); font-weight: 450; }
.gl-empty { color: var(--ink-3); font-style: italic; margin-top: 20px; }

/* quick checks */
.check { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
.q { margin: 0; font-weight: 550; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 16px; }
.reveal { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 14px; font: 550 13px var(--sans); cursor: pointer; }
.unit.open .actions .reveal { background: var(--surface); color: var(--accent); }
.ans-solo { margin-top: 16px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; font-size: 14.5px; }
.kbd { font-size: 12px; color: var(--ink-3); }

/* problems */
.prob { border: 1px solid var(--rule); border-radius: 12px; padding: 22px 24px; margin-bottom: 24px; scroll-margin-top: 80px; }
.prob-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 10px; }
.prob-h h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.prob-h .status { margin-left: auto; }
.variant { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 1px 8px; border-radius: 999px; background: var(--code-bg); color: var(--ink-2); border: 1px solid var(--rule); }
.variant.disguise { background: var(--accent-tint); color: var(--accent); border-color: transparent; }
.stmt { margin-bottom: 14px; max-width: 90ch; }
.disclose { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-bottom: 16px; font-size: 14px; }
.disclose details { min-width: 0; }
.disclose details[open] { flex-basis: 100%; }
.disclose summary { cursor: pointer; color: var(--accent); font-weight: 550; width: max-content; }
.disclose summary small { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.disclose details > :not(summary) { margin-top: 10px; }
.disclose p { color: var(--ink-2); }
.prob .tests { list-style: none; margin: 0; padding: 0; border: 1px solid var(--code-rule); border-radius: 8px; overflow: hidden; }
.prob .tests li { display: grid; margin: 0; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 8px 12px; background: var(--code-bg); align-items: baseline; }
.prob .tests li + li { border-top: 1px solid var(--code-rule); }
.tests .tsql { font: 12.5px var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.tests .texp { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.tests .texp.ok { color: var(--easy); } .tests .texp.err { color: var(--hard); } .tests .texp.idx { color: var(--accent); }
.tests .tnote { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); }
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.prob.open .work { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
.pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--code-rule); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.pane-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--code-rule); min-height: 34px; }
.pane.mine:focus-within { border-color: var(--accent); }
.pane.sol { border-color: var(--accent); }
.pane.sol .pane-h { background: var(--accent-tint); }
.pane.sol .lbl { color: var(--accent); }
.pane .code { flex: 1; border: 0; border-radius: 0; }
.tools { display: flex; gap: 6px; }
.ed { position: relative; flex: 1; display: flex; min-height: 0; }
.ed textarea { flex: 1; width: 100%; min-height: 150px; border: 0; resize: vertical; background: transparent; padding: 14px 16px; font: 13px/1.6 var(--mono);
  tab-size: 2; outline: none; white-space: pre; overflow-x: auto; position: relative; z-index: 1;
  color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--ink); }
.ed textarea::placeholder { -webkit-text-fill-color: var(--ink-3); color: var(--ink-3); }
.ed textarea::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.ed .ed-hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; padding: 14px 16px; font-size: 13px; line-height: 1.6; background: none; border: 0; color: var(--ink); }
.after { margin-top: 16px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; font-size: 14.5px; }
.after p { margin: 0; }
.after .mnote { margin-top: 10px; }

/* dataset page */
.ds-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 0; }
.ds-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.ds-chips a { font: 12.5px var(--mono); padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); text-decoration: none; }
.ds-chips a:hover { border-color: var(--accent); color: var(--accent); }
.dtab { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; scroll-margin-top: 80px; }
.dtab h3 { margin: 0 0 4px; font: 650 17px var(--mono); }
.dtab .cols { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.dtab .col { font: 12px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--code-rule); color: var(--ink); }
.dtab .col i { font-style: normal; color: var(--ink-3); margin-left: 4px; }
.dtab .cons { margin: 0 0 14px; padding-left: 18px; font: 12px var(--mono); color: var(--ink-2); }
.dtab .cons li { margin: 3px 0; }

/* prism tokens */
.token.comment { color: var(--t-comment); font-style: italic; }
.token.keyword { color: var(--t-keyword); }
.token.string { color: var(--t-string); }
.token.number, .token.boolean { color: var(--t-number); }
.token.function { color: var(--t-fn); }
.token.operator, .token.punctuation { color: var(--t-op); }
.token.variable { color: var(--t-builtin); }

/* narrow */
@media (max-width: 960px) {
  .concept { grid-template-columns: minmax(0, 1fr); }
  .prob.open .work { grid-template-columns: minmax(0, 1fr); }
  .snip { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 56px; z-index: 5; display: flex; gap: 4px; max-height: none; overflow-x: auto; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .side a { white-space: nowrap; }
  .side .grp, .side .soon, .side a .dot { display: none; }
  html { scroll-padding-top: 112px; }
  main { padding: 24px 16px 64px; }
  .top { padding: 0 16px; gap: 10px; }
  .brand { font-size: 17px; }
  .tprog .meter { display: none; }
  .hgrid { grid-template-columns: minmax(0, 1fr); }
  .pager .pbtn { padding: 8px 12px; font-size: 13px; }
  .check, .prob, .dtab, .fig { padding: 16px; }
  .p-head .right, .prob-h .status { margin-left: 0; }
  .prob, .dtab { scroll-margin-top: 120px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .gl-row { grid-template-columns: minmax(0, 1fr); }
  .gl-tools { top: 100px; }
  .drill { padding: 18px; }
}
/* print: the cheat sheet alone */
@media print {
  .top, .side, .pager, .p-head .right { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  body.print-cheat main > :not(#cheat) { display: none !important; }
  .ref th, .ref td { padding: 5px 8px; font-size: 10.5px; }
  .tablewrap { overflow: visible; }
}

<script>
const DATA = {"catalog": {"partA": [{"id": "setup-ddl", "name": "Setup & DDL"}, {"id": "joins", "name": "Joins & Set Operations"}, {"id": "aggregation", "name": "Aggregation"}, {"id": "nulls-types", "name": "NULLs, Types & Dates"}, {"id": "subqueries", "name": "Subqueries, CTEs & LATERAL"}, {"id": "windows", "name": "Window Functions"}, {"id": "recursive", "name": "Recursive CTEs"}, {"id": "patterns", "name": "Classic Query Patterns"}, {"id": "writes", "name": "Writing Data"}], "partB": [{"id": "schema-design", "name": "Schema Design"}, {"id": "constraints", "name": "Constraints & Integrity"}, {"id": "indexes", "name": "Indexes"}, {"id": "query-planning", "name": "Query Planning & EXPLAIN"}, {"id": "isolation", "name": "Transactions & Isolation"}, {"id": "locking", "name": "Locking & Concurrency"}, {"id": "mvcc-wal", "name": "MVCC, WAL & VACUUM"}, {"id": "scaling", "name": "Running Postgres at Scale"}]}, "topics": [{"id": "setup-ddl", "name": "Setup & DDL", "signal": ["“set up a database for this service”", "create, alter, or drop tables and columns", "choose column types and defaults", "add a required column to a table that has data", "give a reporting user read-only access"], "idea": "A Postgres server (cluster) holds databases; a database holds schemas; a schema holds tables. You connect to exactly one database at a time, and DDL is transactional, so a whole migration can be wrapped in BEGIN … COMMIT and rolled back if any step fails. The decisions that last are types, keys and constraints: they're cheap to get right at CREATE TABLE and expensive to change on a big, busy table.", "tables": [{"title": "Types to reach for", "cols": ["Need", "Use", "Avoid"], "rows": [["Surrogate key", "`bigint GENERATED ALWAYS AS IDENTITY` (or `uuid`)", "`int` (2.1B ceiling), `serial` (legacy)"], ["Money", "`numeric(12,2)`, or `bigint` cents at high volume", "`float8` / `real` (binary rounding), the `money` type (locale-dependent)"], ["Instants (created_at, events)", "`timestamptz`: stored as UTC, shown in the session zone", "`timestamp` without zone: ambiguous across servers and DST"], ["Calendar day", "`date`", "a timestamp at midnight"], ["Strings", "`text`, plus `CHECK (length(x) <= n)` if a limit matters", "`char(n)`: pads with spaces; `varchar(n)` has no speed benefit"], ["Semi-structured", "`jsonb` (indexable, deduplicated keys)", "`json` (stored as text, reparsed on every read)"], ["Small fixed set of values", "`text` + `CHECK (status IN (…))`, or a lookup table", "ENUM types: values can be added but not removed or reordered easily"]]}, {"title": "serial vs identity", "cols": ["", "serial", "identity (PG 10+)"], "rows": [["**Standard**", "Postgres-only shorthand", "SQL standard"], ["**Explicit ids on insert**", "Allowed silently; the sequence falls behind and later inserts collide", "`ALWAYS` rejects them (428C9); `BY DEFAULT` allows them"], ["**Permissions**", "Sequence needs its own `GRANT USAGE`", "Tied to the column; no separate grant"], ["**Copying the table**", "`CREATE TABLE … (LIKE t)` shares the old sequence", "Copied cleanly with `INCLUDING IDENTITY`"]]}], "snippets": [{"task": "Create, connect, drop (shell)", "shell": true, "sql": "createdb shop                     # same as CREATE DATABASE shop\npsql -d shop                      # connect\npsql -d postgres -f dataset.sql   # run a script file\npsql \"postgresql://app@db.internal:5432/shop?sslmode=require\"\ndropdb --if-exists shop\n"}, {"task": "psql meta-commands", "shell": true, "sql": "\\l              list databases\n\\c practice     connect to another database\n\\dt             list tables\n\\d+ orders      describe one table\n\\dn             list schemas\n\\du             list roles\n\\x auto         expanded display for wide rows\n\\timing on      print each query's time\n\\i file.sql     run a file\n\\e              edit the last query in $EDITOR\n\\q              quit\n"}, {"task": "Create and drop a database", "tx": false, "sql": "CREATE DATABASE shop;\nDROP DATABASE shop;\n", "note": "Neither can run inside a transaction block. You can't drop the database you're connected to, and the drop fails while anyone else is connected: `DROP DATABASE shop WITH (FORCE)` (PG 13+) disconnects them."}, {"task": "Schemas and the search path", "sql": "CREATE SCHEMA billing;\nCREATE TABLE billing.invoices (id bigint PRIMARY KEY, total numeric(12, 2));\nSET search_path TO billing, public;\nSELECT current_schemas(false) AS search_path;\n", "out": {"cols": ["search_path"], "rows": [["{billing,public}"]]}, "note": "Unqualified names resolve through `search_path`, left to right. Schemas namespace modules or tenants within one database; queries can join across them, unlike across databases."}, {"task": "Create a table with keys, defaults and checks", "sql": "CREATE TABLE coupons (\n  id         bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  code       text NOT NULL UNIQUE,\n  percent    smallint NOT NULL CHECK (percent BETWEEN 1 AND 100),\n  expires_at timestamptz,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\nINSERT INTO coupons (code, percent) VALUES ('SPRING10', 10)\nRETURNING id, code, percent;\n", "out": {"cols": ["id", "code", "percent"], "rows": [[1, "SPRING10", 10]]}}, {"task": "Alter a table", "sql": "ALTER TABLE products ADD COLUMN discontinued boolean NOT NULL DEFAULT false;\nALTER TABLE products RENAME COLUMN name TO title;\nALTER TABLE products ALTER COLUMN category SET DEFAULT 'misc';\nALTER TABLE products DROP COLUMN discontinued;\n", "note": "Adding a column with a constant default is metadata-only since PG 11. A volatile default (`now()`, `gen_random_uuid()`) or a type change rewrites the whole table under an exclusive lock."}, {"task": "Empty or remove tables", "sql": "TRUNCATE order_items, orders RESTART IDENTITY CASCADE;\nDROP TABLE IF EXISTS events CASCADE;\n", "note": "TRUNCATE drops the data files instead of deleting row by row: instant, but it takes an ACCESS EXCLUSIVE lock and skips DELETE triggers. CASCADE also empties (or drops) whatever references the table: read what it lists."}, {"task": "A read-only role", "sql": "CREATE ROLE app_ro NOLOGIN;\nGRANT USAGE ON SCHEMA public TO app_ro;\nGRANT SELECT ON ALL TABLES IN SCHEMA public TO app_ro;\nALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO app_ro;\nCREATE ROLE reporting LOGIN PASSWORD 'change-me' IN ROLE app_ro;\n", "note": "Grant to group roles, log in as member roles. `GRANT … ON ALL TABLES` covers existing tables only; `ALTER DEFAULT PRIVILEGES` covers tables created later (by the role running it)."}, {"task": "Inspect columns from SQL", "sql": "SELECT column_name, data_type, is_nullable\nFROM information_schema.columns\nWHERE table_name = 'orders'\nORDER BY ordinal_position;\n", "out": {"cols": ["column_name", "data_type", "is_nullable"], "rows": [["id", "bigint", "NO"], ["user_id", "bigint", "NO"], ["status", "text", "NO"], ["created_at", "timestamp with time zone", "NO"]]}}], "pitfalls": ["**Dropping the database you're in.** `DROP DATABASE` fails while any session is connected, including yours. Connect to `postgres` first; add `WITH (FORCE)` to disconnect the rest.", "**Explicit ids with `serial` or BY DEFAULT identity.** Bulk-loading rows with their ids leaves the sequence behind, and the next normal insert fails on a duplicate key. Use GENERATED ALWAYS, or `setval()` the sequence after the load.", "**`int` primary keys.** 2.1 billion arrives sooner than expected on event-like tables, and widening a key column on a big table rewrites it and every index under an exclusive lock. Default to `bigint`.", "**Quoted identifiers.** `CREATE TABLE \"Users\"` makes the name case-sensitive forever, so every query must quote it. Stick to lowercase snake_case.", "**Adding NOT NULL to a table with rows.** `ADD COLUMN x text NOT NULL` fails without a default, and `SET NOT NULL` scans the whole table under an exclusive lock. Add nullable, backfill, then enforce (see the second problem).", "**DDL on a busy table.** Most `ALTER TABLE` forms need ACCESS EXCLUSIVE: they wait behind running queries, and every new query queues behind them. Set `lock_timeout` first (see Locking & Concurrency)."], "mysql": ["`AUTO_INCREMENT` instead of identity. `SHOW DATABASES`, `SHOW TABLES`, `DESCRIBE t` instead of `\\l`, `\\dt`, `\\d t`.", "A DATABASE and a SCHEMA are the same thing in MySQL: there's no extra namespace level.", "DDL isn't transactional: each statement commits implicitly, so a migration that fails halfway leaves its earlier steps applied.", "CHECK constraints are enforced only since 8.0.16; earlier versions parsed and silently ignored them."], "problems": [{"id": "create-reviews", "title": "A reviews table", "variant": "canonical", "statement": "Create `reviews`: an `id` the database always generates, `user_id` and `product_id` that must exist, a required `rating` from 1 to 5, an optional `body`, and `created_at` defaulting to now. One review per user per product. Deleting a product deletes its reviews.", "hint": "Every rule here is a constraint: NOT NULL, CHECK, UNIQUE across two columns, and a foreign key with an ON DELETE action.", "solution": "CREATE TABLE reviews (\n  id         bigint GENERATED ALWAYS AS IDENTITY\n             PRIMARY KEY,\n  user_id    bigint NOT NULL REFERENCES users (id),\n  product_id bigint NOT NULL\n             REFERENCES products (id) ON DELETE CASCADE,\n  rating     smallint NOT NULL\n             CHECK (rating BETWEEN 1 AND 5),\n  body       text,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  UNIQUE (user_id, product_id)\n);\n", "tests": [{"sql": "INSERT INTO reviews (user_id, product_id, rating) VALUES (1, 1, 5)", "ok": true}, {"sql": "INSERT INTO reviews (user_id, product_id, rating) VALUES (1, 1, 4)", "error": "unique_violation", "note": "second review of the same product"}, {"sql": "INSERT INTO reviews (user_id, product_id, rating) VALUES (2, 1, 6)", "error": "check_violation"}, {"sql": "INSERT INTO reviews (user_id, product_id, rating) VALUES (2, 99, 4)", "error": "foreign_key_violation"}, {"sql": "INSERT INTO reviews (user_id, product_id, rating) VALUES (2, 1, NULL)", "error": "not_null_violation"}, {"sql": "INSERT INTO reviews (id, user_id, product_id, rating) VALUES (100, 2, 2, 3)", "error": "generated_always", "note": "ids come from the database only"}, {"sql": "INSERT INTO reviews (user_id, product_id, rating) VALUES (3, 8, 4)", "ok": true}, {"sql": "DELETE FROM products WHERE id = 8", "ok": true, "note": "takes its review with it"}], "check": "SELECT user_id, product_id, rating, created_at IS NOT NULL AS stamped FROM reviews ORDER BY id", "expect": {"cols": ["user_id", "product_id", "rating", "stamped"], "rows": [[1, 1, 5, true]]}, "insight": "Put every rule you can in the schema: the app has bugs and other writers (scripts, admins, a second service) won't run its validation. `ON DELETE CASCADE` fits owned children like reviews; for orders you'd rather `RESTRICT` (the default) so a product with sales can't vanish. Postgres doesn't index `user_id` or `product_id` for the foreign keys; the UNIQUE index covers lookups by `user_id`, so add one on `product_id`.", "mysql": "Same DDL with `BIGINT AUTO_INCREMENT PRIMARY KEY`, which can't reject explicit ids. CHECK needs 8.0.16+."}, {"id": "required-sku", "title": "A required SKU on a table with data", "variant": "disguise", "statement": "Products need a `sku`: required and unique. The table already has rows. Backfill existing products as `'SKU-'` plus the id zero-padded to 4 digits (`SKU-0001`), and make sure new products can't be added without a SKU.", "hint": "You can't add a NOT NULL column with no default to a table that has rows, and a constant default would break UNIQUE. Order the steps.", "solution": "ALTER TABLE products ADD COLUMN sku text;\nUPDATE products\n  SET sku = 'SKU-' || lpad(id::text, 4, '0');\nALTER TABLE products ALTER COLUMN sku SET NOT NULL;\nALTER TABLE products ADD CONSTRAINT products_sku_key\n  UNIQUE (sku);\n", "tests": [{"sql": "INSERT INTO products (name, category, price) VALUES ('Cable', 'peripherals', 9)", "error": "not_null_violation"}, {"sql": "INSERT INTO products (name, category, price, sku) VALUES ('Cable', 'peripherals', 9, 'SKU-0001')", "error": "unique_violation"}, {"sql": "INSERT INTO products (name, category, price, sku) VALUES ('Cable', 'peripherals', 9, 'SKU-0009')", "ok": true}], "check": "SELECT count(*) AS products, count(DISTINCT sku) AS skus, min(sku), max(sku) FROM products", "expect": {"cols": ["products", "skus", "min", "max"], "rows": [[9, 9, "SKU-0001", "SKU-0009"]]}, "insight": "Add nullable, backfill, then enforce. On a large live table each step needs care: backfill in batches of a few thousand rows so locks and WAL stay small; instead of `SET NOT NULL` (a full scan under ACCESS EXCLUSIVE), add `CHECK (sku IS NOT NULL) NOT VALID`, `VALIDATE` it (weaker lock), and then `SET NOT NULL` uses the check and skips the scan (PG 12+). For UNIQUE, `CREATE UNIQUE INDEX CONCURRENTLY`, then `ADD CONSTRAINT … UNIQUE USING INDEX`.", "mysql": "MySQL rewrites the table for most of these steps unless the change qualifies for `ALGORITHM=INSTANT` / `INPLACE`; on big tables teams use gh-ost or pt-online-schema-change."}], "part": "A"}, {"id": "joins", "name": "Joins & Set Operations", "signal": ["combine rows from two or more tables", "“…who never …” / “…without any …”", "“including those with zero”", "totals that come out too high after adding a join", "rows in one set but not another"], "idea": "Inner joins keep matches; outer joins keep every row of one side and fill the other with NULLs; semi-joins (`EXISTS`) test for a match without multiplying rows; anti-joins (`NOT EXISTS`) find what's missing. Most join bugs are cardinality bugs: know whether each side is one or many per key before you join, and aggregate first when both sides are many.", "tables": [{"title": "Which join for which question", "cols": ["Question", "Write", "Watch out"], "rows": [["Rows with a match on both sides", "`JOIN … ON`", "Rows without a match vanish from both sides"], ["All of A, B where it exists", "`LEFT JOIN b ON …`", "Conditions on `b` belong in ON; in WHERE they turn it back into an inner join"], ["A that has some B (semi-join)", "`WHERE EXISTS (SELECT 1 FROM b WHERE …)`", "A plain JOIN repeats A once per matching B"], ["A that has no B (anti-join)", "`WHERE NOT EXISTS (…)` or `LEFT JOIN … WHERE b.id IS NULL`", "`NOT IN (subquery)` returns nothing if the subquery yields a NULL"], ["Every combination", "`CROSS JOIN`", "n × m rows; useful for calendar × entity grids"], ["Rows of A, then rows of B", "`UNION ALL`", "`UNION` also deduplicates: a sort or hash, and it can drop legitimate repeats"], ["Rows in A but not in B", "`EXCEPT` (`INTERSECT` for both)", "Compares whole rows; here NULLs count as equal"]]}], "snippets": [{"task": "Self-join (who referred whom)", "sql": "SELECT u.name, r.name AS referred_by\nFROM users u\nLEFT JOIN users r ON r.id = u.referred_by\nORDER BY u.id;\n", "out": {"cols": ["name", "referred_by"], "rows": [["Ana", null], ["Ben", "Ana"], ["Chloe", "Ana"], ["Dev", "Ben"], ["Emma", null], ["Farid", null], ["Gia", "Chloe"], ["Hugo", null]]}}, {"task": "NOT IN meets a NULL", "sql": "SELECT\n  (SELECT count(*) FROM users\n   WHERE id NOT IN (SELECT referred_by FROM users)) AS not_in,\n  (SELECT count(*) FROM users u\n   WHERE NOT EXISTS (SELECT 1 FROM users r WHERE r.referred_by = u.id)) AS not_exists;\n", "out": {"cols": ["not_in", "not_exists"], "rows": [[0, 5]]}, "note": "“Users who referred nobody” is 5 users, but `referred_by` contains NULLs, so `id NOT IN (…, NULL)` is never true. `NOT EXISTS` doesn't have this problem."}, {"task": "A filter in ON vs in WHERE", "sql": "SELECT u.name, o.id AS cart_order\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id AND o.status = 'cart'\nWHERE u.id >= 6\nORDER BY u.id;\n", "out": {"cols": ["name", "cart_order"], "rows": [["Farid", null], ["Gia", 13], ["Hugo", null]]}, "note": "Move `o.status = 'cart'` into WHERE and Farid and Hugo disappear: their NULL status fails the test, which silently makes it an inner join."}, {"task": "Join fan-out", "sql": "SELECT count(*) AS joined_rows,\n       count(DISTINCT o.id) AS orders,\n       count(DISTINCT e.id) AS events\nFROM orders o\nJOIN events e ON e.user_id = o.user_id\nWHERE o.user_id = 1;\n", "out": {"cols": ["joined_rows", "orders", "events"], "rows": [[28, 4, 7]]}, "note": "Two one-to-many relations joined on the same key multiply: 4 orders × 7 events = 28 rows. Any `sum()` over that is 7× or 4× too big."}, {"task": "EXCEPT (in one set, not the other)", "sql": "SELECT user_id FROM events WHERE type = 'view'\nEXCEPT\nSELECT user_id FROM events WHERE type = 'checkout'\nORDER BY user_id;\n", "out": {"cols": ["user_id"], "rows": [[8]]}, "note": "Set operations deduplicate unless you add ALL. They match columns by position, not name."}], "pitfalls": ["**Filtering the outer side in WHERE.** `LEFT JOIN orders o … WHERE o.status = 'paid'` drops every user without a paid order: NULL fails the test. Put conditions on the optional side in the ON clause.", "**`NOT IN` with a nullable subquery.** One NULL makes `x NOT IN (…)` unknown for every row, and the query returns nothing. Use `NOT EXISTS`.", "**Fan-out inflating sums.** Joining orders to items and to events, or to two child tables at once, repeats rows. Aggregate each child in a subquery first, then join the one-row-per-key results.", "**DISTINCT as a band-aid.** It hides fan-out in row counts, costs a sort or hash, and can't fix sums: two different orders with the same total collapse into one.", "**NATURAL JOIN and USING.** NATURAL joins on every same-named column: add `created_at` to both tables and the join silently changes meaning. Spell out ON.", "**Joining on mismatched types.** `text` ids joined to `bigint` ids force a cast on one side, which disables its index. Fix the column type."], "mysql": ["No FULL OUTER JOIN: emulate it with `LEFT JOIN … UNION ALL` the unmatched rows of a `RIGHT JOIN`.", "`INTERSECT` and `EXCEPT` exist only since 8.0.31.", "Before 8.0.17, `NOT EXISTS` and `NOT IN` subqueries often ran once per outer row; that's where the “always use LEFT JOIN … IS NULL” advice comes from. Modern versions plan them as anti-joins."], "problems": [{"id": "never-paid", "title": "Users who never paid", "variant": "canonical", "statement": "List the users who have **no paid order** (any other status doesn't count). Return `id` and `name`, ordered by `id`.", "hint": "You want users for whom a matching row does not exist, and the status test belongs inside that existence check.", "solution": "SELECT u.id, u.name\nFROM users u\nWHERE NOT EXISTS (\n  SELECT 1\n  FROM orders o\n  WHERE o.user_id = u.id\n    AND o.status = 'paid'\n)\nORDER BY u.id;\n", "expect": {"cols": ["id", "name"], "rows": [[7, "Gia"], [8, "Hugo"]]}, "insight": "An anti-join. Gia has an order (a cart), so “users with no orders” would miss her: the status filter must sit inside the subquery. `LEFT JOIN orders o ON o.user_id = u.id AND o.status = 'paid' WHERE o.id IS NULL` is equivalent and gets the same Hash Anti Join plan. `NOT IN (SELECT user_id …)` works here only because `user_id` is NOT NULL; don't rely on that.", "mysql": "Identical SQL. On MySQL before 8.0.17, prefer the LEFT JOIN form for speed."}, {"id": "units-sold", "title": "Units sold per product, zeros included", "variant": "disguise", "statement": "For **every** product, the total quantity sold in paid orders, with 0 for products that never sold. Return `id`, `name`, `units`, ordered by `id`.", "hint": "Two traps: where the paid filter goes, and whether you join before or after summing.", "solution": "SELECT p.id, p.name, coalesce(s.units, 0) AS units\nFROM products p\nLEFT JOIN (\n  SELECT i.product_id, sum(i.qty) AS units\n  FROM order_items i\n  JOIN orders o ON o.id = i.order_id\n  WHERE o.status = 'paid'\n  GROUP BY i.product_id\n) s ON s.product_id = p.id\nORDER BY p.id;\n", "expect": {"cols": ["id", "name", "units"], "rows": [[1, "Mechanical keyboard", 2], [2, "Wireless mouse", 4], [3, "Monitor 27in", 3], [4, "USB-C hub", 3], [5, "Laptop stand", 2], [6, "Desk lamp", 3], [7, "Webcam", 1], [8, "Monitor arm", 0]]}, "insight": "Aggregate the many side first, then LEFT JOIN one row per product. Writing `LEFT JOIN order_items … LEFT JOIN orders … WHERE o.status = 'paid'` drops the Monitor arm (NULL status) and makes it an inner join; moving the status test into ON keeps it but then counts items of unpaid orders unless the join to orders is inner. The webcam is the check: it appears in a paid, a cancelled and a pending order, but only 1 unit counts.", "mysql": "Same query; `IFNULL` or `COALESCE` both work."}], "part": "A"}, {"id": "aggregation", "name": "Aggregation", "signal": ["“how many / how much per …”", "several counts side by side (a pivot)", "“only groups with more than …”", "subtotals and a grand total", "averages that have to be “per order” or “per customer”"], "idea": "GROUP BY collapses rows into one per group, and every selected column must be grouped or aggregated. Aggregates skip NULLs, except `count(*)`. `FILTER (WHERE …)` computes many conditional aggregates in one pass, and HAVING filters groups after aggregation. Most wrong answers aggregate at the wrong grain: decide what one row of the result means before writing the query.", "tables": [{"title": "Aggregates and NULLs", "cols": ["Expression", "Over rows 5, NULL, 7", "Over zero rows"], "rows": [["`count(*)`", "3", "0"], ["`count(x)`", "2 (NULL skipped)", "0"], ["`sum(x)` / `avg(x)`", "12 / 6", "NULL, not 0: wrap in `coalesce(…, 0)`"], ["`array_agg(x)`", "`{5,NULL,7}` (keeps NULLs)", "NULL"], ["`string_agg(x::text, ',')`", "`5,7` (skips NULLs)", "NULL"], ["`bool_and(x > 0)` / `bool_or`", "true", "NULL"]]}], "snippets": [{"task": "Three ways to count", "sql": "SELECT count(*) AS all_rows,\n       count(country) AS with_country,\n       count(DISTINCT country) AS countries\nFROM users;\n", "out": {"cols": ["all_rows", "with_country", "countries"], "rows": [[8, 7, 4]]}}, {"task": "Pivot with FILTER", "sql": "SELECT count(*) FILTER (WHERE status = 'paid')      AS paid,\n       count(*) FILTER (WHERE status = 'cancelled') AS cancelled,\n       count(*) FILTER (WHERE status = 'pending')   AS pending,\n       count(*) FILTER (WHERE status = 'cart')      AS cart\nFROM orders;\n", "out": {"cols": ["paid", "cancelled", "pending", "cart"], "rows": [[11, 2, 1, 1]]}}, {"task": "Groups with a condition (HAVING)", "sql": "SELECT u.name, count(*) AS paid_orders\nFROM orders o\nJOIN users u ON u.id = o.user_id\nWHERE o.status = 'paid'\nGROUP BY u.id, u.name\nHAVING count(*) >= 3\nORDER BY paid_orders DESC;\n", "out": {"cols": ["name", "paid_orders"], "rows": [["Ana", 4], ["Ben", 3]]}, "note": "WHERE filters rows before grouping (cheap); HAVING filters groups after. Grouping by `u.id` too keeps two users who share a name apart."}, {"task": "Subtotals and a grand total (ROLLUP)", "sql": "SELECT CASE WHEN grouping(p.category) = 1 THEN 'all' ELSE p.category END AS category,\n       sum(i.qty) AS units\nFROM order_items i\nJOIN orders o ON o.id = i.order_id AND o.status = 'paid'\nJOIN products p ON p.id = i.product_id\nGROUP BY ROLLUP (p.category)\nORDER BY grouping(p.category), p.category;\n", "out": {"cols": ["category", "units"], "rows": [["displays", 3], ["furniture", 5], ["peripherals", 10], ["all", 18]]}, "note": "`grouping()` tells a subtotal row's NULL apart from a real NULL value. `CUBE` and `GROUPING SETS` give other combinations."}, {"task": "Concatenate a group", "sql": "SELECT category, string_agg(name, ', ' ORDER BY name) AS products\nFROM products\nGROUP BY category\nORDER BY category;\n", "out": {"cols": ["category", "products"], "rows": [["displays", "Monitor 27in"], ["furniture", "Desk lamp, Laptop stand, Monitor arm"], ["peripherals", "Mechanical keyboard, USB-C hub, Webcam, Wireless mouse"]]}}, {"task": "Aggregates over no rows", "sql": "SELECT sum(qty) AS total, coalesce(sum(qty), 0) AS total_or_zero, count(*) AS n\nFROM order_items\nWHERE order_id = 999;\n", "out": {"cols": ["total", "total_or_zero", "n"], "rows": [[null, 0, 0]]}}], "pitfalls": ["**Wrong grain.** `avg(qty * unit_price)` over item rows is the average line, not the average order. Build the per-order (or per-customer) rows in a subquery, then average those.", "**Summing after a fan-out join.** Joining a second child table repeats rows and multiplies sums. Aggregate each child separately (see Joins).", "**`sum()` of nothing is NULL.** A user with no orders gets NULL revenue, and NULL + 10 is NULL. `coalesce(sum(x), 0)` where 0 is the right answer.", "**Grouping by a non-unique label.** `GROUP BY name` merges two different Anas. Group by the key; Postgres then lets you select other columns of that table (functional dependency on the PK).", "**`count(DISTINCT x)` at scale** needs a sort or hash of every value and doesn't parallelize well. Dashboards over billions of rows use HyperLogLog (`hll` extension) or pre-aggregated rollup tables.", "**HAVING for row filters.** `HAVING status = 'paid'` either errors or filters too late; row conditions go in WHERE."], "mysql": ["`ONLY_FULL_GROUP_BY` (default since 5.7) rejects non-grouped columns. With it off, MySQL returns a value from an arbitrary row of the group.", "No FILTER clause: write `COUNT(CASE WHEN status = 'paid' THEN 1 END)` or `SUM(status = 'paid')`.", "`GROUP BY category WITH ROLLUP` instead of `ROLLUP (category)`; `GROUPING()` since 8.0.", "`GROUP_CONCAT` instead of `string_agg`, silently truncated at `group_concat_max_len` (1024 bytes by default)."], "problems": [{"id": "users-by-country", "title": "Users and payers per country", "variant": "canonical", "statement": "Per country: the number of users and how many of them have at least one paid order. Show unknown countries as `'unknown'`. Columns `country`, `users`, `paying`; most users first, then by country.", "hint": "Join each user to at most one row that says “has paid”, then count a column that is NULL for the others.", "solution": "SELECT coalesce(u.country, 'unknown') AS country,\n       count(*) AS users,\n       count(p.user_id) AS paying\nFROM users u\nLEFT JOIN (\n  SELECT DISTINCT user_id\n  FROM orders\n  WHERE status = 'paid'\n) p ON p.user_id = u.id\nGROUP BY 1\nORDER BY users DESC, country;\n", "expect": {"cols": ["country", "users", "paying"], "rows": [["US", 3, 2], ["FR", 2, 1], ["DE", 1, 1], ["IN", 1, 1], ["unknown", 1, 1]]}, "insight": "`count(p.user_id)` counts only users the join matched, while `count(*)` counts all. The `DISTINCT` subquery matters: joining orders directly would count Ana four times. `GROUP BY 1` groups by the coalesced expression, so NULL and 'unknown' land together.", "mysql": "Same query. MySQL also accepts `GROUP BY country` meaning the alias, but then the alias and the column share a name: be explicit."}, {"id": "avg-order-value", "title": "Average order value per customer", "variant": "disguise", "statement": "For each user with paid orders: the number of paid orders and the average paid **order** value, rounded to 2 decimals. Columns `name`, `orders`, `avg_order`; highest average first.", "hint": "What is one row when you take the average: an item, or an order?", "solution": "WITH totals AS (\n  SELECT o.user_id, o.id,\n         sum(i.qty * i.unit_price) AS total\n  FROM orders o\n  JOIN order_items i ON i.order_id = o.id\n  WHERE o.status = 'paid'\n  GROUP BY o.user_id, o.id\n)\nSELECT u.name, count(*) AS orders,\n       round(avg(t.total), 2) AS avg_order\nFROM totals t\nJOIN users u ON u.id = t.user_id\nGROUP BY u.id, u.name\nORDER BY avg_order DESC;\n", "expect": {"cols": ["name", "orders", "avg_order"], "rows": [["Emma", 1, 600.0], ["Ana", 4, 153.75], ["Chloe", 1, 140.0], ["Farid", 1, 80.0], ["Dev", 1, 75.0], ["Ben", 3, 70.0]]}, "insight": "Two levels of aggregation: items to orders, then orders to users. Aggregating item rows directly gives Ana an “average” of 123.00 over 5 lines and counts 5 orders. When an answer depends on grain, say the grain out loud in the interview (“one row per order”).", "mysql": "Same query (CTEs need MySQL 8.0)."}], "part": "A"}, {"id": "nulls-types", "name": "NULLs, Types & Dates", "signal": ["“unknown”, “missing”, “not set” values", "averages or ratios that come out as whole numbers", "money arithmetic", "“per day” in a user's time zone", "days with no activity must still appear"], "idea": "NULL means unknown, so comparisons with it are unknown too (three-valued logic), and WHERE keeps only rows that are true. Types decide arithmetic: integer division truncates, floats round in binary, `numeric` is exact. A `timestamptz` is an instant; turning it into a calendar day or hour always needs a time zone, whether you name one or the session supplies it.", "tables": [{"title": "NULL in expressions", "cols": ["Expression", "Result", "Use instead"], "rows": [["`NULL = NULL`, `NULL <> 1`", "NULL (unknown), so the row is filtered out", "`IS NULL`, `IS DISTINCT FROM`"], ["`NULL + 1`, `'a' || NULL`", "NULL", "`coalesce(x, 0)`, `concat()` (skips NULLs)"], ["`x NOT IN (1, NULL)`", "never true", "`NOT EXISTS`, or filter NULLs out"], ["`NOT (x > 5)` when x is NULL", "NULL, not true", "test `x IS NULL OR x <= 5` explicitly"], ["`ORDER BY x`", "NULLs sort last ascending, first descending", "`NULLS FIRST` / `NULLS LAST`"], ["`UNIQUE (email)` with two NULLs", "allowed: NULLs aren't equal", "`UNIQUE NULLS NOT DISTINCT` (PG 15+)"]]}, {"title": "Time types", "cols": ["Type", "Holds", "Gotcha"], "rows": [["`timestamptz`", "An instant, stored as UTC", "Displayed and truncated in the session `TimeZone`"], ["`timestamp`", "A wall-clock reading with no zone", "Two servers in different zones read it differently"], ["`date`", "A calendar day", "Converting an instant to a date needs a zone"], ["`interval`", "A duration in months, days and microseconds", "`'2026-01-31' + interval '1 month'` is Feb 28; a day isn't always 24 h across DST"]]}], "snippets": [{"task": "Three-valued logic", "sql": "SELECT NULL = NULL AS eq,\n       NULL IS NULL AS is_null,\n       NULL IS DISTINCT FROM NULL AS distinct_nulls,\n       1 IS DISTINCT FROM NULL AS distinct_one;\n", "out": {"cols": ["eq", "is_null", "distinct_nulls", "distinct_one"], "rows": [[null, true, false, true]]}}, {"task": "Integer division and remainders", "sql": "SELECT 7 / 2 AS int_div,\n       7 / 2.0 AS numeric_div,\n       round(2 / 3::numeric, 3) AS rounded,\n       7 % 2 AS remainder;\n", "out": {"cols": ["int_div", "numeric_div", "rounded", "remainder"], "rows": [[3, 3.5, 0.667, 1]]}, "note": "`count(*) / count(*)` is integer division too: ratios need a cast or a `100.0 *` first."}, {"task": "Floats aren't exact", "sql": "SELECT 0.1::float8 + 0.2::float8 = 0.3 AS float_eq,\n       0.1 + 0.2 = 0.3 AS numeric_eq;\n", "out": {"cols": ["float_eq", "numeric_eq"], "rows": [[false, true]]}, "note": "Unadorned decimal literals are `numeric` in Postgres, which is exact. Money in `float8` drifts by cents after enough additions."}, {"task": "Safe division and fallbacks", "sql": "SELECT 10 / NULLIF(0, 0) AS safe_div,\n       coalesce(NULL, NULL, 'fallback') AS first_non_null;\n", "out": {"cols": ["safe_div", "first_non_null"], "rows": [[null, "fallback"]]}}, {"task": "AT TIME ZONE, both directions", "sql": "SELECT timestamptz '2026-03-20 22:10Z' AT TIME ZONE 'Asia/Tokyo' AS tokyo_wall_clock,\n       timestamp '2026-03-21 07:10' AT TIME ZONE 'Asia/Tokyo' AS instant;\n", "out": {"cols": ["tokyo_wall_clock", "instant"], "rows": [["2026-03-21 07:10:00", "2026-03-20 22:10:00+00"]]}, "note": "On a `timestamptz` it returns Tokyo's wall clock (a `timestamp`). On a `timestamp` it reads the value as Tokyo time and returns the instant. Use zone names, not offsets like `+09`, so DST is handled."}, {"task": "Truncating and adding time", "sql": "SELECT date_trunc('week', timestamptz '2026-03-20 22:10Z') AS week_start,\n       date_trunc('month', timestamp '2026-03-20 12:00') AS month_start,\n       date '2026-01-31' + interval '1 month' AS plus_month,\n       date '2026-03-10' - date '2026-03-01' AS days_between;\n", "out": {"cols": ["week_start", "month_start", "plus_month", "days_between"], "rows": [["2026-03-16 00:00:00+00", "2026-03-01 00:00:00", "2026-02-28 00:00:00", 9]]}, "note": "Weeks start on Monday (ISO). `date_trunc` on a `timestamptz` truncates in the session zone; PG 12+ takes a zone argument: `date_trunc('day', ts, 'Asia/Tokyo')`."}, {"task": "Where NULLs sort", "sql": "SELECT name, country\nFROM users\nWHERE id >= 5\nORDER BY country NULLS FIRST, name;\n", "out": {"cols": ["name", "country"], "rows": [["Farid", null], ["Emma", "DE"], ["Hugo", "FR"], ["Gia", "US"]]}}], "pitfalls": ["**`= NULL` in a WHERE clause** matches nothing, without an error. Every nullable comparison needs `IS NULL` or `IS DISTINCT FROM`.", "**Integer division in ratios.** `paid / total` with two integers gives 0 for anything under 100%. Cast one side (`paid::numeric / total`) or multiply by `100.0` first.", "**Truncating instants without naming a zone.** `created_at::date` and `date_trunc('day', created_at)` use the session's `TimeZone`, so the same report differs between a UTC server and a laptop. Say `AT TIME ZONE` explicitly in reports.", "**Between on timestamps.** `created_at BETWEEN '2026-03-01' AND '2026-03-31'` misses everything after midnight on the 31st. Use half-open ranges: `>= '2026-03-01' AND < '2026-04-01'`.", "**Missing days in a time series.** GROUP BY only produces days that have rows. Join to `generate_series` so empty days show as 0.", "**Comparing `char(n)`.** It pads with spaces and trailing-space semantics differ between operators. Use `text`."], "mysql": ["NULLs sort first ascending in MySQL (last in Postgres), and there's no `NULLS FIRST/LAST`: order by `x IS NULL` first.", "`/` always returns a decimal (`7 / 2 = 3.5000`); `DIV` is integer division.", "`TIMESTAMP` is stored as UTC and converted by the session `time_zone`; `DATETIME` is a wall clock (like Postgres `timestamp`). `TIMESTAMP` ends in 2038.", "Use `<=>` for NULL-safe equality (Postgres: `IS NOT DISTINCT FROM`)."], "problems": [{"id": "revenue-every-day", "title": "Revenue for every day of a week", "variant": "canonical", "statement": "Paid revenue for each day from 2026-03-01 to 2026-03-07 (UTC), **including days with no paid orders** as 0. Columns `day`, `revenue`, oldest first.", "hint": "Start from the list of days, not from the orders.", "solution": "SELECT d::date AS day,\n       coalesce(sum(i.qty * i.unit_price), 0) AS revenue\nFROM generate_series(timestamptz '2026-03-01',\n                     timestamptz '2026-03-07',\n                     interval '1 day') AS d\nLEFT JOIN orders o\n  ON o.status = 'paid'\n AND o.created_at >= d\n AND o.created_at < d + interval '1 day'\nLEFT JOIN order_items i ON i.order_id = o.id\nGROUP BY d\nORDER BY d;\n", "expect": {"cols": ["day", "revenue"], "rows": [["2026-03-01", 200.0], ["2026-03-02", 0], ["2026-03-03", 300.0], ["2026-03-04", 75.0], ["2026-03-05", 0], ["2026-03-06", 0], ["2026-03-07", 0]]}, "insight": "The calendar is the driving table; orders join to it. The paid filter sits in the ON clause, or the empty days disappear again. Comparing `created_at` to a half-open range keeps the index on `created_at` usable, unlike `created_at::date = d`. For a business day in another zone, generate the boundaries in that zone: `generate_series(timestamp '2026-03-01', …) AT TIME ZONE 'Asia/Tokyo'`.", "mysql": "No `generate_series`: use a recursive CTE (`WITH RECURSIVE days AS (SELECT DATE '2026-03-01' AS d UNION ALL SELECT d + INTERVAL 1 DAY FROM days WHERE d < '2026-03-07')`) or a calendar table."}, {"id": "tokyo-day-shift", "title": "Orders that move day in Tokyo", "variant": "disguise", "statement": "The Tokyo office reports by local calendar day. Which **paid** orders fall on a different date in Tokyo than in UTC? Return `order_id`, `utc_day`, `tokyo_day`, ordered by `order_id`. Don't depend on the session's time zone setting.", "hint": "`AT TIME ZONE` on a `timestamptz` gives the wall-clock time in that zone.", "solution": "SELECT id AS order_id,\n       (created_at AT TIME ZONE 'UTC')::date AS utc_day,\n       (created_at AT TIME ZONE 'Asia/Tokyo')::date\n         AS tokyo_day\nFROM orders\nWHERE status = 'paid'\n  AND (created_at AT TIME ZONE 'UTC')::date\n   <> (created_at AT TIME ZONE 'Asia/Tokyo')::date\nORDER BY order_id;\n", "expect": {"cols": ["order_id", "utc_day", "tokyo_day"], "rows": [[5, "2026-03-04", "2026-03-05"], [11, "2026-03-20", "2026-03-21"], [12, "2026-03-28", "2026-03-29"], [14, "2026-04-02", "2026-04-03"]]}, "insight": "Anything after 15:00 UTC is the next day in Tokyo (UTC+9, no DST). Order 12 at exactly 15:00 UTC is midnight in Tokyo, the boundary case. `created_at::date` would silently use the session zone, so the same query gives different answers on different machines. Store instants as `timestamptz`; convert at the edge, and store the user's zone name (not an offset) if reports need it.", "mysql": "`CONVERT_TZ(created_at, '+00:00', 'Asia/Tokyo')` needs the time zone tables loaded (`mysql_tzinfo_to_sql`); otherwise it returns NULL."}], "part": "A"}, {"id": "subqueries", "name": "Subqueries, CTEs & LATERAL", "signal": ["“compared with the average / the max”", "the latest or top-N row **for each** row of another table", "a query easier to read in named steps", "the result of one step feeds a filter in another", "delete or move rows and report what changed"], "idea": "A subquery is a query used as a value (scalar), a set (`IN`, `EXISTS`) or a table (`FROM`). A correlated subquery refers to the outer row and logically runs once per row. `LATERAL` makes a FROM-subquery correlated, which is the cleanest way to say “for each user, their latest 3 orders”. CTEs name steps; since PG 12 they're inlined like subqueries unless referenced twice or marked MATERIALIZED.", "tables": [{"title": "Where a subquery can go", "cols": ["Form", "Returns", "Watch out"], "rows": [["Scalar: `(SELECT max(price) FROM products)`", "One value", "Error if it returns 2+ rows; NULL if it returns none"], ["`x IN (SELECT …)` / `EXISTS (SELECT …)`", "A test per outer row", "`NOT IN` with NULLs (see Joins)"], ["Derived table: `FROM (SELECT …) AS t`", "A table", "Can't see other FROM items unless LATERAL"], ["`JOIN LATERAL (SELECT … LIMIT n) t ON true`", "A table per outer row", "Use `LEFT JOIN LATERAL … ON true` to keep rows with no match"], ["`WITH t AS (…)`", "A named table for the statement", "Inlined (PG 12+) unless `MATERIALIZED`, recursive, or referenced twice"], ["`WITH t AS (DELETE … RETURNING *)`", "Rows changed by a write", "All sub-statements see the same snapshot: they can't see each other's changes"]]}], "snippets": [{"task": "Scalar subquery per row", "sql": "SELECT u.name,\n       (SELECT count(*) FROM orders o WHERE o.user_id = u.id) AS orders\nFROM users u\nWHERE u.id <= 3\nORDER BY u.id;\n", "out": {"cols": ["name", "orders"], "rows": [["Ana", 4], ["Ben", 4], ["Chloe", 2]]}, "note": "Fine for a few rows or with an index on `orders(user_id)`; for whole tables, a GROUP BY joined once is usually cheaper."}, {"task": "Control CTE inlining", "sql": "WITH big AS MATERIALIZED (\n  SELECT * FROM orders WHERE status = 'paid'\n)\nSELECT count(*) FROM big WHERE user_id = 1;\n", "out": {"cols": ["count"], "rows": [[4]]}, "note": "MATERIALIZED computes the CTE once and blocks predicate push-down (the old pre-12 “optimization fence”). `NOT MATERIALIZED` forces inlining even when referenced twice."}, {"task": "A write in a CTE", "sql": "WITH gone AS (\n  DELETE FROM events WHERE user_id = 8 RETURNING id\n)\nSELECT count(*) AS deleted FROM gone;\n", "out": {"cols": ["deleted"], "rows": [[3]]}, "note": "Archive-and-delete in one statement: `WITH moved AS (DELETE … RETURNING *) INSERT INTO events_archive SELECT * FROM moved`."}], "pitfalls": ["**A scalar subquery that can return two rows.** It works in testing and fails in production the first time data has a duplicate (“more than one row returned by a subquery used as an expression”). Aggregate or `LIMIT 1` with an ORDER BY that means something.", "**Plain JOIN LATERAL drops rows.** Users with no orders vanish. Use `LEFT JOIN LATERAL (…) ON true`.", "**Assuming a CTE is computed once.** Since PG 12 a CTE referenced once is inlined; a volatile function in it (`random()`, `nextval`) or an expensive step may run differently than you expect. Say MATERIALIZED when you mean it.", "**Expecting a data-modifying CTE to see its sibling's changes.** All parts of one statement read the same snapshot; the main query sees the old rows, and only RETURNING passes the new ones along.", "**Correlated subqueries without an index.** One subquery per outer row is a nested loop; without an index on the correlated column it's a full scan per row."], "mysql": ["CTEs and `LATERAL` need MySQL 8.0 (LATERAL 8.0.14+). MySQL decides on its own whether to merge or materialize derived tables; there's no MATERIALIZED keyword.", "No data-modifying CTEs and no RETURNING (MariaDB has `RETURNING` on DELETE/INSERT).", "You can't modify a table and select from it in a subquery of the same statement (error 1093); wrap the subquery in a derived table."], "problems": [{"id": "latest-paid-order", "title": "Each user's latest paid order", "variant": "canonical", "statement": "For **every** user, their most recent paid order's id and its (UTC) date, or NULLs if they have none. Columns `name`, `order_id`, `day`, ordered by user id.", "hint": "For each user, run a small “top 1” query. Which join lets a subquery see the current user, and keeps users it finds nothing for?", "solution": "SELECT u.name, o.id AS order_id,\n       o.created_at::date AS day\nFROM users u\nLEFT JOIN LATERAL (\n  SELECT id, created_at\n  FROM orders\n  WHERE user_id = u.id AND status = 'paid'\n  ORDER BY created_at DESC\n  LIMIT 1\n) o ON true\nORDER BY u.id;\n", "expect": {"cols": ["name", "order_id", "day"], "rows": [["Ana", 14, "2026-04-02"], ["Ben", 12, "2026-03-28"], ["Chloe", 10, "2026-03-20"], ["Dev", 5, "2026-03-04"], ["Emma", 15, "2026-04-05"], ["Farid", 11, "2026-03-20"], ["Gia", null, null], ["Hugo", null, null]]}, "insight": "LATERAL turns “top N per row” into N index probes per user: with an index on `orders (user_id, status, created_at)` each probe reads one entry. That beats `ROW_NUMBER() … WHERE rn = 1` when there are few users and many orders; with many small groups, the window version (one sort) wins. `DISTINCT ON (user_id) … ORDER BY user_id, created_at DESC` is the Postgres shorthand for the top-1 case.", "mysql": "`LEFT JOIN LATERAL` works from 8.0.14; older versions use a correlated subquery for each column or a window function."}, {"id": "above-average-customer", "title": "Customers above the average customer", "variant": "disguise", "statement": "Which customers spent more on paid orders than the **average customer** did? Only customers with at least one paid order count toward the average. Columns `name`, `spent`; biggest spender first.", "hint": "“Average customer” and “average order” are different numbers. Build per-customer totals once, then compare against their average.", "solution": "WITH spend AS (\n  SELECT o.user_id,\n         sum(i.qty * i.unit_price) AS spent\n  FROM orders o\n  JOIN order_items i ON i.order_id = o.id\n  WHERE o.status = 'paid'\n  GROUP BY o.user_id\n)\nSELECT u.name, s.spent\nFROM spend s\nJOIN users u ON u.id = s.user_id\nWHERE s.spent > (SELECT avg(spent) FROM spend)\nORDER BY s.spent DESC;\n", "expect": {"cols": ["name", "spent"], "rows": [["Ana", 615.0], ["Emma", 600.0]]}, "insight": "The average customer spent 1720 / 6 ≈ 286.67; the average order is 1720 / 11 ≈ 156.36, which would wrongly include Ben (210). The CTE is referenced twice, so Postgres materializes it and computes the totals once. A window version also works: `spent > avg(spent) OVER ()` in a subquery.", "mysql": "Same query on 8.0."}], "part": "A"}, {"id": "windows", "name": "Window Functions", "signal": ["“rank / top within each …”", "“running total”, “moving average”", "“compared with the previous / next row”", "“share of the group total” without collapsing rows", "keep every row but add a group-level number"], "idea": "A window function computes over a set of rows related to the current row without collapsing them, unlike GROUP BY. `PARTITION BY` picks the group, `ORDER BY` orders it, and the frame picks which rows of the partition count for this row. Windows run after WHERE, GROUP BY and HAVING, so they can wrap aggregates but can't be filtered in the same query level.", "diagram": {"type": "table", "caption": "employees in eng and sales, ordered by salary within each department", "cols": ["dept", "name", "salary"], "rows": [["eng", "Grace", 190000], ["eng", "Linus", 160000], ["eng", "Ken", 160000], ["eng", "Barbara", 140000], ["eng", "Dennis", 120000], ["sales", "Margaret", 150000], ["sales", "Alan", 95000], ["sales", "Edsger", 95000]], "frames": [{"title": "PARTITION BY dept", "expr": "avg(salary) OVER (PARTITION BY dept)", "cur": 2, "win": [0, 1, 2, 3, 4], "out": ["154000", "154000", "154000", "154000", "154000", "113333", "113333", "113333"], "note": "No ORDER BY: the frame is the **whole partition**, so every eng row sees the same five rows and gets the same average. The rows stay; only a column is added."}, {"title": "+ ORDER BY (default frame)", "expr": "sum(salary) OVER (PARTITION BY dept ORDER BY salary DESC)", "cur": 1, "win": [0, 1, 2], "out": ["190000", "510000", "510000", "650000", "770000", "150000", "340000", "340000"], "note": "Adding ORDER BY makes the default frame `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`. RANGE includes **peers** (rows with the same salary), so Linus already counts Ken: both show 510000. This is the classic running-total surprise."}, {"title": "ROWS 1 PRECEDING … 1 FOLLOWING", "expr": "sum(salary) OVER (PARTITION BY dept ORDER BY salary DESC ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING)", "cur": 3, "win": [2, 3, 4], "out": ["350000", "510000", "460000", "420000", "260000", "245000", "340000", "190000"], "note": "ROWS counts physical rows, ignoring peers: a sliding window of three. The frame never crosses the partition boundary, so Dennis and Margaret only see two rows."}, {"title": "LAG(salary)", "expr": "lag(salary) OVER (PARTITION BY dept ORDER BY salary DESC)", "cur": 6, "win": [5], "out": [null, "190000", "160000", "160000", "140000", null, "150000", "95000"], "note": "LAG and LEAD read one row back or ahead in partition order, ignoring the frame. The first row of each partition gets NULL (or LAG's third argument, the default)."}]}, "snippets": [{"task": "ROW_NUMBER vs RANK vs DENSE_RANK on ties", "sql": "SELECT name, salary,\n       row_number() OVER (ORDER BY salary DESC, id) AS row_number,\n       rank()       OVER (ORDER BY salary DESC)     AS rank,\n       dense_rank() OVER (ORDER BY salary DESC)     AS dense_rank\nFROM employees\nWHERE dept = 'eng'\nORDER BY salary DESC, id;\n", "out": {"cols": ["name", "salary", "row_number", "rank", "dense_rank"], "rows": [["Grace", 190000, 1, 1, 1], ["Linus", 160000, 2, 2, 2], ["Ken", 160000, 3, 2, 2], ["Barbara", 140000, 4, 4, 3], ["Dennis", 120000, 5, 5, 4]]}, "note": "RANK leaves a gap after ties (4), DENSE_RANK doesn't (3). ROW_NUMBER needs a unique tiebreaker (`id`) or Linus and Ken can swap between runs."}, {"task": "Running total with ties (the RANGE trap)", "sql": "SELECT name, salary,\n       sum(salary) OVER (ORDER BY salary)     AS peers_share,\n       sum(salary) OVER (ORDER BY salary, id) AS running\nFROM employees\nWHERE dept = 'sales'\nORDER BY salary, id;\n", "out": {"cols": ["name", "salary", "peers_share", "running"], "rows": [["Alan", 95000, 190000, 95000], ["Edsger", 95000, 190000, 190000], ["Margaret", 150000, 340000, 340000]]}, "note": "Same default frame both times. A unique ORDER BY removes peers, so RANGE and ROWS agree. Or write `ROWS UNBOUNDED PRECEDING` explicitly."}, {"task": "Share of the group total", "sql": "SELECT name, salary,\n       round(100.0 * salary / sum(salary) OVER (PARTITION BY dept), 1) AS pct_of_dept\nFROM employees\nWHERE dept = 'ops'\nORDER BY salary DESC, id;\n", "out": {"cols": ["name", "salary", "pct_of_dept"], "rows": [["Radia", 130000, 37.1], ["Frances", 110000, 31.4], ["Hedy", 110000, 31.4]]}, "note": "`100.0 *` first: `int / int` truncates in Postgres."}, {"task": "LAST_VALUE needs a full frame", "sql": "SELECT name,\n       first_value(name) OVER w AS top,\n       last_value(name)  OVER w AS last_default,\n       last_value(name)  OVER (w ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS bottom\nFROM employees\nWHERE dept = 'ops'\nWINDOW w AS (ORDER BY salary DESC, id)\nORDER BY salary DESC, id;\n", "out": {"cols": ["name", "top", "last_default", "bottom"], "rows": [["Radia", "Radia", "Radia", "Hedy"], ["Frances", "Radia", "Frances", "Hedy"], ["Hedy", "Radia", "Hedy", "Hedy"]]}, "note": "The default frame ends at the current row, so `last_value` returns the current row. A named `WINDOW` keeps long queries readable and lets the planner share one sort."}], "pitfalls": ["**Filtering on a window result in WHERE.** `WHERE row_number() OVER (…) = 1` is an error: windows are computed after WHERE. Compute in a CTE or subquery, then filter outside. Postgres has no `QUALIFY` (Snowflake, BigQuery and DuckDB do).", "**Filtering in the wrong place changes the window.** WHERE runs first, so rows it removes don't exist for LAG or the running sum. Filtering `status = 'paid'` inside versus outside the windowed query gives different “previous order” answers.", "**The default frame with ORDER BY is RANGE, not ROWS.** Peers share a value, so running totals jump at ties and `last_value` returns the current row. Use a unique ORDER BY or an explicit `ROWS` frame.", "**Non-deterministic ordering.** ROW_NUMBER over a non-unique ORDER BY can number ties differently on each run, which breaks dedup (“keep row 1”) and pagination. Always add a unique tiebreaker.", "**Every distinct window spec is another sort.** Three different `OVER (…)` clauses can mean three sorts of the whole input. Share a `WINDOW` clause, and an index on `(partition cols, order cols)` can feed the window already sorted.", "**ROW_NUMBER ≤ N for top-N per group computes every row.** With few groups and an index on the group and sort columns, `LATERAL (… ORDER BY … LIMIT N)` per group reads only N rows each (see Subqueries, CTEs & LATERAL)."], "mysql": ["Window functions need MySQL 8.0+. In 5.7 they were emulated with `@variables`, whose evaluation order isn't guaranteed.", "MySQL supports ROWS and RANGE frames but not `GROUPS` or the `EXCLUDE` clause. Neither database has `QUALIFY`.", "`date - date` isn't days in MySQL (it subtracts YYYYMMDD numbers). Use `DATEDIFF(a, b)`."], "problems": [{"id": "running-revenue", "title": "Running revenue by day", "variant": "canonical", "statement": "Daily revenue from **paid** orders (sum of `qty * unit_price`) and a running total across days. One row per day that had paid orders, oldest first. Columns: `day`, `revenue`, `running_total`.", "hint": "Aggregate per day first. A window function can wrap an aggregate: `sum(sum(…)) OVER (…)`.", "solution": "SELECT o.created_at::date AS day,\n       sum(i.qty * i.unit_price) AS revenue,\n       sum(sum(i.qty * i.unit_price))\n         OVER (ORDER BY o.created_at::date)\n         AS running_total\nFROM orders o\nJOIN order_items i ON i.order_id = o.id\nWHERE o.status = 'paid'\nGROUP BY o.created_at::date\nORDER BY day;\n", "expect": {"cols": ["day", "revenue", "running_total"], "rows": [["2026-03-01", 200.0, 200.0], ["2026-03-03", 300.0, 500.0], ["2026-03-04", 75.0, 575.0], ["2026-03-10", 60.0, 635.0], ["2026-03-12", 90.0, 725.0], ["2026-03-20", 220.0, 945.0], ["2026-03-28", 70.0, 1015.0], ["2026-04-02", 105.0, 1120.0], ["2026-04-05", 600.0, 1720.0]]
