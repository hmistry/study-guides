}, "insight": "Windows run after GROUP BY, so they see one row per day and can wrap the aggregate. The default RANGE frame is fine here because days are unique. Casting `timestamptz` to `date` uses the session time zone: order 11 (22:10 UTC) belongs to 2026-03-21 in Tokyo. Days with no orders are missing; join to `generate_series` to show them as 0.", "mysql": "Same query in MySQL 8. `DATE(created_at)` instead of `::date`, and MySQL's `TIMESTAMP` converts using the session `time_zone`."}, {"id": "repeat-within-10-days", "title": "Repeat purchases within 10 days", "variant": "disguise", "statement": "Find every paid order placed within 10 days (by calendar date) of the same user's **previous paid order**. Return `order_id`, `user_id` and `days_since_prev`, ordered by `order_id`.", "hint": "“The previous one” is a row in the same partition, one step back. Decide which rows exist before you look back.", "solution": "WITH paid AS (\n  SELECT id, user_id, created_at::date AS day,\n         lag(created_at::date) OVER (\n           PARTITION BY user_id ORDER BY created_at\n         ) AS prev_day\n  FROM orders\n  WHERE status = 'paid'\n)\nSELECT id AS order_id, user_id,\n       day - prev_day AS days_since_prev\nFROM paid\nWHERE day - prev_day <= 10\nORDER BY order_id;\n", "expect": {"cols": ["order_id", "user_id", "days_since_prev"], "rows": [[3, 1, 2], [7, 2, 9], [9, 1, 9]]}, "insight": "Two traps. Filter `status = 'paid'` **before** the window: filtered afterwards, Ben's order 7 compares with his cancelled order 6 (5 days). And a window result can't go in WHERE at the same level, hence the CTE. First orders have a NULL `prev_day`, and `NULL <= 10` is not true, so they drop out without extra code. `date - date` is an integer; `timestamptz - timestamptz` would be an interval.", "mysql": "Use `DATEDIFF(day, prev_day)`: plain subtraction of dates in MySQL is numeric nonsense."}], "part": "A"}, {"id": "recursive", "name": "Recursive CTEs", "signal": ["hierarchies: org charts, categories, threaded comments", "“everyone under …” / “the chain up to …”", "paths through a graph", "unknown depth", "generate rows from nothing (a sequence of dates)"], "idea": "`WITH RECURSIVE` runs an anchor query once, then repeatedly runs the recursive part against only the rows the previous step produced, stopping when a step returns nothing. The result is everything appended together. Depth and paths are columns you carry yourself, and so is the guard against cycles: real graphs have them, and without a guard the query never ends.", "diagram": {"type": "table", "caption": "WITH RECURSIVE team: everyone under Grace (see the first problem)", "cols": ["step", "name", "manager", "depth"], "rows": [["anchor", "Linus", "Grace", 1], ["anchor", "Ken", "Grace", 1], ["anchor", "Barbara", "Grace", 1], ["step 1", "Dennis", "Linus", 2]], "frames": [{"title": "Anchor", "expr": "SELECT id, name, 1 AS depth FROM employees WHERE manager_id = 2", "win": [0, 1, 2], "note": "The anchor runs once: Grace's direct reports become the first working table."}, {"title": "Step 1", "expr": "SELECT e.id, e.name, t.depth + 1 FROM employees e JOIN team t ON e.manager_id = t.id", "cur": 3, "win": [0, 1, 2], "note": "The recursive part joins against the **previous step's rows only** (highlighted), not the whole result. Linus has a report: Dennis, depth 2."}, {"title": "Step 2 · stop", "expr": "SELECT … JOIN team t ON e.manager_id = t.id   -- t is now just Dennis", "win": [3], "note": "Nobody reports to Dennis, so this step returns no rows and the recursion stops. The result is all four rows (UNION ALL of every step)."}]}, "snippets": [{"task": "Print a tree in order", "sql": "WITH RECURSIVE tree AS (\n  SELECT id, name, ARRAY[name] AS path\n  FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.id, e.name, t.path || e.name\n  FROM employees e JOIN tree t ON e.manager_id = t.id\n)\nSELECT repeat('  ', cardinality(path) - 1) || name AS org\nFROM tree\nORDER BY path;\n", "out": {"cols": ["org"], "rows": [["Ada"], ["  Grace"], ["    Barbara"], ["    Ken"], ["    Linus"], ["      Dennis"], ["  Margaret"], ["    Alan"], ["    Edsger"], ["  Radia"], ["    Frances"], ["    Hedy"]]}, "note": "Ordering by the accumulated path gives depth-first order. `SEARCH DEPTH FIRST BY name SET ord` (PG 14+) does the same declaratively."}, {"task": "Stop at cycles (CYCLE clause)", "since": "PG 14", "sql": "WITH RECURSIVE g(src, dst) AS (VALUES (1, 2), (2, 3), (3, 1)),\nwalk(node, depth) AS (\n  SELECT 1, 0\n  UNION ALL\n  SELECT g.dst, w.depth + 1 FROM walk w JOIN g ON g.src = w.node\n) CYCLE node SET is_cycle USING path\nSELECT node, depth, is_cycle FROM walk ORDER BY depth;\n", "out": {"cols": ["node", "depth", "is_cycle"], "rows": [[1, 0, false], [2, 1, false], [3, 2, false], [1, 3, true]]}, "note": "The row that closes the loop is emitted with `is_cycle = true` and not expanded further. Before PG 14: carry an array path and add `WHERE NOT next = ANY(path)`."}, {"task": "Generate rows without a table", "sql": "WITH RECURSIVE n(i) AS (\n  SELECT 1\n  UNION ALL\n  SELECT i + 1 FROM n WHERE i < 5\n)\nSELECT string_agg(i::text, ',') AS numbers FROM n;\n", "out": {"cols": ["numbers"], "rows": [["1,2,3,4,5"]]}, "note": "In Postgres, `generate_series` is simpler; the recursive form is the portable one (MySQL has no generate_series)."}], "pitfalls": ["**No cycle guard.** A single bad row (an employee who manages their own manager, a category that is its own ancestor) makes the query run until it hits memory or `statement_timeout`. Add `CYCLE`, a path check, or at least a depth limit.", "**UNION instead of UNION ALL.** UNION deduplicates each step against everything so far, which can hide a cycle but costs a hash of the whole result every iteration. Use UNION ALL plus an explicit guard.", "**Filtering in the outer query instead of the recursion.** `WHERE depth <= 3` outside still computes the full tree. Put the limit in the recursive part's WHERE.", "**Unindexed parent column.** Each step joins on `manager_id` (or `parent_id`); without an index, every level is a full scan.", "**Type mismatches between anchor and recursive part.** `'Ann'` in the anchor and `t.path || ' > ' || name` in the recursion can disagree (`unknown` vs `text`, `varchar(10)` vs `text`). Cast in the anchor: `name::text`."], "mysql": ["`WITH RECURSIVE` needs MySQL 8.0. No CYCLE or SEARCH clauses; recursion stops at `cte_max_recursion_depth` (1000 by default) with an error.", "No arrays for paths: build a delimited string with `CONCAT` and check it with `FIND_IN_SET` or `LOCATE`."], "problems": [{"id": "reporting-chain", "title": "Everyone under Grace", "variant": "canonical", "statement": "List everyone who reports to Grace directly or indirectly, with their depth (1 = direct report). Columns `name`, `depth`, ordered by depth then name.", "hint": "Anchor: Grace's direct reports. Recursive step: employees whose manager is in the previous step.", "solution": "WITH RECURSIVE team AS (\n  SELECT id, name, 1 AS depth\n  FROM employees\n  WHERE manager_id = (SELECT id FROM employees\n                      WHERE name = 'Grace')\n  UNION ALL\n  SELECT e.id, e.name, t.depth + 1\n  FROM employees e\n  JOIN team t ON e.manager_id = t.id\n)\nSELECT name, depth\nFROM team\nORDER BY depth, name;\n", "expect": {"cols": ["name", "depth"], "rows": [["Barbara", 1], ["Ken", 1], ["Linus", 1], ["Dennis", 2]]}, "insight": "Downward traversal: the join condition points from child to the previous level (`e.manager_id = t.id`). The anchor uses a scalar subquery, which is safe only if names are unique; real code passes the id. Add `WHERE t.depth < 10` in the recursive part if bad data could loop.", "mysql": "Same query on 8.0."}, {"id": "referral-chain", "title": "Referral chains", "variant": "disguise", "statement": "For every user who was referred by someone, show the full chain back to the original referrer as text, like `Dev ← Ben ← Ana`, and the number of hops. Columns `name`, `chain`, `hops`, ordered by user id.", "hint": "This one walks **up** the tree. Carry the starting user and the growing string along, and keep the rows where there's nobody left to follow.", "solution": "WITH RECURSIVE up AS (\n  SELECT id AS start_id, referred_by AS next_id,\n         name::text AS chain, 0 AS hops\n  FROM users\n  WHERE referred_by IS NOT NULL\n  UNION ALL\n  SELECT up.start_id, r.referred_by,\n         up.chain || ' ← ' || r.name, up.hops + 1\n  FROM up\n  JOIN users r ON r.id = up.next_id\n)\nSELECT u.name, up.chain, up.hops\nFROM up\nJOIN users u ON u.id = up.start_id\nWHERE up.next_id IS NULL\nORDER BY u.id;\n", "expect": {"cols": ["name", "chain", "hops"], "rows": [["Ben", "Ben ← Ana", 1], ["Chloe", "Chloe ← Ana", 1], ["Dev", "Dev ← Ben ← Ana", 2], ["Gia", "Gia ← Chloe ← Ana", 2]]}, "insight": "Every user starts their own walk; each step follows `referred_by` one level up. Intermediate rows (`Dev ← Ben`, still pointing at Ana) are part of the result too, so the outer query keeps only finished walks: `next_id IS NULL`. The `name::text` cast in the anchor fixes the column type for the concatenation. If a referral loop were possible, the walk would never finish: guard with `hops < 50` or `CYCLE next_id SET …`.", "mysql": "Use `CONCAT(up.chain, ' ← ', r.name)` and cast the anchor with `CAST(name AS CHAR(1000))`: the column type comes from the anchor, so longer chains fail with “Data too long” in strict mode."}], "part": "A"}, {"id": "patterns", "name": "Classic Query Patterns", "signal": ["“top N per …”", "“latest / first … for each”", "streaks, consecutive days, “gaps”", "sessions, visits, activity bursts", "funnels, retention, medians"], "idea": "A handful of shapes cover most interview queries, and nearly all of them are window functions plus one trick. Top-N per group ranks within a partition; gaps and islands subtract a row number from a sequence to get a constant per run; sessionization flags “new session” rows with LAG and numbers them with a running sum. Recognize the shape first, then write it.", "diagram": {"type": "table", "partition": false, "caption": "gaps and islands: one user's active days → runs of consecutive days", "cols": ["day"], "rows": [["2026-03-01"], ["2026-03-02"], ["2026-03-03"], ["2026-03-05"], ["2026-03-06"], ["2026-03-09"]], "frames": [{"title": "Active days", "expr": "SELECT d FROM days ORDER BY d", "win": [0, 1, 2, 3, 4, 5], "note": "Find the runs of consecutive days: 1–3, 5–6, and 9 on its own."}, {"title": "row_number()", "expr": "row_number() OVER (ORDER BY d)", "col": "rn", "out": ["1", "2", "3", "4", "5", "6"], "win": [0, 1, 2, 3, 4, 5], "note": "Inside a run, the day and the row number both go up by exactly 1."}, {"title": "day − row_number", "expr": "d - row_number() OVER (ORDER BY d)::int AS island", "col": "island", "out": ["2026-02-28", "2026-02-28", "2026-02-28", "2026-03-01", "2026-03-01", "2026-03-03"], "win": [0, 1, 2], "note": "So their difference is constant within a run and jumps at every gap. It's a meaningless date, but a perfect group key."}, {"title": "GROUP BY island", "expr": "SELECT min(d), max(d), count(*) FROM … GROUP BY island", "col": "run", "out": ["Mar 1 → 3 (3 days)", "", "", "Mar 5 → 6 (2 days)", "", "Mar 9 (1 day)"], "win": [3, 4], "note": "Group by the key and take min, max and count. The same trick works on integer sequences (ids, ticket numbers) and with `dense_rank` when a day can repeat."}]}, "tables": [{"title": "Pattern → technique", "cols": ["Pattern", "Technique", "Note"], "rows": [["Top N per group", "`rank()` / `row_number() OVER (PARTITION BY g ORDER BY x DESC)`, then `WHERE r <= N` outside", "`rank` keeps ties; `LATERAL … LIMIT N` per group with an index"], ["Latest row per key", "`DISTINCT ON (key) … ORDER BY key, at DESC`", "Postgres-only; the ORDER BY must start with the DISTINCT ON keys"], ["Deduplicate, keep one", "`row_number() OVER (PARTITION BY dup_cols ORDER BY id)`, delete `rn > 1`", "Or `DELETE … USING` a self-join (see Writing Data)"], ["Gaps and islands", "`value - row_number()` as a group key", "Use `dense_rank` if values repeat"], ["Sessionization", "flag `at - lag(at) >= gap`, then running `sum(flag)` as session id", "First row's LAG is NULL: treat it as a new session"], ["Pivot", "`count(*) FILTER (WHERE col = 'x') AS x` per value", "Columns must be known when you write the query"], ["Funnel", "`count(DISTINCT user_id) FILTER (WHERE step = …)`", "For ordered funnels, compare each user's first time at each step"], ["Retention / cohorts", "cohort = `date_trunc('week', first_seen)`; activity week − cohort week; count distinct users", "Build per-user first_seen in a CTE first"], ["Median, percentiles", "`percentile_cont(0.5) WITHIN GROUP (ORDER BY x)`", "`percentile_disc` returns an actual value; both sort the whole group"]]}], "snippets": [{"task": "Latest row per key (DISTINCT ON)", "sql": "SELECT DISTINCT ON (user_id) user_id, type, at\nFROM events\nORDER BY user_id, at DESC;\n", "out": {"cols": ["user_id", "type", "at"], "rows": [[1, "add_to_cart", "2026-03-12 11:40:00+00"], [2, "checkout", "2026-03-10 08:04:00+00"], [3, "checkout", "2026-03-20 09:29:00+00"], [5, "checkout", "2026-04-05 07:49:00+00"], [8, "view", "2026-03-15 11:30:00+00"]]}}, {"task": "Gaps and islands", "sql": "WITH days(d) AS (\n  VALUES (date '2026-03-01'), ('2026-03-02'), ('2026-03-03'),\n         ('2026-03-05'), ('2026-03-06'), ('2026-03-09')\n), grouped AS (\n  SELECT d, d - (row_number() OVER (ORDER BY d))::int AS island\n  FROM days\n)\nSELECT min(d) AS first_day, max(d) AS last_day, count(*) AS days\nFROM grouped\nGROUP BY island\nORDER BY first_day;\n", "out": {"cols": ["first_day", "last_day", "days"], "rows": [["2026-03-01", "2026-03-03", 3], ["2026-03-05", "2026-03-06", 2], ["2026-03-09", "2026-03-09", 1]]}}, {"task": "Funnel counts", "sql": "SELECT count(DISTINCT user_id) FILTER (WHERE type = 'view')        AS viewed,\n       count(DISTINCT user_id) FILTER (WHERE type = 'add_to_cart') AS carted,\n       count(DISTINCT user_id) FILTER (WHERE type = 'checkout')    AS checked_out\nFROM events;\n", "out": {"cols": ["viewed", "carted", "checked_out"], "rows": [[5, 4, 4]]}}, {"task": "Median vs mean", "sql": "SELECT dept,\n       percentile_cont(0.5) WITHIN GROUP (ORDER BY salary) AS median,\n       avg(salary)::int AS mean\nFROM employees\nGROUP BY dept\nORDER BY dept;\n", "out": {"cols": ["dept", "median", "mean"], "rows": [["eng", 160000, 154000], ["exec", 250000, 250000], ["ops", 110000, 116667], ["sales", 95000, 113333]]}}], "pitfalls": ["**ROW_NUMBER when ties matter.** “Top 2 earners” with `row_number` picks one of two people tied for second at random. Ask whether ties are in; use `rank` or `dense_rank` if so.", "**Filtering the window in the same SELECT.** `WHERE rank() OVER (…) <= 2` is an error. Rank in a subquery or CTE, filter outside.", "**Sessionizing without a partition.** LAG over all users compares one user's event with another's. `PARTITION BY user_id ORDER BY at`.", "**Gaps and islands on timestamps.** Subtract row numbers from a **day** (or an integer), not a timestamp; and if a day can appear twice, deduplicate first or use `dense_rank`.", "**DISTINCT ON without a full ORDER BY.** The row kept per key is whichever comes first in the ORDER BY; leave out the tiebreak and it's arbitrary.", "**Percentiles on huge groups.** `percentile_cont` sorts every value in the group. For dashboards, use approximate sketches (t-digest extensions) or pre-aggregate."], "mysql": ["No `DISTINCT ON`: use `ROW_NUMBER() … = 1` in a subquery.", "No `percentile_cont`: compute a median with `ROW_NUMBER` and `COUNT` (middle row or average of the two middle rows).", "Date minus a number: `DATE_SUB(d, INTERVAL rn DAY)` for gaps and islands."], "problems": [{"id": "top-two-salaries", "title": "Top two salaries per department", "variant": "canonical", "statement": "The two highest-paid employees in each department; if people tie, include everyone tied. Columns `dept`, `name`, `salary`, ordered by department, then salary (highest first), then name.", "hint": "Number within each department, but the numbering must give tied salaries the same number.", "solution": "SELECT dept, name, salary\nFROM (\n  SELECT dept, name, salary,\n         rank() OVER (PARTITION BY dept\n                      ORDER BY salary DESC) AS r\n  FROM employees\n) ranked\nWHERE r <= 2\nORDER BY dept, salary DESC, name;\n", "expect": {"cols": ["dept", "name", "salary"], "rows": [["eng", "Grace", 190000], ["eng", "Ken", 160000], ["eng", "Linus", 160000], ["exec", "Ada", 250000], ["ops", "Radia", 130000], ["ops", "Frances", 110000], ["ops", "Hedy", 110000], ["sales", "Margaret", 150000], ["sales", "Alan", 95000], ["sales", "Edsger", 95000]]}, "insight": "`rank` keeps both people tied for second in every department; `row_number` would silently drop Ken or Linus. `dense_rank() <= 2` answers a different question, the top two distinct salaries: if two people tied for first, it would also return the next salary down, while `rank` stops at the two. Say which one you're answering.", "mysql": "Same query on 8.0."}, {"id": "sessions-per-user", "title": "Visits per user", "variant": "disguise", "statement": "Marketing wants the number of **visits** per user from `events`. A visit ends when the user is inactive for 30 minutes or more. Columns `user_id`, `sessions`, ordered by `user_id`.", "hint": "Mark each event that starts a new visit: compare it with the same user's previous event. Then count the marks.", "solution": "WITH marked AS (\n  SELECT user_id,\n         CASE WHEN at - lag(at) OVER w\n                   < interval '30 minutes'\n              THEN 0 ELSE 1 END AS starts_session\n  FROM events\n  WINDOW w AS (PARTITION BY user_id ORDER BY at)\n)\nSELECT user_id, sum(starts_session) AS sessions\nFROM marked\nGROUP BY user_id\nORDER BY user_id;\n", "expect": {"cols": ["user_id", "sessions"], "rows": [[1, 3], [2, 2], [3, 2], [5, 3], [8, 2]]}, "insight": "Sessionization. A user's first event has a NULL LAG, so the comparison is NULL and the CASE falls to ELSE: a new session, which is right. Emma's 35-minute gap splits one evening into two visits; Hugo's 70-minute gap does the same. To label each event with its session, take a running `sum(starts_session) OVER (PARTITION BY user_id ORDER BY at)` instead of the total.", "mysql": "`TIMESTAMPDIFF(MINUTE, LAG(at) OVER w, at) < 30` instead of the interval comparison."}], "part": "A"}, {"id": "writes", "name": "Writing Data", "signal": ["“insert, or update if it exists”", "counters and idempotent writes", "sync a table from a feed", "remove duplicates", "backfill or purge millions of rows"], "idea": "Writes are where correctness and concurrency meet. `INSERT … ON CONFLICT` is an atomic upsert keyed by a unique index; `RETURNING` hands back what a statement changed without a second query; `UPDATE … FROM` and `DELETE … USING` join to other tables. Big changes go in batches, so locks, WAL and replica lag stay bounded.", "tables": [{"title": "Upsert options", "cols": ["Statement", "Does", "Concurrency"], "rows": [["`INSERT … ON CONFLICT (key) DO NOTHING`", "Insert unless the key exists", "Atomic against concurrent inserts; returns no row on conflict"], ["`INSERT … ON CONFLICT (key) DO UPDATE SET … EXCLUDED.col`", "Insert or update the existing row", "Atomic; locks the existing row; can't touch the same row twice in one statement"], ["`MERGE INTO t USING s ON … WHEN MATCHED / NOT MATCHED`", "Full sync: insert, update, delete per match (PG 15+)", "Not race-free: concurrent inserts can still raise unique violations"], ["`UPDATE`, then `INSERT` if 0 rows", "App-side upsert", "Races: two sessions both see 0 rows; needs a retry on 23505"]]}], "snippets": [{"task": "Get generated values back", "sql": "INSERT INTO products (name, category, price)\nVALUES ('Cable', 'peripherals', 9.50)\nRETURNING id, name;\n", "out": {"cols": ["id", "name"], "rows": [[9, "Cable"]]}}, {"task": "DO NOTHING returns nothing", "sql": "INSERT INTO users (email, name, created_at)\nVALUES ('ana@example.com', 'Ana', now())\nON CONFLICT (email) DO NOTHING\nRETURNING id;\n", "out": {"cols": ["id"], "rows": []}, "note": "On conflict, RETURNING yields no row, so “get or create” needs a follow-up SELECT (or `DO UPDATE SET email = EXCLUDED.email` to force a row back, at the cost of a write)."}, {"task": "Update from another table (UPDATE … FROM)", "sql": "UPDATE products p\nSET price = v.price\nFROM (VALUES (1, 110.00), (2, 35.00)) AS v(id, price)\nWHERE p.id = v.id\nRETURNING p.id, p.name, p.price;\n", "out": {"cols": ["id", "name", "price"], "rows": [[1, "Mechanical keyboard", 110.0], [2, "Wireless mouse", 35.0]], "order": false}}, {"task": "Sync from a feed (MERGE)", "since": "PG 15", "sql": "MERGE INTO products p\nUSING (VALUES ('Webcam', 75.00), ('Ring light', 50.00)) AS s(name, price)\nON p.name = s.name\nWHEN MATCHED THEN UPDATE SET price = s.price\nWHEN NOT MATCHED THEN INSERT (name, category, price)\n                      VALUES (s.name, 'peripherals', s.price);\nSELECT name, price FROM products\nWHERE name IN ('Webcam', 'Ring light')\nORDER BY name;\n", "out": {"cols": ["name", "price"], "rows": [["Ring light", 50.0], ["Webcam", 75.0]]}}, {"task": "Copy rows into another table", "sql": "CREATE TABLE orders_archive (LIKE orders INCLUDING ALL);\nINSERT INTO orders_archive\nSELECT * FROM orders WHERE status = 'cancelled';\nSELECT count(*) AS archived FROM orders_archive;\n", "out": {"cols": ["archived"], "rows": [[2]]}}, {"task": "Delete in batches", "sql": "DELETE FROM events\nWHERE id IN (\n  SELECT id FROM events\n  WHERE at < '2026-03-05'\n  ORDER BY id\n  LIMIT 1000\n);\n", "note": "Run it in a loop (one transaction per batch) until it deletes 0 rows, pausing between batches so replicas and autovacuum keep up. For time-partitioned data, dropping a whole partition is instant."}], "pitfalls": ["**ON CONFLICT needs a matching unique index.** The conflict target must match a unique index or constraint exactly, including a partial index's predicate (`ON CONFLICT (user_id) WHERE status = 'cart'`).", "**Touching one row twice in an upsert.** If the input has the same key twice, `DO UPDATE` fails (“cannot affect row a second time”). Deduplicate the input first.", "**UPDATE … FROM with several matching source rows** updates the target once with an arbitrary match, without an error. Make the source unique per key. (MERGE raises an error in this case.)", "**One giant UPDATE or DELETE.** Millions of rows in one transaction hold locks for minutes, write a burst of WAL that replicas lag behind, and leave dead rows for VACUUM. Batch by key range.", "**Assuming ids are gapless.** Failed and rolled-back inserts still consume sequence values. Never use ids as invoice numbers or counts.", "**Read-then-write upserts in the app.** `SELECT`, then `INSERT` if missing, races under concurrency. Let ON CONFLICT do it in one statement."], "mysql": ["`INSERT … ON DUPLICATE KEY UPDATE` fires on a conflict with **any** unique key, not a chosen one. Reference the new values as `VALUES(col)` (deprecated) or a row alias (8.0.19+).", "`REPLACE INTO` deletes and re-inserts: it fires DELETE cascades and gives the row a new auto-increment id.", "No RETURNING and no MERGE. Multi-table updates use `UPDATE a JOIN b ON … SET …`; `DELETE … LIMIT n` works directly."], "problems": [{"id": "view-counter-upsert", "title": "View counters in one statement", "variant": "canonical", "statement": "`product_views(product_id, views)` (see Setup) holds a counter per product. Record one view of product 1 and one of product 3 in a **single statement**: increment existing counters, create missing ones at 1.", "hint": "Insert the new counts; on a key conflict, add the incoming value to the stored one.", "setup": "CREATE TABLE product_views (\n  product_id bigint PRIMARY KEY REFERENCES products (id),\n  views      int NOT NULL\n);\nINSERT INTO product_views VALUES (1, 10);\n", "solution": "INSERT INTO product_views (product_id, views)\nVALUES (1, 1), (3, 1)\nON CONFLICT (product_id)\nDO UPDATE SET views = product_views.views\n                      + EXCLUDED.views;\n", "check": "SELECT product_id, views FROM product_views ORDER BY product_id", "expect": {"cols": ["product_id", "views"], "rows": [[1, 11], [3, 1]]}, "insight": "`EXCLUDED` is the row that would have been inserted; the bare table name is the existing row. The increment happens under the row lock, so concurrent upserts compose instead of losing counts. For a very hot counter (one row hammered by thousands of writers), the row lock serializes them: shard the counter into N rows and sum on read, or buffer increments and flush periodically.", "mysql": "`INSERT INTO product_views VALUES (1, 1), (3, 1) AS new ON DUPLICATE KEY UPDATE views = product_views.views + new.views` (8.0.19+)."}, {"id": "delete-duplicates", "title": "Delete duplicate events", "variant": "disguise", "statement": "A retrying client inserted some events twice (see Setup). Delete the duplicates, where a duplicate has the same `user_id`, `type` and `at`, **keeping the earliest** (lowest id) copy of each.", "hint": "A row should go if another row exists that's identical but has a smaller id.", "setup": "INSERT INTO events (user_id, type, at) VALUES\n  (1, 'view', '2026-03-01 09:00Z'),\n  (1, 'view', '2026-03-01 09:00Z'),\n  (8, 'view', '2026-03-15 10:20Z');\n", "solution": "DELETE FROM events e\nUSING events keep\nWHERE keep.user_id = e.user_id\n  AND keep.type = e.type\n  AND keep.at = e.at\n  AND keep.id < e.id;\n", "check": "SELECT count(*) AS events, count(DISTINCT (user_id, type, at)) AS distinct_events, max(id) AS max_id FROM events", "expect": {"cols": ["events", "distinct_events", "max_id"], "rows": [[24, 24, 24]]}, "insight": "A self-join delete: each row with an older twin goes, so triplicates are handled too. The window version is `DELETE FROM events WHERE id IN (SELECT id FROM (SELECT id, row_number() OVER (PARTITION BY user_id, type, at ORDER BY id) AS rn FROM events) d WHERE rn > 1)`. Then stop it recurring: add `UNIQUE (user_id, type, at)` (or an idempotency key) and make the client's insert `ON CONFLICT DO NOTHING`.", "mysql": "`DELETE e FROM events e JOIN events keep ON … AND keep.id < e.id` (multi-table DELETE syntax)."}], "part": "A"}, {"id": "schema-design", "name": "Schema Design", "signal": ["“design the tables for …”", "choosing primary keys: bigint, UUID, natural", "multi-tenant SaaS data", "attributes that vary per item (JSON?)", "“should we denormalize this?”"], "idea": "Normalize until each fact lives in one place, then denormalize only for a measured read path, with a plan for keeping the copies in sync. The choices that are hard to undo are key type and ordering, the tenancy layout, and what is a column versus a JSON field. Start from the access patterns: list the top queries, their cardinalities and the invariants before drawing tables.", "numbers": [{"k": "Key size", "v": "bigint 8 B · uuid 16 B, in every index and FK"}, {"k": "Row overhead", "v": "~23 B header + alignment per row version"}, {"k": "TOAST", "v": "values over ~2 KB are compressed or stored out of line"}, {"k": "Columns per table", "v": "max 1600; wide rows cost every update"}], "tables": [{"title": "Primary key choices", "cols": ["Key", "Size", "Insert pattern", "Use when"], "rows": [["`bigint` identity", "8 B", "Increasing: compact B-tree, writes hit the right edge", "One database generates ids; default choice"], ["UUIDv4 (`gen_random_uuid()`)", "16 B", "Random: page splits, cache misses, more WAL", "Legacy; prefer v7"], ["UUIDv7 (`uuidv7()`, PG 18)", "16 B", "Time-ordered: B-tree friendly", "Ids made by clients or many services; safe to expose (but reveals creation time)"], ["Natural key (code, email)", "varies", "Depends", "Only truly immutable codes (ISO country, currency). Emails and usernames change"], ["Composite `(tenant_id, id)`", "16 B", "Per tenant", "Multi-tenant: makes cross-tenant references impossible and lines up with sharding"]]}, {"title": "Normal forms in practice", "cols": ["Rule", "Violation smell", "Fix"], "rows": [["**1NF**: one value per column, no repeating groups", "`tags = 'a,b,c'`; `phone1, phone2, phone3`", "A child table (or an array / JSONB when you never join on it)"], ["**2NF**: non-key columns depend on the whole key", "`order_items.product_name` depends only on `product_id`", "Keep it in `products`"], ["**3NF**: no column depends on another non-key column", "`users.zip` and `users.city`", "Look up city from zip, or accept the duplication knowingly"], ["**Not a violation**: snapshots", "`order_items.unit_price` vs `products.price`", "Price paid is a different fact from today's price: keep both"]]}, {"title": "Multi-tenant layouts", "cols": ["Layout", "Isolation", "Scales to", "Cost"], "rows": [["Shared tables + `tenant_id`", "Row level (app + RLS)", "Millions of tenants; shards by tenant", "Every key, index and query must lead with `tenant_id`"], ["Schema per tenant", "Namespace", "Hundreds to low thousands", "Catalog bloat; every migration runs N times"], ["Database per tenant", "Strong; per-tenant backup and restore", "Tens to hundreds per server", "Connections per database; cross-tenant reporting is hard"]]}, {"title": "Column or JSONB?", "cols": ["Make it a column when", "Keep it in JSONB when"], "rows": [["You filter, join, sort or aggregate on it", "It's sparse or user-defined (custom fields)"], ["It needs a type, NOT NULL, CHECK or FK", "It's a payload you store and return whole (webhooks, API responses)"], ["The planner needs statistics for it", "Its shape changes often and nobody queries inside it"]]}], "snippets": [{"task": "Generated (computed) column", "sql": "ALTER TABLE order_items\n  ADD COLUMN line_total numeric GENERATED ALWAYS AS (qty * unit_price) STORED;\nSELECT order_id, product_id, line_total\nFROM order_items WHERE order_id = 5 ORDER BY product_id;\n", "out": {"cols": ["order_id", "product_id", "line_total"], "rows": [[5, 2, 40.0], [5, 4, 35.0]]}, "note": "Derived data the database keeps in sync. STORED computes on write, and adding it rewrites the table; PG 18 adds VIRTUAL (computed on read), which becomes the default."}, {"task": "Reading JSONB", "sql": "SELECT doc ->> 'plan' AS plan,\n       (doc -> 'seats')::int + 1 AS seats,\n       doc @> '{\"plan\": \"pro\"}' AS is_pro\nFROM (VALUES ('{\"plan\": \"pro\", \"seats\": 5}'::jsonb)) AS t(doc);\n", "out": {"cols": ["plan", "seats", "is_pro"], "rows": [["pro", 6, true]]}, "note": "`->` returns JSONB, `->>` returns text. `@>` (containment) is what a GIN index accelerates."}, {"task": "Time-ordered UUIDs", "since": "PG 18", "sql": "SELECT uuidv7() < uuidv7() AS time_ordered;", "out": {"cols": ["time_ordered"], "rows": [[true]]}, "note": "Before PG 18, generate UUIDv7 in the app or with an extension."}, {"task": "Soft delete with unique live emails", "sql": "ALTER TABLE users ADD COLUMN deleted_at timestamptz;\nALTER TABLE users DROP CONSTRAINT users_email_key;\nCREATE UNIQUE INDEX users_email_live ON users (email) WHERE deleted_at IS NULL;\n"}, {"task": "Tenant isolation with row-level security", "sql": "CREATE TABLE notes (tenant_id bigint NOT NULL, body text);\nALTER TABLE notes ENABLE ROW LEVEL SECURITY;\nCREATE POLICY tenant_isolation ON notes\n  USING (tenant_id = current_setting('app.tenant_id')::bigint);\n", "note": "Set the tenant per transaction with `SET LOCAL app.tenant_id = '42'` (works with transaction pooling). Table owners and superusers bypass RLS unless `FORCE ROW LEVEL SECURITY`."}], "pitfalls": ["**Entity-attribute-value tables** (`entity_id, attribute, value text`). Every read becomes a pivot, nothing is typed or constrained, and the planner can't estimate anything. Use JSONB for truly dynamic attributes.", "**Polymorphic foreign keys** (`commentable_type`, `commentable_id`) can't have a real FK. Use one nullable FK column per parent type plus `CHECK (num_nonnulls(post_id, photo_id) = 1)`, or separate link tables.", "**Soft delete everywhere.** Every query needs `deleted_at IS NULL`, unique constraints become partial, and FKs keep pointing at “deleted” rows. Prefer archiving to another table, or anonymizing, unless undelete is a real feature.", "**Stored totals with no sync plan.** `orders.total` drifts from its items the first time someone fixes an item by hand. Compute it, use a generated column or a trigger, or document who owns the copy.", "**Random UUIDv4 keys on big, write-heavy tables**: every insert lands on a random page, so indexes bloat and cache hit rates drop.", "**Comma lists in a text column.** No FK, no index, and `LIKE '%,5,%'` everywhere. Use a link table."], "depth": ["**Design from access patterns.** For each top query: what it filters by, how many rows it touches, how often it runs. That decides keys, which indexes exist, and where you denormalize.", "**Snapshots aren't denormalization.** Price paid, shipping address at order time and tax rate applied are facts about the order. Copying them is correct; reading them live from `products` would rewrite history.", "**Tenant id in every key.** Composite keys `(tenant_id, id)` and FKs that include `tenant_id` make cross-tenant references impossible by construction, and match how Citus and app-level sharding distribute data.", "**Split hot columns from wide rows.** Counters and `last_seen_at` updated constantly belong in a narrow 1:1 table: updates stay HOT, and you don't rewrite a 2 KB row to bump an integer.", "**Read models.** Materialized views (`REFRESH MATERIALIZED VIEW CONCURRENTLY` needs a unique index) or summary tables maintained by jobs give fast dashboards with stated staleness, without denormalizing the write model.", "**Plan for deletion and privacy.** Decide early how a user is erased (GDPR): hard delete with cascades, or anonymize the row and keep its key for history. It shapes every FK action."], "mysql": ["InnoDB clusters rows by primary key, so random UUID keys hurt even more, and every secondary index carries the PK. `UUID_TO_BIN(uuid, 1)` reorders a v1 UUID's time bits for locality.", "JSON columns are indexed through generated columns or multi-valued indexes (8.0.17+), not GIN.", "No row-level security: tenant scoping lives in the app, views, or a proxy.", "ENUM is common and compact; adding a value at the end is instant in 8.0, other changes rebuild the table."], "checks": [{"q": "A SaaS app keeps every tenant in shared tables. What should keys, foreign keys and indexes look like?", "a": "Lead everything with `tenant_id`: primary keys `(tenant_id, id)`, foreign keys `(tenant_id, parent_id) REFERENCES parent (tenant_id, id)`, and indexes starting with `tenant_id`. Then a row can't reference another tenant's row, every query is scoped by the leading index column, and the table is ready to shard by tenant. Add RLS as a safety net against a missing WHERE."}, {"q": "Product attributes vary by category: shoe size, screen resolution, wattage. Columns, EAV, or JSONB?", "a": "JSONB for the varying attributes, with a GIN index for containment queries (`attrs @> '{\"size\": 42}'`). Promote attributes that are filtered or sorted on constantly to real columns or expression indexes, so they get types and statistics. Validate shape with CHECK constraints (`jsonb_typeof`) or in the app. EAV gives you the costs of both and the benefits of neither."}, {"q": "Isn't `order_items.unit_price` a duplicate of `products.price` that should be removed?", "a": "No. It records what the customer paid, which is a different fact from today's price. Removing it would make old invoices change whenever the catalog does."}, {"q": "Why might a team choose UUIDv7 over `bigint` identity, and what does it cost?", "a": "Ids can be generated anywhere (clients, many services, offline) without a round trip, datasets merge without collisions, and ids can be exposed without revealing counts. Unlike v4 they're time-ordered, so B-tree inserts stay local. The costs: 16 bytes in every key, index and FK, slightly slower comparisons, and the id leaks its creation time."}, {"q": "Users can be deleted, but emails must stay unique among active users, and old orders must keep pointing at their user. Design it.", "a": "Keep the user row and mark it: `deleted_at timestamptz`, with a partial unique index `ON users (email) WHERE deleted_at IS NULL`. Orders keep their FK. For privacy erasure, scrub personal fields (email, name) instead of deleting the row. Use ON DELETE RESTRICT on orders so a hard delete can't silently cascade away history."}], "problems": [{"id": "tags-many-to-many", "title": "Product tags", "variant": "canonical", "statement": "Products can have many tags and a tag many products. Create `tags` (generated `id`, unique `name`) and `product_tags` linking them: no duplicate links, links to missing rows rejected, deleting a product or a tag removes its links, and “products with tag X” must be fast.", "hint": "The link table's primary key covers lookups by its first column. What about the second?", "solution": "CREATE TABLE tags (\n  id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name text NOT NULL UNIQUE\n);\nCREATE TABLE product_tags (\n  product_id bigint NOT NULL\n             REFERENCES products (id) ON DELETE CASCADE,\n  tag_id     bigint NOT NULL\n             REFERENCES tags (id) ON DELETE CASCADE,\n  PRIMARY KEY (product_id, tag_id)\n);\nCREATE INDEX product_tags_tag_id_idx\n  ON product_tags (tag_id);\n", "tests": [{"sql": "INSERT INTO tags (name) VALUES ('sale'), ('new')", "ok": true}, {"sql": "INSERT INTO tags (name) VALUES ('sale')", "error": "unique_violation"}, {"sql": "INSERT INTO product_tags VALUES (1, 1)", "ok": true}, {"sql": "INSERT INTO product_tags VALUES (1, 1)", "error": "unique_violation", "note": "duplicate link"}, {"sql": "INSERT INTO product_tags VALUES (99, 1)", "error": "foreign_key_violation"}, {"sql": "INSERT INTO product_tags VALUES (8, 2)", "ok": true}, {"sql": "DELETE FROM tags WHERE name = 'new'", "ok": true, "note": "removes the (8, 2) link"}, {"sql": "SELECT product_id FROM product_tags WHERE tag_id = 1", "uses_index": "product_tags_tag_id_idx"}], "check": "SELECT product_id, tag_id FROM product_tags ORDER BY product_id, tag_id", "expect": {"cols": ["product_id", "tag_id"], "rows": [[1, 1]]}, "insight": "The composite primary key prevents duplicate links and serves “tags of product X”; the reverse question needs its own index on `tag_id`. CASCADE fits link rows, which mean nothing without both ends. The simpler alternative, `products.tags text[]` with a GIN index, is fine when tags are free-form labels: you lose renames, tag metadata and referential integrity.", "mysql": "Same design; InnoDB creates an index for each FK automatically if none exists."}], "part": "B"}, {"id": "constraints", "name": "Constraints & Integrity", "signal": ["“this must never happen” rules", "double bookings, overlapping ranges", "values that must reference something", "adding a rule to a huge existing table", "reordering items that must stay unique"], "idea": "Constraints are the only rules that hold for every writer, at every isolation level, forever. NOT NULL, CHECK, UNIQUE, FOREIGN KEY and EXCLUDE cover most invariants, and unique and exclusion checks also see concurrent uncommitted rows, which no application check can. What they can't express (a sum across rows) needs locking or Serializable. On live tables, add them as NOT VALID, then VALIDATE.", "tables": [{"title": "Constraint kinds", "cols": ["Constraint", "Enforces", "Cost / caveat"], "rows": [["**NOT NULL**", "A value is present", "Cheapest; prefer it to `CHECK (x IS NOT NULL)`"], ["**CHECK**", "A condition on one row: `price > 0`, `ends_at > starts_at`", "Can't look at other rows or tables; a function that does is never rechecked"], ["**UNIQUE / PRIMARY KEY**", "No duplicate values", "Backed by a unique index; NULLs don't collide unless `NULLS NOT DISTINCT` (PG 15+)"], ["**FOREIGN KEY**", "The referenced row exists", "Takes a KEY SHARE lock on the parent row; index the child column yourself"], ["**EXCLUDE**", "No two rows conflict by given operators (overlap)", "GiST index; `btree_gist` for `=` on plain columns"]]}, {"title": "Foreign key actions", "cols": ["ON DELETE", "Effect", "Use for"], "rows": [["`NO ACTION` (default)", "Error if children exist; checked at end of statement, can be deferred", "Most references"], ["`RESTRICT`", "Error immediately, never deferred", "History you must not lose (orders → users)"], ["`CASCADE`", "Delete the children too", "Owned data: line items, sessions, link rows"], ["`SET NULL` / `SET DEFAULT`", "Detach the children", "Optional relations (an assignee who left)"]]}, {"title": "Adding constraints to a live table", "cols": ["Constraint", "Blocking way", "Online way"], "rows": [["CHECK", "`ADD CONSTRAINT … CHECK (…)`: full scan under ACCESS EXCLUSIVE", "`ADD … NOT VALID` (instant), then `VALIDATE CONSTRAINT` (reads and writes continue)"], ["FOREIGN KEY", "`ADD … REFERENCES`: scan, locks both tables", "`NOT VALID`, then `VALIDATE` (index the child column first)"], ["NOT NULL", "`SET NOT NULL`: full scan under ACCESS EXCLUSIVE", "`CHECK (x IS NOT NULL) NOT VALID`, VALIDATE, then `SET NOT NULL` skips the scan (PG 12+)"], ["UNIQUE", "`ADD UNIQUE`: builds the index while blocking writes", "`CREATE UNIQUE INDEX CONCURRENTLY`, then `ADD CONSTRAINT … UNIQUE USING INDEX`"]]}], "snippets": [{"task": "Add a CHECK without a long lock", "sql": "ALTER TABLE products ADD CONSTRAINT price_cap CHECK (price < 10000) NOT VALID;\nALTER TABLE products VALIDATE CONSTRAINT price_cap;\n", "note": "NOT VALID enforces the rule for new writes immediately; VALIDATE scans existing rows later with a lock that doesn't block reads or writes."}, {"task": "Treat NULLs as equal in UNIQUE", "since": "PG 15", "sql": "CREATE TABLE redemptions (\n  user_id bigint, coupon text,\n  UNIQUE NULLS NOT DISTINCT (user_id, coupon)\n);\nINSERT INTO redemptions VALUES (1, NULL);\nINSERT INTO redemptions VALUES (1, NULL) ON CONFLICT DO NOTHING;\nSELECT count(*) AS rows FROM redemptions;\n", "out": {"cols": ["rows"], "rows": [[1]]}, "note": "Without `NULLS NOT DISTINCT`, both rows go in: two NULLs are never equal."}, {"task": "List a table's constraints", "sql": "SELECT conname, contype\nFROM pg_constraint\nWHERE conrelid = 'orders'::regclass\n  AND contype <> 'n'   -- PG 18 also lists NOT NULLs here\nORDER BY conname;\n", "out": {"cols": ["conname", "contype"], "rows": [["orders_pkey", "p"], ["orders_status_check", "c"], ["orders_user_id_fkey", "f"]]}, "note": "Name constraints deliberately: the name comes back in the error (with SQLSTATE 23505, 23503…), so the app can map it to a message like “email already taken”."}, {"task": "A reusable rule (domain)", "sql": "CREATE DOMAIN email_address AS text\n  CHECK (VALUE ~ '^[^@\\s]+@[^@\\s]+$');\nSELECT 'ana@example.com'::email_address AS ok;\n", "out": {"cols": ["ok"], "rows": [["ana@example.com"]]}}], "pitfalls": ["**CHECK constraints that call functions reading other tables.** They're only evaluated when this row changes, so they silently go stale when the other table does. That's a trigger plus locking, or a different design.", "**Unindexed foreign key columns.** Deleting or re-keying a parent scans the whole child table, under lock, once per parent row.", "**Adding a constraint the blocking way** on a big table: a full scan while holding ACCESS EXCLUSIVE stops all reads and writes. Use NOT VALID + VALIDATE.", "**Forgetting NULLs in UNIQUE.** `UNIQUE (user_id, coupon)` happily stores many `(1, NULL)` rows.", "**Deferrable unique constraints and upserts.** A DEFERRABLE constraint can't be the arbiter for `ON CONFLICT`; keep a separate non-deferrable index if you need both.", "**Trusting app validation.** Batch scripts, admin consoles and the next service don't run it, and check-then-insert races anyway."], "depth": ["**Constraints see the future.** A unique or exclusion check that hits a concurrent **uncommitted** row waits for that transaction and then succeeds or fails. That's why they prevent duplicates and overlaps at Read Committed, where any SELECT-based check races.", "**Cross-row invariants** (allocations ≤ budget, at least one admin) don't fit a constraint. Options: lock the parent row (`SELECT … FROM budgets WHERE id = $1 FOR UPDATE`) before checking; Serializable with retries; or restructure so the rule becomes row-local (store `remaining` on the budget and decrement it with `CHECK (remaining >= 0)`).", "**Deferrable constraints** check at end of statement (INITIALLY IMMEDIATE) or at commit (INITIALLY DEFERRED). They solve swaps and circular references; the cost is queued checks and losing ON CONFLICT.", "**Foreign key locking.** Inserting a child takes FOR KEY SHARE on the parent row. Ordinary updates of the parent use FOR NO KEY UPDATE, which doesn't conflict, but deleting the parent or changing its key waits. One hot parent row with thousands of child inserts per second creates MultiXact churn.", "**Exclusion constraints generalize UNIQUE**: `EXCLUDE USING gist (room_id WITH =, during WITH &&)` means “no two rows with equal room and overlapping ranges”. The same works for IP ranges, versions valid in time, or one active row per key with a range of validity."], "mysql": ["CHECK is enforced from 8.0.16. There are no exclusion constraints and no deferrable constraints: unique checks run row by row, so position swaps need a temporary value.", "Foreign keys exist only on InnoDB, can't reference partitioned tables, and are skipped entirely with `SET foreign_key_checks = 0` (common in imports; nothing re-checks the data afterwards).", "No NOT VALID: adding a FK or CHECK validates every row at once."], "checks": [{"q": "Bookings must never overlap for a room. The app checks for overlaps before inserting. Why isn't that enough, and what's the database-level fix?", "a": "Two requests can both check, see no overlap, and both insert: a race that no isolation level below Serializable stops. Declare the rule: `EXCLUDE USING gist (room_id WITH =, during WITH &&)` (with the `btree_gist` extension). The second insert waits for the first and then fails with 23P01."}, {"q": "Add a foreign key from a 500M-row table to `users` without downtime. Steps?", "a": "1) `CREATE INDEX CONCURRENTLY` on the child column. 2) With `SET lock_timeout = '2s'`, `ADD CONSTRAINT … FOREIGN KEY … NOT VALID`: a brief lock, new rows checked from now on. 3) `VALIDATE CONSTRAINT`: scans existing rows with SHARE UPDATE EXCLUSIVE, which doesn't block reads or writes. Retry step 2 if the lock times out."}, {"q": "A budget's allocations must never exceed its total. Can a CHECK constraint do it?", "a": "No: CHECK sees one row. Either serialize per budget (lock the budget row FOR UPDATE, sum, insert, commit), or make it row-local: keep `remaining` on the budget, decrement it in the same transaction as the insert with `UPDATE budgets SET remaining = remaining - $amt WHERE id = $1`, and let `CHECK (remaining >= 0)` reject overdrafts."}, {"q": "Why does swapping two positions with one UPDATE fail under `UNIQUE (playlist_id, position)`, and what fixes it?", "a": "A non-deferrable unique index is checked row by row: moving item 1 to position 2 collides with the item still at 2. Declare the constraint `DEFERRABLE INITIALLY IMMEDIATE` so it's checked at the end of the statement, after both rows moved (see the second problem)."}, {"q": "`orders.user_id`: ON DELETE CASCADE or RESTRICT?", "a": "RESTRICT. Orders are financial history; deleting a user must not silently delete them. Handle account deletion by anonymizing the user row. CASCADE fits owned data with no independent meaning: carts, sessions, link rows."}], "problems": [{"id": "no-overlapping-bookings", "title": "No overlapping bookings", "variant": "canonical", "statement": "`bookings(room_id, during)` (see Setup) stores time ranges. Make the database reject a booking that overlaps another booking of the **same room**. Ranges are half-open, so back-to-back bookings are allowed.", "hint": "UNIQUE compares with `=`. You need a constraint that compares one column with `=` and another with “overlaps”.", "setup": "CREATE TABLE bookings (\n  id      bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  room_id int NOT NULL,\n  during  tstzrange NOT NULL\n);\n", "solution": "CREATE EXTENSION IF NOT EXISTS btree_gist;\nALTER TABLE bookings\n  ADD CONSTRAINT bookings_no_overlap\n  EXCLUDE USING gist (room_id WITH =, during WITH &&);\n", "tests": [{"sql": "INSERT INTO bookings (room_id, during) VALUES (1, '[2026-03-01 10:00Z, 2026-03-01 12:00Z)')", "ok": true}, {"sql": "INSERT INTO bookings (room_id, during) VALUES (1, '[2026-03-01 11:00Z, 2026-03-01 13:00Z)')", "error": "exclusion_violation", "note": "overlaps 11:00–12:00"}, {"sql": "INSERT INTO bookings (room_id, during) VALUES (1, '[2026-03-01 12:00Z, 2026-03-01 14:00Z)')", "ok": true, "note": "back to back"}, {"sql": "INSERT INTO bookings (room_id, during) VALUES (2, '[2026-03-01 10:00Z, 2026-03-01 12:00Z)')", "ok": true, "note": "another room"}, {"sql": "INSERT INTO bookings (room_id, during) VALUES (1, '[2026-03-01 09:00Z, 2026-03-01 15:00Z)')", "error": "exclusion_violation", "note": "covers both"}], "check": "SELECT room_id, count(*) AS bookings FROM bookings GROUP BY room_id ORDER BY room_id", "expect": {"cols": ["room_id", "bookings"], "rows": [[1, 2], [2, 1]]}, "insight": "An exclusion constraint is UNIQUE generalized to any operator. It holds under concurrency: a second transaction inserting an overlapping range waits for the first and fails if it commits. `btree_gist` lets GiST handle `=` on the integer `room_id`. PG 18 adds `WITHOUT OVERLAPS` to primary keys and unique constraints for the same idea.", "mysql": "No exclusion constraints: serialize per room (`SELECT … FROM rooms WHERE id = ? FOR UPDATE`) before checking for overlaps and inserting."}, {"id": "swap-positions", "title": "Unique positions that can be swapped", "variant": "disguise", "statement": "`playlist_items` (see Setup) orders tracks by `position`. Positions must be unique within a playlist, and the app reorders with a single UPDATE that swaps two positions (the first check below). Add the uniqueness rule so that the swap still works.", "hint": "The rule is plain uniqueness. The question is **when** it's checked.", "setup": "CREATE TABLE playlist_items (\n  playlist_id int NOT NULL,\n  track       text NOT NULL,\n  position    int NOT NULL\n);\nINSERT INTO playlist_items VALUES\n  (1, 'Intro', 1), (1, 'Theme', 2), (1, 'Outro', 3);\n", "solution": "ALTER TABLE playlist_items\n  ADD CONSTRAINT playlist_position_key\n  UNIQUE (playlist_id, position)\n  DEFERRABLE INITIALLY IMMEDIATE;\n", "tests": [{"sql": "UPDATE playlist_items SET position = CASE position WHEN 1 THEN 2 WHEN 2 THEN 1 END WHERE playlist_id = 1 AND position IN (1, 2)", "ok": true, "note": "the swap"}, {"sql": "INSERT INTO playlist_items VALUES (1, 'Bonus', 3)", "error": "unique_violation"}, {"sql": "INSERT INTO playlist_items VALUES (1, 'Bonus', 4)", "ok": true}], "check": "SELECT track, position FROM playlist_items ORDER BY position", "expect": {"cols": ["track", "position"], "rows": [["Theme", 1], ["Intro", 2], ["Outro", 3], ["Bonus", 4]]}, "insight": "A plain UNIQUE constraint is checked as each row is updated, so the swap fails halfway with 23505 even though the final state is fine. `DEFERRABLE INITIALLY IMMEDIATE` checks at the end of each statement; `INITIALLY DEFERRED` (or `SET CONSTRAINTS … DEFERRED`) waits until commit, for reorders spread over several statements. The cost: a deferrable constraint can't serve as an ON CONFLICT arbiter.", "mysql": "No deferrable constraints: move one row to a temporary position (e.g. negative) first, then swap, in one transaction."}], "part": "B"}, {"id": "indexes", "name": "Indexes", "signal": ["“this query is slow, why?”", "lookups by a non-key column (email, status, tenant)", "`ORDER BY … LIMIT` pagination", "rules like “one active X per Y”", "write throughput dropped after a release"], "idea": "A B-tree index is a sorted copy of some columns plus a pointer to each row. It turns a scan into a log-depth descent and returns rows in order, so `ORDER BY … LIMIT` can stop early. Column order decides which queries it serves: equality columns first, then one range or sort column. Every index taxes every write and competes for cache, so each one has to earn its place.", "diagram": {"type": "plan", "caption": "the same query on 10M orders under three indexes (illustrative EXPLAIN ANALYZE numbers)", "frames": [{"title": "No index", "query": "SELECT * FROM orders WHERE user_id = 42 AND status = 'paid' ORDER BY created_at DESC LIMIT 20;", "plan": [{"op": "Limit", "est": 20, "act": 20, "ms": "1,840"}, {"d": 1, "op": "Sort", "detail": "Sort Key: created_at DESC · top-N heapsort", "est": "2,100", "act": "1,950"}, {"d": 2, "op": "Seq Scan", "true": "orders", "detail": "Filter: user_id = 42 AND status = 'paid' · Rows Removed by Filter: 9,998,050", "est": "2,100", "act": "1,950", "mark": "bad"}], "note": "Reads every page of the table to find 1,950 rows, then sorts them to keep 20. Cost grows with the table, not with the answer."}, {"title": "Index on (user_id)", "query": "CREATE INDEX ON orders (user_id);", "plan": [{"op": "Limit", "est": 20, "act": 20, "ms": "6.1"}, {"d": 1, "op": "Sort", "detail": "Sort Key: created_at DESC · top-N heapsort", "est": "2,100", "act": "1,950"}, {"d": 2, "op": "Bitmap Heap Scan", "true": "orders", "detail": "Filter: status = 'paid' · Rows Removed by Filter: 640 · Heap Blocks: 2,480", "est": "2,100", "act": "1,950", "mark": "bad"}, {"d": 3, "op": "Bitmap Index Scan", "true": "orders_user_id_idx", "detail": "Index Cond: user_id = 42", "est": "2,600", "act": "2,590"}], "note": "Finds the user's 2.6K rows quickly, but still fetches every one from the heap (random I/O), filters status there, and sorts. Fine today, slow for heavy users."}, {"title": "Index on (user_id, status, created_at)", "query": "CREATE INDEX ON orders (user_id, status, created_at);", "plan": [{"op": "Limit", "est": 20, "act": 20, "ms": "0.09"}, {"d": 1, "op": "Index Scan Backward", "true": "orders_user_id_status_created_at_idx", "detail": "Index Cond: user_id = 42 AND status = 'paid'", "est": 20, "act": 20, "mark": "good"}], "note": "Equality columns first, then the sort column: matching rows sit together in the index, already in order. The scan walks backwards for DESC and stops after 20 rows. No sort node, 20 heap fetches."}]}, "numbers": [{"k": "B-tree depth", "v": "3–4 levels for 100M+ rows"}, {"k": "Page size", "v": "8 KB Postgres · 16 KB InnoDB"}, {"k": "Seq vs random page cost", "v": "1 vs 4 by default (set ~1.1 on SSD)"}, {"k": "Index vs seq scan", "v": "index wins below ~1–10% of rows, depending on correlation"}, {"k": "Cost per index", "v": "+1 write per INSERT and per non-HOT UPDATE"}], "tables": [{"title": "Postgres index types", "cols": ["Type", "Serves", "Use for", "Watch out"], "rows": [["**B-tree** (default)", "`= < > BETWEEN IN IS NULL`, ORDER BY, `LIKE 'abc%'`", "Almost everything; UNIQUE and PRIMARY KEY", "Column order; `LIKE` prefix needs C collation or `text_pattern_ops`"], ["**Hash**", "`=` only", "Very long keys where only equality matters", "No ranges, no ordering, can't be UNIQUE"], ["**GIN**", "Contains / overlaps: `@>`, `?`, `&&`, `@@`", "JSONB, arrays, full-text search, `pg_trgm` for `LIKE '%x%'`", "Slower writes (pending list), large"], ["**GiST**", "Overlap, containment, nearest neighbour (`<->`)", "Ranges, geometry (PostGIS), exclusion constraints", "Lossy: rows are rechecked"], ["**BRIN**", "Min / max per block range", "Huge append-only tables ordered by time", "Useless when physical order doesn't follow the column; ~0.1% the size of a B-tree"]]}, {"title": "Which index for this predicate?", "cols": ["Query shape", "Index"], "rows": [["`WHERE tenant_id = $1 AND created_at > $2 ORDER BY created_at`", "`(tenant_id, created_at)`: equality, then range and sort"], ["`WHERE lower(email) = $1`", "Expression index `(lower(email))`"], ["`WHERE status = 'pending'` (0.1% of rows)", "Partial: `(created_at) WHERE status = 'pending'`"], ["`SELECT qty FROM order_items WHERE product_id = $1`", "Covering: `(product_id) INCLUDE (qty)`, an index-only scan"], ["`WHERE doc @> '{\"plan\": \"pro\"}'`", "`GIN (doc jsonb_path_ops)`"], ["`WHERE name ILIKE '%ann%'`", "`GIN (name gin_trgm_ops)` with the pg_trgm extension"], ["`WHERE a = $1 OR b = $2`", "Separate indexes on `a` and `b` (BitmapOr), or rewrite as UNION"]]}], "snippets": [{"task": "Composite index serving filter + sort", "sql": "CREATE INDEX orders_user_status_created_idx ON orders (user_id, status, created_at);", "note": "One index serves `user_id = ?`, `user_id = ? AND status = ?`, and either sort direction on `created_at` after both equalities. Mixed directions (`ORDER BY a ASC, b DESC`) need them declared in the index."}, {"task": "Covering index (index-only scan)", "sql": "CREATE INDEX order_items_product_idx ON order_items (product_id) INCLUDE (qty, unit_price);", "note": "INCLUDE columns are stored in the leaf pages but aren't part of the key: they can't be searched, only returned."}, {"task": "Expression index on a timestamptz date", "sql": "CREATE INDEX events_day_utc_idx ON events (((at AT TIME ZONE 'UTC')::date));", "note": "`(at::date)` is rejected: functions in an index expression must be IMMUTABLE, and casting a timestamptz to a date depends on the session time zone. Pin the zone. Queries must repeat the exact expression."}, {"task": "Build without blocking writes", "sql": "CREATE INDEX CONCURRENTLY orders_created_idx ON orders (created_at);", "tx": false, "note": "Production default. Two table scans, slower, and can't run inside a transaction. On failure it leaves an INVALID index that still slows writes: drop it and retry."}, {"task": "Find unused indexes", "sql": "SELECT relname AS table_name, indexrelname AS index_name, idx_scan,\n       pg_size_pretty(pg_relation_size(indexrelid)) AS size\nFROM pg_stat_user_indexes\nWHERE idx_scan = 0\nORDER BY pg_relation_size(indexrelid) DESC;\n", "note": "Counters are per server since the last stats reset: check replicas too before dropping, and keep indexes that back UNIQUE constraints."}], "pitfalls": ["**Wrong column order.** `(created_at, user_id)` can't serve `WHERE user_id = ? ORDER BY created_at`. Equality columns first, then the range or sort column. A range condition ends the usable prefix: with `(a, b)` and `a > ?`, `b` is only a filter.", "**Wrapping the column.** `lower(email) = …`, `created_at::date = …` and implicit casts (a text column compared to a number) skip a plain index. Rewrite as a half-open range (`created_at >= $d AND created_at < $d + 1`) or index the expression.", "**Leading wildcards.** `LIKE '%foo'` can't use a B-tree at all, and `LIKE 'foo%'` uses one only with C collation or `text_pattern_ops`. Use a trigram GIN index for contains-search.", "**Unindexed foreign keys.** Postgres indexes the referenced side (it's a PK) but not the referencing column. Deleting or updating a parent row then scans the child table under lock. Index `orders(user_id)`.", "**Low-selectivity indexes.** An index on a boolean or a 3-value status is rarely used, and when it is, it's slower than scanning. A partial index on the rare value is smaller and actually helps.", "**Plain CREATE INDEX on a live table** blocks all writes for the whole build. Use `CONCURRENTLY` and check `pg_index.indisvalid` afterwards."], "depth": ["**Index-only scans depend on VACUUM.** The heap is skipped only for pages marked all-visible in the visibility map. On a heavily updated table EXPLAIN shows `Heap Fetches` in the thousands until autovacuum catches up. Covering indexes pay off on tables that are vacuumed often.", "**Indexes kill HOT updates.** An UPDATE that changes no indexed column can be HOT (heap-only tuple): no index writes at all, if the page has room (`fillfactor`). Index a hot column like `last_seen_at` and every update now writes every index and bloats them.", "**Correlation decides index vs seq scan.** The planner prices heap fetches by how closely physical row order follows index order (`pg_stats.correlation`). `created_at` on append-only data range-scans cheaply; random UUIDv4 keys scatter. BRIN exploits correlation at a fraction of the size.", "**One composite beats several singles.** Postgres can combine single-column indexes with BitmapAnd, but that loses ordering, fetches more, and costs more writes. Build composites for the hot queries and keep singles for ad-hoc filters.", "**Unique indexes are integrity tools.** UNIQUE constraints are unique B-trees, and partial or expression unique indexes express rules constraints can't: one open cart per user, case-insensitive emails, one primary address per customer.", "**Maintenance.** B-trees on increasing keys stay compact; random or heavily updated keys bloat. PG 13+ deduplicates repeated keys; `REINDEX CONCURRENTLY` (PG 12+) rebuilds without blocking writes."], "mysql": ["InnoDB tables are clustered on the primary key. Secondary indexes store the PK value, not a row pointer, so a wide PK bloats every index, and a secondary lookup is two B-tree descents.", "No partial indexes. Functional indexes exist since 8.0.13; before that, index a generated column.", "No `INCLUDE`: add the columns to the key to cover a query. No GIN, GiST or BRIN; MySQL has FULLTEXT and SPATIAL indexes instead.", "Online builds use `ALTER TABLE … ADD INDEX …, ALGORITHM=INPLACE, LOCK=NONE` rather than CONCURRENTLY."], "checks": [{"q": "`SELECT * FROM events WHERE user_id = $1 AND at >= now() - interval '7 days' ORDER BY at DESC` is slow. Which index?", "a": "`(user_id, at)`. Equality column first, then the column that is both the range and the sort, so the matching rows are contiguous and already ordered. B-trees scan in both directions, so `DESC` in the index definition isn't needed for a single sort column. `(at, user_id)` would scan a week of everyone's events."}, {"q": "There's an index on `orders(created_at)`, yet `WHERE created_at::date = '2026-03-10'` does a seq scan. Why, and how do you fix it?", "a": "The cast wraps the column, so the index on raw `created_at` can't be used. Rewrite as a half-open range: `created_at >= '2026-03-10' AND created_at < '2026-03-11'`. An expression index on `created_at::date` isn't allowed for `timestamptz` (not immutable: it depends on the time zone), and the range is clearer anyway."}, {"q": "After adding an index on `users(last_seen_at)`, writes to `users` got much slower and the table grew fast. What happened?", "a": "`last_seen_at` is updated on every request. Before, those updates were HOT and touched no index. Now every update writes a new entry in every index on the table, and the old entries bloat until vacuum. Fix: drop it, move `last_seen_at` to a narrow side table, or update it less often (only if older than 5 minutes)."}, {"q": "EXPLAIN shows `Index Only Scan … Heap Fetches: 48210`. Why isn't it index-only?", "a": "Index-only scans skip the heap only for pages the visibility map marks all-visible. Recent writes clear those bits until VACUUM sets them again. Tune autovacuum for the table (lower `autovacuum_vacuum_scale_factor`, or `autovacuum_vacuum_insert_scale_factor` for append-only tables) or run VACUUM after bulk loads."}, {"q": "When does the planner pick a seq scan despite a usable index, and when is it right?", "a": "When the predicate matches a large share of rows, the table is small, or the matching rows are scattered (low correlation): sequential reads beat many random page fetches. It's right when its row estimate is right. If EXPLAIN ANALYZE shows estimated rows far from actual, fix statistics (ANALYZE, a higher statistics target, extended statistics for correlated columns), not the planner settings."}], "problems": [{"id": "email-ci-unique", "title": "Case-insensitive unique emails", "variant": "canonical", "statement": "Signup must reject `Ana@Example.com` because `ana@example.com` already exists. Add what makes emails unique **ignoring case**, and lets `WHERE lower(email) = lower($1)` use an index. (`users` already has a case-sensitive `UNIQUE (email)`.)", "hint": "An index can be on an expression, and a unique index enforces uniqueness of whatever it indexes.", "solution": "CREATE UNIQUE INDEX users_email_lower_key\n  ON users (lower(email));\n", "tests": [{"sql": "INSERT INTO users (email, name, created_at) VALUES ('Ana@Example.com', 'Ana again', now())", "error": "unique_violation"}, {"sql": "INSERT INTO users (email, name, created_at) VALUES ('new@example.com', 'New', now())", "ok": true}, {"sql": "SELECT id FROM users WHERE lower(email) = 'ana@example.com'", "uses_index": true}], "insight": "An expression index is used only when the query repeats the same expression. Alternatives: the `citext` type, or a nondeterministic ICU collation (PG 12+), but both change comparison semantics everywhere the column is used. If the original casing doesn't matter, storing emails lowercased is simplest.", "mysql": "MySQL's default collation (`utf8mb4_0900_ai_ci`) is already case- and accent-insensitive, so a plain `UNIQUE (email)` rejects `Ana@Example.com`, and also treats `é` and `e` as equal."}, {"id": "one-cart-per-user", "title": "One open cart per user", "variant": "disguise", "statement": "A user may have any number of orders, but **at most one** with status `'cart'`. Enforce it in the database: two app servers can race. Gia (user 7) already has a cart.", "hint": "A UNIQUE constraint covers every row. Which kind of index covers only some rows?", "solution": "CREATE UNIQUE INDEX orders_one_cart_per_user\n  ON orders (user_id)\n  WHERE status = 'cart';\n", "tests": [{"sql": "INSERT INTO orders (user_id, status, created_at) VALUES (7, 'cart', now())", "error": "unique_violation", "note": "Gia already has a cart"}, {"sql": "INSERT INTO orders (user_id, status, created_at) VALUES (1, 'cart', now())", "ok": true, "note": "Ana's first cart"}, {"sql": "INSERT INTO orders (user_id, status, created_at) VALUES (1, 'paid', now())", "ok": true, "note": "other statuses are unrestricted"}, {"sql": "INSERT INTO orders (user_id, status, created_at) VALUES (1, 'cart', now())", "error": "unique_violation", "note": "Ana's second cart"}, {"sql": "SELECT id FROM orders WHERE user_id = 7 AND status = 'cart'", "uses_index": true}], "insight": "A partial unique index enforces uniqueness only among rows matching its predicate, and stays tiny because only carts are in it. An app-side “check, then insert” races under Read Committed; with the index the second insert fails with 23505. Handle it with `INSERT … ON CONFLICT (user_id) WHERE status = 'cart' DO NOTHING`, then read the existing cart.", "mysql": "No partial indexes. Add a generated column `cart_user_id = IF(status = 'cart', user_id, NULL)` with a UNIQUE index: NULLs never collide."}], "part": "B"}, {"id": "query-planning", "name": "Query Planning & EXPLAIN", "signal": ["“this query got slow” / “it's fast in psql but slow from the app”", "reading an EXPLAIN plan", "deep pagination", "estimates wildly off after a data change", "which query to optimize first"], "idea": "The planner picks scans, join order and join algorithms by estimated cost, and costs come from **row estimates** built on table statistics. Most bad plans are bad estimates: correlated columns, stale stats, skewed values. In `EXPLAIN (ANALYZE, BUFFERS)`, find the lowest node where estimated and actual rows diverge; that is where the plan went wrong. Fix the estimate or the query shape before reaching for settings.", "diagram": {"type": "plan", "caption": "users in Paris and their orders: 2M orders (illustrative EXPLAIN ANALYZE numbers)", "frames": [{"title": "Misestimate → nested loop", "query": "SELECT … FROM users u JOIN orders o ON o.user_id = u.id WHERE u.city = 'Paris' AND u.country = 'FR';", "plan": [{"op": "Nested Loop", "est": 40, "act": "52,000", "ms": "4,870", "mark": "bad"}, {"d": 1, "op": "Index Scan", "true": "users_city_idx", "detail": "Index Cond: city = 'Paris' · Filter: country = 'FR'", "est": 40, "act": "52,000", "mark": "bad"}, {"d": 1, "op": "Index Scan", "true": "orders_user_id_idx", "detail": "Index Cond: user_id = u.id · loops=52,000", "est": 5, "act": 4}], "note": "The planner multiplies the selectivity of `city = 'Paris'` and `country = 'FR'` as if independent and expects 40 users. Real answer: 52,000. A nested loop is perfect for 40 outer rows and terrible for 52,000 index probes."}, {"title": "After CREATE STATISTICS", "query": "CREATE STATISTICS users_geo (dependencies) ON city, country FROM users; ANALYZE users;", "plan": [{"op": "Hash Join", "detail": "Hash Cond: o.user_id = u.id", "est": "51,800", "act": "52,000", "ms": "610", "mark": "good"}, {"d": 1, "op": "Seq Scan", "true": "orders", "est": "2,000,000", "act": "2,000,000"}, {"d": 1, "op": "Hash", "detail": "Buckets: 65,536 · Memory Usage: 4,100 kB"}, {"d": 2, "op": "Bitmap Heap Scan", "true": "users", "detail": "Recheck Cond: city = 'Paris' · Filter: country = 'FR'", "est": "51,800", "act": "52,000"}, {"d": 3, "op": "Bitmap Index Scan", "true": "users_city_idx", "detail": "Index Cond: city = 'Paris'", "est": "52,500", "act": "52,400"}], "note": "Extended statistics teach the planner that city implies country. With the right estimate it builds a hash table of the 52K users and streams orders past it once."}, {"title": "Reading a node", "query": "EXPLAIN (ANALYZE, BUFFERS) …", "plan": [{"op": "Index Scan", "true": "orders_user_id_idx", "detail": "actual time=0.012..0.020 rows=4 loops=52,000 · Buffers: shared hit=208,000 read=1,150", "est": 5, "act": 4}], "note": "`rows` and `time` are **per loop**: this node returned 4 × 52,000 = 208,000 rows and took about 0.02 ms × 52,000 ≈ 1 s. `shared hit` pages came from Postgres's cache, `read` from the OS or disk. High `read` counts mean I/O, not CPU."}]}, "numbers": [{"k": "Page costs", "v": "seq_page_cost 1 · random_page_cost 4 (≈1.1 on SSD)"}, {"k": "Statistics sample", "v": "300 × default_statistics_target (100) = 30,000 rows"}, {"k": "Auto-ANALYZE", "v": "after ~10% of rows change"}, {"k": "work_mem", "v": "4 MB default, per sort / hash node, per query"}, {"k": "Generic plans", "v": "prepared statements may switch after 5 runs"}], "tables": [{"title": "Scan types", "cols": ["Node", "Reads", "Chosen when"], "rows": [["**Seq Scan**", "Every page, in order", "A large share of rows, or a small table"], ["**Index Scan**", "Index, then a heap page per row (random I/O)", "Few rows, or rows needed in index order"], ["**Index Only Scan**", "Index only (heap for pages not all-visible)", "All needed columns are in the index and the table is well vacuumed"], ["**Bitmap Index + Heap Scan**", "Index into a page bitmap, then heap pages in physical order", "Medium selectivity; combining indexes with AND / OR"]]}, {"title": "Join algorithms", "cols": ["Join", "How", "Best when", "Risk"], "rows": [["**Nested Loop**", "For each outer row, look up inner rows (ideally by index)", "Few outer rows", "Disaster when the outer estimate is far too low"], ["**Hash Join**", "Build a hash table on the smaller side, probe with the other", "Large unsorted inputs, equality joins", "Spills to disk in batches when the hash exceeds work_mem"], ["**Merge Join**", "Walk two inputs sorted on the join key", "Both sides already sorted (indexes) or huge", "Sorting first can cost more than it saves"]]}, {"title": "Sargable rewrites", "cols": ["Can't use the index", "Can"], "rows": [["`WHERE created_at::date = '2026-03-20'`", "`WHERE created_at >= '2026-03-20' AND created_at < '2026-03-21'`"], ["`WHERE price * 1.2 > 100`", "`WHERE price > 100 / 1.2`"], ["`WHERE lower(email) = $1`", "An expression index on `lower(email)`, or store it normalized"], ["`WHERE coalesce(deleted_at, 'infinity') > now()`", "`WHERE deleted_at IS NULL OR deleted_at > now()`"], ["`WHERE user_ref = 42` on a `text` column", "Compare like with like: `user_ref = '42'`, or fix the column type"], ["`OFFSET 100000 LIMIT 20`", "Keyset: `WHERE (at, id) < ($at, $id) ORDER BY at DESC, id DESC LIMIT 20`"]]}], "snippets": [{"task": "Small tables get seq scans", "sql": "EXPLAIN (COSTS OFF) SELECT * FROM orders WHERE id = 3;", "out": {"cols": ["QUERY PLAN"], "rows": [["Seq Scan on orders"], ["  Filter: (id = 3)"]]}, "note": "15 rows fit in one page: reading it beats an index descent. Don't judge plans on a dev database; plans depend on table size and statistics."}, {"task": "Measure for real", "sql": "EXPLAIN (ANALYZE, BUFFERS)\nSELECT u.name, count(*)\nFROM orders o JOIN users u ON u.id = o.user_id\nGROUP BY u.name;\n", "note": "ANALYZE runs the query. For writes, wrap it: `BEGIN; EXPLAIN ANALYZE UPDATE …; ROLLBACK;`. Add `SETTINGS` (PG 12+) to show non-default planner settings."}, {"task": "Teach the planner about correlated columns", "sql": "CREATE STATISTICS orders_user_status (dependencies, ndistinct)\n  ON user_id, status FROM orders;\nANALYZE orders;\n"}, {"task": "More detailed statistics for one column", "sql": "ALTER TABLE orders ALTER COLUMN status SET STATISTICS 1000;\nANALYZE orders;\n", "note": "More most-common values and histogram buckets for a skewed column, at the cost of slower ANALYZE and planning."}, {"task": "Log slow plans automatically", "sql": "LOAD 'auto_explain';\nSET auto_explain.log_min_duration = '500ms';\nSET auto_explain.log_analyze = on;\n", "note": "In production, preload it via `session_preload_libraries` and keep `log_analyze` sampled: it adds timing overhead to every query."}, {"task": "Find the queries that cost the most", "run": false, "sql": "SELECT calls, round(total_exec_time) AS total_ms,\n       round(mean_exec_time, 1) AS mean_ms, rows, left(query, 60) AS query\nFROM pg_stat_statements\nORDER BY total_exec_time DESC\nLIMIT 10;\n", "note": "Needs `shared_preload_libraries = 'pg_stat_statements'` and a restart. Sort by **total** time: a 2 ms query run 10M times a day matters more than a 5 s report run once."}], "pitfalls": ["**EXPLAIN without ANALYZE** shows estimates only, which is exactly what's suspect. EXPLAIN ANALYZE executes the statement, so roll back writes.", "**Reading per-loop numbers as totals.** Inside a nested loop, `rows` and `time` are averages per loop; multiply by `loops`.", "**Tuning on a toy database.** A 1,000-row dev table gets different plans from a 100M-row production table. Test with production-like statistics and sizes.", "**Fixing plans with global settings.** `enable_nestloop = off` or a huge `work_mem` in postgresql.conf fixes one query and breaks others. Use them to diagnose, then fix statistics, indexes or the query; set per query with `SET LOCAL` if you must.", "**Stale statistics after big changes.** A bulk load or a large delete leaves estimates wrong until auto-ANALYZE runs. Run `ANALYZE` after migrations and loads. After `pg_upgrade` before PG 18, statistics are empty: run `vacuumdb --analyze-in-stages`.", "**Deep OFFSET pagination** reads and throws away every skipped row. Page with a keyset (the second problem)."], "depth": ["**Estimates drive everything.** Cost ≈ pages × page cost + rows × CPU cost, and both come from row estimates. Statistics per column hold the most common values, a histogram, n_distinct and correlation; the planner assumes columns are independent unless you add extended statistics (dependencies, ndistinct, mcv; on expressions since PG 14).", "**Prepared statements and generic plans.** After five executions Postgres may switch to a plan that ignores parameter values. With skewed data (`status = 'pending'` is rare, `'paid'` is everywhere) the generic plan can be wrong for one of them. `plan_cache_mode = force_custom_plan` for those queries.", "**Fast in psql, slow from the app:** usually a generic plan, a parameter type mismatch (the driver sends `numeric` or `text` and an index on `bigint` is skipped), a different `search_path`, or the app runs it inside a long transaction. auto_explain shows the plan the app actually got.", "**Memory spills:** `Sort Method: external merge Disk: 1200MB` or a Hash with `Batches: 16` means work_mem was too small for that node. Raise it for that query (`SET LOCAL work_mem = '256MB'`), remembering it applies per node and per parallel worker.", "**JIT can hurt OLTP.** For queries with high estimated cost, JIT compilation can add 50–200 ms; EXPLAIN shows a `JIT:` section. Raise `jit_above_cost` or turn JIT off for short queries.", "**Join order search** is exhaustive up to `join_collapse_limit` (8) tables, then genetic (GEQO from 12). Very large joins can get erratic plans; CTEs with MATERIALIZED or explicit JOIN order (with the limit lowered) pin it."], "mysql": ["`EXPLAIN ANALYZE` since 8.0.18 (tree format; `EXPLAIN FORMAT=TREE` for estimates). Hash joins exist only since 8.0.18; before that, every join was a nested loop.", "No extended statistics: use histograms (`ANALYZE TABLE t UPDATE HISTOGRAM ON col`). Index statistics are sampled per index (`innodb_stats_persistent_sample_pages`).", "Optimizer hints in comments (`/*+ INDEX(t idx) */`) and `FORCE INDEX` are available; Postgres has none built in (the `pg_hint_plan` extension adds them).", "The performance schema's `events_statements_summary_by_digest` plays the role of pg_stat_statements."], "checks": [{"q": "EXPLAIN ANALYZE shows a Nested Loop whose outer node estimated 3 rows but returned 80,000. What's going on and what do you try?", "a": "A misestimate on the outer side made a nested loop look cheap; it then ran 80,000 inner probes. Look at that outer node's conditions: correlated columns (add `CREATE STATISTICS … (dependencies)`), stale stats (`ANALYZE`), a skewed value (raise the column's statistics target), or a function the planner can't estimate (a default 0.5% selectivity guess). Fix the estimate and the planner picks a hash join on its own."}, {"q": "A query runs in 20 ms in psql and 3 s from the application. Name likely causes.", "a": "The app uses a prepared statement that switched to a generic plan; the driver binds a parameter with a different type, defeating an index; the app runs with different settings (`search_path`, `work_mem`, a role-level setting); or it's waiting on locks inside a long transaction rather than executing. Enable auto_explain or check `pg_stat_activity.wait_event` to see which."}, {"q": "A plan shows `Sort Method: external merge Disk: 1.2GB`. What are your options?", "a": "The sort didn't fit in work_mem. Raise work_mem for this query only; add an index that returns rows already in order (then no sort, and maybe early stop with LIMIT); or sort fewer rows by filtering or aggregating first."}, {"q": "Why is `OFFSET 100000 LIMIT 20` slow even with an index on the sort column?", "a": "The executor still walks and discards the first 100,000 index entries (and their heap rows) to return 20. Keyset pagination starts from the last seen key: `WHERE (at, id) < ($last_at, $last_id) ORDER BY at DESC, id DESC LIMIT 20`, constant cost per page and stable when rows are inserted."}, {"q": "You open pg_stat_statements to find what to optimize. Sort by which column, and why?", "a": "`total_exec_time`: it's calls × mean, the share of database time each query consumes. Then look at `rows` per call and `shared_blks_read` to see whether it's returning too much or reading from disk. Mean time alone over-weights rare reports."}], "problems": [{"id": "sargable-day", "title": "Orders on one day, index-friendly", "variant": "canonical", "statement": "With an index on `orders (created_at)` (see Setup), list the **paid** orders placed on 2026-03-20 UTC: `id`, `user_id`, by id. The plan must be able to use `orders_created_at_idx`.", "hint": "Don't transform the indexed column. Transform the constant into a range instead.", "setup": "CREATE INDEX orders_created_at_idx ON orders (created_at);", "uses_index": "orders_created_at_idx", "solution": "SELECT id, user_id\nFROM
