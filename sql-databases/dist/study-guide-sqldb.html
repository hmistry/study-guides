lity joins; spills to disk when over work_mem."}, {"term": "HOT update", "see": "mvcc-wal", "def": "Heap-only tuple: an update that changes no indexed column and fits on the same page, so no index is touched. Lost when you index a hot column."}, {"term": "Identity column", "see": "setup-ddl", "def": "`GENERATED ALWAYS | BY DEFAULT AS IDENTITY`: the standard replacement for `serial`. ALWAYS rejects explicit values."}, {"term": "Index-only scan", "see": "indexes", "def": "Answers a query from the index alone, skipping heap pages the visibility map marks all-visible. Depends on vacuum keeping that map current."}, {"term": "Keyset pagination", "see": "query-planning", "def": "Paging by the last seen key (`WHERE (at, id) < ($at, $id) … LIMIT n`) instead of OFFSET: constant cost per page."}, {"term": "LATERAL", "see": "subqueries", "def": "Lets a FROM-subquery reference earlier tables, running it per row: the clean form of “top N for each”."}, {"term": "Lock queue", "see": "locking", "def": "Waiting lock requests line up; a queued strong lock (ALTER TABLE) blocks later weaker ones, so one waiting DDL can stall all traffic."}, {"term": "Lost update", "see": "isolation", "def": "Two read-modify-write cycles overlap and the second write overwrites the first. Allowed by Read Committed; prevent with atomic updates, locks or Repeatable Read."}, {"term": "MERGE", "see": "writes", "def": "SQL-standard statement (PG 15+) to insert, update or delete per match against a source. Not race-free against concurrent inserts, unlike ON CONFLICT."}, {"term": "MVCC", "see": "mvcc-wal", "def": "Multi-version concurrency control: writers create new row versions, readers pick versions by snapshot, so reads never block writes."}, {"term": "Nested loop", "see": "query-planning", "def": "For each outer row, look up matching inner rows. Ideal for few outer rows with an index; terrible when the outer estimate is far too low."}, {"term": "NOT VALID", "see": "constraints", "def": "Adds a CHECK or FK without checking existing rows (new writes are checked). `VALIDATE CONSTRAINT` later scans without blocking writes."}, {"term": "NULLS NOT DISTINCT", "see": "constraints", "def": "PG 15+ option making a UNIQUE constraint treat NULLs as equal, so only one NULL is allowed."}, {"term": "Optimistic locking", "see": "locking", "def": "Save with `WHERE version = $read_version` and bump the version; zero rows updated means someone else saved first. No lock held during user think time."}, {"term": "Partial index", "see": "indexes", "def": "An index over only the rows matching a WHERE clause. Small and selective; with UNIQUE it expresses rules like “one open cart per user”."}, {"term": "Partition pruning", "see": "scaling", "def": "Skipping partitions that can't match the query's partition-key conditions, at plan or execution time."}, {"term": "PgBouncer", "see": "scaling", "def": "A lightweight connection pooler. Transaction mode lets thousands of clients share a few server connections, at the cost of session state."}, {"term": "Phantom read", "see": "isolation", "def": "Re-running a query finds new rows another transaction inserted. Possible at Read Committed; not at Postgres's Repeatable Read."}, {"term": "PITR", "see": "scaling", "def": "Point-in-time recovery: restore a base backup and replay archived WAL up to a chosen moment."}, {"term": "Read Committed", "see": "isolation", "def": "Postgres's default level: each statement sees data committed before it started. Two statements in one transaction can disagree."}, {"term": "Recursive CTE", "see": "recursive", "def": "`WITH RECURSIVE`: an anchor plus a step that joins against the previous step's rows, repeated until a step returns nothing."}, {"term": "Repeatable Read", "see": "isolation", "def": "In Postgres, snapshot isolation: one snapshot per transaction, 40001 on write-write conflicts. Still allows write skew."}, {"term": "Replica lag", "see": "scaling", "def": "How far a standby's replayed state trails the primary. Causes stale reads; read-your-writes needs routing or LSN waits."}, {"term": "Replication slot", "see": "mvcc-wal", "def": "Makes the primary keep WAL (and old row versions for logical slots) until a consumer reads it. An abandoned slot fills the disk."}, {"term": "ROLLUP", "see": "aggregation", "def": "`GROUP BY ROLLUP (a, b)` adds subtotal and grand-total rows; `grouping()` tells them apart from real NULLs."}, {"term": "Row-level security", "see": "schema-design", "def": "Per-row policies (`CREATE POLICY … USING (tenant_id = …)`) enforced by the database; a safety net for multi-tenant tables."}, {"term": "Sargable", "see": "query-planning", "def": "A predicate an index can serve: the indexed column alone on one side (`created_at >= $1`), not wrapped in functions or casts."}, {"term": "search_path", "see": "setup-ddl", "def": "The list of schemas Postgres searches for unqualified table names, left to right."}, {"term": "Semi-join", "see": "joins", "def": "Rows of A with at least one match in B, each returned once: `EXISTS` or `IN`."}, {"term": "Serializable (SSI)", "see": "isolation", "def": "Postgres's strongest level: tracks read-write dependencies and aborts one transaction (40001) when the outcome couldn't happen serially. Never blocks more; needs retries."}, {"term": "Serialization failure", "see": "isolation", "def": "SQLSTATE 40001: the transaction conflicted and must be retried from the start, reads included."}, {"term": "Sessionization", "see": "patterns", "def": "Splitting events into visits by inactivity gaps: flag rows where `at - lag(at)` exceeds the gap, then running-sum the flags."}, {"term": "SKIP LOCKED", "see": "locking", "def": "Makes `FOR UPDATE` skip rows other transactions have locked instead of waiting. The basis of queue tables in Postgres."}, {"term": "Snapshot", "see": "isolation", "def": "The set of transactions considered committed for a query or transaction; decides which row versions are visible."}, {"term": "Three-valued logic", "see": "nulls-types", "def": "Comparisons with NULL are unknown, not false; WHERE keeps only true rows. Use `IS NULL`, `IS DISTINCT FROM`."}, {"term": "timestamptz", "see": "nulls-types", "def": "An instant, stored as UTC and displayed in the session time zone. Converting it to a date or hour needs a zone."}, {"term": "TOAST", "see": "schema-design", "def": "Out-of-line, compressed storage for large values (over ~2 KB), fetched only when the column is read."}, {"term": "Upsert", "see": "writes", "def": "Insert-or-update in one atomic statement: `INSERT … ON CONFLICT (key) DO UPDATE`."}, {"term": "UUIDv7", "see": "schema-design", "def": "A time-ordered UUID (`uuidv7()` in PG 18): globally unique like v4 but B-tree friendly. Reveals creation time."}, {"term": "VACUUM", "see": "mvcc-wal", "def": "Removes dead row versions no snapshot can see, freezes old ones and updates the visibility map. Doesn't shrink files."}, {"term": "Visibility map", "see": "mvcc-wal", "def": "A per-table bitmap of pages whose rows are visible to everyone; lets index-only scans and vacuum skip pages."}, {"term": "WAL", "see": "mvcc-wal", "def": "Write-ahead log: every change is logged and flushed before commit returns. Drives crash recovery, replication and PITR."}, {"term": "Window frame", "see": "windows", "def": "The rows of the partition a window function sees for the current row. With ORDER BY the default is RANGE … CURRENT ROW, which includes ties."}, {"term": "Window function", "see": "windows", "def": "Computes over related rows without collapsing them: `rank()`, `lag()`, `sum() OVER (…)`."}, {"term": "Write skew", "see": "isolation", "def": "Two transactions read overlapping data, write different rows, and together break a rule. Allowed by snapshot isolation; stopped by Serializable or constraints."}, {"term": "XID wraparound", "see": "mvcc-wal", "def": "32-bit transaction ids eventually wrap. Unfrozen old rows would appear to be in the future, so Postgres forces vacuums and ultimately stops writes."}, {"term": "xmin horizon", "see": "mvcc-wal", "def": "The oldest transaction id any snapshot still needs. VACUUM can't remove versions newer than it; long transactions and slots hold it back."}]}}, "dataset": {"script": "-- Practice dataset for the SQL Databases study guide.\n-- Run it from any other database (it drops and recreates `practice`):\n--   psql -d postgres -f dataset.sql\n-- Then connect with:  psql -d practice\n-- Safe to re-run: every run starts from a clean copy.\n\nDROP DATABASE IF EXISTS practice WITH (FORCE);   -- FORCE (PG 13+) disconnects open sessions first\nCREATE DATABASE practice;\n\\c practice\nALTER DATABASE practice SET timezone TO 'UTC';    -- for future sessions\nSET timezone TO 'UTC';                            -- and this one\n\nCREATE TABLE users (\n  id          bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n  email       text NOT NULL UNIQUE,\n  name        text NOT NULL,\n  country     char(2),                             -- NULL = unknown\n  created_at  timestamptz NOT NULL,\n  referred_by bigint REFERENCES users (id)\n);\n\nCREATE TABLE products (\n  id       bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n  name     text NOT NULL,\n  category text NOT NULL,\n  price    numeric(10, 2) NOT NULL CHECK (price > 0)\n);\n\nCREATE TABLE orders (\n  id         bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n  user_id    bigint NOT NULL REFERENCES users (id),\n  status     text NOT NULL CHECK (status IN ('cart', 'pending', 'paid', 'cancelled')),\n  created_at timestamptz NOT NULL\n);\n\nCREATE TABLE order_items (\n  order_id   bigint NOT NULL REFERENCES orders (id),\n  product_id bigint NOT NULL REFERENCES products (id),\n  qty        int NOT NULL CHECK (qty > 0),\n  unit_price numeric(10, 2) NOT NULL,            -- price when ordered; may differ from products.price\n  PRIMARY KEY (order_id, product_id)\n);\n\nCREATE TABLE events (\n  id      bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n  user_id bigint NOT NULL REFERENCES users (id),\n  type    text NOT NULL,                         -- view, add_to_cart, checkout\n  at      timestamptz NOT NULL\n);\n\nCREATE TABLE employees (\n  id         bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n  name       text NOT NULL,\n  dept       text NOT NULL,\n  manager_id bigint REFERENCES employees (id),   -- NULL = the CEO\n  salary     int NOT NULL,\n  hired_on   date NOT NULL\n);\n\n-- Rows are inserted in id order, so the ids below are 1, 2, 3, …\nINSERT INTO users (email, name, country, created_at, referred_by) VALUES\n  ('ana@example.com',   'Ana',   'US', '2026-01-03 10:00Z', NULL),   -- 1\n  ('ben@example.com',   'Ben',   'US', '2026-01-05 12:30Z', 1),      -- 2\n  ('chloe@example.com', 'Chloe', 'FR', '2026-01-12 08:15Z', 1),      -- 3\n  ('dev@example.com',   'Dev',   'IN', '2026-02-01 17:45Z', 2),      -- 4\n  ('emma@example.com',  'Emma',  'DE', '2026-02-14 09:00Z', NULL),   -- 5\n  ('farid@example.com', 'Farid', NULL, '2026-02-20 21:10Z', NULL),   -- 6: country unknown\n  ('gia@example.com',   'Gia',   'US', '2026-03-02 11:00Z', 3),      -- 7: only a cart\n  ('hugo@example.com',  'Hugo',  'FR', '2026-03-15 09:55Z', NULL);   -- 8: no orders\n\nINSERT INTO products (name, category, price) VALUES\n  ('Mechanical keyboard', 'peripherals', 120.00),   -- 1\n  ('Wireless mouse',      'peripherals',  40.00),   -- 2\n  ('Monitor 27in',        'displays',    300.00),   -- 3\n  ('USB-C hub',           'peripherals',  35.00),   -- 4\n  ('Laptop stand',        'furniture',    60.00),   -- 5\n  ('Desk lamp',           'furniture',    45.00),   -- 6\n  ('Webcam',              'peripherals',  80.00),   -- 7\n  ('Monitor arm',         'furniture',    90.00);   -- 8: never ordered\n\nINSERT INTO orders (user_id, status, created_at) VALUES\n  (1, 'paid',      '2026-03-01 09:15Z'),   -- 1\n  (2, 'paid',      '2026-03-01 14:30Z'),   -- 2\n  (1, 'paid',      '2026-03-03 10:00Z'),   -- 3\n  (3, 'cancelled', '2026-03-03 11:20Z'), /* storage: localStorage with an in-memory fallback. Prefix sq.: Chrome shares one localStorage across all
   file:// pages, so this guide must not collide with algo-patterns (sg.) or system-design (sd.). */
const P = "sq.";
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} },
  keys() {
    const ks = new Set(Object.keys(mem));
    try { for (let i = 0; i < localStorage.length; i++) ks.add(localStorage.key(i)); } catch (e) {}
    return [...ks].filter(k => k.startsWith(P));
  },
};
const progKey = id => `${P}prog.${id}`;
const attKey = id => `${P}att.${id}`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const hl = code => Prism.highlight(String(code).replace(/\n+$/, ""), Prism.languages.sql, "sql");

/* ── markdown subset: paragraphs, - / 1. lists (2-space nesting), **bold**, `code`, ``` fences (sql highlighted), | tables |, > callouts */
const inline = s => String(s).split("`").map((seg, k) => k % 2 ? `<code>${esc(seg)}</code>`
  : esc(seg).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")).join("");
const LIST = /^(\s*)(?:([-*])|\d+\.)\s+(.*)$/;
function md(src) {
  const L = String(src || "").replace(/\s+$/, "").split("\n");
  const starts = l => /^\s*(```|\||> |[-*]\s|\d+\.\s)/.test(l);
  let out = "", i = 0;
  while (i < L.length) {
    const l = L[i], t = l.trim();
    if (!t) { i++; continue; }
    if (t.startsWith("```")) {
      const lang = t.slice(3).trim(), body = [];
      for (i++; i < L.length && !L[i].trim().startsWith("```"); i++) body.push(L[i]);
      i++;
      out += `<pre class="code">${lang && lang !== "sql" ? esc(body.join("\n")) : hl(body.join("\n"))}</pre>`;
    } else if (t.startsWith("|")) {
      const rows = [];
      while (i < L.length && L[i].trim().startsWith("|")) rows.push(L[i++].trim());
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const [head, ...rest] = rows.filter((r, k) => !(k === 1 && /^[|\s:-]+$/.test(r)));
      out += `<div class="tablewrap"><table class="ref"><thead><tr>${cells(head).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>
        <tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    } else if (l.startsWith(">")) {
      const q = [];
      while (i < L.length && L[i].startsWith(">")) q.push(L[i++].replace(/^>\s?/, ""));
      out += `<div class="callout">${inline(q.join(" "))}</div>`;
    } else if (LIST.test(l)) {
      const items = [];
      for (; i < L.length && L[i].trim(); i++) {
        const m = L[i].match(LIST);
        if (m) items.push({ ind: m[1].length, ol: !m[2], text: m[3] });
        else if (/^\s/.test(L[i])) items[items.length - 1].text += " " + L[i].trim();
        else break;
      }
      out += mdList(items);
    } else {
      const p = [];
      while (i < L.length && L[i].trim() && !(p.length && starts(L[i]))) p.push(L[i++].trim());
      out += `<p>${inline(p.join(" "))}</p>`;
    }
  }
  return out;
}
function mdList(items) {
  let out = "";
  const stack = [];
  items.forEach(it => {
    while (stack.length && it.ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
    const top = stack[stack.length - 1];
    if (!top || it.ind > top.ind) { const tag = it.ol ? "ol" : "ul"; stack.push({ ind: it.ind, tag }); out += `<${tag}>`; }
    else out += "</li>";
    out += `<li>${inline(it.text)}`;
  });
  while (stack.length) out += `</li></${stack.pop().tag}>`;
  return out;
}

/* ── catalog: Part A (01–09) and Part B (10–17) share one numbering */
const CAT = [...DATA.catalog.partA.map(c => ({ ...c, part: "A" })), ...DATA.catalog.partB.map(c => ({ ...c, part: "B" }))];
const TOPICS = Object.fromEntries(DATA.topics.map(t => [t.id, t]));
const topicNo = id => pad(CAT.findIndex(c => c.id === id) + 1);
const catName = id => (CAT.find(c => c.id === id) || { name: id }).name;
/* progress units: every problem, plus every Part B topic (its concepts) */
const UNITS = [];
const PROBS = {};
DATA.topics.forEach(t => {
  if (t.part === "B") UNITS.push({ id: t.id, label: t.name, topic: t.id });
  (t.problems || []).forEach(p => { PROBS[p.id] = { p, t }; UNITS.push({ id: p.id, label: p.title, topic: t.id }); });
});
const unitsOf = tid => UNITS.filter(u => u.topic === tid);

/* ── result tables */
const isNum = v => typeof v === "number" || (typeof v === "string" && /^-?\d+(\.\d+)?$/.test(v));
function resTable(cols, rows) {
  return `<div class="reswrap"><table class="res"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(v => v === null ? `<td class="nul">NULL</td>` : `<td${isNum(v) ? ` class="num"` : ""}>${esc(v === true ? "t" : v === false ? "f" : v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const codeBox = (sql, cls = "") => `<div class="cbox"><pre class="code ${cls}"><code>${hl(sql)}</code></pre>
  <button class="link copy" type="button" data-act="copy">Copy</button></div>`;

/* ── diagrams: frame tabs over a figure; each type renders one frame body */
function figure(d) {
  const body = { table: tableFrame, timeline: timelineFrame, plan: planFrame }[d.type];
  return `<figure class="fig">
    <div class="fr-tabs" role="tablist">${d.frames.map((f, i) => `<button type="button" role="tab" data-act="frame" data-frame="${i}" aria-selected="${i === 0}">${esc(f.title)}</button>`).join("")}</div>
    ${d.frames.map((f, i) => `<div data-fr="${i}"${i ? " hidden" : ""}>${body(d, f)}<p class="fr-note">${inline(f.note || "")}</p></div>`).join("")}
    <figcaption>${esc(d.caption || "")}</figcaption></figure>`;
}
function tableFrame(d, f) {
  const out = f.out ? (f.col || f.expr.match(/^\s*([a-z_]+)/i)[1]) : null;
  const win = new Set(f.win || []);
  const rows = d.rows.map((r, i) => {
    const cls = [i === f.cur ? "cur" : win.has(i) ? "win" : "", d.partition !== false && i && d.rows[i - 1][0] !== r[0] ? "split" : ""].join(" ").trim();
    const o = f.out ? (f.out[i] === null ? `<td class="o nul">NULL</td>` : `<td class="o">${esc(f.out[i])}</td>`) : "";
    return `<tr class="${cls}">${r.map(v => `<td>${esc(v)}</td>`).join("")}${o}</tr>`;
  }).join("");
  return `${f.expr ? `<div class="fr-expr">${hl(f.expr)}</div>` : ""}
    <div class="scrollx"><table class="dt"><thead><tr>${d.cols.map(c => `<th>${esc(c)}</th>`).join("")}${out ? `<th class="o">${esc(out)}</th>` : ""}</tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--hit);box-shadow:inset 3px 0 0 var(--easy)"></i>current row</span><span><i style="background:var(--accent-tint)"></i>in its frame</span></div>`;
}
function timelineFrame(d, f) {
  const ss = f.sessions || d.sessions;
  const rows = f.steps.map((s, i) => `<tr><td>${i + 1}</td>${ss.map(t => t === s.t
    ? `<td class="${s.mark ? `m-${s.mark}` : ""}"><span class="sql">${s.sql.startsWith("(") ? `<i>${esc(s.sql)}</i>` : hl(s.sql)}</span>${s.out ? `<span class="out">${inline(s.out)}</span>` : ""}</td>`
    : "<td></td>").join("")}</tr>`).join("");
  return `<div class="scrollx"><table class="tl"><thead><tr><th></th>${ss.map(t => `<th>${esc(t)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function planFrame(d, f) {
  const nodes = f.plan.map(n => {
    const dd = n.d || 0;
    return `<li class="d${dd}${n.mark ? " " + n.mark : ""}" style="margin-left:${dd * 26}px">
      <span><span class="op">${esc(n.op)}</span>${n.on ? `<span class="on">on ${esc(n.on)}</span>` : ""}</span>
      <span class="rows">${n.est !== undefined ? `est ${esc(n.est)} → ${esc(n.act)} rows` : ""}${n.ms ? `<span class="ms">${esc(n.ms)} ms</span>` : ""}</span>
      ${n.detail ? `<span class="det">${esc(n.detail)}</span>` : ""}</li>`;
  }).join("");
  return `<div class="fr-expr">${hl(f.query)}</div><div class="scrollx"><ul class="plan">${nodes}</ul></div>`;
}

function renderDrillPage() {
  return `<section class="sec" id="drill">

}
const drill = { order: [], pos: 0, score: 0, answered: false };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function drillStart() { Object.assign(drill, { order: shuffle(PG.drill.items.map((_, i) => i)), pos: 0, score: 0, answered: false }); drillRender(); }
function drillRender() {
  const el = document.getElementById("drillCard"), n = drill.order.length;
  if (drill.pos >= n) {
    el.innerHTML = `<p class="drill-q">Done: ${drill.score} / ${n} correct.</p>
      <div class="drill-actions"><button class="reveal" type="button" data-act="drillRestart">Shuffle and restart</button></div>`;
    return;
  }
  const it = PG.drill.items[drill.order[drill.pos]];
  el.innerHTML = `<div class="drill-h"><span>Question ${drill.pos + 1} / ${n}</span><span>Score ${drill.score}</span></div>
    <p class="drill-q">${inline(it.prompt)}</p>
    <div class="opts">${shuffle([it.answer, ...it.distractors]).map((id, k) => `<button class="opt" type="button" data-pick="${id}"><kbd>${k + 1}</kbd>${esc(catName(id))}</button>`).join("")}</div>
    <div class="verdict" hidden></div>
    <div class="drill-actions" hidden><button class="reveal" type="button" data-act="drillNext">${drill.pos + 1 === n ? "See score" : "Next"}</button></div>`;
  drill.answered = false;
}
function drillPick(id) {
  if (drill.answered) return;
  drill.answered = true;
  const it = PG.drill.items[drill.order[drill.pos]], ok = id === it.answer, el = document.getElementById("drillCard");
  if (ok) drill.score++;
  el.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.pick === it.answer) b.classList.add("right");
    else if (b.dataset.pick === id) b.classList.add("wrong");
  });
  const v = el.querySelector(".verdict");
  v.innerHTML = `${ok ? `<b class="ok">✓ Correct.</b>` : `<b class="no">✗ It's ${esc(catName(it.answer))}.</b>`} ${inline(it.why)} <a href="#${it.answer}">Review the topic →</a>`;
  v.hidden = false;
  el.querySelector(".drill-actions").hidden = false;
  el.querySelector("[data-act=drillNext]").focus();
  el.querySelector(".drill-h span:last-child").textContent = `Score ${drill.score}`;
}

/* ── editor: a Prism-highlighted <pre> behind a transparent textarea */
function paint(ta) {
  const pre = ta.previousElementSibling;
  pre.firstChild.innerHTML = Prism.highlight(ta.value, Prism.languages.sql, "sql") + "\n";
  pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
}
const UNIT = "  ";
function onKey(e) {
  const ta = e.target, { selectionStart: a, selectionEnd: b, value: v } = ta;
  const lineStart = v.lastIndexOf("\n", a - 1) + 1;
  if (e.key === "Escape") { ta.blur(); return; }
  if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); ta.setRangeText(UNIT, a, b, "end"); }
  else if (e.key === "Tab" && e.shiftKey) {
    e.preventDefault();
    if (v.startsWith(UNIT, lineStart)) ta.setRangeText("", lineStart, lineStart + UNIT.length, "preserve");
  } else if (e.key === "Enter" && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    const line = v.slice(lineStart, a);
    ta.setRangeText("\n" + line.match(/^\s*/)[0] + (/\(\s*$/.test(line) ? UNIT : ""), a, b, "end");
  } else return;
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}

/* ── copy / download / backup */
function flash(btn, msg) {
  const old = btn.textContent; btn.textContent = msg; btn.disabled = true;
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1200);
}
function copyText(text, btn) {
  const fallback = () => {          // file:// or older browsers without the Clipboard API
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    t.remove(); flash(btn, ok ? "Copied" : "Copy failed");
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(() => flash(btn, "Copied"), fallback);
  else fallback();
}
function download(name, text, type = "text/plain") {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportAll() {
  const data = Object.fromEntries(store.keys().map(k => [k, store.get(k, "")]));
  const day = new Date().toISOString().slice(0, 10);
  download(`sql-databases-progress-${day}.json`, JSON.stringify({ app: "sql-databases", version: 1, exported: new Date().toISOString(), data }, null, 2), "application/json");
}
function importAll(file) {
  file.text().then(txt => {
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { alert("That file isn't valid JSON."); return; }
    if (obj && obj.app && obj.app !== "sql-databases") { alert(`That backup is from "${obj.app}", not this guide.`); return; }
    const entries = Object.entries((obj && obj.data) || {}).filter(([k, v]) => k.startsWith(P) && typeof v === "string");
    if (!entries.length) { alert("No saved attempts or progress found in that file."); return; }
    if (!confirm(`Import ${entries.length} saved items? Matching items in this browser are overwritten; everything else is kept.`)) return;
    entries.forEach(([k, v]) => store.set(k, v));
    location.reload();
  });
}
function resetAll() {
  if (!confirm("Reset everything? This clears all attempts and progress marks for this guide in this browser.\n\nExport a backup first if you might want them back.")) return;
  store.keys().forEach(k => store.del(k));
  location.hash = "home";
  location.reload();
}

/* ── pages: every section is rendered once; the hash picks which one shows */
let PAGES = [], page = "home";
const SITE_LABELS = { home: "Home", cheat: "Cheat Sheet", dataset: "Practice Dataset", drill: "Technique Drill", glossary: "Glossary" };
const pageLabel = id => SITE_LABELS[id] || catName(id);
function pager(i) {
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  return `<nav class="pager" aria-label="Pages">
    ${prev ? `<a class="pbtn prev" href="#${prev}">← ${esc(pageLabel(prev))}</a>` : ""}
    ${next ? `<a class="pbtn next" href="#${next}">${esc(pageLabel(next))} →</a>` : ""}</nav>`;
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || "home";
  const el = document.getElementById(id), sec = el && el.closest("#main > .sec");
  page = sec ? sec.id : "home";
  document.querySelectorAll("#main > .sec").forEach(s => (s.hidden = s.id !== page));
  document.querySelectorAll(".side a").forEach(a => {
    const on = a.dataset.pid === page;
    a.classList.toggle("active", on);
    if (on && a.parentElement.scrollWidth > a.parentElement.clientWidth)
      a.parentElement.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
  });
  document.title = page === "home" ? "SQL Databases" : `${pageLabel(page)} · SQL Databases`;
  document.querySelectorAll(`#${page} textarea[data-att]`).forEach(paint);
  if (sec && el !== sec) el.scrollIntoView();
  else window.scrollTo(0, 0);
}
function go(step) {
  const next = PAGES[PAGES.indexOf(page) + step];
  if (next) location.hash = next;
}

function init() {
  const topics = CAT.filter(c => TOPICS[c.id]).map(c => TOPICS[c.id]);
  PAGES = ["home", "cheat", "dataset", ...topics.map(t => t.id), "drill", "glossary"];
  const main = document.getElementById("main");
  main.innerHTML = renderHome() + renderCheat() + renderDataset() + topics.map(renderTopic).join("") + renderDrillPage() + renderGlossary();
  PAGES.forEach((id, i) => document.getElementById(id).insertAdjacentHTML("beforeend", pager(i)));
  document.getElementById("side").innerHTML = renderSide();
  applyProgress(); drillStart(); filterGlossary(); route();
  window.addEventListener("hashchange", route);
  document.getElementById("glFilter").addEventListener("input", filterGlossary);
  window.addEventListener("afterprint", () => document.body.classList.remove("print-cheat"));

  main.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.att) { store.set(attKey(t.dataset.att), t.value); paint(t); }
  });
  main.addEventListener("scroll", e => {     // keep the highlight layer under the text (scroll doesn't bubble: capture)
    const t = e.target;
    if (t.dataset && t.dataset.att) { t.previousElementSibling.scrollTop = t.scrollTop; t.previousElementSibling.scrollLeft = t.scrollLeft; }
  }, true);
  main.addEventListener("keydown", e => { if (e.target.dataset && e.target.dataset.att) onKey(e); else if (e.key === "Escape" && /TEXTAREA|INPUT/.test(e.target.tagName)) e.target.blur(); });
  main.addEventListener("click", e => {
    const t = e.target;
    const actEl = t.closest("[data-act]"), act = actEl?.dataset.act;
    if (act === "exportAll") return exportAll();
    if (act === "importAll") return document.getElementById("importFile").click();
    if (act === "resetAll") return resetAll();
    if (act === "printCheat") { document.body.classList.add("print-cheat"); window.print(); return; }
    if (act === "drillNext") { drill.pos++; drillRender(); return; }
    if (act === "drillRestart") return drillStart();
    if (t.closest("[data-pick]")) return drillPick(t.closest("[data-pick]").dataset.pick);
    if (act === "downloadDataset") return download("dataset.sql", DATA.dataset.script, "application/sql");
    if (act === "copyDataset") return copyText(DATA.dataset.script, actEl);
    if (act === "copy") return copyText(actEl.closest(".cbox, .pane").querySelector("pre").textContent, actEl);
    if (act === "copyAtt") return copyText(actEl.closest(".pane").querySelector("textarea").value, actEl);
    if (act === "clearAtt") {
      const ta = actEl.closest(".pane").querySelector("textarea");
      if (ta.value.trim() && !confirm("Clear your attempt?")) return;
      ta.value = ""; store.del(attKey(ta.dataset.att)); paint(ta); return;
    }
    if (act === "frame") {
      const fig = actEl.closest(".fig"), i = actEl.dataset.frame;
      fig.querySelectorAll("[data-frame]").forEach(b => b.setAttribute("aria-selected", b === actEl));
      fig.querySelectorAll("[data-fr]").forEach(el => (el.hidden = el.dataset.fr !== i));
      return;
    }
    if (act === "revealAll") {
      const scope = actEl.closest(".reveal-scope"), open = !scope.classList.contains("allopen");
      scope.querySelectorAll(".unit").forEach(u => setUnit(u, open));
      return;
    }
    if (t.closest(".reveal")) {
      const unit = t.closest(".unit");
      return setUnit(unit, !unit.classList.contains("open"));
    }
    if (t.closest(".st")) {
      const st = t.closest(".st").dataset.st, id = t.closest("[data-unit]").dataset.unit;
      if (store.get(progKey(id), "") === st) store.del(progKey(id)); else store.set(progKey(id), st);
      applyProgress();
    }
  });
  document.getElementById("importFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (f) importAll(f); e.target.value = "";
  });
  /* keys (never while typing): ← → change page; on the drill page 1–4 answer, Enter goes next (focused button) */
  document.addEventListener("keydown", e => {
    if (/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
    if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); return go(e.key === "ArrowLeft" ? -1 : 1); }
    if (page !== "drill") return;
    if (/^[1-4]$/.test(e.key)) {
      const b = document.querySelectorAll("#drillCard .opt")[+e.key - 1];
      if (b && !b.disabled) { e.preventDefault(); drillPick(b.dataset.pick); }
    }
  });
}
init();
</script>
</body>
</html>
