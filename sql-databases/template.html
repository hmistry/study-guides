<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="__VERSION__">
<title>SQL Databases</title>
<style>
:root {
  /* Ocean: calm deep teal-blue on white (shared with algo-patterns and system-design) */
  --bg: #ffffff; --surface: #ffffff;
  --ink: #14262e; --ink-2: #4a5f68; --ink-3: #74878f;
  --rule: #d6e1e5; --code-bg: #f4f8f9; --code-rule: #d6e1e5;
  --accent: #0b6a87; --accent-tint: #e2f2f6; --hit: #dff3e4;
  --easy: #1a7f37;   --easy-bg: #dafbe1;
  --medium: #9a6700; --medium-bg: #fff8c5;
  --hard: #c0303a;   --hard-bg: #fdecea;
  --t-comment: #6b7d85; --t-keyword: #b4235a; --t-string: #2f6b1f; --t-number: #0b6a87;
  --t-fn: #7a3fb8; --t-builtin: #9a5b13; --t-op: #33454d;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --side-w: 240px;
}
[hidden] { display: none !important; }   /* component display rules must never beat [hidden] */
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--sans); }
code, pre { font-family: var(--mono); }
pre { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, textarea { font-family: var(--sans); }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.brand { font-size: 19px; font-weight: 700; letter-spacing: -.015em; color: var(--accent); text-decoration: none; white-space: nowrap; }
.ver { margin-left: -8px; font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
.tprog { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--ink-2); text-decoration: none; }
.tprog:hover { color: var(--accent); }

/* layout */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
.side { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; padding: 20px 12px 24px 20px; }
.side .grp { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 14px 10px 4px; }
.side .grp:first-child { padding-top: 0; }
.side a { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink-2); border-radius: 6px; padding: 5px 10px; font-weight: 550; font-size: 14px; }
.side a .n { font: 12px var(--mono); color: var(--ink-3); min-width: 22px; }
.side a .dot { margin-left: auto; }
.side .soon { display: flex; gap: 8px; padding: 3px 10px; font-size: 13px; color: var(--ink-3); }
.side .soon .n { font: 12px var(--mono); min-width: 22px; }
.side a:hover { background: var(--code-bg); color: var(--ink); }
.side a.active { background: var(--accent-tint); color: var(--accent); }
.side a.active .n { color: var(--accent); }
main { padding: 32px 44px 96px; min-width: 0; }

/* progress meter + small buttons */
.meter { width: 90px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 7px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--ink-3); }
.btn.danger { color: var(--hard); border-color: color-mix(in srgb, var(--hard) 45%, transparent); }
.btn.danger:hover { background: var(--hard-bg); border-color: var(--hard); }
.link { border: 0; background: none; font: 12.5px var(--sans); color: var(--ink-3); cursor: pointer; padding: 2px 4px; }
.link:hover { color: var(--ink); }

/* pager */
.pager { display: flex; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); }
.pbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface);
  border-radius: 8px; padding: 8px 16px; font: 550 14px var(--sans); text-decoration: none; cursor: pointer; }
.pbtn:hover { background: var(--accent-tint); }
.pbtn.fill { background: var(--accent); color: #fff; }
.pbtn.fill:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.pager .next { margin-left: auto; }

/* home */
.hero h1 { margin: 4px 0 8px; font-size: 32px; letter-spacing: -.025em; color: var(--accent); }
.hero .lead { max-width: 72ch; font-size: 16px; }
.hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 32px 0; }
.hcard { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; }
.hcard ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.hcard ol li { margin: 8px 0; }
.hcard a { color: var(--accent); text-decoration: none; font-weight: 550; }
.hcard p { margin: 8px 0 12px; color: var(--ink-2); font-size: 14px; }
.stats { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 6px; }
.stats b { font-size: 28px; letter-spacing: -.02em; }
.stats span { color: var(--ink-2); font-size: 14px; }
.meter.big { width: 100%; height: 8px; border-radius: 4px; }
.rlist { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.rlist li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
.rlist a { color: var(--accent); text-decoration: none; font-weight: 550; }
.rlist small { color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 12px 0 32px; }
.pcard { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--rule); border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; padding: 11px 14px; }
a.pcard:hover { border-color: var(--accent); }
.pcard .n { font: 12px var(--mono); color: var(--accent); }
.pcard .cnt { margin-left: auto; font: 11.5px var(--mono); color: var(--ink-3); font-weight: 400; }
.pcard.soon { border-style: dashed; color: var(--ink-3); font-weight: 450; }
.pcard.soon .n { color: var(--ink-3); }
.pcard.soon small { margin-left: auto; font-size: 11px; }
.dot { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); transform: translateY(-1px); }
.dot.st-done { background: var(--easy); border-color: var(--easy); }
.dot.st-review { background: var(--medium); border-color: var(--medium); }
.dot.st-part { background: linear-gradient(90deg, var(--easy) 50%, transparent 50%); border-color: var(--easy); }

/* page head + shared section parts */
.sec { padding-bottom: 8px; }
.p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 20px; }
.p-num { font: 600 14px var(--mono); color: var(--accent); }
.p-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.p-head .right { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { display: flex; gap: 6px; }
.st { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-3); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.st:hover { color: var(--ink); }
.st[data-st="done"][aria-pressed="true"] { background: var(--easy-bg); color: var(--easy); border-color: var(--easy); }
.st[data-st="review"][aria-pressed="true"] { background: var(--medium-bg); color: var(--medium); border-color: var(--medium); }
.lbl { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.signal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 28px; }
.signal .lbl { margin-right: 4px; }
.chip { font-size: 13px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); }
.blk { margin-bottom: 36px; }
.blk > p { margin: 10px 0 0; color: var(--ink-2); max-width: 85ch; }
.blk ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); max-width: 95ch; }
.blk li { margin: 9px 0; padding-left: 2px; }
.blk-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
code { font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre code { font-size: inherit; background: none; padding: 0; border-radius: 0; }
b { font-weight: 650; color: var(--ink); }
pre.code { padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 8px; font-size: 13px; line-height: 1.6; overflow-x: auto; white-space: pre; }

/* MySQL notes */
.mysql { border: 1px solid color-mix(in srgb, var(--medium) 35%, var(--rule)); background: linear-gradient(to right, var(--medium-bg), var(--surface) 70%); border-radius: 12px; padding: 16px 22px; }
.mysql .lbl { color: var(--medium); }
.mysql ul { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14.5px; }
.mysql li { margin: 7px 0; }
.mnote { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.mnote .tag { font: 600 10.5px var(--mono); color: var(--medium); background: var(--medium-bg); padding: 1px 6px; border-radius: 4px; margin-right: 6px; letter-spacing: .04em; }

/* concept: diagram beside key numbers */
.concept { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 24px; margin-bottom: 36px; align-items: start; }
.concept.solo { grid-template-columns: minmax(0, 1fr); }
.nums { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.nums dl { margin: 10px 0 0; display: grid; gap: 12px; }
.nums dt { font-size: 12.5px; color: var(--ink-3); }
.nums dd { margin: 0; font: 13px var(--mono); color: var(--ink); }

/* diagrams: frame tabs over one figure */
.fig { margin: 0; border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px; min-width: 0; }
.fr-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.fr-tabs button { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; }
.fr-tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.fr-note { margin: 14px 0 0; font-size: 14px; color: var(--ink-2); }
.fig figcaption { font: 12px var(--mono); color: var(--ink-3); margin-top: 8px; }
.fr-expr { font: 12.5px var(--mono); color: var(--ink); background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 7px; padding: 7px 12px; margin-bottom: 12px; overflow-x: auto; white-space: pre; }
.scrollx { overflow-x: auto; }

/* table diagram: highlighted rows of a small result */
table.dt { border-collapse: collapse; font: 13px var(--mono); min-width: 100%; }
.dt th, .dt td { padding: 6px 14px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
.dt th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.dt th.o, .dt td.o { color: var(--accent); font-weight: 600; border-left: 2px solid var(--accent-tint); }
.dt tr.win td { background: var(--accent-tint); }
.dt tr.cur td { background: var(--hit); font-weight: 600; }
.dt tr.cur td:first-child { box-shadow: inset 3px 0 0 var(--easy); }
.dt tr.split td { border-top: 2px solid var(--ink-3); }
.dt .nul { color: var(--ink-3); font-style: italic; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* timeline diagram: sessions side by side, time flowing down */
table.tl { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13px; table-layout: fixed; }
.tl th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); text-align: left; padding: 4px 12px 8px; border-bottom: 1.5px solid var(--rule); }
.tl th:first-child, .tl td:first-child { width: 34px; color: var(--ink-3); font: 11px var(--mono); text-align: right; padding-right: 8px; }
.tl td { padding: 6px 12px; vertical-align: top; border-bottom: 1px dashed var(--rule); }
.tl td + td + td { border-left: 1px solid var(--rule); }
.tl td + td { border-left: 1px solid var(--rule); }
.tl .sql { font: 12.5px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.tl .out { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-2); }
.tl .out::before { content: "→ "; color: var(--ink-3); }
.tl td.m-sees .out { color: var(--accent); }
.tl td.m-wait { background: var(--medium-bg); } .tl td.m-wait .out { color: var(--medium); font-weight: 600; }
.tl td.m-error { background: var(--hard-bg); } .tl td.m-error .out { color: var(--hard); font-weight: 600; }
.tl td.m-bad { background: var(--hard-bg); } .tl td.m-bad .out { color: var(--hard); font-weight: 650; }
.tl td.m-ok { background: var(--easy-bg); } .tl td.m-ok .out { color: var(--easy); font-weight: 650; }

/* plan diagram: an EXPLAIN tree */
.plan { list-style: none; margin: 0; padding: 0; min-width: 560px; }
.plan li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline;
  padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; margin-top: 8px; }
.plan li::before { content: ""; position: absolute; left: -14px; top: -9px; width: 12px; height: 26px; border-left: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); border-bottom-left-radius: 6px; }
.plan li.d0::before { display: none; }
.plan .op { font: 600 13.5px var(--sans); }
.plan .on { font: 12.5px var(--mono); color: var(--ink-2); margin-left: 6px; }
.plan .det { grid-column: 1 / -1; font: 12px var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
.plan .rows { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.plan .ms { color: var(--accent); font-weight: 600; margin-left: 10px; }
.plan li.bad { border-color: var(--hard); background: var(--hard-bg); }
.plan li.good { border-color: var(--easy); background: var(--easy-bg); }

/* markdown content */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 12px 0; }
.md ul, .md ol { margin: 10px 0; padding-left: 22px; }
.md li { margin: 7px 0; }
.md pre.code { margin: 12px 0; font-size: 12.5px; }
.md .tablewrap { margin: 14px 0; }
.callout { margin: 16px 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; color: var(--ink); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table.ref { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.6; }
.ref th, .ref td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ref tr:last-child td { border-bottom: 0; }
.ref th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--code-bg); white-space: nowrap; }
.ref td { color: var(--ink-2); }
.ref td:first-child { color: var(--ink); font-weight: 550; }
.tables { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; margin-bottom: 36px; }
/* query results: monospace, compact */
table.res { border-collapse: collapse; font: 12.5px var(--mono); min-width: 100%; }
.res th, .res td { padding: 5px 14px; text-align: left; border-bottom: 1px solid var(--rule); white-space: pre; }
.res tr:last-child td { border-bottom: 0; }
.res th { font-weight: 600; color: var(--ink-2); background: var(--code-bg); }
.res td { color: var(--ink); }
.res td.num { text-align: right; }
.res .nul { color: var(--ink-3); font-style: italic; }
.reswrap { overflow-x: auto; border: 1px solid var(--code-rule); border-radius: 8px; width: max-content; max-width: 100%; }

/* snippets: task, then code, result and note stacked */
.snip { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 8px 24px; padding: 20px 0; border-top: 1px solid var(--rule); }
.snip:last-child { border-bottom: 1px solid var(--rule); }
.snip-task { font-size: 14px; font-weight: 600; color: var(--ink); padding-top: 4px; }
.snip-task .tag { display: inline-block; margin-left: 4px; font: 600 10.5px var(--mono); color: var(--ink-3); border: 1px solid var(--rule); padding: 0 5px; border-radius: 4px; vertical-align: 1px; }
.snip-body { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.snip-note { font-size: 13.5px; color: var(--ink-2); }
.cbox { position: relative; }
.cbox .copy { position: absolute; top: 6px; right: 6px; opacity: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
.cbox:hover .copy, .cbox .copy:focus-visible { opacity: 1; }

pre.shell { color: var(--ink); }
pre.shell .ps { color: var(--ink-3); user-select: none; }
pre.shell .cm { color: var(--t-comment); font-style: italic; }
.req { font-size: 13.5px; color: var(--ink-2); }
.req b { color: var(--accent); }

/* cheat sheet */
.cheat-sec { margin-bottom: 40px; }
.cheat-sec > .lbl { display: block; margin-bottom: 12px; }
.ref td.num { font: 12px var(--mono); color: var(--accent); width: 1%; white-space: nowrap; }
.ref td.nm { font-weight: 600; white-space: nowrap; }
.ref td.nm a { color: var(--ink); text-decoration: none; }
.ref td.nm a:hover { color: var(--accent); }
.ref td.sx { font: 12.5px/1.55 var(--mono); color: var(--ink); white-space: pre-wrap; }
.ref td.sx code { background: none; padding: 0; font-size: inherit; }

/* technique drill */
.drill { border: 1px solid var(--rule); border-radius: 12px; padding: 24px 28px; }
.drill-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-3); }
.drill-q { font-size: 17.5px; margin: 0 0 20px; line-height: 1.6; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1px solid var(--rule); background: var(--surface); padding: 12px 14px; border-radius: 9px; cursor: pointer; font-size: 14.5px; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--easy); background: var(--easy-bg); }
.opt.wrong { border-color: var(--hard); background: var(--hard-bg); }
.opt kbd { font: 11px var(--mono); color: var(--ink-3); margin-right: 8px; }
.verdict { margin-top: 18px; padding: 14px 18px; border-radius: 9px; font-size: 14.5px; background: var(--code-bg); }
.verdict b.ok { color: var(--easy); }
.verdict b.no { color: var(--hard); }
.verdict a { color: var(--accent); font-weight: 550; text-decoration: none; }
.drill-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }

/* glossary */
.gl-tools { position: sticky; top: 56px; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 12px 0; margin-bottom: 8px; background: var(--bg); border-bottom: 1px solid var(--rule); }
.gl-tools input { flex: 1; max-width: 420px; font: 14px var(--sans); padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); background: var(--surface); }
.gl-tools input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.gl-tools span { font-size: 13px; color: var(--ink-3); }
.gl-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 6px 24px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.gl-term { font-weight: 650; }
.gl-def { color: var(--ink-2); }
.gl-def .pchip { margin-left: 6px; font-size: 12px; vertical-align: 1px; }
.pchip { display: inline-block; font-size: 13px; font-weight: 550; padding: 1px 9px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); text-decoration: none; white-space: nowrap; }
a.pchip:hover { text-decoration: underline; }
.pchip.soon { background: none; border: 1px dashed var(--rule); color: var(--ink-3); font-weight: 450; }
.gl-empty { color: var(--ink-3); font-style: italic; margin-top: 20px; }

/* quick checks */
.check { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
.q { margin: 0; font-weight: 550; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 16px; }
.reveal { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 14px; font: 550 13px var(--sans); cursor: pointer; }
.unit.open .actions .reveal { background: var(--surface); color: var(--accent); }
.ans-solo { margin-top: 16px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; font-size: 14.5px; }

/* problems */

.variant.disguise { background: var(--accent-tint); color: var(--accent); border-color: transparent; }

.disclose details[open] { flex-basis: 100%; }
.disclose summary { cursor: pointer; color: var(--accent); font-weight: 550; width: max-content; }
.disclose summary small { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.disclose details > :not(summary) { margin-top: 10px; }
.disclose p { color: var(--ink-2); }
.prob .tests { list-style: none; margin: 0; padding: 0; border: 1px solid var(--code-rule); border-radius: 8px; overflow: hidden; }
.prob .tests li { display: grid; margin: 0; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 8px 12px; background: var(--code-bg); align-items: baseline; }

.tests .texp { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.tests .texp.ok { color: var(--easy); } .tests .texp.err { color: var(--hard); } .tests .texp.idx { color: var(--accent); }

.pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--code-rule); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.pane-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--code-rule); min-height: 34px; }

.pane.sol { border-color: var(--accent); }
.pane.sol .pane-h { background: var(--accent-tint); }
.pane.sol .lbl { color: var(--accent); }
.pane .code { flex: 1; border: 0; border-radius: 0; }
.tools { display: flex; gap: 6px; }
.ed { position: relative; flex: 1; display: flex; min-height: 0; }
.ed textarea { flex: 1; width: 100%; min-height: 150px; border: 0; resize: vertical; background: transparent; padding: 14px 16px; font: 13px/1.6 var(--mono);
  tab-size: 2; outline: none; white-space: pre; overflow-x: auto; position: relative; z-index: 1;
  color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--ink); }
.ed textarea::placeholder { -webkit-text-fill-color: var(--ink-3); color: var(--ink-3); }
.ed textarea::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.ed .ed-hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; padding: 14px 16px; font-size: 13px; line-height: 1.6; background: none; border: 0; color: var(--ink); }
.after { margin-top: 16px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; font-size: 14.5px; }
.after p { margin: 0; }
.after .mnote { margin-top: 10px; }

/* dataset page */
.ds-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 0; }
.ds-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.ds-chips a { font: 12.5px var(--mono); padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); text-decoration: none; }
.ds-chips a:hover { border-color: var(--accent); color: var(--accent); }
.dtab { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; scroll-margin-top: 80px; }
.dtab h3 { margin: 0 0 4px; font: 650 17px var(--mono); }
.dtab .cols { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }

.dtab .cons { margin: 0 0 14px; padding-left: 18px; font: 12px var(--mono); color: var(--ink-2); }
.dtab .cons li { margin: 3px 0; }

/* prism tokens */
.token.comment { color: var(--t-comment); font-style: italic; }

.token.number, .token.boolean { color: var(--t-number); }
.token.function { color: var(--t-fn); }
.token.operator, .token.punctuation { color: var(--t-op); }

/* narrow */
@media (max-width: 960px) {

}
@media (max-width: 760px) {

  .side { position: sticky; top: 56px; z-index: 5; display: flex; gap: 4px; max-height: none; overflow-x: auto; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .side a { white-space: nowrap; }
  .side .grp, .side .soon, .side a .dot { display: none; }
  html { scroll-padding-top: 112px; }
  main { padding: 24px 16px 64px; }
  .top { padding: 0 16px; gap: 10px; }
  .brand { font-size: 17px; }
  .tprog .meter { display: none; }
  .hgrid { grid-template-columns: minmax(0, 1fr); }
  .pager .pbtn { padding: 8px 12px; font-size: 13px; }
  .check, .prob, .dtab, .fig { padding: 16px; }
  .p-head .right, .prob-h .status { margin-left: 0; }
  .prob, .dtab { scroll-margin-top: 120px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .gl-row { grid-template-columns: minmax(0, 1fr); }

}
/* print: the cheat sheet alone */
@media print {
  .top, .side, .pager, .p-head .right { display: none !important; }

  main { padding: 0; }

  .ref th, .ref td { padding: 5px 8px; font-size: 10.5px; }
  .tablewrap { overflow: visible; }
}

<body>
<header class="top">
  <a class="brand" href="#home">SQL Databases</a><span class="ver" title="Guide version">v__VERSION__</span>
  <a class="tprog" href="#home" title="Progress · open Home"><span class="meter"><i id="meter"></i></span><span id="progText"></span></a>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const DATA = /*__DATA__*/null;

/* storage: localStorage with an in-memory fallback. Prefix sq.: Chrome shares one localStorage across all
   file:// pages, so this guide must not collide with algo-patterns (sg.) or system-design (sd.). */
const P = "sq.";
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} },
  keys() {
    const ks = new Set(Object.keys(mem));
    try { for (let i = 0; i < localStorage.length; i++) ks.add(localStorage.key(i)); } catch (e) {}
    return [...ks].filter(k => k.startsWith(P));
  },
};
const progKey = id => `${P}prog.${id}`;
const attKey = id => `${P}att.${id}`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const hl = code => Prism.highlight(String(code).replace(/\n+$/, ""), Prism.languages.sql, "sql");

/* ── markdown subset: paragraphs, - / 1. lists (2-space nesting), **bold**, `code`, ``` fences (sql highlighted), | tables |, > callouts */
const inline = s => String(s).split("`").map((seg, k) => k % 2 ? `<code>${esc(seg)}</code>`
  : esc(seg).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")).join("");
const LIST = /^(\s*)(?:([-*])|\d+\.)\s+(.*)$/;
function md(src) {
  const L = String(src || "").replace(/\s+$/, "").split("\n");
  const starts = l => /^\s*(```|\||> |[-*]\s|\d+\.\s)/.test(l);
  let out = "", i = 0;
  while (i < L.length) {
    const l = L[i], t = l.trim();
    if (!t) { i++; continue; }
    if (t.startsWith("```")) {
      const lang = t.slice(3).trim(), body = [];
      for (i++; i < L.length && !L[i].trim().startsWith("```"); i++) body.push(L[i]);
      i++;
      out += `<pre class="code">${lang && lang !== "sql" ? esc(body.join("\n")) : hl(body.join("\n"))}</pre>`;
    } else if (t.startsWith("|")) {
      const rows = [];
      while (i < L.length && L[i].trim().startsWith("|")) rows.push(L[i++].trim());
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const [head, ...rest] = rows.filter((r, k) => !(k === 1 && /^[|\s:-]+$/.test(r)));
      out += `<div class="tablewrap"><table class="ref"><thead><tr>${cells(head).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>
        <tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    } else if (l.startsWith(">")) {
      const q = [];
      while (i < L.length && L[i].startsWith(">")) q.push(L[i++].replace(/^>\s?/, ""));
      out += `<div class="callout">${inline(q.join(" "))}</div>`;
    } else if (LIST.test(l)) {
      const items = [];
      for (; i < L.length && L[i].trim(); i++) {
        const m = L[i].match(LIST);
        if (m) items.push({ ind: m[1].length, ol: !m[2], text: m[3] });
        else if (/^\s/.test(L[i])) items[items.length - 1].text += " " + L[i].trim();
        else break;
      }
      out += mdList(items);
    } else {
      const p = [];
      while (i < L.length && L[i].trim() && !(p.length && starts(L[i]))) p.push(L[i++].trim());
      out += `<p>${inline(p.join(" "))}</p>`;
    }
  }
  return out;
}
function mdList(items) {
  let out = "";
  const stack = [];
  items.forEach(it => {
    while (stack.length && it.ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
    const top = stack[stack.length - 1];
    if (!top || it.ind > top.ind) { const tag = it.ol ? "ol" : "ul"; stack.push({ ind: it.ind, tag }); out += `<${tag}>`; }
    else out += "</li>";
    out += `<li>${inline(it.text)}`;
  });
  while (stack.length) out += `</li></${stack.pop().tag}>`;
  return out;
}

/* ── catalog: Part A (01–09) and Part B (10–17) share one numbering */
const CAT = [...DATA.catalog.partA.map(c => ({ ...c, part: "A" })), ...DATA.catalog.partB.map(c => ({ ...c, part: "B" }))];
const TOPICS = Object.fromEntries(DATA.topics.map(t => [t.id, t]));
const topicNo = id => pad(CAT.findIndex(c => c.id === id) + 1);
const catName = id => (CAT.find(c => c.id === id) || { name: id }).name;
/* progress units: every problem, plus every Part B topic (its concepts) */
const UNITS = [];
const PROBS = {};
DATA.topics.forEach(t => {
  if (t.part === "B") UNITS.push({ id: t.id, label: t.name, topic: t.id });
  (t.problems || []).forEach(p => { PROBS[p.id] = { p, t }; UNITS.push({ id: p.id, label: p.title, topic: t.id }); });
});
const unitsOf = tid => UNITS.filter(u => u.topic === tid);

/* ── result tables */
const isNum = v => typeof v === "number" || (typeof v === "string" && /^-?\d+(\.\d+)?$/.test(v));
function resTable(cols, rows) {
  return `<div class="reswrap"><table class="res"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(v => v === null ? `<td class="nul">NULL</td>` : `<td${isNum(v) ? ` class="num"` : ""}>${esc(v === true ? "t" : v === false ? "f" : v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const codeBox = (sql, cls = "") => `<div class="cbox"><pre class="code ${cls}"><code>${hl(sql)}</code></pre>
  <button class="link copy" type="button" data-act="copy">Copy</button></div>`;

/* ── diagrams: frame tabs over a figure; each type renders one frame body */
function figure(d) {
  const body = { table: tableFrame, timeline: timelineFrame, plan: planFrame }[d.type];
  return `<figure class="fig">
    <div class="fr-tabs" role="tablist">${d.frames.map((f, i) => `<button type="button" role="tab" data-act="frame" data-frame="${i}" aria-selected="${i === 0}">${esc(f.title)}</button>`).join("")}</div>
    ${d.frames.map((f, i) => `<div data-fr="${i}"${i ? " hidden" : ""}>${body(d, f)}<p class="fr-note">${inline(f.note || "")}</p></div>`).join("")}
    <figcaption>${esc(d.caption || "")}</figcaption></figure>`;
}
function tableFrame(d, f) {
  const out = f.out ? (f.col || f.expr.match(/^\s*([a-z_]+)/i)[1]) : null;
  const win = new Set(f.win || []);
  const rows = d.rows.map((r, i) => {
    const cls = [i === f.cur ? "cur" : win.has(i) ? "win" : "", d.partition !== false && i && d.rows[i - 1][0] !== r[0] ? "split" : ""].join(" ").trim();
    const o = f.out ? (f.out[i] === null ? `<td class="o nul">NULL</td>` : `<td class="o">${esc(f.out[i])}</td>`) : "";
    return `<tr class="${cls}">${r.map(v => `<td>${esc(v)}</td>`).join("")}${o}</tr>`;
  }).join("");
  return `${f.expr ? `<div class="fr-expr">${hl(f.expr)}</div>` : ""}
    <div class="scrollx"><table class="dt"><thead><tr>${d.cols.map(c => `<th>${esc(c)}</th>`).join("")}${out ? `<th class="o">${esc(out)}</th>` : ""}</tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--hit);box-shadow:inset 3px 0 0 var(--easy)"></i>current row</span><span><i style="background:var(--accent-tint)"></i>in its frame</span></div>`;
}
function timelineFrame(d, f) {
  const ss = f.sessions || d.sessions;
  const rows = f.steps.map((s, i) => `<tr><td>${i + 1}</td>${ss.map(t => t === s.t
    ? `<td class="${s.mark ? `m-${s.mark}` : ""}"><span class="sql">${s.sql.startsWith("(") ? `<i>${esc(s.sql)}</i>` : hl(s.sql)}</span>${s.out ? `<span class="out">${inline(s.out)}</span>` : ""}</td>`
    : "<td></td>").join("")}</tr>`).join("");
  return `<div class="scrollx"><table class="tl"><thead><tr><th></th>${ss.map(t => `<th>${esc(t)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function planFrame(d, f) {
  const nodes = f.plan.map(n => {
    const dd = n.d || 0;
    return `<li class="d${dd}${n.mark ? " " + n.mark : ""}" style="margin-left:${dd * 26}px">
      <span><span class="op">${esc(n.op)}</span>${n.on ? `<span class="on">on ${esc(n.on)}</span>` : ""}</span>
      <span class="rows">${n.est !== undefined ? `est ${esc(n.est)} → ${esc(n.act)} rows` : ""}${n.ms ? `<span class="ms">${esc(n.ms)} ms</span>` : ""}</span>
      ${n.detail ? `<span class="det">${esc(n.detail)}</span>` : ""}</li>`;
  }).join("");
  return `<div class="fr-expr">${hl(f.query)}</div><div class="scrollx"><ul class="plan">${nodes}</ul></div>`;
}

/* ── pages */
function statusBtns(id) {
  return `<span class="status" role="group" aria-label="Progress" data-unit="${id}">
    <button class="st" type="button" data-st="review" aria-pressed="false">↺ Review again</button>
    <button class="st" type="button" data-st="done" aria-pressed="false">✓ Got it</button></span>`;
}

function renderHome() {
  const card = c => {
    const n = topicNo(c.id);
    if (!TOPICS[c.id]) return `<div class="pcard soon"><span class="n">${n}</span>${esc(c.name)}<small>soon</small></div>`;
    return `<a class="pcard" href="#${c.id}"><span class="n">${n}</span>${esc(c.name)}<span class="cnt" data-cnt="${c.id}"></span><i class="dot" data-dot="${c.id}"></i></a>`;
  };
  return `<section class="sec" id="home">
    <div class="hero"><h1>SQL Databases</h1>
      <p class="lead">Backend / staff-level interview prep on PostgreSQL, with MySQL differences noted. ${DATA.catalog.partA.length} querying topics with
        verified problems, and ${DATA.catalog.partB.length} design and internals topics: indexes, planning, transactions, locking, MVCC and scaling.
        Every solution and snippet on this page was run against a real Postgres when the page was built.</p>
      <a class="pbtn fill" id="continue" href="#">Start</a></div>
    <div class="hgrid">
      <div class="hcard"><span class="lbl">How to use</span><ol>
        <li>Skim the <a href="#dataset">Practice Dataset</a>: every problem uses those six tables. Load it into a local <code>psql</code> to run your attempts.</li>
        <li><b>Problems:</b> write your query, check it against the expected result, then reveal the solution beside it.</li>
        <li><b>Design topics:</b> read, then answer the quick checks before revealing. <b>Reveal all</b> opens everything on a page for a last review.</li>
        <li>Mark each problem and design topic <b>Got it</b> or <b>Review again</b>. Items to review collect here.</li>
        <li>Test yourself with the <a href="#drill">Technique Drill</a>; look terms up in the <a href="#glossary">Glossary</a>; skim the <a href="#cheat">Cheat Sheet</a> last.</li>
      </ol></div>
      <div class="hcard"><span class="lbl">Progress</span><div id="homeStats"></div><ul class="rlist" id="reviewList"></ul></div>
    </div>
    <span class="lbl">Setup & querying</span>
    <div class="pgrid">${DATA.catalog.partA.map(card).join("")}</div>
    <span class="lbl">Design & internals</span>
    <div class="pgrid">${DATA.catalog.partB.map(card).join("")}</div>
    <div class="hcard"><span class="lbl">Your data</span>
      <p>Attempts and progress auto-save in this browser only. Export a backup to keep them or move them to another browser.</p>
      <button class="btn" data-act="exportAll" type="button">Export backup</button>
      <button class="btn" data-act="importAll" type="button">Import backup</button>
      <button class="btn danger" data-act="resetAll" type="button">Reset all…</button></div>
  </section>`;
}

function updateHome() {
  const st = id => store.get(progKey(id), "");
  const done = UNITS.filter(u => st(u.id) === "done").length;
  const review = UNITS.filter(u => st(u.id) === "review");
  const next = UNITS.find(u => st(u.id) !== "done");
  const cont = document.getElementById("continue");
  cont.hidden = !next;
  if (next) { cont.href = `#${next.id}`; cont.textContent = `${done || review.length ? "Continue" : "Start"}: ${next.label} →`; }
  const n = UNITS.length;
  document.getElementById("homeStats").innerHTML = `<div class="stats"><b>${done} / ${n}</b><span>done · ${review.length} to review · ${n - done - review.length} not started</span></div>
    <div class="meter big"><i style="width:${n ? (100 * done) / n : 0}%"></i></div>`;
  document.getElementById("reviewList").innerHTML = review.length
    ? review.map(u => `<li><i class="dot st-review"></i><a href="#${u.id}">${esc(u.label)}</a><small>${esc(catName(u.topic))}</small></li>`).join("")
    : `<li class="empty">Nothing marked for review yet.</li>`;
}

function renderDataset() {
  const ds = DATA.dataset;
  const table = t => `<div class="dtab" id="ds-${t.name}">
    <h3>${esc(t.name)}</h3>
    <div class="cols">${t.columns.map(c => `<span class="col">${esc(c.name)}<i>${esc(c.type)}${c.notnull ? "" : " · null"}</i></span>`).join("")}</div>
    <ul class="cons">${t.constraints.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    ${resTable(t.cols, t.rows)}</div>`;
  return `<section class="sec" id="dataset">
    <div class="p-head"><h2>Practice Dataset</h2></div>
    <div class="blk"><p>Six small tables: a shop (users, products, orders, order items, events) and an org chart (employees). Every problem runs against exactly these rows,
      which include the edge cases the problems need: NULL countries, salary ties, a user with no orders, a product never ordered, cancelled orders between paid ones.
      Times are UTC. The tables below are read from the database at build time, so they always match the script.</p></div>
    <div class="blk"><span class="lbl">Run it locally</span>
      ${codeBox("-- macOS: brew install postgresql@18 && brew services start postgresql@18\n-- save the script below as dataset.sql, then from a shell:\n--   psql -d postgres -f dataset.sql\n--   psql -d practice")}
      <div class="ds-tools"><button class="btn" type="button" data-act="downloadDataset">Download dataset.sql</button>
        <button class="btn" type="button" data-act="copyDataset">Copy script</button>
        <span class="kbd">Re-running it drops and recreates the <code>practice</code> database.</span></div></div>
    <div class="blk"><span class="lbl">Tables</span>

function testLine(t) {

function renderDrillPage() {
  return `<section class="sec" id="drill">
    <div class="p-head"><h2>Technique Drill</h2></div>

    <div class="drill" id="drillCard"></div></section>`;
}
const drill = { order: [], pos: 0, score: 0, answered: false };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function drillStart() { Object.assign(drill, { order: shuffle(PG.drill.items.map((_, i) => i)), pos: 0, score: 0, answered: false }); drillRender(); }
function drillRender() {
  const el = document.getElementById("drillCard"), n = drill.order.length;
  if (drill.pos >= n) {
    el.innerHTML = `<p class="drill-q">Done: ${drill.score} / ${n} correct.</p>
      <div class="drill-actions"><button class="reveal" type="button" data-act="drillRestart">Shuffle and restart</button></div>`;
    return;
  }
  const it = PG.drill.items[drill.order[drill.pos]];
  el.innerHTML = `<div class="drill-h"><span>Question ${drill.pos + 1} / ${n}</span><span>Score ${drill.score}</span></div>
    <p class="drill-q">${inline(it.prompt)}</p>
    <div class="opts">${shuffle([it.answer, ...it.distractors]).map((id, k) => `<button class="opt" type="button" data-pick="${id}"><kbd>${k + 1}</kbd>${esc(catName(id))}</button>`).join("")}</div>
    <div class="verdict" hidden></div>
    <div class="drill-actions" hidden><button class="reveal" type="button" data-act="drillNext">${drill.pos + 1 === n ? "See score" : "Next"}</button></div>`;
  drill.answered = false;
}
function drillPick(id) {
  if (drill.answered) return;
  drill.answered = true;
  const it = PG.drill.items[drill.order[drill.pos]], ok = id === it.answer, el = document.getElementById("drillCard");
  if (ok) drill.score++;
  el.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.pick === it.answer) b.classList.add("right");
    else if (b.dataset.pick === id) b.classList.add("wrong");
  });
  const v = el.querySelector(".verdict");
  v.innerHTML = `${ok ? `<b class="ok">✓ Correct.</b>` : `<b class="no">✗ It's ${esc(catName(it.answer))}.</b>`} ${inline(it.why)} <a href="#${it.answer}">Review the topic →</a>`;
  v.hidden = false;
  el.querySelector(".drill-actions").hidden = false;
  el.querySelector("[data-act=drillNext]").focus();
  el.querySelector(".drill-h span:last-child").textContent = `Score ${drill.score}`;
}

function renderGlossary() {

function filterGlossary() {

/* ── progress: unit buttons, topic dots (done / partly / review), top bar, home */
function applyProgress() {

  });

    const us = unitsOf(t.id), d = us.filter(u => st(u.id) === "done").length, r = us.some(u => st(u.id) === "review");
    const cls = r ? "st-review" : us.length && d === us.length ? "st-done" : d ? "st-part" : "";
    document.querySelectorAll(`[data-dot="${t.id}"]`).forEach(el => (el.className = `dot ${cls}`));
    document.querySelectorAll(`[data-cnt="${t.id}"]`).forEach(el => (el.textContent = `${d}/${us.length}`));

/* ── reveal: one unit (a check or a problem), or every unit on the page */
function setUnit(unit, open) {

function syncRevealAll(scope) {

/* ── editor: a Prism-highlighted <pre> behind a transparent textarea */
function paint(ta) {
  const pre = ta.previousElementSibling;
  pre.firstChild.innerHTML = Prism.highlight(ta.value, Prism.languages.sql, "sql") + "\n";
  pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
}
const UNIT = "  ";
function onKey(e) {
  const ta = e.target, { selectionStart: a, selectionEnd: b, value: v } = ta;
  const lineStart = v.lastIndexOf("\n", a - 1) + 1;
  if (e.key === "Escape") { ta.blur(); return; }
  if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); ta.setRangeText(UNIT, a, b, "end"); }
  else if (e.key === "Tab" && e.shiftKey) {
    e.preventDefault();
    if (v.startsWith(UNIT, lineStart)) ta.setRangeText("", lineStart, lineStart + UNIT.length, "preserve");
  } else if (e.key === "Enter" && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    const line = v.slice(lineStart, a);
    ta.setRangeText("\n" + line.match(/^\s*/)[0] + (/\(\s*$/.test(line) ? UNIT : ""), a, b, "end");
  } else return;
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}

/* ── copy / download / backup */
function flash(btn, msg) {
  const old = btn.textContent; btn.textContent = msg; btn.disabled = true;
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1200);
}
function copyText(text, btn) {
  const fallback = () => {          // file:// or older browsers without the Clipboard API
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    t.remove(); flash(btn, ok ? "Copied" : "Copy failed");
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(() => flash(btn, "Copied"), fallback);
  else fallback();
}
function download(name, text, type = "text/plain") {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportAll() {
  const data = Object.fromEntries(store.keys().map(k => [k, store.get(k, "")]));
  const day = new Date().toISOString().slice(0, 10);
  download(`sql-databases-progress-${day}.json`, JSON.stringify({ app: "sql-databases", version: 1, exported: new Date().toISOString(), data }, null, 2), "application/json");
}
function importAll(file) {
  file.text().then(txt => {
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { alert("That file isn't valid JSON."); return; }
    if (obj && obj.app && obj.app !== "sql-databases") { alert(`That backup is from "${obj.app}", not this guide.`); return; }
    const entries = Object.entries((obj && obj.data) || {}).filter(([k, v]) => k.startsWith(P) && typeof v === "string");
    if (!entries.length) { alert("No saved attempts or progress found in that file."); return; }
    if (!confirm(`Import ${entries.length} saved items? Matching items in this browser are overwritten; everything else is kept.`)) return;
    entries.forEach(([k, v]) => store.set(k, v));
    location.reload();
  });
}
function resetAll() {
  if (!confirm("Reset everything? This clears all attempts and progress marks for this guide in this browser.\n\nExport a backup first if you might want them back.")) return;
  store.keys().forEach(k => store.del(k));
  location.hash = "home";
  location.reload();
}

/* ── pages: every section is rendered once; the hash picks which one shows */
let PAGES = [], page = "home";
const SITE_LABELS = { home: "Home", cheat: "Cheat Sheet", dataset: "Practice Dataset", drill: "Technique Drill", glossary: "Glossary" };
const pageLabel = id => SITE_LABELS[id] || catName(id);
function pager(i) {
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  return `<nav class="pager" aria-label="Pages">
    ${prev ? `<a class="pbtn prev" href="#${prev}">← ${esc(pageLabel(prev))}</a>` : ""}
    ${next ? `<a class="pbtn next" href="#${next}">${esc(pageLabel(next))} →</a>` : ""}</nav>`;
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || "home";
  const el = document.getElementById(id), sec = el && el.closest("#main > .sec");
  page = sec ? sec.id : "home";
  document.querySelectorAll("#main > .sec").forEach(s => (s.hidden = s.id !== page));
  document.querySelectorAll(".side a").forEach(a => {
    const on = a.dataset.pid === page;
    a.classList.toggle("active", on);
    if (on && a.parentElement.scrollWidth > a.parentElement.clientWidth)
      a.parentElement.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
  });
  document.title = page === "home" ? "SQL Databases" : `${pageLabel(page)} · SQL Databases`;
  document.querySelectorAll(`#${page} textarea[data-att]`).forEach(paint);
  if (sec && el !== sec) el.scrollIntoView();
  else window.scrollTo(0, 0);
}
function go(step) {
  const next = PAGES[PAGES.indexOf(page) + step];
  if (next) location.hash = next;
}

function init() {
  const topics = CAT.filter(c => TOPICS[c.id]).map(c => TOPICS[c.id]);
  PAGES = ["home", "cheat", "dataset", ...topics.map(t => t.id), "drill", "glossary"];
  const main = document.getElementById("main");
  main.innerHTML = renderHome() + renderCheat() + renderDataset() + topics.map(renderTopic).join("") + renderDrillPage() + renderGlossary();
  PAGES.forEach((id, i) => document.getElementById(id).insertAdjacentHTML("beforeend", pager(i)));
  document.getElementById("side").innerHTML = renderSide();
  applyProgress(); drillStart(); filterGlossary(); route();
  window.addEventListener("hashchange", route);
  document.getElementById("glFilter").addEventListener("input", filterGlossary);
  window.addEventListener("afterprint", () => document.body.classList.remove("print-cheat"));

  main.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.att) { store.set(attKey(t.dataset.att), t.value); paint(t); }
  });
  main.addEventListener("scroll", e => {     // keep the highlight layer under the text (scroll doesn't bubble: capture)
    const t = e.target;
    if (t.dataset && t.dataset.att) { t.previousElementSibling.scrollTop = t.scrollTop; t.previousElementSibling.scrollLeft = t.scrollLeft; }
  }, true);
  main.addEventListener("keydown", e => { if (e.target.dataset && e.target.dataset.att) onKey(e); else if (e.key === "Escape" && /TEXTAREA|INPUT/.test(e.target.tagName)) e.target.blur(); });
  main.addEventListener("click", e => {
    const t = e.target;
    const actEl = t.closest("[data-act]"), act = actEl?.dataset.act;
    if (act === "exportAll") return exportAll();
    if (act === "importAll") return document.getElementById("importFile").click();
    if (act === "resetAll") return resetAll();
    if (act === "printCheat") { document.body.classList.add("print-cheat"); window.print(); return; }
    if (act === "drillNext") { drill.pos++; drillRender(); return; }
    if (act === "drillRestart") return drillStart();
    if (t.closest("[data-pick]")) return drillPick(t.closest("[data-pick]").dataset.pick);
    if (act === "downloadDataset") return download("dataset.sql", DATA.dataset.script, "application/sql");
    if (act === "copyDataset") return copyText(DATA.dataset.script, actEl);
    if (act === "copy") return copyText(actEl.closest(".cbox, .pane").querySelector("pre").textContent, actEl);
    if (act === "copyAtt") return copyText(actEl.closest(".pane").querySelector("textarea").value, actEl);
    if (act === "clearAtt") {
      const ta = actEl.closest(".pane").querySelector("textarea");
      if (ta.value.trim() && !confirm("Clear your attempt?")) return;
      ta.value = ""; store.del(attKey(ta.dataset.att)); paint(ta); return;
    }
    if (act === "frame") {
      const fig = actEl.closest(".fig"), i = actEl.dataset.frame;
      fig.querySelectorAll("[data-frame]").forEach(b => b.setAttribute("aria-selected", b === actEl));
      fig.querySelectorAll("[data-fr]").forEach(el => (el.hidden = el.dataset.fr !== i));
      return;
    }
    if (act === "revealAll") {
      const scope = actEl.closest(".reveal-scope"), open = !scope.classList.contains("allopen");
      scope.querySelectorAll(".unit").forEach(u => setUnit(u, open));
      return;
    }
    if (t.closest(".reveal")) {
      const unit = t.closest(".unit");
      return setUnit(unit, !unit.classList.contains("open"));
    }
    if (t.closest(".st")) {
      const st = t.closest(".st").dataset.st, id = t.closest("[data-unit]").dataset.unit;
      if (store.get(progKey(id), "") === st) store.del(progKey(id)); else store.set(progKey(id), st);
      applyProgress();
    }
  });
  document.getElementById("importFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (f) importAll(f); e.target.value = "";
  });
  /* keys (never while typing): ← → change page; on the drill page 1–4 answer, Enter goes next (focused button) */
  document.addEventListener("keydown", e => {
    if (/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
    if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); return go(e.key === "ArrowLeft" ? -1 : 1); }
    if (page !== "drill") return;
    if (/^[1-4]$/.test(e.key)) {
      const b = document.querySelectorAll("#drillCard .opt")[+e.key - 1];
      if (b && !b.disabled) { e.preventDefault(); drillPick(b.dataset.pick); }
    }
  });
}
init();
</script>
</body>
</html>
