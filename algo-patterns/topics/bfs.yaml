id: bfs
name: BFS
signal: ["fewest steps / shortest path (unweighted)", level order / by depth, "spreads every minute (rot, fire, infection)", grid or graph neighbours]
idea: >-
  Process nodes in waves from a queue: everything at distance d leaves before anything at d + 1, so the first visit to a node is by a shortest path (equal edge costs only).
  Mark visited when you enqueue, snapshot `len(queue)` to handle one level per round, and seed every source at once for multi-source spreads.
  O(V + E) time and space.
diagram:
  type: grid
  caption: "one ring per round · first visit = shortest"
  frames:
    - {rows: [["", "", "", 1, "", "", ""], ["", "", 1, 0, 1, "", ""], ["", "", "", 1, "", "", ""]], win: [[1, 3]], hit: [[0, 3], [1, 2], [1, 4], [2, 3]], note: "round 1: the source's 4 neighbours"}
    - {rows: [["", "", 2, 1, 2, "", ""], ["", 2, 1, 0, 1, 2, ""], ["", "", 2, 1, 2, "", ""]], win: [[0, 3], [1, 2], [1, 3], [1, 4], [2, 3]], hit: [[0, 2], [0, 4], [1, 1], [1, 5], [2, 2], [2, 4]], note: "round 2: only unvisited cells are enqueued"}
    - {rows: [[4, 3, 2, 1, 2, 3, 4], [3, 2, 1, 0, 1, 2, 3], [4, 3, 2, 1, 2, 3, 4]], win: all, hit: [[0, 0], [0, 6], [2, 0], [2, 6]], note: "every cell: number = round = distance"}
template:
  python: |
    from collections import deque

    q = deque(sources)
    seen = set(sources)
    steps = 0
    while q:
        for _ in range(len(q)):     # one level
            node = q.popleft()
            if is_goal(node):
                return steps
            for nxt in neighbors(node):
                if nxt not in seen:
                    seen.add(nxt)   # mark on enqueue
                    q.append(nxt)
        steps += 1
  ruby: |
    q = sources.dup
    seen = Set.new(sources)         # require 'set' before Ruby 3.2
    steps = 0
    until q.empty?
      q.size.times do               # one level
        node = q.shift
        return steps if goal?(node)
        neighbors(node).each do |nxt|
          next if seen.include?(nxt)
          seen << nxt               # mark on enqueue
          q << nxt
        end
      end
      steps += 1
    end
pitfalls:
  - Mark visited on enqueue, not on pop. Otherwise a node can be queued once per neighbour, and spread counts come out wrong.
  - "Python: `deque.popleft()`; `list.pop(0)` is O(n). Ruby: `Array#shift` is amortized O(1) in CRuby, so a plain array works as a queue."
  - "Shortest path only when every edge costs the same. 0/1 weights → 0-1 BFS (deque, push 0-edges to the front); general weights → Dijkstra."
  - "Multi-source: enqueue every source at step 0. It's BFS from a virtual super-source, so each distance is to the nearest source."
  - "Grids: bounds-check before indexing. Ruby wraps negative indices silently: `grid[-1]` is the last row, not an error."

problems:
  - id: level-order
    title: Binary Tree Level Order Traversal
    difficulty: Medium
    variant: canonical
    statement: Return the values of a binary tree level by level, left to right.
    example: "root = [3, 9, 20, null, null, 15, 7]  →  [[3], [9, 20], [15, 7]]"
    hint: A queue already yields nodes in level order — how do you know where one level ends?
    insight: Snapshot the queue length at the start of each round; exactly that many pops form the current level.
    complexity: O(n) time · O(w) space (w = widest level)
    fn: level_order
    tests:
      - {args: [{tree: [3, 9, 20, null, null, 15, 7]}], out: [[3], [9, 20], [15, 7]], note: "example"}
      - {args: [{tree: [1, 2, 3, 4, 5, 6, 7]}], out: [[1], [2, 3], [4, 5, 6, 7]], note: "full tree"}
      - {args: [{tree: [1, 2, null, 3, null, 4]}], out: [[1], [2], [3], [4]], note: "left chain"}
      - {args: [{tree: [1]}], out: [[1]], note: "single node"}
      - {args: [{tree: []}], out: [], note: "empty tree"}
    solution:
      python: |
        from collections import deque

        def level_order(root):
            if not root:
                return []
            res, q = [], deque([root])
            while q:
                level = []
                for _ in range(len(q)):
                    node = q.popleft()
                    level.append(node.val)
                    for child in (node.left, node.right):
                        if child:
                            q.append(child)
                res.append(level)
            return res
      ruby: |
        def level_order(root)
          return [] unless root
          res, q = [], [root]
          until q.empty?
            level = q.size.times.map do
              node = q.shift
              q.push(*[node.left, node.right].compact)
              node.val
            end
            res << level
          end
          res
        end

  - id: rotting-oranges
    title: Rotting Oranges
    difficulty: Medium
    variant: multi-source grid
    statement: "Grid cells: 0 empty, 1 fresh orange, 2 rotten. Each minute, every fresh orange 4-directionally next to a rotten one rots. Return the minutes until no fresh orange is left, or -1 if that never happens."
    example: "grid = [[2, 1, 1], [1, 1, 0], [0, 1, 1]]  →  4"
    hint: All rotten oranges spread at the same time. What's in the queue at minute 0?
    insight: Seed the queue with every rotten orange — one BFS level is one minute. Count fresh oranges up front, so the -1 check is a single comparison.
    complexity: O(rows · cols) time and space
    fn: oranges_rotting
    tests:
      - {args: [[[2, 1, 1], [1, 1, 0], [0, 1, 1]]], out: 4, note: "example"}
      - {args: [[[2, 1, 1], [0, 1, 1], [1, 0, 1]]], out: -1, note: "unreachable fresh orange"}
      - {args: [[[2, 1, 1], [1, 1, 1], [0, 1, 2]]], out: 2, note: "two sources spread together"}
      - {args: [[[0, 2]]], out: 0, note: "nothing fresh: 0, not 1"}
      - {args: [[[1]]], out: -1, note: "fresh but no rotten"}
      - {args: [[[0]]], out: 0, note: "empty cell only"}
    solution:
      python: |
        from collections import deque

        def oranges_rotting(grid):
            rows, cols = len(grid), len(grid[0])
            q = deque((r, c) for r in range(rows) for c in range(cols) if grid[r][c] == 2)
            fresh = sum(row.count(1) for row in grid)
            minutes = 0
            while q and fresh:
                for _ in range(len(q)):
                    r, c = q.popleft()
                    for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                        if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1:
                            grid[nr][nc] = 2        # rotting marks it visited
                            fresh -= 1
                            q.append((nr, nc))
                minutes += 1
            return -1 if fresh else minutes
      ruby: |
        def oranges_rotting(grid)
          rows, cols = grid.size, grid[0].size
          q = []
          grid.each_with_index { |row, r| row.each_with_index { |v, c| q << [r, c] if v == 2 } }
          fresh = grid.sum { |row| row.count(1) }
          minutes = 0
          until q.empty? || fresh.zero?
            q.size.times do
              r, c = q.shift
              [[r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]].each do |nr, nc|
                next unless nr.between?(0, rows - 1) && nc.between?(0, cols - 1) && grid[nr][nc] == 1
                grid[nr][nc] = 2        # rotting marks it visited
                fresh -= 1
                q << [nr, nc]
              end
            end
            minutes += 1
          end
          fresh.zero? ? minutes : -1
        end
