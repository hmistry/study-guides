id: union-find
name: Union-Find
signal: [connected components / groups, "are x and y connected?", "merge accounts / friend circles", "cycle in an undirected graph", edges arrive one at a time]
idea: >-
  Each set is a tree stored in a `parent` array: `find` walks up to the root, `union` links one root under the other.
  Path compression and union by rank keep the trees almost flat, so each operation is ≈ O(1) (inverse Ackermann).
  Best when edges arrive online or you need connectivity but not paths.
diagram:
  type: tree
  caption: "find → root · union → link roots"
  frames:
    - tree: [{v: 0, hit: true, c: [{v: 1}, {v: 2, win: true}]}, {v: 3, hit: true, c: [{v: 4, win: true}]}, {v: 5}]
      up: true
      note: "union(2, 4): roots 0 and 3 differ → parent[3] = 0"
    - tree: [{v: 0, hit: true, c: [{v: 1}, {v: 2}, {v: 3, c: [{v: 4, win: true}]}]}, {v: 5}]
      up: true
      note: "one set now · find(4) walks 4 → 3 → 0 …"
    - tree: [{v: 0, hit: true, c: [{v: 1}, {v: 2}, {v: 3}, {v: 4, win: true}]}, {v: 5}]
      up: true
      note: "… and path compression points 4 straight at 0"
template:
  python: |
    parent = list(range(n))
    rank = [0] * n

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]   # path halving
            x = parent[x]
        return x

    def union(a, b):
        ra, rb = find(a), find(b)
        if ra == rb:
            return False                    # already connected: cycle edge
        if rank[ra] < rank[rb]:
            ra, rb = rb, ra
        parent[rb] = ra                     # shorter tree under taller
        if rank[ra] == rank[rb]:
            rank[ra] += 1
        return True
  ruby: |
    parent = (0...n).to_a
    rank = [0] * n

    find = lambda do |x|
      while parent[x] != x
        parent[x] = parent[parent[x]]       # path halving
        x = parent[x]
      end
      x
    end

    union = lambda do |a, b|
      ra, rb = find.(a), find.(b)
      return false if ra == rb              # already connected: cycle edge
      ra, rb = rb, ra if rank[ra] < rank[rb]
      parent[rb] = ra                       # shorter tree under taller
      rank[ra] += 1 if rank[ra] == rank[rb]
      true
    end
pitfalls:
  - "Union roots, never the nodes themselves. `parent[a] = b` silently detaches a's subtree from its old set."
  - "Test `find(a) == find(b)`, not `parent[a] == parent[b]`. Parents are only roots right after compression."
  - "Iterative path halving (`parent[x] = parent[parent[x]]`) is as good as full compression. A recursive `find` can hit Python's recursion limit on a long chain before compression has flattened it."
  - "Components = n − successful unions. Count as you go instead of scanning for roots at the end."
  - "Union-Find answers \"connected?\", not \"by which path?\", and it can't split sets. For directed graphs use DFS or a topological sort instead."

problems:
  - id: number-of-provinces
    title: Number of Provinces
    difficulty: Medium
    variant: canonical
    statement: "`is_connected[i][j] = 1` if cities i and j are directly connected. A province is a group of directly or indirectly connected cities. Return the number of provinces."
    example: "is_connected = [[1, 1, 0], [1, 1, 0], [0, 0, 1]]  →  2"
    hint: Start with n separate groups. What happens to the count each time an edge joins two different groups?
    insight: Every union that really merges two roots removes exactly one component, so the answer is n − successful unions — no final scan. (DFS per unvisited city also works.)
    complexity: O(n² · α(n)) time · O(n) space
    fn: find_circle_num
    tests:
      - {args: [[[1, 1, 0], [1, 1, 0], [0, 0, 1]]], out: 2, note: "example"}
      - {args: [[[1, 0, 0], [0, 1, 0], [0, 0, 1]]], out: 3, note: "no edges"}
      - {args: [[[1, 1, 1], [1, 1, 1], [1, 1, 1]]], out: 1, note: "all connected: redundant edges"}
      - {args: [[[1, 0, 0, 1], [0, 1, 1, 0], [0, 1, 1, 1], [1, 0, 1, 1]]], out: 1, note: "connected only indirectly"}
      - {args: [[[1]]], out: 1, note: "single city"}
    solution:
      python: |
        def find_circle_num(is_connected):
            n = len(is_connected)
            parent = list(range(n))

            def find(x):
                while parent[x] != x:
                    parent[x] = parent[parent[x]]
                    x = parent[x]
                return x

            components = n
            for i in range(n):
                for j in range(i + 1, n):
                    if is_connected[i][j]:
                        ri, rj = find(i), find(j)
                        if ri != rj:
                            parent[ri] = rj
                            components -= 1     # each real union merges two
            return components
      ruby: |
        def find_circle_num(is_connected)
          n = is_connected.size
          parent = (0...n).to_a
          find = lambda do |x|
            while parent[x] != x
              parent[x] = parent[parent[x]]
              x = parent[x]
            end
            x
          end
          components = n
          (0...n).each do |i|
            (i + 1...n).each do |j|
              next if is_connected[i][j].zero?
              ri, rj = find.(i), find.(j)
              next if ri == rj
              parent[ri] = rj
              components -= 1     # each real union merges two
            end
          end
          components
        end

  - id: redundant-connection
    title: Redundant Connection
    difficulty: Medium
    variant: cycle detection, edges online
    statement: A tree of n nodes (labelled 1..n) had one extra edge added. Given `edges`, return an edge whose removal leaves a tree; if several work, return the one that appears last.
    example: "edges = [[1, 2], [1, 3], [2, 3]]  →  [2, 3]"
    hint: Add edges one at a time. When does an edge connect nothing new?
    insight: The first edge whose endpoints already share a root closes the cycle. Every other edge on that cycle came earlier, so it's also the last-listed answer.
    complexity: O(n · α(n)) time · O(n) space
    fn: find_redundant_connection
    tests:
      - {args: [[[1, 2], [1, 3], [2, 3]]], out: [2, 3], note: "example"}
      - {args: [[[1, 2], [2, 3], [3, 4], [1, 4], [1, 5]]], out: [1, 4], note: "extra edge isn't last in input"}
      - {args: [[[2, 1], [3, 1], [4, 2], [1, 4]]], out: [1, 4], note: "cycle 1-2-4"}
      - {args: [[[1, 4], [3, 4], [1, 3], [1, 2], [4, 5]]], out: [1, 3], note: "triangle in the middle"}
      - {args: [[[1, 2], [2, 1]]], out: [2, 1], note: "parallel edge"}
    solution:
      python: |
        def find_redundant_connection(edges):
            parent = list(range(len(edges) + 1))    # nodes 1..n, n = len(edges)

            def find(x):
                while parent[x] != x:
                    parent[x] = parent[parent[x]]
                    x = parent[x]
                return x

            for a, b in edges:
                ra, rb = find(a), find(b)
                if ra == rb:
                    return [a, b]                   # already connected: closes the cycle
                parent[ra] = rb
            return []
      ruby: |
        def find_redundant_connection(edges)
          parent = (0..edges.size).to_a           # nodes 1..n, n = edges.size
          find = lambda do |x|
            while parent[x] != x
              parent[x] = parent[parent[x]]
              x = parent[x]
            end
            x
          end
          edges.each do |a, b|
            ra, rb = find.(a), find.(b)
            return [a, b] if ra == rb             # already connected: closes the cycle
            parent[ra] = rb
          end
          []
        end
