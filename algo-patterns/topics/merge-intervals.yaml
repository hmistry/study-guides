id: merge-intervals
name: Merge Intervals
signal: [intervals / ranges / meetings, overlapping, "insert or merge ranges", "rooms needed / max at once"]
idea: >-
  Sort by start, so an interval can only overlap the ones just before it; one sweep then either extends the last merged interval or starts a new one.
  For "how many at once" questions, don't merge — sweep the sorted starts against the sorted ends.
  O(n log n) for the sort, O(n) after.
diagram:
  type: intervals
  caption: "sort by start   ·   start ≤ last end → extend"
  frames:
    - {bars: [[1, 3], [2, 6], [8, 10], [15, 18]], cut: {at: 3, label: "end 3"}, note: "2 ≤ 3 → [2, 6] overlaps [1, 3]"}
    - {bars: [[1, 6], [8, 10], [15, 18]], lanes: [0, 0, 0], hit: [0], note: "merged: [1, 6]; 8 > 6 starts a new one"}
template:
  python: |
    merged = []
    for s, e in sorted(intervals):
        if merged and s <= merged[-1][1]:   # overlaps the last one
            merged[-1][1] = max(merged[-1][1], e)
        else:
            merged.append([s, e])

    # max overlapping at once — half-open [s, e)
    starts = sorted(s for s, _ in intervals)
    ends = sorted(e for _, e in intervals)
    live = j = 0
    for s in starts:
        if s >= ends[j]:     # one ended before s: reuse it
            j += 1
        else:
            live += 1
  ruby: |
    merged = []
    intervals.sort.each do |s, e|
      if !merged.empty? && s <= merged[-1][1]   # overlaps the last one
        merged[-1][1] = [merged[-1][1], e].max
      else
        merged << [s, e]
      end
    end

    # max overlapping at once — half-open [s, e)
    starts = intervals.map(&:first).sort
    ends = intervals.map(&:last).sort
    live = j = 0
    starts.each do |s|
      if s >= ends[j]      # one ended before s: reuse it
        j += 1
      else
        live += 1
      end
    end
pitfalls:
  - Extend with `max(last_end, e)`. Plain `= e` shrinks [1, 10] when [2, 3] comes next.
  - "Touching endpoints: decide `<=` vs `<` from the problem. Merge Intervals joins [1, 4] and [4, 5]; meetings are half-open, so one can start the minute another ends."
  - Sort by start to merge. Sort by end for "max non-overlapping / fewest removals" (greedy activity selection).
  - Append a copy (`[s, e]`), not the input interval itself. Editing it later changes the caller's data.
  - "Concurrency is a sweep line: +1 at each start, −1 at each end, ends first on ties for half-open. A min-heap of end times gives the same count and also tells you which room frees up."

problems:
  - id: merge-overlapping
    title: Merge Intervals
    difficulty: Medium
    variant: canonical
    statement: Merge all overlapping intervals in `intervals` (each `[start, end]`) and return the result sorted by start. Intervals that touch (`[1, 4]`, `[4, 5]`) overlap. Input may be unsorted.
    example: "intervals = [[1, 3], [2, 6], [8, 10], [15, 18]]  →  [[1, 6], [8, 10], [15, 18]]"
    hint: After sorting by start, can an interval overlap anything other than the last one you kept?
    insight: Sorting means only the last merged interval can overlap the next one — compare against it, extend or append.
    complexity: O(n log n) time · O(n) space (output)
    fn: merge
    tests:
      - {args: [[[1, 3], [2, 6], [8, 10], [15, 18]]], out: [[1, 6], [8, 10], [15, 18]], note: "example"}
      - {args: [[[1, 4], [4, 5]]], out: [[1, 5]], note: "touching endpoints merge"}
      - {args: [[[1, 4], [0, 4]]], out: [[0, 4]], note: "unsorted input"}
      - {args: [[[1, 10], [2, 3], [4, 5]]], out: [[1, 10]], note: "contained: keep the max end"}
      - {args: [[[5, 7]]], out: [[5, 7]], note: "single interval"}
      - {args: [[[1, 4], [0, 0]]], out: [[0, 0], [1, 4]], note: "point interval, no overlap"}
    solution:
      python: |
        def merge(intervals):
            merged = []
            for s, e in sorted(intervals):
                if merged and s <= merged[-1][1]:
                    merged[-1][1] = max(merged[-1][1], e)
                else:
                    merged.append([s, e])
            return merged
      ruby: |
        def merge(intervals)
          merged = []
          intervals.sort.each do |s, e|
            if !merged.empty? && s <= merged[-1][1]
              merged[-1][1] = [merged[-1][1], e].max
            else
              merged << [s, e]
            end
          end
          merged
        end

  - id: meeting-rooms-ii
    title: Meeting Rooms II
    difficulty: Medium
    variant: count overlaps, don't merge
    statement: "Each meeting is `[start, end)`. Return the minimum number of rooms so that no two overlapping meetings share one. A meeting may start the moment another ends."
    example: "intervals = [[0, 30], [5, 10], [15, 20]]  →  2"
    hint: Rooms needed = meetings started − meetings ended. When a meeting starts, which end time do you compare it with?
    insight: Which meeting is which doesn't matter — only counts do. Sort starts and ends separately; a start at or after the earliest unfinished end reuses that room.
    complexity: O(n log n) time · O(n) space
    fn: min_meeting_rooms
    tests:
      - {args: [[[0, 30], [5, 10], [15, 20]]], out: 2, note: "example"}
      - {args: [[[7, 10], [2, 4]]], out: 1, note: "no overlap, unsorted"}
      - {args: [[[1, 5], [5, 10]]], out: 1, note: "back to back: half-open"}
      - {args: [[[1, 10], [2, 9], [3, 8], [4, 7]]], out: 4, note: "fully nested"}
      - {args: [[[1, 3], [2, 4], [3, 5]]], out: 2, note: "chain: room from [1, 3) is reused"}
      - {args: [[]], out: 0, note: "no meetings"}
    solution:
      python: |
        def min_meeting_rooms(intervals):
            starts = sorted(s for s, _ in intervals)
            ends = sorted(e for _, e in intervals)
            rooms = j = 0
            for s in starts:
                if s >= ends[j]:        # earliest-ending meeting is over: reuse its room
                    j += 1
                else:
                    rooms += 1
            return rooms
      ruby: |
        def min_meeting_rooms(intervals)
          starts = intervals.map(&:first).sort
          ends = intervals.map(&:last).sort
          rooms = j = 0
          starts.each do |s|
            if s >= ends[j]       # earliest-ending meeting is over: reuse its room
              j += 1
            else
              rooms += 1
            end
          end
          rooms
        end
