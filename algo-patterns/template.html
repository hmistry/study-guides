<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="__VERSION__">
<title>Algorithm Patterns</title>
<style>
:root {
  /* Ocean: calm deep teal-blue on white */
  --bg: #ffffff; --surface: #ffffff;
  --ink: #14262e; --ink-2: #4a5f68; --ink-3: #74878f;
  --rule: #d6e1e5; --code-bg: #f4f8f9; --code-rule: #d6e1e5;
  --accent: #0b6a87; --accent-tint: #e2f2f6; --hit: #dff3e4;
  --easy: #1a7f37;   --easy-bg: #dafbe1;
  --medium: #9a6700; --medium-bg: #fff8c5;
  --hard: #c0303a;   --hard-bg: #fdecea;
  --t-comment: #6b7d85; --t-keyword: #b4235a; --t-string: #2f6b1f; --t-number: #0b6a87;
  --t-fn: #7a3fb8; --t-builtin: #9a5b13; --t-op: #33454d;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --side-w: 232px;
}
[hidden] { display: none !important; }   /* component display rules must never beat [hidden] */
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--sans); }
code, pre, textarea { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: var(--sans); }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.brand { font-size: 19px; font-weight: 700; letter-spacing: -.015em; color: var(--accent); text-decoration: none; white-space: nowrap; }
.ver { margin-left: -8px; font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
.tprog { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--ink-2); text-decoration: none; }
.tprog:hover { color: var(--accent); }
.lang { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; padding: 6px 14px; font: 500 13px var(--mono); color: var(--ink-2); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* layout */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
.side { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; padding: 20px 12px 24px 20px; }
.side .grp { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 14px 10px 4px; }
.side .grp:first-child { padding-top: 0; }
.side a { display: block; text-decoration: none; color: var(--ink-2); border-radius: 6px; }
.side .pl { padding: 5px 10px; font-weight: 550; font-size: 14px; }
.side .pl span { font: 12px var(--mono); color: var(--ink-3); margin-right: 8px; }
.side .ql { display: flex; align-items: baseline; gap: 7px; padding: 3px 10px 3px 34px; font-size: 13px; color: var(--ink-3); }
.side a:hover { background: var(--code-bg); color: var(--ink); }
.side .pl.active { background: var(--accent-tint); color: var(--accent); }
.side .pl.active span { color: var(--accent); }
main { padding: 32px 44px 96px; min-width: 0; }

/* progress meter + small buttons */
.meter { width: 90px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 7px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--ink-3); }
.btn.danger { color: var(--hard); border-color: color-mix(in srgb, var(--hard) 45%, transparent); }
.btn.danger:hover { background: var(--hard-bg); border-color: var(--hard); }

/* pages: one section at a time, prev / next at the bottom */
.pager { display: flex; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); }
.pbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface);
  border-radius: 8px; padding: 8px 16px; font: 550 14px var(--sans); text-decoration: none; cursor: pointer; }
.pbtn:hover { background: var(--accent-tint); }
.pbtn.fill { background: var(--accent); color: #fff; }
.pbtn.fill:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.pager .next { margin-left: auto; }

/* home */
.hero h1 { margin: 4px 0 8px; font-size: 32px; letter-spacing: -.025em; color: var(--accent); }
.hero .lead { max-width: 68ch; font-size: 16px; }
.hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 32px 0; }
.hcard { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; }
.hcard ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.hcard ol li { margin: 8px 0; }
.hcard a, .lead a { color: var(--accent); text-decoration: none; font-weight: 550; }
.hcard a:hover, .lead a:hover { text-decoration: underline; }
.hcard p { margin: 8px 0 12px; color: var(--ink-2); font-size: 14px; }
.stats { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 6px; }
.stats b { font-size: 28px; letter-spacing: -.02em; }
.stats span { color: var(--ink-2); font-size: 14px; }
.meter.big { width: 100%; height: 8px; border-radius: 4px; }
.rlist { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.rlist li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
.rlist a { color: var(--accent); text-decoration: none; font-weight: 550; }
.rlist small, .empty { color: var(--ink-3); font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 32px; }
.pcard { display: block; border: 1px solid var(--rule); border-radius: 10px; padding: 11px 14px; text-decoration: none; color: var(--ink); }
.pcard:hover { border-color: var(--accent); }
.pcard .nm { font-weight: 600; font-size: 14px; }
.pcard .nm span { font: 12px var(--mono); color: var(--accent); margin-right: 6px; }
.pcard .pr { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.dot { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); transform: translateY(-1px); }
.st-done > .dot, .dot.st-done { background: var(--easy); border-color: var(--easy); }
.st-review > .dot, .dot.st-review { background: var(--medium); border-color: var(--medium); }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.key span { display: inline-flex; align-items: center; gap: 5px; }

/* sections */
.sec { padding-bottom: 8px; }
.p-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.p-head .right { margin-left: auto; }
.p-num { font: 600 14px var(--mono); color: var(--accent); }
.p-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.lbl { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.signal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 28px; }
.signal .lbl { margin-right: 4px; }
.chip { font-size: 13px; padding: 3px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--rule); color: var(--ink-2); }
.block { margin-bottom: 36px; }
.block p { margin: 10px 0 0; color: var(--ink-2); max-width: 85ch; }
.lead { margin: 0 0 24px; color: var(--ink-2); }
.probs-h { margin: 8px 0 14px; }
.pchip { display: inline-block; font-size: 13px; font-weight: 550; padding: 1px 9px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); text-decoration: none; white-space: nowrap; }
a.pchip:hover { text-decoration: underline; }
.pchip.soon { background: none; border: 1px dashed var(--rule); color: var(--ink-3); font-weight: 450; }
.stmt code, .after code, .block code, .pitfalls code, .ref code, .dcard code, .drill code { font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

/* concept */
.concept { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; margin-bottom: 36px; }
.diagram { display: flex; flex-direction: column; justify-content: center; margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px; }
.diagram svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.diagram figcaption { font: 12px var(--mono); color: var(--ink-2); text-align: center; margin-top: 8px; }
.d-cell { fill: var(--surface); stroke: var(--code-rule); }
.d-cell.win { fill: var(--accent-tint); stroke: var(--accent); }
.d-cell.hit { fill: var(--hit); stroke: var(--easy); }
.d-val { font: 14px var(--mono); fill: var(--ink); text-anchor: middle; }
.d-mark { font: 600 11px var(--mono); fill: var(--accent); text-anchor: middle; }
.d-note { font: 12px var(--sans); fill: var(--ink-2); }
.d-edge { stroke: var(--ink-3); stroke-width: 1.3; fill: none; }
.d-head { fill: var(--ink-3); }
.d-bar { font: 11px var(--mono); fill: var(--ink); }
.d-cut { stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 3; }
.d-val.sm { font-size: 13px; }
.d-head-t { font: 11px var(--mono); fill: var(--ink-3); text-anchor: middle; }
.d-head-t.end { text-anchor: end; }
.d-badge { font: 600 10.5px var(--mono); fill: var(--accent); }
.d-elab { font: 10.5px var(--mono); fill: var(--ink-3); }
.codebox { background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 10px; overflow: hidden; min-width: 0; }
.codebox-h { display: flex; justify-content: space-between; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--code-rule); }
.langtag { font: 11px var(--mono); color: var(--ink-3); }
pre.code { margin: 0; padding: 14px 16px; font-size: 13px; line-height: 1.6; overflow-x: auto; tab-size: 4; }
.pitfalls { margin-bottom: 36px; }
.pitfalls, .block { font-size: 15px; }
.pitfalls ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); max-width: 95ch; }
.pitfalls li { margin: 9px 0; padding-left: 2px; }

/* problem */
.prob { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 22px 24px; margin-bottom: 24px; }
.prob-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.prob-h h3 { margin: 0; font-size: 17px; }
.diff { font: 600 11px var(--mono); padding: 2px 8px; border-radius: 5px; }
.diff.Easy { color: var(--easy); background: var(--easy-bg); }
.diff.Medium { color: var(--medium); background: var(--medium-bg); }
.diff.Hard { color: var(--hard); background: var(--hard-bg); }
.variant { font-size: 13px; color: var(--ink-3); }
.status { margin-left: auto; display: flex; gap: 6px; }
.st { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-3); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.st:hover { color: var(--ink); }
.st[data-st="done"][aria-pressed="true"] { background: var(--easy-bg); color: var(--easy); border-color: var(--easy); }
.st[data-st="review"][aria-pressed="true"] { background: var(--medium-bg); color: var(--medium); border-color: var(--medium); }
.stmt { margin: 0 0 14px; }
.ex { margin: 0 0 14px; padding: 10px 14px; background: var(--code-bg); border-radius: 6px; font-size: 13px; white-space: pre-wrap; color: var(--ink-2); }
.disclose { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-bottom: 16px; font-size: 14px; }
.disclose details { min-width: 0; }
.disclose details[open] { flex-basis: 100%; }
.disclose summary { cursor: pointer; color: var(--accent); font-weight: 550; width: max-content; }
.disclose summary small { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.disclose p { margin: 6px 0 0; color: var(--ink-2); }
.disclose pre.code { margin: 6px 0 0; background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 8px; }
.tc { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--code-rule); border-radius: 8px; overflow: hidden; }
.tc li { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; padding: 6px 12px; font: 12.5px/1.5 var(--mono); background: var(--code-bg); }
.tc li + li { border-top: 1px solid var(--code-rule); }
.tc .call { color: var(--ink); overflow-wrap: anywhere; }
.tc .note { font: 12px var(--sans); color: var(--ink-3); }
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.prob.open .work { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--code-rule); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.pane-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--code-rule); min-height: 34px; }
.pane.sol { border-color: var(--accent); }
.pane.sol .pane-h { background: var(--accent-tint); }
.pane.sol .lbl { color: var(--accent); }
.pane .code { flex: 1; }
textarea { flex: 1; width: 100%; border: 0; resize: vertical; background: transparent; color: var(--ink);
  padding: 12px 14px; font-size: 13px; line-height: 1.6; tab-size: 4; outline: none; white-space: pre; overflow-x: auto; }
.pane.mine:focus-within { border-color: var(--accent); }
.ed { position: relative; flex: 1; display: flex; min-height: 0; }
.ed textarea { position: relative; z-index: 1; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--ink); }
.ed textarea::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.ed .ed-hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; white-space: pre; color: var(--ink); }
.link { border: 0; background: none; font: 12px var(--sans); color: var(--ink-3); cursor: pointer; padding: 2px 4px; }
.link:hover { color: var(--ink); }
.tools { display: flex; gap: 6px; }
.pane-h .langtag { margin-left: 6px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
.reveal { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 14px; font: 550 13px var(--sans); cursor: pointer; }
.prob.open .reveal { background: var(--surface); color: var(--accent); }
.kbd { font-size: 12px; color: var(--ink-3); }
.after { margin-top: 16px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; font-size: 14px; }
.after p { margin: 0; }
.after .cx { margin-top: 4px; font: 12px var(--mono); color: var(--ink-2); }

/* decision guide */
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.dcard { border: 1px solid var(--rule); border-radius: 12px; padding: 18px 22px; }
.dq { font-weight: 650; margin-bottom: 6px; }
.dcard ul { list-style: none; margin: 0; padding: 0; }
.dcard li { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; font-size: 14px; color: var(--ink-2); }
.dcard li + li { border-top: 1px dashed var(--rule); }
.dcard li .if { flex: 1; }
.dcard li .arrow { color: var(--ink-3); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table.ref { width: 100%; border-collapse: collapse; font-size: 14px; }
.ref th, .ref td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ref tr:last-child td { border-bottom: 0; }
.ref th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--code-bg); }
.ref td.num { font: 12px var(--mono); color: var(--ink-3); width: 1%; }
.ref td.nm { font-weight: 600; white-space: nowrap; }
.ref td.cx { font: 12.5px var(--mono); white-space: nowrap; color: var(--ink-2); }
.ref td { color: var(--ink-2); }
.ref td.nm a { color: var(--accent); text-decoration: none; }
.ref .soon { font: 11px var(--sans); font-weight: 400; color: var(--ink-3); margin-left: 4px; }

/* language cheat sheet */
.ls-tools { position: sticky; top: 56px; z-index: 4; background: var(--bg); padding: 10px 0 8px; margin-bottom: 6px; border-bottom: 1px solid var(--rule); }
.ls-search { display: flex; align-items: center; gap: 10px; }
.ls-search input { flex: 1; max-width: 420px; font: 14px var(--sans); padding: 7px 12px; border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); background: var(--surface); }
.ls-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.ls-search span { font-size: 13px; color: var(--ink-3); }
.ls-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ls-chips a { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); text-decoration: none; }
.ls-chips a:hover { border-color: var(--accent); color: var(--accent); }
.ls-sec { margin-top: 40px; scroll-margin-top: 150px; }
.ls-sec h3 { margin: 0 0 6px; font-size: 18px; }
.ls-given { margin: 0 0 10px; font-size: 13px; color: var(--ink-3); }
.ls-given code { font-size: 12.5px; background: var(--code-bg); padding: 1px 6px; border-radius: 4px; color: var(--ink-2); }
.ls-row { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 6px 20px; padding: 18px 0; border-top: 1px solid var(--rule); }
.ls-task { font-size: 14px; font-weight: 550; color: var(--ink); padding-top: 3px; }
.ls-task .since { display: inline-block; margin-left: 6px; font: 600 10.5px var(--mono); color: var(--accent); background: var(--accent-tint); padding: 0 6px; border-radius: 4px; vertical-align: 1px; }
.ls-row.trap { border-left: 3px solid var(--medium); padding-left: 10px; background: linear-gradient(to right, var(--medium-bg), transparent 260px); }
.ls-row.trap .ls-task::before { content: "⚠ "; color: var(--medium); }
/* code always full width; result and notes always on their own lines below (user convention: easy to scan) */
.ls-code { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ls-code pre.code { padding: 6px 12px; background: var(--code-bg); border-radius: 6px; font-size: 13px; }
.ls-out { font: 13px var(--mono); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.ls-out .arrow { color: var(--ink-3); margin-right: 6px; font-family: var(--sans); }
.ls-out .prints { font: 11px var(--sans); color: var(--ink-3); margin-right: 6px; text-transform: uppercase; letter-spacing: .05em; }
.ls-note { font-size: 13px; color: var(--ink-2); }
.ls-code pre.shell { color: var(--ink); }
.ls-code pre.shell .ps { color: var(--ink-3); user-select: none; }
.ls-code pre.shell .cm { color: var(--t-comment); font-style: italic; }
.ls-task .shtag { display: inline-block; margin-left: 6px; font: 600 10.5px var(--mono); color: var(--ink-2); background: var(--code-bg); border: 1px solid var(--rule); padding: 0 5px; border-radius: 4px; vertical-align: 1px; }
.ls-note code { font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.ls-empty { color: var(--ink-3); font-style: italic; margin-top: 20px; }

/* drill */
.drill { border: 1px solid var(--rule); border-radius: 12px; padding: 24px 28px; }
.drill-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-3); }
.drill-q { font-size: 17.5px; margin: 0 0 20px; line-height: 1.6; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1px solid var(--rule); background: var(--surface); padding: 12px 14px; border-radius: 9px; cursor: pointer; font-size: 14.5px; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--easy); background: var(--easy-bg); }
.opt.wrong { border-color: var(--hard); background: var(--hard-bg); }
.opt kbd { font: 11px var(--mono); color: var(--ink-3); margin-right: 8px; }
.verdict { margin-top: 18px; padding: 14px 18px; border-radius: 9px; font-size: 14px; background: var(--code-bg); }
.verdict b.ok { color: var(--easy); }
.verdict b.no { color: var(--hard); }
.drill-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }

/* prism tokens */
.token.comment { color: var(--t-comment); font-style: italic; }
.token.keyword { color: var(--t-keyword); }
.token.string, .token.char, .token.string-literal { color: var(--t-string); }
.token.number, .token.boolean, .token.constant, .token.symbol { color: var(--t-number); }
.token.function, .token.class-name { color: var(--t-fn); }
.token.builtin { color: var(--t-builtin); }

<body>
<header class="top">
  <a class="brand" href="#home">Algorithm Patterns</a><span class="ver" title="Guide version">v__VERSION__</span>
  <a class="tprog" href="#home" title="Progress · open Home"><span class="meter"><i id="meter"></i></span><span id="progText"></span></a>
  <div class="lang" role="group" aria-label="Code language">

    <button data-lang="ruby">Ruby</button>
  </div>

  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const DATA = /*__DATA__*/null;

/* storage: localStorage with an in-memory fallback so the page still works when storage is blocked */
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} },
  keys() {
    const ks = new Set(Object.keys(mem));
    try { for (let i = 0; i < localStorage.length; i++) ks.add(localStorage.key(i)); } catch (e) {}
    return [...ks].filter(k => k.startsWith("sg."));
  },
};
const INDENT = { python: "    ", ruby: "  " };
const EXT = { python: "py", ruby: "rb" };
let lang = store.get("sg.lang", "python");
if (!INDENT[lang]) lang = "python";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const pad = n => String(n).padStart(2, "0");
const hl = (code, l) => Prism.highlight(code.replace(/\n+$/, ""), Prism.languages[l], l);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const CAT = DATA.catalog;
const BUILT = new Set(DATA.patterns.map(p => p.id));
const catNo = id => CAT.findIndex(c => c.id === id) + 1;
const catName = id => (CAT.find(c => c.id === id) || { name: id }).name;
const pchip = id => BUILT.has(id)
  ? `<a class="pchip" href="#${id}">${esc(catName(id))}</a>`
  : `<span class="pchip soon" title="Section not written yet">${esc(catName(id))}</span>`;
const problems = [];           // flat index: {p, pat}

/* ── values in each language's literal syntax (for test cases) */
function lit(v, l) {
  if (v === null) return l === "python" ? "None" : "nil";
  if (v === true) return l === "python" ? "True" : "true";
  if (v === false) return l === "python" ? "False" : "false";
  if (Array.isArray(v)) return "[" + v.map(x => lit(x, l)).join(", ") + "]";
  if (typeof v === "string") return JSON.stringify(v);
  if (typeof v === "object" && "list" in v) return "list" + lit(v.list, l) + (v.pos >= 0 ? ` pos=${v.pos}` : "");
  if (typeof v === "object" && "tree" in v) return "tree" + lit(v.tree, l);
  if (typeof v === "object") return "{" + Object.entries(v).map(([k, x]) => `${JSON.stringify(k)}${l === "python" ? ": " : " => "}${lit(x, l)}`).join(", ") + "}";
  return String(v);
}

/* ── one test case as code: fn(args) → out, or an op sequence on one instance (null out = not checked) */
function tcCall(p, t, l) {
  const args = a => a.map(x => lit(x, l)).join(", ");
  if (!t.ops) return `${p.fn}(${args(t.args)}) → ${lit(t.out, l)}`;
  const init = `obj = ${t.ops[0]}${l === "python" ? `(${args(t.args[0])})` : `.new${t.args[0].length ? `(${args(t.args[0])})` : ""}`}`;
  const calls = t.ops.slice(1).map((op, i) => `obj.${op}(${args(t.args[i + 1])})` + (t.out[i + 1] === null ? "" : ` → ${lit(t.out[i + 1], l)}`));
  return [init, ...calls].join("; ");
}

/* ── diagrams: data-driven SVG, one frame per row. type: array (default) | linked | intervals */
function markMap(f) {
  const m = {};
  Object.entries(f.marks || {}).forEach(([k, idx]) => (m[idx] = m[idx] ? m[idx] + " " + k : k));
  return m;
}
const arrowR = (x, y) => `<path class="d-head" d="M${x} ${y}l-6 -4v8z"/>`;
const arrowU = (x, y) => `<path class="d-head" d="M${x} ${y}l-4 6h8z"/>`;

function diagram(d) {
  const draw = { linked: dLinked, intervals: dIntervals, grid: dGrid, tree: dTree, graph: dGraph }[d.type] || dArray;
  let { W, H, s } = draw(d);
  // notes are SVG text and don't wrap: widen to the longest note, center the drawing, keep notes left-aligned
  const noteW = Math.max(0, ...d.frames.map(f => String(f.note || "").length * 6.4 + 4));
  if (noteW > W) {
    const dx = (noteW - W) / 2;
    s = `<g transform="translate(${dx} 0)">${s.replaceAll('class="d-note" x="1"', `class="d-note" x="${1 - dx}"`)}</g>`;
    W = noteW;
  }
  return `<figure class="diagram"><svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(d.caption)}">${s}</svg>
    <figcaption>${esc(d.caption)}</figcaption></figure>`;
}

/* linked: {values, loop: i (tail → node i), marks: {S: i}, hit: [i], note} */
function dLinked(d) {
  const r = 15, step = 48, markH = 18, loopH = 16, noteH = 22, gap = 10;
  const rowH = markH + 2 * r + loopH + noteH + gap;
  const n = Math.max(...d.frames.map(f => f.values.length));
  const W = (n - 1) * step + 2 * r + 2, H = d.frames.length * rowH - gap;
  let s = "";
  d.frames.forEach((f, i) => {
    const y = i * rowH, cy = y + markH + r, hit = f.hit || [], marks = markMap(f), last = f.values.length - 1;
    const cx = j => 1 + r + j * step;
    f.values.forEach((v, j) => {
      if (j < last) s += `<line class="d-edge" x1="${cx(j) + r}" y1="${cy}" x2="${cx(j + 1) - r - 1}" y2="${cy}"/>` + arrowR(cx(j + 1) - r, cy);
      s += `<circle class="d-cell ${hit.includes(j) ? "hit" : ""}" cx="${cx(j)}" cy="${cy}" r="${r}"/>`;
      s += `<text class="d-val" x="${cx(j)}" y="${cy + 5}">${esc(v)}</text>`;
      if (marks[j]) s += `<text class="d-mark" x="${cx(j)}" y="${y + 12}">${esc(marks[j])} ▾</text>`;
    });
    if (f.loop != null) {
      const by = cy + r + loopH - 4;
      s += `<path class="d-edge" d="M${cx(last)} ${cy + r}V${by}H${cx(f.loop)}V${cy + r + 6}"/>` + arrowU(cx(f.loop), cy + r);
    }
    s += `<text class="d-note" x="1" y="${cy + r + loopH + 16}">${esc(f.note || "")}</text>`;
  });
  return { W, H, s };
}

/* intervals: {bars: [[s, e]], lanes: [row per bar] (default: one row each), hit: [i], cut: {at, label}, note} */
function dIntervals(d) {
  const W = 300, laneH = 18, laneGap = 4, markH = 16, noteH = 22, gap = 10;
  const ends = d.frames.flatMap(f => f.bars.flat());
  const lo = Math.min(...ends), hi = Math.max(...ends), X = v => 1 + (v - lo) / (hi - lo) * (W - 2);
  let s = "", y = 0;
  d.frames.forEach(f => {
    const lanes = f.lanes || f.bars.map((_, i) => i), hit = f.hit || [];
    const nl = Math.max(...lanes) + 1, top = y + markH;
    f.bars.forEach(([a, b], i) => {
      const x = X(a), w = X(b) - x, by = top + lanes[i] * (laneH + laneGap), label = `${a}–${b}`;
      s += `<rect class="d-cell ${hit.includes(i) ? "hit" : ""}" x="${x}" y="${by}" width="${w}" height="${laneH}" rx="3"/>`;
      const inside = w >= label.length * 6.6 + 6;
      s += `<text class="d-bar" x="${inside ? x + w / 2 : x + w + 4}" y="${by + 13}" text-anchor="${inside ? "middle" : "start"}">${label}</text>`;
    });
    const bottom = top + nl * (laneH + laneGap) - laneGap;
    if (f.cut) {
      const cx = X(f.cut.at);
      s += `<line class="d-cut" x1="${cx}" y1="${top - 3}" x2="${cx}" y2="${bottom + 3}"/>`;
      s += `<text class="d-mark" x="${cx}" y="${y + 11}">${esc(f.cut.label || f.cut.at)}</text>`;
    }
    s += `<text class="d-note" x="1" y="${bottom + 18}">${esc(f.note || "")}</text>`;
    y = bottom + noteH + gap;
  });
  return { W, H: y - gap, s };
}

/* line from (x1, y1) to (x2, y2) with an arrowhead at the end */
function arrowLine(x1, y1, x2, y2) {
  const a = Math.atan2(y2 - y1, x2 - x1), bx = x2 - 6 * Math.cos(a), by = y2 - 6 * Math.sin(a);
  const px = -Math.sin(a) * 4, py = Math.cos(a) * 4;
  return `<line class="d-edge" x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}"/>` +
    `<path class="d-head" d="M${x2} ${y2}L${bx + px} ${by + py}L${bx - px} ${by - py}z"/>`;
}
/* distance from an ellipse's center to its edge, toward angle a */
const rim = (w, h, a) => 1 / Math.hypot(Math.cos(a) / (w / 2), Math.sin(a) / (h / 2));
const pillW = v => Math.max(28, String(v).length * 7.6 + 14);

/* grid: {rows: [[…]], labels: [row names], cols: [column headers], marks: {i: col}, hit: [[r, c]], win: [[r, c]] | "all", note}
   null = no cell, "" = empty cell */
function dGrid(d) {
  const cw = 32, ch = 28, noteH = 22, gap = 10;
  const labels = d.frames.flatMap(f => f.labels || []);
  const lw = labels.length ? Math.max(...labels.map(x => String(x).length)) * 7 + 10 : 0;
  const n = Math.max(...d.frames.flatMap(f => f.rows.map(r => r.length)));
  const W = lw + n * cw + 2;
  let s = "", y = 0;
  d.frames.forEach(f => {
    const has = (list, r, c) => (list || []).some(([a, b]) => a === r && b === c);
    const headH = f.cols || f.marks ? 16 : 0, top = y + headH, marks = markMap(f);
    const cx = c => lw + 1 + c * cw + cw / 2;
    (f.cols || []).forEach((h, c) => (s += `<text class="d-head-t" x="${cx(c)}" y="${top - 4}">${esc(h)}</text>`));
    Object.entries(marks).forEach(([c, m]) => (s += `<text class="d-mark" x="${cx(+c)}" y="${top - 4}">${esc(m)} ▾</text>`));
    f.rows.forEach((row, r) => {
      const ry = top + r * ch;
      if (f.labels) s += `<text class="d-head-t end" x="${lw - 6}" y="${ry + ch / 2 + 4}">${esc(f.labels[r] ?? "")}</text>`;
      row.forEach((v, c) => {
        if (v === null) return;
        const hit = has(f.hit, r, c), win = !hit && (f.win === "all" || has(f.win, r, c));
        s += `<rect class="d-cell ${hit ? "hit" : win ? "win" : ""}" x="${cx(c) - cw / 2}" y="${ry}" width="${cw}" height="${ch}" rx="2"/>`;
        s += `<text class="d-val sm" x="${cx(c)}" y="${ry + ch / 2 + 5}">${esc(v)}</text>`;
      });
    });
    const bottom = top + f.rows.length * ch;
    s += `<text class="d-note" x="1" y="${bottom + 16}">${esc(f.note || "")}</text>`;
    y = bottom + noteH + gap;
  });
  return { W, H: y - gap, s };
}

/* tree: {tree: node | [roots], up: true (arrows point to parent), note}
   node = {v, c: [children; ~ = empty slot], hit, win, mark, b: badge, e: edge label} */
function dTree(d) {
  const nodeH = 26, levelH = 46, noteH = 22, gap = 10;
  const all = [];
  const walk = n => { if (n) { all.push(n); (n.c || []).forEach(walk); } };
  d.frames.forEach(f => [].concat(f.tree).forEach(walk));
  const badge = all.some(n => n.b != null) ? 16 : 0;
  const slot = Math.max(...all.map(n => pillW(n.v))) + 12 + badge;
  const place = (n, depth, st) => {
    if (!n) return { x: st.x++, nil: true };
    const kids = (n.c || []).map(k => place(k, depth + 1, st));
    const x = kids.length ? (kids[0].x + kids[kids.length - 1].x) / 2 : st.x++;
    st.depth = Math.max(st.depth, depth);
    return { n, x, depth, kids };
  };
  const laid = d.frames.map(f => {
    const st = { x: 0, depth: 0 };
    const roots = [].concat(f.tree).map(r => place(r, 0, st));
    return { f, roots, slots: st.x, depth: st.depth };
  });
  const W = Math.max(...laid.map(l => l.slots)) * slot + 2;
  let s = "", y = 0;
  laid.forEach(({ f, roots, slots, depth }) => {
    const markH = 16, off = (W - slots * slot) / 2;
    const P = t => ({ x: off + t.x * slot + slot / 2, y: y + markH + t.depth * levelH + nodeH / 2 });
    const edges = t => t.kids.filter(k => !k.nil).forEach(k => {
      const a = P(t), b = P(k), wa = pillW(t.n.v), wb = pillW(k.n.v);
      if (f.up) {
        const ang = Math.atan2(a.y - b.y, a.x - b.x), ra = rim(wa, nodeH, ang), rb = rim(wb, nodeH, ang);
        s += arrowLine(b.x + rb * Math.cos(ang), b.y + rb * Math.sin(ang), a.x - ra * Math.cos(ang), a.y - ra * Math.sin(ang));
      } else s += `<line class="d-edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
      if (k.n.e != null) s += `<text class="d-elab" x="${(a.x + b.x) / 2 + (b.x < a.x ? -6 : b.x > a.x ? 6 : 6)}" y="${(a.y + b.y) / 2 + 4}" text-anchor="${b.x < a.x ? "end" : "start"}">${esc(k.n.e)}</text>`;
      edges(k);
    });
    const nodes = t => {
      if (t.nil) return;
      const { x, y: cy } = P(t), w = pillW(t.n.v);
      s += `<rect class="d-cell ${t.n.hit ? "hit" : t.n.win ? "win" : ""}" x="${x - w / 2}" y="${cy - nodeH / 2}" width="${w}" height="${nodeH}" rx="${nodeH / 2}"/>`;
      s += `<text class="d-val sm" x="${x}" y="${cy + 5}">${esc(t.n.v)}</text>`;
      if (t.n.b != null) s += `<text class="d-badge" x="${x + w / 2 + 3}" y="${cy - 6}">${esc(t.n.b)}</text>`;
      if (t.n.mark) s += `<text class="d-mark" x="${x}" y="${cy - nodeH / 2 - 4}">${esc(t.n.mark)} ▾</text>`;
      t.kids.forEach(nodes);
    };
    roots.forEach(edges);
    roots.forEach(nodes);
    const bottom = y + markH + depth * levelH + nodeH;
    s += `<text class="d-note" x="1" y="${bottom + 16}">${esc(f.note || "")}</text>`;
    y = bottom + noteH + gap;
  });
  return { W, H: y - gap, s };
}

/* graph: {nodes: {id: [col, row]}, edges: [[from, to]], badge: {id: text}, hit: [ids], win: [ids], note} — directed */
function dGraph(d) {
  const X = 64, Y = 46, r = 15, noteH = 22, gap = 10, markH = 14;
  const pts = d.frames.flatMap(f => Object.values(f.nodes));
  const W = Math.max(...pts.map(p => p[0])) * X + 2 * r + 18;
  let s = "", y = 0;
  d.frames.forEach(f => {
    const P = id => ({ x: 1 + r + f.nodes[id][0] * X, y: y + markH + r + f.nodes[id][1] * Y });
    f.edges.forEach(([a, b]) => {
      const p = P(a), q = P(b), ang = Math.atan2(q.y - p.y, q.x - p.x);
      s += arrowLine(p.x + r * Math.cos(ang), p.y + r * Math.sin(ang), q.x - (r + 1) * Math.cos(ang), q.y - (r + 1) * Math.sin(ang));
    });
    Object.keys(f.nodes).forEach(id => {
      const { x, y: cy } = P(id), cls = (f.hit || []).includes(id) ? "hit" : (f.win || []).includes(id) ? "win" : "";
      s += `<circle class="d-cell ${cls}" cx="${x}" cy="${cy}" r="${r}"/><text class="d-val sm" x="${x}" y="${cy + 5}">${esc(id)}</text>`;
      if (f.badge && f.badge[id] != null) s += `<text class="d-badge" x="${x}" y="${cy - r - 3}" text-anchor="middle">${esc(f.badge[id])}</text>`;
    });
    const bottom = y + markH + 2 * r + Math.max(...Object.values(f.nodes).map(p => p[1])) * Y;
    s += `<text class="d-note" x="1" y="${bottom + 16}">${esc(f.note || "")}</text>`;
    y = bottom + noteH + gap;
  });
  return { W, H: y - gap, s };
}

function dArray(d) {
  const cw = 36, ch = 30, markH = 18, noteH = 22, gap = 10;
  const rowH = markH + ch + noteH + gap;
  const n = Math.max(...d.frames.map(f => f.values.length));
  const W = n * cw + 2, H = d.frames.length * rowH - gap;
  let s = "";
  d.frames.forEach((f, i) => {
    const y = i * rowH, win = f.window || [-1, -2], hit = f.hit || [], marks = markMap(f);
    f.values.forEach((v, j) => {
      const x = 1 + j * cw;
      const cls = hit.includes(j) ? "hit" : (j >= win[0] && j <= win[1] ? "win" : "");
      s += `<rect class="d-cell ${cls}" x="${x}" y="${y + markH}" width="${cw}" height="${ch}" rx="3"/>`;
      s += `<text class="d-val" x="${x + cw / 2}" y="${y + markH + ch / 2 + 5}">${esc(v)}</text>`;
      if (marks[j]) s += `<text class="d-mark" x="${x + cw / 2}" y="${y + 12}">${esc(marks[j])} ▾</text>`;
    });
    s += `<text class="d-note" x="1" y="${y + markH + ch + 16}">${esc(f.note || "")}</text>`;
  });
  return { W, H, s };
}

/* node classes + the pattern's helper (e.g. Ruby MinHeap), as shown under "Provided" */
function provided({ p, pat }, l) {
  return [...p.nodes.map(k => DATA.nodes[k][l]), (pat.helper || {})[l]].filter(Boolean).join("\n");
}

function stub(p, l) {
  const first = p.solution[l].split("\n")[0];
  return l === "python" ? first + "\n    " : first + "\n  \nend\n";
}
const attKey = (p, l) => `sg.att.${p.id}.${l}`;
const progKey = p => `sg.prog.${p.id}`;

/* ── sections */
function renderHome() {
  return `<section class="sec" id="home">
    <div class="hero"><h1>Algorithm Patterns</h1>
      <p class="lead">Fast review of ${CAT.length} interview patterns in Python and Ruby. Each pattern has its signal, core idea, a template and pitfalls,
        then two problems: one canonical, one in disguise. Write your attempt, reveal a tested solution beside it, and mark how it went.</p>
      <a class="pbtn fill" id="continue" href="#">Start</a></div>
    <div class="hgrid">
      <div class="hcard"><span class="lbl">How to use</span><ol>
        <li>Skim the <a href="#cheat">Cheat Sheet</a> to refresh all ${CAT.length} patterns at once.</li>
        <li>Open a pattern. Read the signal and pitfalls, then solve both problems before you reveal.</li>
        <li>Mark each problem <b>Got it</b> or <b>Review again</b>. Misses collect in the list here.</li>
        <li>Test recognition with the <a href="#drill">Pattern Drill</a>. The <a href="#decision">Decision Guide</a> helps when a problem doesn't click.</li>
      </ol><div class="key">Keys: <span>← → pages</span><span>Tab indents</span><span>Esc leaves the editor</span></div></div>
      <div class="hcard"><span class="lbl">Progress</span><div id="homeStats"></div><ul class="rlist" id="reviewList"></ul></div>
    </div>
    <span class="lbl">Patterns</span>
    <div class="pgrid" id="patternGrid"></div>
    <div class="hcard"><span class="lbl">Your data</span>

/* language cheat sheet: structure here, rows rendered per language in renderLangRows() */

function renderLangRows() {
  const k = LK();
  LS.forEach((sec, i) => {
    const given = (sec.given || {})[k];
    const g = document.querySelector(`[data-given="${i}"]`);
    g.innerHTML = given ? `Given <code>${esc(given)}</code>` : "";
    g.hidden = !given;
    document.querySelector(`[data-ls="${i}"]`).innerHTML = sec.rows.filter(r => r[k] != null).map(r => {
      const code = r[k].replace(/\n+$/, "");

      const since = (r.since || {})[k];
      const out = r[`${k}_out`] != null ? `<span class="ls-out"><span class="arrow">→</span>${hl(r[`${k}_out`], lang)}</span>`
        : r[`${k}_stdout`] != null ? `<span class="ls-out"><span class="prints">prints</span>${esc(r[`${k}_stdout`])}</span>` : "";
      const note = [r.note, r[`${k}_note`]].filter(Boolean).map(inline).join(" ");
      const body = r.shell ? `<pre class="code shell"><code>${shellLines(code)}</code></pre>` : `<pre class="code"><code>${hl(code, lang)}</code></pre>`;
      return `<div class="ls-row${trap ? " trap" : ""}"><div class="ls-task">${esc(r.task)}${since ? `<span class="since">${esc(since)}+</span>` : ""}${r.shell ? `<span class="shtag">shell</span>` : ""}</div>
        <div class="ls-code">${body}${out}${note ? `<div class="ls-note">${note}</div>` : ""}</div></div>`;
    }).join("");

}
/* shell rows: "$ " before each command; "# …" comments (whole line or trailing) dimmed */
function shellLines(code) {
  return code.split("\n").map(line => {
    if (!line.trim()) return "";
    if (line.trimStart().startsWith("#")) return `<span class="cm">${esc(line)}</span>`;
    const i = line.search(/\s#\s/);
    const cmd = i < 0 ? line : line.slice(0, i), cm = i < 0 ? "" : line.slice(i);
    return `<span class="ps">$ </span>${esc(cmd)}${cm ? `<span class="cm">${esc(cm)}</span>` : ""}`;
  }).join("\n");
}
function filterLangRows() {
  const q = document.getElementById("lsFilter").value.trim().toLowerCase();
  let shown = 0, total = 0;
  document.querySelectorAll(".ls-sec").forEach(sec => {
    let any = false;
    sec.querySelectorAll(".ls-row").forEach(row => {
      const hit = !q || row.textContent.toLowerCase().includes(q);
      row.hidden = !hit; any ||= hit; total++; shown += hit;
    });
    sec.hidden = !any;
  });
  document.getElementById("lsCount").textContent = q ? `${shown} of ${total} rows` : `${total} rows`;
  document.getElementById("lsEmpty").hidden = shown > 0;
}

/* ── drill */
const drill = { order: [], pos: 0, score: 0, answered: false };
function drillStart() { Object.assign(drill, { order: shuffle(DATA.drill.map((_, i) => i)), pos: 0, score: 0, answered: false }); drillRender(); }
function drillRender() {
  const el = document.getElementById("drillCard");
  const n = drill.order.length;
  if (drill.pos >= n) {
    el.innerHTML = `<div class="drill-q">Done — ${drill.score} / ${n} correct.</div>
      <div class="drill-actions"><button class="reveal" type="button" data-act="drillRestart">Shuffle and restart</button></div>`;
    return;
  }
  const it = DATA.drill[drill.order[drill.pos]];
  const opts = shuffle([it.answer, ...it.distractors]);
  el.innerHTML = `<div class="drill-h"><span>Question ${drill.pos + 1} / ${n}</span><span>Score ${drill.score}</span></div>
    <p class="drill-q">${inline(it.prompt)}</p>
    <div class="opts">${opts.map((id, k) => `<button class="opt" type="button" data-pick="${id}"><kbd>${k + 1}</kbd>${esc(catName(id))}</button>`).join("")}</div>
    <div class="verdict" hidden></div>
    <div class="drill-actions" hidden><button class="reveal" type="button" data-act="drillNext">${drill.pos + 1 === n ? "See score" : "Next"}</button></div>`;
  drill.answered = false;
}
function drillPick(id) {
  if (drill.answered) return;
  drill.answered = true;
  const it = DATA.drill[drill.order[drill.pos]];
  const ok = id === it.answer;
  if (ok) drill.score++;
  const el = document.getElementById("drillCard");
  el.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.pick === it.answer) b.classList.add("right");
    else if (b.dataset.pick === id) b.classList.add("wrong");
  });
  const v = el.querySelector(".verdict");
  v.innerHTML = `${ok ? `<b class="ok">✓ Correct.</b>` : `<b class="no">✗ It's ${esc(catName(it.answer))}.</b>`} ${inline(it.why)}` +
    (BUILT.has(it.answer) ? ` <a href="#${it.answer}">Review the pattern →</a>` : "");
  v.hidden = false;
  el.querySelector(".drill-actions").hidden = false;
  el.querySelector("[data-act=drillNext]").focus();
  el.querySelector(".drill-h span:last-child").textContent = `Score ${drill.score}`;
}

/* ── editor keys: Tab / Shift+Tab / Enter auto-indent / Esc */
const OPENS = {
  python: line => /:\s*(#.*)?$/.test(line),
  ruby: line => /^\s*(def|class|module|if|elsif|else|unless|while|until|for|case|when|begin)\b/.test(line) || /\bdo(\s*\|[^|]*\|)?\s*$/.test(line),
};
function onKey(e) {
  const ta = e.target, unit = INDENT[lang];
  const { selectionStart: a, selectionEnd: b, value: v } = ta;
  const lineStart = v.lastIndexOf("\n", a - 1) + 1;
  if (e.key === "Escape") { ta.blur(); return; }
  if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); ta.setRangeText(unit, a, b, "end"); }
  else if (e.key === "Tab" && e.shiftKey) {
    e.preventDefault();
    if (v.startsWith(unit, lineStart)) ta.setRangeText("", lineStart, lineStart + unit.length, "preserve");
  } else if (e.key === "Enter" && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    const line = v.slice(lineStart, a);
    const lead = line.match(/^\s*/)[0] + (OPENS[lang](line) ? unit : "");
    ta.setRangeText("\n" + lead, a, b, "end");
  } else return;
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}

/* ── copy / download / backup */
function flash(btn, msg) {
  const old = btn.textContent; btn.textContent = msg; btn.disabled = true;
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1200);
}
function copyText(text, btn) {
  const fallback = () => {          // file:// or older browsers without the Clipboard API
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    t.remove(); flash(btn, ok ? "Copied" : "Copy failed");
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(() => flash(btn, "Copied"), fallback);
  else fallback();
}
function download(name, text, type = "text/plain") {
  const url = URL.createObjectURL(new Blob([text.endsWith("\n") ? text : text + "\n"], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportAll() {
  const data = Object.fromEntries(store.keys().map(k => [k, store.get(k, "")]));
  const day = new Date().toISOString().slice(0, 10);
  download(`algo-patterns-progress-${day}.json`, JSON.stringify({ app: "algo-patterns", version: 1, exported: new Date().toISOString(), data }, null, 2), "application/json");
}
function importAll(file) {
  file.text().then(txt => {
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { alert("That file isn't valid JSON."); return; }
    const entries = Object.entries((obj && obj.data) || {}).filter(([k, v]) => k.startsWith("sg.") && typeof v === "string");
    if (!entries.length) { alert("No saved attempts or progress found in that file."); return; }
    if (!confirm(`Import ${entries.length} saved items? Matching items in this browser are overwritten; everything else is kept.`)) return;
    entries.forEach(([k, v]) => store.set(k, v));
    lang = INDENT[store.get("sg.lang", lang)] ? store.get("sg.lang", lang) : lang;
    applyLang(); applyProgress();
    alert(`Imported ${entries.length} items.`);
  });
}

/* ── pages: every section is rendered once; the hash picks which one shows */
let PAGES = [], page = "home";
const pageLabel = id => ({ home: "Home", cheat: "Cheat Sheet", drill: "Pattern Drill", decision: "Decision Guide", "lang-sheet": "Language Cheat Sheet" })[id] || catName(id);
function pager(i) {
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  return `<nav class="pager" aria-label="Pages">
    ${prev ? `<a class="pbtn prev" href="#${prev}">← ${esc(pageLabel(prev))}</a>` : ""}
    ${next ? `<a class="pbtn next" href="#${next}">${esc(pageLabel(next))} →</a>` : ""}</nav>`;
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || "home";
  const el = document.getElementById(id), sec = el && el.closest("#main > .sec");   // a page, or something inside one
  page = sec ? sec.id : "home";
  const inner = sec && el !== sec;
  document.querySelectorAll("#main > .sec").forEach(sec => (sec.hidden = sec.id !== page));
  document.querySelectorAll(".side .pl").forEach(a => {
    const on = a.dataset.pid === page;
    a.classList.toggle("active", on);
    if (on && a.parentElement.scrollWidth > a.parentElement.clientWidth)   // keep the active chip visible on mobile
      a.parentElement.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
  });
  document.title = page === "home" ? "Algorithm Patterns" : `${pageLabel(page)} · Algorithm Patterns`;
  if (inner) el.scrollIntoView();
  else window.scrollTo(0, 0);
}
function go(step) {
  const next = PAGES[PAGES.indexOf(page) + step];
  if (next) location.hash = next;
}

function resetAll() {
  if (!confirm("Reset everything? This clears every attempt, all progress marks and your language setting in this browser.\n\nExport a backup first if you might want them back.")) return;
  store.keys().forEach(k => store.del(k));
  location.hash = "home";
  location.reload();
}

function init() {
  PAGES = ["home", "cheat", ...DATA.patterns.map(p => p.id), "drill", "decision", "lang-sheet"];
  const main = document.getElementById("main");
  main.innerHTML = renderHome() + renderCheat() + DATA.patterns.map(renderPattern).join("") + renderDrillSection() + renderDecision() + renderLangSheet();
  PAGES.forEach((id, i) => document.getElementById(id).insertAdjacentHTML("beforeend", pager(i)));
  document.getElementById("side").innerHTML = renderSide();
  applyLang(); applyProgress(); drillStart(); route();
  window.addEventListener("hashchange", route);

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; store.set("sg.lang", lang); applyLang();
  }));

  main.addEventListener("input", e => {
    if (e.target.tagName !== "TEXTAREA") return;
    const { p } = problems[e.target.closest(".prob").dataset.idx];
    store.set(attKey(p, lang), e.target.value);
    paint(e.target);
  });
  main.addEventListener("scroll", e => {     // keep the highlight layer under the text (scroll doesn't bubble: capture)
    if (e.target.tagName === "TEXTAREA") { e.target.previousElementSibling.scrollTop = e.target.scrollTop; e.target.previousElementSibling.scrollLeft = e.target.scrollLeft; }
  }, true);
  main.addEventListener("keydown", e => { if (e.target.tagName === "TEXTAREA") onKey(e); });
  document.getElementById("lsFilter").addEventListener("input", filterLangRows);
  main.addEventListener("click", e => {
    const t = e.target;
    const act = t.closest("[data-act]")?.dataset.act;
    if (act === "exportAll") return exportAll();
    if (act === "importAll") return document.getElementById("importFile").click();
    if (act === "resetAll") return resetAll();
    if (act === "printCheat") { document.body.classList.add("print-cheat"); window.print(); return; }
    if (act === "print") return window.print();
    if (act === "drillNext") { drill.pos++; drillRender(); return; }
    if (act === "drillRestart") return drillStart();
    if (t.closest("[data-pick]")) return drillPick(t.closest("[data-pick]").dataset.pick);

    const card = t.closest(".prob");
    if (!card) return;
    const { p } = problems[card.dataset.idx];
    if (t.closest(".st")) {
      const st = t.closest(".st").dataset.st;
      if (store.get(progKey(p), "") === st) store.del(progKey(p)); else store.set(progKey(p), st);
      applyProgress();
    } else if (t.closest(".reveal")) {
      const open = card.classList.toggle("open");
      card.querySelector(".pane.sol").hidden = !open;
      card.querySelector(".after").hidden = !open;
      const btn = card.querySelector(".reveal");
      btn.textContent = open ? "Hide solution" : "Reveal solution";
      btn.setAttribute("aria-expanded", open);
    } else if (act === "copy" || act === "export") {
      const btn = t.closest("[data-act]");
      const mine = btn.dataset.which === "mine";
      const helper = (problems[card.dataset.idx].pat.helper || {})[lang];   // so an exported Ruby heap solution runs
      const code = mine ? card.querySelector("textarea").value : (helper ? helper + "\n" : "") + p.solution[lang];
      if (act === "copy") copyText(code, btn);
      else download(`${p.id.replace(/-/g, "_")}${mine ? "" : "_solution"}.${EXT[lang]}`, code);
    } else if (act === "reset") {
      if (!confirm("Clear your attempt for this problem?")) return;
      const ta = card.querySelector("textarea");
      ta.value = stub(p, lang);
      store.set(attKey(p, lang), ta.value);
      paint(ta);
    }
  });
  document.getElementById("importFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (f) importAll(f); e.target.value = "";
  });
  window.addEventListener("afterprint", () => document.body.classList.remove("print-cheat"));

  /* keys (never while typing): ← → change page; on the drill page 1–4 pick, Enter next */
  document.addEventListener("keydown", e => {
    if (/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
    if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); return go(e.key === "ArrowLeft" ? -1 : 1); }
    if (page !== "drill") return;
    if (/^[1-4]$/.test(e.key)) {
      const b = document.querySelectorAll("#drillCard .opt")[+e.key - 1];
      if (b && !b.disabled) { e.preventDefault(); drillPick(b.dataset.pick); }
    }
  });
}
init();
</script>
</body>
</html>
