<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.0">
<title>Algorithm Patterns</title>
<style>
:root {
  /* Ocean: calm deep teal-blue on white */
  --bg: #ffffff; --surface: #ffffff;
  --ink: #14262e; --ink-2: #4a5f68; --ink-3: #74878f;
  --rule: #d6e1e5; --code-bg: #f4f8f9; --code-rule: #d6e1e5;
  --accent: #0b6a87; --accent-tint: #e2f2f6; --hit: #dff3e4;
  --easy: #1a7f37;   --easy-bg: #dafbe1;
  --medium: #9a6700; --medium-bg: #fff8c5;
  --hard: #c0303a;   --hard-bg: #fdecea;
  --t-comment: #6b7d85; --t-keyword: #b4235a; --t-string: #2f6b1f; --t-number: #0b6a87;
  --t-fn: #7a3fb8; --t-builtin: #9a5b13; --t-op: #33454d;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --side-w: 232px;
}
[hidden] { display: none !important; }   /* component display rules must never beat [hidden] */
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--sans); }
code, pre, textarea { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: var(--sans); }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.brand { font-size: 19px; font-weight: 700; letter-spacing: -.015em; color: var(--accent); text-decoration: none; white-space: nowrap; }
.ver { margin-left: -8px; font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
.tprog { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--ink-2); text-decoration: none; }
.tprog:hover { color: var(--accent); }
.lang { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; padding: 6px 14px; font: 500 13px var(--mono); color: var(--ink-2); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* layout */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
.side { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; padding: 20px 12px 24px 20px; }
.side .grp { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 14px 10px 4px; }
.side .grp:first-child { padding-top: 0; }
.side a { display: block; text-decoration: none; color: var(--ink-2); border-radius: 6px; }
.side .pl { padding: 5px 10px; font-weight: 550; font-size: 14px; }
.side .pl span { font: 12px var(--mono); color: var(--ink-3); margin-right: 8px; }
.side .ql { display: flex; align-items: baseline; gap: 7px; padding: 3px 10px 3px 34px; font-size: 13px; color: var(--ink-3); }
.side a:hover { background: var(--code-bg); color: var(--ink); }
.side .pl.active { background: var(--accent-tint); color: var(--accent); }
.side .pl.active span { color: var(--accent); }
main { padding: 32px 44px 96px; min-width: 0; }

/* progress meter + small buttons */
.meter { width: 90px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 7px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--ink-3); }
.btn.danger { color: var(--hard); border-color: color-mix(in srgb, var(--hard) 45%, transparent); }
.btn.danger:hover { background: var(--hard-bg); border-color: var(--hard); }

/* pages: one section at a time, prev / next at the bottom */
.pager { display: flex; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); }
.pbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface);
  border-radius: 8px; padding: 8px 16px; font: 550 14px var(--sans); text-decoration: none; cursor: pointer; }
.pbtn:hover { background: var(--accent-tint); }
.pbtn.fill { background: var(--accent); color: #fff; }
.pbtn.fill:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.pager .next { margin-left: auto; }

/* home */
.hero h1 { margin: 4px 0 8px; font-size: 32px; letter-spacing: -.025em; color: var(--accent); }
.hero .lead { max-width: 68ch; font-size: 16px; }
.hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 32px 0; }
.hcard { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; }
.hcard ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.hcard ol li { margin: 8px 0; }
.hcard a, .lead a { color: var(--accent); text-decoration: none; font-weight: 550; }
.hcard a:hover, .lead a:hover { text-decoration: underline; }
.hcard p { margin: 8px 0 12px; color: var(--ink-2); font-size: 14px; }
.stats { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 6px; }
.stats b { font-size: 28px; letter-spacing: -.02em; }
.stats span { color: var(--ink-2); font-size: 14px; }
.meter.big { width: 100%; height: 8px; border-radius: 4px; }
.rlist { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.rlist li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
.rlist a { color: var(--accent); text-decoration: none; font-weight: 550; }
.rlist small, .empty { color: var(--ink-3); font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 32px; }
.pcard { display: block; border: 1px solid var(--rule); border-radius: 10px; padding: 11px 14px; text-decoration: none; color: var(--ink); }
.pcard:hover { border-color: var(--accent); }
.pcard .nm { font-weight: 600; font-size: 14px; }
.pcard .nm span { font: 12px var(--mono); color: var(--accent); margin-right: 6px; }
.pcard .pr { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.dot { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); transform: translateY(-1px); }
.st-done > .dot, .dot.st-done { background: var(--easy); border-color: var(--easy); }
.st-review > .dot, .dot.st-review { background: var(--medium); border-color: var(--medium); }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.key span { display: inline-flex; align-items: center; gap: 5px; }

/* sections */
.sec { padding-bottom: 8px; }
.p-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.p-head .right { margin-left: auto; }
.p-num { font: 600 14px var(--mono); color: var(--accent); }
.p-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.lbl { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.signal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 28px; }
.signal .lbl { margin-right: 4px; }
.chip { font-size: 13px; padding: 3px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--rule); color: var(--ink-2); }
.block { margin-bottom: 36px; }
.block p { margin: 10px 0 0; color: var(--ink-2); max-width: 85ch; }
.lead { margin: 0 0 24px; color: var(--ink-2); }
.probs-h { margin: 8px 0 14px; }
.pchip { display: inline-block; font-size: 13px; font-weight: 550; padding: 1px 9px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); text-decoration: none; white-space: nowrap; }
a.pchip:hover { text-decoration: underline; }
.pchip.soon { background: none; border: 1px dashed var(--rule); color: var(--ink-3); font-weight: 450; }
.stmt code, .after code, .block code, .pitfalls code, .ref code, .dcard code, .drill code { font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

/* concept */
.concept { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; margin-bottom: 36px; }
.diagram { display: flex; flex-direction: column; justify-content: center; margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px; }
.diagram svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.diagram figcaption { font: 12px var(--mono); color: var(--ink-2); text-align: center; margin-top: 8px; }
.d-cell { fill: var(--surface); stroke: var(--code-rule); }
.d-cell.win { fill: var(--accent-tint); stroke: var(--accent); }
.d-cell.hit { fill: var(--hit); stroke: var(--easy); }
.d-val { font: 14px var(--mono); fill: var(--ink); text-anchor: middle; }
.d-mark { font: 600 11px var(--mono); fill: var(--accent); text-anchor: middle; }
.d-note { font: 12px var(--sans); fill: var(--ink-2); }
.d-edge { stroke: var(--ink-3); stroke-width: 1.3; fill: none; }
.d-head { fill: var(--ink-3); }
.d-bar { font: 11px var(--mono); fill: var(--ink); }
.d-cut { stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 3; }
.d-val.sm { font-size: 13px; }
.d-head-t { font: 11px var(--mono); fill: var(--ink-3); text-anchor: middle; }
.d-head-t.end { text-anchor: end; }
.d-badge { font: 600 10.5px var(--mono); fill: var(--accent); }
.d-elab { font: 10.5px var(--mono); fill: var(--ink-3); }
.codebox { background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 10px; overflow: hidden; min-width: 0; }
.codebox-h { display: flex; justify-content: space-between; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--code-rule); }
.langtag { font: 11px var(--mono); color: var(--ink-3); }
pre.code { margin: 0; padding: 14px 16px; font-size: 13px; line-height: 1.6; overflow-x: auto; tab-size: 4; }
.pitfalls { margin-bottom: 36px; }
.pitfalls, .block { font-size: 15px; }
.pitfalls ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); max-width: 95ch; }
.pitfalls li { margin: 9px 0; padding-left: 2px; }

/* problem */
.prob { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 22px 24px; margin-bottom: 24px; }
.prob-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.prob-h h3 { margin: 0; font-size: 17px; }
.diff { font: 600 11px var(--mono); padding: 2px 8px; border-radius: 5px; }
.diff.Easy { color: var(--easy); background: var(--easy-bg); }
.diff.Medium { color: var(--medium); background: var(--medium-bg); }
.diff.Hard { color: var(--hard); background: var(--hard-bg); }
.variant { font-size: 13px; color: var(--ink-3); }
.status { margin-left: auto; display: flex; gap: 6px; }
.st { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-3); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.st:hover { color: var(--ink); }
.st[data-st="done"][aria-pressed="true"] { background: var(--easy-bg); color: var(--easy); border-color: var(--easy); }
.st[data-st="review"][aria-pressed="true"] { background: var(--medium-bg); color: var(--medium); border-color: var(--medium); }
.stmt { margin: 0 0 14px; }
.ex { margin: 0 0 14px; padding: 10px 14px; background: var(--code-bg); border-radius: 6px; font-size: 13px; white-space: pre-wrap; color: var(--ink-2); }
.disclose { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-bottom: 16px; font-size: 14px; }
.disclose details { min-width: 0; }
.disclose details[open] { flex-basis: 100%; }
.disclose summary { cursor: pointer; color: var(--accent); font-weight: 550; width: max-content; }
.disclose summary small { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.disclose p { margin: 6px 0 0; color: var(--ink-2); }
.disclose pre.code { margin: 6px 0 0; background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 8px; }
.tc { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--code-rule); border-radius: 8px; overflow: hidden; }
.tc li { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; padding: 6px 12px; font: 12.5px/1.5 var(--mono); background: var(--code-bg); }
.tc li + li { border-top: 1px solid var(--code-rule); }
.tc .call { color: var(--ink); overflow-wrap: anywhere; }
.tc .note { font: 12px var(--sans); color: var(--ink-3); }
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.prob.open .work { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--code-rule); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.pane-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--code-rule); min-height: 34px; }
.pane.sol { border-color: var(--accent); }
.pane.sol .pane-h { background: var(--accent-tint); }
.pane.sol .lbl { color: var(--accent); }
.pane .code { flex: 1; }
textarea { flex: 1; width: 100%; border: 0; resize: vertical; background: transparent; color: var(--ink);
  padding: 12px 14px; font-size: 13px; line-height: 1.6; tab-size: 4; outline: none; white-space: pre; overflow-x: auto; }
.pane.mine:focus-within { border-color: var(--accent); }
.ed { position: relative; flex: 1; display: flex; min-height: 0; }
.ed textarea { position: relative; z-index: 1; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--ink); }
.ed textarea::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.ed .ed-hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; white-space: pre; color: var(--ink); }
.link { border: 0; background: none; font: 12px var(--sans); color: var(--ink-3); cursor: pointer; padding: 2px 4px; }
.link:hover { color: var(--ink); }
.tools { display: flex; gap: 6px; }
.pane-h .langtag { margin-left: 6px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
.reveal { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 14px; font: 550 13px var(--sans); cursor: pointer; }
.prob.open .reveal { background: var(--surface); color: var(--accent); }
.kbd { font-size: 12px; color: var(--ink-3); }
.after { margin-top: 16px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; font-size: 14px; }
.after p { margin: 0; }
.after .cx { margin-top: 4px; font: 12px var(--mono); color: var(--ink-2); }

/* decision guide */
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.dcard { border: 1px solid var(--rule); border-radius: 12px; padding: 18px 22px; }
.dq { font-weight: 650; margin-bottom: 6px; }
.dcard ul { list-style: none; margin: 0; padding: 0; }
.dcard li { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; font-size: 14px; color: var(--ink-2); }
.dcard li + li { border-top: 1px dashed var(--rule); }
.dcard li .if { flex: 1; }
.dcard li .arrow { color: var(--ink-3); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table.ref { width: 100%; border-collapse: collapse; font-size: 14px; }
.ref th, .ref td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ref tr:last-child td { border-bottom: 0; }
.ref th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--code-bg); }
.ref td.num { font: 12px var(--mono); color: var(--ink-3); width: 1%; }
.ref td.nm { font-weight: 600; white-space: nowrap; }
.ref td.cx { font: 12.5px var(--mono); white-space: nowrap; color: var(--ink-2); }
.ref td { color: var(--ink-2); }
.ref td.nm a { color: var(--accent); text-decoration: none; }
.ref .soon { font: 11px var(--sans); font-weight: 400; color: var(--ink-3); margin-left: 4px; }

/* language cheat sheet */
.ls-tools { position: sticky; top: 56px; z-index: 4; background: var(--bg); padding: 10px 0 8px; margin-bottom: 6px; border-bottom: 1px solid var(--rule); }
.ls-search { display: flex; align-items: center; gap: 10px; }
.ls-search input { flex: 1; max-width: 420px; font: 14px var(--sans); padding: 7px 12px; border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); background: var(--surface); }
.ls-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.ls-search span { font-size: 13px; color: var(--ink-3); }
.ls-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ls-chips a { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); text-decoration: none; }
.ls-chips a:hover { border-color: var(--accent); color: var(--accent); }
.ls-sec { margin-top: 40px; scroll-margin-top: 150px; }
.ls-sec h3 { margin: 0 0 6px; font-size: 18px; }
.ls-given { margin: 0 0 10px; font-size: 13px; color: var(--ink-3); }
.ls-given code { font-size: 12.5px; background: var(--code-bg); padding: 1px 6px; border-radius: 4px; color: var(--ink-2); }
.ls-row { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 6px 20px; padding: 18px 0; border-top: 1px solid var(--rule); }
.ls-task { font-size: 14px; font-weight: 550; color: var(--ink); padding-top: 3px; }
.ls-task .since { display: inline-block; margin-left: 6px; font: 600 10.5px var(--mono); color: var(--accent); background: var(--accent-tint); padding: 0 6px; border-radius: 4px; vertical-align: 1px; }
.ls-row.trap { border-left: 3px solid var(--medium); padding-left: 10px; background: linear-gradient(to right, var(--medium-bg), transparent 260px); }
.ls-row.trap .ls-task::before { content: "⚠ "; color: var(--medium); }
/* code always full width; result and notes always on their own lines below (user convention: easy to scan) */
.ls-code { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ls-code pre.code { padding: 6px 12px; background: var(--code-bg); border-radius: 6px; font-size: 13px; }
.ls-out { font: 13px var(--mono); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.ls-out .arrow { color: var(--ink-3); margin-right: 6px; font-family: var(--sans); }
.ls-out .prints { font: 11px var(--sans); color: var(--ink-3); margin-right: 6px; text-transform: uppercase; letter-spacing: .05em; }
.ls-note { font-size: 13px; color: var(--ink-2); }
.ls-code pre.shell { color: var(--ink); }
.ls-code pre.shell .ps { color: var(--ink-3); user-select: none; }
.ls-code pre.shell .cm { color: var(--t-comment); font-style: italic; }
.ls-task .shtag { display: inline-block; margin-left: 6px; font: 600 10.5px var(--mono); color: var(--ink-2); background: var(--code-bg); border: 1px solid var(--rule); padding: 0 5px; border-radius: 4px; vertical-align: 1px; }
.ls-note code { font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.ls-empty { color: var(--ink-3); font-style: italic; margin-top: 20px; }

/* drill */
.drill { border: 1px solid var(--rule); border-radius: 12px; padding: 24px 28px; }
.drill-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-3); }
.drill-q { font-size: 17.5px; margin: 0 0 20px; line-height: 1.6; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1px solid var(--rule); background: var(--surface); padding: 12px 14px; border-radius: 9px; cursor: pointer; font-size: 14.5px; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--easy); background: var(--easy-bg); }
.opt.wrong { border-color: var(--hard); background: var(--hard-bg); }
.opt kbd { font: 11px var(--mono); color: var(--ink-3); margin-right: 8px; }
.verdict { margin-top: 18px; padding: 14px 18px; border-radius: 9px; font-size: 14px; background: var(--code-bg); }
.verdict b.ok { color: var(--easy); }
.verdict b.no { color: var(--hard); }
.drill-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }

/* prism tokens */
.token.comment { color: var(--t-comment); font-style: italic; }
.token.keyword { color: var(--t-keyword); }
.token.string, .token.char, .token.string-literal { color: var(--t-string); }
.token.number, .token.boolean, .token.constant, .token.symbol { color: var(--t-number); }
.token.function, .token.class-name { color: var(--t-fn); }
.token.builtin { color: var(--t-builtin); }
.token.operator, .token.punctuation { color: var(--t-op); }
.token.regex { color: var(--hard); }

/* narrow */
@media (max-width: 960px) {
  .concept, .dgrid { grid-template-columns: minmax(0, 1fr); }
  .prob.open .work { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 56px; z-index: 5; display: flex; gap: 4px; max-height: none; overflow-x: auto; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .side .pl { white-space: nowrap; }
  .side .ql, .side .grp { display: none; }
  html { scroll-padding-top: 112px; }
  .pgrid { grid-template-columns: minmax(0, 1fr); }
  .ls-row { grid-template-columns: minmax(0, 1fr); }
  .ls-tools { top: 100px; }
  .ls-chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .ls-chips a { white-space: nowrap; }
  .ls-sec { scroll-margin-top: 200px; }
  main { padding: 24px 16px 64px; }
  .top { padding: 0 16px; gap: 10px; }
  .brand { font-size: 17px; }
  .tprog .meter { display: none; }
  .lang button { padding: 6px 10px; }
  .hgrid { grid-template-columns: minmax(0, 1fr); }
  .key { display: none; }
  .pager .pbtn { padding: 8px 12px; font-size: 13px; }
  .prob, .drill { padding: 18px 16px; }
  .kbd { display: none; }
  .status { margin-left: 0; }
  .opts { grid-template-columns: minmax(0, 1fr); }
}

/* print: the cheat sheet alone, or the whole guide without the UI chrome */
@media print {
  .top, .side, .pager, .work, .actions, .status, .disclose, .p-head .right, .ls-tools { display: none !important; }
  .ls-row { break-inside: avoid; }
  .layout { display: block; }
  main { padding: 0; }
  body.print-cheat main > :not(#cheat) { display: none !important; }
  body.print-cheat #cheat { border: 0; }
  .ref th, .ref td { padding: 5px 8px; font-size: 11px; }
  .tablewrap { overflow: visible; }
}

const DATA = {"patterns": [{"id": "two-pointers", "name": "Two Pointers", "signal": ["sorted array", "pair / triplet sums to target", "in-place with O(1) space", "palindrome or reverse"], "idea": "Two indices move through the array based on a comparison, so each step permanently rules out candidates. Converging pointers (from both ends) need sorted or symmetric input; same-direction pointers (slow writer, fast reader) compact or partition in place. Either way, O(n²) pair checks become one O(n) pass with O(1) space.", "diagram": {"caption": "sum > target → R−−   ·   sum < target → L++", "frames": [{"values": [1, 3, 4, 6, 8, 11], "marks": {"L": 0, "R": 5}, "note": "1 + 11 = 12 > 10 → R−−"}, {"values": [1, 3, 4, 6, 8, 11], "marks": {"L": 0, "R": 4}, "note": "1 + 8 = 9 < 10 → L++"}, {"values": [1, 3, 4, 6, 8, 11], "marks": {"L": 2, "R": 3}, "hit": [2, 3], "note": "… 4 + 6 = 10 ✓"}]}, "template": {"python": "# converging — sorted input\nl, r = 0, len(a) - 1\nwhile l < r:\n    if found(a[l], a[r]):\n        return ...\n    if too_small(a[l], a[r]):\n        l += 1\n    else:\n        r -= 1\n\n# same direction — slow writer, fast reader\nw = 0\nfor x in a:\n    if keep(x):\n        a[w] = x\n        w += 1\n", "ruby": "# converging — sorted input\nl, r = 0, a.length - 1\nwhile l < r\n  return ... if found(a[l], a[r])\n  too_small(a[l], a[r]) ? l += 1 : r -= 1\nend\n\n# same direction — slow writer, fast reader\nw = 0\na.each do |x|\n  next unless keep(x)\n  a[w] = x\n  w += 1\nend\n"}, "pitfalls": ["Converging only works when moving a pointer has a predictable effect — sorted (or symmetric) input. Unsorted → sort first (O(n log n)), or use a hash map if you must return original indices.", "Loop on `l < r`, not `l <= r` — a pair needs two distinct elements.", "Every iteration must move at least one pointer, or the loop never ends.", "After sorting, skip equal neighbours (both the anchor and the inner pointer) or you'll emit duplicate answers.", "k-Sum generalizes: fix k − 2 values with loops and two-pointer the rest → O(nᵏ⁻¹)."], "problems": [{"id": "two-sum-ii", "title": "Two Sum II — Sorted Input", "difficulty": "Easy", "variant": "canonical", "statement": "Sorted array `numbers`; find two numbers that add to `target`. Return their 1-indexed positions. Exactly one answer exists; use O(1) extra space.", "example": "numbers = [2, 7, 11, 15], target = 9  →  [1, 2]", "hint": "Start at both ends. If the sum is too big, which pointer can make it smaller?", "insight": "Sorted order means every comparison discards one element for good — no pair is ever checked twice.", "complexity": "O(n) time · O(1) space", "fn": "two_sum", "tests": [{"args": [[2, 7, 11, 15], 9], "out": [1, 2], "note": "example"}, {"args": [[2, 3, 4], 6], "out": [1, 3], "note": "answer at both ends"}, {"args": [[-1, 0], -1], "out": [1, 2], "note": "negatives, n = 2"}, {"args": [[1, 2, 3, 4, 4, 9, 56, 90], 8], "out": [4, 5], "note": "duplicate values"}], "solution": {"python": "def two_sum(numbers, target):\n    l, r = 0, len(numbers) - 1\n    while l < r:\n        s = numbers[l] + numbers[r]\n        if s == target:\n            return [l + 1, r + 1]\n        if s < target:\n            l += 1\n        else:\n            r -= 1\n    return []\n", "ruby": "def two_sum(numbers, target)\n  l, r = 0, numbers.length - 1\n  while l < r\n    s = numbers[l] + numbers[r]\n    return [l + 1, r + 1] if s == target\n    s < target ? l += 1 : r -= 1\n  end\n  []\nend\n"}, "nodes": []}, {"id": "three-sum", "title": "3Sum", "difficulty": "Medium", "variant": "sort, then two pointers inside a loop", "statement": "Return all unique triplets in `nums` that sum to 0. No duplicate triplets in the output.", "example": "nums = [-1, 0, 1, 2, -1, -4]  →  [[-1, -1, 2], [-1, 0, 1]]", "hint": "Fix one number, and the rest is Two Sum II — once the array is sorted.", "insight": "Sorting enables the two-pointer scan and puts duplicates side by side, so skipping them is a one-line check.", "complexity": "O(n²) time · O(1) extra space (excluding sort and output)", "fn": "three_sum", "compare": "unordered", "tests": [{"args": [[-1, 0, 1, 2, -1, -4]], "out": [[-1, -1, 2], [-1, 0, 1]], "note": "example"}, {"args": [[0, 1, 1]], "out": [], "note": "no answer"}, {"args": [[0, 0, 0, 0]], "out": [[0, 0, 0]], "note": "all equal — dedupe"}, {"args": [[-2, 0, 1, 1, 2]], "out": [[-2, 0, 2], [-2, 1, 1]], "note": "two answers, same anchor"}, {"args": [[1, 2]], "out": [], "note": "fewer than 3 elements"}], "solution": {"python": "def three_sum(nums):\n    nums = sorted(nums)\n    res = []\n    for i in range(len(nums) - 2):\n        if i > 0 and nums[i] == nums[i - 1]:\n            continue                 # skip duplicate anchor\n        if nums[i] > 0:\n            break                    # everything after is positive\n        l, r = i + 1, len(nums) - 1\n        while l < r:\n            s = nums[i] + nums[l] + nums[r]\n            if s < 0:\n                l += 1\n            elif s > 0:\n                r -= 1\n            else:\n                res.append([nums[i], nums[l], nums[r]])\n                l += 1\n                while l < r and nums[l] == nums[l - 1]:\n                    l += 1           # skip duplicate second value\n    return res\n", "ruby": "def three_sum(nums)\n  nums = nums.sort\n  res = []\n  (0...nums.length - 2).each do |i|\n    next if i > 0 && nums[i] == nums[i - 1]   # skip duplicate anchor\n    break if nums[i] > 0                      # everything after is positive\n    l, r = i + 1, nums.length - 1\n    while l < r\n      s = nums[i] + nums[l] + nums[r]\n      if s < 0\n        l += 1\n      elsif s > 0\n        r -= 1\n      else\n        res << [nums[i], nums[l], nums[r]]\n        l += 1\n        l += 1 while l < r && nums[l] == nums[l - 1]   # skip duplicate second value\n      end\n    end\n  end\n  res\nend\n"}, "nodes": []}]}, {"id": "sliding-window", "name": "Sliding Window", "signal": ["contiguous subarray / substring", "longest / shortest / max sum", "at most K distinct, no repeats"], "idea": "Keep a contiguous window [L, R] plus a running state (sum, counts, last-seen index). R advances every step; L advances only to repair a broken constraint. Since neither pointer moves backward, each element enters and leaves once — O(n) instead of re-scanning every subarray.", "diagram": {"caption": "grow R every step   ·   shrink L only while the window is invalid", "frames": [{"values": ["a", "b", "c", "a", "b", "c", "b", "b"], "marks": {"L": 0, "R": 2}, "window": [0, 2], "note": "\"abc\" valid → len 3"}, {"values": ["a", "b", "c", "a", "b", "c", "b", "b"], "marks": {"L": 1, "R": 3}, "window": [1, 3], "note": "R hits 2nd 'a' → L jumps to 1"}]}, "template": {"python": "l = 0\nbest = 0\nstate = ...                 # running sum, counts, last-seen map\nfor r, x in enumerate(a):\n    add(state, x)           # grow: x enters\n    while invalid(state):   # shrink until valid again\n        remove(state, a[l])\n        l += 1\n    best = max(best, r - l + 1)\n", "ruby": "l = 0\nbest = 0\nstate = ...                 # running sum, counts, last-seen map\na.each_with_index do |x, r|\n  add(state, x)             # grow: x enters\n  while invalid(state)      # shrink until valid again\n    remove(state, a[l])\n    l += 1\n  end\n  best = [best, r - l + 1].max\nend\n"}, "pitfalls": ["Needs monotonicity — growing must only push the window toward invalid. Negative numbers break sum windows → use prefix sum + hash map instead.", "Pick the shape first. Fixed size → add one, drop one. Variable → grow, then `while invalid` shrink.", "Record the answer at the right moment: longest → after shrinking (window valid); shortest → inside the shrink loop (still valid).", "Window length is `r - l + 1` — the most common off-by-one.", "\"Exactly K\" = atMost(K) − atMost(K − 1). When counting distinct keys, delete keys whose count drops to 0."], "problems": [{"id": "max-sum-k", "title": "Max Sum Subarray of Size K", "difficulty": "Easy", "variant": "fixed window", "statement": "Return the maximum sum of any contiguous subarray of `nums` with length exactly `k`.", "example": "nums = [2, 1, 5, 1, 3, 2], k = 3  →  9   (5 + 1 + 3)", "hint": "Sliding the window by one changes its sum by exactly two numbers.", "insight": "Never re-sum the window — add the element entering and subtract the one leaving.", "complexity": "O(n) time · O(1) space", "fn": "max_sum_subarray", "tests": [{"args": [[2, 1, 5, 1, 3, 2], 3], "out": 9, "note": "example"}, {"args": [[2, 3, 4, 1, 5], 2], "out": 7, "note": "k = 2"}, {"args": [[5], 1], "out": 5, "note": "single element"}, {"args": [[-1, -2, -3], 2], "out": -3, "note": "all negative"}], "solution": {"python": "def max_sum_subarray(nums, k):\n    window = sum(nums[:k])\n    best = window\n    for r in range(k, len(nums)):\n        window += nums[r] - nums[r - k]   # add incoming, drop outgoing\n        best = max(best, window)\n    return best\n", "ruby": "def max_sum_subarray(nums, k)\n  window = nums[0, k].sum\n  best = window\n  (k...nums.length).each do |r|\n    window += nums[r] - nums[r - k]   # add incoming, drop outgoing\n    best = [best, window].max\n  end\n  best\nend\n"}, "nodes": []}, {"id": "longest-substring-no-repeat", "title": "Longest Substring Without Repeating Characters", "difficulty": "Medium", "variant": "variable window", "statement": "Return the length of the longest substring of `s` with no repeated characters.", "example": "s = \"abcabcbb\"  →  3   (\"abc\")", "hint": "Grow R each step. When a character repeats inside the window, where must L move to?", "insight": "Store each character's last index — L jumps straight past the duplicate and never moves backward.", "complexity": "O(n) time · O(k) space (k = distinct characters)", "fn": "length_of_longest_substring", "tests": [{"args": ["abcabcbb"], "out": 3, "note": "example"}, {"args": ["bbbbb"], "out": 1, "note": "all same char"}, {"args": ["pwwkew"], "out": 3, "note": "answer isn't a prefix"}, {"args": [""], "out": 0, "note": "empty string"}, {"args": ["abba"], "out": 2, "note": "L must never move backward"}, {"args": [" "], "out": 1, "note": "space counts as a char"}], "solution": {"python": "def length_of_longest_substring(s):\n    last = {}                      # char -> last index seen\n    l = best = 0\n    for r, c in enumerate(s):\n        if last.get(c, -1) >= l:   # repeat inside window\n            l = last[c] + 1        # jump past it\n        last[c] = r\n        best = max(best, r - l + 1)\n    return best\n", "ruby": "def length_of_longest_substring(s)\n  last = {}                          # char -> last index seen\n  l = best = 0\n  s.each_char.with_index do |c, r|\n    l = last[c] + 1 if last.fetch(c, -1) >= l   # repeat inside window → jump past it\n    last[c] = r\n    best = [best, r - l + 1].max\n  end\n  best\nend\n"}, "nodes": []}]}, {"id": "fast-slow", "name": "Fast & Slow Pointers", "signal": ["linked list cycle", "middle of a list", "array values that point to indices", "repeats in x → f(x)"], "idea": "Two pointers walk the same path, slow by 1 and fast by 2. In a cycle the gap closes by exactly one per step, so they must meet; with no cycle, fast reaches the end while slow sits at the middle. To find the cycle entry, restart one pointer at the head and step both by 1. Cycle detection in O(n) time with O(1) space instead of a visited set.", "diagram": {"type": "linked", "caption": "S +1, F +2 → meet   ·   then H +1, S +1 → entry", "frames": [{"values": [1, 2, 3, 4, 5, 6], "loop": 2, "marks": {"S F": 0}, "note": "both start at head"}, {"values": [1, 2, 3, 4, 5, 6], "loop": 2, "marks": {"S F": 4}, "hit": [4], "note": "4 steps later fast laps slow → cycle"}, {"values": [1, 2, 3, 4, 5, 6], "loop": 2, "marks": {"H S": 2}, "hit": [2], "note": "phase 2: H from head, S from 5 → meet at 3"}]}, "template": {"python": "slow = fast = head\nwhile fast and fast.next:\n    slow = slow.next\n    fast = fast.next.next\n    if slow is fast:            # cycle\n        break\n# no cycle → slow is the middle (2nd one if even)\n\n# cycle entry (phase 2), after they meet\np = head\nwhile p is not slow:\n    p = p.next\n    slow = slow.next\n# p is the entry\n", "ruby": "slow = fast = head\nwhile fast && fast.next\n  slow = slow.next\n  fast = fast.next.next\n  break if slow.equal?(fast)    # cycle\nend\n# no cycle → slow is the middle (2nd one if even)\n\n# cycle entry (phase 2), after they meet\np = head\nuntil p.equal?(slow)\n  p = p.next\n  slow = slow.next\nend\n# p is the entry\n"}, "pitfalls": ["Guard `fast and fast.next` before the double step. Checking only `fast` crashes on even-length lists.", "Compare nodes by identity (`is` / `equal?`), not by value. Lists can repeat values.", "Middle: starting both at `head` gives the 2nd middle for even n. Start `fast = head.next` for the 1st (what you want when splitting a list for merge sort or a palindrome check).", "Why phase 2 works: tail length a, meeting point b into a cycle of length c. Fast walked twice as far, so 2(a + b) = a + b + kc, so a = kc − b. Walking a steps from the head and from the meeting point lands both on the entry.", "Works for any x → f(x) on a finite set: array as linked list (i → nums[i]), happy number (n → sum of squared digits). Pigeonhole guarantees the cycle."], "problems": [{"id": "linked-list-cycle", "title": "Linked List Cycle", "difficulty": "Easy", "variant": "canonical", "statement": "Return true if the linked list starting at `head` contains a cycle. Use O(1) extra space.", "example": "head = [3, 2, 0, -4], tail links to index 1  →  true", "hint": "Two runners on a circular track at different speeds — what has to happen eventually?", "insight": "Inside the cycle fast gains exactly one node per step, so it can't jump over slow — the gap shrinks to 0.", "complexity": "O(n) time · O(1) space", "fn": "has_cycle", "tests": [{"args": [{"list": [3, 2, 0, -4], "pos": 1}], "out": true, "note": "example"}, {"args": [{"list": [1, 2], "pos": 0}], "out": true, "note": "cycle through the head"}, {"args": [{"list": [1], "pos": 0}], "out": true, "note": "self-loop"}, {"args": [{"list": [1, 2, 3, 4]}], "out": false, "note": "even length: fast.next hits nil"}, {"args": [{"list": [1, 2, 3]}], "out": false, "note": "odd length: fast hits nil"}, {"args": [{"list": []}], "out": false, "note": "empty list"}], "solution": {"python": "def has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:\n            return True\n    return False\n", "ruby": "def has_cycle(head)\n  slow = fast = head\n  while fast && fast.next\n    slow = slow.next\n    fast = fast.next.next\n    return true if slow.equal?(fast)\n  end\n  false\nend\n"}, "nodes": ["list"]}, {"id": "find-duplicate", "title": "Find the Duplicate Number", "difficulty": "Medium", "variant": "array as a linked list", "statement": "`nums` holds n + 1 integers, each in [1, n]. Exactly one value repeats (possibly more than twice). Return it without modifying `nums`, in O(1) extra space.", "example": "nums = [1, 3, 4, 2, 2]  →  2", "hint": "Follow i → nums[i] starting at index 0. What shape does that path make, and where on it is the repeated value?", "insight": "Treat `nums[i]` as the next pointer of node i. Two indices point to the duplicate, so it's exactly where the tail joins the cycle — Floyd's phase 2 finds it.", "complexity": "O(n) time · O(1) space", "fn": "find_duplicate", "tests": [{"args": [[1, 3, 4, 2, 2]], "out": 2, "note": "example"}, {"args": [[3, 1, 3, 4, 2]], "out": 3, "note": "duplicate isn't adjacent"}, {"args": [[1, 1]], "out": 1, "note": "n = 1"}, {"args": [[2, 2, 2, 2, 2]], "out": 2, "note": "repeats more than twice"}, {"args": [[2, 5, 9, 6, 9, 3, 8, 9, 7, 1]], "out": 9, "note": "long tail before the cycle"}], "solution": {"python": "def find_duplicate(nums):\n    slow = fast = 0                 # index 0 is the head: no value points to it\n    while True:\n        slow = nums[slow]\n        fast = nums[nums[fast]]\n        if slow == fast:\n            break\n    h = 0\n    while h != slow:                # phase 2: meet at the cycle entry\n        h = nums[h]\n        slow = nums[slow]\n    return h\n", "ruby": "def find_duplicate(nums)\n  slow = fast = 0                 # index 0 is the head: no value points to it\n  loop do\n    slow = nums[slow]\n    fast = nums[nums[fast]]\n    break if slow == fast\n  end\n  h = 0\n  h, slow = nums[h], nums[slow] while h != slow   # phase 2: meet at the cycle entry\n  h\nend\n"}, "nodes": []}]}, {"id": "merge-intervals", "name": "Merge Intervals", "signal": ["intervals / ranges / meetings", "overlapping", "insert or merge ranges", "rooms needed / max at once"], "idea": "Sort by start, so an interval can only overlap the ones just before it; one sweep then either extends the last merged interval or starts a new one. For \"how many at once\" questions, don't merge — sweep the sorted starts against the sorted ends. O(n log n) for the sort, O(n) after.", "diagram": {"type": "intervals", "caption": "sort by start   ·   start ≤ last end → extend", "frames": [{"bars": [[1, 3], [2, 6], [8, 10], [15, 18]], "cut": {"at": 3, "label": "end 3"}, "note": "2 ≤ 3 → [2, 6] overlaps [1, 3]"}, {"bars": [[1, 6], [8, 10], [15, 18]], "lanes": [0, 0, 0], "hit": [0], "note": "merged: [1, 6]; 8 > 6 starts a new one"}]}, "template": {"python": "merged = []\nfor s, e in sorted(intervals):\n    if merged and s <= merged[-1][1]:   # overlaps the last one\n        merged[-1][1] = max(merged[-1][1], e)\n    else:\n        merged.append([s, e])\n\n# max overlapping at once — half-open [s, e)\nstarts = sorted(s for s, _ in intervals)\nends = sorted(e for _, e in intervals)\nlive = j = 0\nfor s in starts:\n    if s >= ends[j]:     # one ended before s: reuse it\n        j += 1\n    else:\n        live += 1\n", "ruby": "merged = []\nintervals.sort.each do |s, e|\n  if !merged.empty? && s <= merged[-1][1]   # overlaps the last one\n    merged[-1][1] = [merged[-1][1], e].max\n  else\n    merged << [s, e]\n  end\nend\n\n# max overlapping at once — half-open [s, e)\nstarts = intervals.map(&:first).sort\nends = intervals.map(&:last).sort\nlive = j = 0\nstarts.each do |s|\n  if s >= ends[j]      # one ended before s: reuse it\n    j += 1\n  else\n    live += 1\n  end\nend\n"}, "pitfalls": ["Extend with `max(last_end, e)`. Plain `= e` shrinks [1, 10] when [2, 3] comes next.", "Touching endpoints: decide `<=` vs `<` from the problem. Merge Intervals joins [1, 4] and [4, 5]; meetings are half-open, so one can start the minute another ends.", "Sort by start to merge. Sort by end for \"max non-overlapping / fewest removals\" (greedy activity selection).", "Append a copy (`[s, e]`), not the input interval itself. Editing it later changes the caller's data.", "Concurrency is a sweep line: +1 at each start, −1 at each end, ends first on ties for half-open. A min-heap of end times gives the same count and also tells you which room frees up."], "problems": [{"id": "merge-overlapping", "title": "Merge Intervals", "difficulty": "Medium", "variant": "canonical", "statement": "Merge all overlapping intervals in `intervals` (each `[start, end]`) and return the result sorted by start. Intervals that touch (`[1, 4]`, `[4, 5]`) overlap. Input may be unsorted.", "example": "intervals = [[1, 3], [2, 6], [8, 10], [15, 18]]  →  [[1, 6], [8, 10], [15, 18]]", "hint": "After sorting by start, can an interval overlap anything other than the last one you kept?", "insight": "Sorting means only the last merged interval can overlap the next one — compare against it, extend or append.", "complexity": "O(n log n) time · O(n) space (output)", "fn": "merge", "tests": [{"args": [[[1, 3], [2, 6], [8, 10], [15, 18]]], "out": [[1, 6], [8, 10], [15, 18]], "note": "example"}, {"args": [[[1, 4], [4, 5]]], "out": [[1, 5]], "note": "touching endpoints merge"}, {"args": [[[1, 4], [0, 4]]], "out": [[0, 4]], "note": "unsorted input"}, {"args": [[[1, 10], [2, 3], [4, 5]]], "out": [[1, 10]], "note": "contained: keep the max end"}, {"args": [[[5, 7]]], "out": [[5, 7]], "note": "single interval"}, {"args": [[[1, 4], [0, 0]]], "out": [[0, 0], [1, 4]], "note": "point interval, no overlap"}], "solution": {"python": "def merge(intervals):\n    merged = []\n    for s, e in sorted(intervals):\n        if merged and s <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], e)\n        else:\n            merged.append([s, e])\n    return merged\n", "ruby": "def merge(intervals)\n  merged = []\n  intervals.sort.each do |s, e|\n    if !merged.empty? && s <= merged[-1][1]\n      merged[-1][1] = [merged[-1][1], e].max\n    else\n      merged << [s, e]\n    end\n  end\n  merged\nend\n"}, "nodes": []}, {"id": "meeting-rooms-ii", "title": "Meeting Rooms II", "difficulty": "Medium", "variant": "count overlaps, don't merge", "statement": "Each meeting is `[start, end)`. Return the minimum number of rooms so that no two overlapping meetings share one. A meeting may start the moment another ends.", "example": "intervals = [[0, 30], [5, 10], [15, 20]]  →  2", "hint": "Rooms needed = meetings started − meetings ended. When a meeting starts, which end time do you compare it with?", "insight": "Which meeting is which doesn't matter — only counts do. Sort starts and ends separately; a start at or after the earliest unfinished end reuses that room.", "complexity": "O(n log n) time · O(n) space", "fn": "min_meeting_rooms", "tests": [{"args": [[[0, 30], [5, 10], [15, 20]]], "out": 2, "note": "example"}, {"args": [[[7, 10], [2, 4]]], "out": 1, "note": "no overlap, unsorted"}, {"args": [[[1, 5], [5, 10]]], "out": 1, "note": "back to back: half-open"}, {"args": [[[1, 10], [2, 9], [3, 8], [4, 7]]], "out": 4, "note": "fully nested"}, {"args": [[[1, 3], [2, 4], [3, 5]]], "out": 2, "note": "chain: room from [1, 3) is reused"}, {"args": [[]], "out": 0, "note": "no meetings"}], "solution": {"python": "def min_meeting_rooms(intervals):\n    starts = sorted(s for s, _ in intervals)\n    ends = sorted(e for _, e in intervals)\n    rooms = j = 0\n    for s in starts:\n        if s >= ends[j]:        # earliest-ending meeting is over: reuse its room\n            j += 1\n        else:\n            rooms += 1\n    return rooms\n", "ruby": "def min_meeting_rooms(intervals)\n  starts = intervals.map(&:first).sort\n  ends = intervals.map(&:last).sort\n  rooms = j = 0\n  starts.each do |s|\n    if s >= ends[j]       # earliest-ending meeting is over: reuse its room\n      j += 1\n    else\n      rooms += 1\n    end\n  end\n  rooms\nend\n"}, "nodes": []}]}, {"id": "binary-search", "name": "Binary Search", "signal": ["sorted or rotated array", "O(log n) required", "minimum / maximum x such that…", "huge answer range + a yes/no check"], "idea": "Keep a range [lo, hi] that must contain the answer and halve it with one check per step. Anything monotonic works: a sorted array, or a yes/no check over the answer space (\"can she finish at speed x?\" is ✗…✗ ✓…✓) — find the first ✓. O(log n) checks instead of n.", "diagram": {"caption": "first ✓   ·   ✗ → L = M+1   ·   ✓ → R = M", "frames": [{"values": ["✗", "✗", "✗", "✗", "✓", "✓", "✓", "✓"], "marks": {"L": 0, "M": 3, "R": 7}, "window": [0, 7], "note": "check(3) ✗ → L = 4"}, {"values": ["✗", "✗", "✗", "✗", "✓", "✓", "✓", "✓"], "marks": {"L": 4, "M": 5, "R": 7}, "window": [4, 7], "note": "check(5) ✓ → R = 5 (keep M)"}, {"values": ["✗", "✗", "✗", "✗", "✓", "✓", "✓", "✓"], "marks": {"L R": 4}, "hit": [4], "note": "… check(4) ✓ → R = 4 = L → first ✓"}]}, "template": {"python": "# first x in [lo, hi] where ok(x) — ok is ✗…✗ ✓…✓\nlo, hi = LOW, HIGH         # hi must be a valid answer\nwhile lo < hi:\n    mid = (lo + hi) // 2\n    if ok(mid):\n        hi = mid           # mid may be the answer: keep it\n    else:\n        lo = mid + 1\nreturn lo\n", "ruby": "# first x in [lo, hi] where ok(x) — ok is ✗…✗ ✓…✓\nlo, hi = LOW, HIGH         # hi must be a valid answer\nwhile lo < hi\n  mid = (lo + hi) / 2\n  ok(mid) ? hi = mid : lo = mid + 1\nend\nlo\n# or: (LOW..HIGH).bsearch { |x| ok(x) }\n"}, "pitfalls": ["Pick one loop shape and keep it. `lo < hi` + `hi = mid` finds the first ✓; `lo <= hi` + `hi = mid − 1` finds an exact match. Mixing `lo <= hi` with `hi = mid` loops forever.", "`mid` rounds down, so a search for the *last* ✓ (`lo = mid`) needs `mid = (lo + hi + 1) // 2` or it stalls at two elements.", "Search on the answer: when the input isn't sorted but the answer is (speed, capacity, days), binary-search the answer range with a feasibility check → O(n log range).", "Rotated array — one side of `mid` is always sorted; check if the target falls in that side's range. Duplicates break this (`nums[lo] == nums[mid]` tells you nothing → worst case O(n)).", "Built-ins: Python `bisect_left` / `bisect_right`; Ruby `bsearch` (block returns true/false → first true). `lo + hi` can't overflow in Python/Ruby, but write `lo + (hi − lo) / 2` in Java/C++."], "problems": [{"id": "search-rotated", "title": "Search in Rotated Sorted Array", "difficulty": "Medium", "variant": "one half is always sorted", "statement": "A sorted array of distinct integers was rotated at an unknown pivot (e.g. `[0, 1, 2, 4, 5, 6, 7]` → `[4, 5, 6, 7, 0, 1, 2]`). Return the index of `target`, or -1. O(log n) time.", "example": "nums = [4, 5, 6, 7, 0, 1, 2], target = 0  →  4", "hint": "Split at `mid`. At least one half is in sorted order — can you tell whether `target` is inside it?", "insight": "You never need the pivot. `nums[lo] <= nums[mid]` says which half is sorted, and a range check on that half decides where to go.", "complexity": "O(log n) time · O(1) space", "fn": "search", "tests": [{"args": [[4, 5, 6, 7, 0, 1, 2], 0], "out": 4, "note": "example: target right of the pivot"}, {"args": [[4, 5, 6, 7, 0, 1, 2], 3], "out": -1, "note": "missing"}, {"args": [[1, 2, 3, 4, 5], 4], "out": 3, "note": "not rotated"}, {"args": [[5, 1, 3], 5], "out": 0, "note": "target at lo"}, {"args": [[3, 1], 1], "out": 1, "note": "n = 2: lo == mid"}, {"args": [[1], 0], "out": -1, "note": "single, missing"}], "solution": {"python": "def search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:                # left half sorted\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                                    # right half sorted\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1\n", "ruby": "def search(nums, target)\n  lo, hi = 0, nums.length - 1\n  while lo <= hi\n    mid = (lo + hi) / 2\n    return mid if nums[mid] == target\n    if nums[lo] <= nums[mid]                         # left half sorted\n      if nums[lo] <= target && target < nums[mid]\n        hi = mid - 1\n      else\n        lo = mid + 1\n      end\n    elsif nums[mid] < target && target <= nums[hi]   # right half sorted, target in it\n      lo = mid + 1\n    else\n      hi = mid - 1\n    end\n  end\n  -1\nend\n"}, "nodes": []}, {"id": "koko-bananas", "title": "Koko Eating Bananas", "difficulty": "Medium", "variant": "search on the answer", "statement": "`piles[i]` bananas per pile. Koko picks one speed `k` (bananas/hour). Each hour she eats up to `k` from one pile; if it has fewer, she finishes it and waits out the hour. Return the minimum integer `k` that finishes everything within `h` hours (`h ≥ len(piles)`).", "example": "piles = [3, 6, 7, 11], h = 8  →  4", "hint": "You're not searching the array. If speed k is fast enough, is k + 1?", "insight": "Feasibility is monotonic in k, so binary-search k over [1, max(piles)] with an O(n) check — O(n log max) instead of trying every speed.", "complexity": "O(n log max(piles)) time · O(1) space", "fn": "min_eating_speed", "tests": [{"args": [[3, 6, 7, 11], 8], "out": 4, "note": "example"}, {"args": [[30, 11, 23, 4, 20], 5], "out": 30, "note": "h = n: speed = max pile"}, {"args": [[30, 11, 23, 4, 20], 6], "out": 23, "note": "one spare hour"}, {"args": [[5, 5], 100], "out": 1, "note": "lots of time: lower bound 1"}, {"args": [[1000000000], 2], "out": 500000000, "note": "huge pile: needs log search"}, {"args": [[312884470], 312884469], "out": 2, "note": "ceil division matters"}], "solution": {"python": "def min_eating_speed(piles, h):\n    lo, hi = 1, max(piles)                  # speed max(piles) always works\n    while lo < hi:\n        k = (lo + hi) // 2\n        if sum((p + k - 1) // k for p in piles) <= h:   # ceil(p / k) hours per pile\n            hi = k\n        else:\n            lo = k + 1\n    return lo\n", "ruby": "def min_eating_speed(piles, h)\n  # bsearch returns the first k whose block is true\n  (1..piles.max).bsearch { |k| piles.sum { |p| (p + k - 1) / k } <= h }   # ceil(p / k) hours per pile\nend\n"}, "nodes": []}]}, {"id": "bfs", "name": "BFS", "signal": ["fewest steps / shortest path (unweighted)", "level order / by depth", "spreads every minute (rot, fire, infection)", "grid or graph neighbours"], "idea": "Process nodes in waves from a queue: everything at distance d leaves before anything at d + 1, so the first visit to a node is by a shortest path (equal edge costs only). Mark visited when you enqueue, snapshot `len(queue)` to handle one level per round, and seed every source at once for multi-source spreads. O(V + E) time and space.", "diagram": {"type": "grid", "caption": "one ring per round · first visit = shortest", "frames": [{"rows": [["", "", "", 1, "", "", ""], ["", "", 1, 0, 1, "", ""], ["", "", "", 1, "", "", ""]], "win": [[1, 3]], "hit": [[0, 3], [1, 2], [1, 4], [2, 3]], "note": "round 1: the source's 4 neighbours"}, {"rows": [["", "", 2, 1, 2, "", ""], ["", 2, 1, 0, 1, 2, ""], ["", "", 2, 1, 2, "", ""]], "win": [[0, 3], [1, 2], [1, 3], [1, 4], [2, 3]], "hit": [[0, 2], [0, 4], [1, 1], [1, 5], [2, 2], [2, 4]], "note": "round 2: only unvisited cells are enqueued"}, {"rows": [[4, 3, 2, 1, 2, 3, 4], [3, 2, 1, 0, 1, 2, 3], [4, 3, 2, 1, 2, 3, 4]], "win": "all", "hit": [[0, 0], [0, 6], [2, 0], [2, 6]], "note": "every cell: number = round = distance"}]}, "template": {"python": "from collections import deque\n\nq = deque(sources)\nseen = set(sources)\nsteps = 0\nwhile q:\n    for _ in range(len(q)):     # one level\n        node = q.popleft()\n        if is_goal(node):\n            return steps\n        for nxt in neighbors(node):\n            if nxt not in seen:\n                seen.add(nxt)   # mark on enqueue\n                q.append(nxt)\n    steps += 1\n", "ruby": "q = sources.dup\nseen = Set.new(sources)         # require 'set' before Ruby 3.2\nsteps = 0\nuntil q.empty?\n  q.size.times do               # one level\n    node = q.shift\n    return steps if goal?(node)\n    neighbors(node).each do |nxt|\n      next if seen.include?(nxt)\n      seen << nxt               # mark on enqueue\n      q << nxt\n    end\n  end\n  steps += 1\nend\n"}, "pitfalls": ["Mark visited on enqueue, not on pop. Otherwise a node can be queued once per neighbour, and spread counts come out wrong.", "Python: `deque.popleft()`; `list.pop(0)` is O(n). Ruby: `Array#shift` is amortized O(1) in CRuby, so a plain array works as a queue.", "Shortest path only when every edge costs the same. 0/1 weights → 0-1 BFS (deque, push 0-edges to the front); general weights → Dijkstra.", "Multi-source: enqueue every source at step 0. It's BFS from a virtual super-source, so each distance is to the nearest source.", "Grids: bounds-check before indexing. Ruby wraps negative indices silently: `grid[-1]` is the last row, not an error."], "problems": [{"id": "level-order", "title": "Binary Tree Level Order Traversal", "difficulty": "Medium", "variant": "canonical", "statement": "Return the values of a binary tree level by level, left to right.", "example": "root = [3, 9, 20, null, null, 15, 7]  →  [[3], [9, 20], [15, 7]]", "hint": "A queue already yields nodes in level order — how do you know where one level ends?", "insight": "Snapshot the queue length at the start of each round; exactly that many pops form the current level.", "complexity": "O(n) time · O(w) space (w = widest level)", "fn": "level_order", "tests": [{"args": [{"tree": [3, 9, 20, null, null, 15, 7]}], "out": [[3], [9, 20], [15, 7]], "note": "example"}, {"args": [{"tree": [1, 2, 3, 4, 5, 6, 7]}], "out": [[1], [2, 3], [4, 5, 6, 7]], "note": "full tree"}, {"args": [{"tree": [1, 2, null, 3, null, 4]}], "out": [[1], [2], [3], [4]], "note": "left chain"}, {"args": [{"tree": [1]}], "out": [[1]], "note": "single node"}, {"args": [{"tree": []}], "out": [], "note": "empty tree"}], "solution": {"python": "from collections import deque\n\ndef level_order(root):\n    if not root:\n        return []\n    res, q = [], deque([root])\n    while q:\n        level = []\n        for _ in range(len(q)):\n            node = q.popleft()\n            level.append(node.val)\n            for child in (node.left, node.right):\n                if child:\n                    q.append(child)\n        res.append(level)\n    return res\n", "ruby": "def level_order(root)\n  return [] unless root\n  res, q = [], [root]\n  until q.empty?\n    level = q.size.times.map do\n      node = q.shift\n      q.push(*[node.left, node.right].compact)\n      node.val\n    end\n    res << level\n  end\n  res\nend\n"}, "nodes": ["tree"]}, {"id": "rotting-oranges", "title": "Rotting Oranges", "difficulty": "Medium", "variant": "multi-source grid", "statement": "Grid cells: 0 empty, 1 fresh orange, 2 rotten. Each minute, every fresh orange 4-directionally next to a rotten one rots. Return the minutes until no fresh orange is left, or -1 if that never happens.", "example": "grid = [[2, 1, 1], [1, 1, 0], [0, 1, 1]]  →  4", "hint": "All rotten oranges spread at the same time. What's in the queue at minute 0?", "insight": "Seed the queue with every rotten orange — one BFS level is one minute. Count fresh oranges up front, so the -1 check is a single comparison.", "complexity": "O(rows · cols) time and space", "fn": "oranges_rotting", "tests": [{"args": [[[2, 1, 1], [1, 1, 0], [0, 1, 1]]], "out": 4, "note": "example"}, {"args": [[[2, 1, 1], [0, 1, 1], [1, 0, 1]]], "out": -1, "note": "unreachable fresh orange"}, {"args": [[[2, 1, 1], [1, 1, 1], [0, 1, 2]]], "out": 2, "note": "two sources spread together"}, {"args": [[[0, 2]]], "out": 0, "note": "nothing fresh: 0, not 1"}, {"args": [[[1]]], "out": -1, "note": "fresh but no rotten"}, {"args": [[[0]]], "out": 0, "note": "empty cell only"}], "solution": {"python": "from collections import deque\n\ndef oranges_rotting(grid):\n    rows, cols = len(grid), len(grid[0])\n    q = deque((r, c) for r in range(rows) for c in range(cols) if grid[r][c] == 2)\n    fresh = sum(row.count(1) for row in grid)\n    minutes = 0\n    while q and fresh:\n        for _ in range(len(q)):\n            r, c = q.popleft()\n            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):\n                if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1:\n                    grid[nr][nc] = 2        # rotting marks it visited\n                    fresh -= 1\n                    q.append((nr, nc))\n        minutes += 1\n    return -1 if fresh else minutes\n", "ruby": "def oranges_rotting(grid)\n  rows, cols = grid.size, grid[0].size\n  q = []\n  grid.each_with_index { |row, r| row.each_with_index { |v, c| q << [r, c] if v == 2 } }\n  fresh = grid.sum { |row| row.count(1) }\n  minutes = 0\n  until q.empty? || fresh.zero?\n    q.size.times do\n      r, c = q.shift\n      [[r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]].each do |nr, nc|\n        next unless nr.between?(0, rows - 1) && nc.between?(0, cols - 1) && grid[nr][nc] == 1\n        grid[nr][nc] = 2        # rotting marks it visited\n        fresh -= 1\n        q << [nr, nc]\n      end\n    end\n    minutes += 1\n  end\n  fresh.zero? ? minutes : -1\nend\n"}, "nodes": []}]}, {"id": "backtracking", "name": "Backtracking", "signal": ["all subsets / permutations / combinations", "generate every valid …", "small n (≤ ~20)", "constraint puzzles (N-Queens, Sudoku)"], "idea": "DFS over a tree of partial choices — choose, recurse, un-choose — so one `path` list serves every branch. A `start` index yields combinations instead of permutations, and pruning (sorted input, running sum past target) cuts whole subtrees before entering them. Cost is the size of that tree: exponential, usually bounded by the output size.", "diagram": {"type": "tree", "caption": "choose → recurse → un-choose", "frames": [{"tree": {"v": "[]", "hit": true, "c": [{"v": "[1]", "e": "+1", "hit": true, "c": [{"v": "[1,2]", "e": "+2", "c": [{"v": "[1,2,3]", "e": "+3"}]}, {"v": "[1,3]", "e": "+3", "hit": true}]}, {"v": "[2]", "e": "+2", "c": [{"v": "[2,3]", "e": "+3"}]}, {"v": "[3]", "e": "+3"}]}, "note": "at [1,3]: record, pop 3, pop 1, then try 2"}]}, "template": {"python": "res, path = [], []\n\ndef dfs(start):\n    res.append(path[:])         # record a copy (or only at leaves)\n    for i in range(start, len(a)):\n        if prune(i):\n            continue            # or break if sorted\n        path.append(a[i])       # choose\n        dfs(i + 1)              # i + 1: each item once · i: reuse\n        path.pop()              # un-choose\n\ndfs(0)\n", "ruby": "res, path = [], []\ndfs = lambda do |start|\n  res << path.dup               # record a copy (or only at leaves)\n  (start...a.size).each do |i|\n    next if prune(i)            # or break if sorted\n    path << a[i]                # choose\n    dfs.(i + 1)                 # i + 1: each item once · i: reuse\n    path.pop                    # un-choose\n  end\nend\ndfs.(0)\n"}, "pitfalls": ["Record a copy (`path[:]` / `path.dup`). Appending `path` itself stores the same list n times, and it ends up empty.", "The child's start index sets the shape: `i + 1` → each item at most once (subsets, combinations); `i` → unlimited reuse; no start index plus a `used` set → permutations.", "Duplicate inputs: sort, then skip equal siblings with `i > start and a[i] == a[i - 1]`. Equal values along one path are fine.", "Prune before recursing. With sorted candidates, `break` once `a[i] > remaining`, because every later one is bigger.", "Ruby: a nested `def` can't see outer locals, so use a lambda (`dfs = ->(i) { … }`, call `dfs.(i)`) or pass state as arguments. Python: rebinding an outer variable needs `nonlocal`; mutating a list doesn't."], "problems": [{"id": "subsets", "title": "Subsets", "difficulty": "Medium", "variant": "canonical", "statement": "Return all subsets (the power set) of `nums`, whose values are distinct. Any order; no duplicate subsets.", "example": "nums = [1, 2, 3]  →  [[], [1], [1, 2], [1, 2, 3], [1, 3], [2], [2, 3], [3]]", "hint": "Every node of the recursion tree is a subset. When do you record?", "insight": "Record at every node, not just leaves, and only move forward from `start` — each of the 2ⁿ subsets is produced exactly once.", "complexity": "O(n · 2ⁿ) time · O(n) recursion depth (excluding output)", "fn": "subsets", "compare": "unordered", "tests": [{"args": [[1, 2, 3]], "out": [[], [1], [2], [3], [1, 2], [1, 3], [2, 3], [1, 2, 3]], "note": "example"}, {"args": [[0]], "out": [[], [0]], "note": "single element"}, {"args": [[]], "out": [[]], "note": "empty input: one empty subset"}, {"args": [[4, 1]], "out": [[], [4], [1], [1, 4]], "note": "unsorted input"}], "solution": {"python": "def subsets(nums):\n    res, path = [], []\n\n    def dfs(start):\n        res.append(path[:])\n        for i in range(start, len(nums)):\n            path.append(nums[i])\n            dfs(i + 1)\n            path.pop()\n\n    dfs(0)\n    return res\n", "ruby": "def subsets(nums)\n  res, path = [], []\n  dfs = lambda do |start|\n    res << path.dup\n    (start...nums.size).each do |i|\n      path << nums[i]\n      dfs.(i + 1)\n      path.pop\n    end\n  end\n  dfs.(0)\n  res\nend\n"}, "nodes": []}, {"id": "combination-sum", "title": "Combination Sum", "difficulty": "Medium", "variant": "unlimited reuse + pruning", "statement": "Return all unique combinations of `candidates` (distinct positive integers) that sum to `target`. A candidate may be used any number of times. Combinations are unique as multisets; any order.", "example": "candidates = [2, 3, 6, 7], target = 7  →  [[2, 2, 3], [7]]", "hint": "Same tree as Subsets, two changes: which index does the child start from, and when can you abandon a whole branch?", "insight": "Recursing with `i` (not `i + 1`) allows reuse but never goes backward, so [2, 3] and [3, 2] can't both appear. Sorting turns the over-target check into a `break`.", "complexity": "O(n^(T/m)) time (T = target, m = smallest candidate) · O(T/m) depth", "fn": "combination_sum", "compare": "unordered", "tests": [{"args": [[2, 3, 6, 7], 7], "out": [[2, 2, 3], [7]], "note": "example"}, {"args": [[2, 3, 5], 8], "out": [[2, 2, 2, 2], [2, 3, 3], [3, 5]], "note": "several answers"}, {"args": [[8, 4, 2], 8], "out": [[8], [4, 4], [2, 2, 4], [2, 2, 2, 2]], "note": "unsorted input"}, {"args": [[1], 2], "out": [[1, 1]], "note": "reuse the same element"}, {"args": [[2], 1], "out": [], "note": "impossible"}], "solution": {"python": "def combination_sum(candidates, target):\n    candidates = sorted(candidates)\n    res, path = [], []\n\n    def dfs(start, remaining):\n        if remaining == 0:\n            res.append(path[:])\n            return\n        for i in range(start, len(candidates)):\n            if candidates[i] > remaining:\n                break                       # sorted: the rest are bigger too\n            path.append(candidates[i])\n            dfs(i, remaining - candidates[i])   # i, not i + 1: reuse allowed\n            path.pop()\n\n    dfs(0, target)\n    return res\n", "ruby": "def combination_sum(candidates, target)\n  candidates = candidates.sort\n  res, path = [], []\n  dfs = lambda do |start, remaining|\n    return res << path.dup if remaining.zero?\n    (start...candidates.size).each do |i|\n      break if candidates[i] > remaining      # sorted: the rest are bigger too\n      path << candidates[i]\n      dfs.(i, remaining - candidates[i])      # i, not i + 1: reuse allowed\n      path.pop\n    end\n  end\n  dfs.(0, target)\n  res\nend\n"}, "nodes": []}]}, {"id": "tree-recursion", "name": "Tree Recursion", "signal": ["max depth / height", "path sums", "diameter / longest path", "balanced? same tree? subtree?", "lowest common ancestor"], "idea": "Each call answers for its subtree from its children's answers. Return what the parent needs (height, sum, found?), and keep anything that isn't one upward branch — like a path bending through this node — in an outer variable. Every node is visited once: O(n) time, O(h) stack (h = n when skewed).", "diagram": {"type": "tree", "caption": "return height · record L + R on the side", "frames": [{"tree": {"v": 1, "b": 3, "hit": true, "c": [{"v": 2, "b": 2, "hit": true, "c": [{"v": 4, "b": 1, "hit": true}, {"v": 5, "b": 1}]}, {"v": 3, "b": 1, "hit": true}]}, "note": "badge = height returned · best L + R = 3 at node 1"}]}, "template": {"python": "def solve(root):\n    best = 0\n\n    def dfs(node):\n        nonlocal best\n        if not node:\n            return 0                        # empty subtree\n        left, right = dfs(node.left), dfs(node.right)\n        best = max(best, combine(left, right))   # answer bending here\n        return 1 + max(left, right)         # what the parent needs\n\n    dfs(root)\n    return best\n", "ruby": "def solve(root)\n  best = 0\n  dfs = lambda do |node|\n    return 0 unless node                    # empty subtree\n    left, right = dfs.(node.left), dfs.(node.right)\n    best = [best, combine(left, right)].max # answer bending here\n    1 + [left, right].max                   # what the parent needs\n  end\n  dfs.(root)\n  best\nend\n"}, "pitfalls": ["Separate what you return from what you record. The return value must extend upward (one branch); anything that uses both children goes into `best`.", "Base case `None → 0` counts nodes. If the problem counts edges, the answer is often nodes − 1. Check with a 1-node tree.", "Python's default recursion limit is ~1000, so a skewed tree of 10⁴ nodes crashes. Raise it with `sys.setrecursionlimit` or use an explicit stack. Ruby allows ~10k frames by default.", "Top-down (pass bounds or depth as arguments) vs bottom-up (return values). Validating a BST needs bounds passed down; height and diameter need values returned.", "Don't recompute heights inside a recursive check: `is_balanced` calling `height` at each node is O(n²). Return the height plus a sentinel (−1 = unbalanced) in one pass."], "problems": [{"id": "max-depth", "title": "Maximum Depth of Binary Tree", "difficulty": "Easy", "variant": "canonical", "statement": "Return the maximum depth of a binary tree: the number of nodes on the longest root-to-leaf path.", "example": "root = [3, 9, 20, null, null, 15, 7]  →  3", "hint": "If you knew the depth of both subtrees, what's the depth of this one?", "insight": "A node's answer is 1 + its better child — the return value is the whole solution, no outer state.", "complexity": "O(n) time · O(h) space", "fn": "max_depth", "tests": [{"args": [{"tree": [3, 9, 20, null, null, 15, 7]}], "out": 3, "note": "example"}, {"args": [{"tree": [1, null, 2]}], "out": 2, "note": "only a right child"}, {"args": [{"tree": [1, 2, null, 3, null, 4]}], "out": 4, "note": "skewed: depth = n"}, {"args": [{"tree": [1]}], "out": 1, "note": "single node"}, {"args": [{"tree": []}], "out": 0, "note": "empty tree"}], "solution": {"python": "def max_depth(root):\n    if not root:\n        return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))\n", "ruby": "def max_depth(root)\n  return 0 unless root\n  1 + [max_depth(root.left), max_depth(root.right)].max\nend\n"}, "nodes": ["tree"]}, {"id": "diameter", "title": "Diameter of Binary Tree", "difficulty": "Easy", "variant": "answer ≠ return value", "statement": "Return the diameter of a binary tree: the number of edges on the longest path between any two nodes. The path need not pass through the root.", "example": "root = [1, 2, 3, 4, 5]  →  3   (4 → 2 → 1 → 3)", "hint": "The longest path bends at some node. In terms of that node's subtree heights, how long is it?", "insight": "Return height (one branch, for the parent) but record `left + right` (both branches) on the side. Mixing the two up is the whole bug surface.", "complexity": "O(n) time · O(h) space", "fn": "diameter_of_binary_tree", "tests": [{"args": [{"tree": [1, 2, 3, 4, 5]}], "out": 3, "note": "example"}, {"args": [{"tree": [1, 2, null, 3, 4, 5, null, null, 6]}], "out": 4, "note": "best path skips the root"}, {"args": [{"tree": [1, 2, null, 3]}], "out": 2, "note": "skewed: one-sided path"}, {"args": [{"tree": [1, 2]}], "out": 1, "note": "two nodes"}, {"args": [{"tree": [1]}], "out": 0, "note": "single node: 0 edges"}], "solution": {"python": "def diameter_of_binary_tree(root):\n    best = 0\n\n    def height(node):\n        nonlocal best\n        if not node:\n            return 0\n        l, r = height(node.left), height(node.right)\n        best = max(best, l + r)     # longest path bending here, in edges\n        return 1 + max(l, r)\n\n    height(root)\n    return best\n", "ruby": "def diameter_of_binary_tree(root)\n  best = 0\n  height = lambda do |node|\n    return 0 unless node\n    l, r = height.(node.left), height.(node.right)\n    best = [best, l + r].max      # longest path bending here, in edges\n    1 + [l, r].max\n  end\n  height.(root)\n  best\nend\n"}, "nodes": ["tree"]}]}, {"id": "heap", "name": "Heap / Top-K", "signal": ["k largest / smallest / most frequent", "k-th largest", "merge k sorted", "running median; next task by earliest time"], "idea": "A heap gives the min in O(1) and push / pop in O(log n). For top-k, keep a size-k min-heap of the best so far: its root is the k-th best, and anything worse is rejected in O(1). For k-way merges, the heap holds one candidate per source. O(n log k) instead of O(n log n) for a full sort.", "helper": {"python": "# nothing to provide: heapq is built in (min-heap on a list)\n", "ruby": "# Ruby has no heap in core. Min-heap on <=>; push [-x, …] for a max-heap.\nclass MinHeap\n  def initialize\n    @a = []\n  end\n\n  def size = @a.size\n  def empty? = @a.empty?\n  def peek = @a[0]\n\n  def push(x)\n    @a << x\n    i = @a.size - 1\n    while i > 0 && (@a[(i - 1) / 2] <=> @a[i]) > 0     # sift up\n      up = (i - 1) / 2\n      @a[up], @a[i] = @a[i], @a[up]\n      i = up\n    end\n    self\n  end\n\n  def pop\n    top = @a[0]\n    last = @a.pop\n    return top if @a.empty?\n    @a[0] = last\n    i = 0\n    loop do                                           # sift down\n      l, r, m = 2 * i + 1, 2 * i + 2, i\n      m = l if l < @a.size && (@a[l] <=> @a[m]) < 0\n      m = r if r < @a.size && (@a[r] <=> @a[m]) < 0\n      break if m == i\n      @a[m], @a[i] = @a[i], @a[m]\n      i = m\n    end\n    top\n  end\nend\n"}, "diagram": {"type": "tree", "caption": "size-k min-heap · root = k-th largest", "frames": [{"tree": {"v": 1, "mark": "top", "c": [{"v": 3}, {"v": 2}]}, "note": "k = 3 after [3, 2, 1] · 5 > top → pop 1, push 5"}, {"tree": {"v": 4, "hit": true, "mark": "k-th", "c": [{"v": 5}, {"v": 6}]}, "note": "after 5, 6, 4: root 4 = 3rd largest"}]}, "template": {"python": "import heapq\n\nheap = []\nfor x in stream:\n    if len(heap) < k:\n        heapq.heappush(heap, x)\n    elif x > heap[0]:               # beats the weakest of the top k\n        heapq.heapreplace(heap, x)  # pop + push, one sift\n# heap[0] is the k-th largest\n\n# k-way merge: (value, source, index) — index breaks ties\nheap = [(s[0], i, 0) for i, s in enumerate(sources) if s]\nheapq.heapify(heap)\nwhile heap:\n    x, i, j = heapq.heappop(heap)\n    out.append(x)\n    if j + 1 < len(sources[i]):\n        heapq.heappush(heap, (sources[i][j + 1], i, j + 1))\n", "ruby": "heap = MinHeap.new                  # see Provided\nstream.each do |x|\n  if heap.size < k\n    heap.push(x)\n  elsif x > heap.peek               # beats the weakest of the top k\n    heap.pop\n    heap.push(x)\n  end\nend\n# heap.peek is the k-th largest\n\n# k-way merge: [value, source, index] — index breaks ties\nheap = MinHeap.new\nsources.each_with_index { |s, i| heap.push([s[0], i, 0]) unless s.empty? }\nuntil heap.empty?\n  x, i, j = heap.pop\n  out << x\n  heap.push([sources[i][j + 1], i, j + 1]) if j + 1 < sources[i].size\nend\n"}, "pitfalls": ["Top-k largest → min-heap of size k (the root is the weakest survivor). A max-heap of all n items is O(n log n), no better than sorting.", "Python's `heapq` is min-only. Push `-x` for a max-heap and `(-count, word)` for most frequent. `heapreplace` = pop then push; `heappushpop` = push then pop.", "Tuples compare field by field. On equal values Python compares the next field, and `ListNode`s raise `TypeError`. Put a unique index second: `(val, i, node)`.", "Ruby has no heap in core and LeetCode has no gems, so know the ~30-line array heap under Provided: parent (i − 1) / 2, children 2i + 1 and 2i + 2, sift up on push, sift down on pop.", "`heapify` is O(n), not O(n log n). If the interviewer pushes, quickselect finds the k-th largest in O(n) average."], "problems": [{"id": "kth-largest", "title": "Kth Largest Element in an Array", "difficulty": "Medium", "variant": "canonical", "statement": "Return the k-th largest element of `nums` (k-th in sorted order, so duplicates count separately). Do better than sorting.", "example": "nums = [3, 2, 1, 5, 6, 4], k = 2  →  5", "hint": "You only need the k largest seen so far. Which of them is in danger of being pushed out?", "insight": "A size-k min-heap holds the top k; its root is the weakest of them — the answer — and each new element is checked against it in O(1).", "complexity": "O(n log k) time · O(k) space", "fn": "find_kth_largest", "tests": [{"args": [[3, 2, 1, 5, 6, 4], 2], "out": 5, "note": "example"}, {"args": [[3, 2, 3, 1, 2, 4, 5, 5, 6], 4], "out": 4, "note": "duplicates count separately"}, {"args": [[7, 6, 5, 4, 3, 2, 1], 7], "out": 1, "note": "k = n: the minimum"}, {"args": [[2, 1], 2], "out": 1, "note": "n = 2"}, {"args": [[-1, -1], 2], "out": -1, "note": "negatives, all equal"}, {"args": [[1], 1], "out": 1, "note": "single element"}], "solution": {"python": "import heapq\n\ndef find_kth_largest(nums, k):\n    heap = nums[:k]\n    heapq.heapify(heap)\n    for x in nums[k:]:\n        if x > heap[0]:\n            heapq.heapreplace(heap, x)\n    return heap[0]\n", "ruby": "def find_kth_largest(nums, k)\n  heap = MinHeap.new\n  nums.each do |x|\n    if heap.size < k\n      heap.push(x)\n    elsif x > heap.peek\n      heap.pop\n      heap.push(x)\n    end\n  end\n  heap.peek\nend\n"}, "nodes": []}, {"id": "merge-k-lists", "title": "Merge k Sorted Lists", "difficulty": "Hard", "variant": "k-way merge", "statement": "`lists` holds k sorted linked lists. Merge them into one sorted list and return its head.", "example": "lists = [[1, 4, 5], [1, 3, 4], [2, 6]]  →  [1, 1, 2, 3, 4, 4, 5, 6]", "hint": "The next output is always one of the k current heads. How do you pick the smallest of k quickly, over and over?", "insight": "The heap holds exactly one node per list — the frontier. Pop the smallest, push its successor; each of the N nodes costs O(log k).", "complexity": "O(N log k) time (N = total nodes) · O(k) space", "fn": "merge_k_lists", "tests": [{"args": [[{"list": [1, 4, 5]}, {"list": [1, 3, 4]}, {"list": [2, 6]}]], "out": {"list": [1, 1, 2, 3, 4, 4, 5, 6]}, "note": "example"}, {"args": [[{"list": [1, 2]}, {"list": [1, 3]}, {"list": []}]], "out": {"list": [1, 1, 2, 3]}, "note": "equal values: needs a tie-breaker"}, {"args": [[{"list": [5]}, {"list": [0]}]], "out": {"list": [0, 5]}, "note": "single-node lists"}, {"args": [[{"list": []}]], "out": {"list": []}, "note": "one empty list"}, {"args": [[]], "out": {"list": []}, "note": "no lists"}], "solution": {"python": "import heapq\n\ndef merge_k_lists(lists):\n    heap = [(node.val, i, node) for i, node in enumerate(lists) if node]   # i breaks ties\n    heapq.heapify(heap)\n    dummy = tail = ListNode()\n    while heap:\n        _, i, node = heapq.heappop(heap)\n        tail.next = node\n        tail = node\n        if node.next:\n            heapq.heappush(heap, (node.next.val, i, node.next))\n    return dummy.next\n", "ruby": "def merge_k_lists(lists)\n  heap = MinHeap.new\n  lists.each_with_index { |node, i| heap.push([node.val, i, node]) if node }   # i breaks ties\n  dummy = tail = ListNode.new\n  until heap.empty?\n    _, i, node = heap.pop\n    tail.next = node\n    tail = node\n    heap.push([node.next.val, i, node.next]) if node.next\n  end\n  dummy.next\nend\n"}, "nodes": ["list"]}]}, {"id": "prefix-sum", "name": "Prefix Sum", "signal": ["range sum queries", "subarray sum = K / divisible by K", "negatives allowed (window fails)", "count subarrays with …"], "idea": "P[i] = sum of the first i elements, so any range sum is one subtraction: sum(i..j) = P[j+1] − P[i]. Build it in O(n), answer queries in O(1). To count subarrays summing to K, scan once with a hash map of prefix sums seen so far: a subarray ending here works iff P − K was seen. Unlike a sliding window, this works with negatives.", "diagram": {"type": "grid", "caption": "sum(i..j) = P[j+1] − P[i]", "frames": [{"rows": [[null, 3, 1, 4, 1, 5], [0, 3, 4, 8, 9, 14]], "labels": ["nums", "P"], "cols": [0, 1, 2, 3, 4, 5], "win": [[0, 2], [0, 3], [0, 4]], "hit": [[1, 1], [1, 4]], "note": "sum(nums[1..3]) = P[4] − P[1] = 9 − 3 = 6"}]}, "template": {"python": "# pre[i] = sum of a[:i]; n + 1 entries, pre[0] = 0\npre = [0]\nfor x in a:\n    pre.append(pre[-1] + x)\nrange_sum = pre[j + 1] - pre[i]       # a[i..j] inclusi
