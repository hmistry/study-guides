        rb: "binding.irb         # or: require \"debug\"; binding.break"

  - id: errors
    name: Errors
    rows:
      - task: Catch, else, always
        py: |-
          log = []

          def parse(s):
              try:
                  n = int(s)
              except ValueError:
                  log.append(f"bad: {s}")
                  return None
              else:
                  return n                # only when nothing was raised
              finally:
                  log.append("done")      # always runs

          parse("7"), parse("x"), log
        py_out: "(7, None, ['done', 'bad: x', 'done'])"
        rb: |-
          def parse(s, log)
            n = Integer(s)
          rescue ArgumentError
            log << "bad: #{s}"
            nil
          else
            n                             # only when nothing was raised
          ensure
            log << "done"                 # always runs; its value is ignored
          end

          log = []
          [parse("7", log), parse("x", log), log]
        rb_out: "[7, nil, [\"done\", \"bad: x\", \"done\"]]"
        rb_note: "A method body (or `do … end` block) can `rescue` directly, without `begin`."
      - task: Raise
        py: |-
          def withdraw(bal, amt):
              if amt > bal:
                  raise ValueError(f"insufficient: {bal} < {amt}")
              return bal - amt

          try:
              withdraw(5, 9)
          except ValueError as e:
              msg = str(e)
          msg
        py_out: "'insufficient: 5 < 9'"
        rb: |-
          def withdraw(bal, amt)
            raise ArgumentError, "insufficient: #{bal} < #{amt}" if amt > bal
            bal - amt
          end

          begin
            withdraw(5, 9)
          rescue ArgumentError => e
            e.message
          end
        rb_out: "\"insufficient: 5 < 9\""
        rb_note: "`raise \"text\"` alone raises a RuntimeError."
      - task: Custom exception
        py: |-
          class AppError(Exception):
              """Base for this app's errors."""

          class NotFound(AppError):
              def __init__(self, key):
                  super().__init__(f"{key!r} not found")
                  self.key = key

          try:
              raise NotFound("user:7")
          except AppError as e:
              caught = (type(e).__name__, str(e), e.key)
          caught
        py_out: |-
          ('NotFound', "'user:7' not found", 'user:7')
        rb: |-
          class AppError < StandardError; end

          class NotFound < AppError
            attr_reader :key

            def initialize(key)
              @key = key
              super("#{key.inspect} not found")
            end
          end

          begin
            raise NotFound, "user:7"
          rescue AppError => e
            [e.class, e.message, e.key]
          end
        rb_out: |-
          [NotFound, "\"user:7\" not found", "user:7"]
        note: "One base class per app or library lets callers catch all of its errors at once."
        rb_note: "Inherit from StandardError, not Exception: a bare `rescue` only catches StandardError."
        trap: rb
      - task: Several types, chain
        py: |-
          def load_num(s):
              try:
                  return int(s)
              except (ValueError, TypeError) as e:
                  raise RuntimeError(f"can't load {s!r}") from e

          try:
              load_num(None)
          except RuntimeError as e:
              out = (str(e), type(e.__cause__).__name__)
          out
        py_out: |-
          ("can't load None", 'TypeError')
        rb: |-
          def load_num(s)
            Integer(s)
          rescue ArgumentError, TypeError
            raise "can't load #{s.inspect}"
          end

          begin
            load_num(nil)
          rescue RuntimeError => e
            [e.message, e.cause.class]
          end
        rb_out: |-
          ["can't load nil", TypeError]
        py_note: "`raise … from e` keeps the original as `__cause__`; plain `raise` inside `except` re-raises."
        rb_note: "Raising inside `rescue` sets `cause` automatically; bare `raise` re-raises."
      - task: Retry
        py: |-
          result = None
          for attempt in range(1, 4):
              try:
                  if attempt < 3:
                      raise ConnectionError("flaky")
                  result = f"ok after {attempt}"
                  break
              except ConnectionError:
                  continue
          result
        py_out: "'ok after 3'"
        rb: |-
          attempts = 0
          begin
            attempts += 1
            raise IOError, "flaky" if attempts < 3
            "ok after #{attempts}"
          rescue IOError
            retry if attempts < 3
            "gave up"
          end
        rb_out: "\"ok after 3\""
        rb_note: "`retry` reruns the `begin` block; always cap the attempts."
      - task: Catch-all
        py: "try:\n    {}[\"k\"]\nexcept Exception as e:\n    name = type(e).__name__\nname"
        py_out: "'KeyError'"
        rb: "begin\n  {}.fetch(\"k\")\nrescue => e          # same as rescue StandardError => e\n  e.class\nend"
        rb_out: "KeyError"
        py_note: "Never a bare `except:`; it also catches Ctrl-C and `sys.exit`."
        rb_note: "Never `rescue Exception`; it also catches interrupts and `exit`."
        trap: true
      - task: Clean up with a block
        py: |-
          import contextlib

          @contextlib.contextmanager
          def tag(name, out):
              out.append(f"<{name}>")
              try:
                  yield
              finally:
                  out.append(f"</{name}>")

          out = []
          with tag("b", out):
              out.append("hi")
          out
        py_out: "['<b>', 'hi', '</b>']"
        rb: |-
          def tag(name, out)
            out << "<#{name}>"
            yield
          ensure
            out << "</#{name}>"
          end

          out = []
          tag("b", out) { out << "hi" }
          out
        rb_out: "[\"<b>\", \"hi\", \"</b>\"]"
        note: "This is how `with open(…)` and `File.open(…) { }` close files even when an error is raised."
      - task: Check inputs
        py: |-
          def mean(xs):
              if not xs:
                  raise ValueError("empty list")
              return sum(xs) / len(xs)

          try:
              mean([])
          except ValueError as e:
              msg = str(e)
          msg
        py_out: "'empty list'"
        rb: "def mean(xs)\n  raise ArgumentError, \"empty list\" if xs.empty?\n  xs.sum.fdiv(xs.size)\nend\n\n(mean([]) rescue $!.message)"
        rb_out: "\"empty list\""
        py_note: "`assert` is for internal invariants only: `python -O` removes it."
        rb_note: "`$!` is the exception being handled; prefer `rescue => e` in real code."
      - task: Error hierarchy
        py: "issubclass(KeyError, LookupError), issubclass(ZeroDivisionError, ArithmeticError), KeyError.__mro__[1].__name__"
        py_out: "(True, True, 'LookupError')"
        rb: "[KeyError.superclass, IndexError.superclass, ZeroDivisionError.superclass]"
        rb_out: "[IndexError, StandardError, StandardError]"
        note: "Catching a parent class also catches its children."

