        rb: "n = 13                     # 0b1101\n[n & 1, n[2], n | (1 << 1), n & ~(1 << 0)]"
        rb_out: "[1, 1, 15, 12]"
        rb_note: "`n[i]` reads bit i directly."
      - task: Count bits
        since: {py: "3.10"}
        py: "bin(13).count(\"1\"), (13).bit_count(), (13).bit_length()"
        py_out: "(3, 3, 4)"
        rb: "[13.to_s(2).count(\"1\"), 13.digits(2).sum, 13.bit_length]"
        rb_out: "[3, 3, 4]"
      - task: Lowest set bit, power of two
        py: "n = 12\nn & -n, n & (n - 1), n > 0 and n & (n - 1) == 0"
        py_out: "(4, 8, False)"
        rb: "n = 12\n[n & -n, n & (n - 1), n.positive? && (n & (n - 1)).zero?]"
        rb_out: "[4, 8, false]"
        note: "`x & -x` isolates the lowest set bit; `x & (x - 1)` clears it, and is 0 exactly for powers of two."
      - task: The number that appears once
        py: "import functools, operator\nfunctools.reduce(operator.xor, [4, 1, 2, 1, 2])"
        py_out: "4"
        rb: "[4, 1, 2, 1, 2].reduce(:^)"
        rb_out: "4"
        note: "Pairs cancel because `a ^ a == 0` and `a ^ 0 == a`."
      - task: Bitmask subsets
        py: "items = [\"a\", \"b\", \"c\"]\n[[items[i] for i in range(3) if mask >> i & 1] for mask in range(1 << 3) if bin(mask).count(\"1\") == 2]"
        py_out: "[['a', 'b'], ['a', 'c'], ['b', 'c']]"
        rb: "items = %w[a b c]\n(0...(1 << 3)).filter_map { |m| (0...3).select { |i| m[i] == 1 }.map { |i| items[i] } if m.to_s(2).count(\"1\") == 2 }"
        rb_out: "[[\"a\", \"b\"], [\"a\", \"c\"], [\"b\", \"c\"]]"
        note: "Each of the 2ⁿ masks picks a subset: bit i set → item i included."
      - task: Negative numbers
