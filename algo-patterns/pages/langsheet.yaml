        rb: "[-1 >> 1, -5.to_s(2), -5 & 0xFF, -5 & 0xFFFFFFFF]"
        rb_out: "[-1, \"-101\", 251, 4294967291]"
        note: "Integers have no fixed width (no overflow, no 32-bit wraparound). Mask with `& 0xFFFFFFFF` to mimic 32-bit code."
