        py_note: "One environment per project. Never `pip install` into the system Python."
      - task: uv
        shell: true
        py: "uv init myapp && cd myapp     # pyproject.toml + .python-version\nuv add requests                # dependency + uv.lock\nuv run main.py                 # runs inside the project's venv\nuv sync                        # install exactly what uv.lock says\nuv python install 3.12\nuv tool install ruff           # global CLI tool, isolated"
        py_note: "uv replaces pip, venv, pip-tools and pyenv with one fast tool; commit `pyproject.toml` and `uv.lock`."
      - task: Ruby versions
