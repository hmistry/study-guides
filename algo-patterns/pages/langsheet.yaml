        rb_note: "Commit `Gemfile` and `Gemfile.lock`. Use `bundle exec` so the locked versions are the ones loaded."
      - task: Gemfile
        run: false
        rb: |-
          source "https://rubygems.org"
          ruby "~> 3.3"

          gem "rack", "~> 3.0"

          group :development, :test do
            gem "rspec"
          end
        rb_note: "`~> 3.0` allows 3.x but not 4.0."
      - task: Install a single tool
        shell: true
        py: "pipx install ruff              # or: uv tool install ruff"
        rb: "gem install rubocop\ngem list rubocop"
      - task: Run, REPL, debug
        shell: true
        py: "python3 script.py arg1\npython3 -i script.py           # run, then stay in the REPL\npython3 -m pdb script.py\npython3 -m http.server 8000    # any stdlib module as a script"
        rb: "ruby script.rb arg1\nirb -r ./script.rb             # REPL with the file loaded\nruby -e 'puts 1 + 1'\nruby -run -e httpd . -p 8000"
      - task: Breakpoint
        run: false
