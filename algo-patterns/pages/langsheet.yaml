        py_out: "([1, 3, 6], [0, 1, 3, 6], [3, 3, 4])"
        rb: "s = 0\n[[1, 2, 3].map { s += _1 }, [1, 2, 3].each_with_object([0]) { |x, acc| acc << acc[-1] + x }, [3, 1, 4].each_with_object([]) { |x, acc| acc << [x, acc.last || x].max }]"
        rb_out: "[[1, 3, 6], [0, 1, 3, 6], [3, 3, 4]]"
