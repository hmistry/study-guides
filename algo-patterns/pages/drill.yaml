# ── Recognition drill: answer + 3 plausible distractors (all ids from catalog).
drill:
  - {prompt: "For each day's temperature, return how many days until a warmer one.", answer: monotonic-stack, distractors: [sliding-window, heap, dp-1d], why: "\"Next warmer\" for every element is next-greater-element — a decreasing stack answers each in O(1) amortized."}
  - {prompt: "Packages must ship in order. Find the minimum ship capacity that delivers them all within D days.", answer: binary-search, distractors: [dp-1d, heap, sliding-window], why: "If capacity C works, any larger C works — a monotonic yes/no, so binary search on the answer."}
  - {prompt: "Count subarrays whose sum equals K. Values can be negative.", answer: prefix-sum, distractors: [sliding-window, two-pointers, dp-1d], why: "Negatives break the window's monotonicity. Count how many earlier prefixes equal P − K."}
  - {prompt: "An array holds n + 1 integers in [1, n]. Find the repeated number without modifying it, in O(1) extra space.", answer: fast-slow, distractors: [two-pointers, heap, union-find], why: "Treat i → nums[i] as a linked list; the duplicate is where the cycle starts (Floyd)."}
  - {prompt: "Given meeting start/end times, return the minimum number of rooms needed.", answer: merge-intervals, distractors: [sliding-window, topo-sort, dp-1d], why: "Sort by start and count overlaps — with a min-heap of end times, or a start/end sweep."}
  - {prompt: "Given prerequisite pairs, return an order to take all courses, or [] if impossible.", answer: topo-sort, distractors: [union-find, backtracking, dp-2d], why: "Dependencies form a directed graph; an order exists iff it has no cycle — Kahn's algorithm finds it."}
  - {prompt: "Return the minimum number of single-character edits to turn word1 into word2.", answer: dp-2d, distractors: [two-pointers, sliding-window, backtracking], why: "Two strings → dp[i][j] = cost for the prefixes, built from insert / delete / replace."}
  - {prompt: "Return the k most frequent words in a list.", answer: heap, distractors: [sliding-window, binary-search, monotonic-stack], why: "Count, then keep a size-k heap — O(n log k) instead of sorting everything."}
  - {prompt: "A grid has fresh and rotten oranges; each minute rot spreads to neighbours. How many minutes until none are fresh?", answer: bfs, distractors: [backtracking, dp-2d, union-find], why: "Multi-source BFS from every rotten orange at once; each BFS level is one minute."}
  - {prompt: "Find every dictionary word that can be traced through adjacent cells of a letter grid.", answer: trie, distractors: [bfs, dp-2d, sliding-window], why: "Put all words in a trie and DFS the grid once — the trie prunes any path that isn't a prefix."}
  - {prompt: "Find the shortest substring of s that contains every character of t.", answer: sliding-window, distractors: [two-pointers, prefix-sum, heap], why: "Contiguous + coverage constraint: grow until valid, then shrink while still valid to minimise."}
  - {prompt: "Accounts list a name and emails. Merge accounts that share any email.", answer: union-find, distractors: [merge-intervals, topo-sort, trie], why: "Emails are nodes; a shared email unions two accounts. The final groups are the components."}
  - {prompt: "Generate every string of n pairs of well-formed parentheses.", answer: backtracking, distractors: [dp-1d, monotonic-stack, bfs], why: "\"Return all\" → build char by char, pruning when closes would exceed opens."}
  - {prompt: "Return the maximum path sum between any two nodes of a binary tree.", answer: tree-recursion, distractors: [dp-1d, bfs, backtracking], why: "Each node returns its best downward path; the global best joins left + node + right."}
  - {prompt: "Count the ways to decode a digit string where 'A' = 1 … 'Z' = 26.", answer: dp-1d, distractors: [backtracking, sliding-window, trie], why: "Only the count is needed and subproblems repeat: ways[i] = ways[i−1] (+ ways[i−2] if a valid pair)."}
  - {prompt: "Check whether a singly linked list is a palindrome using O(1) extra space.", answer: fast-slow, distractors: [monotonic-stack, heap, prefix-sum], why: "Fast/slow finds the middle; reverse the second half and compare."}
