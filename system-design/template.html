<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="__VERSION__">
<title>System Design</title>
<style>
:root {
  /* Ocean: calm deep teal-blue on white (shared with algo-patterns) */
  --bg: #ffffff; --surface: #ffffff;
  --ink: #14262e; --ink-2: #4a5f68; --ink-3: #74878f;
  --rule: #d6e1e5; --code-bg: #f4f8f9; --code-rule: #d6e1e5;
  --accent: #0b6a87; --accent-tint: #e2f2f6; --hit: #dff3e4;
  --easy: #1a7f37;   --easy-bg: #dafbe1;
  --medium: #9a6700; --medium-bg: #fff8c5;
  --hard: #c0303a;   --hard-bg: #fdecea;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --side-w: 232px;
}
[hidden] { display: none !important; }   /* component display rules must never beat [hidden] */
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--sans); }
code, pre { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, textarea { font-family: var(--sans); }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.brand { font-size: 19px; font-weight: 700; letter-spacing: -.015em; color: var(--accent); text-decoration: none; white-space: nowrap; }
.ver { margin-left: -8px; font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
.tprog { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--ink-2); text-decoration: none; }
.tprog:hover { color: var(--accent); }

/* layout */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
.side { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; padding: 20px 12px 24px 20px; }
.side .grp { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 14px 10px 4px; }
.side .grp:first-child { padding-top: 0; }
.side a { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink-2); border-radius: 6px; padding: 5px 10px; font-weight: 550; font-size: 14px; }
.side a .n { font: 12px var(--mono); color: var(--ink-3); min-width: 26px; }
.side a .dot { margin-left: auto; }
.side .soon { display: flex; gap: 8px; padding: 3px 10px; font-size: 13px; color: var(--ink-3); }
.side .soon .n { font: 12px var(--mono); min-width: 26px; }
.side a:hover { background: var(--code-bg); color: var(--ink); }
.side a.active { background: var(--accent-tint); color: var(--accent); }
.side a.active .n { color: var(--accent); }
main { padding: 32px 44px 96px; min-width: 0; }

/* progress meter + small buttons */
.meter { width: 90px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 7px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--ink-3); }
.btn.danger { color: var(--hard); border-color: color-mix(in srgb, var(--hard) 45%, transparent); }
.btn.danger:hover { background: var(--hard-bg); border-color: var(--hard); }
.link { border: 0; background: none; font: 12.5px var(--sans); color: var(--ink-3); cursor: pointer; padding: 2px 4px; }
.link:hover { color: var(--ink); }

/* pager */
.pager { display: flex; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); }
.pbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface);
  border-radius: 8px; padding: 8px 16px; font: 550 14px var(--sans); text-decoration: none; cursor: pointer; }
.pbtn:hover { background: var(--accent-tint); }
.pbtn.fill { background: var(--accent); color: #fff; }
.pbtn.fill:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.pager .next { margin-left: auto; }

/* home */
.hero h1 { margin: 4px 0 8px; font-size: 32px; letter-spacing: -.025em; color: var(--accent); }
.hero .lead { max-width: 70ch; font-size: 16px; }
.hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 32px 0; }
.hcard { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; }
.hcard ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.hcard ol li { margin: 8px 0; }
.hcard a { color: var(--accent); text-decoration: none; font-weight: 550; }
.hcard p { margin: 8px 0 12px; color: var(--ink-2); font-size: 14px; }
.stats { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 6px; }
.stats b { font-size: 28px; letter-spacing: -.02em; }
.stats span { color: var(--ink-2); font-size: 14px; }
.meter.big { width: 100%; height: 8px; border-radius: 4px; }
.rlist { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.rlist li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
.rlist a { color: var(--accent); text-decoration: none; font-weight: 550; }
.empty { color: var(--ink-3); font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 32px; }
.pcard { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; padding: 11px 14px; }
a.pcard:hover { border-color: var(--accent); }
.pcard .n { font: 12px var(--mono); color: var(--accent); }
.pcard .dot { margin-left: auto; }
.pcard.soon { border-style: dashed; color: var(--ink-3); font-weight: 450; }
.pcard.soon .n { color: var(--ink-3); }
.pcard.soon small { margin-left: auto; font-size: 11px; }
.dot { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); transform: translateY(-1px); }
.dot.st-done { background: var(--easy); border-color: var(--easy); }
.dot.st-review { background: var(--medium); border-color: var(--medium); }

/* page head + shared section parts */
.sec { padding-bottom: 8px; }
.p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 20px; }
.p-num { font: 600 14px var(--mono); color: var(--accent); }
.p-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.status { margin-left: auto; display: flex; gap: 6px; }
.st { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-3); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.st:hover { color: var(--ink); }
.st[data-st="done"][aria-pressed="true"] { background: var(--easy-bg); color: var(--easy); border-color: var(--easy); }
.st[data-st="review"][aria-pressed="true"] { background: var(--medium-bg); color: var(--medium); border-color: var(--medium); }
.lbl { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.signal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 28px; }
.signal .lbl { margin-right: 4px; }
.chip { font-size: 13px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); }
.pchip { display: inline-block; font-size: 13px; font-weight: 550; padding: 1px 9px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); text-decoration: none; white-space: nowrap; }
a.pchip:hover { text-decoration: underline; }
.pchip.soon { background: none; border: 1px dashed var(--rule); color: var(--ink-3); font-weight: 450; }
.blk { margin-bottom: 36px; }
.blk > p { margin: 10px 0 0; color: var(--ink-2); max-width: 85ch; }
.blk ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); max-width: 95ch; }
.blk li { margin: 9px 0; padding-left: 2px; }
.blk-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.blk-h .right { margin-left: auto; }
code { font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
b { font-weight: 650; color: var(--ink); }

/* concept: diagram beside key numbers */
.concept { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 24px; margin-bottom: 36px; align-items: start; }
.concept.solo { grid-template-columns: minmax(0, 1fr); }
.nums { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.nums dl { margin: 10px 0 0; display: grid; gap: 12px; }
.nums dt { font-size: 12.5px; color: var(--ink-3); }
.nums dd { margin: 0; font: 13px var(--mono); color: var(--ink); }
.concept.solo .nums dl { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 20px; }

/* arch diagram: frame tabs over one drawing */
.arch { margin: 0; border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px 16px; min-width: 0; }
.fr-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.fr-tabs button { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; }
.fr-tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.svgwrap { overflow-x: auto; }
.svgwrap svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.fr-note { margin: 14px 0 0; font-size: 13.5px; color: var(--ink-2); min-height: 2.6em; }
.arch figcaption { font: 12px var(--mono); color: var(--ink-3); margin-top: 6px; }
.d-cell { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.2; }
.d-cell.win { fill: var(--accent-tint); stroke: var(--accent); }
.d-cell.hit { fill: var(--hit); stroke: var(--easy); stroke-width: 1.6; }
.d-ring { fill: none; stroke: var(--ink-3); stroke-width: 1.2; }
.d-ring.win { stroke: var(--accent); } .d-ring.hit { stroke: var(--easy); stroke-width: 1.6; }
.d-lbl { font: 600 12.5px var(--sans); fill: var(--ink); text-anchor: middle; }
.d-sub { font: 10.5px var(--mono); fill: var(--ink-3); text-anchor: middle; }
.d-base { stroke: var(--rule); stroke-width: 1.5; }
.d-flow { stroke: var(--accent); stroke-width: 1.7; fill: none; }
.d-fhead { fill: var(--accent); }
.d-flab { font: 600 11px var(--mono); fill: var(--accent); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }

/* markdown content */
.md > :first-child { margin-top: 0; }
.md p { margin: 12px 0; }
.md ul, .md ol { margin: 10px 0; padding-left: 22px; }
.md li { margin: 7px 0; }
.md li > ul, .md li > ol { margin: 4px 0; }
.md pre.code { margin: 12px 0; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 8px; font-size: 12.5px; line-height: 1.55; overflow-x: auto; }
.md .tablewrap { margin: 14px 0; }
.callout { margin: 16px 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; color: var(--ink); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table.ref { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.6; }
.ref th, .ref td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ref tr:last-child td { border-bottom: 0; }
.ref th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--code-bg); white-space: nowrap; }
.ref td { color: var(--ink-2); }
.ref td:first-child { color: var(--ink); font-weight: 550; }
.tables { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; margin-bottom: 36px; }

/* units: something to answer, then a hidden reference */
.check { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
.q { margin: 0 0 14px; font-weight: 550; }
.actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
.reveal { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 14px; font: 550 13px var(--sans); cursor: pointer; }
.unit.open > .actions .reveal { background: var(--surface); color: var(--accent); }
.ans-solo { margin-top: 16px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; font-size: 14.5px; }

/* numeric estimates */
.calc { border: 1px solid var(--code-rule); background: var(--code-bg); border-radius: 12px; padding: 8px 18px 14px; margin: 8px 0 6px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 190px minmax(0, 1.1fr); gap: 4px 14px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; }
.crow:last-of-type { border-bottom: 0; }
.cin { display: flex; align-items: center; gap: 6px; }
.cin input { width: 120px; font: 13.5px var(--mono); padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
.cin input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.cunit { font: 12.5px var(--mono); color: var(--ink-3); }
.cres { font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.cv.ok { color: var(--easy); font-weight: 600; } .cv.near { color: var(--medium); font-weight: 600; } .cv.off { color: var(--hard); font-weight: 600; }
.cans { color: var(--ink-2); font-family: var(--mono); font-size: 12.5px; }
.calc-actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12.5px; color: var(--ink-3); }

/* case study */
.prompt { padding: 18px 22px; border: 1px solid var(--accent); border-radius: 12px; background: var(--accent-tint); margin-bottom: 18px; }
.prompt p { margin: 8px 0 0; font-size: 16px; color: var(--ink); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 13px; color: var(--ink-3); }
.meta .lbl { margin-right: 4px; }
.case-tools { position: sticky; top: 56px; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 0; margin-bottom: 12px; background: var(--bg); border-bottom: 1px solid var(--rule); }
.case-tools .hint { font-size: 13px; color: var(--ink-3); }
.case-tools .right { margin-left: auto; display: flex; gap: 8px; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc a { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.toc a.seen { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
.step { padding: 36px 0 20px; scroll-margin-top: 120px; }
.step + .step { border-top: 1px solid var(--rule); }
.step-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.step-h .sn { font: 600 13px var(--mono); color: var(--accent); }
.step-h h3 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.step-h .min { font: 12px var(--mono); color: var(--ink-3); }
.ask { color: var(--ink-2); font-size: 15px; margin-bottom: 16px; }
.item { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin: 18px 0; scroll-margin-top: 120px; }
.item .q { font-size: 15.5px; }
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.unit.open > .work { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
.pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--code-rule); border-radius: 10px; overflow: hidden; }
.pane-h { display: flex; justify-content: space-between; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--code-rule); min-height: 32px; background: var(--code-bg); }
.pane.notes:focus-within { border-color: var(--accent); }
.pane.notes textarea { flex: 1; width: 100%; min-height: 130px; border: 0; resize: vertical; background: var(--surface); color: var(--ink); padding: 14px 16px; font-size: 14.5px; line-height: 1.65; outline: none; }
.pane.ans { border-color: var(--accent); }
.pane.ans .pane-h { background: var(--accent-tint); }
.pane.ans .pane-h .lbl { color: var(--accent); }
.pane.ans .md { padding: 14px 20px; font-size: 15px; }
.ans-wide { margin-top: 18px; }
/* review mode: every reference open, empty notes out of the way */
.allopen .unit.blank > .work { grid-template-columns: minmax(0, 1fr); }
.allopen .unit.blank > .work > .notes { display: none; }

/* cheat sheet */
.cheat-sec { margin-bottom: 40px; }
.cheat-sec > .lbl { display: block; margin-bottom: 12px; }
.ref td.num { font: 12px var(--mono); color: var(--accent); width: 1%; white-space: nowrap; }
.ref td.nm { font-weight: 600; white-space: nowrap; }
.ref td.nm a { color: var(--ink); text-decoration: none; }
.ref td.nm a:hover { color: var(--accent); }
.ref td.mono { font: 12.5px var(--mono); color: var(--ink); }
.nums.wide dl { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 24px; }

/* interview framework */
.tbar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin: 8px 0 36px; border: 1px solid var(--rule); }
.tbar a { display: flex; align-items: center; justify-content: center; min-width: 0; font: 600 11.5px var(--mono); color: var(--accent); text-decoration: none; white-space: nowrap; overflow: hidden; }
.tbar a:nth-child(odd) { background: var(--accent-tint); }
.tbar a:nth-child(even) { background: var(--surface); }
.tbar a:hover { background: var(--accent); color: #fff; }
.fstep { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; scroll-margin-top: 80px; }
.fstep .goal { margin: 4px 0 14px; color: var(--ink); }
.fcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.fcols ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14.5px; }
.fcols li { margin: 7px 0; }
.fcols .avoid .lbl { color: var(--hard); }
.fcols .staff .lbl { color: var(--accent); }

/* block drill */
.drill { border: 1px solid var(--rule); border-radius: 12px; padding: 24px 28px; }
.drill-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-3); }
.drill-q { font-size: 17.5px; margin: 0 0 20px; line-height: 1.6; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1px solid var(--rule); background: var(--surface); padding: 12px 14px; border-radius: 9px; cursor: pointer; font-size: 14.5px; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--easy); background: var(--easy-bg); }
.opt.wrong { border-color: var(--hard); background: var(--hard-bg); }
.opt kbd { font: 11px var(--mono); color: var(--ink-3); margin-right: 8px; }
.verdict { margin-top: 18px; padding: 14px 18px; border-radius: 9px; font-size: 14.5px; background: var(--code-bg); }
.verdict b.ok { color: var(--easy); }
.verdict b.no { color: var(--hard); }
.verdict a { color: var(--accent); font-weight: 550; text-decoration: none; }
.drill-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }

/* glossary */
.gl-tools { position: sticky; top: 56px; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 12px 0; margin-bottom: 8px; background: var(--bg); border-bottom: 1px solid var(--rule); }
.gl-tools input { flex: 1; max-width: 420px; font: 14px var(--sans); padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); background: var(--surface); }
.gl-tools input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.gl-tools span { font-size: 13px; color: var(--ink-3); }
.gl-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 6px 24px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.gl-term { font-weight: 650; }
.gl-def { color: var(--ink-2); }
.gl-def .pchip { margin-left: 6px; font-size: 12px; vertical-align: 1px; }
.gl-empty { color: var(--ink-3); font-style: italic; margin-top: 20px; }

/* narrow */
@media (max-width: 960px) {
  .fcols { grid-template-columns: minmax(0, 1fr); }
  .concept { grid-template-columns: minmax(0, 1fr); }
  .unit.open > .work { grid-template-columns: minmax(0, 1fr); }
  .crow { grid-template-columns: minmax(0, 1fr) auto; }
  .crow .cres { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 56px; z-index: 5; display: flex; gap: 4px; max-height: none; overflow-x: auto; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .side a { white-space: nowrap; }
  .side .grp, .side .soon, .side a .dot { display: none; }
  html { scroll-padding-top: 112px; }
  main { padding: 24px 16px 64px; }

  .tprog .meter { display: none; }
  .hgrid { grid-template-columns: minmax(0, 1fr); }
  .pager .pbtn { padding: 8px 12px; font-size: 13px; }
  .check, .item { padding: 16px; }
  .status { margin-left: 0; }
  .case-tools { top: 100px; }
  .case-tools .right { margin-left: 0; }
  .step, .item { scroll-margin-top: 170px; }
  .svgwrap svg { max-width: none; }

  .fcols, .opts { grid-template-columns: minmax(0, 1fr); }
  .gl-row { grid-template-columns: minmax(0, 1fr); }
  .gl-tools { top: 100px; }

  .drill, .fstep { padding: 18px; }
}
/* print: the cheat sheet alone */
@media print {
  .top, .side, .pager, .p-head .status, .case-tools, .gl-tools { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  body.print-cheat main > :not(#cheat) { display: none !important; }
  body.print-cheat #cheat .p-head button { display: none; }
  .ref th, .ref td { padding: 5px 8px; font-size: 10.5px; }
  .tablewrap { overflow: visible; }
  .cheat-sec { break-inside: auto; margin-bottom: 20px; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home">System Design</a><span class="ver" title="Guide version">v__VERSION__</span>
  <a class="tprog" href="#home" title="Progress · open Home"><span class="meter"><i id="meter"></i></span><span id="progText"></span></a>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const DATA = /*__DATA__*/null;

/* storage: localStorage with an in-memory fallback. Prefix sd. (not sg.): Chrome shares one localStorage
   across all file:// pages, so the algo guide and this one must not collide. */
const P = "sd.";
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} },
  keys() {
    const ks = new Set(Object.keys(mem));
    try { for (let i = 0; i < localStorage.length; i++) ks.add(localStorage.key(i)); } catch (e) {}
    return [...ks].filter(k => k.startsWith(P));
  },
};
const progKey = id => `${P}prog.${id}`;
const noteKey = k => `${P}note.${k}`;
const calcKey = (k, i) => `${P}calc.${k}.${i}`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");

/* ── markdown subset: paragraphs, - / 1. lists (2-space nesting), **bold**, `code`, ``` fences, | tables |, > callouts */
const inline = s => String(s).split("`").map((seg, k) => k % 2 ? `<code>${esc(seg)}</code>`
  : esc(seg).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")).join("");
const LIST = /^(\s*)(?:([-*])|\d+\.)\s+(.*)$/;
function md(src) {
  const L = String(src || "").replace(/\s+$/, "").split("\n");
  const starts = l => /^\s*(```|\||> |[-*]\s|\d+\.\s)/.test(l);
  let out = "", i = 0;
  while (i < L.length) {
    const l = L[i], t = l.trim();
    if (!t) { i++; continue; }
    if (t.startsWith("```")) {
      const body = [];
      for (i++; i < L.length && !L[i].trim().startsWith("```"); i++) body.push(L[i]);
      i++;
      out += `<pre class="code">${esc(body.join("\n"))}</pre>`;
    } else if (t.startsWith("|")) {
      const rows = [];
      while (i < L.length && L[i].trim().startsWith("|")) rows.push(L[i++].trim());
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const [head, ...rest] = rows.filter((r, k) => !(k === 1 && /^[|\s:-]+$/.test(r)));
      out += `<div class="tablewrap"><table class="ref"><thead><tr>${cells(head).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>
        <tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    } else if (l.startsWith(">")) {
      const q = [];
      while (i < L.length && L[i].startsWith(">")) q.push(L[i++].replace(/^>\s?/, ""));
      out += `<div class="callout">${inline(q.join(" "))}</div>`;
    } else if (LIST.test(l)) {
      const items = [];
      for (; i < L.length && L[i].trim(); i++) {
        const m = L[i].match(LIST);
        if (m) items.push({ ind: m[1].length, ol: !m[2], text: m[3] });
        else if (/^\s/.test(L[i])) items[items.length - 1].text += " " + L[i].trim();   // wrapped item line
        else break;
      }
      out += mdList(items);
    } else {
      const p = [];
      while (i < L.length && L[i].trim() && !(p.length && starts(L[i]))) p.push(L[i++].trim());
      out += `<p>${inline(p.join(" "))}</p>`;
    }
  }
  return out;
}
function mdList(items) {
  let out = "";
  const stack = [];
  items.forEach(it => {
    while (stack.length && it.ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
    const top = stack[stack.length - 1];
    if (!top || it.ind > top.ind) { const tag = it.ol ? "ol" : "ul"; stack.push({ ind: it.ind, tag }); out += `<${tag}>`; }
    else out += "</li>";
    out += `<li>${inline(it.text)}`;
  });
  while (stack.length) out += `</li></${stack.pop().tag}>`;
  return out;
}

/* ── catalog */
const CAT = DATA.catalog;
const BUILT = new Set([...DATA.blocks, ...DATA.cases].map(x => x.id));
const blockNo = id => pad(CAT.blocks.findIndex(c => c.id === id) + 1);
const caseNo = id => "C" + (CAT.cases.findIndex(c => c.id === id) + 1);
const catName = id => ([...CAT.blocks, ...CAT.cases].find(c => c.id === id) || { name: id }).name;
const pchip = id => BUILT.has(id)
  ? `<a class="pchip" href="#${id}">${esc(catName(id))}</a>`
  : `<span class="pchip soon" title="Not written yet">${esc(catName(id))}</span>`;
const PAGES_CONTENT = [...DATA.blocks.map(b => b.id), ...DATA.cases.map(c => c.id)];

/* ── arch diagram: boxes on a [col, row] grid; base edges faint, a frame's flow in accent with labels */
/* AX and NW are mirrored in build.py (ARCH_AX, ARCH_NW) for the label-fit check */
const AX = 216, AY = 100, NW = 116, NH = 42, AP = 8;
function archFrame(d, f) {
  const at = Object.values(d.nodes).map(n => n.at);
  const minR = Math.min(...at.map(a => a[1])), maxR = Math.max(...at.map(a => a[1])), maxC = Math.max(...at.map(a => a[0]));
  const W = maxC * AX + NW + 2 * AP, H = (maxR - minR) * AY + NH + 2 * AP + 6;
  const C = id => ({ x: AP + NW / 2 + d.nodes[id].at[0] * AX, y: AP + 3 + NH / 2 + (d.nodes[id].at[1] - minR) * AY });
  const rim = (c, dx, dy) => { const t = Math.min(NW / 2 / Math.abs(dx || 1e-9), NH / 2 / Math.abs(dy || 1e-9)); return { x: c.x + dx * t, y: c.y + dy * t }; };
  const ends = (a, b, off = 0) => {
    const p = C(a), q = C(b), len = Math.hypot(q.x - p.x, q.y - p.y), ux = (q.x - p.x) / len, uy = (q.y - p.y) / len;
    const nx = -uy * off, ny = ux * off;
    const s = rim(p, ux, uy), e = rim(q, -ux, -uy);
    return { x1: s.x + ux * 3 + nx, y1: s.y + uy * 3 + ny, x2: e.x - ux * 3 + nx, y2: e.y - uy * 3 + ny, ux, uy };
  };
  let s = "";
  (d.edges || []).forEach(([a, b]) => { const e = ends(a, b); s += `<line class="d-base" x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}"/>`; });
  const flow = f.flow || [];
  const paired = (a, b) => flow.some(([x, y]) => x === b && y === a);
  let labels = "";
  flow.forEach(([a, b, label]) => {
    const two = paired(a, b), e = ends(a, b, two ? 7 : 0);
    const bx = e.x2 - 7 * e.ux, by = e.y2 - 7 * e.uy, px = -e.uy * 4, py = e.ux * 4;
    s += `<line class="d-flow" x1="${e.x1}" y1="${e.y1}" x2="${bx}" y2="${by}"/><path class="d-fhead" d="M${e.x2} ${e.y2}L${bx + px} ${by + py}L${bx - px} ${by - py}z"/>`;
    if (label) {
      // label beside the arrow: on the arrow's own side when paired with its reverse, else above / left;
      // if that spot overlaps a box, use the other side
      let nx = -e.uy, ny = e.ux;
      if (!two && (ny > 0 || (Math.abs(ny) < 1e-6 && nx > 0))) { nx = -nx; ny = -ny; }
      const place = (sx, sy) => {
        const mx = (e.x1 + e.x2) / 2 + sx * 12, my = (e.y1 + e.y2) / 2 + sy * 12 + 4;
        const anchor = Math.abs(e.uy) > 0.2 ? (sx > 0 ? "start" : "end") : "middle";   // diagonal: hang off the line
        const w = String(label).length * 6.7, x0 = anchor === "start" ? mx : anchor === "end" ? mx - w : mx - w / 2;
        return { mx, my, anchor, box: [x0, my - 11, x0 + w, my + 3] };
      };
      const hits = p => Object.keys(d.nodes).some(id => { const c = C(id);
        return p.box[0] < c.x + NW / 2 && p.box[2] > c.x - NW / 2 && p.box[1] < c.y + NH / 2 && p.box[3] > c.y - NH / 2; });
      let p = place(nx, ny);
      if (!two && hits(p)) { const q = place(-nx, -ny); if (!hits(q)) p = q; }
      labels += `<text class="d-flab" x="${p.mx}" y="${p.my}" text-anchor="${p.anchor}">${esc(label)}</text>`;
    }
  });
  Object.entries(d.nodes).forEach(([id, n]) => {
    const { x, y } = C(id), x0 = x - NW / 2, y0 = y - NH / 2;
    const cls = (f.hit || []).includes(id) ? "hit" : (f.win || []).includes(id) ? "win" : "";
    const kind = n.kind || "service";
    if (kind === "db") {
      const ry = 6;
      s += `<path class="d-cell ${cls}" d="M${x0} ${y0 + ry}A${NW / 2} ${ry} 0 0 1 ${x0 + NW} ${y0 + ry}V${y0 + NH - ry}A${NW / 2} ${ry} 0 0 1 ${x0} ${y0 + NH - ry}Z"/>`;
      s += `<path class="d-ring ${cls}" d="M${x0} ${y0 + ry}A${NW / 2} ${ry} 0 0 0 ${x0 + NW} ${y0 + ry}"/>`;
    } else {
      s += `<rect class="d-cell ${cls}" x="${x0}" y="${y0}" width="${NW}" height="${NH}" rx="${kind === "client" ? NH / 2 : kind === "queue" ? 4 : 7}"/>`;
      if (kind === "queue") [7, 11, 15].forEach(o => (s += `<line class="d-ring ${cls}" x1="${x0 + NW - o}" y1="${y0 + 9}" x2="${x0 + NW - o}" y2="${y0 + NH - 9}"/>`));
    }
    const dy = kind === "db" ? 5 : 0;
    s += n.sub ? `<text class="d-lbl" x="${x}" y="${y - 2 + dy}">${esc(n.label)}</text><text class="d-sub" x="${x}" y="${y + 12 + dy}">${esc(n.sub)}</text>`
      : `<text class="d-lbl" x="${x}" y="${y + 4.5 + dy}">${esc(n.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(f.title)}">${s}${labels}</svg>`;
}
function arch(d) {
  return `<figure class="arch">
    <div class="fr-tabs" role="tablist">${d.frames.map((f, i) => `<button type="button" role="tab" data-act="frame" data-frame="${i}" aria-selected="${i === 0}">${esc(f.title)}</button>`).join("")}</div>
    <div class="svgwrap">${d.frames.map((f, i) => `<div data-fr="${i}"${i ? " hidden" : ""}>${archFrame(d, f)}</div>`).join("")}</div>
    ${d.frames.map((f, i) => `<p class="fr-note" data-fr="${i}"${i ? " hidden" : ""}>${inline(f.note || "")}</p>`).join("")}
    <figcaption>${esc(d.caption || "")}</figcaption></figure>`;
}

/* ── numeric estimates */
const CALCS = {};
const SUF = { k: 1e3, K: 1e3, M: 1e6, B: 1e9, G: 1e9, T: 1e12 };
function parseNum(s) {
  const m = String(s).replace(/[\s,≈~]/g, "").match(/^(-?\d*\.?\d+(?:e[+-]?\d+)?)([kKMBGT])?$/);
  return m ? parseFloat(m[1]) * (SUF[m[2]] || 1) : null;
}
function fmt(v) {
  const a = Math.abs(v);
  const [d, s] = a >= 1e12 ? [1e12, "T"] : a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : a >= 1e4 ? [1e3, "K"] : [1, ""];
  return (+(v / d).toPrecision(3)).toLocaleString("en-US") + s;
}
function calcHTML(key, rows) {
  CALCS[key] = rows;
  return `<div class="calc" data-calc="${esc(key)}">${rows.map((r, i) => `
    <div class="crow"><span class="cask">${inline(r.ask)}</span>
      <span class="cin"><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-i="${i}" aria-label="${esc(r.ask)}"
        value="${esc(store.get(calcKey(key, i), ""))}" placeholder="e.g. 12K"><span class="cunit">${esc(r.unit || "")}</span></span>
      <span class="cres"><span class="cv"></span><span class="cans" hidden>ref ${esc(r.show)} · exact ${fmt(r.value)}</span></span></div>`).join("")}
    <div class="calc-actions"><button class="btn" type="button" data-act="check">Check</button><span>Accepts 12K, 3.5e9, 12,000. Within 25% counts as close.</span></div></div>`;
}
function verdict(guess, v) {
  if (guess === null) return ["", ""];
  const r = guess / v;
  if (r >= 0.8 && r <= 1.25) return ["ok", "✓ close"];
  const x = r > 1 ? r : 1 / r, by = x < 10 ? x.toFixed(1) : fmt(x);
  return r >= 1 / 3 && r <= 3 ? ["near", `~ ballpark (${by}× ${r > 1 ? "high" : "low"})`] : ["off", `✗ off ${by}× ${r > 1 ? "high" : "low"}`];
}
function checkCalc(box, reveal) {
  const rows = CALCS[box.dataset.calc];
  box.querySelectorAll(".crow").forEach((row, i) => {
    const g = parseNum(row.querySelector("input").value);
    const [cls, txt] = verdict(g, rows[i].value);
    const cv = row.querySelector(".cv");
    cv.className = "cv " + cls; cv.textContent = txt;
    if (g !== null || reveal) row.querySelector(".cans").hidden = false;
  });
}

/* ── units: answer area + hidden reference. A unit's key names its saved notes. */
function notesPane(key, label) {
  const v = store.get(noteKey(key), "");
  return `<div class="pane notes"><div class="pane-h"><span class="lbl">Your notes</span></div>
    <textarea spellcheck="true" data-note="${esc(key)}" aria-label="Your notes: ${esc(label)}" placeholder="Work it out here before revealing…">${esc(v)}</textarea></div>`;
}
function caseUnit(key, label, refHTML, wideHTML, extra = "") {
  const blank = !store.get(noteKey(key), "").trim();
  return `<div class="unit${blank ? " blank" : ""}" data-unit="${esc(key)}">${extra}
    <div class="work">${notesPane(key, label)}
      <div class="pane ans" hidden><div class="pane-h"><span class="lbl">Reference</span></div><div class="md">${refHTML}</div></div></div>
    ${wideHTML ? `<div class="ans-wide" hidden>${wideHTML}</div>` : ""}
    <div class="actions"><button class="reveal" type="button" aria-expanded="false" data-label="reference">Reveal reference</button></div></div>`;
}

/* ── pages */
function statusBtns() {
  return `<span class="status" role="group" aria-label="Progress">
    <button class="st" type="button" data-st="review" aria-pressed="false">↺ Review again</button>
    <button class="st" type="button" data-st="done" aria-pressed="false">✓ Got it</button></span>`;
}

function renderHome() {
  const card = (c, n, built) => built
    ? `<a class="pcard" href="#${c.id}"><span class="n">${n}</span>${esc(c.name)}<i class="dot" data-dot="${c.id}"></i></a>`
    : `<div class="pcard soon"><span class="n">${n}</span>${esc(c.name)}<small>soon</small></div>`;
  return `<section class="sec" id="home">
    <div class="hero"><h1>System Design</h1>
      <p class="lead">Senior / staff-level interview prep: ${CAT.blocks.length} building blocks and ${CAT.cases.length} case studies.
        Blocks give you the options, tradeoffs, numbers and failure modes. Cases walk the interview step by step, with a reference answer for each step.</p>
      <a class="pbtn fill" id="continue" href="#">Start</a></div>
    <div class="hgrid">
      <div class="hcard"><span class="lbl">How to use</span><ol>
        <li><b>Study:</b> on a case, write notes for one step, reveal its reference, compare, then move on. Estimates check your numbers.</li>
        <li><b>Review the night before:</b> press <b>Reveal all</b> on a case or a block's quick checks to read the whole reference at once.</li>
        <li>Mark each page <b>Got it</b> or <b>Review again</b>. Pages to review collect here.</li>
        <li>Warm up with the <a href="#framework">Interview Framework</a>; test yourself with the <a href="#est-drill">Estimation Drill</a> and <a href="#drill">Block Drill</a>; skim the <a href="#cheat">Cheat Sheet</a> last.</li>
      </ol></div>
      <div class="hcard"><span class="lbl">Progress</span><div id="homeStats"></div><ul class="rlist" id="reviewList"></ul></div>
    </div>
    <span class="lbl">Building blocks</span>
    <div class="pgrid">${CAT.blocks.map((c, i) => card(c, pad(i + 1), BUILT.has(c.id))).join("")}</div>
    <span class="lbl">Case studies</span>
    <div class="pgrid">${CAT.cases.map((c, i) => card(c, "C" + (i + 1), BUILT.has(c.id))).join("")}</div>
    <div class="hcard"><span class="lbl">Your data</span>
      <p>Notes, estimates and progress auto-save in this browser only. Export a backup to keep them or move them to another browser.</p>
      <button class="btn" data-act="exportAll" type="button">Export backup</button>
      <button class="btn" data-act="importAll" type="button">Import backup</button>
      <button class="btn danger" data-act="resetAll" type="button">Reset all…</button></div>
  </section>`;
}

function updateHome() {
  const st = id => store.get(progKey(id), "");
  const done = PAGES_CONTENT.filter(id => st(id) === "done").length;
  const review = PAGES_CONTENT.filter(id => st(id) === "review");
  const next = PAGES_CONTENT.find(id => st(id) !== "done");
  const cont = document.getElementById("continue");
  cont.hidden = !next;
  if (next) { cont.href = `#${next}`; cont.textContent = `${done || review.length ? "Continue" : "Start"}: ${catName(next)} →`; }
  const n = PAGES_CONTENT.length;
  document.getElementById("homeStats").innerHTML = `<div class="stats"><b>${done} / ${n}</b><span>done · ${review.length} to review · ${n - done - review.length} not started</span></div>
    <div class="meter big"><i style="width:${n ? (100 * done) / n : 0}%"></i></div>`;
  document.getElementById("reviewList").innerHTML = review.length
    ? review.map(id => `<li><i class="dot st-review"></i><a href="#${id}">${esc(catName(id))}</a></li>`).join("")
    : `<li class="empty">Nothing marked for review yet.</li>`;
}

function renderBlock(b) {
  const nums = b.numbers ? `<div class="nums"><span class="lbl">Key numbers</span><dl>${b.numbers.map(n => `<div><dt>${inline(n.k)}</dt><dd>${inline(n.v)}</dd></div>`).join("")}</dl></div>` : "";
  const concept = b.diagram || nums ? `<div class="concept${b.diagram ? "" : " solo"}">${b.diagram ? arch(b.diagram) : ""}${nums}</div>` : "";
  const tables = (b.tables || []).map(t => `<div><div class="lbl" style="margin-bottom:6px">${esc(t.title)}</div>
    <div class="tablewrap"><table class="ref"><thead><tr>${t.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("");
  const checks = b.checks.map((c, i) => {
    const key = `${b.id}.c${i + 1}`;
    return `<div class="check unit" id="${b.id}--check-${i + 1}" data-unit="${key}">
      <p class="q">${inline(c.q)}</p>${c.calc ? calcHTML(key, c.calc) : ""}
      ${c.a ? `<div class="ans-solo md" hidden>${md(c.a)}</div>` : ""}
      <div class="actions"><button class="reveal" type="button" aria-expanded="false" data-label="answer">Reveal answer</button></div></div>`;
  }).join("");
  return `<section class="sec page" id="${b.id}">
    <div class="p-head"><span class="p-num">${blockNo(b.id)}</span><h2>${esc(b.name)}</h2>${statusBtns()}</div>
    <div class="signal"><span class="lbl">Signal</span>${b.signal.map(s => `<span class="chip">${inline(s)}</span>`).join("")}</div>
    <div class="blk"><span class="lbl">Core Idea</span><p>${inline(b.idea)}</p></div>
    ${concept}
    ${tables ? `<div class="tables">${tables}</div>` : ""}
    <div class="blk"><span class="lbl">Pitfalls</span><ul>${b.pitfalls.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>
    <div class="blk"><span class="lbl">Staff-level depth</span><ul>${b.depth.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>
    <div class="blk reveal-scope"><div class="blk-h"><span class="lbl">Quick checks</span>
      <span class="right"><button class="btn" type="button" data-act="revealAll">Reveal all</button></span></div>${checks}</div>
  </section>`;
}

function renderCase(c) {
  const total = c.steps.reduce((a, s) => a + (s.min || 0), 0);
  const steps = c.steps.map((s, i) => {
    const key = `${c.id}.${s.id}`;
    const head = `<div class="step-h"><span class="sn">${i + 1}</span><h3>${esc(s.title)}</h3><span class="min">${s.min} min</span></div>
      <div class="ask md">${md(s.ask)}</div>`;
    let body;
    if (s.items) {
      body = s.items.map((it, k) => `<div class="item" id="${c.id}--${it.id}">
        <p class="q"><span class="p-num">${i + 1}.${k + 1}</span> ${inline(it.q)}</p>
        ${caseUnit(`${c.id}.${it.id}`, it.q, md(it.answer), "")}</div>`).join("");
    } else {
      const calc = s.calc ? calcHTML(key, s.calc) : "";
      body = caseUnit(key, s.title, md(s.answer), s.diagram ? arch(s.diagram) : "", calc);
    }
    return `<article class="step" id="${c.id}--${s.id}">${head}${body}</article>`;
  }).join("");
  return `<section class="sec page case reveal-scope" id="${c.id}">
    <div class="p-head"><span class="p-num">${caseNo(c.id)}</span><h2>${esc(c.name)}</h2>${statusBtns()}</div>
    <div class="prompt"><span class="lbl">Interview prompt</span><p>${inline(c.prompt)}</p></div>
    <div class="meta"><span class="lbl">Uses</span>${c.blocks.map(pchip).join("")}<span>· ${total} min</span></div>
    <div class="case-tools">
      <nav class="toc" aria-label="Steps">${c.steps.map((s, i) => `<a href="#${c.id}--${s.id}" data-toc="${c.id}.${s.id}">${i + 1} ${esc(s.title)}</a>`).join("")}</nav>
      <span class="right"><button class="btn" type="button" data-act="revealAll">Reveal all</button>
        <button class="link" type="button" data-act="clearNotes">Clear notes</button></span>
    </div>
    ${steps}
  </section>`;
}

/* ── site-wide pages */
const PG = DATA.pages;
function renderCheat() {
  const c = PG.cheat;
  return `<section class="sec" id="cheat">
    <div class="p-head"><h2>Cheat Sheet</h2><span class="status"><button class="btn" type="button" data-act="printCheat">Print</button></span></div>
    <p class="blk" style="color:var(--ink-2);max-width:85ch">Every block and case on one page, for the last pass before an interview.</p>
    <div class="cheat-sec"><span class="lbl">Building blocks</span><div class="tablewrap"><table class="ref">
      <thead><tr><th>#</th><th>Block</th><th>Reach for it when</th><th>Key move</th><th>Number</th></tr></thead><tbody>
      ${c.blocks.map(r => `<tr><td class="num">${blockNo(r.id)}</td><td class="nm"><a href="#${r.id}">${esc(catName(r.id))}</a></td>
        <td>${inline(r.when)}</td><td>${inline(r.move)}</td><td class="mono">${inline(r.num)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="cheat-sec"><span class="lbl">Case studies</span><div class="tablewrap"><table class="ref">
      <thead><tr><th>#</th><th>Case</th><th>The crux</th><th>Key decisions</th></tr></thead><tbody>
      ${c.cases.map(r => `<tr><td class="num">${caseNo(r.id)}</td><td class="nm"><a href="#${r.id}">${esc(catName(r.id))}</a></td>
        <td>${inline(r.crux)}</td><td>${inline(r.key)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="cheat-sec"><div class="nums wide"><span class="lbl">Numbers to know</span><dl>${c.numbers.map(n =>
      `<div><dt>${inline(n.k)}</dt><dd>${inline(n.v)}</dd></div>`).join("")}</dl></div></div>
  </section>`;
}

function renderFramework() {
  const f = PG.framework, total = f.steps.reduce((a, s) => a + s.min, 0);
  const list = (cls, label, xs) => `<div class="${cls}"><span class="lbl">${label}</span><ul>${xs.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>`;
  return `<section class="sec" id="framework">
    <div class="p-head"><h2>Interview Framework</h2></div>
    <div class="blk"><p>${inline(f.intro)}</p></div>
    <span class="lbl">Time budget · ${total} min</span>
    <nav class="tbar" aria-label="Steps">${f.steps.map(s => `<a href="#fw-${s.id}" style="flex:${s.min}" title="${esc(s.title)} · ${s.min} min">${s.min}′</a>`).join("")}</nav>
    ${f.steps.map((s, i) => `<div class="fstep" id="fw-${s.id}">
      <div class="step-h"><span class="sn">${i + 1}</span><h3>${esc(s.title)}</h3><span class="min">${s.min} min</span></div>
      <p class="goal">${inline(s.goal)}</p>
      <div class="fcols">${list("do", "Do", s.do)}${list("staff", "Staff-level", s.staff)}${list("avoid", "Avoid", s.avoid)}</div></div>`).join("")}
    <div class="blk"><span class="lbl">Throughout</span><ul>${f.throughout.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>
  </section>`;
}

function renderEstDrill() {
  const ps = PG["est-drill"].problems;
  return `<section class="sec reveal-scope" id="est-drill">
    <div class="p-head"><h2>Estimation Drill</h2><span class="status"><button class="btn" type="button" data-act="revealAll">Reveal all</button></span></div>
    <div class="blk"><p>${ps.length} back-of-the-envelope problems. Work each in your head or on paper, type your numbers, press Check, then reveal the reasoning.
      Every reference value is recomputed by the build.</p></div>
    ${ps.map((pr, i) => `<div class="check unit" id="est-drill--${i + 1}" data-unit="est.${i + 1}">
      <p class="q"><span class="p-num">${pad(i + 1)}</span> ${inline(pr.q)}</p>${calcHTML(`est.${i + 1}`, pr.calc)}
      ${pr.a ? `<div class="ans-solo md" hidden>${md(pr.a)}</div>` : ""}
      <div class="actions"><button class="reveal" type="button" aria-expanded="false" data-label="answer">Reveal answer</button></div></div>`).join("")}
  </section>`;
}

function renderDrillPage() {
  return `<section class="sec" id="drill">
    <div class="p-head"><h2>Block Drill</h2></div>
    <div class="blk"><p>Name the building block from the symptom, the way an interviewer's prompt hides it. ${PG.drill.items.length} questions, shuffled. Keys 1–4 answer, Enter goes next.</p></div>
    <div class="drill" id="drillCard"></div></section>`;
}
const drill = { order: [], pos: 0, score: 0, answered: false };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function drillStart() { Object.assign(drill, { order: shuffle(PG.drill.items.map((_, i) => i)), pos: 0, score: 0, answered: false }); drillRender(); }
function drillRender() {
  const el = document.getElementById("drillCard"), n = drill.order.length;
  if (drill.pos >= n) {
    el.innerHTML = `<p class="drill-q">Done: ${drill.score} / ${n} correct.</p>
      <div class="drill-actions"><button class="reveal" type="button" data-act="drillRestart">Shuffle and restart</button></div>`;
    return;
  }
  const it = PG.drill.items[drill.order[drill.pos]];
  el.innerHTML = `<div class="drill-h"><span>Question ${drill.pos + 1} / ${n}</span><span>Score ${drill.score}</span></div>
    <p class="drill-q">${inline(it.prompt)}</p>
    <div class="opts">${shuffle([it.answer, ...it.distractors]).map((id, k) => `<button class="opt" type="button" data-pick="${id}"><kbd>${k + 1}</kbd>${esc(catName(id))}</button>`).join("")}</div>
    <div class="verdict" hidden></div>
    <div class="drill-actions" hidden><button class="reveal" type="button" data-act="drillNext">${drill.pos + 1 === n ? "See score" : "Next"}</button></div>`;
  drill.answered = false;
}
function drillPick(id) {
  if (drill.answered) return;
  drill.answered = true;
  const it = PG.drill.items[drill.order[drill.pos]], ok = id === it.answer, el = document.getElementById("drillCard");
  if (ok) drill.score++;
  el.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.pick === it.answer) b.classList.add("right");
    else if (b.dataset.pick === id) b.classList.add("wrong");
  });
  const v = el.querySelector(".verdict");
  v.innerHTML = `${ok ? `<b class="ok">✓ Correct.</b>` : `<b class="no">✗ It's ${esc(catName(it.answer))}.</b>`} ${inline(it.why)} <a href="#${it.answer}">Review the block →</a>`;
  v.hidden = false;
  el.querySelector(".drill-actions").hidden = false;
  el.querySelector("[data-act=drillNext]").focus();
  el.querySelector(".drill-h span:last-child").textContent = `Score ${drill.score}`;
}

function renderGlossary() {
  const terms = [...PG.glossary.terms].sort((a, b) => a.term.localeCompare(b.term, "en", { sensitivity: "base" }));
  return `<section class="sec" id="glossary">
    <div class="p-head"><h2>Tradeoff Glossary</h2></div>
    <div class="blk"><p>The vocabulary interviewers expect, each with the trade-off it implies and the block that covers it.</p></div>
    <div class="gl-tools"><input type="search" id="glFilter" placeholder="Filter: quorum, lease, outbox…" aria-label="Filter terms"><span id="glCount"></span></div>
    <div id="glList">${terms.map(t => `<div class="gl-row"><div class="gl-term">${esc(t.term)}</div>
      <div class="gl-def">${inline(t.def)}${pchip(t.see)}</div></div>`).join("")}</div>
    <p class="gl-empty" id="glEmpty" hidden>No terms match.</p>
  </section>`;
}
function filterGlossary() {
  const q = document.getElementById("glFilter").value.trim().toLowerCase();
  const rows = [...document.querySelectorAll(".gl-row")];
  let shown = 0;
  rows.forEach(r => { const hit = !q || r.textContent.toLowerCase().includes(q); r.hidden = !hit; shown += hit; });
  document.getElementById("glCount").textContent = q ? `${shown} of ${rows.length} terms` : `${rows.length} terms`;
  document.getElementById("glEmpty").hidden = shown > 0;
}

function renderSide() {
  const link = (id, label, n) => `<a href="#${id}" data-pid="${id}">${n ? `<span class="n">${n}</span>` : ""}${esc(label)}${n ? `<i class="dot" data-dot="${id}"></i>` : ""}</a>`;
  const list = (cat, num) => cat.map((c, i) => BUILT.has(c.id) ? link(c.id, c.name, num(i))
    : `<span class="soon"><span class="n">${num(i)}</span>${esc(c.name)}</span>`).join("");
  return `<div class="grp">Overview</div>${link("home", "Home")}${link("cheat", "Cheat Sheet")}${link("framework", "Interview Framework")}
    <div class="grp">Building blocks</div>${list(CAT.blocks, i => pad(i + 1))}
    <div class="grp">Case studies</div>${list(CAT.cases, i => "C" + (i + 1))}
    <div class="grp">Practice</div>${link("est-drill", "Estimation Drill")}${link("drill", "Block Drill")}
    <div class="grp">Reference</div>${link("glossary", "Tradeoff Glossary")}`;
}

/* ── progress: page buttons, dots, top bar, home */
function applyProgress() {
  let done = 0;
  PAGES_CONTENT.forEach(id => {
    const st = store.get(progKey(id), "");
    if (st === "done") done++;
    document.querySelectorAll(`#${id} .st`).forEach(b => b.setAttribute("aria-pressed", b.dataset.st === st));
    document.querySelectorAll(`[data-dot="${id}"]`).forEach(d => (d.className = `dot${st ? ` st-${st}` : ""}`));
  });
  const n = PAGES_CONTENT.length;
  document.getElementById("progText").textContent = `${done} / ${n}`;
  document.getElementById("meter").style.width = `${n ? (100 * done) / n : 0}%`;
  updateHome();
}

/* ── reveal: one unit, or every unit in a page's reveal scope */
function setUnit(unit, open) {
  unit.classList.toggle("open", open);
  unit.querySelectorAll(":scope > .work > .ans, :scope > .ans-wide, :scope > .ans-solo").forEach(el => (el.hidden = !open));
  const btn = unit.querySelector(":scope > .actions .reveal");
  btn.textContent = `${open ? "Hide" : "Reveal"} ${btn.dataset.label}`;
  btn.setAttribute("aria-expanded", open);
  const box = unit.querySelector(":scope > .calc");
  if (box && open) checkCalc(box, true);
  if (box && !open) box.querySelectorAll(".crow").forEach(r => { if (!r.querySelector("input").value.trim()) r.querySelector(".cans").hidden = true; });
  const toc = document.querySelector(`[data-toc="${unit.dataset.unit}"]`);
  if (toc) toc.classList.toggle("seen", open);
  const scope = unit.closest(".reveal-scope");
  if (scope) syncRevealAll(scope);
}
function syncRevealAll(scope) {
  const units = [...scope.querySelectorAll(".unit")];
  const all = units.length && units.every(u => u.classList.contains("open"));
  scope.classList.toggle("allopen", all);
  scope.querySelector("[data-act=revealAll]").textContent = all ? "Hide all" : "Reveal all";
}

/* ── backup */
function download(name, text, type = "text/plain") {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportAll() {
  const data = Object.fromEntries(store.keys().map(k => [k, store.get(k, "")]));
  const day = new Date().toISOString().slice(0, 10);
  download(`system-design-progress-${day}.json`, JSON.stringify({ app: "system-design", version: 1, exported: new Date().toISOString(), data }, null, 2), "application/json");
}
function importAll(file) {
  file.text().then(txt => {
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { alert("That file isn't valid JSON."); return; }
    if (obj && obj.app && obj.app !== "system-design") { alert(`That backup is from "${obj.app}", not this guide.`); return; }
    const entries = Object.entries((obj && obj.data) || {}).filter(([k, v]) => k.startsWith(P) && typeof v === "string");
    if (!entries.length) { alert("No saved notes or progress found in that file."); return; }
    if (!confirm(`Import ${entries.length} saved items? Matching items in this browser are overwritten; everything else is kept.`)) return;
    entries.forEach(([k, v]) => store.set(k, v));
    location.reload();
  });
}
function resetAll() {
  if (!confirm("Reset everything? This clears all notes, estimates and progress marks for this guide in this browser.\n\nExport a backup first if you might want them back.")) return;
  store.keys().forEach(k => store.del(k));
  location.hash = "home";
  location.reload();
}

/* ── pages: every section is rendered once; the hash picks which one shows */
let PAGES = [], page = "home";
const SITE_LABELS = { home: "Home", cheat: "Cheat Sheet", framework: "Interview Framework", "est-drill": "Estimation Drill", drill: "Block Drill", glossary: "Tradeoff Glossary" };
const pageLabel = id => SITE_LABELS[id] || catName(id);
function pager(i) {
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  return `<nav class="pager" aria-label="Pages">
    ${prev ? `<a class="pbtn prev" href="#${prev}">← ${esc(pageLabel(prev))}</a>` : ""}
    ${next ? `<a class="pbtn next" href="#${next}">${esc(pageLabel(next))} →</a>` : ""}</nav>`;
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || "home";
  const el = document.getElementById(id), sec = el && el.closest("#main > .sec");
  page = sec ? sec.id : "home";
  document.querySelectorAll("#main > .sec").forEach(s => (s.hidden = s.id !== page));
  document.querySelectorAll(".side a").forEach(a => {
    const on = a.dataset.pid === page;
    a.classList.toggle("active", on);
    if (on && a.parentElement.scrollWidth > a.parentElement.clientWidth)
      a.parentElement.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
  });
  document.title = page === "home" ? "System Design" : `${pageLabel(page)} · System Design`;
  if (sec && el !== sec) el.scrollIntoView();
  else window.scrollTo(0, 0);
}
function go(step) {
  const next = PAGES[PAGES.indexOf(page) + step];
  if (next) location.hash = next;
}
const grow = ta => { ta.style.height = "auto"; ta.style.height = Math.max(130, ta.scrollHeight + 2) + "px"; };

function init() {
  PAGES = ["home", "cheat", "framework", ...PAGES_CONTENT, "est-drill", "drill", "glossary"];
  const main = document.getElementById("main");
  main.innerHTML = renderHome() + renderCheat() + renderFramework() + DATA.blocks.map(renderBlock).join("") + DATA.cases.map(renderCase).join("")
    + renderEstDrill() + renderDrillPage() + renderGlossary();
  PAGES.forEach((id, i) => document.getElementById(id).insertAdjacentHTML("beforeend", pager(i)));
  document.getElementById("side").innerHTML = renderSide();
  applyProgress(); drillStart(); filterGlossary(); route();
  document.getElementById("glFilter").addEventListener("input", filterGlossary);
  window.addEventListener("afterprint", () => document.body.classList.remove("print-cheat"));
  window.addEventListener("hashchange", route);
  window.addEventListener("hashchange", () => document.querySelectorAll(`#${page} textarea`).forEach(grow));
  document.querySelectorAll(`#${page} textarea`).forEach(grow);

  main.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.note) {
      store.set(noteKey(t.dataset.note), t.value);
      t.closest(".unit").classList.toggle("blank", !t.value.trim());
      grow(t);
    } else if (t.closest(".calc")) {
      store.set(calcKey(t.closest(".calc").dataset.calc, t.dataset.i), t.value);
    }
  });
  main.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.closest(".calc")) { e.preventDefault(); checkCalc(e.target.closest(".calc")); }
    if (e.key === "Escape" && /TEXTAREA|INPUT/.test(e.target.tagName)) e.target.blur();
  });
  main.addEventListener("click", e => {
    const t = e.target;
    const actEl = t.closest("[data-act]"), act = actEl?.dataset.act;
    if (act === "exportAll") return exportAll();
    if (act === "importAll") return document.getElementById("importFile").click();
    if (act === "resetAll") return resetAll();
    if (act === "check") return checkCalc(actEl.closest(".calc"));
    if (act === "printCheat") { document.body.classList.add("print-cheat"); window.print(); return; }
    if (act === "drillNext") { drill.pos++; drillRender(); return; }
    if (act === "drillRestart") return drillStart();
    if (t.closest("[data-pick]")) return drillPick(t.closest("[data-pick]").dataset.pick);
    if (act === "frame") {
      const fig = actEl.closest(".arch"), i = actEl.dataset.frame;
      fig.querySelectorAll("[data-frame]").forEach(b => b.setAttribute("aria-selected", b === actEl));
      fig.querySelectorAll("[data-fr]").forEach(el => (el.hidden = el.dataset.fr !== i));
      return;
    }
    if (act === "revealAll") {
      const scope = actEl.closest(".reveal-scope"), open = !scope.classList.contains("allopen");
      scope.querySelectorAll(".unit").forEach(u => setUnit(u, open));
      return;
    }
    if (act === "clearNotes") {
      const sec = actEl.closest(".sec");
      if (!confirm("Clear all your notes and estimates on this case?")) return;
      sec.querySelectorAll("textarea[data-note]").forEach(ta => { ta.value = ""; store.del(noteKey(ta.dataset.note)); ta.closest(".unit").classList.add("blank"); grow(ta); });
      sec.querySelectorAll(".calc").forEach(box => box.querySelectorAll("input").forEach(inp => { inp.value = ""; store.del(calcKey(box.dataset.calc, inp.dataset.i)); }));
      sec.querySelectorAll(".cv").forEach(cv => { cv.className = "cv"; cv.textContent = ""; });
      return;
    }
    if (t.closest(".reveal")) {
      const unit = t.closest(".unit");
      return setUnit(unit, !unit.classList.contains("open"));
    }
    if (t.closest(".st")) {
      const st = t.closest(".st").dataset.st;
      if (store.get(progKey(page), "") === st) store.del(progKey(page)); else store.set(progKey(page), st);
      applyProgress();
    }
  });
  document.getElementById("importFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (f) importAll(f); e.target.value = "";
  });
  /* keys (never while typing): ← → change page; on the drill page 1–4 answer, Enter goes next (focused button) */
  document.addEventListener("keydown", e => {
    if (/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
    if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); return go(e.key === "ArrowLeft" ? -1 : 1); }
    if (page !== "drill") return;
    if (/^[1-4]$/.test(e.key)) {
      const b = document.querySelectorAll("#drillCard .opt")[+e.key - 1];
      if (b && !b.disabled) { e.preventDefault(); drillPick(b.dataset.pick); }
    }
  });
}
init();
</script>
