# Building-Block Drill: name the block from the symptom. answer + 3 distractors, all block ids.
items:
  - {prompt: "Users in Tokyo wait 2 s for product images served from a bucket in us-east-1.", answer: cdn-blob, distractors: [load-balancing, caching, replication], why: "Static bytes far from users: serve them from CDN edges near Tokyo, with long-lived hashed URLs."}
  - {prompt: "Whenever a popular product's cache entry expires, the database sees 50K identical queries in one second.", answer: caching, distractors: [rate-limits-ids, partitioning, queues], why: "A cache stampede. Coalesce misses (single-flight), refresh early, or serve stale while one request recomputes."}
  - {prompt: "Placing an order must charge the card, reserve stock and book shipping in three services; any step can fail.", answer: dist-transactions, distractors: [consensus, queues, consistency], why: "A saga: local transactions with compensations and idempotency keys, irreversible steps last."}
  - {prompt: "Exactly one of five scheduler instances may run nightly billing, and a long GC pause must not cause a second run.", answer: consensus, distractors: [rate-limits-ids, replication, reliability], why: "Leader election with a lease, plus a fencing token (or unique run key) so a paused old leader can't act."}
  - {prompt: "A single Postgres primary is at 40K writes/s and 90% disk, and traffic triples every year.", answer: partitioning, distractors: [replication, caching, storage-engines], why: "Replicas scale reads, not writes or storage. Shard by a key that keeps queries local."}
  - {prompt: "After editing their bio, users sometimes see the old one for a few seconds.", answer: replication, distractors: [partitioning, queues, cdn-blob], why: "Reads served by a lagging follower. Give read-your-writes: route the writer's reads to the leader or an up-to-date replica briefly."}
  - {prompt: "Signup is slow because it waits for the welcome email, the CRM sync and an analytics event.", answer: queues, distractors: [dist-transactions, reliability, apis], why: "None of these must finish before responding. Publish an event (via an outbox) and let consumers do the work asynchronously."}
  - {prompt: "A dependency's latency jumps to 10 s and your service runs out of threads, failing even requests that don't use it.", answer: reliability, distractors: [load-balancing, observability, caching], why: "Timeouts inside the budget, a bulkhead per dependency, and a circuit breaker with a fallback."}
  - {prompt: "One partner's nightly batch job hammers the public API and slows it for everyone.", answer: rate-limits-ids, distractors: [load-balancing, caching, queues], why: "Per-key quotas with a token bucket; return 429 with Retry-After so the batch spreads out."}
  - {prompt: "A query filtering by customer and status and sorted by date scans 40M rows.", answer: storage-engines, distractors: [partitioning, caching, datastores], why: "A composite index (customer_id, status, created_at): equality columns first, then the sort column."}
  - {prompt: "Two people in different regions edit the same field at once and one edit silently disappears.", answer: consistency, distractors: [consensus, partitioning, rate-limits-ids], why: "Concurrent writes resolved by last-writer-wins. Detect conflicts with versions, merge with CRDTs, or give each record a home region."}
  - {prompt: "Customers report failures, yet every dashboard is green and CPU and memory look normal.", answer: observability, distractors: [reliability, load-balancing, caching], why: "Monitoring measures causes, not user symptoms. Define SLIs from the user's view and alert on SLO burn."}
  - {prompt: "Product wants typo-tolerant full-text search over 50M listings.", answer: datastores, distractors: [storage-engines, caching, partitioning], why: "Add a search engine (inverted index) fed by CDC from the source of truth; don't bend the OLTP database into one."}
  - {prompt: "A mobile app retries POST /payments after a timeout and some customers are charged twice.", answer: apis, distractors: [dist-transactions, queues, consistency], why: "The API must be idempotent: the client sends an Idempotency-Key, and the server stores and replays the first result."}
  - {prompt: "Instances added during a spike receive almost no traffic from existing gRPC clients.", answer: load-balancing, distractors: [partitioning, reliability, apis], why: "Long-lived HTTP/2 connections pin to old instances. Balance per request at L7, or cap connection age."}
  - {prompt: "Could the 2 TB working set be served from memory at 300K reads/s, and on how many machines?", answer: estimation, distractors: [caching, partitioning, storage-engines], why: "A sizing question first: RAM per node, ops per node, replicas. Then decide between caching and partitioning."}
  - {prompt: "One celebrity's data overloads a single shard while the rest of the cluster idles.", answer: partitioning, distractors: [replication, load-balancing, consensus], why: "A hot key. Split it (salt the key into N sub-keys), give it dedicated capacity, or cache it in-process."}
  - {prompt: "Users upload 4 GB videos and the API servers run out of memory.", answer: cdn-blob, distractors: [load-balancing, queues, apis], why: "Bytes shouldn't pass through the API. Use presigned multipart uploads straight to object storage."}
  - {prompt: "After a bug fix, analytics must reprocess the last three days of events.", answer: queues, distractors: [observability, datastores, dist-transactions], why: "A retained log (Kafka) lets a consumer group reset its offsets and replay; a delete-on-ack queue can't."}
  - {prompt: "500 servers must each generate unique, roughly time-ordered 64-bit IDs without a central database.", answer: rate-limits-ids, distractors: [consensus, partitioning, storage-engines], why: "Snowflake-style IDs: timestamp + worker ID + sequence, with worker IDs assigned once."}
  - {prompt: "Writes must keep being accepted even when an AZ is cut off; occasional stale reads are acceptable.", answer: consistency, distractors: [consensus, load-balancing, partitioning], why: "A PA choice under PACELC: favor availability, accept eventual consistency, and reconcile afterwards."}
  - {prompt: "Two users booked the same seat even though the booking service checked availability first.", answer: consistency, distractors: [caching, replication, queues], why: "Check-then-act on a stale read. Enforce the invariant in the write itself: a conditional update or unique constraint."}
  - {prompt: "The database failed over and 3 seconds of acknowledged orders vanished.", answer: replication, distractors: [consensus, reliability, dist-transactions], why: "Async replication's RPO. Use semi-sync or quorum commit for the replica that can be promoted."}
  - {prompt: "A time-series workload of 1M inserts/s on B-tree indexes saturates the disks with random writes.", answer: storage-engines, distractors: [partitioning, caching, load-balancing], why: "An LSM engine turns random writes into sequential appends, with time-bucketed partitions and TTL compaction."}
