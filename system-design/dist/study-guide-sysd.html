te latency"], "rows": [["**Async**", "Leader's local commit", "Seconds of writes can be lost", "Lowest"], ["**Semi-sync**", "One follower has it", "Zero for single failures", "+1 RTT to the nearest follower"], ["**Sync to all**", "Every replica", "Zero", "Slowest replica's latency; any replica down blocks writes"], ["**Majority (quorum)**", "⌊N/2⌋ + 1 replicas", "Zero for minority failures", "Median replica latency"]]}], "pitfalls": ["**Read-your-writes violations.** A user updates their profile, the next request reads a lagging follower, and the old value is back. Route that user's reads to the leader for a short window, or read from a replica at least as new as their last write position.", "**Monotonic-read violations.** Successive reads hit different followers and data appears to go backwards. Pin a user to one replica (hash user → replica).", "**Split brain.** A partitioned old leader keeps accepting writes after a new one is elected. Use consensus-based election and fencing tokens / STONITH so only one leader can write.", "**Async failover loses acknowledged writes.** Promoting a lagging follower silently discards the old leader's tail, and auto-increment IDs may be reused. Know your RPO and say it.", "**Replicas as backups.** A bad `DELETE` replicates everywhere in milliseconds. You still need point-in-time backups."], "depth": ["**Quorums aren't linearizable by themselves:** with W + R > N you can still see anomalies (sloppy quorums, concurrent writes, read repair races). Dynamo-style stores give eventual consistency with tunable staleness, not strong consistency.", "**Conflict resolution in multi-leader:** last-writer-wins silently drops data under clock skew. Use version vectors to detect concurrency, CRDTs for mergeable types (counters, sets), or route each record to a home region to avoid conflicts entirely.", "**Log shipping options:** physical WAL (exact, version-coupled), logical / row-based (portable, feeds CDC), statement-based (non-deterministic functions break it).", "**Lag is a capacity signal:** replicas that can't keep up during peaks will serve ever-staler reads. Alert on lag in seconds and in bytes, and shed read traffic from lagging replicas.", "**Multi-region choices:** single write region + read replicas (simple, cross-region write latency for remote users), or partition data by home region (writes stay local), or a global consensus database (Spanner) that pays an RTT per commit."], "checks": [{"q": "N = 5 replicas. You want writes to survive 2 node failures and reads to always overlap the latest write. Choose W and R.", "given": {"n": 5}, "calc": [{"name": "w", "ask": "W: a majority, so writes survive 2 nodes down", "unit": "", "expr": "n // 2 + 1", "show": "3", "value": 3.0}, {"ask": "Smallest R with W + R > N", "unit": "", "expr": "n - w + 1", "show": "3", "value": 3.0}], "a": "W = 3, R = 3: both are majorities, so any read quorum overlaps any write quorum, and 2 nodes can be down. W = 5 / R = 1 would make every node failure block writes."}, {"q": "A user changes their display name and immediately sees the old one. Reads go to async followers. Fix it without sending all reads to the leader.", "a": "Give read-your-writes for the writer only: after a write, record the leader's log position (or a timestamp) in the session; route that user's reads to a replica that has applied at least that position, or to the leader for a few seconds. Everyone else keeps reading from any follower."}, {"q": "Your leader fails over to an async follower that was 2 seconds behind at 5K writes/s. What did you lose, and how do you prevent it?", "given": {"lag": 2, "rate": 5000}, "calc": [{"ask": "Acknowledged writes lost", "unit": "", "expr": "lag * rate", "show": "10K", "value": 10000.0}], "a": "10K acknowledged writes vanish (and IDs may be reissued). Prevent with semi-sync or quorum commit for the promotion candidate, and only promote a replica that has every acknowledged write."}, {"q": "When would you choose multi-leader replication, and what do you have to design for?", "a": "When users in several regions must write with local latency and keep working through a region partition (e.g. collaborative apps, global user profiles). You must design conflict handling: avoid conflicts by giving each record a home region, or detect them with version vectors and merge (CRDTs, app-specific rules). Never rely on wall-clock LWW for data you can't lose."}]}, {"id": "partitioning", "name": "Partitioning", "signal": ["data or writes beyond one machine", "\"how would you shard this?\"", "hot users / celebrities / viral items", "multi-tenant SaaS", "adding capacity without downtime"], "idea": "Split data so each node owns a subset; it's how writes and storage scale past one machine. The partition key decides everything: it must spread load evenly and keep each common query on one partition. Hash partitioning spreads load but kills range scans; range partitioning keeps order but invites hot spots. Plan resharding from day one.", "diagram": {"type": "arch", "caption": "consistent hashing with virtual nodes", "nodes": {"client": {"label": "Router", "sub": "hash(key) → ring", "at": [0, 1], "kind": "client"}, "a": {"label": "Node A", "sub": "vnodes 0–99", "at": [1, 0], "kind": "db"}, "b": {"label": "Node B", "sub": "vnodes 100–199", "at": [2, 0], "kind": "db"}, "c": {"label": "Node C", "sub": "vnodes 200–299", "at": [3, 0], "kind": "db"}, "d": {"label": "Node D (new)", "sub": "takes ~1/4", "at": [2, 2], "kind": "db"}}, "edges": [["client", "a"], ["client", "b"], ["client", "c"]], "frames": [{"title": "Route", "flow": [["client", "b", "user:42 → vnode 137"]], "hit": ["b"], "note": "The key is hashed onto a ring of many virtual nodes; each physical node owns many small arcs, so load evens out and a slow node's share is small."}, {"title": "Add a node", "flow": [["a", "d"], ["b", "d", "~1/4 of vnodes"], ["c", "d"]], "hit": ["d"], "win": ["a", "b", "c"], "note": "A new node takes a few vnodes from every existing node: only ~1/n of keys move, spread across the cluster. With `hash mod N`, nearly every key would move."}]}, "numbers": [{"k": "Keys moved adding 1 of n nodes", "v": "≈ 1/(n+1) with consistent hashing"}, {"k": "Keys moved with hash mod N", "v": "≈ all of them (N/(N+1))"}, {"k": "Typical shard size target", "v": "~10–100 GB (fast to move/restore)"}, {"k": "Redis Cluster", "v": "16,384 hash slots"}, {"k": "DynamoDB partition", "v": "~1K WCU / 3K RCU / 10 GB each"}], "tables": [{"title": "Strategies", "cols": ["Strategy", "How", "Strengths", "Weaknesses"], "rows": [["**Hash**", "hash(key) mod N, or a hash ring", "Even spread; no hot ranges from sequential keys", "No range scans across keys; resharding moves data"], ["**Range**", "Contiguous key ranges per shard (Bigtable, HBase, CockroachDB)", "Range scans and ordered reads; splits as ranges grow", "Sequential keys (timestamps, auto-increment) all hit the last range"], ["**Directory / lookup**", "A mapping service: key → shard", "Arbitrary placement; move a tenant at will", "Directory is a critical dependency; must be cached and highly available"], ["**Geo / tenant**", "Shard by region or customer", "Data locality and residency; tenant isolation", "Uneven sizes: one tenant can outgrow a shard"]]}, {"title": "Choosing a key", "cols": ["Workload", "Good key", "Bad key"], "rows": [["Chat messages", "`(conversation_id, time_bucket)`", "`message_id` (scatters a conversation)"], ["User profiles", "`user_id` (hashed)", "`country` (hot shards, uneven)"], ["Time-series metrics", "`(metric, host, day)`", "`timestamp` alone (one hot shard)"], ["Multi-tenant SaaS", "`tenant_id` (+ sub-key for big tenants)", "Random IDs that scatter one tenant's queries"], ["Orders by customer", "`customer_id`", "`order_date`"]]}], "pitfalls": ["**Hash mod N.** Changing N remaps almost every key. Use consistent hashing, a fixed large number of logical shards (e.g. 4,096) mapped onto nodes, or range splits.", "**Monotonic keys in range partitioning.** Timestamps or auto-increment IDs send every insert to the newest range. Prefix with a hash or bucket, or use hash partitioning.", "**Scatter-gather queries.** A query not keyed by the partition key fans out to every shard; p99 becomes the slowest shard's. Model the second access pattern as its own table or a global secondary index.", "**Cross-shard transactions.** Joins and atomic updates across shards are slow and complex. Choose keys so the things updated together live together (a customer's orders with the customer).", "**Celebrity / tenant hot spots.** Hashing spreads keys, not load: one key with 1000× the traffic still lands on one shard. Split hot keys (salt with N suffixes) or give big tenants dedicated shards."], "depth": ["**Logical vs physical shards:** pre-split into many logical shards (more than you need) and map them to physical nodes. Rebalancing moves whole logical shards; no rehashing of keys.", "**Secondary indexes:** local (each shard indexes its own rows: writes cheap, reads scatter) vs global (index partitioned by the indexed value: reads targeted, writes cross shards and are usually async).", "**Resharding online:** double-write or log-tail to the new layout, backfill, verify with checksums, flip reads, then flip writes. Rehearse it; it's the riskiest routine operation in a sharded system.", "**Bounded-load consistent hashing and rendezvous hashing:** cap each node's share at (1 + ε) × average, or pick the highest-scoring node per key; both keep movement small while avoiding overload.", "**Shard-aware request routing:** clients or a proxy cache the shard map and handle `moved` responses (Redis Cluster MOVED/ASK, Vitess VTGate), so the map can change while traffic flows."], "checks": [{"q": "A chat app partitions messages by `message_id` (hashed). Loading a conversation is slow. Why, and what key instead?", "a": "Each conversation's messages are scattered across every shard, so loading the latest 50 is a scatter-gather sorted merge. Partition by `conversation_id` (bucketed by time for very long or very active conversations) with messages clustered by time inside the partition: one shard, one ordered read."}, {"q": "You grow a cache cluster from 10 to 11 nodes. Roughly what fraction of keys move with `hash mod N`, and with consistent hashing?", "given": {"n": 10}, "calc": [{"ask": "Fraction moved with mod N", "unit": "", "expr": "n / (n + 1)", "show": "≈ 0.91", "value": 0.9090909090909091}, {"ask": "Fraction moved with consistent hashing", "unit": "", "expr": "1 / (n + 1)", "show": "≈ 0.09", "value": 0.09090909090909091}], "a": "With mod N about 91% of keys change owner: effectively a cold cache and a stampede on the database. Consistent hashing moves only the ~9% the new node takes over."}, {"q": "A multi-tenant SaaS shards by `tenant_id`. One enterprise tenant now has 40% of all traffic. What do you do?", "a": "Give the big tenant dedicated shards via a directory (tenant → shard set), then partition that tenant internally by a sub-key (e.g. `(tenant_id, project_id)`). Keep small tenants packed together. A directory layer makes moving and isolating tenants an operational task instead of a re-architecture."}, {"q": "Postgres at 8 TB and 40K writes/s needs to grow 5×. How many shards would you plan, assuming ~1 TB and ~10K writes/s per shard comfortably?", "given": {"tb": 8, "wps": 40000, "growth": 5, "tb_per": 1, "wps_per": 10000}, "calc": [{"ask": "Shards needed for storage", "unit": "", "expr": "tb * growth / tb_per", "show": "40", "value": 40.0}, {"ask": "Shards needed for writes", "unit": "", "expr": "wps * growth / wps_per", "show": "20", "value": 20.0}], "a": "Storage dominates: ~40 shards. Pre-split into e.g. 256 or 1,024 logical shards mapped onto ~40 physical nodes, so later growth is moving logical shards, not re-keying."}]}, {"id": "consistency", "name": "Consistency Models", "signal": ["\"what happens during a network partition?\"", "money, inventory, uniqueness", "users seeing stale or out-of-order data", "multi-region writes", "concurrent edits to the same thing"], "idea": "Consistency is a contract about what reads may return while data is replicated. Strong (linearizable) behaves like one copy but costs coordination latency and availability during partitions; eventual consistency is fast and always available but lets readers see stale or reordered data. Senior answers pick the weakest model each operation can tolerate and name the anomalies the users will see.", "numbers": [{"k": "Linearizable write", "v": "≥ 1 quorum RTT (cross-region: ~100+ ms)"}, {"k": "Eventual convergence", "v": "typically ms–seconds"}, {"k": "Clock skew (NTP)", "v": "~1–10 ms; worse during incidents"}, {"k": "Spanner commit wait", "v": "~TrueTime ε (a few ms)"}], "tables": [{"title": "Models, strongest to weakest", "cols": ["Model", "Guarantee", "Typical cost", "Example uses"], "rows": [["**Linearizable**", "Every read sees the latest completed write; one global order", "Consensus / quorum per op; unavailable on the minority side of a partition", "Leader election, locks, unique usernames, balances"], ["**Sequential / serializable**", "One order consistent with each client's order (serializable: transactions as if one at a time)", "Coordination, though not necessarily real-time order", "Database transactions"], ["**Causal**", "Effects never appear before their causes (a reply never before its post)", "Track dependencies (version vectors); available under partition", "Comments, chat, collaborative apps"], ["**Read-your-writes / monotonic reads**", "Session guarantees: you see your own writes; time never goes backwards for you", "Session stickiness or version tracking", "Profiles, settings, carts"], ["**Eventual**", "If writes stop, replicas converge", "Cheapest; always available", "Like counts, view counts, feeds, caches, DNS"]]}, {"title": "CAP and PACELC in one line each", "cols": ["Choice", "During a partition (P)", "Else, normally (E)"], "rows": [["**PC/EC** (Spanner, etcd, ZooKeeper)", "Consistent: minority side refuses", "Consistent: pay coordination latency"], ["**PA/EL** (Cassandra, DynamoDB default, Dynamo-style)", "Available: accept writes, reconcile later", "Low latency: don't wait for all replicas"], ["**PC/EL-ish** (single-leader + async replicas)", "Leader side keeps writing; isolated followers serve stale reads", "Fast local reads, possibly stale"]]}], "pitfalls": ["**Saying \"CAP: pick two\".** Partitions aren't optional; the real choice is consistency vs availability *during* a partition, and latency vs consistency the rest of the time (PACELC).", "**One model for the whole system.** Balances need strong guarantees, like counts don't. Choose per operation and say which is which.", "**Last-writer-wins on wall clocks.** Clock skew silently discards newer writes. Use version numbers, hybrid logical clocks, or conflict-free data types.", "**Check-then-act on stale reads.** Reading availability from a replica, then booking, double-books. Enforce the invariant at the write: a conditional write, unique constraint, or a transaction on the source of truth.", "**Assuming \"strong\" means serializable.** Many databases default to read committed or snapshot isolation, which allow lost updates and write skew. Know your isolation level."], "depth": ["**Isolation anomalies to name:** lost update (fix: `SELECT … FOR UPDATE` or compare-and-set), write skew (two doctors both go off call; fix: serializable or materialize the conflict), phantom reads (range predicate changes).", "**CRDTs:** data types whose concurrent updates merge deterministically (G-counters, OR-sets, sequence CRDTs for text). They give strong eventual consistency without coordination; collaborative editors use them.", "**Hybrid logical clocks and TrueTime:** HLCs order events causally while staying close to wall time (CockroachDB); Spanner's TrueTime bounds clock uncertainty and waits it out to give external consistency.", "**Consistency at the edges:** caches, search indexes and CDNs are eventually consistent views even if the database is strong. The user-visible model is the weakest component on the read path.", "**Making eventual consistency acceptable:** design the UX for it (optimistic UI, \"processing\" states), make operations commutative and idempotent, and run reconciliation jobs that detect and repair divergence."], "checks": [{"q": "A ticketing site reads seat availability from a read replica, then writes the booking to the primary. Two users get the same seat. What's the root cause, and the fix?", "a": "Check-then-act across a stale read: both checks saw the seat free. Reads can stay eventually consistent for browsing, but the invariant must be enforced at the write: a conditional update on the primary (`UPDATE seats SET holder = ? WHERE id = ? AND holder IS NULL`, check rows affected), a unique constraint on (event, seat), or a short-lived hold with a TTL."}, {"q": "Two on-call doctors each check \"at least one other doctor is on call\" and both go off call, under snapshot isolation. Name the anomaly and two fixes.", "a": "Write skew: each transaction read the same set and wrote a different row, so no write-write conflict was detected. Fixes: run it under serializable isolation, or lock the rows read (`SELECT … FOR UPDATE` on the on-call set), or materialize the conflict into one row (an on-call counter with a check constraint)."}, {"q": "A global social app wants likes, comments and account balances (for tipping). Pick a consistency model for each.", "a": "Likes: eventual (counters merged per region, CRDT counter or periodic aggregation); slight lag is invisible. Comments: causal plus read-your-writes, so replies never appear before their parent and authors see their own comment. Balances: strong (linearizable) on a single home region or a consensus database, with idempotent transfer IDs; latency is acceptable for money."}, {"q": "A Raft group spans 3 regions with ~80 ms RTT between them. What is the minimum commit latency for a write from the leader's region?", "given": {"rtt": 80}, "calc": [{"ask": "Commit latency (one majority round trip)", "unit": "ms", "expr": "rtt", "show": "≈ 80 ms", "value": 80.0}], "a": "The leader needs one other region to ack: one cross-region RTT, ~80 ms, plus disk fsyncs. Clients in other regions add their own RTT to the leader. That's the price of linearizable writes across regions; colocate replicas or leaders with users to reduce it."}]}, {"id": "queues", "name": "Queues & Streams", "signal": ["work that can finish later (emails, encoding)", "traffic bursts the backend can't absorb", "one event, many consumers", "decouple services / teams", "\"exactly once\""], "idea": "A queue decouples producers from consumers in time and rate: it absorbs bursts, retries failures and lets each side scale independently. Message queues (SQS, RabbitMQ) hand each message to one worker and delete it on ack; logs (Kafka, Kinesis, Pulsar) keep an ordered, replayable stream that many consumer groups read at their own pace. Delivery is at-least-once in practice, so consumers must be idempotent.", "diagram": {"type": "arch", "caption": "a partitioned log with two consumer groups", "nodes": {"p": {"label": "Producers", "sub": "key = order_id", "at": [0, 1], "kind": "client"}, "log": {"label": "Topic", "sub": "3 partitions", "at": [1, 1], "kind": "queue"}, "g1": {"label": "Billing group", "sub": "3 consumers", "at": [2, 0]}, "g2": {"label": "Analytics", "sub": "group of 1", "at": [2, 2]}, "dlq": {"label": "DLQ", "sub": "dead letters", "at": [3, 0], "kind": "queue"}, "db": {"label": "Billing DB", "at": [3, 1], "kind": "db"}}, "edges": [["p", "log"], ["log", "g1"], ["log", "g2"], ["g1", "dlq"], ["g1", "db"]], "frames": [{"title": "Produce · consume", "flow": [["p", "log", "append"], ["log", "g1", "own offsets"], ["log", "g2", "own offsets"]], "hit": ["log"], "win": ["g1", "g2"], "note": "Producers append; a key always lands in the same partition, so events for one order stay in order. Each group tracks its own offsets; partitions cap the parallelism within a group."}, {"title": "Process · commit", "flow": [["g1", "db", "1 apply (idempotent)"], ["g1", "log", "2 commit offset"]], "hit": ["db"], "win": ["g1"], "note": "Apply the effect, then commit the offset. A crash in between replays the message, so the effect must be idempotent (dedup on event id or an upsert)."}, {"title": "Poison message", "flow": [["g1", "dlq", "N retries"]], "hit": ["dlq"], "win": ["g1"], "note": "A message that always fails would block its partition forever. After bounded retries with backoff, park it in a dead-letter queue, alert, and move on."}]}, "numbers": [{"k": "Kafka partition throughput", "v": "~10 MB/s+ write"}, {"k": "Kafka end-to-end latency", "v": "~5–50 ms"}, {"k": "SQS standard", "v": "near-unlimited TPS; at-least-once, best-effort order"}, {"k": "SQS FIFO", "v": "300 msg/s per group (3K batched); higher in high-throughput mode"}, {"k": "Typical Kafka retention", "v": "7 days (or compacted forever)"}], "tables": [{"title": "Queue vs log", "cols": ["Property", "Message queue (SQS, RabbitMQ)", "Log (Kafka, Kinesis, Pulsar)"], "rows": [["**Consumption**", "Competing consumers; a message goes to one worker", "Consumer groups; every group sees every message"], ["**After processing**", "Acked messages are deleted", "Retained by time or size; replayable"], ["**Ordering**", "None (standard) or per group (FIFO)", "Per partition, by key"], ["**Scaling consumers**", "Add workers freely", "Up to the partition count per group"], ["**Per-message control**", "Visibility timeouts, delays, per-message retry, DLQ", "Offset per partition; a stuck message blocks its partition"], ["**Best for**", "Task queues, jobs, uneven work items", "Event streams, CDC, fan-out to many systems, replay / backfill"]]}, {"title": "Delivery semantics", "cols": ["Semantic", "How", "Risk"], "rows": [["**At-most-once**", "Commit before processing", "Crashes lose messages"], ["**At-least-once**", "Commit after processing", "Duplicates on retry: consumers must be idempotent"], ["**Effectively-once**", "At-least-once + idempotent writes, or transactional read-process-write (Kafka transactions)", "Only within the system's boundary; external side effects (email, payment API) still need dedup keys"]]}], "pitfalls": ["**Believing in exactly-once delivery.** Networks make duplicates unavoidable. Build idempotent consumers: dedup table on event id, upserts, or conditional writes.", "**Too few partitions.** Consumer parallelism is capped by partitions, and adding them later reshuffles key → partition (breaking per-key order). Size partitions for peak consumer count.", "**Hot partition keys.** Keying by `customer_id` puts a whale customer's whole load on one partition and one consumer. Add a sub-key, or accept loss of strict per-customer order.", "**No backpressure.** An unbounded queue hides an outage until it holds days of backlog and latency is hours. Alert on consumer lag in time, and shed or degrade at the producer.", "**Long processing under a visibility timeout.** If work exceeds the timeout, the message reappears and two workers process it. Extend visibility (heartbeat) or keep tasks small."], "depth": ["**Transactional outbox:** write business data and an `outbox` row in one DB transaction; a relay (or CDC) publishes outbox rows. This removes the dual-write gap between DB and broker.", "**Ordering vs parallelism:** order is per partition, so pick the key that defines what must be ordered (an account, an order), nothing broader. Within a consumer, process keys in parallel but each key serially.", "**Retry topology:** immediate retries for transient errors, delayed retry topics (1 min, 10 min, 1 h) for flaky dependencies, then DLQ. Never block the main partition while waiting.", "**Log compaction:** keep only the latest value per key forever, making the topic a changelog you can rebuild state from (Kafka Streams state stores, CDC topics).", "**Queues as load levelers:** size consumers for average plus margin, not peak; the queue absorbs peaks. Lag SLOs (e.g. emails within 5 min) define how much backlog is acceptable."], "checks": [{"q": "An order service writes the order to Postgres, then publishes `OrderCreated` to Kafka. Occasionally the event is missing. Why, and how do you fix it?", "a": "Dual write: a crash or broker error between the commit and the publish loses the event (or the reverse order publishes events for rolled-back orders). Use a transactional outbox: insert the event into an outbox table in the same transaction as the order; a relay or CDC (Debezium) publishes it at least once; consumers dedupe by event id."}, {"q": "A topic gets 120 MB/s at peak. One partition handles ~10 MB/s and one consumer processes ~4 MB/s. How many partitions?", "given": {"peak": 120, "part": 10, "consumer": 4}, "calc": [{"ask": "Partitions for broker throughput", "unit": "", "expr": "peak / part", "show": "12", "value": 12.0}, {"ask": "Partitions so enough consumers can keep up", "unit": "", "expr": "peak / consumer", "show": "30", "value": 30.0}], "a": "Consumers are the bottleneck: at least 30 partitions so 30 consumers can run in parallel. Round up with headroom (e.g. 48) since adding partitions later breaks key ordering."}, {"q": "A payment-notification consumer sometimes sends the same email twice. The queue is at-least-once. Design the fix.", "a": "Make the effect idempotent: before sending, insert `(event_id)` into a processed table with a unique constraint (or use the email provider's idempotency key); skip on conflict. Do the insert and the send in an order that's safe on crash: record 'sending', send with an idempotency key, then mark 'sent', so a retry can't double-send."}, {"q": "When would you use SQS instead of Kafka?", "a": "For independent work items: each job goes to one worker, needs per-message retries, delays and DLQs, and you don't need replay or multiple consumer groups (e.g. image resizing, sending emails). Kafka fits event streams consumed by several systems, ordered per key, with replay and long retention."}]}, {"id": "dist-transactions", "name": "Distributed Transactions", "signal": ["one action updates several services or databases", "order → payment → inventory → shipping", "\"what if step 3 fails?\"", "money must not be lost or doubled", "DB write + message publish"], "idea": "Once data lives in several services, there is no single ACID transaction to lean on. Two-phase commit gives atomicity but blocks on coordinator failure and couples availability; sagas break the work into local transactions with compensating actions, accepting temporary inconsistency. Most production systems use sagas + outbox + idempotency, and reserve 2PC for inside one database or tightly coupled stores.", "diagram": {"type": "arch", "caption": "an orchestrated saga for placing an order", "nodes": {"orch": {"label": "Order saga", "sub": "orchestrator", "at": [0, 1]}, "pay": {"label": "Payments", "at": [1, 0]}, "inv": {"label": "Inventory", "at": [1, 1]}, "ship": {"label": "Shipping", "at": [1, 2]}, "log": {"label": "Saga log", "at": [2, 1], "kind": "db"}}, "edges": [["orch", "pay"], ["orch", "inv"], ["orch", "ship"], ["orch", "log"]], "frames": [{"title": "Happy path", "flow": [["orch", "inv", "1 reserve"], ["orch", "pay", "2 charge"], ["orch", "ship", "3 create"]], "hit": ["inv", "pay", "ship"], "note": "Each step is a local transaction in its own service, invoked with an idempotency key. The orchestrator persists its state after each step so it can resume after a crash."}, {"title": "Failure · compensate", "flow": [["orch", "ship", "3 create ✗"], ["orch", "pay", "4 refund"], ["orch", "inv", "5 release"]], "win": ["pay", "inv"], "note": "Shipping fails permanently, so the orchestrator runs compensations in reverse: refund, release stock. Compensations are semantic undos (a refund, not a deleted charge) and must also be idempotent."}]}, "numbers": [{"k": "2PC round trips", "v": "2 (prepare, commit) + log fsyncs"}, {"k": "Typical saga steps", "v": "3–8 local transactions"}, {"k": "Idempotency key retention", "v": "≥ max retry window (~24 h–7 d)"}], "tables": [{"title": "Approaches", "cols": ["Approach", "How", "Strengths", "Weaknesses"], "rows": [["**2PC / XA**", "Coordinator asks all to prepare (lock + log), then commits or aborts all", "Atomic; isolated", "Blocking if the coordinator dies after prepare; locks held across network calls; every participant must support it"], ["**Saga (orchestrated)**", "A central workflow calls each step and its compensation", "Clear flow, state and timeouts in one place; easier to reason about", "Orchestrator is a component to run; risk of a god service"], ["**Saga (choreographed)**", "Services react to each other's events", "Loose coupling; no central component", "Flow is implicit and spread out; hard to trace, change and debug"], ["**Outbox + CDC**", "Local transaction writes data + event; relay publishes", "Removes the DB/broker dual write", "At-least-once: consumers must dedupe"], ["**Single DB / NewSQL**", "Keep data that must change atomically in one transactional store", "Real ACID, simplest correctness", "Couples services; Spanner-class stores add commit latency"]]}], "pitfalls": ["**Compensations that can't undo.** You can't unsend an email or unship a parcel. Order steps so irreversible ones come last, after the risky ones (reserve, then charge, then ship).", "**Non-idempotent steps.** Sagas retry. Every step and compensation needs an idempotency key, or a retry double-charges.", "**Missing isolation.** Between steps, other requests see intermediate state (stock reserved, payment pending). Use semantic locks (`PENDING` states), and design reads to tolerate them.", "**Distributed transactions for everything.** If two entities must always change together, they probably belong in the same service and database. Fix the boundary before adding coordination.", "**No timeouts or stuck-saga handling.** A saga waiting on a lost reply hangs forever. Persist deadlines, retry, and escalate to compensation or manual review."], "depth": ["**Workflow engines (Temporal, Step Functions, Cadence):** durable execution of saga code with persisted state, retries, timers and history; the orchestrator becomes ordinary code that survives crashes.", "**Pivot transaction:** the step after which the saga can only go forward (e.g. capture payment). Steps before it are compensatable, steps after must be retryable until they succeed.", "**Reservation pattern (TCC: try-confirm-cancel):** each participant first places a time-limited hold, then confirms or cancels. Holds expire on their own, which bounds the damage of a lost coordinator.", "**Exactly-once effects across a boundary:** idempotency keys in the downstream API (Stripe-style), dedup tables keyed by message id, and upserts. 'Exactly once' is always 'at least once + idempotent'.", "**Reconciliation:** even with sagas, run periodic jobs that compare ledgers across services (orders vs payments vs shipments) and flag or repair mismatches. Auditors and finance will ask for it."], "checks": [{"q": "Order flow: reserve inventory, charge card, create shipment. Shipment creation fails permanently. What happens in a saga, and in what order should steps be?", "a": "The orchestrator runs compensations in reverse: refund (or void the authorization), then release the reservation, and marks the order failed. Order steps so cheap, reversible ones go first (reserve) and irreversible ones last; better still, authorize the card early and capture only after the shipment is created, making the capture the pivot."}, {"q": "Why is 2PC rarely used across microservices?", "a": "Participants hold locks from prepare until commit, across network calls, so latency and contention grow; if the coordinator fails after prepare, participants block holding locks until it recovers. Availability becomes the product of every participant's availability, and many stores (queues, third-party APIs) can't participate at all."}, {"q": "A saga has 4 steps, each with 99.9% success per attempt and up to 3 attempts. What fraction of sagas reach compensation?", "given": {"p": 0.999, "attempts": 3, "steps": 4}, "calc": [{"name": "fail_step", "ask": "Chance one step fails all attempts", "unit": "", "expr": "(1 - p) ** attempts", "show": "1e-9", "value": 1.0000000000000028e-09}, {"ask": "Chance any step fails (≈ steps × that)", "unit": "", "expr": "1 - (1 - fail_step) ** steps", "show": "4e-9", "value": 3.999999886872274e-09}], "a": "Retries make transient failures vanish (if failures are independent, which outages aren't). Compensation is for permanent failures: declined cards, out of stock, validation errors, so design for those, not for the network."}, {"q": "How do you make sure a charge happens at most once when the orchestrator crashes and retries the 'charge' step?", "a": "Pass a stable idempotency key per saga step (e.g. `order-123:charge`) to the payment service, which stores key → result and returns the stored result on retries. The orchestrator persists that it issued the step before calling, and on recovery replays the same key rather than generating a new one."}]}, {"id": "consensus", "name": "Consensus & Coordination", "signal": ["exactly one leader / scheduler / owner", "distributed lock", "cluster membership and configuration", "\"what if two nodes both think they're primary?\"", "strongly consistent metadata"], "idea": "Consensus (Raft, Paxos, Zab) lets a group of nodes agree on an ordered log of decisions despite crashes, as long as a majority is up and talking. You rarely implement it: you use a coordination service (etcd, ZooKeeper, Consul) or a database built on it for leader election, locks, membership and small critical metadata. The hard part is not electing a leader but stopping the old one: leases and fencing tokens.", "diagram": {"type": "arch", "caption": "a lease-based leader and fencing tokens", "nodes": {"a": {"label": "Worker A", "sub": "old leader", "at": [0, 0]}, "b": {"label": "Worker B", "sub": "new leader", "at": [0, 2]}, "etcd": {"label": "etcd / ZK", "sub": "3–5 nodes · Raft", "at": [1, 1], "kind": "db"}, "store": {"label": "Storage", "sub": "checks token", "at": [2, 1], "kind": "db"}}, "edges": [["a", "etcd"], ["b", "etcd"], ["a", "store"], ["b", "store"]], "frames": [{"title": "Acquire", "flow": [["a", "etcd", "lease · token 33"], ["a", "store", "write (33)"]], "hit": ["a"], "win": ["etcd"], "note": "A holds a lease (TTL ~10 s, renewed by heartbeats) and gets a monotonically increasing token, 33. Every write it makes carries the token."}, {"title": "Pause · new leader", "flow": [["b", "etcd", "lease · token 34"], ["b", "store", "write (34)"]], "hit": ["b"], "win": ["etcd"], "note": "A stalls in a 30 s GC pause; its lease expires and B becomes leader with token 34. Storage now remembers 34 as the highest token seen."}, {"title": "Fenced", "flow": [["a", "store", "write (33) ✗"]], "win": ["store"], "note": "A wakes up still believing it's leader and writes with 33. Storage rejects any token lower than one it has seen. Without fencing, both A and B would write: split brain."}]}, "numbers": [{"k": "Cluster size", "v": "3 (tolerates 1) or 5 (tolerates 2)"}, {"k": "Write latency", "v": "1 majority RTT + fsync (~ms in one region)"}, {"k": "etcd practical limits", "v": "~10K writes/s; data ≤ ~8 GB"}, {"k": "Election timeout", "v": "~150–300 ms (Raft default range)"}, {"k": "Typical lease TTL", "v": "~5–30 s"}], "tables": [{"title": "Coordination primitives", "cols": ["Need", "Primitive", "Notes"], "rows": [["**Leader election**", "Lease on a key (etcd lease, ZK ephemeral node)", "Leader must stop work when it can't renew; pair with fencing"], ["**Mutual exclusion**", "Lock = lease + fencing token", "Locks for correctness need fencing; locks for efficiency (avoid duplicate work) can be best-effort"], ["**Membership / discovery**", "Ephemeral registrations + watches", "Consul / ZK / etcd; or gossip (SWIM) for large, eventually consistent membership"], ["**Configuration**", "Versioned keys + watches", "Small data only; push changes to clients"], ["**Unique sequence / ID ranges**", "Atomic compare-and-set on a counter", "Lease ranges, not single IDs, to keep load low"]]}, {"title": "Locks you might be offered", "cols": ["Option", "Safe for correctness?", "Why"], "rows": [["**etcd / ZooKeeper lock + fencing**", "Yes", "Linearizable store, sessions, monotonic revision usable as a token"], ["**DB row lock / advisory lock**", "Yes, within that DB", "The DB is the authority; the lock dies with the session"], ["**Redis `SET NX PX` (single node)**", "Efficiency only", "Lost on failover with async replication; no fencing"], ["**Redlock (multi-node Redis)**", "Debated: not without fencing", "Relies on timing assumptions; pauses and clock jumps break it"]]}], "pitfalls": ["**Locks without fencing.** A paused process (GC, VM migration, network) outlives its lease and keeps acting. Only the resource checking a token can make it safe.", "**Even-sized clusters.** 4 nodes tolerate 1 failure, like 3, but need a larger majority. Use 3 or 5; 7+ only adds write latency.", "**Using the coordination service as a database.** etcd and ZooKeeper are for small, critical metadata. Bulk data or high write rates destabilize the cluster everything else depends on.", "**Stretching consensus across distant regions casually.** Every write pays a cross-region majority RTT, and a partition leaves the minority side read-only.", "**Assuming clocks are synchronized.** Leases work on durations measured locally, not timestamps compared across machines; NTP jumps and pauses still need fencing."], "depth": ["**Raft in a paragraph:** a leader appends entries and replicates them; an entry commits when a majority has it; elections use randomized timeouts and terms; a node votes only for candidates whose log is at least as up to date. Committed entries are never lost while a majority survives.", "**FLP and the practical way out:** no deterministic algorithm guarantees consensus in a fully asynchronous system with one crash. Real systems use timeouts (partial synchrony): safety always holds, liveness needs the network to behave.", "**Read paths:** linearizable reads need either a quorum read, a leader lease, or a read index round; follower reads are cheaper but may be stale.", "**Sharded consensus:** large systems (Spanner, CockroachDB, TiKV) run thousands of small Raft groups, one per range, rather than one giant group.", "**Avoid needing consensus:** single-writer designs (partition ownership), idempotent operations, and CRDTs often remove the need for coordination on the hot path, keeping it for rare control-plane decisions."], "checks": [{"q": "A cron-like scheduler runs on 3 nodes and must fire each job exactly once. How do you design it?", "a": "Elect one active scheduler with a lease in etcd/ZooKeeper; the others stand by and watch the key. The leader fires jobs, recording each run with a unique `(job, scheduled_time)` key under a unique constraint, so a duplicate fire after a failover is rejected. Workers execute idempotently. The lease plus the dedup key (a form of fencing) give effectively-once firing even if two leaders overlap briefly."}, {"q": "A 5-node Raft cluster loses 2 nodes. Can it still accept writes? What about losing 3?", "given": {"n": 5}, "calc": [{"ask": "Majority size", "unit": "", "expr": "n // 2 + 1", "show": "3", "value": 3.0}, {"ask": "Failures tolerated", "unit": "", "expr": "n - (n // 2 + 1)", "show": "2", "value": 2.0}], "a": "With 2 down, 3 remain, still a majority: writes continue. With 3 down, the 2 survivors can't form a majority, so the cluster stops accepting writes (it stays safe, not available)."}, {"q": "A team uses a Redis `SET NX` lock with a 10 s TTL to ensure only one worker updates a customer's balance. What can go wrong and what would you do?", "a": "A worker pauses past the TTL, another acquires the lock, and both write: lost updates. Redis failover with async replication can also forget the lock. For correctness, enforce it at the data: a conditional update (`WHERE version = ?`), a DB row lock, or a fencing token checked by the store. Keep the Redis lock only as an efficiency hint."}, {"q": "Why do coordination services recommend 3 or 5 nodes, not 2 or 4?", "a": "A cluster needs a strict majority. 2 nodes tolerate 0 failures (both needed); 4 tolerate 1, the same as 3, but every write waits for 3 acks instead of 2. Odd sizes maximize failures tolerated per node; 5 is the usual choice when you must survive two failures or one failure during maintenance."}]}, {"id": "rate-limits-ids", "name": "Rate Limiting & Unique IDs", "signal": ["public API or login endpoint", "protect a backend from bursts or abuse", "per-user / per-tenant quotas", "IDs generated on many servers", "IDs that sort by time"], "idea": "Two small building blocks that show up in almost every design. Rate limiting decides how much each client may do per unit of time; the algorithm sets burst behavior, and the hard part is a shared, low-latency counter across many servers. Unique IDs must be generated without coordination on the hot path; time-ordered IDs (Snowflake, UUIDv7) also keep B-tree inserts sequential and make IDs roughly sortable.", "diagram": {"type": "arch", "caption": "a token bucket shared through Redis", "nodes": {"client": {"label": "Client", "sub": "API key k", "at": [0, 1], "kind": "client"}, "gw": {"label": "Gateway", "sub": "limiter", "at": [1, 1]}, "redis": {"label": "Redis", "sub": "bucket:k", "at": [2, 0], "kind": "cache"}, "api": {"label": "Service", "at": [2, 2]}}, "edges": [["client", "gw"], ["gw", "redis"], ["gw", "api"]], "frames": [{"title": "Allowed", "flow": [["client", "gw", "request"], ["gw", "redis", "take 1 (Lua)"], ["gw", "api", "forward"]], "hit": ["api"], "win": ["redis"], "note": "One atomic script refills tokens for elapsed time (rate × Δt, capped at the burst size), takes one if available, and returns the remaining count."}, {"title": "Limited", "flow": [["client", "gw", "request"], ["gw", "redis", "empty"], ["gw", "client", 429]], "win": ["redis", "gw"], "note": "No token: reply `429 Too Many Requests` with `Retry-After`. The backend never sees the request."}]}, "numbers": [{"k": "Redis round trip", "v": "~0.2–1 ms per check"}, {"k": "Snowflake layout", "v": "41 b ms time · 10 b worker · 12 b sequence"}, {"k": "Snowflake per worker", "v": "4,096 IDs per ms"}, {"k": "41-bit ms timestamp", "v": "~69 years from the epoch"}, {"k": "UUIDv4 collision", "v": "negligible (122 random bits)"}], "tables": [{"title": "Rate-limit algorithms", "cols": ["Algorithm", "How", "Bursts", "Memory / cost"], "rows": [["**Token bucket**", "Tokens refill at rate r up to capacity b; each request takes one", "Allows bursts up to b, then r", "2 numbers per key; the common default (AWS, Stripe)"], ["**Leaky bucket**", "Requests queue and drain at a fixed rate", "Smooths output; no bursts", "A queue per key; adds latency"], ["**Fixed window**", "Count per calendar window (per minute)", "Up to 2× the limit across a window boundary", "1 counter; simplest"], ["**Sliding window log**", "Store every request timestamp; count those in the last window", "Exact", "O(requests) memory per key"], ["**Sliding window counter**", "Weighted blend of current and previous fixed windows", "Close to exact", "2 counters; good accuracy/cost trade-off"]]}, {"title": "ID schemes", "cols": ["Scheme", "Sortable by time?", "Coordination", "Notes"], "rows": [["**DB auto-increment**", "Yes", "Single DB (or one per shard with offsets)", "Simple; leaks volume; a write bottleneck and SPOF at scale"], ["**UUIDv4**", "No", "None", "128 bits; random inserts fragment B-trees"], ["**UUIDv7 / ULID**", "Yes (ms)", "None", "128 bits, time prefix + random; index-friendly"], ["**Snowflake**", "Yes (ms)", "Worker ID assignment only", "64 bits fit a BIGINT; needs sane clocks"], ["**Range leases**", "Roughly", "Rare (one call per block)", "Compact sequential integers; a crash wastes part of a block"]]}], "pitfalls": ["**Limiting per server instead of globally.** With 20 servers and a local limit of 100/s, a client gets 2,000/s. Share state (Redis) or divide the limit by the instance count and accept imprecision.", "**Non-atomic read-then-write counters.** `GET` then `SET` lets concurrent requests all pass. Use `INCR` with expiry or a Lua script.", "**The limiter as a single point of failure.** If Redis is down, decide in advance: fail open (availability) for general APIs, fail closed for login and abuse-sensitive endpoints.", "**Keying by IP alone.** NAT and mobile carriers put thousands of users behind one IP, while attackers rotate IPs. Prefer API key / user id, with IP limits as a coarse outer layer.", "**Clock rollback with Snowflake.** If the clock goes backwards, IDs can repeat. Refuse to issue (or wait) until time passes the last timestamp used."], "depth": ["**Layered limits:** per-IP at the edge (cheap, coarse), per-user / per-key at the gateway (product quotas), per-dependency concurrency limits inside services (protect databases). Each answers a different threat.", "**Approximate local + periodic sync:** for very high rates, each node keeps local counters and syncs deltas to a central store every ~100 ms; small over-admission traded for no per-request round trip.", "**Adaptive concurrency limits:** instead of fixed rates, limit in-flight requests based on observed latency (TCP-Vegas-style, Netflix concurrency-limits). They protect a service whose capacity changes.", "**Multi-region limits:** per-region budgets (global limit ÷ regions) with occasional rebalancing beat a single global counter with cross-region latency on every request.", "**Worker IDs for Snowflake:** assign them via a coordination service with leases, or derive from a stable pod ordinal; two live workers with the same ID produce duplicates."], "checks": [{"q": "An API allows 100 requests/minute per key with fixed windows. How many requests can a client make within ~1 second around a window boundary? How do you fix it?", "a": "Up to 200: 100 in the last second of one window and 100 in the first second of the next. Use a sliding window counter (weight the previous window by its overlap) or a token bucket with rate 100/min and a chosen burst size, which states burst behavior explicitly."}, {"q": "A Snowflake worker can issue 4,096 IDs per ms. How many IDs per second is that per worker, and with 1,024 workers?", "given": {"per_ms": 4096, "workers": 1024}, "calc": [{"name": "per_s", "ask": "Per worker per second", "unit": "/s", "expr": "per_ms * 1000", "show": "≈ 4.1M/s", "value": 4096000.0}, {"ask": "Whole cluster per second", "unit": "/s", "expr": "per_s * workers", "show": "≈ 4.2B/s", "value": 4194304000.0}], "a": "Throughput is never the limit; correctness is: unique worker IDs and a monotonic clock. A burst beyond 4,096 in one ms just waits for the next millisecond."}, {"q": "The login endpoint must resist credential stuffing from a botnet using 50K IPs. What limits do you apply?", "a": "Per-account failed-attempt limits (with exponential backoff or temporary lock and notification), per-IP and per-ASN/subnet limits at the edge, and global anomaly limits on failures per minute that trigger CAPTCHA or step-up auth. The limiter fails closed for this endpoint. Track by username too, since the botnet spreads across IPs but targets the same accounts."}, {"q": "Why do UUIDv4 primary keys slow inserts compared with UUIDv7?", "a": "v4 is uniformly random, so each insert lands on a random leaf page of the B-tree: page splits, poor cache locality and write amplification as the index outgrows memory. v7 starts with a millisecond timestamp, so new keys append near the right edge of the index; the hot pages stay in cache."}]}, {"id": "reliability", "name": "Reliability Patterns", "signal": ["\"what happens when X is slow or down?\"", "many service-to-service calls", "cascading failures / retry storms", "SLA of 99.9%+", "graceful degradation"], "idea": "Distributed systems fail partially: a dependency is slow, not dead, and slowness spreads through blocked threads and retries. Reliability comes from bounding everything (timeouts, retries, queues, concurrency), isolating failures (bulkheads, circuit breakers, cells), and degrading deliberately (serve stale, drop optional features, shed low-priority load) instead of falling over.", "diagram": {"type": "arch", "caption": "protecting a caller from a failing dependency", "nodes": {"client": {"label": "Client", "at": [0, 1], "kind": "client"}, "svc": {"label": "Product page", "sub": "caller", "at": [1, 1]}, "reco": {"label": "Recommender", "sub": "optional", "at": [2, 0]}, "price": {"label": "Pricing", "sub": "critical", "at": [2, 2]}, "cache": {"label": "Stale cache", "sub": "fallback", "at": [2, 1], "kind": "cache"}}, "edges": [["client", "svc"], ["svc", "reco"], ["svc", "price"], ["svc", "cache"]], "frames": [{"title": "Healthy", "flow": [["client", "svc", "GET"], ["svc", "reco", "timeout 100 ms"], ["svc", "price", "timeout 200 ms"]], "hit": ["reco", "price"], "note": "Each call has a timeout well inside the caller's own budget, its own connection pool (bulkhead) and at most one retry with jittered backoff."}, {"title": "Reco degraded", "flow": [["client", "svc", "GET"], ["svc", "cache", "read"], ["svc", "price", "timeout 200 ms"]], "hit": ["cache", "price"], "win": ["reco"], "note": "Recommendations time out repeatedly, so the circuit breaker opens: calls fail fast for ~30 s, the page renders with cached or generic recommendations, and the breaker probes with a few half-open requests before closing."}]}, "numbers": [{"k": "99.9% / 99.99% per month", "v": "43 min / 4.3 min downtime"}, {"k": "Retry budget", "v": "retries ≤ ~10% of requests"}, {"k": "Backoff", "v": "base × 2ⁿ, capped, full jitter"}, {"k": "Breaker trip", "v": "e.g. ≥ 50% errors over ≥ 20 calls in 10 s"}, {"k": "Target utilization", "v": "~50–70% at peak per instance"}], "tables": [{"title": "Patterns", "cols": ["Pattern", "Prevents", "How", "Watch out"], "rows": [["**Timeouts + deadlines**", "Threads blocked forever on a slow dependency", "Per-call timeout; propagate the remaining deadline downstream", "Timeouts longer than the caller's own budget are useless"], ["**Retries with backoff + jitter**", "Failing on transient errors", "Retry idempotent calls a bounded number of times, with exponential backoff and jitter", "Retry storms; retry at one layer only; use a retry budget"], ["**Circuit breaker**", "Hammering a dependency that's down; wasting time on doomed calls", "Open after an error threshold; fail fast; half-open probes", "Needs a fallback; per-host vs per-service granularity"], ["**Bulkhead**", "One slow dependency exhausting all threads / connections", "Separate pools or concurrency limits per dependency or tenant", "Under-sized pools reject healthy traffic"], ["**Load shedding**", "Overload collapsing everything", "Reject early (503) by priority when queues or latency exceed limits", "Shed cheap-to-reject work first; protect health checks"], ["**Graceful degradation**", "Total outage from a non-critical failure", "Fallbacks: stale cache, defaults, hide the feature", "Fallback paths rot if never exercised"], ["**Cell / shard isolation**", "Global blast radius", "Independent copies of the stack, each serving a subset of users", "Routing layer and cross-cell operations"]]}], "pitfalls": ["**Retries at every layer.** 3 layers each retrying 3× turns one user request into 27 calls on the failing service. Retry at the edge or the immediate caller only, and cap with a budget.", "**Retrying non-idempotent calls.** A timeout doesn't mean it failed. Retry only idempotent operations or those carrying an idempotency key.", "**Missing jitter.** Synchronized retries arrive in waves that re-break the recovering service. Full jitter: sleep random(0, base × 2ⁿ).", "**Health checks that cascade.** If every instance's health check depends on the DB, a DB blip removes the whole fleet from the LB. Liveness checks the process; readiness checks only what the instance itself needs.", "**Untested failover.** A standby, a fallback or a backup that's never exercised fails when needed. Practice: game days, chaos experiments, restore drills."], "depth": ["**Metastable failures:** a trigger (spike, slow dependency) pushes a system into a state where retries, cache misses or queue backlog keep it overloaded after the trigger is gone. Fixes are about removing the feedback loop: retry budgets, shedding, cold-cache protection.", "**Deadline propagation:** pass the absolute deadline (gRPC deadlines) so downstream services stop work the caller has already abandoned.", "**Hedged requests:** for latency-critical reads, send a second request after the p95 latency and take the first answer. Cuts tail latency for ~5% extra load; only for idempotent reads.", "**Static stability:** design the data plane to keep working when the control plane (config service, scheduler, auth refresh) is down, using the last known good state.", "**Error budgets drive priorities:** with an SLO of 99.9%, the 0.1% is a budget. Burn it fast and feature releases pause for reliability work; leave it unused and you can ship faster."], "checks": [{"q": "A request passes through 3 services, each retrying failed calls up to 3 times (4 attempts). The bottom service is down. How many calls hit it per user request?", "given": {"attempts": 4, "layers": 3}, "calc": [{"ask": "Calls on the failing service per user request", "unit": "", "expr": "attempts ** layers", "show": "64", "value": 64.0}], "a": "Retries multiply across layers: 4³ = 64× load on a service that's already failing. Retry only at one layer, use a retry budget (e.g. ≤ 10% extra), and open circuit breakers so callers fail fast."}, {"q": "A product page calls 6 services. Recommendations are optional, pricing and inventory are critical. Recommendations become slow (5 s). What should happen?", "a": "A short timeout on recommendations (inside the page's budget), a bulkhead so its slowness can't consume the threads pricing needs, and a circuit breaker that opens and serves a fallback (cached or generic recommendations, or hide the widget). Pricing and inventory keep their own pools and timeouts; the page stays up and fast."}, {"q": "Three serial dependencies each have 99.9% availability. What is the best possible availability of a request that needs all three? What changes with a fallback for one of them?", "given": {"a": 0.999}, "calc": [{"ask": "All three required", "unit": "%", "expr": "a ** 3 * 100", "show": "≈ 99.7%", "value": 99.7002999}, {"ask": "Two required (third has a fallback)", "unit": "%", "expr": "a ** 2 * 100", "show": "≈ 99.8%", "value": 99.8001}], "a": "Serial dependencies multiply downtime. Fallbacks, caches and async processing remove dependencies from the critical path, which is often cheaper than making each one more available."}, {"q": "After a 10-minute outage, the service recovers but immediately falls over again, several times. What's happening, and what breaks the cycle?", "a": "A retry / reconnect storm, or a cold cache: all clients retry at once (plus backlog), and the cold service can't absorb the peak. It's a metastable failure. Break it with jittered exponential backoff and retry budgets on clients, load shedding and admission control on the server, and gradual ramp-up (rate-limited warm-up, slow-start at the LB)."}]}, {"id": "observability", "name": "Observability & Ops", "signal": ["\"how would you know it's broken?\"", "SLAs / SLOs", "latency outliers", "debugging across many services", "safe deploys and rollbacks"], "idea": "You can't operate what you can't see. Metrics tell you that something is wrong (cheap, aggregated), traces tell you where in the request path (sampled, per request), logs tell you why (detailed, expensive). Tie alerts to user-facing SLOs rather than machine symptoms, and ship changes in a way that limits blast radius and makes rollback fast: most outages are caused by changes.", "diagram": {"type": "arch", "caption": "three signals from the same request", "nodes": {"svc": {"label": "Services", "sub": "OTel SDK", "at": [0, 1]}, "col": {"label": "Collector", "sub": "sample · batch", "at": [1, 1]}, "tsdb": {"label": "Metrics", "sub": "Prometheus", "at": [2, 0], "kind": "db"}, "traces": {"label": "Traces", "sub": "Tempo · Jaeger", "at": [2, 1], "kind": "db"}, "logs": {"label": "Logs", "sub": "Loki · ES", "at": [2, 2], "kind": "db"}, "alert": {"label": "Alerting", "sub": "SLO burn rate", "at": [3, 0]}}, "edges": [["svc", "col"], ["col", "tsdb"], ["col", "traces"], ["col", "logs"], ["tsdb", "alert"]], "frames": [{"title": "Emit", "flow": [["svc", "col", "OTLP"], ["col", "tsdb", "aggregates"], ["col", "traces", "sampled"], ["col", "logs", "structured"]], "win": ["col"], "hit": ["tsdb", "traces", "logs"], "note": "One SDK emits all three, sharing a trace ID. Logs and exemplars carry the trace ID, so you can jump from a latency spike to an example trace to its logs."}, {"title": "Alert", "flow": [["tsdb", "alert", "burn rate"]], "hit": ["alert"], "win": ["tsdb"], "note": "Alert when the error budget burns fast (e.g. 14× the sustainable rate over 1 h), not on CPU at 80%. Symptoms users feel page someone; causes go to dashboards."}]}, "numbers": [{"k": "Golden signals", "v": "latency · traffic · errors · saturation"}, {"k": "Trace sampling", "v": "~1–10% head, or tail-based (keep errors / slow)"}, {"k": "Fast-burn alert", "v": "2% of 30-day budget in 1 h (14.4×)"}, {"k": "Canary", "v": "1–5% traffic for 10–60 min"}, {"k": "High-cardinality labels", "v": "avoid user_id in metrics"}], "tables": [{"title": "Signals", "cols": ["Signal", "Answers", "Cost", "Watch out"], "rows": [["**Metrics**", "Is it broken? How much? Trends, SLOs, capacity", "Cheap: fixed series per label set", "Cardinality explosions (user IDs, URLs in labels); averages hide tails: use histograms"], ["**Traces**", "Where is the time spent? Which hop failed?", "Per request; usually sampled", "Context propagation must cross every hop, including queues"], ["**Logs**", "Why did this request fail? Details and context", "Most expensive at volume", "Structured (JSON) with trace IDs; sample or drop debug logs; never log secrets or PII"], ["**Profiles**", "Which code burns CPU / memory?", "Continuous profilers are cheap now", "Useful for cost and latency work, not alerting"]]}, {"title": "Deploy strategies", "cols": ["Strategy", "How", "Rollback", "Cost"], "rows": [["**Rolling**", "Replace instances in batches", "Roll forward or back in batches (minutes)", "Mixed versions during rollout: must be compatible"], ["**Blue-green**", "Full new stack; flip the LB", "Flip back (seconds)", "2× capacity during the switch; DB schema shared"], ["**Canary**", "Small % of traffic to the new version, compare metrics, then ramp", "Route canary traffic away (seconds)", "Needs good automated comparison of canary vs baseline"], ["**Feature flags**", "Ship dark, enable per cohort", "Turn the flag off (seconds), no deploy", "Flag debt; test both paths"]]}], "pitfalls": ["**Alerting on causes, not symptoms.** CPU at 85% pages someone at night while users are fine; a silent 5% error rate never pages. Page on SLO burn; send causes to dashboards.", "**Averages.** Mean latency hides the slow 1% that real users hit on every page with many calls. Track p50/p95/p99 with histograms, and per endpoint.", "**Unbounded metric cardinality.** Labels like `user_id` or raw URLs create millions of series and take down the metrics system. Bound labels; put high-cardinality detail in traces and logs.", "**Schema changes coupled to deploys.** A deploy that drops a column breaks old instances still running and makes rollback impossible. Expand → migrate → contract across separate releases.", "**No runbooks or ownership.** An alert nobody understands is noise. Every page links to a runbook and an owning team."], "depth": ["**SLIs and SLOs:** SLI = good events / valid events (e.g. requests under 300 ms and not 5xx). SLO = target over a window (99.9% / 30 days). The SLA is the external promise with penalties, set looser than the SLO.", "**Multi-window burn-rate alerts:** page when both a long (1 h) and a short (5 min) window burn fast, so alerts are quick to fire and quick to resolve, with few false pages.", "**Tail-based sampling:** keep 100% of error and slow traces and a small share of normal ones, decided after the trace completes in the collector.", "**Progressive delivery with automated analysis:** canary → 5% → 25% → 100% with automatic rollback on SLO regression; pair with per-cell or per-region rollout so a bad change hits one cell first.", "**Incident practice:** clear roles (incident commander, comms), mitigate first (rollback, failover, shed) and diagnose later, blameless postmortems with tracked action items."], "checks": [{"q": "Your SLO is 99.9% of requests successful over 30 days. Traffic is 50M requests/day. How many failed requests is the monthly error budget?", "given": {"daily": "50e6", "days": 30, "slo": 0.999}, "calc": [{"ask": "Monthly error budget", "unit": "requests", "expr": "daily * days * (1 - slo)", "show": "1.5M", "value": 1500000.0000000014}], "a": "1.5M failures a month. A 1-hour incident failing 20% of requests burns ~2M × 0.2 ≈ 420K, over a quarter of the budget. Burn-rate alerts are built on exactly this arithmetic."}, {"q": "p50 latency is 40 ms and steady, but users complain the app feels slow. What do you look at?", "a": "The tail: p95/p99 per endpoint, and per-page fan-out (a page making 30 calls hits the p99 on most loads). Use traces of slow requests to find the hop (GC pauses, a slow shard, lock contention, retries), and break latency down by region, client version and tenant."}, {"q": "A deploy goes out and errors rise 2%. How should your deploy process have limited and handled this?", "a": "Canary first: a small percentage of traffic (ideally one cell or AZ) with automated comparison of error rate and latency against the baseline, auto-rollback on regression. Ship risky behavior behind a feature flag so it can be turned off without a deploy, and keep schema changes backward compatible so rollback is always possible."}, {"q": "Why not put `user_id` as a label on your request-latency metric?", "a": "Each distinct label value creates a separate time series; with millions of users you create millions of series, overwhelming storage and queries. Keep metrics low-cardinality (endpoint, status, region); answer per-user questions with traces and structured logs, which are designed for high cardinality."}]}], "cases": [{"id": "url-shortener", "name": "URL Shortener", "prompt": "Design a URL shortening service like bit.ly. Users submit a long URL and get a short link; anyone opening the short link is redirected to the original.", "blocks": ["estimation", "caching", "rate-limits-ids", "datastores", "replication", "queues"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- Which features are in scope, and which do you explicitly cut?\n- Which non-functional requirements matter most, and for which path (create vs redirect)?\n- What scale do you assume? Say the numbers out loud.\n", "answer": "**Functional**\n- Create a short link for a long URL; optional custom alias and expiry.\n- Redirect `GET /{code}` → the long URL.\n- Click analytics per link: in scope, but asynchronous (confirm with the interviewer).\n- Out of scope: link editing, user management, a QR-code service.\n\n**Non-functional**\n- Redirects: **high availability (99.99%)** and **low latency** (p99 < 50 ms server-side). A broken redirect breaks someone else's page.\n- Creates: can be slower and less available (99.9% is fine).\n- Durability: links must never silently change target or disappear before they expire.\n- Codes shouldn't be enumerable. Ask whether links are ever treated as private.\n\n**Scale (assumed)**\n- 100M new links / month, 10B redirects / month (100:1), links kept 5 years.\n\n> The asymmetry is the whole design: redirects are 100× creates and are the latency- and availability-critical path.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "Using the assumed scale (100M creates and 10B redirects a month, 500 B per link, 5 years, peak 5× average), work out each number below.\nThen say what each one decides.\n", "given": {"creates": "100e6", "redirects": "10e9", "month": "30 * 86400", "bytes": 500, "years": 5, "peak": 5, "hot": "10e6"}, "calc": [{"name": "w", "ask": "Average create QPS", "unit": "/s", "expr": "creates / month", "show": "≈ 40/s", "value": 38.58024691358025}, {"name": "r", "ask": "Average redirect QPS", "unit": "/s", "expr": "redirects / month", "show": "≈ 4K/s", "value": 3858.0246913580245}, {"ask": "Peak redirect QPS", "unit": "/s", "expr": "r * peak", "show": "≈ 20K/s", "value": 19290.123456790123}, {"name": "n", "ask": "Links created over 5 years", "unit": "", "expr": "creates * 12 * years", "show": "6B", "value": 6000000000.0}, {"ask": "Storage over 5 years (before replication)", "unit": "TB", "expr": "n * bytes / 1e12", "show": "3 TB", "value": 3.0}, {"ask": "Distinct 7-char base62 codes (62⁷)", "unit": "", "expr": "62 ** 7", "show": "≈ 3.5T", "value": 3521614606208.0}, {"ask": "Cache for the 10M hottest links", "unit": "GB", "expr": "hot * bytes / 1e9", "show": "5 GB", "value": 5.0}], "answer": "- **40 creates/s is trivial.** One primary handles 100× that, so don't shard for writes.\n- **20K redirects/s at peak** is a modest read load, but it must be fast and highly available everywhere. Cache plus replicas.\n- **3 TB (9 TB replicated)** fits a small cluster. Storage isn't the constraint.\n- **7 base62 characters** give ~3.5T codes, ~600× more than 6B links. 6 characters (57B) would also fit, but a sparse space makes codes harder to guess.\n- **The hot set fits in RAM:** 5 GB fits on one cache node, so replicate it for availability, not for size.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "- Define the create and redirect endpoints, with request, response and status codes.\n- Which redirect status code do you return, and why?\n- How does a client safely retry a create after a timeout?\n", "answer": "```\nPOST /v1/links\n  Idempotency-Key: 7c1e…          (client-generated; retries return the same link)\n  { \"long_url\": \"https://…\", \"alias\": \"optional\", \"expires_at\": \"optional\" }\n→ 201 { \"code\": \"aZ3kP9q\", \"short_url\": \"https://sho.rt/aZ3kP9q\" }\n  409 alias taken · 400 invalid URL · 429 rate limited\n\nGET /{code}\n→ 302 Location: <long_url>         404 unknown · 410 expired or removed\n\nDELETE /v1/links/{code}            → 204\nGET    /v1/links/{code}/stats?from=&to=\n```\n\n| Status | Browser caches it? | Effect |\n|---|---|---|\n| 301 Moved Permanently | Yes, indefinitely | Fewest hits on you, but repeat clicks are invisible to analytics and you can't expire or retarget the link |\n| 302 / 307 Found | Only if `Cache-Control` allows | Every click reaches you (or the CDN): analytics work, and links can expire |\n\nChoose **302** with a short CDN `s-maxage`, since analytics and expiry are requirements.\nValidate on create: http/https only, length ≤ 2 KB, and not your own domain (no redirect loops).\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- What's stored, and what's the access pattern?\n- Which kind of datastore, and why? What's the partition key?\n- Do you dedupe identical long URLs?\n", "answer": "```\nlinks\n  code        CHAR(7)    primary key\n  long_url    TEXT       ≤ 2 KB\n  owner_id    BIGINT     nullable\n  created_at  TIMESTAMP\n  expires_at  TIMESTAMP  nullable\n```\n- **Access pattern:** almost every read is a single-key lookup by `code`. That suits a KV or wide-column store (DynamoDB, Cassandra) or a relational table with that PK.\n- **Choice:** Postgres can hold 6B rows / 3 TB with partitioning, but a managed KV store gives horizontal scale and multi-region replication with less operational work. Either is defensible; say which and why.\n- **Partition key = `code`**, uniform once codes are scrambled. Never partition by `created_at` (every write lands on the newest partition).\n- **\"My links\":** a secondary index on `(owner_id, created_at)`, or a separate table.\n- **Dedupe:** no by default. Global dedupe needs a unique index on `hash(long_url)` and merges different users' analytics and expiry. Offer per-user dedupe if asked.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Draw the components and walk through the redirect path and the create path.\nWhere do analytics events go?\n", "diagram": {"type": "arch", "caption": "read path, write path and analytics kept apart", "nodes": {"client": {"label": "Client", "at": [0, 2], "kind": "client"}, "edge": {"label": "CDN / LB", "at": [1, 2]}, "read": {"label": "Redirect svc", "at": [2, 1]}, "write": {"label": "Create svc", "at": [2, 3]}, "events": {"label": "Click log", "sub": "Kafka", "at": [3, 0], "kind": "queue"}, "agg": {"label": "Aggregator", "sub": "→ OLAP", "at": [4, 0]}, "cache": {"label": "Cache", "sub": "Redis", "at": [3, 1], "kind": "cache"}, "db": {"label": "Link store", "sub": "KV · replicated", "at": [4, 2], "kind": "db"}, "ids": {"label": "ID allocator", "sub": "range leases", "at": [3, 3]}}, "edges": [["client", "edge"], ["edge", "read"], ["edge", "write"], ["read", "cache"], ["read", "db"], ["read", "events"], ["events", "agg"], ["write", "ids"], ["write", "db"]], "frames": [{"title": "Redirect", "flow": [["client", "edge", "GET /aZ3k"], ["edge", "read", "edge miss"], ["read", "cache", "1 get"], ["read", "db", "2 on miss"], ["read", "events", "3 click · async"]], "hit": ["cache"], "win": ["edge", "read"], "note": "The CDN answers repeat clicks within `s-maxage`. Otherwise the redirect service reads the cache (~99% hit), falls back to a replica, and returns 302. The click event is fire-and-forget."}, {"title": "Create", "flow": [["client", "edge", "POST"], ["edge", "write"], ["write", "ids", "lease ids"], ["write", "db", "put-if-absent"]], "hit": ["db"], "win": ["write", "ids"], "note": "The create service takes the next ID from its locally leased range, scrambles it into a 7-char code, and does a conditional insert. It contacts the allocator only once per million links."}, {"title": "Analytics", "flow": [["read", "events", "click event"], ["events", "agg", "consume"]], "hit": ["agg"], "win": ["events"], "note": "Click events never touch the link store. A stream job rolls them up per (code, minute) into an OLAP store for the stats API."}]}, "answer": "- **Redirect path:** CDN/LB → stateless redirect service → Redis (cache-aside, TTL = min(1 day, time to expiry)) → link store replica on a miss → 302.\n- **Create path:** create service → next ID from a locally leased range → scramble to a code → conditional insert → 201.\n- **Analytics:** the redirect service emits a click event to Kafka without waiting; a stream aggregator writes rollups to an OLAP store.\n- Each path scales and fails on its own: an analytics outage must never break redirects, and a create outage must never break redirects either.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3 to go deep on; the interviewer will often choose. Answer each before revealing it.", "items": [{"id": "codes", "q": "How do you generate short codes? Compare at least three approaches and pick one.", "answer": "| Approach | How | Problems |\n|---|---|---|\n| Hash the URL | base62(SHA-256(url) mod 62⁷) | Collisions need check + rehash with a salt; the same URL always gets the same code (implicit global dedupe) |\n| Random | 7 random base62 chars + conditional insert | Retries grow with fill (birthday bound); fine here, since 6B / 3.5T ≈ 0.2% fill |\n| Global counter | DB sequence → base62 | A single bottleneck and SPOF; sequential codes are enumerable and leak your volume |\n| Range leases | each server leases 1M IDs from a coordinator (a DB row or ZooKeeper) and counts locally | A crash wastes part of a range (fine); IDs are still sequential within a range |\n\n**Pick:** range leases + a **keyed bijective scramble** of the ID into the 62⁷ space (a small Feistel network, i.e. format-preserving encryption).\nThat means no collisions, no coordination on the hot path, and codes that don't reveal order.\n**Random + conditional insert** is the simplest acceptable answer, as long as you can do its collision math.\n"}, {"id": "read-path", "q": "Redirects must be fast and available worldwide. Walk through the read path, including links that don't exist.", "answer": "- **Edge:** the CDN caches 302 responses with `s-maxage` of minutes. Purge on delete or expiry, or keep TTLs short enough not to need to.\n- **Cache:** Redis cache-aside by `code`. The 5 GB hot set fits one node, so replicate per region for availability.\n- **Unknown codes:** scanners probe random codes and every one misses. Cache \"not found\" for a few minutes, and/or keep a Bloom filter of existing codes in front of the store (a false positive only costs one DB read).\n- **Store:** single-key lookup on a regional replica. A replica lagging behind a just-created link → retry the miss against the primary before returning 404.\n- **Expiry:** check `expires_at` on read and return 410; the TTL never outlives the link.\n"}, {"id": "analytics", "q": "Product wants click counts per link, per country and per day. How do you add that without slowing redirects?", "answer": "- **Never write on the redirect path.** Buffer click events in-process and ship them to Kafka asynchronously: (code, ts, country, referrer, UA, event id).\n- A **stream job** (Flink / Kafka Streams) aggregates per (code, minute, country) into an OLAP store (ClickHouse, Druid). The stats API queries rollups, never raw events.\n- **Accuracy:** say which you want. At-least-once delivery + dedup by event id gives near-exact counts; accepting a little loss on crash is cheaper. Unique visitors → HyperLogLog.\n- Filter bots before counting. This is also why the API step chose 302 over 301.\n"}, {"id": "aliases", "q": "Users can choose a custom alias. What changes?", "answer": "- Same table, same uniqueness: create with a **conditional insert** (`INSERT … ON CONFLICT DO NOTHING`, or DynamoDB `attribute_not_exists`); a conflict returns 409.\n- **Namespace collisions:** a generated code can equal an alias someone already took. The conditional insert catches it; the generator retries with its next ID. Or require aliases of ≥ 8 characters so the spaces never overlap.\n- A blocklist for reserved paths (`api`, `login`, `admin`) and abuse terms; per-user quotas.\n"}, {"id": "multi-region", "q": "Make it survive a full region outage, with users worldwide.", "answer": "- **Reads: active-active.** Every region has the redirect service, a cache and a store replica behind the CDN. Redirects don't depend on the primary.\n- **Writes:** at 40/s, a single primary region with async replication is defensible. On failover, RPO = replication lag, and a just-created link can 404 elsewhere for a moment (mitigated by the retry-on-primary rule).\n- **Or multi-region writes with no conflicts:** give each region its own ID ranges so generated codes can never collide; replicate with a global table (DynamoDB Global Tables, Cassandra multi-DC).\n- Only custom aliases can conflict across regions. Route alias creation to one home region, or confirm with a read after the write.\n"}, {"id": "abuse", "q": "How do you prevent abuse (spam, malware, enumeration)?", "answer": "- Rate-limit creates per API key and IP (token bucket); bulk creation requires auth.\n- Scan destination URLs asynchronously (Safe Browsing, internal lists). Flagged links get an interstitial or a 410, and the CDN entry is purged.\n- Non-sequential codes (deep dive 1) prevent enumeration. But 7 base62 chars is ~42 bits: **a short link is not a secret**, so don't use one as an access token.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10× scale?\n- What would you monitor?\n- What makes this a staff-level answer rather than a senior one?\n", "answer": "**At 10×:** still not writes (400/s). The first limits are analytics volume (100B events/month), CDN egress cost, and cache memory if the hot set grows with the long tail.\n\n**Monitor:** redirect p50/p99 per region, cache hit ratio, 404 rate (scanners), replica lag, ID-range lease failures, and analytics consumer lag.\n\n**Staff-level signals**\n- Leads with the read/write asymmetry from the numbers, and lets it drive every choice.\n- Picks one ID scheme and defends it with collision and enumeration math.\n- Keeps analytics off the hot path and states its accuracy contract.\n- Names the failure modes (cache loss, region loss, a viral link) and the answer to each.\n\n**Common mistakes**\n- Sharding the write path that handles 40/s.\n- MD5-and-truncate with no collision handling.\n- Counting clicks synchronously in the link row (a hot row on viral links).\n- 301 redirects plus \"and we'll show analytics\".\n"}]}, {"id": "rate-limiter", "name": "Distributed Rate Limiter", "prompt": "Design a rate-limiting service used by an API gateway fleet to enforce per-API-key limits (for example 1,000 requests per minute) across hundreds of gateway servers and several regions.", "blocks": ["rate-limits-ids", "caching", "partitioning", "reliability", "consistency", "estimation"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- What kinds of limits must be expressible (per key, per endpoint, per tier, several windows)?\n- How accurate must limits be, and what added latency is acceptable?\n- What happens when the limiter itself fails?\n", "answer": "**Functional**\n- Limits per API key, optionally per endpoint and per tier (free / pro / enterprise); several windows at once (e.g. 20/s and 10K/day).\n- Rules are configurable without deploys.\n- Rejected requests get `429` with `Retry-After` and `RateLimit-*` headers.\n- Out of scope: billing, abuse detection (it can consume our counters later).\n\n**Non-functional**\n- Adds **< 1–2 ms p99** to every request; it's on the hot path of all traffic.\n- **Highly available**: limiter failure must not take down the API. Fail open for normal endpoints, closed for sensitive ones (login, OTP).\n- **Accuracy** within a few percent is fine; brief over-admission is acceptable, sustained over-admission isn't.\n\n**Scale (assumed)**\n- 1M requests/s across the fleet, 10M active keys, 3 regions.\n\n> The tension is accuracy vs latency: a perfectly shared counter needs a network round trip on every request.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "Assume 1M requests/s, 10M active keys, ~100 bytes of state per key and rule, ~100K ops/s per Redis shard, and ~200 bytes per limiter round trip.\n", "given": {"qps": "1e6", "keys": "10e6", "state": 100, "per_shard": "100e3", "rt_bytes": 200}, "calc": [{"ask": "Counter memory", "unit": "GB", "expr": "keys * state / 1e9", "show": "1 GB", "value": 1.0}, {"name": "shards", "ask": "Redis shards at one op per request", "unit": "", "expr": "qps / per_shard", "show": "10", "value": 10.0}, {"ask": "Limiter network traffic", "unit": "MB/s", "expr": "qps * rt_bytes / 1e6", "show": "200 MB/s", "value": 200.0}], "answer": "- **Memory is tiny (1 GB)**: state fits in RAM many times over. The constraint is **operations per second**, not size.\n- **~10 shards** at one op per request; plan ~20 for headroom and failover. Sharding by key spreads load evenly, except for very hot keys.\n- **200 MB/s** of limiter traffic is fine, but the round trip itself costs latency. That's the main design pressure: avoid a remote call per request where accuracy allows.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "- What does the gateway call, and
