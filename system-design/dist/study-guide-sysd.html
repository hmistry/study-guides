<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.0.0">
<title>System Design</title>
<style>
:root {
  /* Ocean: calm deep teal-blue on white (shared with algo-patterns) */
  --bg: #ffffff; --surface: #ffffff;
  --ink: #14262e; --ink-2: #4a5f68; --ink-3: #74878f;
  --rule: #d6e1e5; --code-bg: #f4f8f9; --code-rule: #d6e1e5;
  --accent: #0b6a87; --accent-tint: #e2f2f6; --hit: #dff3e4;
  --easy: #1a7f37;   --easy-bg: #dafbe1;
  --medium: #9a6700; --medium-bg: #fff8c5;
  --hard: #c0303a;   --hard-bg: #fdecea;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --side-w: 232px;
}
[hidden] { display: none !important; }   /* component display rules must never beat [hidden] */
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--sans); }
code, pre { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, textarea { font-family: var(--sans); }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.brand { font-size: 19px; font-weight: 700; letter-spacing: -.015em; color: var(--accent); text-decoration: none; white-space: nowrap; }
.ver { margin-left: -8px; font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
.tprog { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--ink-2); text-decoration: none; }
.tprog:hover { color: var(--accent); }

/* layout */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
.side { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; padding: 20px 12px 24px 20px; }
.side .grp { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 14px 10px 4px; }
.side .grp:first-child { padding-top: 0; }
.side a { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink-2); border-radius: 6px; padding: 5px 10px; font-weight: 550; font-size: 14px; }
.side a .n { font: 12px var(--mono); color: var(--ink-3); min-width: 26px; }
.side a .dot { margin-left: auto; }
.side .soon { display: flex; gap: 8px; padding: 3px 10px; font-size: 13px; color: var(--ink-3); }
.side .soon .n { font: 12px var(--mono); min-width: 26px; }
.side a:hover { background: var(--code-bg); color: var(--ink); }
.side a.active { background: var(--accent-tint); color: var(--accent); }
.side a.active .n { color: var(--accent); }
main { padding: 32px 44px 96px; min-width: 0; }

/* progress meter + small buttons */
.meter { width: 90px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 7px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--ink-3); }
.btn.danger { color: var(--hard); border-color: color-mix(in srgb, var(--hard) 45%, transparent); }
.btn.danger:hover { background: var(--hard-bg); border-color: var(--hard); }
.link { border: 0; background: none; font: 12.5px var(--sans); color: var(--ink-3); cursor: pointer; padding: 2px 4px; }
.link:hover { color: var(--ink); }

/* pager */
.pager { display: flex; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); }
.pbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface);
  border-radius: 8px; padding: 8px 16px; font: 550 14px var(--sans); text-decoration: none; cursor: pointer; }
.pbtn:hover { background: var(--accent-tint); }
.pbtn.fill { background: var(--accent); color: #fff; }
.pbtn.fill:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.pager .next { margin-left: auto; }

/* home */
.hero h1 { margin: 4px 0 8px; font-size: 32px; letter-spacing: -.025em; color: var(--accent); }
.hero .lead { max-width: 70ch; font-size: 16px; }
.hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 32px 0; }
.hcard { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; }
.hcard ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.hcard ol li { margin: 8px 0; }
.hcard a { color: var(--accent); text-decoration: none; font-weight: 550; }
.hcard p { margin: 8px 0 12px; color: var(--ink-2); font-size: 14px; }
.stats { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 6px; }
.stats b { font-size: 28px; letter-spacing: -.02em; }
.stats span { color: var(--ink-2); font-size: 14px; }
.meter.big { width: 100%; height: 8px; border-radius: 4px; }
.rlist { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.rlist li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
.rlist a { color: var(--accent); text-decoration: none; font-weight: 550; }
.empty { color: var(--ink-3); font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 32px; }
.pcard { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; padding: 11px 14px; }
a.pcard:hover { border-color: var(--accent); }
.pcard .n { font: 12px var(--mono); color: var(--accent); }
.pcard .dot { margin-left: auto; }
.pcard.soon { border-style: dashed; color: var(--ink-3); font-weight: 450; }
.pcard.soon .n { color: var(--ink-3); }
.pcard.soon small { margin-left: auto; font-size: 11px; }
.dot { flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); transform: translateY(-1px); }
.dot.st-done { background: var(--easy); border-color: var(--easy); }
.dot.st-review { background: var(--medium); border-color: var(--medium); }

/* page head + shared section parts */
.sec { padding-bottom: 8px; }
.p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 20px; }
.p-num { font: 600 14px var(--mono); color: var(--accent); }
.p-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.status { margin-left: auto; display: flex; gap: 6px; }
.st { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-3); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.st:hover { color: var(--ink); }
.st[data-st="done"][aria-pressed="true"] { background: var(--easy-bg); color: var(--easy); border-color: var(--easy); }
.st[data-st="review"][aria-pressed="true"] { background: var(--medium-bg); color: var(--medium); border-color: var(--medium); }
.lbl { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.signal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 28px; }
.signal .lbl { margin-right: 4px; }
.chip { font-size: 13px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); }
.pchip { display: inline-block; font-size: 13px; font-weight: 550; padding: 1px 9px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); text-decoration: none; white-space: nowrap; }
a.pchip:hover { text-decoration: underline; }
.pchip.soon { background: none; border: 1px dashed var(--rule); color: var(--ink-3); font-weight: 450; }
.blk { margin-bottom: 36px; }
.blk > p { margin: 10px 0 0; color: var(--ink-2); max-width: 85ch; }
.blk ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); max-width: 95ch; }
.blk li { margin: 9px 0; padding-left: 2px; }
.blk-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.blk-h .right { margin-left: auto; }
code { font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
b { font-weight: 650; color: var(--ink); }

/* concept: diagram beside key numbers */
.concept { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 24px; margin-bottom: 36px; align-items: start; }
.concept.solo { grid-template-columns: minmax(0, 1fr); }
.nums { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.nums dl { margin: 10px 0 0; display: grid; gap: 12px; }
.nums dt { font-size: 12.5px; color: var(--ink-3); }
.nums dd { margin: 0; font: 13px var(--mono); color: var(--ink); }
.concept.solo .nums dl { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 20px; }

/* arch diagram: frame tabs over one drawing */
.arch { margin: 0; border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px 16px; min-width: 0; }
.fr-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.fr-tabs button { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; }
.fr-tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.svgwrap { overflow-x: auto; }
.svgwrap svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.fr-note { margin: 14px 0 0; font-size: 13.5px; color: var(--ink-2); min-height: 2.6em; }
.arch figcaption { font: 12px var(--mono); color: var(--ink-3); margin-top: 6px; }
.d-cell { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.2; }
.d-cell.win { fill: var(--accent-tint); stroke: var(--accent); }
.d-cell.hit { fill: var(--hit); stroke: var(--easy); stroke-width: 1.6; }
.d-ring { fill: none; stroke: var(--ink-3); stroke-width: 1.2; }
.d-ring.win { stroke: var(--accent); } .d-ring.hit { stroke: var(--easy); stroke-width: 1.6; }
.d-lbl { font: 600 12.5px var(--sans); fill: var(--ink); text-anchor: middle; }
.d-sub { font: 10.5px var(--mono); fill: var(--ink-3); text-anchor: middle; }
.d-base { stroke: var(--rule); stroke-width: 1.5; }
.d-flow { stroke: var(--accent); stroke-width: 1.7; fill: none; }
.d-fhead { fill: var(--accent); }
.d-flab { font: 600 11px var(--mono); fill: var(--accent); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }

/* markdown content */
.md > :first-child { margin-top: 0; }
.md p { margin: 12px 0; }
.md ul, .md ol { margin: 10px 0; padding-left: 22px; }
.md li { margin: 7px 0; }
.md li > ul, .md li > ol { margin: 4px 0; }
.md pre.code { margin: 12px 0; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--code-rule); border-radius: 8px; font-size: 12.5px; line-height: 1.55; overflow-x: auto; }
.md .tablewrap { margin: 14px 0; }
.callout { margin: 16px 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; color: var(--ink); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table.ref { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.6; }
.ref th, .ref td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ref tr:last-child td { border-bottom: 0; }
.ref th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--code-bg); white-space: nowrap; }
.ref td { color: var(--ink-2); }
.ref td:first-child { color: var(--ink); font-weight: 550; }
.tables { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; margin-bottom: 36px; }

/* units: something to answer, then a hidden reference */
.check { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
.q { margin: 0 0 14px; font-weight: 550; }
.actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
.reveal { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 14px; font: 550 13px var(--sans); cursor: pointer; }
.unit.open > .actions .reveal { background: var(--surface); color: var(--accent); }
.ans-solo { margin-top: 16px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; font-size: 14.5px; }

/* numeric estimates */
.calc { border: 1px solid var(--code-rule); background: var(--code-bg); border-radius: 12px; padding: 8px 18px 14px; margin: 8px 0 6px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 190px minmax(0, 1.1fr); gap: 4px 14px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; }
.crow:last-of-type { border-bottom: 0; }
.cin { display: flex; align-items: center; gap: 6px; }
.cin input { width: 120px; font: 13.5px var(--mono); padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
.cin input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.cunit { font: 12.5px var(--mono); color: var(--ink-3); }
.cres { font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.cv.ok { color: var(--easy); font-weight: 600; } .cv.near { color: var(--medium); font-weight: 600; } .cv.off { color: var(--hard); font-weight: 600; }
.cans { color: var(--ink-2); font-family: var(--mono); font-size: 12.5px; }
.calc-actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12.5px; color: var(--ink-3); }

/* case study */
.prompt { padding: 18px 22px; border: 1px solid var(--accent); border-radius: 12px; background: var(--accent-tint); margin-bottom: 18px; }
.prompt p { margin: 8px 0 0; font-size: 16px; color: var(--ink); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 13px; color: var(--ink-3); }
.meta .lbl { margin-right: 4px; }
.case-tools { position: sticky; top: 56px; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 0; margin-bottom: 12px; background: var(--bg); border-bottom: 1px solid var(--rule); }
.case-tools .hint { font-size: 13px; color: var(--ink-3); }
.case-tools .right { margin-left: auto; display: flex; gap: 8px; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc a { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.toc a.seen { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
.step { padding: 36px 0 20px; scroll-margin-top: 120px; }
.step + .step { border-top: 1px solid var(--rule); }
.step-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.step-h .sn { font: 600 13px var(--mono); color: var(--accent); }
.step-h h3 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.step-h .min { font: 12px var(--mono); color: var(--ink-3); }
.ask { color: var(--ink-2); font-size: 15px; margin-bottom: 16px; }
.item { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin: 18px 0; scroll-margin-top: 120px; }
.item .q { font-size: 15.5px; }
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.unit.open > .work { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
.pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--code-rule); border-radius: 10px; overflow: hidden; }
.pane-h { display: flex; justify-content: space-between; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--code-rule); min-height: 32px; background: var(--code-bg); }
.pane.notes:focus-within { border-color: var(--accent); }
.pane.notes textarea { flex: 1; width: 100%; min-height: 130px; border: 0; resize: vertical; background: var(--surface); color: var(--ink); padding: 14px 16px; font-size: 14.5px; line-height: 1.65; outline: none; }
.pane.ans { border-color: var(--accent); }
.pane.ans .pane-h { background: var(--accent-tint); }
.pane.ans .pane-h .lbl { color: var(--accent); }
.pane.ans .md { padding: 14px 20px; font-size: 15px; }
.ans-wide { margin-top: 18px; }
/* review mode: every reference open, empty notes out of the way */
.allopen .unit.blank > .work { grid-template-columns: minmax(0, 1fr); }
.allopen .unit.blank > .work > .notes { display: none; }

/* cheat sheet */
.cheat-sec { margin-bottom: 40px; }
.cheat-sec > .lbl { display: block; margin-bottom: 12px; }
.ref td.num { font: 12px var(--mono); color: var(--accent); width: 1%; white-space: nowrap; }
.ref td.nm { font-weight: 600; white-space: nowrap; }
.ref td.nm a { color: var(--ink); text-decoration: none; }
.ref td.nm a:hover { color: var(--accent); }
.ref td.mono { font: 12.5px var(--mono); color: var(--ink); }
.nums.wide dl { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 24px; }

/* interview framework */
.tbar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin: 8px 0 36px; border: 1px solid var(--rule); }
.tbar a { display: flex; align-items: center; justify-content: center; min-width: 0; font: 600 11.5px var(--mono); color: var(--accent); text-decoration: none; white-space: nowrap; overflow: hidden; }
.tbar a:nth-child(odd) { background: var(--accent-tint); }
.tbar a:nth-child(even) { background: var(--surface); }
.tbar a:hover { background: var(--accent); color: #fff; }
.fstep { border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; scroll-margin-top: 80px; }
.fstep .goal { margin: 4px 0 14px; color: var(--ink); }
.fcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.fcols ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14.5px; }
.fcols li { margin: 7px 0; }
.fcols .avoid .lbl { color: var(--hard); }
.fcols .staff .lbl { color: var(--accent); }

/* block drill */
.drill { border: 1px solid var(--rule); border-radius: 12px; padding: 24px 28px; }
.drill-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-3); }
.drill-q { font-size: 17.5px; margin: 0 0 20px; line-height: 1.6; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1px solid var(--rule); background: var(--surface); padding: 12px 14px; border-radius: 9px; cursor: pointer; font-size: 14.5px; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--easy); background: var(--easy-bg); }
.opt.wrong { border-color: var(--hard); background: var(--hard-bg); }
.opt kbd { font: 11px var(--mono); color: var(--ink-3); margin-right: 8px; }
.verdict { margin-top: 18px; padding: 14px 18px; border-radius: 9px; font-size: 14.5px; background: var(--code-bg); }
.verdict b.ok { color: var(--easy); }
.verdict b.no { color: var(--hard); }
.verdict a { color: var(--accent); font-weight: 550; text-decoration: none; }
.drill-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }

/* glossary */
.gl-tools { position: sticky; top: 56px; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 12px 0; margin-bottom: 8px; background: var(--bg); border-bottom: 1px solid var(--rule); }
.gl-tools input { flex: 1; max-width: 420px; font: 14px var(--sans); padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); background: var(--surface); }
.gl-tools input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.gl-tools span { font-size: 13px; color: var(--ink-3); }
.gl-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 6px 24px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.gl-term { font-weight: 650; }
.gl-def { color: var(--ink-2); }
.gl-def .pchip { margin-left: 6px; font-size: 12px; vertical-align: 1px; }
.gl-empty { color: var(--ink-3); font-style: italic; margin-top: 20px; }

/* narrow */
@media (max-width: 960px) {
  .fcols { grid-template-columns: minmax(0, 1fr); }
  .concept { grid-template-columns: minmax(0, 1fr); }
  .unit.open > .work { grid-template-columns: minmax(0, 1fr); }
  .crow { grid-template-columns: minmax(0, 1fr) auto; }
  .crow .cres { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }

<script>
const DATA = {"catalog": {"blocks": [{"id": "estimation", "name": "Estimation"}, {"id": "apis", "name": "APIs & Protocols"}, {"id": "load-balancing", "name": "Load Balancing & Gateways"}, {"id": "caching", "name": "Caching"}, {"id": "cdn-blob", "name": "CDN & Object Storage"}, {"id": "datastores", "name": "Choosing a Datastore"}, {"id": "storage-engines", "name": "Storage Engines & Indexes"}, {"id": "replication", "name": "Replication"}, {"id": "partitioning", "name": "Partitioning"}, {"id": "consistency", "name": "Consistency Models"}, {"id": "queues", "name": "Queues & Streams"}, {"id": "dist-transactions", "name": "Distributed Transactions"}, {"id": "consensus", "name": "Consensus & Coordination"}, {"id": "rate-limits-ids", "name": "Rate Limiting & Unique IDs"}, {"id": "reliability", "name": "Reliability Patterns"}, {"id": "observability", "name": "Observability & Ops"}], "cases": [{"id": "url-shortener", "name": "URL Shortener"}, {"id": "rate-limiter", "name": "Distributed Rate Limiter"}, {"id": "kv-store", "name": "Key-Value Store"}, {"id": "news-feed", "name": "News Feed"}, {"id": "chat", "name": "Chat / Messaging"}, {"id": "notifications", "name": "Notification System"}, {"id": "typeahead", "name": "Typeahead"}, {"id": "web-crawler", "name": "Web Crawler"}, {"id": "video-streaming", "name": "Video Streaming"}, {"id": "file-sync", "name": "File Sync"}, {"id": "proximity", "name": "Ride Sharing / Proximity"}, {"id": "ticket-booking", "name": "Ticket Booking"}]}, "blocks": [{"id": "estimation", "name": "Estimation", "signal": ["\"design it for 100M users\"", "one machine or many?", "does the hot set fit in RAM?", "how many shards / servers?", "read- or write-heavy?"], "idea": "An estimate exists to make a decision: one box or a fleet, does it fit in memory, shard or not, CDN or not. Round hard (1 day ≈ 10⁵ s), carry powers of ten, say each assumption out loud, and end every number with **\"so…\"**. Size for peak, not average, and multiply raw storage by replication, overhead and years of growth.", "numbers": [{"k": "1 day", "v": "86,400 s ≈ 10⁵ s"}, {"k": "1M / day", "v": "≈ 12 / s"}, {"k": "1B / day", "v": "≈ 12K / s"}, {"k": "1 month · 1 year", "v": "≈ 2.6M s · ≈ 3 × 10⁷ s"}, {"k": "Peak ÷ average", "v": "2–10× (say 3× unless told)"}, {"k": "2¹⁰", "v": "≈ 10³: KB → MB → GB → TB → PB"}, {"k": "Read:write", "v": "social ~100:1 · logging / IoT ≪ 1:1"}], "tables": [{"title": "Latency (round numbers, current hardware)", "cols": ["Operation", "Time", "So…"], "rows": [["L1 cache / main memory reference", "1 ns / 100 ns", "RAM is ~1000× faster than an SSD random read"], ["Redis / Memcached GET (same AZ)", "0.2–1 ms", "dominated by the network hop, not the lookup"], ["NVMe SSD random 4 KB read", "~100 µs", "an index miss to disk costs ~1000 RAM lookups"], ["Read 1 MB sequentially (RAM / NVMe / HDD)", "~0.1 ms / ~0.5 ms / ~5 ms", "sequential HDD is fine for logs, terrible for random"], ["HDD seek", "~10 ms", "~100 random IOPS per spindle"], ["Round trip same AZ / cross-AZ", "~0.3 ms / ~1–2 ms", "synchronous replication across AZs is affordable"], ["Round trip US coast ↔ coast / US ↔ EU / US ↔ Asia", "~70 / ~90 / ~150+ ms", "synchronous cross-region writes cost a user-visible RTT"]]}, {"title": "Throughput per node (order of magnitude; workload-dependent)", "cols": ["Component", "Ballpark", "Notes"], "rows": [["Stateless app server", "1K–10K req/s", "CPU- or I/O-bound depending on work per request"], ["Relational primary (Postgres / MySQL)", "~10K writes/s · 50K+ indexed reads/s", "reads scale with replicas; writes need sharding past one primary"], ["Redis instance", "~100K ops/s (more pipelined)", "single-threaded per shard: one hot key caps here"], ["LSM store node (Cassandra / Scylla)", "10K–100K writes/s", "scales roughly linearly by adding nodes"], ["Kafka partition / broker", "~10 MB/s+ / 100s of MB/s", "partition count bounds consumer parallelism"], ["NIC", "10–25 Gbit/s ≈ 1–3 GB/s", "bits on the wire, bytes on disk: ÷ 8"], ["Server RAM / disk", "256 GB–1 TB+ / 10s of TB", "a lot fits on one box — check before sharding"]]}, {"title": "Availability", "cols": ["Target", "Downtime / year", "Downtime / month"], "rows": [["99.9%", "8.8 h", "43 min"], ["99.95%", "4.4 h", "22 min"], ["99.99%", "53 min", "4.3 min"], ["99.999%", "5.3 min", "26 s"]]}], "pitfalls": ["**Sizing for the average.** Traffic is diurnal and bursty, and retries after an outage spike far above the normal peak. State a peak factor and size for it.", "**Bits vs bytes.** Network is quoted in bits (10 Gbps ≈ 1.25 GB/s). Mixing them up is a silent 8× error.", "**Raw ≠ provisioned storage.** Multiply by replication (×3), indexes and overhead (~1.5–2×), and headroom (disks degrade past ~70–80% full), then by years of growth.", "**False precision.** 11,574/s is no better than \"~10K/s\" and burns interview minutes. One significant figure, powers of ten.", "**Averages hide skew.** The top 1% of keys or users can carry most of the traffic. Estimate the hottest key and the biggest tenant, not only the mean.", "**A number with no conclusion.** \"40 writes/s\" is useless until it becomes \"so one primary is plenty, and the hard part is the read path\"."], "depth": ["**Little's law:** in-flight requests = throughput × latency. 20K req/s at 50 ms means 1,000 concurrent requests. This sizes thread and connection pools, and shows why a latency spike exhausts them.", "**Fan-out amplifies the tail.** If 1% of calls are slow, a request fanning out to 100 backends sees at least one slow call 1 − 0.99¹⁰⁰ ≈ 63% of the time. Mitigations: hedged requests, fewer hops, partial results.", "**Availability composes.** Serial dependencies multiply (three 99.9% hops ≈ 99.7%). Redundant copies in parallel give 1 − (1 − a)ⁿ, as long as their failures are independent.", "**Headroom is part of the estimate.** Run nodes at ~50–70% at peak so losing a node or an AZ (N+1, N+2) doesn't cascade. Queueing delay explodes as utilization approaches 100%.", "**Cost is an estimate too.** For media-heavy designs, egress and storage dollars often decide the architecture (CDN, tiered storage, compression) more than QPS does."], "checks": [{"q": "A social app has 500M DAU. Each user creates 2 posts and reads 100 posts a day. Peak is 3× the average.", "given": {"dau": "500e6", "posts": 2, "reads": 100, "peak": 3}, "calc": [{"name": "w", "ask": "Average write QPS", "unit": "/s", "expr": "dau * posts / 86400", "show": "≈ 12K/s", "value": 11574.074074074075}, {"ask": "Peak read QPS", "unit": "/s", "expr": "dau * reads / 86400 * peak", "show": "≈ 1.7M/s", "value": 1736111.111111111}], "a": "With 1 day ≈ 10⁵ s it's mental math: 10⁹ writes / 10⁵ s = 10⁴/s. Reads are 50× writes **so** the design is read-optimized: caching, replicas, precomputed feeds."}, {"q": "A link service stores 100M new URLs a month, ~500 bytes each, keeps them 5 years, and replicates 3×.", "given": {"per_month": "100e6", "bytes": 500, "years": 5, "rf": 3}, "calc": [{"name": "raw", "ask": "Raw storage after 5 years", "unit": "TB", "expr": "per_month * 12 * years * bytes / 1e12", "show": "3 TB", "value": 3.0}, {"ask": "With replication", "unit": "TB", "expr": "raw * rf", "show": "9 TB", "value": 9.0}], "a": "A handful of nodes holds this, **so** storage doesn't force sharding here. Throughput or availability might."}, {"q": "A service handles 20K req/s at 50 ms average latency. A dependency degrades and latency rises to 1 s.", "given": {"qps": 20000, "lat": 0.05, "slow": 1}, "calc": [{"ask": "Requests in flight normally", "unit": "", "expr": "qps * lat", "show": "1K", "value": 1000.0}, {"ask": "Requests in flight when slow", "unit": "", "expr": "qps * slow", "show": "20K", "value": 20000.0}], "a": "Same traffic, 20× the concurrency: pools and memory run out and the service falls over. **So** use timeouts shorter than the caller's budget, bounded queues and load shedding."}, {"q": "1M concurrent viewers each stream video at 5 Mbps. One edge server pushes ~40 Gbps.", "given": {"viewers": "1e6", "mbps": 5, "server_gbps": 40}, "calc": [{"name": "tbps", "ask": "Total egress", "unit": "Tbps", "expr": "viewers * mbps / 1e6", "show": "5 Tbps", "value": 5.0}, {"ask": "Edge servers needed (no headroom)", "unit": "", "expr": "tbps * 1000 / server_gbps", "show": "≈ 125", "value": 125.0}], "a": "No origin serves that. **So** you need a CDN with edge caches, and the origin sees only cache misses. Egress cost decides bitrate ladders and codec choices."}]}, {"id": "apis", "name": "APIs & Protocols", "signal": ["\"define the API\"", "clients on mobile / web / partners", "real-time updates (chat, live scores)", "retries after timeouts", "service-to-service calls"], "idea": "The API is the contract that outlives the implementation, so design it around resources and access patterns, not around today's tables. Pick the transport per relationship: REST for public and cacheable, gRPC for internal and typed, GraphQL when many clients need different shapes, and a push channel (SSE / WebSocket) only when the server must initiate. Every mutating call must be safe to retry.", "diagram": {"type": "arch", "caption": "how the server reaches the client, from cheapest to most stateful", "nodes": {"client": {"label": "Client", "at": [0, 1], "kind": "client"}, "lb": {"label": "LB", "sub": "L7 · sticky?", "at": [1, 1]}, "api": {"label": "API server", "at": [2, 1]}, "bus": {"label": "Pub/sub", "sub": "Redis · Kafka", "at": [3, 1], "kind": "queue"}}, "edges": [["client", "lb"], ["lb", "api"], ["api", "bus"]], "frames": [{"title": "Short polling", "flow": [["client", "lb", "GET every 5 s"], ["lb", "api"]], "win": ["api"], "note": "Simple and stateless, but most requests return nothing, and latency = the poll interval. Fine for dashboards that tolerate seconds of lag."}, {"title": "Long polling", "flow": [["client", "lb", "GET (held)"], ["lb", "api"], ["bus", "api", "event"], ["api", "lb", "response"]], "win": ["api", "bus"], "note": "The server holds the request until there's data or a timeout (~30 s), then the client re-polls. Works through every proxy; one request per message."}, {"title": "SSE", "flow": [["client", "lb", "GET stream"], ["lb", "api"], ["bus", "api", "events"], ["api", "lb", "stream"]], "hit": ["api"], "win": ["bus"], "note": "One long-lived HTTP response, server → client only. Auto-reconnect with `Last-Event-ID`. Good for feeds, notifications, LLM token streams."}, {"title": "WebSocket", "flow": [["client", "lb", "WS upgrade"], ["lb", "api", "frames"], ["api", "lb", "frames"], ["bus", "api", "fan-out"]], "hit": ["api"], "win": ["lb", "bus"], "note": "Full duplex over one TCP connection. Each server holds connection state, so you need a pub/sub layer to reach a user connected to another server, and LBs must allow long-lived connections."}]}, "numbers": [{"k": "Idle WebSocket per server", "v": "~100K–1M connections (memory-bound)"}, {"k": "Memory per idle connection", "v": "~10–50 KB (buffers, TLS)"}, {"k": "TLS 1.3 handshake", "v": "+1 RTT (0-RTT on resume)"}, {"k": "gRPC vs JSON payload", "v": "protobuf ~3–10× smaller, faster to parse"}, {"k": "Long-poll timeout", "v": "~30 s (under proxy idle limits)"}], "tables": [{"title": "Choosing an API style", "cols": ["Style", "Strengths", "Weaknesses", "Use for"], "rows": [["**REST / JSON**", "Universal; HTTP caching, status codes and tooling for free; easy to debug", "Over- and under-fetching; chatty for nested data; loose contracts unless you add OpenAPI", "Public APIs, CRUD resources, anything a CDN should cache"], ["**gRPC / protobuf**", "Typed contracts and codegen; HTTP/2 multiplexing; streaming both ways; small payloads", "Browsers need a proxy (gRPC-Web); not human-readable; no HTTP caching", "Internal service-to-service, high-QPS or streaming RPC"], ["**GraphQL**", "Client picks the shape; one round trip for nested data; schema introspection", "Caching is hard (POST, one URL); N+1 resolvers; query-cost limits needed", "Many client types over a rich graph (mobile + web + partners)"], ["**Async / events**", "Decouples producer and consumer in time; absorbs bursts", "No immediate answer; ordering and duplicates to handle", "Work that can finish later: emails, encoding, fan-out"]]}, {"title": "Pagination", "cols": ["Method", "How", "Breaks when"], "rows": [["**Offset**", "`?offset=200&limit=50`", "Deep pages are O(offset) scans; inserts shift pages, so items repeat or vanish"], ["**Cursor (keyset)**", "`?after=<opaque cursor>`, encoding the last sort key, e.g. `(created_at, id)`", "Can't jump to page N; needs a stable, unique sort key"], ["**Snapshot / token**", "Server stores a result-set snapshot behind a token", "Server-side state and expiry; only worth it for expensive searches"]]}], "pitfalls": ["**Non-idempotent creates.** A client times out and retries `POST /payments`, and the customer pays twice. Accept an `Idempotency-Key`, store key → result, and replay the stored result on a retry.", "**Offset pagination on big or live tables.** Use cursors keyed on an indexed, unique sort: `(created_at, id)`, never `created_at` alone.", "**Leaking storage into the contract.** Exposing auto-increment IDs or table shapes locks you in and leaks volume. Expose opaque IDs and resource shapes.", "**Breaking changes without versioning.** Removing or renaming a field breaks old mobile clients for years. Only add, version the path or header for breaking changes, and track client versions.", "**WebSockets where SSE would do.** If only the server pushes, SSE is plain HTTP: easier through proxies, with auto-reconnect and simpler scaling.", "**Unbounded responses.** Every list endpoint needs a max page size; every request needs a size limit and a timeout."], "depth": ["**Idempotency keys done right:** store (key, request hash, response) with a TTL of ~24 h; a reused key with a different body returns 422; process key + side effect in one transaction, or record the key first in a 'pending' state so concurrent duplicates wait.", "**Connection-oriented scaling:** with millions of WebSockets, deploys become reconnect storms. Drain gradually, add jittered client backoff, and keep a connection-registry (user → gateway) in a fast store so any service can route to the right gateway.", "**Backward compatibility in protobuf:** never reuse field numbers, add fields as optional, and treat unknown fields as ignorable. That gives rolling deploys where old and new versions coexist.", "**Rate limits and quotas are part of the API:** return `429` with `Retry-After`, document limits per key, and make them visible in headers (`RateLimit-Remaining`).", "**HTTP/2 and HTTP/3:** multiplexing removes head-of-line blocking at HTTP level; HTTP/3 (QUIC) removes it at the transport level and survives network changes on mobile, which matters for flaky clients."], "checks": [{"q": "A mobile client sends `POST /orders`, the request times out, and the client retries. How do you guarantee one order?", "a": "The client generates an `Idempotency-Key` per logical operation and sends it on every retry. The server records the key atomically (unique constraint) before or with the side effect and stores the response; a repeat returns the stored response. A concurrent duplicate sees the key 'in progress' and waits or gets 409. Keys expire after a window (~24 h)."}, {"q": "Users scroll an infinite feed that gets new posts every second. Offset pagination shows duplicates. Why, and what do you use instead?", "a": "New posts at the top shift every offset, so page 2 repeats the end of page 1. Deep offsets are also O(n) scans. Use a cursor: the opaque encoding of the last item's sort key, e.g. `(created_at, id)`, and query `WHERE (created_at, id) < cursor ORDER BY … LIMIT n` on an index."}, {"q": "A live sports app must push score updates to 2M concurrent viewers; clients never send data back. Which transport, and how many servers at ~200K connections each?", "given": {"viewers": "2e6", "per_server": "200e3"}, "calc": [{"ask": "Push servers needed (no headroom)", "unit": "", "expr": "viewers / per_server", "show": "10", "value": 10.0}], "a": "SSE: server → client only, plain HTTP, built-in reconnect with `Last-Event-ID`. Run ~15 servers with headroom (N+50% to absorb a server failure's reconnect storm), fed by a pub/sub topic per game so every server gets every update and fans it out locally."}, {"q": "Why might you pick gRPC internally but REST externally?", "a": "Internally you control both ends, so typed contracts, codegen, small payloads and streaming win, and nobody needs a browser or a CDN. Externally, REST works with every client and tool, is cacheable at the edge, and is easy for partners to debug. A gateway translates between them."}]}, {"id": "load-balancing", "name": "Load Balancing & Gateways", "signal": ["more than one server", "zero-downtime deploys", "\"how do clients find the service?\"", "auth / rate limits in front of many services", "uneven load or slow nodes"], "idea": "A load balancer spreads requests over healthy instances and hides their failures; that is what makes stateless services horizontally scalable. L4 balancers route connections (fast, protocol-agnostic); L7 balancers route requests (paths, headers, retries, TLS). The choices that matter are the algorithm, how health is detected, where state lives, and what removes the balancer itself as a single point of failure.", "diagram": {"type": "arch", "caption": "from DNS to an instance", "nodes": {"client": {"label": "Client", "at": [0, 1], "kind": "client"}, "dns": {"label": "DNS / GeoDNS", "sub": "anycast", "at": [1, 0]}, "l4": {"label": "L4 LB", "sub": "NLB · Maglev", "at": [1, 1]}, "l7": {"label": "L7 gateway", "sub": "Envoy · ALB", "at": [2, 1]}, "a": {"label": "Service A", "sub": "3 instances", "at": [3, 0]}, "b": {"label": "Service B", "sub": "3 instances", "at": [3, 2]}, "reg": {"label": "Registry", "sub": "health checks", "at": [2, 2]}}, "edges": [["client", "dns"], ["client", "l4"], ["l4", "l7"], ["l7", "a"], ["l7", "b"], ["reg", "l7"]], "frames": [{"title": "Request", "flow": [["client", "dns", "resolve"], ["client", "l4", "TCP / QUIC"], ["l4", "l7", "conn"], ["l7", "a", "/orders/*"]], "hit": ["a"], "win": ["l4", "l7"], "note": "DNS picks the region, L4 spreads connections across gateway nodes, L7 terminates TLS and routes by path to an instance chosen by its algorithm."}, {"title": "Failure", "flow": [["reg", "l7", "A-2 unhealthy"], ["l7", "a", "skip A-2"]], "win": ["reg", "l7"], "hit": ["a"], "note": "Active health checks plus passive outlier detection (5xx, timeouts) eject a bad instance within seconds. In-flight requests on it fail and are retried elsewhere if idempotent."}]}, "numbers": [{"k": "L4 LB", "v": "millions of conns/s; ~µs added latency"}, {"k": "L7 proxy per core", "v": "~10K–50K req/s"}, {"k": "Health check interval", "v": "~5–10 s; eject after 2–3 failures"}, {"k": "DNS TTL for failover", "v": "30–60 s (clients may ignore it)"}, {"k": "Connection draining", "v": "30–300 s on deploys"}], "tables": [{"title": "Algorithms", "cols": ["Algorithm", "How", "Good for", "Watch out"], "rows": [["**Round robin**", "Each instance in turn", "Uniform requests, uniform hosts", "Ignores load: a slow host keeps receiving its share"], ["**Least connections / requests**", "Pick the instance with fewest in flight", "Mixed request costs, long requests", "Needs shared state across LB nodes, or it's per node"], ["**Power of two choices**", "Sample 2 at random, take the less loaded", "Large fleets; near-optimal with little state", "Needs a load signal (in-flight count, latency)"], ["**Consistent / ring hash**", "Hash a key (user, session) onto a ring of instances", "Cache affinity, sticky sessions, sharded state", "Hot keys; reshuffles ~1/n on membership change"], ["**Weighted**", "Any of the above with weights", "Canaries, mixed hardware", "Weights drift from reality; prefer measured load"]]}, {"title": "L4 vs L7", "cols": ["Layer", "Sees", "Can do", "Costs"], "rows": [["**L4 (TCP/UDP)**", "IPs and ports", "Very fast; any protocol; preserves end-to-end TLS", "No path routing, retries or per-request balancing; long connections stick to one backend"], ["**L7 (HTTP/gRPC)**", "Methods, paths, headers, bodies", "TLS termination, routing, retries, rate limits, auth, observability, per-request balancing over HTTP/2", "More CPU and latency; it's in the request path for every feature you add"]]}], "pitfalls": ["**Shallow health checks.** `/health` returning 200 while the DB pool is exhausted keeps a broken node in rotation. Check what the node needs (with timeouts), but don't make one dependency's outage fail every node's check, or the LB ejects the whole fleet.", "**Long-lived connections defeat balancing.** gRPC over HTTP/2 or WebSockets pin to one backend; new instances get no traffic. Balance per request at L7, or cap connection age so clients reconnect.", "**Sticky sessions as a crutch.** They make scale-in and failover lose state. Move session state to a shared store and keep instances stateless.", "**Retry storms at the LB.** Retrying every failure at every layer multiplies load during an outage (3 layers × 3 retries = 27×). Retry once, at one layer, with a retry budget.", "**The LB as a single point of failure.** Run it as a redundant pair or a fleet behind anycast/ECMP, across AZs; managed LBs do this for you."], "depth": ["**Global traffic:** GeoDNS or anycast picks the nearest healthy region; within a region, L4 spreads to an L7 fleet. Failover by DNS is slow (TTL caching), anycast reroutes in seconds.", "**Service mesh vs central gateway:** a gateway handles north–south (edge) concerns: auth, rate limits, routing. A sidecar mesh (Envoy) handles east–west: mTLS, retries, outlier detection per call. Both add hops; justify them by fleet size.", "**Load shedding at the edge:** when overloaded, reject early (503 + `Retry-After`) by priority rather than queueing everything; a queue at 100% utilization just adds latency to requests that will time out anyway.", "**Slow-start for new instances:** warm JIT and caches by ramping weight over ~30–60 s; otherwise new pods are hit with full traffic and fail health checks under load.", "**Zero-downtime deploys:** readiness ≠ liveness. Mark not-ready, drain connections, then stop. Blue-green flips at the LB; canary shifts weight gradually and watches error rates."], "checks": [{"q": "After scaling a gRPC service from 4 to 8 instances, the new instances get almost no traffic. Why, and how do you fix it?", "a": "gRPC multiplexes all calls over long-lived HTTP/2 connections, and an L4 balancer balances connections, not requests, so existing clients stay pinned to the old 4. Fix: balance per request with an L7 proxy or client-side load balancing (look-aside / xDS), and cap max connection age so clients periodically reconnect and re-spread."}, {"q": "One instance has a bad disk and answers in 2 s instead of 20 ms, but its health check passes. Round robin keeps sending it 1/n of traffic. What do you change?", "a": "Use a load-aware algorithm (least requests or power of two choices) so slow instances naturally get less, and add passive outlier detection that ejects an instance on high latency or error rate. Pair it with request timeouts and one retry, so the slow tail doesn't reach users."}, {"q": "An L7 proxy core handles ~20K req/s. Peak is 300K req/s and you want to survive losing one of 3 AZs. How many proxy cores in total?", "given": {"peak": "300e3", "per_core": "20e3", "azs": 3}, "calc": [{"name": "base", "ask": "Cores to carry peak", "unit": "", "expr": "peak / per_core", "show": "15", "value": 15.0}, {"ask": "Total cores so 2 of 3 AZs carry peak", "unit": "", "expr": "base * azs / (azs - 1)", "show": "≈ 23", "value": 22.5}], "a": "Provision so any 2 AZs carry the full peak: 1.5× the base. Then add headroom for traffic growth and the retry surge that follows an AZ failure."}, {"q": "When do you want consistent hashing at the load balancer instead of least-requests?", "a": "When the backend holds per-key state that is expensive to rebuild: a local cache, a shard of in-memory data, a WebSocket session, a chat room's state. Hashing the key keeps it on one instance, and membership changes only move ~1/n of keys. Watch for hot keys; use bounded-load consistent hashing to cap any instance's share."}]}, {"id": "caching", "name": "Caching", "signal": ["read-heavy (10:1 and up)", "the same data read again and again", "latency budget below what the DB gives", "expensive computed results", "a few very hot keys"], "idea": "Keep copies of hot data closer to the reader, trading freshness and complexity for latency and backend offload. Hit rate is everything: effective latency = h · t_cache + (1 − h) · t_db, and DB load is proportional to the miss rate. The real decisions are **where** to cache, **how writes reach it**, **how it gets invalidated**, and **what happens when it's cold or gone**.", "diagram": {"type": "arch", "caption": "cache-aside, the default for read-heavy data", "nodes": {"client": {"label": "Client", "at": [0, 1], "kind": "client"}, "app": {"label": "App server", "at": [1, 1]}, "cache": {"label": "Cache", "sub": "Redis", "at": [2, 0], "kind": "cache"}, "db": {"label": "Database", "at": [2, 2], "kind": "db"}}, "edges": [["client", "app"], ["app", "cache"], ["app", "db"]], "frames": [{"title": "Read · hit", "flow": [["client", "app", "GET"], ["app", "cache", "1 get k"], ["cache", "app", "2 value"]], "hit": ["cache"], "note": "Hit: ~0.5 ms, and the database is untouched."}, {"title": "Read · miss", "flow": [["app", "cache", "1 get · 4 set k, TTL"], ["cache", "app", "2 miss"], ["app", "db", "3 query"]], "hit": ["db"], "win": ["cache"], "note": "Miss: read the DB, then fill the cache with a TTL. The first reader after expiry pays the full cost (and 10K simultaneous readers make a stampede)."}, {"title": "Write", "flow": [["client", "app", "PUT"], ["app", "db", "1 commit"], ["app", "cache", "2 delete k"]], "hit": ["db"], "win": ["cache"], "note": "Write the DB, then **delete** the key; never update it in place. The next read reloads the committed value."}]}, "numbers": [{"k": "Remote cache GET", "v": "0.2–1 ms (network-bound)"}, {"k": "In-process cache GET", "v": "~100 ns"}, {"k": "One Redis instance", "v": "~100K ops/s"}, {"k": "Redis per-key overhead", "v": "~50–100 B on top of the value"}, {"k": "Hit 95% → 99%", "v": "misses 5% → 1% = 5× less DB load"}], "tables": [{"title": "Write strategies", "cols": ["Strategy", "How", "Wins", "Costs", "Use when"], "rows": [["**Cache-aside**", "App reads the cache; on a miss it reads the DB and fills. Writes go to the DB, then delete the key.", "Caches only what's read; a cache outage degrades instead of breaking", "Stale window; first read misses; the app owns the logic", "The default for read-heavy data"], ["**Read-through**", "The cache library loads from the source on a miss", "One place to coalesce misses; simpler callers", "The cache must know the data source", "Cache-aside behind a library (Caffeine loader, DAX)"], ["**Write-through**", "Each write updates the cache and the DB synchronously", "Written keys are always warm and fresh", "Every write pays both latencies; caches data nobody reads", "Read-after-write heavy, small working set"], ["**Write-behind**", "Write to the cache; flush to the DB asynchronously in batches", "Lowest write latency; absorbs bursts; coalesces repeat writes", "Data loss if the cache dies before flushing; ordering and replay are hard", "Loss-tolerant high-rate writes: counters, likes, metrics"], ["**Write-around**", "Writes skip the cache; it fills on reads", "Write-once data doesn't pollute the cache", "Recent writes always miss first", "Uploads and logs that are rarely re-read"]]}, {"title": "Where to cache", "cols": ["Layer", "Examples", "Latency", "Watch out for"], "rows": [["Client / browser", "`Cache-Control`, `ETag`", "0", "You can't invalidate it: use versioned URLs (`app.3f9c.js`)"], ["CDN / edge", "CloudFront, Fastly, Cloudflare", "~10–30 ms from user", "Purge latency (seconds); cache keys must exclude per-user data"], ["In-process", "Caffeine, an LRU dict", "~100 ns", "N hosts hold N copies that drift apart; size-limited; lost on deploy"], ["Distributed", "Redis, Memcached", "0.2–1 ms", "A network hop; capacity planning; becomes load-bearing"], ["Inside the DB", "buffer pool, materialized views", "—", "Free: tune and add RAM before adding a tier"]]}], "pitfalls": ["**Updating the cache on write instead of deleting.** Two writers can commit A then B to the DB, but set the cache B then A, leaving the old value cached until the TTL. Deleting is order-insensitive.", "**Stampede on expiry.** A hot key expires and thousands of requests hit the DB at once. Fix with request coalescing (single-flight), a lock or lease per key, stale-while-revalidate, or probabilistic early refresh.", "**Synchronized expiry.** Keys loaded together (a warm-up, a deploy) expire together. Add ±10–20% TTL jitter.", "**Cache penetration.** Lookups for keys that don't exist (bugs, scanners) miss every time and go straight to the DB. Cache negative results briefly, or put a Bloom filter of existing keys in front.", "**The cache became the database.** Once the DB can't survive a cold cache, losing a cache node at peak is an outage. Plan for it: replicas, rate-limited warm-up, load shedding on the miss path.", "**Caching what shouldn't be cached.** Low-reuse, write-heavy or strongly consistent data (balances, inventory counts at checkout) gains little and adds staleness bugs."], "depth": ["**Residual race in cache-aside.** A slow reader loads the old row, the writer commits and deletes, then the reader sets the stale value. Bound it with a TTL, or use leases or version checks (Meta's memcache leases; `SET` only if the version is newer).", "**CDC-driven invalidation.** Tail the DB's change log (Debezium → Kafka) and invalidate from it. Writers stop knowing about caches, and multi-region invalidation becomes a consumer per region. Meta's mcsqueal does this from the MySQL binlog.", "**Read-your-writes on top of eventual consistency:** after a user writes, bypass the cache for that user for a few seconds, or write-through that user's own entries.", "**Eviction choice matters at scale.** LRU is the default. LFU or W-TinyLFU (Caffeine) resists one-off scans and keeps a stable hot set, often for several points more hit rate at the same memory.", "**Distributed cache topology:** consistent hashing (Redis Cluster uses 16,384 hash slots) so resizing moves ~1/n of the keys; replicas for availability, not for capacity; client-side hot-key detection.", "**What to measure:** hit ratio per key class, p99 latency, eviction rate, memory fragmentation, and DB QPS when the cache is cold. Run a game day that kills a cache node."], "checks": [{"q": "Why delete the cache key on a write instead of writing the new value into the cache?", "a": "Concurrent writers can commit to the DB in one order but update the cache in the other, and the cache then holds an old value until the TTL. A delete is idempotent and order-insensitive: the next read loads whatever is committed. A smaller race remains (a slow reader sets a stale value after the delete). A TTL bounds it; leases or version checks close it."}, {"q": "The cache hit rate rises from 95% to 99%. At 95% the DB served 50K reads/s.", "given": {"db": 50000, "h1": 0.95, "h2": 0.99}, "calc": [{"name": "total", "ask": "Total read rate", "unit": "/s", "expr": "db / (1 - h1)", "show": "1M/s", "value": 999999.9999999991}, {"ask": "DB reads at 99%", "unit": "/s", "expr": "total * (1 - h2)", "show": "10K/s", "value": 10000.0}], "a": "Misses drop from 5% to 1%, so a 4-point hit-rate gain is a 5× cut in DB load. The last few percent of hit rate matter most."}, {"q": "One celebrity profile key takes 500K reads/s. A Redis node serves ~100K ops/s. What do you do?", "a": "Sharding doesn't help, because one key lives on one shard. (1) Put an in-process cache in front with a short TTL (1–5 s), so most reads never leave the host. (2) Replicate the key under N suffixes (`user:42#0..7`): read a random copy, and delete all copies on write. (3) Add read replicas for that shard. Detect hot keys (client-side sampling, Redis `--hotkeys`) instead of guessing which ones are hot."}, {"q": "At peak, the Redis cluster fails and the DB sees 20× its normal read load. What should have been designed in?", "a": "The cache was load-bearing with no plan for losing it. Replicate the cache with automatic failover. Put a circuit breaker and load shedding on the miss path so the DB degrades but survives. Serve stale data from an in-process cache, and warm up with rate limits after recovery. Then prove it with a game day: kill a cache node and watch DB load."}]}, {"id": "cdn-blob", "name": "CDN & Object Storage", "signal": ["images / video / file uploads", "users worldwide", "static assets or downloads", "large files through your API servers", "egress cost"], "idea": "Never push large bytes through your application servers. Store blobs in object storage (S3, GCS) and keep only metadata in your database; clients upload and download directly with presigned URLs, and a CDN serves the hot bytes from the edge. The design questions are the upload path, cache keys and invalidation, and the cost of egress and storage tiers.", "diagram": {"type": "arch", "caption": "bytes skip the app servers in both directions", "nodes": {"client": {"label": "Client", "at": [0, 1], "kind": "client"}, "api": {"label": "API server", "at": [1, 0]}, "db": {"label": "Metadata DB", "at": [2, 0], "kind": "db"}, "s3": {"label": "Object store", "sub": "S3 · GCS", "at": [2, 1], "kind": "db"}, "cdn": {"label": "CDN edge", "at": [1, 2]}, "worker": {"label": "Processor", "sub": "thumbs · scan", "at": [3, 1]}}, "edges": [["client", "api"], ["api", "db"], ["client", "s3"], ["client", "cdn"], ["cdn", "s3"], ["s3", "worker"], ["worker", "db"]], "frames": [{"title": "Upload", "flow": [["client", "api", "1 request upload"], ["api", "db", "2 pending row"], ["client", "s3", "3 PUT presigned"]], "hit": ["s3"], "win": ["api"], "note": "The API authorizes, records a `pending` row and returns a presigned PUT URL (short TTL, fixed key and size). The client uploads straight to the object store, in parts for big files."}, {"title": "Process", "flow": [["s3", "worker", "4 on create"], ["worker", "db", "5 mark ready"]], "hit": ["worker"], "win": ["db"], "note": "A storage event triggers processing (virus scan, thumbnails, transcoding). Only then is the row marked `ready`; a sweeper deletes uploads that stayed `pending`."}, {"title": "Download", "flow": [["client", "cdn", "GET /img/ab12.jpg"], ["cdn", "s3", "miss → origin"]], "hit": ["cdn"], "win": ["s3"], "note": "The CDN serves hits from the edge in tens of ms; misses go to origin once per edge (or once total, with an origin shield). Private files use signed CDN URLs or cookies."}]}, "numbers": [{"k": "S3 durability", "v": "11 nines (designed)"}, {"k": "Object store GET latency", "v": "~10–100 ms first byte"}, {"k": "CDN edge hit", "v": "~10–30 ms from user"}, {"k": "Multipart part size", "v": "5 MB–5 GB; up to 10,000 parts"}, {"k": "Good static hit ratio", "v": "95–99%"}], "tables": [{"title": "Storage tiers (S3-style)", "cols": ["Tier", "Access", "Relative cost", "Use for"], "rows": [["**Standard**", "ms, no retrieval fee", "1× storage", "Hot and recent content"], ["**Infrequent access**", "ms, per-GB retrieval fee, 30-day minimum", "~0.5×", "Older content still served occasionally"], ["**Archive (Glacier class)**", "minutes to hours to restore", "~0.1× or less", "Compliance copies, raw originals, backups"]]}, {"title": "CDN models", "cols": ["Model", "How", "Good for", "Watch out"], "rows": [["**Pull**", "Edge fetches from origin on first miss, caches per headers", "Most sites; zero upfront work", "First-request latency; origin load on cold starts; invalidation by TTL or purge"], ["**Push**", "You upload content to the CDN ahead of demand", "Large files with predictable demand (game patches, releases)", "You manage what's stored; storage cost on the CDN"], ["**Origin shield**", "A mid-tier cache between edges and origin", "Many edges, expensive origin", "One more hop on misses; a regional single point to plan for"]]}], "pitfalls": ["**Proxying uploads through the API.** Large bodies tie up workers and memory, and double your bandwidth. Use presigned URLs and multipart uploads directly to storage.", "**Mutable URLs with long cache TTLs.** Overwriting `logo.png` leaves stale copies in browsers and edges for the TTL. Use content-hashed or versioned names (`logo.3f9c.png`) and `Cache-Control: immutable`.", "**Per-user data in a shared cache key.** Caching a response that varies by cookie or auth without the right `Vary` / key leaks one user's data to another.", "**Trusting the client's upload.** Validate size and content type in the presigned policy, scan for malware, and only mark `ready` after processing; never serve user uploads from your main domain (XSS via HTML/SVG).", "**Ignoring egress.** Bandwidth out of a cloud often costs more than storage or compute. CDNs, compression, right-sized images and video bitrates are cost decisions."], "depth": ["**Metadata and blob consistency:** the two stores can't commit atomically. Use a state machine (`pending` → `ready`), events from storage, and a garbage collector for orphans in both directions.", "**Deduplicate by content hash:** store blobs under their SHA-256 and reference-count them from metadata. Saves storage for repeated uploads; deletion becomes a refcount-to-zero GC.", "**Hot objects and request rates:** object stores scale per key prefix (thousands of req/s per prefix); a single viral object is the CDN's job, never the origin's.", "**Signed delivery for private content:** short-lived signed URLs or cookies at the CDN keep caching benefits while enforcing access; rotate signing keys.", "**Lifecycle policies:** move objects to cheaper tiers by age and access, expire temporary uploads, and keep versioning + object lock where you need protection against deletion or ransomware."], "checks": [{"q": "A photo app's API servers run out of memory during peak upload hours. Users upload 10 MB photos. What do you change?", "a": "Stop accepting the bytes in the API. The API authorizes and returns a presigned PUT (or multipart) URL scoped to one key, size and content type; the client uploads directly to object storage. A storage event triggers thumbnailing and scanning, then the metadata row flips to `ready`. API servers now handle only small JSON requests."}, {"q": "You deploy a new `app.js` but some users still get the old one for hours. Why, and what's the fix?", "a": "The file is cached under the same URL by browsers and CDN edges until its TTL expires; purges are partial and slow. Fingerprint asset names with a content hash (`app.8c1e.js`) and cache them `immutable` for a year; only the small HTML that references them gets a short TTL."}, {"q": "A video site serves 2 PB a month. CDN egress costs ~$0.02/GB at that volume. What's the monthly egress bill, and what does a 98% vs 90% hit ratio mean for origin egress?", "given": {"pb": 2, "price": 0.02}, "calc": [{"name": "gb", "ask": "Monthly GB served", "unit": "GB", "expr": "pb * 1e6", "show": "2M GB", "value": 2000000.0}, {"ask": "CDN egress bill per month", "unit": "$", "expr": "gb * price", "show": "$40K", "value": 40000.0}, {"ask": "Origin egress at 98% hit", "unit": "GB", "expr": "gb * 0.02", "show": "40K GB", "value": 40000.0}, {"ask": "Origin egress at 90% hit", "unit": "GB", "expr": "gb * 0.10", "show": "200K GB", "value": 200000.0}], "a": "Going from 90% to 98% hit ratio cuts origin traffic 5×. Origin egress is often priced higher than CDN egress, and origin servers must be sized for it."}, {"q": "How do you let users download private files through a CDN without making them public?", "a": "Serve them through the CDN with signed URLs or signed cookies: your API checks authorization and issues a URL with an expiry and a signature the edge verifies. The bucket only accepts requests from the CDN (origin access control). Keep expiries short and avoid putting user identity in cache keys unnecessarily."}]}, {"id": "datastores", "name": "Choosing a Datastore", "signal": ["\"which database would you use?\"", "access pattern by key vs ad-hoc queries", "transactions across rows", "time-series / logs / events", "full-text search or graph traversal"], "idea": "Start from the access patterns and the guarantees, not the brand: what are the queries, how much data, what consistency, which transactions. A relational database is the right default until a specific need breaks it (write scale beyond one primary, a single huge access pattern, search, graph traversal). Then add a specialized store for that need, and decide which one is the source of truth.", "numbers": [{"k": "One Postgres / MySQL primary", "v": "~10K writes/s; TBs comfortably"}, {"k": "DynamoDB / Cassandra", "v": "scale writes linearly by partition"}, {"k": "Single-key KV read", "v": "~1–10 ms (p99, managed)"}, {"k": "Elasticsearch indexing lag", "v": "~1 s refresh (near real-time)"}, {"k": "Columnar scan", "v": "GB/s per node; 10–100× compression"}], "tables": [{"title": "Store families", "cols": ["Family", "Examples", "Strong at", "Weak at"], "rows": [["**Relational**", "Postgres, MySQL, Aurora, Spanner", "Transactions, joins, constraints, ad-hoc queries, mature tooling", "Write scale past one primary without sharding (Spanner / CockroachDB trade latency for it)"], ["**Key-value**", "DynamoDB, Redis, RocksDB", "Predictable single-key latency at any scale", "Queries other than by key; multi-item transactions are limited"], ["**Wide-column (LSM)**", "Cassandra, ScyllaDB, Bigtable, HBase", "Very high write throughput, time-ordered rows within a partition, multi-DC", "Ad-hoc queries; you model one table per query; read-before-write is expensive"], ["**Document**", "MongoDB, Firestore", "Nested, evolving records read as a unit", "Cross-document joins and transactions (possible, but not the sweet spot)"], ["**Search**", "Elasticsearch, OpenSearch", "Full-text, relevance, faceting, fuzzy match", "Being a source of truth; strong consistency; heavy write churn"], ["**Columnar / OLAP**", "ClickHouse, BigQuery, Snowflake, Druid", "Aggregations over billions of rows", "Point lookups and frequent updates"], ["**Time-series**", "Prometheus, InfluxDB, TimescaleDB", "Append-mostly metrics, downsampling, retention", "General queries; high-cardinality labels"], ["**Graph**", "Neo4j, Neptune", "Multi-hop traversals (friends of friends, fraud rings)", "Scale-out and bulk analytics"]]}], "pitfalls": ["**Choosing NoSQL for scale you don't have.** 3 TB and 5K writes/s fit one well-run Postgres with replicas. Say the numbers, then choose.", "**Modeling a wide-column store like SQL.** In Cassandra/DynamoDB you design one table per query, partition key first. A query you didn't plan for becomes a full scan or a new table.", "**Search index as the source of truth.** Elasticsearch can lose acknowledged writes in some failures and is eventually consistent. Keep truth in a database and rebuild the index from it.", "**Dual writes.** Writing to the DB and then to the search index or cache from the app loses updates on crashes and reorders them under concurrency. Use the outbox pattern or CDC.", "**Unbounded partitions.** A partition key like `user_id` for a chat log grows forever; one celebrity becomes a hot, giant partition. Bucket by time: `(user_id, month)`."], "depth": ["**Polyglot persistence with one truth:** a relational or KV store owns each entity; search, cache, analytics and feeds are derived views fed by CDC (Debezium → Kafka). Derived stores can be rebuilt; the truth can't.", "**NewSQL trade-off:** Spanner / CockroachDB give horizontally scaled serializable transactions at the cost of commit latency (consensus round trips, cross-region if replicas are global). Worth it when correctness across shards beats single-digit-ms writes.", "**DynamoDB-style single-table design:** overload partition and sort keys to serve several access patterns from one table with GSIs. Powerful, but every new access pattern is a schema change.", "**OLTP vs OLAP separation:** analytics queries on the primary hurt latency for users. Ship changes to a columnar warehouse and let it be minutes behind.", "**Operational cost is a first-class criterion:** backups, schema migrations, upgrades, on-call expertise. A managed service you know beats a better-fit system nobody can run."], "checks": [{"q": "An e-commerce app needs orders, inventory and payments with strict correctness, plus product search with typo tolerance. Which stores?", "a": "A relational database (Postgres / Aurora) as the source of truth for orders, inventory and payments: transactions and constraints matter most. Elasticsearch for product search, fed by CDC from the product tables, accepting ~1 s staleness. Search results link back to IDs, and the checkout re-reads price and stock from the database."}, {"q": "An IoT platform ingests 2M sensor readings per second, queried as \"last 24 h for device X\" and hourly aggregates. Which store, and what partition key?", "given": {"rate": "2e6", "bytes": 100, "day": 86400}, "calc": [{"ask": "Raw data per day", "unit": "TB", "expr": "rate * bytes * day / 1e12", "show": "≈ 17 TB", "value": 17.28}], "a": "Write-heavy, append-only, time-ordered, queried by device and time range: a wide-column/LSM store (Cassandra, ScyllaDB, Bigtable) or a time-series DB. Partition by `(device_id, day)` with clustering by timestamp, so partitions stay bounded. Roll up into hourly aggregates with a stream job, and TTL raw data after N days."}, {"q": "The team writes to Postgres and then to Elasticsearch in the same request handler. Search sometimes shows stale or missing products. Why, and the fix?", "a": "Dual writes: a crash between the two writes, a failed index request, or two concurrent updates applied in different orders leave the index divergent, and nothing repairs it. Use CDC (or a transactional outbox) so every committed change flows, in order, to an indexer that retries until applied. Add a periodic reconciliation job."}, {"q": "When does a relational database stop being the right answer?", "a": "When writes exceed what one primary can take and sharding by hand is worse than a distributed store; when one access pattern dominates at huge scale (single-key lookups, time-series appends); when you need capabilities it lacks (relevance search, multi-hop graph, columnar scans); or when multi-region active-active writes are required."}]}, {"id": "storage-engines", "name": "Storage Engines & Indexes", "signal": ["write-heavy vs read-heavy workload", "\"why is this query slow?\"", "secondary lookups (by email, by status)", "time-ordered appends at high rate", "full-text search"], "idea": "Every database sits on one of two engine families. B-trees update pages in place: fast, predictable reads, but random writes. LSM trees append to memory and flush sorted files, then compact: very high write throughput, at the price of read and space amplification. Indexes are copies of data sorted another way: each one speeds a query and slows every write.", "diagram": {"type": "arch", "caption": "an LSM write and read path (Cassandra, RocksDB, Bigtable)", "nodes": {"client": {"label": "Write / read", "at": [0, 1], "kind": "client"}, "wal": {"label": "WAL", "sub": "append-only", "at": [1, 0], "kind": "queue"}, "mem": {"label": "Memtable", "sub": "sorted · in RAM", "at": [1, 1]}, "bloom": {"label": "Bloom filters", "sub": "per SSTable", "at": [1, 2]}, "l0": {"label": "SSTables L0", "sub": "recent flushes", "at": [2, 1], "kind": "db"}, "ln": {"label": "SSTables L1..n", "sub": "compacted", "at": [3, 1], "kind": "db"}}, "edges": [["client", "wal"], ["client", "mem"], ["mem", "l0"], ["l0", "ln"], ["client", "bloom"], ["bloom", "l0"]], "frames": [{"title": "Write", "flow": [["client", "wal", "1 append"], ["client", "mem", "2 insert"]], "hit": ["mem"], "win": ["wal"], "note": "A write is a sequential log append plus an in-memory insert: no disk seeks, so writes are cheap. The WAL makes it durable."}, {"title": "Flush · compact", "flow": [["mem", "l0", "flush"], ["l0", "ln", "compact"]], "win": ["l0", "ln"], "note": "Full memtables flush to immutable sorted files. Compaction merges files, drops overwritten and deleted (tombstoned) keys and keeps read cost bounded, using background I/O."}, {"title": "Read", "flow": [["client", "mem", "1 check"], ["client", "bloom", "2 may contain?"], ["bloom", "l0", "3 read"]], "hit": ["l0"], "win": ["mem", "bloom"], "note": "A read checks the memtable, then newest to oldest SSTables. Bloom filters skip files that can't hold the key, so a point read is ~1 disk read; range scans touch every level."}]}, "numbers": [{"k": "B-tree depth", "v": "3–4 levels for billions of rows"}, {"k": "B-tree page", "v": "4–16 KB (Postgres 8 KB)"}, {"k": "LSM write amplification", "v": "~10–30× (leveled)"}, {"k": "Bloom filter", "v": "~10 bits/key → ~1% false positives"}, {"k": "Index size", "v": "often 20–50% of table size, each"}], "tables": [{"title": "B-tree vs LSM", "cols": ["Property", "B-tree (Postgres, MySQL InnoDB)", "LSM (RocksDB, Cassandra)"], "rows": [["**Writes**", "Random page writes + WAL; page splits", "Sequential appends; high throughput"], ["**Point reads**", "One root-to-leaf path, very predictable", "Memtable + Bloom-filtered SSTables; slightly more variable"], ["**Range scans**", "Excellent: leaves are linked in order", "Merge across levels; fine but costlier"], ["**Amplification**", "Read amp low; write amp from full-page writes", "Write amp from compaction; space amp from old versions"], ["**Tail latency**", "Steady", "Compaction stalls can spike p99 if under-provisioned"], ["**Best for**", "OLTP with mixed reads and writes, transactions", "Write-heavy, time-series, append-mostly, huge datasets"]]}, {"title": "Index types", "cols": ["Index", "Answers", "Cost / caveat"], "rows": [["**B-tree (default)**", "Equality, ranges, ORDER BY, prefix of a composite key", "Write cost per index; column order in composites matters"], ["**Composite `(a, b)`**", "`a = ?`, `a = ? AND b > ?`, sort by `a, b`", "Useless for `b = ?` alone (leftmost-prefix rule)"], ["**Covering / INCLUDE**", "Query served from the index alone (index-only scan)", "Bigger index; more write cost"], ["**Hash**", "Equality only", "No ranges or ordering"], ["**Inverted (GIN, Lucene)**", "Which documents contain term X; arrays, JSON keys", "Heavy to update; batched or near-real-time"], ["**Geospatial (R-tree, geohash, S2)**", "Points within a box or radius", "Choose cell sizes for your query radius"], ["**Partial**", "Only rows matching a predicate (`WHERE status = 'open'`)", "Query must match the predicate"]]}], "pitfalls": ["**Indexing everything.** Each index is another write, more WAL and more cache pressure. Index for the queries you run; drop unused ones (check usage stats).", "**Wrong composite order.** `(created_at, user_id)` can't serve `WHERE user_id = ? ORDER BY created_at`; `(user_id, created_at)` can. Equality columns first, then the range or sort column.", "**Low-selectivity indexes.** An index on a boolean or a 3-value status rarely helps; the planner scans anyway. Use a partial index on the rare value instead.", "**Deletes in LSM stores.** Deletes write tombstones that live until compaction. Queue-like patterns (insert, read, delete) in Cassandra pile up tombstones and make reads slow or failing.", "**Random UUIDv4 primary keys in B-trees.** Inserts land on random pages: page splits, cache misses, bloated indexes. Use time-ordered IDs (UUIDv7, Snowflake)."], "depth": ["**Read / write / space amplification:** no engine minimizes all three (RUM conjecture). Leveled compaction favors reads and space; size-tiered favors writes. Choose by workload, and say so.", "**Write-ahead log and checkpoints:** durability comes from fsyncing the WAL, not data pages. Group commit batches fsyncs; `synchronous_commit = off`-style settings trade the last few ms of writes for throughput.", "**MVCC:** readers see a snapshot while writers create new versions. Old versions need cleanup (Postgres VACUUM, InnoDB purge); long-running transactions block it and cause bloat.", "**Clustered vs heap tables:** InnoDB stores rows in the primary-key B-tree (secondary indexes point to the PK); Postgres uses a heap with indexes pointing to tuple locations. This shapes how PK choice affects every lookup.", "**Search engines are inverted indexes plus segments:** Lucene writes immutable segments and merges them, LSM-style. That's why indexing is near-real-time (refresh interval) and why updates are delete + reinsert."], "checks": [{"q": "A query `SELECT * FROM orders WHERE customer_id = ? AND status = 'open' ORDER BY created_at DESC LIMIT 20` is slow. What index?", "a": "`(customer_id, status, created_at DESC)`: equality columns first, then the sort column, so the database walks one index range in order and stops after 20 rows. If open orders are rare, a partial index `(customer_id, created_at) WHERE status = 'open'` is smaller and faster. Add INCLUDE columns if you want an index-only scan."}, {"q": "A logging service writes 500K events/s and rarely reads them, mostly by time range. B-tree or LSM, and why?", "a": "LSM: writes become sequential appends and batched flushes, sustaining far more throughput than random B-tree page updates. Reads by time range work well if the key is time-ordered within a partition (e.g. `(source, hour)` + timestamp). Use TTL-based expiry with time-window compaction so whole files drop instead of tombstoning rows."}, {"q": "A Bloom filter uses 10 bits per key. An SSTable holds 50M keys. How much memory for its filter?", "given": {"keys": "50e6", "bits": 10}, "calc": [{"ask": "Filter size", "unit": "MB", "expr": "keys * bits / 8 / 1e6", "show": "≈ 62 MB", "value": 62.5}], "a": "~1% false positives for ~62 MB. That's why filters for billions of keys are a real memory cost, and why some stores let you tune bits per key per table."}, {"q": "Why do random UUIDv4 primary keys hurt insert performance in MySQL/InnoDB, and what do you use instead?", "a": "InnoDB clusters rows by primary key, so random keys insert into random pages across the whole tree: constant page splits, poor cache locality, and a fragmented, larger index. Time-ordered IDs (UUIDv7, Snowflake, ULID) append near the right edge of the tree, keeping inserts sequential and the working set small."}]}, {"id": "replication", "name": "Replication", "signal": ["\"what if a node dies?\"", "read-heavy load beyond one machine", "users in several regions", "RPO / RTO targets", "stale reads after a write"], "idea": "Keep copies of the same data on several nodes for availability, durability and read scale. The core choice is who accepts writes (one leader, several leaders, or any replica with quorums) and when a write counts as done (synchronously on how many copies). Every replication scheme trades write latency against the data you can lose and the staleness readers can see.", "diagram": {"type": "arch", "caption": "single-leader replication, with one synchronous follower", "nodes": {"client": {"label": "Client", "at": [0, 1], "kind": "client"}, "leader": {"label": "Leader", "sub": "AZ a", "at": [1, 1], "kind": "db"}, "f1": {"label": "Follower 1", "sub": "AZ b · sync", "at": [2, 0], "kind": "db"}, "f2": {"label": "Follower 2", "sub": "AZ c · async", "at": [2, 2], "kind": "db"}, "reader": {"label": "Reader", "at": [3, 1], "kind": "client"}}, "edges": [["client", "leader"], ["leader", "f1"], ["leader", "f2"], ["reader", "f1"], ["reader", "f2"]], "frames": [{"title": "Write", "flow": [["client", "leader", "1 write"], ["leader", "f1", "2 sync"], ["leader", "f2", "async"]], "hit": ["leader", "f1"], "win": ["f2"], "note": "The leader acknowledges once the synchronous follower has the write (semi-sync), so a single node loss loses nothing. The async follower may lag by ms to seconds."}, {"title": "Read", "flow": [["reader", "f2", "read"]], "hit": ["f2"], "note": "Reads from followers scale out but may be stale. A user who just wrote can miss their own write unless the read goes to the leader or to a follower that has caught up."}, {"title": "Failover", "flow": [["client", "f1", "writes"]], "hit": ["f1"], "win": ["f2"], "note": "The leader dies. The sync follower is promoted (it has every acknowledged write); f2 re-points to it. Fencing must stop the old leader from accepting writes if it comes back."}]}, "numbers": [{"k": "Async lag (same region)", "v": "~ms; seconds under load"}, {"k": "Cross-region lag", "v": "≥ RTT (~70–150 ms) + apply time"}, {"k": "Automated failover", "v": "~10–60 s detection + promotion"}, {"k": "Quorum example", "v": "N = 3, W = 2, R = 2 → W + R > N"}, {"k": "Typical replication factor", "v": "3 (across 3 AZs)"}], "tables": [{"title": "Topologies", "cols": ["Topology", "Writes go to", "Strengths", "Costs"], "rows": [["**Single-leader**", "One leader per dataset (or per shard)", "Simple; no write conflicts; strong reads from the leader", "Leader is the write bottleneck; failover window; follower staleness"], ["**Multi-leader**", "A leader in each region / DC", "Local writes in every region; survives region partition", "Write conflicts must be resolved (LWW, CRDTs, app merge)"], ["**Leaderless (Dynamo)**", "Any W of N replicas", "No failover; tunable consistency; tolerates slow nodes", "Quorum math, read repair, hinted handoff, sloppy quorums; conflicts via versions"], ["**Consensus-based (Raft / Paxos)**", "The elected leader; commit on a majority", "Linearizable, automatic safe failover", "Majority round trip per write; minority side unavailable during a partition"]]}, {"title": "Synchronous vs asynchronous", "cols": ["Mode", "Ack after", "RPO on leader loss", "Wri
