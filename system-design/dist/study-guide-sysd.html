s and codecs, generate thumbnails, run content checks.\n- Play back with **adaptive bitrate** on web, mobile and TV; seek; resume where you left off.\n- View counts, likes and comments (brief); search and recommendations out of scope.\n\n**Non-functional**\n- **Playback:** start in < 2 s, rebuffering as rare as possible, quality adapts to bandwidth.\n- Uploads may take minutes to process; popular videos should be ready at high quality quickly.\n- Highly available and global; cost-efficient storage and egress are first-order concerns.\n\n**Scale (assumed)**\n- 500 hours of video uploaded per minute; 1B hours watched per day; ~3 GB stored per hour of video across all renditions; 3 Mbps average stream.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "500 hours uploaded per minute, ~3 GB per hour across renditions, 1B hours watched per day, 3 Mbps average bitrate.\n", "given": {"up_per_min": 500, "gb_per_hour": 3, "watched": "1e9", "mbps": 3}, "calc": [{"name": "hours", "ask": "Hours uploaded per day", "unit": "h", "expr": "up_per_min * 60 * 24", "show": "720K", "value": 720000.0}, {"ask": "New storage per day", "unit": "PB", "expr": "hours * gb_per_hour / 1e6", "show": "≈ 2.2 PB", "value": 2.16}, {"name": "viewers", "ask": "Average concurrent viewers", "unit": "", "expr": "watched / 24", "show": "≈ 42M", "value": 41666666.666666664}, {"ask": "Average egress", "unit": "Tbps", "expr": "viewers * mbps / 1e6", "show": "≈ 125 Tbps", "value": 125.0}], "answer": "- **~2 PB of new storage a day** (~800 PB a year): storage tiering, deleting unused renditions and efficient codecs are cost decisions worth real money.\n- **~125 Tbps average egress** (peaks far higher) is impossible from origin. Delivery is a CDN problem, including caches inside ISPs.\n- **720K hours a day to transcode** means a large, elastic, chunk-parallel encoding fleet, with priorities.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "Define upload (including resumability) and playback.", "answer": "```\nPOST /v1/videos                          { title, description, visibility, size, content_type }\n→ 201 { video_id, upload: { session_url, part_size } }     # resumable / multipart, presigned\n\nPUT  <session_url>?part=N                (client → object storage directly)\nPOST /v1/videos/{id}/complete            → 202 { status: \"processing\" }\n\nGET  /v1/videos/{id}                     → { title, status, duration, thumbnails,\n                                             manifest_url (signed, CDN), resume_position }\nGET  <cdn>/v/{id}/master.m3u8            → HLS/DASH manifest listing renditions\nGET  <cdn>/v/{id}/720p/seg_00042.m4s     → 2–6 s media segments\nPOST /v1/videos/{id}/events              { type: start | heartbeat | end, position, quality }\n```\n- Uploads never pass through API servers. Playback is plain HTTP GETs of small segments from the CDN.\n- Playback heartbeats feed view counts, resume positions and QoE metrics.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "What metadata and blobs do you store, and where?", "answer": "```\nvideos       video_id PK · owner · title · status (uploading → processing → ready)\n             · duration · renditions [ {res, codec, bitrate, path} ] · created_at    → sharded SQL / KV\noriginals    s3://originals/{video_id}            → cold / infrequent-access tier after processing\nrenditions   s3://media/{video_id}/{rendition}/seg_N.m4s + manifests                → standard tier, CDN origin\nthumbnails   s3://thumbs/{video_id}/{n}.jpg\nviews        counters per video (approximate, aggregated)  · watch history per user (wide-column)\n```\n- **Metadata is small and relational-ish; media is huge and immutable.** Keep them in different systems.\n- Segment paths are immutable and content-specific, so CDN caching is simple (cache forever).\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Draw the upload → processing pipeline and the playback path.", "diagram": {"type": "arch", "caption": "upload once, encode in parallel, serve from the edge", "nodes": {"creator": {"label": "Creator", "at": [0, 0], "kind": "client"}, "orig": {"label": "Originals", "sub": "object store", "at": [1, 0], "kind": "db"}, "dag": {"label": "Transcode DAG", "sub": "chunk workers", "at": [2, 0]}, "media": {"label": "Renditions", "sub": "segments", "at": [3, 0], "kind": "db"}, "viewer": {"label": "Viewer", "sub": "ABR player", "at": [0, 2], "kind": "client"}, "api": {"label": "Video API", "sub": "metadata", "at": [1, 1]}, "cdn": {"label": "CDN edge", "sub": "ISP caches", "at": [2, 2]}, "shield": {"label": "Origin shield", "at": [3, 1]}}, "edges": [["creator", "orig"], ["orig", "dag"], ["dag", "media"], ["viewer", "api"], ["viewer", "cdn"], ["cdn", "shield"], ["shield", "media"], ["dag", "api"]], "frames": [{"title": "Upload", "flow": [["creator", "orig", "resumable PUT"], ["orig", "dag", "uploaded"], ["dag", "media", "segments"], ["dag", "api", "ready"]], "hit": ["media"], "win": ["orig", "dag"], "note": "The original goes straight to object storage. The pipeline splits it into chunks, encodes chunks in parallel per rendition, packages HLS/DASH segments and manifests, then marks the video ready."}, {"title": "Playback", "flow": [["viewer", "api", "metadata"], ["viewer", "cdn", "segments"], ["cdn", "shield", "miss"], ["shield", "media", "miss"]], "hit": ["cdn"], "win": ["api", "shield"], "note": "The player fetches metadata and a signed manifest, then segments from the nearest edge. Popular segments are served from edge or ISP caches; misses go through a shield, so origin sees few requests."}]}, "answer": "- **Upload:** resumable multipart upload directly to object storage; an event starts processing.\n- **Processing DAG:** validate → split into chunks → parallel encode per rendition and codec → package (HLS/DASH, segments + manifests) → thumbnails, content checks → mark ready.\n- **Playback:** API for metadata and signed manifest; all media bytes from CDN edges (and ISP-embedded caches), with an origin shield in front of storage.\n- **Events:** playback heartbeats → stream processing → view counts, resume positions, QoE dashboards.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "transcoding", "q": "How do you transcode 720K hours a day quickly and economically?", "answer": "- **Chunk-parallel encoding:** split at keyframes into ~10–60 s chunks, encode chunks on many workers at once, then stitch. A 2-hour video finishes in minutes instead of hours.\n- **DAG orchestration** (workflow engine) with retries per task, idempotent outputs keyed by (video, rendition, chunk), and priorities: creators with large audiences and fast-rising videos first.\n- **Codec ladder by popularity:** everything gets H.264 (universal); popular videos also get VP9 / AV1 (30–50% smaller at equal quality, much more expensive to encode). Encoding cost is paid once, egress savings on every view.\n- **Per-title encoding:** choose bitrates per video based on its complexity; cartoons need far fewer bits than sports.\n"}, {"id": "abr", "q": "How does adaptive bitrate streaming work, and how do you get fast start-up?", "answer": "- The video is encoded at several bitrates (a **ladder**, e.g. 240p–4K) and cut into aligned 2–6 s segments; a manifest lists them.\n- The **player** measures throughput and buffer level and picks each next segment's quality: buffer-based algorithms (BOLA) avoid rebuffering, throughput-based ones react faster.\n- **Fast start:** start at a low-to-medium rendition, short first segments, preconnect to the CDN, preload the first segment for likely-next videos, and keep manifests cached at the edge.\n- Trade-offs: shorter segments adapt faster but add request overhead; low-latency live uses chunked CMAF parts.\n"}, {"id": "cdn", "q": "How do you serve ~125 Tbps globally and keep origin load small?", "answer": "- **Tiered caching:** ISP-embedded caches (Netflix Open Connect / Google Global Cache) → regional edges → origin shield → object storage.\n- **Popularity is skewed:** the head is served from edges at > 95% hit rates; the long tail misses more but is a small share of bytes.\n- **Pre-positioning:** push new releases and predicted-popular videos to edges off-peak.\n- **Routing:** DNS / anycast steer users to a healthy, nearby, non-overloaded edge; the player fails over to another CDN host if a segment request is slow.\n"}, {"id": "views", "q": "How do you count views at this scale, accurately enough and resistant to fraud?", "answer": "- Players send events (start, heartbeats); a view counts after a threshold (e.g. ~30 s watched).\n- **Stream processing** aggregates per video per minute; counters are approximate and eventually consistent (displayed counts lag by seconds to minutes).\n- **Dedup and fraud filtering** (same user/device repeatedly, bot patterns) happen in the pipeline, sometimes later in batch, which is why public counts can be revised.\n- Never increment a counter row per view synchronously: a viral video becomes a hot key.\n"}, {"id": "cost", "q": "Storage grows by ~800 PB a year. How do you control cost?", "answer": "- **Tier by access:** originals to archive after processing (kept for re-encoding); renditions of cold videos to infrequent-access storage.\n- **Delete or skip unused renditions:** if nobody watches a video in 4K, don't keep (or don't create) 4K; regenerate on demand from the original if needed.\n- **Better codecs for the head:** AV1 for popular videos cuts the dominant cost, egress.\n- Measure cost per hour watched as a business metric next to latency and rebuffering.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10×:** egress and edge capacity, then encoding fleet cost and storage. Push more into ISP caches, more efficient codecs, smarter rendition retention.\n\n**Monitor:** QoE: start-up time, rebuffering ratio, average bitrate, playback failures (by region, ISP, device); CDN hit ratio and origin egress; processing latency and failure rate; upload success rate.\n\n**Staff-level signals**\n- Separates metadata from media and never routes bytes through application servers.\n- Explains ABR and tiered CDN caching concretely.\n- Makes encoding a prioritized, chunk-parallel DAG and ties codec choice to popularity and cost.\n- Measures user-perceived quality (QoE), not just server health.\n\n**Common mistakes**\n- Streaming whole files instead of segments.\n- Serving video from origin servers.\n- Synchronous view counters.\n- Encoding every video in every codec regardless of popularity.\n"}]}, {"id": "file-sync", "name": "File Sync", "prompt": "Design a file storage and sync service like Dropbox or Google Drive. Users keep files in a folder that syncs across all their devices, works offline, keeps version history, and can be shared with others.", "blocks": ["cdn-blob", "datastores", "consistency", "partitioning", "queues", "apis"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- Which operations and clients are in scope?\n- What must never happen to user data, and how fast should changes sync?\n- How do you treat offline edits and conflicts?\n", "answer": "**Functional**\n- Upload, download, rename, move, delete files and folders; files up to ~50 GB.\n- Desktop and mobile clients sync automatically; changes reach other devices within seconds.\n- Offline edits sync on reconnect; conflicting edits never silently overwrite each other.\n- Version history and restore (e.g. 30 days); share folders and links with permissions.\n\n**Non-functional**\n- **Durability above all** (11 nines for content); metadata must never lose an acknowledged change.\n- Bandwidth-efficient: upload only what changed; don't re-upload content the service already has.\n- Strong consistency of metadata within a user's or shared folder's namespace; eventual consistency across devices is fine.\n\n**Scale (assumed)**\n- 500M users, 100M daily active, 2 GB stored per user on average, 20 file changes per active user per day, ~500 KB of new content per change after chunk dedup.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "500M users × 2 GB; 100M DAU × 20 changes per day; ~500 KB of new content per change.\n", "given": {"users": "500e6", "gb": 2, "dau": "100e6", "changes": 20, "kb": 500}, "calc": [{"ask": "Logical storage", "unit": "EB", "expr": "users * gb / 1e9", "show": "1 EB", "value": 1.0}, {"name": "cps", "ask": "Metadata commits", "unit": "/s", "expr": "dau * changes / 86400", "show": "≈ 23K/s", "value": 23148.14814814815}, {"ask": "New content uploaded per day", "unit": "PB", "expr": "dau * changes * kb * 1000 / 1e15", "show": "1 PB", "value": 1.0}, {"ask": "Average upload throughput", "unit": "GB/s", "expr": "dau * changes * kb * 1000 / 86400 / 1e9", "show": "≈ 12 GB/s", "value": 11.574074074074074}], "answer": "- **1 EB logical** (more with versions and replication): content-addressed chunk storage with dedup and erasure coding in a blob store, never in a database.\n- **23K metadata commits/s** need a sharded, strongly consistent metadata store, partitioned so each commit stays within one shard.\n- **~12 GB/s of uploads** go directly to the block store; delta sync and dedup keep this number from being 10× larger.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "- How does a client commit a changed file without re-uploading everything?\n- How do other devices learn about changes?\n", "answer": "```\nPOST /v1/commit\n{ namespace_id, path, base_rev, size, mtime, block_hashes: [\"sha256…\", …] }\n→ 200 { rev }                               # all blocks already present\n→ 412 { missing_blocks: [hashes…] }         # upload these, then retry the commit\n→ 409 { current_rev }                        # someone else changed it since base_rev\n\nPUT  /v1/blocks/{sha256}   (presigned, direct to block storage; idempotent by hash)\nGET  /v1/blocks/{sha256}\nGET  /v1/changes?namespace=…&cursor=…        → [changes], next_cursor\nGET  /v1/changes/wait?cursor=…               (long poll: returns when something changed)\n```\n- **Commit is idempotent and content-addressed**: the server answers which blocks it lacks, so unchanged and already-known blocks are never uploaded.\n- **`base_rev`** enables optimistic concurrency: a commit based on an old revision is rejected rather than overwriting.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- What's in the metadata store, and how is it partitioned?\n- How are file contents stored?\n", "answer": "```\nnamespaces   namespace_id · owner · type (user root | shared folder)\nfiles        PK (namespace_id, path) · file_id · rev · size · mtime · block_hashes[] · deleted\njournal      PK (namespace_id) CK seq → change {path, rev, op}          # per-namespace ordered log\nversions     (file_id, rev) → block_hashes[], author, ts                  # history, retention policy\nblocks       sha256 → storage location · refcount                         # ~4 MB content-addressed blocks\n```\n- **Partition metadata by `namespace_id`**: every commit touches one namespace, so it's a single-shard transaction. A shared folder is its own namespace mounted into members' trees.\n- **Journal** with a per-namespace sequence gives each device a simple cursor: \"give me everything after seq 18,442\".\n- **Blocks** live in object storage (erasure-coded, multi-AZ), deduplicated by hash.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Walk through saving a changed file on one laptop and its appearance on a phone.", "diagram": {"type": "arch", "caption": "metadata and blocks travel separately", "nodes": {"laptop": {"label": "Laptop", "sub": "chunker", "at": [0, 0], "kind": "client"}, "phone": {"label": "Phone", "at": [0, 2], "kind": "client"}, "meta": {"label": "Metadata svc", "sub": "commit · journal", "at": [1, 0]}, "mdb": {"label": "Metadata DB", "sub": "by namespace", "at": [2, 0], "kind": "db"}, "blocks": {"label": "Block store", "sub": "by SHA-256", "at": [2, 1], "kind": "db"}, "notify": {"label": "Notifier", "sub": "long poll", "at": [0, 1]}}, "edges": [["laptop", "meta"], ["laptop", "blocks"], ["phone", "notify"], ["phone", "meta"], ["phone", "blocks"], ["meta", "mdb"], ["meta", "notify"]], "frames": [{"title": "Upload", "flow": [["laptop", "meta", "1 commit"], ["laptop", "blocks", "2 PUT missing"], ["meta", "mdb", "3 journal"], ["meta", "notify", "4 notify"]], "hit": ["mdb", "blocks"], "win": ["meta"], "note": "The client chunks the file and commits block hashes. The server replies with only the missing blocks; the client uploads those directly, then re-commits, which appends to the namespace journal."}, {"title": "Sync", "flow": [["notify", "phone", "wake"], ["phone", "meta", "changes"], ["phone", "blocks", "GET blocks"]], "hit": ["phone"], "win": ["notify", "meta"], "note": "The phone's long poll returns; it fetches journal entries after its cursor, downloads only blocks it doesn't have, reassembles the file and advances its cursor."}]}, "answer": "- **Client:** file watcher, chunker (~4 MB blocks with SHA-256), local DB of synced state and cursor, upload / download queues.\n- **Metadata service:** commits with optimistic concurrency, journal per namespace, permission checks.\n- **Block store:** content-addressed, deduplicated, accessed directly by clients via presigned URLs.\n- **Notifier:** long poll or WebSocket per device; carries only \"something changed\" signals, never data.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "chunking", "q": "Fixed-size chunks or content-defined chunking? How does dedup work, and what are its risks?", "answer": "- **Fixed 4 MB blocks** are simple, but inserting one byte at the start of a file shifts every block: everything re-uploads.\n- **Content-defined chunking** (rolling hash, e.g. Rabin / FastCDC, cutting where the hash matches a pattern) keeps boundaries stable around edits, so only nearby chunks change.\n- **Dedup:** blocks are stored once by SHA-256 and reference-counted. Cross-user dedup saves a lot, but it leaks information (\"does anyone have this exact file?\" by watching upload behavior); mitigate by deduping per user / per namespace, or by always uploading before confirming.\n- Compress blocks before storage; encrypt at rest with keys managed per tenant or per block.\n"}, {"id": "conflicts", "q": "Two devices edit the same file offline and both sync. What happens?", "answer": "- Each commit carries `base_rev`. The first to arrive wins (rev 6); the second gets **409** because its base (5) is no longer current.\n- The losing client **keeps both**: it saves its version as \"file (Alice's conflicted copy 2026-10-15).docx\" and syncs that as a new file. No silent overwrite, no automatic merge of binary files.\n- Directory operations (rename vs edit, delete vs edit) need rules too: edit wins over delete (restore the file), and renames are tracked by `file_id`, not path.\n- Real-time co-editing (Google Docs) is a different design: operational transform or CRDTs on a document model, not file sync.\n"}, {"id": "journal", "q": "How do devices stay in sync reliably, including ones offline for weeks?", "answer": "- Every namespace has an append-only **journal** with a monotonically increasing sequence. Devices store a cursor per namespace.\n- Sync = \"changes after my cursor\", paginated; apply in order; advance the cursor only after applying.\n- **Notifications are hints**: lost notifications only delay sync; the cursor guarantees completeness.\n- Very old cursors (journal compacted): fall back to a full listing diff against the device's local state, then resume from the current seq.\n"}, {"id": "metadata-scale", "q": "How do you scale the metadata store to 23K commits/s with strong consistency?", "answer": "- **Shard by namespace** in a relational store (MySQL / Postgres via Vitess-style sharding) or a consensus-replicated store; each commit is a local transaction on one shard.\n- Shared folders as separate namespaces avoid cross-user transactions; a user's view is a mount table of namespaces.\n- Hot namespaces (a company-wide shared folder with millions of files and many writers) get their own shards; paginate huge directory listings.\n- Cache read-heavy metadata (listings, permissions) with invalidation driven by the journal.\n"}, {"id": "large-files", "q": "How do you handle a 50 GB upload over a flaky connection?", "answer": "- Block-level upload is naturally **resumable**: blocks already uploaded are skipped on retry (the server reports missing hashes).\n- Upload blocks in parallel (bounded concurrency), with retries and backoff per block.\n- Commit only after all blocks are present, so other devices never see a partial file.\n- Garbage-collect blocks from abandoned uploads (refcount 0 after a grace period).\n"}, {"id": "deletion", "q": "How do version history and deletion work with deduplicated blocks?", "answer": "- Versions are lists of block hashes; restoring a version is just a new commit pointing at old blocks.\n- Deleting a file or expiring a version decrements block refcounts; blocks at refcount 0 are deleted by a **garbage collector** after a safety delay (protects against races with in-flight commits referencing the block).\n- Trash retention (e.g. 30 days) before permanent deletion; legal holds override.\n- Refcount drift is inevitable at this scale: run periodic mark-and-sweep audits.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10×:** metadata shards with hot shared namespaces, notification fan-out to many devices, and storage cost. Split hot namespaces, tier cold blocks, tune erasure coding.\n\n**Monitor:** commit latency and 409 rate, sync lag (change committed → applied on other devices), block upload / download errors, dedup ratio, GC backlog, durability audits (sampled block checksums).\n\n**Staff-level signals**\n- Separates metadata (small, strongly consistent, sharded by namespace) from content (huge, immutable, content-addressed).\n- Uses a per-namespace journal and cursors so sync is correct even when notifications are lost.\n- Handles conflicts explicitly with base revisions and conflicted copies.\n- Knows content-defined chunking and the privacy cost of cross-user dedup.\n\n**Common mistakes**\n- Uploading whole files on every change.\n- Last-writer-wins on file contents.\n- Pushing file data through the notification channel.\n- Storing file contents in the database.\n"}]}, {"id": "proximity", "name": "Ride Sharing / Proximity", "prompt": "Design the core of a ride-hailing app like Uber. Drivers continuously report their location; a rider requests a ride and is matched with a nearby available driver within seconds; both then see each other move on the map.", "blocks": ["partitioning", "storage-engines", "queues", "consistency", "apis", "estimation"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- Which flows are core?\n- What latency and correctness matter most during matching?\n- What scale of drivers, updates and requests?\n", "answer": "**Functional**\n- Drivers go online / offline and send location updates every few seconds.\n- A rider requests a ride (pickup, destination); the system finds nearby available drivers, offers the trip, and confirms a match.\n- Live tracking for both parties; trip lifecycle (requested → matched → arrived → in trip → completed); ETA and price estimate.\n- Out of scope: payments, ratings, surge pricing internals (mention where they plug in).\n\n**Non-functional**\n- **Match within a few seconds**; location updates visible within ~1–2 s.\n- **Never assign one driver to two riders** at once; a lost trip request is a lost customer.\n- High write throughput for locations; available per city even if another region is down.\n\n**Scale (assumed)**\n- 2M drivers online at peak, one location update every 4 s; 20M rides per day; peak requests 5× average.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "2M online drivers updating every 4 s, ~100 bytes per update; 20M rides per day with peak = 5× average.\n", "given": {"drivers": "2e6", "every": 4, "bytes": 100, "rides": "20e6", "peak": 5}, "calc": [{"ask": "Location updates", "unit": "/s", "expr": "drivers / every", "show": "500K/s", "value": 500000.0}, {"ask": "Live location state", "unit": "MB", "expr": "drivers * bytes / 1e6", "show": "200 MB", "value": 200.0}, {"ask": "Location history written per day", "unit": "TB", "expr": "drivers / every * bytes * 86400 / 1e12", "show": "≈ 4.3 TB", "value": 4.32}, {"ask": "Peak ride requests", "unit": "/s", "expr": "rides / 86400 * peak", "show": "≈ 1.2K/s", "value": 1157.4074074074074}], "answer": "- **500K writes/s of ephemeral data** but only **200 MB of live state**: keep current locations in memory (sharded by geography), and stream history to Kafka → cold storage asynchronously. Never write each update to a disk-based database synchronously.\n- **~1.2K ride requests/s** at peak is small; the hard part is the geo query and the consistency of driver assignment, not throughput.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "Define the driver and rider interfaces, including live updates.", "answer": "```\nDriver (persistent connection, WebSocket or gRPC stream):\n  → location   { lat, lng, heading, speed, ts, status: available | on_trip }\n  ← offer      { ride_id, pickup, eta, expires_in: 15 }\n  → respond    { ride_id, accept | decline }\n\nRider:\n  POST /v1/rides   { pickup, dropoff, product }  Idempotency-Key: …   → 202 { ride_id }\n  GET  /v1/rides/{id}                            → state, driver, eta\n  stream /v1/rides/{id}/track                    ← driver location every ~2 s\n  POST /v1/rides/{id}/cancel\n```\n- Location updates are fire-and-forget (the next one supersedes a lost one); offers and responses need acks and timeouts.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- How do you store live locations so \"drivers near X\" is fast?\n- What needs a durable, consistent store?\n", "answer": "```\nlive index (in memory, per city shard)   cell_id (H3 / S2 / geohash) → set of available driver_ids\n                                         driver_id → {lat, lng, heading, status, cell, ts}   TTL ~30 s\ntrips (durable, transactional)           ride_id · rider · driver · state · pickup · dropoff\n                                         · timestamps · price                                 → sharded SQL\ndriver_state (authoritative status)      driver_id → available | offered(ride) | on_trip, version\nlocation history                         Kafka → object storage / warehouse (analytics, ETA models)\n```\n- The live index is **soft state**: it can be rebuilt from the next round of updates within seconds.\n- Trips and driver assignment are **hard state**: they need transactions or compare-and-set.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Walk through a location update, a ride request with matching, and live tracking.", "diagram": {"type": "arch", "caption": "soft state for locations, hard state for trips", "nodes": {"driver": {"label": "Driver app", "at": [0, 0], "kind": "client"}, "rider": {"label": "Rider app", "at": [0, 2], "kind": "client"}, "loc": {"label": "Location svc", "sub": "by city shard", "at": [1, 0]}, "geo": {"label": "Geo index", "sub": "H3 cells · RAM", "at": [2, 0], "kind": "cache"}, "kafka": {"label": "History", "sub": "Kafka", "at": [3, 0], "kind": "queue"}, "ride": {"label": "Ride service", "at": [1, 2]}, "match": {"label": "Matcher", "sub": "by city", "at": [2, 1]}, "trips": {"label": "Trips DB", "sub": "transactional", "at": [2, 2], "kind": "db"}}, "edges": [["driver", "loc"], ["loc", "geo"], ["loc", "kafka"], ["rider", "ride"], ["ride", "match"], ["match", "geo"], ["match", "trips"], ["ride", "trips"], ["match", "driver"]], "frames": [{"title": "Location", "flow": [["driver", "loc", "every 4 s"], ["loc", "geo", "move cell"], ["loc", "kafka", "async"]], "hit": ["geo"], "win": ["loc"], "note": "The location service updates the driver's cell in the in-memory index of the city shard and appends to Kafka for history. Nothing durable sits on this path."}, {"title": "Match", "flow": [["rider", "ride", "request"], ["ride", "match", "find driver"], ["match", "geo", "k nearest"], ["match", "trips", "CAS driver"], ["match", "driver", "offer"]], "hit": ["trips"], "win": ["ride", "match", "geo"], "note": "The matcher queries rings of cells around the pickup, ranks candidates by road ETA, atomically marks the best driver as offered (compare-and-set), and sends the offer with a timeout. Decline or timeout → next candidate."}, {"title": "Track", "flow": [["driver", "loc", "location"], ["loc", "geo", "update"], ["ride", "rider", "position"]], "hit": ["rider"], "win": ["loc"], "note": "During a trip the driver's updates are also published to the trip's channel; the rider's connection receives them every ~2 s (smoothed on the client)."}]}, "answer": "- **Location path:** connection gateway → location service (sharded by city/region) → in-memory geo index; history to Kafka.\n- **Matching:** ride service persists the request, the matcher queries nearby available drivers, ranks by ETA, reserves one driver atomically, sends an offer, and creates the trip on acceptance.\n- **Tracking:** pub/sub per trip pushes driver positions to the rider.\n- Soft state (locations) is fast and rebuildable; hard state (trips, assignments) is transactional.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "geo-index", "q": "Geohash, quadtree, or H3/S2 cells? How does a \"nearby\" query work?", "answer": "| Index | How | Notes |\n|---|---|---|\n| Geohash | Base-32 string; shared prefix ≈ nearby | Simple, works in any KV with prefix scans; cells distort near the poles and neighbors across boundaries have different prefixes |\n| Quadtree | Split a cell into 4 when it holds too many points | Adapts to density (Manhattan vs desert); in-memory, rebuild or rebalance as drivers move |\n| H3 / S2 | Hierarchical hexagonal / spherical cells with neighbor functions | Uniform neighbors (hexagons), multiple resolutions; Uber built H3 for exactly this |\n\n**Query:** compute the pickup's cell, search it plus k rings of neighbors, expand rings until enough candidates are found, then rank candidates by **road ETA**, not straight-line distance (a river or highway changes everything).\n"}, {"id": "double-dispatch", "q": "How do you guarantee a driver is never matched to two riders at once?", "answer": "- Make the driver's status the single point of truth with **compare-and-set**: `available(v7) → offered(ride 123, v8)` succeeds for exactly one matcher.\n- Better: route all matching for a city (or cell group) to **one matcher owner** (partitioned by geography), so contention is local, and still use CAS as a safety net.\n- Offers carry an expiry; if the driver doesn't accept in ~15 s, the status reverts to available (lease semantics).\n- The trip is created in the same transaction as the acceptance, so a crash can't leave a driver \"on trip\" with no trip.\n"}, {"id": "matching", "q": "Is \"assign the nearest driver\" good enough? How would you improve matching?", "answer": "- Greedy nearest-first is fast but globally poor: it can take a driver that a different rider needed more.\n- **Batched matching:** collect requests for ~1–2 s per area and solve an assignment problem (minimize total ETA), trading a little latency for better global outcomes.\n- Consider the driver's heading, current trip ending soon (chained trips), and supply/demand balance (which feeds surge pricing).\n- Keep a fast fallback (greedy) if the optimizer is slow, so matching latency stays bounded.\n"}, {"id": "hotspots", "q": "A stadium event ends and 50K riders request at once in a few cells. What breaks, and what do you do?", "answer": "- The matcher shard for that city and the few hot cells get hammered; geo queries return thousands of candidates.\n- Split hot areas into finer cells and shard by **cell group, not by city**, for very large metros; cap candidates per query.\n- Queue requests with fair ordering and tell riders their position; surge pricing and pickup zones shape demand.\n- Pre-scale for known events (schedules are public).\n"}, {"id": "failure", "q": "A location-service shard crashes, losing its in-memory index. What happens?", "answer": "- Drivers in those cities briefly can't be matched. A replacement shard rebuilds the index from the **next round of updates** (every 4 s) or from a replica fed by the same stream; within ~10 s it's complete.\n- Trip state is durable and unaffected; active trips continue (the apps keep their own state and reconnect).\n- Run a hot standby per shard subscribed to the same update stream for faster failover; partition by city so a failure is local.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10×:** location update ingestion (5M/s) and hot city shards. Reduce update frequency when idle, batch updates, split metros into cell-group shards.\n\n**Monitor:** time to match (p50/p99), offer acceptance and timeout rates, unmatched requests, location update lag, ETA error, double-assignment detector (should be zero), per-city shard load.\n\n**Staff-level signals**\n- Separates soft, high-rate location state (memory, rebuildable) from hard trip state (transactional).\n- Explains a cell-based geo index and ring expansion, ranked by road ETA.\n- Prevents double-dispatch with ownership + CAS + offer leases.\n- Talks about hotspots and batched matching as real-world concerns.\n\n**Common mistakes**\n- Writing every location update to a relational database.\n- `SELECT … ORDER BY distance` over all drivers.\n- Straight-line distance as the matching metric.\n- No timeout on driver offers.\n"}]}, {"id": "ticket-booking", "name": "Ticket Booking", "prompt": "Design a ticketing system like Ticketmaster. Users browse events, choose seats and buy tickets. A popular on-sale brings millions of users within minutes for about 50,000 seats.", "blocks": ["consistency", "dist-transactions", "caching", "rate-limits-ids", "reliability", "estimation"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- Which flows are in scope?\n- What must never happen, and where can you be eventually consistent?\n- What does an on-sale spike look like?\n", "answer": "**Functional**\n- Browse and search events; view a seat map with availability.\n- Select seats and get a **temporary hold** (~10 minutes) while paying; complete purchase; receive tickets.\n- General-admission and reserved seating; per-account ticket limits.\n- A fair queue (virtual waiting room) for high-demand on-sales; bot protection.\n\n**Non-functional**\n- **Never sell a seat twice**, never charge without issuing a ticket (or refund).\n- Browsing and seat maps can be slightly stale (seconds); holds and purchases must be strongly consistent.\n- Survive spikes of 100× normal traffic without falling over, and treat users fairly.\n\n**Scale (assumed)**\n- On-sale: 2M users arrive within 5 minutes for 50K seats; normal traffic is a few thousand requests per second.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "2M users arriving within 5 minutes for 50K seats; each admitted user refreshes the seat map every 2 s; seats sell out in ~15 minutes.\n", "given": {"users": "2e6", "window": 300, "seats": "50e3", "refresh": 2, "sellout": 900}, "calc": [{"ask": "Arrival rate", "unit": "users/s", "expr": "users / window", "show": "≈ 6.7K/s", "value": 6666.666666666667}, {"ask": "Seat-map requests if everyone were admitted", "unit": "/s", "expr": "users / refresh", "show": "1M/s", "value": 1000000.0}, {"ask": "Users per seat", "unit": "", "expr": "users / seats", "show": "40", "value": 40.0}, {"ask": "Average successful holds during the sell-out", "unit": "/s", "expr": "seats / sellout", "show": "≈ 56/s", "value": 55.55555555555556}], "answer": "- **Only ~56 successful holds per second**, but they all fight over the same 50K rows: the problem is **contention**, not throughput.\n- **1M seat-map requests/s** would crush the inventory database, so seat maps come from a cache and the waiting room limits how many users are active at once.\n- **40 users per seat**: most users will fail. A fair, honest queue is a better experience than a site that times out for everyone.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "Define the waiting room, hold and purchase calls.", "answer": "```\nGET  /v1/events/{id}                         (CDN-cached: event info, venue map)\nPOST /v1/events/{id}/queue                   → { queue_token, position, eta }\nGET  /v1/queue/{token}                       → { status: waiting | admitted, access_token? }\n\nGET  /v1/events/{id}/availability            (cached ~1 s, per section bitmaps)\nPOST /v1/holds      Authorization: access_token\n     { event_id, seats: [\"A-12\", \"A-13\"] }   → 201 { hold_id, expires_at }  · 409 seats taken\nPOST /v1/orders     Idempotency-Key: …\n     { hold_id, payment_method }             → 201 { order_id, tickets } · 410 hold expired\nDELETE /v1/holds/{id}\n```\n- Holds are all-or-nothing for the requested seats.\n- The order call is idempotent, so a client retry after a timeout can't charge twice.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- How do you represent seat state so holds are atomic?\n- Where does each kind of data live?\n", "answer": "```\nevents     event_id · venue · on_sale_at · limits                      → SQL, cached\nseats      PK (event_id, seat_id) · section · price_tier\n           · status (AVAILABLE | HELD | SOLD) · hold_id · hold_expires_at · version\n           → SQL, partitioned by event_id (one event's inventory on one shard)\nholds      hold_id · user_id · event_id · seats[] · expires_at · state\norders     order_id · hold_id (unique) · user_id · payment_id · state · idempotency_key\n```\n- **Inventory for one event lives on one shard**, so a multi-seat hold is a single local transaction.\n- `hold_id` unique on orders means one hold can produce at most one order.\n- Availability for seat maps is a **derived, cached view** (per-section bitmaps), refreshed from the seats table.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Walk through an on-sale from arrival to purchase.", "diagram": {"type": "arch", "caption": "shield the inventory behind a waiting room and caches", "nodes": {"user": {"label": "User", "at": [0, 1], "kind": "client"}, "cdn": {"label": "CDN", "sub": "static pages", "at": [1, 0]}, "wait": {"label": "Waiting room", "sub": "tokens · rate", "at": [1, 1]}, "book": {"label": "Booking svc", "at": [2, 1]}, "avail": {"label": "Availability", "sub": "cached ~1 s", "at": [2, 0], "kind": "cache"}, "inv": {"label": "Inventory DB", "sub": "by event", "at": [3, 1], "kind": "db"}, "pay": {"label": "Payments", "at": [3, 2]}}, "edges": [["user", "cdn"], ["user", "wait"], ["wait", "book"], ["book", "avail"], ["book", "inv"], ["book", "pay"], ["inv", "avail"]], "frames": [{"title": "Queue", "flow": [["user", "cdn", "event page"], ["user", "wait", "join"]], "hit": ["cdn"], "win": ["wait"], "note": "Static pages come from the CDN. Users join the waiting room and get a signed token with a position; the room admits users at the rate the booking system can handle."}, {"title": "Hold", "flow": [["wait", "book", "admitted"], ["book", "avail", "seat map"], ["book", "inv", "cond. update"]], "hit": ["inv"], "win": ["book", "avail"], "note": "Admitted users see a seat map from the availability cache. A hold is one transaction on the event's shard that flips the chosen seats from AVAILABLE to HELD only if all are still available."}, {"title": "Purchase", "flow": [["book", "pay", "charge (idem key)"], ["book", "inv", "HELD → SOLD"]], "hit": ["inv", "pay"], "win": ["book"], "note": "Payment runs with an idempotency key; on success the seats move to SOLD and tickets are issued. If the hold expired first, the payment is voided or refunded."}]}, "answer": "- **Edge:** CDN for event pages and assets; bot defenses.\n- **Waiting room:** queue tokens, admission rate tied to booking capacity, signed access tokens with expiry.\n- **Booking service:** reads availability from a cache; writes holds and orders as transactions on the event's inventory shard.\n- **Hold expiry** sweeper returns unpaid seats; **payment** with idempotency and a void/refund path.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "no-double-sell", "q": "How exactly do you prevent two users from holding or buying the same seat?", "answer": "One transaction on the event's shard:\n```\nUPDATE seats SET status = 'HELD', hold_id = :h, hold_expires_at = now() + interval '10 min'\nWHERE event_id = :e AND seat_id IN (:seats)\n  AND (status = 'AVAILABLE' OR (status = 'HELD' AND hold_expires_at < now()))\n-- commit only if rows_affected = number of seats requested, else roll back → 409\n```\n- Conditional updates (or `SELECT … FOR UPDATE` in seat order to avoid deadlocks) make it atomic; the database is the arbiter, never a cache.\n- For general admission, use a counter row per section with `UPDATE … SET remaining = remaining - n WHERE remaining >= n`, or pre-split the count into several rows to spread contention.\n"}, {"id": "holds", "q": "How do holds expire reliably?", "answer": "- Store `hold_expires_at` on the seat rows. Expired holds are treated as available **by the hold query itself** (see the condition above), so correctness never depends on a background job running on time.\n- A sweeper periodically resets expired holds so the availability view is accurate.\n- Purchases check the hold is still valid and unexpired inside the same transaction that marks seats SOLD.\n- Don't rely only on a cache TTL (e.g. Redis keys) as the source of truth; it can be the fast path, but the database decides.\n"}, {"id": "waiting-room", "q": "Design the virtual waiting room. How is it fair and how do you size admission?", "answer": "- Everyone arriving before the on-sale time gets a **random position** at open (no advantage for refresh-spamming); later arrivals join at the end.\n- The room is mostly static (CDN-served page + a small queue service storing positions); clients poll with backoff.\n- **Admission rate** = what the booking path can sustain (e.g. N users per minute), adjusted automatically by booking-service latency and remaining inventory; stop admitting when sold out and tell the queue.\n- Admitted users get a **signed, short-lived access token** bound to their account; the booking service rejects requests without one, so nobody skips the line.\n"}, {"id": "seat-map", "q": "How do you serve seat maps to many users without hammering the inventory DB?", "answer": "- Maintain **per-section availability bitmaps** derived from the inventory (CDC or periodic snapshot), cached and refreshed about every second.\n- Clients fetch bitmaps and render locally; optionally push deltas over a stream.\n- Staleness is acceptable: a user may click a seat that was just taken and get a 409 with a fresh map.\n- Offer **\"best available\"** selection server-side so most users don't need the map at all and requests spread across seats.\n"}, {"id": "payment", "q": "Payment succeeds but the order write fails (or the hold expired during payment). What happens?", "answer": "- Treat purchase as a small saga: **authorize** the card → mark seats SOLD (in a transaction that checks the hold) → **capture**. If marking SOLD fails, void the authorization.\n- Idempotency keys on the order and on the payment call make retries safe.\n- Extend a hold that is in payment (e.g. +2 minutes) rather than letting it expire mid-charge.\n- Reconciliation job: payments without orders are refunded or completed; orders without captured payments are flagged.\n"}, {"id": "bots", "q": "How do you keep bots and scalpers from taking most of the tickets?", "answer": "- Verified accounts (phone / prior purchase history), presale codes for verified fans.\n- CAPTCHA and device fingerprinting at queue entry, rate limits per account, payment card and device.\n- Per-account ticket limits enforced in the hold transaction.\n- Non-transferable or controlled-resale tickets reduce the incentive; anomaly detection after the fact cancels abusive orders.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10× (20M users for one event):** the waiting room and edge, not inventory, because admission is throttled. Make the room fully CDN-backed and the queue service horizontally scalable.\n\n**Monitor:** queue length and admission rate, hold success / 409 rate, booking latency, hold expiry rate, payment failures, oversell detector (should be zero), bot-block rate.\n\n**Staff-level signals**\n- Identifies contention on a small inventory as the core problem and keeps each event's inventory on one shard.\n- Puts the invariant in the database write (conditional update), with expiry checked in the same query.\n- Uses a waiting room to turn an uncontrollable spike into a controlled admission rate, and makes it fair.\n- Handles payment and hold expiry as a saga with idempotency.\n\n**Common mistakes**\n- Checking availability on a cache or replica, then writing.\n- Relying on a cron job to expire holds for correctness.\n- Letting the full spike hit the booking service.\n- Charging before seats are secured, with no void path.\n"}]}], "pages": {"cheat": {"blocks": [{"id": "estimation", "when": "any scale question; one box or many?", "move": "QPS = daily ÷ 10⁵; size for peak; × replication × growth; end with \"so…\"", "num": "1 day ≈ 10⁵ s"}, {"id": "apis", "when": "define the contract; server push; retries", "move": "REST public, gRPC internal, SSE for push; cursor pagination; idempotency keys", "num": "WebSocket: 100K–1M conns/server"}, {"id": "load-balancing", "when": "more than one server; deploys; slow nodes", "move": "L4 balances connections, L7 balances requests; P2C / least-requests; outlier ejection", "num": "L7 proxy ~10–50K req/s/core"}, {"id": "caching", "when": "read-heavy; hot keys; DB latency too high", "move": "cache-aside; delete on write; TTL + jitter; coalesce misses; plan for a cold cache", "num": "95% → 99% hit = 5× less DB load"}, {"id": "cdn-blob", "when": "files, media, global users, egress cost", "move": "presigned direct upload; metadata in DB, bytes in object store; hashed URLs at the CDN", "num": "edge hit ~10–30 ms"}, {"id": "datastores", "when": "\"which database?\"", "move": "SQL by default; add a specialized store for a need SQL can't meet; one source of truth + CDC", "num": "one PG primary ~10K writes/s"}, {"id": "storage-engines", "when": "slow query; write-heavy workload", "move": "B-tree for mixed OLTP, LSM for write-heavy; composite index: equality then range", "num": "Bloom 10 bits/key ≈ 1% FP"}, {"id": "replication", "when": "node loss, read scale, regions", "move": "single-leader / multi-leader / leaderless; sync vs async = RPO vs latency", "num": "W + R > N"}, {"id": "partitioning", "when": "data or writes beyond one machine", "move": "key keeps queries local and spreads load; consistent hashing; split hot keys", "num": "adding 1 of n nodes moves ~1/n"}, {"id": "consistency", "when": "money, uniqueness, stale or reordered reads", "move": "weakest model each operation tolerates; enforce invariants at the write", "num": "cross-region linearizable ≥ 1 RTT"}, {"id": "queues", "when": "async work, bursts, many consumers", "move": "queue for jobs, log for streams; at-least-once + idempotent consumers; outbox", "num": "partitions ≥ peak consumers"}, {"id": "dist-transactions", "when": "one action spans several services", "move": "saga with compensations + idempotency keys; avoid 2PC across services", "num": "irreversible steps last"}, {"id": "consensus", "when": "one leader, locks, critical metadata", "move": "etcd / ZooKeeper lease + fencing token; 3 or 5 nodes", "num": "majority = ⌊n/2⌋ + 1"}, {"id": "rate-limits-ids", "when": "quotas, abuse, IDs on many servers", "move": "token bucket in Redis via Lua; Snowflake / UUIDv7 for IDs", "num": "Snowflake 4,096 IDs/ms/worker"}, {"id": "reliability", "when": "slow or failing dependencies", "move": "timeouts inside the budget, one retry + jitter, breakers, bulkheads, load shedding", "num": "3 layers × 3 retries = 27×"}, {"id": "observability", "when": "\"how would you know it's broken?\"", "move": "SLO burn-rate alerts; metrics → traces → logs; canary + feature flags", "num": "99.9% = 43 min/month"}], "cases": [{"id": "url-shortener", "crux": "100:1 reads; generating short codes", "key": "range leases + bijective scramble; cache-aside + CDN; 302 with async analytics"}, {"id": "rate-limiter", "crux": "accuracy vs a network hop on every request", "key": "in-process limiter + Redis Lua token bucket; local leases for hot keys; fail open or closed per rule"}, {"id": "kv-store", "crux": "always writable with tunable consistency", "key": "consistent hashing + N/W/R quorums; hinted handoff, read repair, Merkle anti-entropy"}, {"id": "news-feed", "crux": "extremely skewed follower counts", "key": "hybrid fan-out (push normal, pull celebrities); feeds of IDs, hydrate at read"}, {"id": "chat", "crux": "order and delivery across flaky connections", "key": "per-conversation seq + idempotent sends; cursor sync, live push is only a hint"}, {"id": "notifications", "crux": "urgent vs bulk; unreliable, rate-limited providers", "key": "priority queues end to end; per-recipient dedup; provider breakers + failover"}, {"id": "typeahead", "crux": "< 50 ms on every keystroke", "key": "precomputed top-K per prefix in RAM, full replicas; CDN + client cache for short prefixes"}, {"id": "web-crawler", "crux": "politeness at billions of URLs", "key": "Mercator frontier, partition by host; URL / content / near-dup dedup; change-rate recrawl"}, {"id": "video-streaming", "crux": "PB/day storage, 100+ Tbps egress", "key": "chunk-parallel transcode DAG; HLS/DASH with ABR; tiered CDN with ISP caches"}, {"id": "file-sync", "crux": "bandwidth, and never losing an edit", "key": "content-addressed chunks; per-namespace journal + cursors; base_rev → conflicted copy"}, {"id": "proximity", "crux": "500K location writes/s, no double dispatch", "key": "in-memory cell index (H3) per city; CAS + offer leases; history async to Kafka"}, {"id": "ticket-booking", "crux": "contention for a small inventory under a huge spike", "key": "waiting room sets the admission rate; conditional update with expiry in the same query"}], "numbers": [{"k": "1 day", "v": "86,400 s ≈ 10⁵ s · 1M/day ≈ 12/s"}, {"k": "RAM / NVMe / HDD", "v": "100 ns / ~100 µs / ~10 ms random read"}, {"k": "RTT same AZ / cross-region", "v": "~0.3 ms / 70–150 ms"}, {"k": "Redis instance", "v": "~100K ops/s"}, {"k": "Postgres primary", "v": "~10K writes/s; TBs fit"}, {"k": "Kafka partition", "v": "~10 MB/s+"}, {"k": "NIC", "v": "10–25 Gbit/s ≈ 1–3 GB/s"}, {"k": "99.9% / 99.99%", "v": "43 min / 4.3 min per month"}, {"k": "Powers", "v": "2¹⁰ ≈ 10³ · 2³² ≈ 4.3B · 62⁷ ≈ 3.5T"}, {"k": "Little's law", "v": "in flight = rate × latency"}]}, "framework": {"intro": "A system design interview checks how you reach a design as much as the design itself: clarifying scope, using numbers to make decisions, choosing deliberately between options, and going deep where it matters. Use the same structure every time so your attention goes to the problem, not to what comes next.", "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "goal": "Agree on what to build and which qualities matter, then stop asking.", "do": ["Split **functional** (features) from **non-functional** (latency, availability, consistency, durability, cost).", "Name what's **out of scope** explicitly, and confirm it.", "State scale assumptions as numbers (DAU, read:write ratio, data size) instead of asking for every one."], "staff": ["Identify the **one or two properties that shape the design** (\"redirects must never break\", \"never double-sell\").", "Ask about the business context: who the users are, what failure costs, what exists already."], "avoid": ["Ten minutes of questions with no design.", "Accepting \"make it scalable and available\" without saying which part, how much."]}, {"id": "estimation", "title": "Estimation", "min": 5, "goal": "Turn the scale into the few numbers that decide the architecture.", "do": ["Compute QPS (average and peak), storage over the retention period, bandwidth, and the hot working set.", "Round hard and say assumptions out loud; 1 day ≈ 10⁵ s."], "staff": ["End every number with a conclusion: \"40 writes/s, so one primary is plenty; the read path is the hard part.\"", "Estimate the skew too: the hottest key, the biggest tenant, the celebrity."], "avoid": ["Precise arithmetic that changes nothing.", "Skipping estimation and then sharding something that fits on one box."]}, {"id": "api", "title": "API", "min": 4, "goal": "Pin down the contract between clients and the system.", "do": ["List the core endpoints or messages with inputs, outputs and status codes.", "Choose the transport (REST, gRPC, WebSocket / SSE) for each client relationship."], "staff": ["Make mutating calls safe to retry (idempotency keys) and pagination stable (cursors).", "Note which calls are synchronous and which are accepted for async processing (202)."], "avoid": ["Designing every endpoint; three or four core ones are enough."]}, {"id": "data-model", "title": "Data model", "min": 5, "goal": "Decide what is stored, how it's keyed, and where it lives.", "do": ["Sketch entities and their key fields, driven by the access patterns.", "Choose store types and the **partition key** for each large dataset."], "staff": ["Name the source of truth for each entity and which stores are derived (caches, indexes, feeds).", "Check the partition key against both load spread and the main queries."], "avoid": ["Picking a database by brand without reasons.", "A full normalized schema with every column."]}, {"id": "high-level", "title": "High-level design", "min": 8, "goal": "A complete, simple design that meets the requirements end to end.", "do": ["Draw the components and walk through each core flow (read path, write path) step by step.", "Keep it simple first; complexity is added in deep dives where the numbers demand it."], "staff": ["Separate paths with different requirements (hot read path vs async analytics) so they scale and fail independently.", "Say where state lives and what's stateless."], "avoid": ["Boxes labelled with product names and no data flow.", "Introducing microservices, Kafka and Kubernetes before there's a reason."]}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "goal": "Go deep on the 2–3 hardest parts, the ones the requirements and numbers point to.", "do": ["Compare at least two options for each, pick one, and say what it costs.", "Cover failure modes: what happens when this component is slow, down or overloaded."], "staff": ["Choose the deep dives yourself if the interviewer doesn't, and explain why those are the risky parts.", "Quantify trade-offs (collision probability, over-admission, RPO) instead of just naming them."], "avoid": ["Surveying every option without deciding.", "Going deep on something easy (CRUD endpoints, auth boilerplate)."]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "goal": "Show you can operate and evolve what you designed.", "do": ["Say what breaks first at 10× and how you'd respond.", "Name the key metrics and alerts."], "staff": ["Summarize the design's main trade-offs and the alternatives you'd revisit if requirements changed."], "avoid": ["Running out of time before any summary; keep an eye on the clock."]}], "throughout": ["**Think out loud** and narrate decisions as \"X because Y, at the cost of Z\".", "**Check in at transitions** (\"I'd like to go deeper on ID generation next, unless you'd prefer another area\").", "**Treat hints as data:** if the interviewer pushes on something, that's where they want depth.", "**Stay on one diagram** and evolve it; label arrows with what flows.", "**Prefer boring technology** and explain when you'd reach for something more complex.", "**Name failure modes unprompted:** retries, duplicates, hot keys, region loss, cold caches."]}, "est-drill": {"problems": [{"q": "A microblogging service stores 400M new posts a day at ~300 bytes each (text + metadata), kept 5 years.", "given": {"per_day": "400e6", "bytes": 300, "years": 5}, "calc": [{"name": "gb", "ask": "New data per day", "unit": "GB", "expr": "per_day * bytes / 1e9", "show": "120 GB", "value": 120.0}, {"ask": "After 5 years (before replication)", "unit": "TB", "expr": "gb * 365 * years / 1000", "show": "≈ 220 TB", "value": 219.0}], "a": "Text is cheap: a few hundred TB fits a modest cluster. Media, not text, will dominate storage."}, {"q": "Users upload 100M photos a day, ~2 MB each after compression.", "given": {"uploads": "100e6", "mb": 2}, "calc": [{"name": "tb", "ask": "New storage per day", "unit": "TB", "expr": "uploads * mb * 1e6 / 1e12", "show": "200 TB", "value": 200.0}, {"ask": "New storage per year", "unit": "PB", "expr": "tb * 365 / 1000", "show": "73 PB", "value": 73.0}], "a": "Tens of PB a year: object storage with lifecycle tiers, and thumbnails generated once at upload, not on read."}, {"q": "An API serves 50K requests/s with an average response of 20 KB.", "given": {"qps": 50000, "kb": 20}, "calc": [{"name": "gbs", "ask": "Egress", "unit": "GB/s", "expr": "qps * kb * 1e3 / 1e9", "show": "1 GB/s", "value": 1.0}, {"ask": "Egress in network units", "unit": "Gbps", "expr": "gbs * 8", "show": "8 Gbps", "value": 8.0}], "a": "8 Gbps fits a few NICs, but egress is billed: compress JSON (often 5–10×) and cache at the edge."}, {"q": "Peak load is 300K requests/s. One server handles 2K requests/s, and you run servers at 60% of capacity to absorb failures and spikes.", "given": {"peak": "300e3", "per": 2000, "util": 0.6}, "calc": [{"ask": "Servers needed", "unit": "", "expr": "peak / (per * util)", "show": "250", "value": 250.0}], "a": "Planning at 60% leaves room for losing an AZ and for retry surges. Running at 100% would need 150 servers and fall over on the first incident."}, {"q": "A catalog has 1B items of ~1 KB each. The hottest 20% serve almost all reads. Cache nodes have 64 GB usable.", "given": {"items": "1e9", "hot": 0.2, "kb": 1, "node": 64}, "calc": [{"name": "gb", "ask": "Hot working set", "unit": "GB", "expr": "items * hot * kb * 1e3 / 1e9", "show": "200 GB", "value": 200.0}, {"ask": "Cache nodes (no replicas)", "unit": "", "expr": "gb / node", "show": "≈ 3", "value": 3.125}], "a": "Round up to 4 for per-key overhead and fragmentation, then add a replica per shard for availability: ~8 nodes."}, {"q": "A Kafka topic receives 200K events/s of ~1 KB, retained 7 days with replication factor 3.", "given": {"eps": "200e3", "kb": 1, "days": 7, "rf": 3}, "calc": [{"ask": "Disk needed across the cluster", "unit": "TB", "expr": "eps * kb * 1e3 * days * 86400 * rf / 1e12", "show": "≈ 360 TB", "value": 362.88}], "a": "Retention is a storage decision: tiered storage (old segments in object storage) or shorter retention with an archive to the data lake."}, {"q": "A request depends on 5 services in series, each 99.95% available. Separately, a component with 99% availability is run as two independent replicas, either of which can serve.", "given": {"a": 0.9995, "n": 5, "b": 0.99}, "calc": [{"ask": "Availability of the 5-service chain", "unit": "%", "expr": "a ** n * 100", "show": "≈ 99.75%", "value": 99.75024987503127}, {"ask": "Availability of the replicated pair", "unit": "%", "expr": "(1 - (1 - b) ** 2) * 100", "show": "≈ 99.99%", "value": 99.99}], "a": "Chains lose availability; redundancy gains it, but only if failures are independent (different AZs, no shared dependency)."}, {"q": "An app runs 5K DB queries/s at 4 ms average each, across 10 app servers.", "given": {"qps": 5000, "ms": 4, "servers": 10}, "calc": [{"name": "conns", "ask": "Connections busy at once", "unit": "", "expr": "qps * ms / 1000", "show": "20", "value": 20.0}, {"ask": "Per app server", "unit": "", "expr": "conns / servers", "show": "2", "value": 2.0}], "a": "Little's law sizes pools: a pool of ~5–10 per server is plenty. Huge pools mostly add contention on the database."}, {"q": "An LSM store absorbs 50K writes/s of 1 KB with a write amplification of ~10.", "given": {"wps": "50e3", "kb": 1, "wa": 10}, "calc": [{"ask": "Physical disk writes", "unit": "MB/s", "expr": "wps * kb * 1e3 * wa / 1e6", "show": "500 MB/s", "value": 500.0}], "a": "Compaction, not the user writes, dominates disk bandwidth and SSD wear. Budget for it when sizing disks."}, {"q": "A page fans out to 50 backends in parallel; each responds slower than its p99 1% of the time.", "given": {"n": 50, "p": 0.99}, "calc": [{"ask": "Requests that hit at least one slow backend", "unit": "%", "expr": "(1 - p ** n) * 100", "show": "≈ 40%", "value": 39.49939328624637}], "a": "The backend p99 becomes the page's p60. Hedged requests, fewer fan-out hops, and partial results tame the tail."}, {"q": "A failed node held 10 TB. Re-replication streams at 200 MB/s.", "given": {"tb": 10, "mbps": 200}, "calc": [{"ask": "Time to restore full replication", "unit": "h", "expr": "tb * 1e12 / (mbps * 1e6) / 3600", "show": "≈ 14 h", "value": 13.88888888888889}], "a": "For 14 hours some data has one fewer copy. Smaller nodes, or many-to-many re-replication from all peers (vnodes), shrink this window."}, {"q": "A Snowflake ID uses 41 bits for milliseconds since a custom epoch.", "given": {"bits": 41}, "calc": [{"ask": "Years until the timestamp overflows", "unit": "years", "expr": "2 ** bits / 1000 / 86400 / 365", "show": "≈ 70", "value": 69.73057000101471}], "a": "~70 years from the chosen epoch: pick a recent epoch, not 1970, or you've already used most of the range."}]}, "drill": {"items": [{"prompt": "Users in Tokyo wait 2 s for product images served from a bucket in us-east-1.", "answer": "cdn-blob", "distractors": ["load-balancing", "caching", "replication"], "why": "Static bytes far from users: serve them from CDN edges near Tokyo, with long-lived hashed URLs."}, {"prompt": "Whenever a popular product's cache entry expires, the database sees 50K identical queries in one second.", "answer": "caching", "distractors": ["rate-limits-ids", "partitioning", "queues"], "why": "A cache stampede. Coalesce misses (single-flight), refresh early, or serve stale while one request recomputes."}, {"prompt": "Placing an order must charge the card, reserve stock and book shipping in three services; any step can fail.", "answer": "dist-transactions", "distractors": ["consensus", "queues", "consistency"], "why": "A saga: local transactions with compensations and idempotency keys, irreversible steps last."}, {"prompt": "Exactly one of five scheduler instances may run nightly billing, and a long GC pause must not cause a second run.", "answer": "consensus", "distractors": ["rate-limits-ids", "replication", "reliability"], "why": "Leader election with a lease, plus a fencing token (or unique run key) so a paused old leader can't act."}, {"prompt": "A single Postgres primary is at 40K writes/s and 90% disk, and traffic triples every year.", "answer": "partitioning", "distractors": ["replication", "caching", "storage-engines"], "why": "Replicas scale reads, not writes or storage. Shard by a key that keeps queries local."}, {"prompt": "After editing their bio, users sometimes see the old one for a few seconds.", "answer": "replication", "distractors": ["partitioning", "queues", "cdn-blob"], "why": "Reads served by a lagging follower. Give read-your-writes: route the writer's reads to the leader or an up-to-date replica briefly."}, {"prompt": "Signup is slow because it waits for the welcome email, the CRM sync and an analytics event.", "answer": "queues", "distractors": ["dist-transactions", "reliability", "apis"], "why": "None of these must finish before responding. Publish an event (via an outbox) and let consumers do the work asynchronously."}, {"prompt": "A dependency's latency jumps to 10 s and your service runs out of threads, failing even requests that don't use it.", "answer": "reliability", "distractors": ["load-balancing", "observability", "caching"], "why": "Timeouts inside the budget, a bulkhead per dependency, and a circuit breaker with a fallback."}, {"prompt": "One partner's nightly batch job hammers the public API and slows it for everyone.", "answer": "rate-limits-ids", "distractors": ["load-balancing", "caching", "queues"], "why": "Per-key quotas with a token bucket; return 429 with Retry-After so the batch spreads out."}, {"prompt": "A query filtering by customer and status and sorted by date scans 40M rows.", "answer": "storage-engines", "distractors": ["partitioning", "caching", "datastores"], "why": "A composite index (customer_id, status, created_at): equality columns first, then the sort column."}, {"prompt": "Two people in different regions edit the same field at once and one edit silently disappears.", "answer": "consistency", "distractors": ["consensus", "partitioning", "rate-limits-ids"], "why": "Concurrent writes resolved by last-writer-wins. Detect conflicts with versions, merge with CRDTs, or give each record a home region."}, {"prompt": "Customers report failures, yet every dashboard is green and CPU and memory look normal.", "answer": "observability", "distractors": ["reliability", "load-balancing", "caching"], "why": "Monitoring measures causes, not user symptoms. Define SLIs from the user's view and alert on SLO burn."}, {"prompt": "Product wants typo-tolerant full-text search over 50M listings.", "answer": "datastores", "distractors": ["storage-engines", "caching", "partitioning"], "why": "Add a search engine (inverted index) fed by CDC from the source of truth; don't bend the OLTP database into one."}, {"prompt": "A mobile app retries POST /payments after a timeout and some customers are charged twice.", "answer": "apis", "distractors": ["dist-transactions", "queues", "consistency"], "why": "The API must be idempotent: the client sends an Idempotency-Key, and the server stores and replays the first result."}, {"prompt": "Instances added during a spike receive almost no traffic from existing gRPC clients.", "answer": "load-balancing", "distractors": ["partitioning", "reliability", "apis"], "why": "Long-lived HTTP/2 connections pin to old instances. Balance per request at L7, or cap connection age."}, {"prompt": "Could the 2 TB working set be served from memory at 300K reads/s, and on how many machines?", "answer": "estimation", "distractors": ["caching", "partitioning", "storage-engines"], "why": "A sizing question first: RAM per node, ops per node, replicas. Then decide between caching and partitioning."}, {"prompt": "One celebrity's data overloads a single shard while the rest of the cluster idles.", "answer": "partitioning", "distractors": ["replication", "load-balancing", "consensus"], "why": "A hot key. Split it (salt the key into N sub-keys), give it dedicated capacity, or cache it in-process."}, {"prompt": "Users upload 4 GB videos and the API servers run out of memory.", "answer": "cdn-blob", "distractors": ["load-balancing", "queues", "apis"], "why": "Bytes shouldn't pass through the API. Use presigned multipart uploads straight to object storage."}, {"prompt": "After a bug fix, analytics must reprocess the last three days of events.", "answer": "queues", "distractors": ["observability", "datastores", "dist-transactions"], "why": "A retained log (Kafka) lets a consumer group reset its offsets and replay; a delete-on-ack queue can't."}, {"prompt": "500 servers must each generate unique, roughly time-ordered 64-bit IDs without a central database.", "answer": "rate-limits-ids", "distractors": ["consensus", "partitioning", "storage-engines"], "why": "Snowflake-style IDs: timestamp + worker ID + sequence, with worker IDs assigned once."}, {"prompt": "Writes must keep being accepted even when an AZ is cut off; occasional stale reads are acceptable.", "answer": "consistency", "distractors": ["consensus", "load-balancing", "partitioning"], "why": "A PA choice under PACELC: favor availability, accept eventual consistency, and reconcile afterwards."}, {"prompt": "Two users booked the same seat even though the booking service checked availability first.", "answer": "consistency", "distractors": ["caching", "replication", "queues"], "why": "Check-then-act on a stale read. Enforce the invariant in the write itself: a conditional update or unique constraint."}, {"prompt": "The database failed over and 3 seconds of acknowledged orders vanished.", "answer": "replication", "distractors": ["consensus", "reliability", "dist-transactions"], "why": "Async replication's RPO. Use semi-sync or quorum commit for the replica that can be promoted."}, {"prompt": "A time-series workload of 1M inserts/s on B-tree indexes saturates the disks with random writes.", "answer": "storage-engines", "distractors": ["partitioning", "caching", "load-balancing"], "why": "An LSM engine turns random writes into sequential appends, with time-bucketed partitions and TTL compaction."}]}, "glossary": {"terms": [{"term": "Back-pressure", "see": "queues", "def": "A slow consumer signals producers to slow down (bounded queues, blocking, 429s) instead of letting work pile up. Trades throughput at the edge for stability downstream."}, {"term": "Bloom filter", "see": "storage-engines", "def": "A bit array answering \"definitely not present\" or \"maybe present\". ~10 bits per key gives ~1% false positives and no false negatives; you can't delete from a plain one."}, {"term": "Bulkhead", "see": "reliability", "def": "Separate resource pools (threads, connections) per dependency or tenant so one failing part can't exhaust everything. Costs some idle capacity."}, {"term": "CAP theorem", "see": "consistency", "def": "During a network partition a system must choose between consistency and availability. Partitions aren't optional, so the real choice is C or A while partitioned."}, {"term": "Cache stampede", "see": "caching", "def": "Many requests miss on the same expired key at once and overload the backend. Fixed with request coalescing, locks or leases, early refresh, or serving stale."}, {"term": "Change data capture (CDC)", "see": "datastores", "def": "Streaming a database's committed changes from its log (e.g. Debezium → Kafka) to update caches, search indexes and warehouses. Avoids dual writes; consumers are eventually consistent."}, {"term": "Circuit breaker", "see": "reliability", "def": "After repeated failures, calls to a dependency fail fast for a cooldown, then a few probes test recovery. Protects both sides; needs a fallback."}, {"term": "Compaction", "see": "storage-engines", "def": "Merging LSM files to drop overwritten and deleted data and bound read cost. Costs background I/O (write amplification) and can cause latency spikes."}, {"term": "Consistent hashing", "see": "partitioning", "def": "Keys and nodes hash onto a ring; each key belongs to the next node. Adding a node moves only ~1/n of keys. Virtual nodes even out the load."}, {"term": "CRDT", "
