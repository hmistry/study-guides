/* storage: localStorage with an in-memory fallback. Prefix sd. (not sg.): Chrome shares one localStorage
   across all file:// pages, so the algo guide and this one must not collide. */
const P = "sd.";
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} },
  keys() {
    const ks = new Set(Object.keys(mem));
    try { for (let i = 0; i < localStorage.length; i++) ks.add(localStorage.key(i)); } catch (e) {}
    return [...ks].filter(k => k.startsWith(P));
  },
};
const progKey = id => `${P}prog.${id}`;
const noteKey = k => `${P}note.${k}`;
const calcKey = (k, i) => `${P}calc.${k}.${i}`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");

/* ── markdown subset: paragraphs, - / 1. lists (2-space nesting), **bold**, `code`, ``` fences, | tables |, > callouts */
const inline = s => String(s).split("`").map((seg, k) => k % 2 ? `<code>${esc(seg)}</code>`
  : esc(seg).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")).join("");
const LIST = /^(\s*)(?:([-*])|\d+\.)\s+(.*)$/;
function md(src) {
  const L = String(src || "").replace(/\s+$/, "").split("\n");
  const starts = l => /^\s*(```|\||> |[-*]\s|\d+\.\s)/.test(l);
  let out = "", i = 0;
  while (i < L.length) {
    const l = L[i], t = l.trim();
    if (!t) { i++; continue; }
    if (t.startsWith("```")) {
      const body = [];
      for (i++; i < L.length && !L[i].trim().startsWith("```"); i++) body.push(L[i]);
      i++;
      out += `<pre class="code">${esc(body.join("\n"))}</pre>`;
    } else if (t.startsWith("|")) {
      const rows = [];
      while (i < L.length && L[i].trim().startsWith("|")) rows.push(L[i++].trim());
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const [head, ...rest] = rows.filter((r, k) => !(k === 1 && /^[|\s:-]+$/.test(r)));
      out += `<div class="tablewrap"><table class="ref"><thead><tr>${cells(head).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>
        <tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    } else if (l.startsWith(">")) {
      const q = [];
      while (i < L.length && L[i].startsWith(">")) q.push(L[i++].replace(/^>\s?/, ""));
      out += `<div class="callout">${inline(q.join(" "))}</div>`;
    } else if (LIST.test(l)) {
      const items = [];
      for (; i < L.length && L[i].trim(); i++) {
        const m = L[i].match(LIST);
        if (m) items.push({ ind: m[1].length, ol: !m[2], text: m[3] });
        else if (/^\s/.test(L[i])) items[items.length - 1].text += " " + L[i].trim();   // wrapped item line
        else break;
      }
      out += mdList(items);
    } else {
      const p = [];
      while (i < L.length && L[i].trim() && !(p.length && starts(L[i]))) p.push(L[i++].trim());
      out += `<p>${inline(p.join(" "))}</p>`;
    }
  }
  return out;
}
function mdList(items) {
  let out = "";
  const stack = [];
  items.forEach(it => {
    while (stack.length && it.ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
    const top = stack[stack.length - 1];
    if (!top || it.ind > top.ind) { const tag = it.ol ? "ol" : "ul"; stack.push({ ind: it.ind, tag }); out += `<${tag}>`; }
    else out += "</li>";
    out += `<li>${inline(it.text)}`;
  });
  while (stack.length) out += `</li></${stack.pop().tag}>`;
  return out;
}

/* ── catalog */
const CAT = DATA.catalog;
const BUILT = new Set([...DATA.blocks, ...DATA.cases].map(x => x.id));
const blockNo = id => pad(CAT.blocks.findIndex(c => c.id === id) + 1);
const caseNo = id => "C" + (CAT.cases.findIndex(c => c.id === id) + 1);
const catName = id => ([...CAT.blocks, ...CAT.cases].find(c => c.id === id) || { name: id }).name;
const pchip = id => BUILT.has(id)
  ? `<a class="pchip" href="#${id}">${esc(catName(id))}</a>`
  : `<span class="pchip soon" title="Not written yet">${esc(catName(id))}</span>`;
const PAGES_CONTENT = [...DATA.blocks.map(b => b.id), ...DATA.cases.map(c => c.id)];

/* ── arch diagram: boxes on a [col, row] grid; base edges faint, a frame's flow in accent with labels */
/* AX and NW are mirrored in build.py (ARCH_AX, ARCH_NW) for the label-fit check */
const AX = 216, AY = 100, NW = 116, NH = 42, AP = 8;
function archFrame(d, f) {
  const at = Object.values(d.nodes).map(n => n.at);
  const minR = Math.min(...at.map(a => a[1])), maxR = Math.max(...at.map(a => a[1])), maxC = Math.max(...at.map(a => a[0]));
  const W = maxC * AX + NW + 2 * AP, H = (maxR - minR) * AY + NH + 2 * AP + 6;
  const C = id => ({ x: AP + NW / 2 + d.nodes[id].at[0] * AX, y: AP + 3 + NH / 2 + (d.nodes[id].at[1] - minR) * AY });
  const rim = (c, dx, dy) => { const t = Math.min(NW / 2 / Math.abs(dx || 1e-9), NH / 2 / Math.abs(dy || 1e-9)); return { x: c.x + dx * t, y: c.y + dy * t }; };
  const ends = (a, b, off = 0) => {
    const p = C(a), q = C(b), len = Math.hypot(q.x - p.x, q.y - p.y), ux = (q.x - p.x) / len, uy = (q.y - p.y) / len;
    const nx = -uy * off, ny = ux * off;
    const s = rim(p, ux, uy), e = rim(q, -ux, -uy);
    return { x1: s.x + ux * 3 + nx, y1: s.y + uy * 3 + ny, x2: e.x - ux * 3 + nx, y2: e.y - uy * 3 + ny, ux, uy };
  };
  let s = "";
  (d.edges || []).forEach(([a, b]) => { const e = ends(a, b); s += `<line class="d-base" x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}"/>`; });
  const flow = f.flow || [];
  const paired = (a, b) => flow.some(([x, y]) => x === b && y === a);
  let labels = "";
  flow.forEach(([a, b, label]) => {
    const two = paired(a, b), e = ends(a, b, two ? 7 : 0);
    const bx = e.x2 - 7 * e.ux, by = e.y2 - 7 * e.uy, px = -e.uy * 4, py = e.ux * 4;
    s += `<line class="d-flow" x1="${e.x1}" y1="${e.y1}" x2="${bx}" y2="${by}"/><path class="d-fhead" d="M${e.x2} ${e.y2}L${bx + px} ${by + py}L${bx - px} ${by - py}z"/>`;
    if (label) {
      // label beside the arrow: on the arrow's own side when paired with its reverse, else above / left;
      // if that spot overlaps a box, use the other side
      let nx = -e.uy, ny = e.ux;
      if (!two && (ny > 0 || (Math.abs(ny) < 1e-6 && nx > 0))) { nx = -nx; ny = -ny; }
      const place = (sx, sy) => {
        const mx = (e.x1 + e.x2) / 2 + sx * 12, my = (e.y1 + e.y2) / 2 + sy * 12 + 4;
        const anchor = Math.abs(e.uy) > 0.2 ? (sx > 0 ? "start" : "end") : "middle";   // diagonal: hang off the line
        const w = String(label).length * 6.7, x0 = anchor === "start" ? mx : anchor === "end" ? mx - w : mx - w / 2;
        return { mx, my, anchor, box: [x0, my - 11, x0 + w, my + 3] };
      };
      const hits = p => Object.keys(d.nodes).some(id => { const c = C(id);
        return p.box[0] < c.x + NW / 2 && p.box[2] > c.x - NW / 2 && p.box[1] < c.y + NH / 2 && p.box[3] > c.y - NH / 2; });
      let p = place(nx, ny);
      if (!two && hits(p)) { const q = place(-nx, -ny); if (!hits(q)) p = q; }
      labels += `<text class="d-flab" x="${p.mx}" y="${p.my}" text-anchor="${p.anchor}">${esc(label)}</text>`;
    }
  });
  Object.entries(d.nodes).forEach(([id, n]) => {
    const { x, y } = C(id), x0 = x - NW / 2, y0 = y - NH / 2;
    const cls = (f.hit || []).includes(id) ? "hit" : (f.win || []).includes(id) ? "win" : "";
    const kind = n.kind || "service";
    if (kind === "db") {
      const ry = 6;
      s += `<path class="d-cell ${cls}" d="M${x0} ${y0 + ry}A${NW / 2} ${ry} 0 0 1 ${x0 + NW} ${y0 + ry}V${y0 + NH - ry}A${NW / 2} ${ry} 0 0 1 ${x0} ${y0 + NH - ry}Z"/>`;
      s += `<path class="d-ring ${cls}" d="M${x0} ${y0 + ry}A${NW / 2} ${ry} 0 0 0 ${x0 + NW} ${y0 + ry}"/>`;
    } else {
      s += `<rect class="d-cell ${cls}" x="${x0}" y="${y0}" width="${NW}" height="${NH}" rx="${kind === "client" ? NH / 2 : kind === "queue" ? 4 : 7}"/>`;
      if (kind === "queue") [7, 11, 15].forEach(o => (s += `<line class="d-ring ${cls}" x1="${x0 + NW - o}" y1="${y0 + 9}" x2="${x0 + NW - o}" y2="${y0 + NH - 9}"/>`));
    }
    const dy = kind === "db" ? 5 : 0;
    s += n.sub ? `<text class="d-lbl" x="${x}" y="${y - 2 + dy}">${esc(n.label)}</text><text class="d-sub" x="${x}" y="${y + 12 + dy}">${esc(n.sub)}</text>`
      : `<text class="d-lbl" x="${x}" y="${y + 4.5 + dy}">${esc(n.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(f.title)}">${s}${labels}</svg>`;
}
function arch(d) {
  return `<figure class="arch">
    <div class="fr-tabs" role="tablist">${d.frames.map((f, i) => `<button type="button" role="tab" data-act="frame" data-frame="${i}" aria-selected="${i === 0}">${esc(f.title)}</button>`).join("")}</div>
    <div class="svgwrap">${d.frames.map((f, i) => `<div data-fr="${i}"${i ? " hidden" : ""}>${archFrame(d, f)}</div>`).join("")}</div>
    ${d.frames.map((f, i) => `<p class="fr-note" data-fr="${i}"${i ? " hidden" : ""}>${inline(f.note || "")}</p>`).join("")}
    <figcaption>${esc(d.caption || "")}</figcaption></figure>`;
}

/* ── numeric estimates */
const CALCS = {};
const SUF = { k: 1e3, K: 1e3, M: 1e6, B: 1e9, G: 1e9, T: 1e12 };
function parseNum(s) {
  const m = String(s).replace(/[\s,≈~]/g, "").match(/^(-?\d*\.?\d+(?:e[+-]?\d+)?)([kKMBGT])?$/);
  return m ? parseFloat(m[1]) * (SUF[m[2]] || 1) : null;
}
function fmt(v) {
  const a = Math.abs(v);
  const [d, s] = a >= 1e12 ? [1e12, "T"] : a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : a >= 1e4 ? [1e3, "K"] : [1, ""];
  return (+(v / d).toPrecision(3)).toLocaleString("en-US") + s;
}
function calcHTML(key, rows) {
  CALCS[key] = rows;
  return `<div class="calc" data-calc="${esc(key)}">${rows.map((r, i) => `
    <div class="crow"><span class="cask">${inline(r.ask)}</span>
      <span class="cin"><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-i="${i}" aria-label="${esc(r.ask)}"
        value="${esc(store.get(calcKey(key, i), ""))}" placeholder="e.g. 12K"><span class="cunit">${esc(r.unit || "")}</span></span>
      <span class="cres"><span class="cv"></span><span class="cans" hidden>ref ${esc(r.show)} · exact ${fmt(r.value)}</span></span></div>`).join("")}
    <div class="calc-actions"><button class="btn" type="button" data-act="check">Check</button><span>Accepts 12K, 3.5e9, 12,000. Within 25% counts as close.</span></div></div>`;
}
function verdict(guess, v) {
  if (guess === null) return ["", ""];
  const r = guess / v;
  if (r >= 0.8 && r <= 1.25) return ["ok", "✓ close"];
  const x = r > 1 ? r : 1 / r, by = x < 10 ? x.toFixed(1) : fmt(x);
  return r >= 1 / 3 && r <= 3 ? ["near", `~ ballpark (${by}× ${r > 1 ? "high" : "low"})`] : ["off", `✗ off ${by}× ${r > 1 ? "high" : "low"}`];
}
function checkCalc(box, reveal) {
  const rows = CALCS[box.dataset.calc];
  box.querySelectorAll(".crow").forEach((row, i) => {
    const g = parseNum(row.querySelector("input").value);
    const [cls, txt] = verdict(g, rows[i].value);
    const cv = row.querySelector(".cv");
    cv.className = "cv " + cls; cv.textContent = txt;
    if (g !== null || reveal) row.querySelector(".cans").hidden = false;
  });
}

function renderDrillPage() {
  return `<section class="sec" id="drill">

    <div class="drill" id="drillCard"></div></section>`;
}
const drill = { order: [], pos: 0, score: 0, answered: false };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function drillStart() { Object.assign(drill, { order: shuffle(PG.drill.items.map((_, i) => i)), pos: 0, score: 0, answered: false }); drillRender(); }
function drillRender() {
  const el = document.getElementById("drillCard"), n = drill.order.length;
  if (drill.pos >= n) {
    el.innerHTML = `<p class="drill-q">Done: ${drill.score} / ${n} correct.</p>
      <div class="drill-actions"><button class="reveal" type="button" data-act="drillRestart">Shuffle and restart</button></div>`;
    return;
  }
  const it = PG.drill.items[drill.order[drill.pos]];
  el.innerHTML = `<div class="drill-h"><span>Question ${drill.pos + 1} / ${n}</span><span>Score ${drill.score}</span></div>
    <p class="drill-q">${inline(it.prompt)}</p>
    <div class="opts">${shuffle([it.answer, ...it.distractors]).map((id, k) => `<button class="opt" type="button" data-pick="${id}"><kbd>${k + 1}</kbd>${esc(catName(id))}</button>`).join("")}</div>
    <div class="verdict" hidden></div>
    <div class="drill-actions" hidden><button class="reveal" type="button" data-act="drillNext">${drill.pos + 1 === n ? "See score" : "Next"}</button></div>`;
  drill.answered = false;
}
function drillPick(id) {
  if (drill.answered) return;
  drill.answered = true;
  const it = PG.drill.items[drill.order[drill.pos]], ok = id === it.answer, el = document.getElementById("drillCard");
  if (ok) drill.score++;
  el.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.pick === it.answer) b.classList.add("right");
    else if (b.dataset.pick === id) b.classList.add("wrong");
  });
  const v = el.querySelector(".verdict");
  v.innerHTML = `${ok ? `<b class="ok">✓ Correct.</b>` : `<b class="no">✗ It's ${esc(catName(it.answer))}.</b>`} ${inline(it.why)} <a href="#${it.answer}">Review the block →</a>`;
  v.hidden = false;
  el.querySelector(".drill-actions").hidden = false;
  el.querySelector("[data-act=drillNext]").focus();
  el.querySelector(".drill-h span:last-child").textContent = `Score ${drill.score}`;
}

function setUnit(unit, open) {
  unit.classList.toggle("open", open);
  unit.querySelectorAll(":scope > .work > .ans, :scope > .ans-wide, :scope > .ans-solo").forEach(el => (el.hidden = !open));
  const btn = unit.querySelector(":scope > .actions .reveal");

  btn.setAttribute("aria-expanded", open);
  const box = unit.querySelector(":scope > .calc");
  if (box && open) checkCalc(box, true);
  if (box && !open) box.querySelectorAll(".crow").forEach(r => { if (!r.querySelector("input").value.trim()) r.querySelector(".cans").hidden = true; });
  const toc = document.querySelector(`[data-toc="${unit.dataset.unit}"]`);
  if (toc) toc.classList.toggle("seen", open);
  const scope = unit.closest(".reveal-scope");
  if (scope) syncRevealAll(scope);
}
function syncRevealAll(scope) {
  const units = [...scope.querySelectorAll(".unit")];
  const all = units.length && units.every(u => u.classList.contains("open"));

  scope.querySelector("[data-act=revealAll]").textContent = all ? "Hide all" : "Reveal all";
}

/* ── backup */
function download(name, text, type = "text/plain") {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportAll() {
  const data = Object.fromEntries(store.keys().map(k => [k, store.get(k, "")]));
  const day = new Date().toISOString().slice(0, 10);
  download(`system-design-progress-${day}.json`, JSON.stringify({ app: "system-design", version: 1, exported: new Date().toISOString(), data }, null, 2), "application/json");
}
function importAll(file) {
  file.text().then(txt => {
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { alert("That file isn't valid JSON."); return; }
    if (obj && obj.app && obj.app !== "system-design") { alert(`That backup is from "${obj.app}", not this guide.`); return; }
    const entries = Object.entries((obj && obj.data) || {}).filter(([k, v]) => k.startsWith(P) && typeof v === "string");
    if (!entries.length) { alert("No saved notes or progress found in that file."); return; }
    if (!confirm(`Import ${entries.length} saved items? Matching items in this browser are overwritten; everything else is kept.`)) return;
    entries.forEach(([k, v]) => store.set(k, v));
    location.reload();
  });
}
function resetAll() {
  if (!confirm("Reset everything? This clears all notes, estimates and progress marks for this guide in this browser.\n\nExport a backup first if you might want them back.")) return;
  store.keys().forEach(k => store.del(k));
  location.hash = "home";
  location.reload();
}

/* ── pages: every section is rendered once; the hash picks which one shows */
let PAGES = [], page = "home";
const SITE_LABELS = { home: "Home", cheat: "Cheat Sheet", framework: "Interview Framework", "est-drill": "Estimation Drill", drill: "Block Drill", glossary: "Tradeoff Glossary" };
const pageLabel = id => SITE_LABELS[id] || catName(id);
function pager(i) {
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  return `<nav class="pager" aria-label="Pages">
    ${prev ? `<a class="pbtn prev" href="#${prev}">← ${esc(pageLabel(prev))}</a>` : ""}
    ${next ? `<a class="pbtn next" href="#${next}">${esc(pageLabel(next))} →</a>` : ""}</nav>`;
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || "home";
  const el = document.getElementById(id), sec = el && el.closest("#main > .sec");
  page = sec ? sec.id : "home";
  document.querySelectorAll("#main > .sec").forEach(s => (s.hidden = s.id !== page));
  document.querySelectorAll(".side a").forEach(a => {
    const on = a.dataset.pid === page;
    a.classList.toggle("active", on);
    if (on && a.parentElement.scrollWidth > a.parentElement.clientWidth)
      a.parentElement.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
  });
  document.title = page === "home" ? "System Design" : `${pageLabel(page)} · System Design`;
  if (sec && el !== sec) el.scrollIntoView();
  else window.scrollTo(0, 0);
}
function go(step) {
  const next = PAGES[PAGES.indexOf(page) + step];
  if (next) location.hash = next;
}
const grow = ta => { ta.style.height = "auto"; ta.style.height = Math.max(130, ta.scrollHeight + 2) + "px"; };

function init() {
  PAGES = ["home", "cheat", "framework", ...PAGES_CONTENT, "est-drill", "drill", "glossary"];
  const main = document.getElementById("main");
  main.innerHTML = renderHome() + renderCheat() + renderFramework() + DATA.blocks.map(renderBlock).join("") + DATA.cases.map(renderCase).join("")
    + renderEstDrill() + renderDrillPage() + renderGlossary();
  PAGES.forEach((id, i) => document.getElementById(id).insertAdjacentHTML("beforeend", pager(i)));
  document.getElementById("side").innerHTML = renderSide();
  applyProgress(); drillStart(); filterGlossary(); route();
  document.getElementById("glFilter").addEventListener("input", filterGlossary);
  window.addEventListener("afterprint", () => document.body.classList.remove("print-cheat"));
  window.addEventListener("hashchange", route);
  window.addEventListener("hashchange", () => document.querySelectorAll(`#${page} textarea`).forEach(grow));
  document.querySelectorAll(`#${page} textarea`).forEach(grow);

  main.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.note) {
      store.set(noteKey(t.dataset.note), t.value);
      t.closest(".unit").classList.toggle("blank", !t.value.trim());
      grow(t);
    } else if (t.closest(".calc")) {
      store.set(calcKey(t.closest(".calc").dataset.calc, t.dataset.i), t.value);
    }
  });
  main.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.closest(".calc")) { e.preventDefault(); checkCalc(e.target.closest(".calc")); }
    if (e.key === "Escape" && /TEXTAREA|INPUT/.test(e.target.tagName)) e.target.blur();
  });
  main.addEventListener("click", e => {
    const t = e.target;
    const actEl = t.closest("[data-act]"), act = actEl?.dataset.act;
    if (act === "exportAll") return exportAll();
    if (act === "importAll") return document.getElementById("importFile").click();
    if (act === "resetAll") return resetAll();
    if (act === "check") return checkCalc(actEl.closest(".calc"));
    if (act === "printCheat") { document.body.classList.add("print-cheat"); window.print(); return; }
    if (act === "drillNext") { drill.pos++; drillRender(); return; }
    if (act === "drillRestart") return drillStart();
    if (t.closest("[data-pick]")) return drillPick(t.closest("[data-pick]").dataset.pick);
    if (act === "frame") {
      const fig = actEl.closest(".arch"), i = actEl.dataset.frame;
      fig.querySelectorAll("[data-frame]").forEach(b => b.setAttribute("aria-selected", b === actEl));
      fig.querySelectorAll("[data-fr]").forEach(el => (el.hidden = el.dataset.fr !== i));
      return;
    }
    if (act === "revealAll") {
      const scope = actEl.closest(".reveal-scope"), open = !scope.classList.contains("allopen");
      scope.querySelectorAll(".unit").forEach(u => setUnit(u, open));
      return;
    }
    if (act === "clearNotes") {
      const sec = actEl.closest(".sec");
      if (!confirm("Clear all your notes and estimates on this case?")) return;
      sec.querySelectorAll("textarea[data-note]").forEach(ta => { ta.value = ""; store.del(noteKey(ta.dataset.note)); ta.closest(".unit").classList.add("blank"); grow(ta); });
      sec.querySelectorAll(".calc").forEach(box => box.querySelectorAll("input").forEach(inp => { inp.value = ""; store.del(calcKey(box.dataset.calc, inp.dataset.i)); }));
      sec.querySelectorAll(".cv").forEach(cv => { cv.className = "cv"; cv.textContent = ""; });
      return;
    }
    if (t.closest(".reveal")) {
      const unit = t.closest(".unit");
      return setUnit(unit, !unit.classList.contains("open"));
    }
    if (t.closest(".st")) {
      const st = t.closest(".st").dataset.st;
      if (store.get(progKey(page), "") === st) store.del(progKey(page)); else store.set(progKey(page), st);
      applyProgress();
    }
  });
  document.getElementById("importFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (f) importAll(f); e.target.value = "";
  });
  /* keys (never while typing): ← → change page; on the drill page 1–4 answer, Enter goes next (focused button) */
  document.addEventListener("keydown", e => {
    if (/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
    if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); return go(e.key === "ArrowLeft" ? -1 : 1); }
    if (page !== "drill") return;
    if (/^[1-4]$/.test(e.key)) {
      const b = document.querySelectorAll("#drillCard .opt")[+e.key - 1];
      if (b && !b.disabled) { e.preventDefault(); drillPick(b.dataset.pick); }
    }
  });
}
init();
</script>
</body>
</html>
