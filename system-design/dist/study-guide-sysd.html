 what does it get back?\n- How are rules managed?\n- What does the client see when limited?\n", "answer": "```\nInternal (gateway → limiter library / service):\n  check(key, rule_id, cost = 1)\n  → { allowed: bool, remaining: int, reset_ms: int, retry_after_ms: int }\n\nRules (admin API, versioned):\n  PUT /v1/rules/{rule_id}\n  { \"match\": {\"tier\": \"free\", \"route\": \"/v1/search\"},\n    \"limits\": [{\"rate\": 20, \"per\": \"1s\", \"burst\": 40}, {\"rate\": 10000, \"per\": \"1d\"}],\n    \"on_failure\": \"open\" }\n\nClient-facing response when limited:\n  429 Too Many Requests\n  Retry-After: 3\n  RateLimit-Limit: 1000   RateLimit-Remaining: 0   RateLimit-Reset: 3\n```\n- `cost` lets expensive endpoints consume more than one unit.\n- Return remaining-quota headers on every response so well-behaved clients slow down before they're rejected.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- Where do rules live, and how do gateways get them?\n- What state does each counter keep, and where?\n", "answer": "**Rules:** a small config store (Postgres or etcd), versioned. Gateways load all rules into memory and receive pushes on change; the rules never sit on the request path.\n\n**Counters (token bucket per key and rule):**\n```\nkey:   rl:{api_key}:{rule_id}          (hash tag {api_key} → one Redis slot per key)\nvalue: tokens (float), last_refill_ms (int)\nTTL:   ~2 × window, so idle keys expire on their own\n```\n- Token bucket: 2 numbers per key, allows a configured burst, and refill is computed lazily on access, so there are no timers.\n- For daily quotas, a fixed-window counter `rl:{key}:{rule}:{yyyymmdd}` with `INCRBY` and expiry is simpler and accurate enough.\n- Sharding by `api_key` keeps all of a key's rules on one shard, so a multi-window check is one script call.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Draw the request path, rule distribution and the failure path.", "diagram": {"type": "arch", "caption": "limiter as a library in the gateway, state in sharded Redis", "nodes": {"client": {"label": "Client", "at": [0, 1], "kind": "client"}, "gw": {"label": "Gateway", "sub": "limiter lib", "at": [1, 1]}, "redis": {"label": "Redis cluster", "sub": "by api_key", "at": [2, 0], "kind": "cache"}, "api": {"label": "Backend", "at": [2, 2]}, "rules": {"label": "Rules service", "sub": "push on change", "at": [0, 0]}}, "edges": [["client", "gw"], ["gw", "redis"], ["gw", "api"], ["rules", "gw"]], "frames": [{"title": "Check", "flow": [["client", "gw", "request"], ["gw", "redis", "Lua take"], ["gw", "api", "allowed"]], "hit": ["api"], "win": ["redis", "gw"], "note": "The gateway matches rules in memory, then runs one Lua script on the key's shard that refills and takes tokens for every matching rule atomically. ~0.5 ms in the same AZ."}, {"title": "Rules update", "flow": [["rules", "gw", "new version"]], "win": ["rules", "gw"], "note": "Rules are pushed (or polled every few seconds) and swapped atomically in each gateway. Nothing on the request path waits for the rules service."}, {"title": "Redis down", "flow": [["client", "gw", "request"], ["gw", "api", "local limit"]], "hit": ["api"], "win": ["gw"], "note": "The breaker to the shard opens. The gateway falls back to a local bucket with limit ÷ gateway count: approximate, but the API stays up. Login and OTP rules fail closed instead."}]}, "answer": "- **Limiter as a library** inside each gateway, not a separate hop: rules are matched locally, and only the counter update goes to Redis.\n- **Redis cluster sharded by API key**, one Lua script per request for atomic refill-and-take across all matching rules.\n- **Rules service** pushes versioned rules; gateways keep the last good version if it's down (static stability).\n- **Failure mode is a decision per rule:** fail open with local approximate limits, or fail closed.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "algorithm", "q": "Which algorithm do you choose, and why not a fixed window?", "answer": "- **Fixed window** allows 2× the limit across a boundary (100 at 0:59 and 100 at 1:00). Fine for daily quotas, wrong for per-second protection.\n- **Sliding window log** is exact but stores a timestamp per request: too much memory at 1M req/s.\n- **Sliding window counter** blends the current and previous window weighted by overlap: 2 counters, error of a few percent. A good choice if you think in \"N per window\".\n- **Token bucket** (pick): rate + burst stated explicitly, 2 numbers per key, lazy refill, and it maps directly to how customers think (\"20/s, bursts up to 40\").\n"}, {"id": "atomicity", "q": "Hundreds of gateways update the same key at once. How do you avoid races?", "answer": "- Never `GET` then `SET` from the gateway: concurrent requests all read the same token count and all pass.\n- Run refill + check + decrement in **one Lua script** (atomic per shard), passing the current time from the gateway or using Redis `TIME`.\n- Multi-rule checks (per-second and per-day) for one key live on one shard thanks to the `{api_key}` hash tag, so one script checks all of them and takes from none if any fails.\n- Clock skew between gateways: let the script use the Redis server's clock, so refill math has one time source per key.\n"}, {"id": "latency", "q": "Even 0.5 ms per request matters at the edge. How do you cut the round trip without losing control?", "answer": "- **Local pre-allocation:** each gateway leases a small batch of tokens (e.g. 5% of the key's rate) from Redis and spends them locally, refilling asynchronously. Over-admission is bounded by outstanding leases.\n- **Async sync of local counters:** count locally and push deltas every ~100 ms; reject locally once the last known global count plus local delta exceeds the limit. Small over-admission, no per-request hop.\n- **Only hot keys need the precise path**; most keys are far below their limit, so a local check plus occasional sync suffices.\n- Pipeline and colocate Redis in the same AZ as gateways; use connection pooling and avoid TLS handshakes per request.\n"}, {"id": "hot-keys", "q": "One enterprise customer sends 300K requests/s with a limit of 400K/s. One Redis shard handles ~100K ops/s. What now?", "answer": "- A single key can't be served by one shard. **Split the counter** into N sub-buckets (`key#0..7`), each with limit/N; a gateway picks a sub-bucket by its own ID. Slight unfairness between sub-buckets, but load spreads.\n- Or use the **local pre-allocation** approach for this key: gateways lease large token batches, so Redis sees a few ops per second per gateway instead of every request.\n- Detect hot keys automatically (top-K counting in gateways) and switch their strategy; don't configure it by hand.\n"}, {"id": "multi-region", "q": "Limits are global per key, but traffic arrives in 3 regions. How do you enforce them?", "answer": "- A single global counter adds a cross-region RTT (~70–150 ms) to every request: unacceptable.\n- **Split the budget per region** (e.g. by recent traffic share) and enforce locally; rebalance shares every few seconds through a small global coordinator. Over-admission is bounded by the rebalance interval.\n- Or **replicate counters asynchronously** (CRDT-style G-counters per region) and enforce on local count + last known remote counts; accept a few percent over-admission.\n- Daily quotas are easier: sync usage every minute; nobody notices 0.1% overage on a daily limit.\n"}, {"id": "failure", "q": "What happens when Redis, or the whole limiter, fails?", "answer": "- **Per-rule failure policy:** fail open for ordinary API traffic (an outage of the limiter must not become an outage of the API) and fail closed for login, OTP and abuse-sensitive endpoints.\n- **Degraded mode:** fall back to in-memory local buckets with limit ÷ number of gateways; approximate but protective.\n- **Timeouts** of a few ms on the Redis call and a circuit breaker per shard, so a slow shard can't add latency to everything.\n- Redis replicas with automatic failover; losing a few seconds of counter state only grants a brief extra allowance, which is acceptable.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10× (10M req/s):** Redis ops per second. Local pre-allocation or delta sync becomes the default path rather than the exception; hot-key detection gets more important.\n\n**Monitor:** limiter p99 latency, Redis ops and errors per shard, fail-open events, 429 rate per rule and tier, over-admission (sampled comparison with ground truth), rule propagation lag.\n\n**Staff-level signals**\n- States the accuracy vs latency trade-off up front and chooses per rule.\n- Decides failure behavior explicitly (open vs closed) and designs a degraded mode.\n- Handles hot keys and multi-region with bounded over-admission rather than global locks.\n- Keeps rules off the hot path and the limiter in-process.\n\n**Common mistakes**\n- A separate limiter microservice hop on every request.\n- Non-atomic read-modify-write counters.\n- Per-server limits presented as global ones.\n- Ignoring what happens when Redis is down.\n"}]}, {"id": "kv-store", "name": "Key-Value Store", "prompt": "Design a distributed key-value store like DynamoDB or Cassandra. It supports get, put and delete, stays writable through node failures, offers tunable consistency, and scales to petabytes.", "blocks": ["partitioning", "replication", "consistency", "storage-engines", "consensus", "estimation"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- What operations and value sizes?\n- Availability vs consistency: which do you favor, and is it tunable?\n- Scale and latency targets?\n", "answer": "**Functional**\n- `get(key)`, `put(key, value)`, `delete(key)`; values up to ~1 MB; optional TTL.\n- Per-request consistency level (one, quorum, all).\n- Out of scope: secondary indexes, multi-key transactions, range queries across keys (mention as extensions).\n\n**Non-functional**\n- **Always writable** (AP-leaning, Dynamo-style) with eventual consistency by default; quorum reads/writes when the caller asks.\n- p99 < 10 ms for single-key operations within a region.\n- Durable across node and AZ failures; scale horizontally by adding nodes without downtime.\n\n**Scale (assumed)**\n- 1 PB of data, 5M ops/s, replication factor 3 across 3 AZs.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "1 PB logical data, RF = 3, ~10 TB usable per node (leaving disk headroom), 5M ops/s total.\n", "given": {"pb": 1, "rf": 3, "node_tb": 10, "qps": "5e6"}, "calc": [{"name": "raw", "ask": "Stored with replication", "unit": "PB", "expr": "pb * rf", "show": "3 PB", "value": 3.0}, {"name": "nodes", "ask": "Nodes for storage", "unit": "", "expr": "raw * 1000 / node_tb", "show": "300", "value": 300.0}, {"ask": "Replica operations per node per second (every op touches RF replicas)", "unit": "/s", "expr": "qps * rf / nodes", "show": "50K/s", "value": 50000.0}], "answer": "- **~300 nodes** for storage alone, so membership changes and failures are constant: one node fails somewhere most days. Automation and self-healing are requirements.\n- **~50K replica ops/s per node** is within reach of an LSM engine on NVMe, so storage, not CPU, drives the node count.\n- At this size, **rebalancing traffic** (moving TBs when nodes join or leave) must be throttled so it doesn't hurt latency.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "- Define get / put / delete, including how versions and consistency levels appear.\n- How does a client handle concurrent writes?\n", "answer": "```\nget(key, consistency = ONE | QUORUM | ALL)\n  → { values: [ {value, version} ], context }     # >1 value = concurrent siblings\n\nput(key, value, context?, consistency = …, ttl?)\n  → { version }                                   # context from a prior get\n\ndelete(key, context?)                             # writes a tombstone\n```\n- **`context`** carries the version (vector clock) the client last saw, so the store can tell an update from a concurrent write.\n- Simpler alternative used by Cassandra: last-write-wins by timestamp, no siblings; easier API, but concurrent writes silently lose one.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- How is data partitioned and placed on nodes?\n- What does each node store per key, and on what storage engine?\n", "answer": "- **Partitioning:** consistent hashing of the key onto a ring with many virtual nodes per physical node (e.g. 256), so load evens out and adding a node takes small slices from everyone.\n- **Placement:** each key is stored on the next N = 3 distinct nodes clockwise, chosen to be in different AZs (rack-aware placement).\n- **Per key:** value, version (vector clock or timestamp), optional TTL, tombstone flag.\n- **Engine:** LSM tree per node (commit log + memtable + SSTables with Bloom filters): write-optimized, sequential I/O, compaction in the background.\n- **Metadata:** ring membership and token ownership, spread by gossip; no central master on the data path.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Walk through a quorum write, a quorum read, and a write while one replica is down.", "diagram": {"type": "arch", "caption": "leaderless replication, N = 3, W = 2, R = 2", "nodes": {"client": {"label": "Client", "at": [0, 1], "kind": "client"}, "coord": {"label": "Coordinator", "sub": "any node", "at": [1, 1]}, "a": {"label": "Replica A", "sub": "AZ 1", "at": [2, 0], "kind": "db"}, "b": {"label": "Replica B", "sub": "AZ 2", "at": [2, 1], "kind": "db"}, "c": {"label": "Replica C", "sub": "AZ 3", "at": [2, 2], "kind": "db"}, "h": {"label": "Node D", "sub": "holds hints", "at": [3, 2], "kind": "db"}}, "edges": [["client", "coord"], ["coord", "a"], ["coord", "b"], ["coord", "c"], ["coord", "h"]], "frames": [{"title": "Write (W=2)", "flow": [["client", "coord", "put"], ["coord", "a", "write"], ["coord", "b", "write"], ["coord", "c", "write"]], "hit": ["a", "b"], "win": ["c"], "note": "The coordinator sends the write to all 3 replicas and acknowledges after 2 succeed. The third catches up when its write lands, or through repair."}, {"title": "Read (R=2)", "flow": [["client", "coord", "get"], ["coord", "a", "read"], ["coord", "b", "read"], ["coord", "c", "repair"]], "hit": ["a", "b"], "win": ["c"], "note": "Read from 2; R + W > N means at least one has the latest version. If they differ, return the newest (or siblings) and write it back to stale replicas: read repair."}, {"title": "Replica down", "flow": [["coord", "a", "write"], ["coord", "b", "write"], ["coord", "h", "hint for C"]], "hit": ["a", "b"], "win": ["h"], "note": "C is down. The write still reaches W = 2; a stand-in node keeps a hint for C and hands it off when C returns (hinted handoff). Merkle-tree anti-entropy repairs anything hints miss."}]}, "answer": "- **Smart clients or any node as coordinator**: hash the key, find the N replicas from the ring, fan out.\n- **Quorums:** W + R > N for read-your-latest-write behavior in the normal case; ONE for lowest latency.\n- **Three repair mechanisms:** read repair (on reads), hinted handoff (short outages), anti-entropy with Merkle trees (long outages, missed hints).\n- **Gossip** for membership and failure detection; no single master on the data path.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "conflicts", "q": "Two clients write the same key concurrently on different replicas. How do you resolve the conflict?", "answer": "| Approach | How | Cost |\n|---|---|---|\n| Last-write-wins | Highest timestamp wins | Simple; clock skew silently drops writes |\n| Vector clocks + siblings | Detect concurrency; return all siblings; the client merges and writes back | Correct; complex clients; vector growth |\n| CRDTs | Values are mergeable types (counters, sets, maps) | Automatic merges; limited to those types |\n\nDefault to **LWW** for overwrite-style data (profiles, sessions) where losing a concurrent write is acceptable, and offer **CRDT types** (counters, sets) for data that must merge.\nSay clearly that quorum + LWW is not linearizable.\n"}, {"id": "membership", "q": "How do nodes know who's in the cluster and who's down?", "answer": "- **Gossip:** every second each node exchanges membership state (heartbeat counters, token ownership) with a few random peers; information spreads in O(log n) rounds.\n- **Failure detection:** phi-accrual detector on heartbeat arrival times outputs a suspicion level rather than a binary; a node is marked down when phi crosses a threshold.\n- **Temporary vs permanent:** a down node triggers hinted handoff, not data movement. Only an operator (or a long timeout) removes a node and triggers re-replication, which avoids moving TBs for a reboot.\n- Seed nodes help new nodes bootstrap; config changes like adding a DC can go through a small consensus store.\n"}, {"id": "anti-entropy", "q": "A replica was down for 6 hours and hints expired. How does it catch up without comparing every key?", "answer": "- Each node builds a **Merkle tree** per token range: leaves hash key ranges, parents hash children.\n- Two replicas exchange roots; if they match, the range is identical. Otherwise, descend only into differing subtrees, and transfer just the differing key ranges.\n- Run repair continuously in the background (incremental repair), throttled, and always within the tombstone grace period, or deleted data can come back.\n"}, {"id": "deletes", "q": "Why can't a delete just remove the key, and what are tombstones' costs?", "answer": "- If one replica missed the delete, removing the key would let repair copy the old value back: **zombie data**.\n- So a delete writes a **tombstone** with a timestamp, which replicates like a write and is dropped only after `gc_grace` (e.g. 10 days) once all replicas have it.\n- Costs: tombstones take space and slow reads (scanning past them). Queue-like workloads with many deletes, or wide partitions with many deleted cells, cause read timeouts. Prefer TTLs and time-bucketed partitions so whole SSTables expire together.\n"}, {"id": "scaling", "q": "You add 30 nodes to a 300-node cluster. What happens, and what can go wrong?", "answer": "- Each new node takes a set of vnodes (token ranges) from many existing nodes; ~1/11 of data streams to the new nodes from across the cluster, in parallel.\n- Data streaming is **throttled** so foreground latency holds; the new node serves reads for a range only after it has fully streamed it.\n- Risks: adding many nodes at once (overlapping range moves, consistency gaps), disk space on donors during compaction, and hot partitions that adding nodes doesn't fix (one hot key stays on its N replicas).\n"}, {"id": "consistency-levels", "q": "A team uses W = 1, R = 1 for speed and complains about stale reads. Explain and offer options.", "answer": "- With W + R ≤ N, a read can hit a replica the write hasn't reached yet: staleness is expected, typically ms but unbounded during failures.\n- Options: W = QUORUM, R = QUORUM for read-your-latest-write in the normal case; or keep W = 1 but route a session's reads to the coordinator/replica it wrote to; or LOCAL_QUORUM to stay within a region.\n- True linearizability needs more than quorums (e.g. Paxos-based lightweight transactions for compare-and-set), at extra round trips.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10×:** operational load: node failures are continuous, repair and streaming traffic compete with user traffic, and gossip state grows. Hot partitions become visible.\n\n**Monitor:** p99 per operation and consistency level, hinted-handoff backlog, repair progress and Merkle mismatches, pending compactions, tombstones scanned per read, disk usage per node, dropped mutations.\n\n**Staff-level signals**\n- Explains the quorum math and states plainly that it isn't linearizable.\n- Chooses a conflict strategy per data type and names the data-loss behavior of LWW.\n- Separates temporary failure (hints) from permanent failure (re-replication).\n- Talks about tombstones, repair windows and throttled rebalancing: the operational reality.\n\n**Common mistakes**\n- A central master on the data path.\n- `hash mod N` placement.\n- Ignoring deletes and zombie data.\n- Claiming strong consistency from W + R > N alone.\n"}]}, {"id": "news-feed", "name": "News Feed", "prompt": "Design the home timeline of a social network like Twitter/X or Facebook. Users follow others and post; opening the app shows a ranked feed of recent posts from the people they follow.", "blocks": ["caching", "queues", "partitioning", "datastores", "estimation", "reliability"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- Which features are core, and which are out?\n- What latency and freshness do users expect?\n- What does the follower distribution look like, and why does it matter?\n", "answer": "**Functional**\n- Post (text + media references), follow / unfollow, view home feed (paginated), ranked by relevance with recency.\n- Out of scope: search, DMs, ad serving (mention where ads would be blended in), media processing.\n\n**Non-functional**\n- Feed load p99 **< 200 ms**; feed is read far more than posts are written.\n- Eventual consistency is fine: a new post can take a few seconds to appear in followers' feeds.\n- Highly available reads: a stale feed beats an error.\n\n**Scale (assumed)**\n- 300M DAU, 10 feed loads per user per day, 0.5 posts per user per day, 200 followers on average, celebrities with up to 100M followers.\n\n> The follower distribution is extremely skewed. Any design that treats a celebrity like an average user breaks.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "300M DAU; 10 feed loads and 0.5 posts per user per day; 200 followers on average; keep the latest 500 post IDs (8 bytes each) per user's precomputed feed; peak = 3× average.\n", "given": {"dau": "300e6", "loads": 10, "posts": 0.5, "followers": 200, "feed_len": 500, "id_bytes": 8, "peak": 3}, "calc": [{"ask": "Peak feed reads", "unit": "/s", "expr": "dau * loads / 86400 * peak", "show": "≈ 100K/s", "value": 104166.66666666666}, {"name": "wps", "ask": "Average posts", "unit": "/s", "expr": "dau * posts / 86400", "show": "≈ 1.7K/s", "value": 1736.111111111111}, {"ask": "Fan-out writes if every post is pushed to every follower", "unit": "/s", "expr": "wps * followers", "show": "≈ 350K/s", "value": 347222.2222222222}, {"ask": "Memory for precomputed feeds (IDs only)", "unit": "TB", "expr": "dau * feed_len * id_bytes / 1e12", "show": "1.2 TB", "value": 1.2}], "answer": "- **100K feed reads/s at peak** must be cheap, so feeds should be precomputed rather than assembled from scratch on every read.\n- **Fan-out on write turns 1.7K posts/s into ~350K feed inserts/s** on average. Manageable with a queue and workers, but a single 100M-follower post would be 100M inserts: the celebrity problem.\n- **1.2 TB of feed IDs** fits a Redis cluster of ~20–30 nodes. Store only IDs in feeds and hydrate posts from a separate post cache.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "Define posting, following and reading the feed, including pagination.", "answer": "```\nPOST /v1/posts                      { \"text\": \"...\", \"media_ids\": [...] }      → 201 { post_id }\nPOST /v1/users/{id}/follow          → 204          DELETE … /follow → 204\nGET  /v1/feed?cursor=<opaque>&limit=20\n  → { \"items\": [ {post, author, counts, reason} ], \"next_cursor\": \"...\" }\n```\n- **Cursor pagination**: the cursor encodes the last item's position (score and ID) in the user's feed snapshot, so new posts don't shift pages.\n- Pull-to-refresh asks for items newer than the first one shown (`since` cursor).\n- Posting returns immediately; fan-out happens asynchronously.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- Where do posts, the follow graph and feeds live?\n- What's the partition key for each?\n", "answer": "```\nposts        post_id (Snowflake, time-ordered) PK · author_id · text · media · created_at\n             → sharded KV / wide-column, by post_id; plus a per-author timeline (author_id, post_id DESC)\nfollows      (follower_id → followee_id) and the reverse (followee_id → follower_id)\n             → two tables, each partitioned by its first ID\nfeed cache   feed:{user_id} → sorted set of (score, post_id), capped at ~500–800\n             → Redis cluster, by user_id\ncounts       likes / replies per post → counters, aggregated asynchronously\n```\n- The **reverse follow table** (followee → followers) drives fan-out; the forward table drives \"following\" lists and pull merges.\n- **Feeds hold IDs only.** Post content, author profiles and counts are hydrated from their own caches, so an edit or delete shows up everywhere.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Draw the write path (post → followers' feeds) and the read path, and show how celebrities differ.", "diagram": {"type": "arch", "caption": "hybrid fan-out, push for most authors and pull for celebrities", "nodes": {"author": {"label": "Author", "at": [0, 0], "kind": "client"}, "reader": {"label": "Reader", "at": [0, 2], "kind": "client"}, "post": {"label": "Post service", "at": [1, 0]}, "kafka": {"label": "Post events", "sub": "Kafka", "at": [2, 0], "kind": "queue"}, "fan": {"label": "Fan-out", "sub": "workers", "at": [3, 0]}, "graph": {"label": "Follow graph", "at": [3, 1], "kind": "db"}, "feed": {"label": "Feed cache", "sub": "Redis · IDs", "at": [2, 1], "kind": "cache"}, "fsvc": {"label": "Feed service", "sub": "merge · rank", "at": [1, 2]}, "pcache": {"label": "Post cache", "sub": "hydrate", "at": [2, 2], "kind": "cache"}}, "edges": [["author", "post"], ["post", "kafka"], ["kafka", "fan"], ["fan", "graph"], ["fan", "feed"], ["reader", "fsvc"], ["fsvc", "feed"], ["fsvc", "pcache"]], "frames": [{"title": "Post", "flow": [["author", "post", "POST"], ["post", "kafka", "event"], ["kafka", "fan", "consume"], ["fan", "graph", "followers"], ["fan", "feed", "ZADD × 200"]], "hit": ["feed"], "win": ["post", "kafka", "fan"], "note": "The post is stored, then an event drives fan-out workers that page through the author's followers and insert the post ID into each active follower's feed."}, {"title": "Read feed", "flow": [["reader", "fsvc", "GET /feed"], ["fsvc", "feed", "top 800 IDs"], ["fsvc", "pcache", "multi-get"]], "hit": ["feed", "pcache"], "win": ["fsvc"], "note": "The feed service reads candidate IDs, merges in recent posts from followed celebrities, ranks, hydrates the top 20 with a batched multi-get, and returns a cursor."}, {"title": "Celebrity post", "flow": [["author", "post", "POST"], ["post", "kafka", "event"], ["kafka", "fan", "skip push"]], "win": ["post", "kafka", "fan"], "note": "Authors above a follower threshold (e.g. 10K) aren't fanned out. Their posts sit in their author timeline, and each reader pulls them at read time from the few celebrities they follow."}]}, "answer": "- **Write path:** post service → posts store → `post-created` event → fan-out workers → follower graph → feed cache (sorted sets of IDs).\n- **Read path:** feed service → feed cache candidates + pulled celebrity posts → ranker → hydrate from post / user / counts caches → response.\n- **Hybrid fan-out:** push for normal authors, pull for celebrities and for very inactive readers.\n- Everything on the read path is cached; the source-of-truth stores only see misses and writes.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "fanout", "q": "Compare fan-out on write, fan-out on read, and the hybrid. Where do you set the threshold?", "answer": "| Model | Read cost | Write cost | Problem |\n|---|---|---|---|\n| Push (on write) | One cache read | followers × inserts per post | Celebrities: 100M inserts per post; wasted work for inactive followers |\n| Pull (on read) | Query every followee's recent posts, merge | One insert | Reads fan out to hundreds of timelines: slow and expensive at 100K reads/s |\n| Hybrid | Cache read + merge a few celebrity timelines | Bounded by threshold | Two code paths to maintain |\n\n**Threshold** by follower count (e.g. 10K–100K) or dynamically by measured fan-out cost. Also skip pushing to users inactive for > 30 days and rebuild their feed on their next login.\n"}, {"id": "ranking", "q": "How do you rank the feed within a 200 ms budget?", "answer": "- **Candidate generation:** ~500–1,000 IDs from the precomputed feed + pulled celebrity posts (+ recommendations / ads from other sources).\n- **Lightweight scoring:** features (author affinity, recency, engagement so far, media type) fetched from a feature store; a small model scores all candidates in ~20–50 ms.\n- **Heavy ranking** on the top ~100 with a larger model; then **policy rules**: diversity (not 5 posts from one author), freshness boosts, blocked/muted filters.\n- Cache the ranked page per user for a short time so pagination is stable; re-rank on refresh.\n"}, {"id": "hydration", "q": "A feed page shows 20 posts with authors, counts and \"liked by friends\". How do you keep hydration fast?", "answer": "- **Batched multi-gets** against post, user and counter caches (one round trip each, in parallel), never per-item calls.\n- **Counters** (likes, replies) come from a separate, eventually consistent counter service, cached with short TTLs; exact counts aren't needed.\n- **Hot posts** (viral) are replicated in an in-process cache on feed servers to avoid hot keys in Redis.\n- Partial failure: if counts time out, render without them rather than failing the page.\n"}, {"id": "consistency", "q": "A user deletes a post, or blocks someone. How do you keep feeds correct?", "answer": "- Feeds hold IDs, so **hydration filters** deleted posts (tombstoned in the post store) and blocked/muted authors at read time. That's immediate without touching millions of feeds.\n- Asynchronously remove the ID from feeds (best effort) to reclaim space.\n- Unfollow: filter at read time using the current follow set, then clean up lazily.\n- Privacy changes (a protected account) are also enforced at hydration, never trusted to the precomputed feed.\n"}, {"id": "new-user", "q": "What about a brand-new user, or one returning after 6 months?", "answer": "- Their feed isn't precomputed (or was evicted). **Build on demand**: pull recent posts from their followees' author timelines (pull path), rank, and write the result into the feed cache.\n- New users with few follows get **recommended content** (popular in their region / interests) blended in.\n- Make the cold path fast enough (parallel timeline reads, limits per author) and protect it with concurrency limits so a wave of returning users can't overload storage.\n"}, {"id": "failure", "q": "The Redis feed cluster loses a shard. What happens to users on it?", "answer": "- Feeds are **derived data**: they can be rebuilt from posts + follow graph. Users on the lost shard fall back to the pull path (slower, still correct) while the shard is rebuilt.\n- Protect storage from the fallback stampede: rate-limit rebuilds, serve a simpler \"recent from followees\" feed under load, use replicas so a single node loss is a failover, not a rebuild.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10×:** fan-out write volume and feed-cache memory. Raise the push threshold, trim feed length, push only to active users, and move more authors to the pull path.\n\n**Monitor:** feed p99 by stage (candidates, rank, hydrate), fan-out lag (post → visible in feeds), cache hit ratios, ranker timeouts, empty-feed rate.\n\n**Staff-level signals**\n- Starts from the skewed follower distribution and lands on hybrid fan-out with a stated threshold.\n- Keeps feeds as ID lists and hydrates at read time, which solves deletes, edits and privacy.\n- Splits the read path into a latency budget per stage, with graceful degradation.\n- Treats the feed cache as rebuildable derived data.\n\n**Common mistakes**\n- Pure fan-out on write (celebrities) or pure fan-out on read (latency).\n- Storing full post bodies in every follower's feed.\n- Offset pagination on a feed that changes every second.\n"}]}, {"id": "chat", "name": "Chat / Messaging", "prompt": "Design a messaging app like WhatsApp or Messenger with 1:1 and group chats, delivery and read receipts, online presence, offline delivery and multiple devices per user.", "blocks": ["apis", "load-balancing", "queues", "partitioning", "datastores", "rate-limits-ids"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- Which messaging features are in scope?\n- What delivery guarantees and ordering do users expect?\n- What scale, and how many concurrent connections?\n", "answer": "**Functional**\n- 1:1 and group chats (up to ~1,000 members); text plus media references.\n- Sent / delivered / read receipts; online presence and \"last seen\"; typing indicators (best effort).\n- Offline users receive messages when they reconnect, plus a push notification.\n- Multiple devices per user, all in sync. History is stored server-side (unless end-to-end encrypted with device-only storage; say which).\n\n**Non-functional**\n- **No message loss, no duplicates shown, per-conversation order preserved.**\n- Low latency: ~100–300 ms end to end when both users are online.\n- Highly available; degrade presence and typing first.\n\n**Scale (assumed)**\n- 500M DAU, 40 messages sent per user per day, 30% of DAU connected at peak, average message 100 bytes.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "500M DAU, 40 messages per user per day, 30% concurrently connected, 500K connections per gateway server, 100 bytes per message, peak = 3× average.\n", "given": {"dau": "500e6", "msgs": 40, "online": 0.3, "per_gw": "500e3", "bytes": 100, "peak": 3}, "calc": [{"name": "avg", "ask": "Average messages", "unit": "/s", "expr": "dau * msgs / 86400", "show": "≈ 230K/s", "value": 231481.4814814815}, {"ask": "Peak messages", "unit": "/s", "expr": "avg * peak", "show": "≈ 700K/s", "value": 694444.4444444445}, {"name": "conns", "ask": "Concurrent connections", "unit": "", "expr": "dau * online", "show": "150M", "value": 150000000.0}, {"ask": "Gateway servers (no headroom)", "unit": "", "expr": "conns / per_gw", "show": "300", "value": 300.0}, {"ask": "Message storage per day", "unit": "TB", "expr": "dau * msgs * bytes / 1e12", "show": "2 TB", "value": 2.0}], "answer": "- **~700K messages/s at peak** need a horizontally partitioned write path; one message is also several more events (receipts, delivery attempts).\n- **150M persistent connections** across ~300 gateways (plan ~450 for headroom and drains). Connection state, not CPU, is the scaling unit.\n- **~2 TB/day** (~730 TB/year before replication) of message history: a wide-column store partitioned by conversation, with old data tiered to cheaper storage.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "- What travels over the persistent connection, and what over plain HTTP?\n- How does a client avoid sending a message twice after a reconnect?\n", "answer": "```\nWebSocket frames (client ↔ gateway):\n  → send      { client_msg_id, conversation_id, body, media_ids? }\n  ← ack       { client_msg_id, message_id, seq, ts }        # stored, ordered\n  ← message   { conversation_id, message_id, seq, sender, body, ts }\n  → receipt   { conversation_id, up_to_seq, type: delivered | read }\n  ← presence / typing events (best effort)\n\nHTTP:\n  GET /v1/sync?cursor=<per-device cursor>        → missed messages since last sync\n  GET /v1/conversations/{id}/messages?before_seq=…&limit=50\n  POST /v1/media/uploads                         → presigned URL\n```\n- `client_msg_id` (a UUID made on the device) makes sends **idempotent**: a resend after a dropped connection returns the original ack.\n- Receipts are **cumulative** (`up_to_seq`), so one event covers many messages.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- How are messages stored and ordered?\n- How does each device know what it has missed?\n", "answer": "```\nmessages      PK (conversation_id, bucket)  CK seq DESC\n              message_id · sender_id · body · client_msg_id · ts      → Cassandra / ScyllaDB\nconversations conversation_id · type · members (small groups) · last_seq\nuser_inbox    PK user_id  CK (updated_at)  → conversation_id, last_seq, unread   (for the chat list)\ndevice_state  (user_id, device_id) → last synced position, push token\nsessions      user_id → [gateway_id, device_id]   → Redis, TTL refreshed by heartbeats\npresence      user_id → online / last_seen        → Redis, TTL\n```\n- **Per-conversation sequence numbers** (`seq`) define order. Global ordering isn't needed and would be a bottleneck.\n- Partitioning by conversation keeps a chat's history in one place; `bucket` (e.g. month) bounds partition size for long-lived chats.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Walk through sending a message to an online user, an offline user, and a group.", "diagram": {"type": "arch", "caption": "gateways hold connections; the chat service owns ordering and storage", "nodes": {"alice": {"label": "Alice", "at": [0, 0], "kind": "client"}, "bob": {"label": "Bob", "at": [0, 2], "kind": "client"}, "gw1": {"label": "Gateway 1", "sub": "WebSocket", "at": [1, 0]}, "gw2": {"label": "Gateway 2", "sub": "WebSocket", "at": [1, 2]}, "chat": {"label": "Chat service", "sub": "assigns seq", "at": [2, 1]}, "store": {"label": "Message store", "sub": "by conversation", "at": [3, 1], "kind": "db"}, "reg": {"label": "Sessions", "sub": "registry", "at": [2, 2], "kind": "cache"}, "push": {"label": "Push", "sub": "APNs · FCM", "at": [3, 2]}}, "edges": [["alice", "gw1"], ["bob", "gw2"], ["gw1", "chat"], ["gw2", "chat"], ["chat", "store"], ["chat", "reg"], ["chat", "push"]], "frames": [{"title": "Online", "flow": [["alice", "gw1", "send"], ["gw1", "chat", "route"], ["chat", "store", "1 append"], ["chat", "reg", "2 lookup"], ["chat", "gw2", "3 deliver"], ["gw2", "bob", "message"]], "hit": ["bob"], "win": ["chat", "store", "reg"], "note": "The chat service assigns the next seq in the conversation, persists, acks Alice, looks up Bob's gateways in the registry and pushes to each of his connected devices."}, {"title": "Offline", "flow": [["alice", "gw1", "send"], ["gw1", "chat", "route"], ["chat", "store", "append"], ["chat", "push", "notify"]], "hit": ["push"], "win": ["chat", "store"], "note": "Bob has no live session: the message is already stored; a push notification goes out. When Bob reconnects, his device syncs from its cursor and gets everything after it, in order."}, {"title": "Receipt", "flow": [["bob", "gw2", "read up_to 42"], ["gw2", "chat", "receipt"], ["chat", "gw1", "forward"], ["gw1", "alice", "read ✓✓"]], "hit": ["alice"], "win": ["chat"], "note": "Receipts are cumulative and flow back the same way. They're stored per (conversation, user) as a high-water mark, not per message."}]}, "answer": "- **Gateways** only hold connections and forward frames; they're stateless apart from sockets, so they can be drained and replaced.\n- **Chat service** (partitioned by conversation) assigns order, persists, and fans out to members' devices via the **session registry**.\n- **Offline path:** store first, notify by push, deliver on sync.\n- **Groups:** small groups fan out to each member's devices and inbox rows on write; very large groups and channels switch to fan-out on read.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "ordering", "q": "How do you guarantee per-conversation ordering and no duplicates, with retries and multiple servers?", "answer": "- Route all writes for a conversation to **one owner** (partition the chat service by `conversation_id`, e.g. via a Kafka partition or consistent hashing), which assigns `seq = last_seq + 1` and persists before acking.\n- Or assign `seq` with a conditional write / atomic increment on the conversation row; either way there's exactly one sequencer per conversation.\n- **Idempotency:** the store keeps `client_msg_id` per conversation (unique), so a resend returns the existing `seq` instead of inserting twice.\n- Clients **render by seq**, not by arrival time, and detect gaps (seq 41 then 43) to trigger a sync.\n"}, {"id": "delivery", "q": "How do you make delivery reliable when connections drop at the worst moment?", "answer": "- **Store before ack:** the sender's ack means durably stored. Until the ack arrives, the client keeps the message in its outbox and resends with the same `client_msg_id`.\n- **Recipient side:** live pushes are an optimization; truth is the per-device cursor. On reconnect the device syncs everything after its cursor, so a push lost in flight is recovered.\n- Delivered receipts are sent after the device persists the message locally; read receipts when shown.\n- Result: at-least-once transport + idempotent storage + cursor-based sync = effectively exactly-once display.\n"}, {"id": "connections", "q": "How do you manage 150M persistent connections, including deploys and failures?", "answer": "- **Session registry** (user → gateway, device) in Redis with TTL refreshed by heartbeats (~30 s); stale entries expire on their own.\n- **L4 load balancing** for WebSockets; gateways scale by connections (memory), not requests.\n- **Deploys:** drain gradually, telling clients to reconnect with jittered backoff; never restart all gateways at once.\n- **Mobile realities:** connections drop constantly. Fast resumption (session token, sync from cursor) matters more than keeping a socket alive; heartbeats tuned for battery.\n"}, {"id": "groups", "q": "How do group messages scale, from 5 members to a 100K-member channel?", "answer": "- **Small groups (≤ ~500):** one stored copy in the conversation, then fan-out of the live message to each member's online devices and an update to each member's inbox row. Cost ∝ members per message.\n- **Large groups / channels:** don't touch every member's inbox. Members pull the channel's latest seq when they open the app (fan-out on read), and push notifications are batched and rate-limited.\n- Membership changes are themselves ordered events in the conversation, so everyone agrees who received which message (important for end-to-end encryption key rotation).\n"}, {"id": "presence", "q": "Presence for 500M users is expensive. How do you design it?", "answer": "- Presence = heartbeat-refreshed TTL key per user; \"last seen\" = the time the key last changed.\n- **Don't broadcast** every change to every contact. Send presence only to users who currently have a chat with that person open (subscriptions), and fetch it lazily when a chat list is shown.\n- Debounce flapping (mobile networks), coarsen to minutes for \"last seen\", and let presence degrade first under load. It's a best-effort feature.\n"}, {"id": "e2ee", "q": "The product wants end-to-end encryption. What changes in the design?", "answer": "- Clients encrypt with per-device keys (Signal protocol: X3DH + double ratchet); the server stores and forwards ciphertext and distributes public key bundles.\n- **Multi-device:** each message is encrypted for each recipient device (or groups use sender keys, re-keyed on membership change).\n- Server-side features that read content disappear or move to clients: search, link previews, spam detection on content, server-side history (backups become encrypted client backups).\n- Metadata (who talks to whom, when) is still visible to the server; minimize and protect it.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10×:** connection count and reconnect storms, then hot conversations (huge groups) and fan-out cost. Storage grows linearly; tier old history.\n\n**Monitor:** end-to-end delivery latency (send → delivered receipt), message loss probes (synthetic senders), connection count and churn per gateway, sync lag, push-notification success rate, registry error rate.\n\n**Staff-level signals**\n- Defines ordering per conversation with a single sequencer and idempotent sends.\n- Treats live push as an optimization over cursor-based sync, which makes delivery correct across disconnects and devices.\n- Handles small and huge groups differently.\n- Knows what end-to-end encryption removes from the server's capabilities.\n\n**Common mistakes**\n- Global ordering or timestamps for message order.\n- Acking before persisting.\n- Broadcasting presence to every contact.\n- One delivery path for 3-person chats and 100K-member channels.\n"}]}, {"id": "notifications", "name": "Notification System", "prompt": "Design a platform that sends notifications (mobile push, SMS, email, in-app) on behalf of many internal product teams, covering both urgent transactional messages (one-time passcodes, receipts) and marketing campaigns to tens of millions of users.", "blocks": ["queues", "reliability", "rate-limits-ids", "apis", "datastores", "estimation"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- What do callers send, and what does the platform decide for them?\n- Which messages are urgent, and how do you keep campaigns from delaying them?\n- What user controls and legal constraints apply?\n", "answer": "**Functional**\n- Send to a user, a list, or a segment, by template and category; channels: push (APNs / FCM), SMS, email, in-app inbox.\n- User preferences per category and channel, unsubscribe, quiet hours by time zone; scheduled sends.\n- Templates with localization and variables; delivery tracking (sent, delivered, opened, bounced).\n\n**Non-functional**\n- **Priorities:** OTPs and security alerts delivered within seconds even during a 100M-user campaign.\n- **No duplicates** to users (a double OTP or double marketing email is a visible bug), no loss for transactional messages.\n- Survive provider outages and respect provider rate limits; compliance (CAN-SPAM, TCPA, GDPR consent).\n\n**Scale (assumed)**\n- 1B notifications/day on average; campaigns of 100M users delivered within an hour.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "1B notifications per day; a 100M-user campaign spread over 1 hour; a notification log record of ~500 bytes; an SMS provider account limit of ~1K messages/s.\n", "given": {"daily": "1e9", "campaign": "100e6", "hour": 3600, "rec": 500, "sms_limit": 1000}, "calc": [{"ask": "Average send rate", "unit": "/s", "expr": "daily / 86400", "show": "≈ 12K/s", "value": 11574.074074074075}, {"ask": "Campaign send rate", "unit": "/s", "expr": "campaign / hour", "show": "≈ 28K/s", "value": 27777.777777777777}, {"ask": "Notification log per day", "unit": "GB", "expr": "daily * rec / 1e9", "show": "500 GB", "value": 500.0}, {"ask": "Hours to send 10M SMS at the provider limit", "unit": "h", "expr": "10e6 / sms_limit / 3600", "show": "≈ 2.8 h", "value": 2.7777777777777777}], "answer": "- **Campaigns more than double the average rate**, so the pipeline must absorb bursts (queues) and isolate priorities.\n- **500 GB/day of logs**: a time-partitioned store with TTL (e.g. 90 days hot), aggregates kept longer.\n- **Providers are the real bottleneck**: at 1K SMS/s, 10M SMS take ~3 hours. Multiple accounts / providers and per-provider rate limiting are part of the design, not an afterthought.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "Define the send API, including idempotency, priority and scheduling.", "answer": "```\nPOST /v1/notifications\nIdempotency-Key: order-981:receipt\n{\n  \"recipients\": { \"user_ids\": [123] }            # or { \"segment_id\": \"...\" }\n  \"category\": \"order_updates\",                    # drives preferences + priority\n  \"template\": \"order_shipped\", \"vars\": { \"order\": \"981\" },\n  \"channels\": [\"push\", \"email\"],                  # or \"auto\" by preference\n  \"priority\": \"transactional\" | \"marketing\",\n  \"send_at\": \"2026-10-16T09:00:00\", \"respect_quiet_hours\": true\n}\n→ 202 { \"notification_id\": \"...\", \"status\": \"accepted\" }\n\nGET /v1/notifications/{id}          → per-recipient, per-channel status\n```\n- **202 Accepted**: sending is asynchronous. The idempotency key makes retries from callers safe.\n- Segment sends return a campaign ID with progress counters instead of per-recipient results.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- What does the platform store about users, templates and each send?\n- How do you dedupe at the per-recipient level?\n", "answer": "```\ntemplates      (template_id, version, locale) → channel bodies, variables schema\npreferences    user_id → { category → { channel → on/off } }, quiet hours, time zone   (KV, cached)\ndevices        user_id → [push tokens, platform, last_seen]                           (KV)\nrequests       idempotency_key → notification_id, status                              (TTL ~7 d)\ndeliveries     PK (user_id, day)  CK notification_id, channel\n               status · provider_message_id · attempts · timestamps                   (wide-column, TTL)\n```\n- **Per-recipient dedup key:** `(notification_id, user_id, channel)`, written with a conditional insert before handing to a provider, so retries and replays don't double-send.\n- Preferences and device tokens are read on every send: cache them, and invalidate on change.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Draw the pipeline from the API to the providers, and show priority isolation and provider failure.", "diagram": {"type": "arch", "caption": "staged pipeline with per-priority and per-channel queues", "nodes": {"caller": {"label": "Product team", "at": [0, 1], "kind": "client"}, "api": {"label": "Notify API", "sub": "validate · dedup", "at": [1, 1]}, "hi": {"label": "Urgent", "sub": "queue", "at": [2, 0], "kind": "queue"}, "lo": {"label": "Bulk", "sub": "queue", "at": [2, 2], "kind": "queue"}, "router": {"label": "Router", "sub": "prefs · render", "at": [3, 1]}, "chq": {"label": "Per channel", "sub": "queues", "at": [4, 0], "kind": "queue"}, "prov": {"label": "Providers", "sub": "APNs · Twilio", "at": [4, 2]}}, "edges": [["caller", "api"], ["api", "hi"], ["api", "lo"], ["hi", "router"], ["lo", "router"], ["router", "chq"], ["chq", "prov"]], "frames": [{"title": "Transactional", "flow": [["caller", "api", "OTP"], ["api", "hi", "enqueue"], ["hi", "router", "first"], ["router", "chq", "push · SMS"], ["chq", "prov", "send"]], "hit": ["prov"], "win": ["hi", "router"], "note": "Urgent messages have their own topic and reserved router and channel workers, so they never wait behind a campaign."}, {"title": "Campaign", "flow": [["caller", "api", "segment"], ["api", "lo", "batches"], ["lo", "router", "throttled"], ["router", "chq"], ["chq", "prov", "send"]], "win": ["lo", "router", "chq"], "note": "A segment expands in batches of ~10K users into the bulk queue; the router applies preferences, quiet hours and per-user frequency caps, renders templates, then fans out per channel at a controlled rate."}, {"title": "Provider down", "flow": [["chq", "prov", "breaker open"]], "win": ["chq"], "note": "Errors from one provider open a circuit breaker; channel workers fail over to a secondary provider (another SMS vendor) or hold messages with backoff. Callbacks from providers update delivery status."}]}, "answer": "- **API:** validate, authorize the calling team, dedupe on the idempotency key, enqueue by priority, return 202.\n- **Router workers:** expand recipients, apply preferences / opt-outs / quiet hours / frequency caps, render the localized template, choose channels, enqueue per channel.\n- **Channel workers:** per-provider rate limits and retries, per-recipient dedup, provider failover; record provider IDs.\n- **Feedback:** provider webhooks (delivered, bounced, invalid token) update delivery status and clean up bad tokens and addresses.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "priority", "q": "A 100M-user campaign starts and OTP messages slow to minutes. How do you prevent that?", "answer": "- **Separate queues and worker pools per priority** (bulkheads): urgent traffic can't queue behind bulk. Separate provider accounts or reserved provider capacity for transactional sends.\n- **Throttle campaigns** at expansion time to a configured rate, leaving headroom in provider limits for urgent traffic.\n- Monitor urgent-queue latency as an SLO (e.g. 99% of OTPs handed to providers within 2 s) and pause campaigns automatically when it's at risk.\n"}, {"id": "dedup", "q": "Where can duplicates come from, and how do you stop each?", "answer": "- **Caller retries** → idempotency key at the API.\n- **Queue redelivery** (at-least-once) → per-recipient dedup key `(notification_id, user, channel)` inserted conditionally before the provider call.\n- **Provider timeouts** (sent but no response) → pass our ID as the provider's idempotency key where supported; otherwise accept a rare duplicate rather than risk loss for transactional messages, and say so.\n- **Overlapping campaigns** → per-user frequency caps per category per day.\n"}, {"id": "preferences", "q": "How do you enforce preferences, quiet hours and legal requirements correctly?", "answer": "- Resolve at **send time** in the router, not when the request is accepted, so an unsubscribe a minute ago is honored.\n- **Categories:** transactional (receipts, security) can bypass marketing opt-outs; marketing requires consent where the law says so; every marketing email gets a one-click unsubscribe.\n- **Quiet hours by the user's time zone:** delay non-urgent sends to the next allowed window (a scheduled queue), never drop them silently.\n- Keep an audit trail of consent and of what was sent, for compliance.\n"}, {"id": "providers", "q": "Providers have rate limits and outages. How do you handle them?", "answer": "- **Token bucket per provider account** shared across channel workers, sized to contracted limits.\n- **Retries with exponential backoff and jitter** for transient errors; permanent errors (invalid number, uninstalled app) are not retried and clean up the token.\n- **Circuit breaker + failover** to a secondary provider for SMS and email; push has no alternative to APNs / FCM, so queue and retry.\n- DLQ for messages that exhaust retries, with alerting and replay tooling.\n"}, {"id": "campaigns", "q": "How do you deliver a campaign to 100M users at 9 AM in each user's local time?", "answer": "- Expand the segment ahead of time into batches keyed by time zone; schedule each batch for its local 9 AM in a delay queue (or time-bucketed scheduler).\n- Spread each zone's batch over a window (e.g. 9:00–9:30) to smooth load on our pipeline, providers and the product's own servers (which users open after the push).\n- Track progress per batch; support pausing and cancelling a running campaign.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10×:** provider capacity and cost (SMS especially), then preference and token lookups. Negotiate limits, add providers, cache preferences closer to routers.\n\n**Monitor:** time-to-provider by priority, provider error rates and latency, queue lag per stage, dedup hits, bounce and complaint rates (email reputation), invalid-token rate, opt-out rate per campaign.\n\n**Staff-level signals**\n- Isolates urgent traffic end to end, including provider capacity.\n- Lists every duplicate source and the specific dedup for each.\n- Treats providers as unreliable, rate-limited dependencies with failover.\n- Brings up compliance and user trust (frequency caps, quiet hours, consent).\n\n**Common mistakes**\n- One queue for everything.\n- Checking preferences only at request time.\n- Retrying permanent provider errors.\n- Ignoring time zones and send pacing for campaigns.\n"}]}, {"id": "typeahead", "name": "Typeahead", "prompt": "Design search autocomplete. As the user types into a search box, show the top 10 query suggestions for the current prefix, ranked by popularity, fast enough to feel instant.", "blocks": ["caching", "cdn-blob", "partitioning", "queues", "storage-engines", "estimation"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- What is ranked, and how fresh must popularity be?\n- What latency budget does \"feels instant\" mean?\n- Personalization, languages, and safety?\n", "answer": "**Functional**\n- Given a prefix, return up to 10 suggested queries, ranked by popularity (with time decay).\n- Trending queries surface within minutes (nice to have); the base ranking can update hourly or daily.\n- Filter offensive and policy-violating suggestions; per-language / per-region suggestions.\n- Optional: light personalization (the user's own recent searches) blended on top.\n\n**Non-functional**\n- **End-to-end < ~100 ms** while typing, so server p99 well under 50 ms; requests are cancelled and superseded constantly.\n- Very high read QPS, tiny responses; availability over freshness (stale suggestions are fine).\n\n**Scale (assumed)**\n- 100M DAU, 10 searches per user per day, ~4 suggestion requests per search after debouncing, 50M distinct popular queries indexed.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "100M DAU, 10 searches each per day, 4 requests per search, peak 3×; 50M indexed queries with ~10 distinct prefixes each; ~100 bytes per prefix entry (key + top-10 IDs).\n", "given": {"dau": "100e6", "searches": 10, "per_search": 4, "peak": 3, "queries": "50e6", "prefixes": 10, "entry": 100}, "calc": [{"ask": "Peak suggestion requests", "unit": "/s", "expr": "dau * searches * per_search / 86400 * peak", "show": "≈ 140K/s", "value": 138888.8888888889}, {"name": "n", "ask": "Prefix entries", "unit": "", "expr": "queries * prefixes", "show": "500M", "value": 500000000.0}, {"ask": "Index size with precomputed top-10 per prefix", "unit": "GB", "expr": "n * entry / 1e9", "show": "50 GB", "value": 50.0}], "answer": "- **140K req/s of tiny lookups** suits in-memory serving with heavy caching; short prefixes (1–2 characters) are a small, extremely hot set that the CDN and browsers can serve.\n- **~50 GB index** fits in RAM on one large machine, so the simplest design is **full replicas** of the index on every server rather than sharding. Shard only if languages or personalization multiply the size.\n- Precomputing top-10 per prefix makes each request a single lookup: no tree walk or sort at request time.\n"}, {"id": "api", "title": "API", "min": 4, "ask": "Define the request and response, and describe client behavior while typing.", "answer": "```\nGET /v1/suggest?q=new%20yo&lang=en&region=US&limit=10\n→ 200  Cache-Control: public, max-age=300\n{ \"q\": \"new yo\", \"suggestions\": [ {\"text\": \"new york times\", \"score\": 0.93}, … ] }\n```\n- **Client:** debounce ~50–100 ms, cancel in-flight requests when a new key arrives, cache responses per prefix locally, and reuse a longer prefix's results when the user deletes characters.\n- Normalize the prefix (lowercase, trim, collapse spaces, Unicode normalize) on both sides so cache keys match.\n- Personalized suggestions use a separate, uncached call (or are blended client-side) so the shared response stays cacheable.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "- What raw data do you collect, and what do you serve from?\n- Trie or hash map of prefixes?\n", "answer": "```\nsearch_log (stream)     query · lang · region · user_id? · ts           → Kafka → data lake\nquery_counts (batch)    (lang, region, query) → decayed count            → recomputed hourly/daily\nserving index           (lang, region, prefix) → [top-10 (query, score)] → immutable snapshot, in memory\nblocklist               terms / patterns to suppress                     → applied at build time\n```\n- **Trie with top-K cached at each node** and a **prefix → top-K hash map** serve the same purpose. The hash map is simpler and faster to load; a compact trie (radix tree) saves memory by sharing prefixes.\n- The serving index is **built offline and swapped atomically**; servers never update it in place.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Show the serving path and the pipeline that builds the index, including trending.", "diagram": {"type": "arch", "caption": "offline build, online lookup", "nodes": {"user": {"label": "Browser", "sub": "debounce · cache", "at": [0, 0], "kind": "client"}, "cdn": {"label": "CDN", "sub": "short prefixes", "at": [1, 0]}, "svc": {"label": "Suggest svc", "sub": "index in RAM", "at": [2, 0]}, "logs": {"label": "Search logs", "sub": "Kafka", "at": [0, 2], "kind": "queue"}, "batch": {"label": "Aggregator", "sub": "hourly · decay", "at": [1, 2]}, "build": {"label": "Index builder", "at": [2, 2]}, "snap": {"label": "Snapshots", "sub": "object store", "at": [3, 1], "kind": "db"}, "trend": {"label": "Trending", "sub": "stream · 5 min", "at": [1, 1]}}, "edges": [["user", "cdn"], ["cdn", "svc"], ["logs", "batch"], ["batch", "build"], ["build", "snap"], ["snap", "svc"], ["logs", "trend"], ["trend", "svc"]], "frames": [{"title": "Serve", "flow": [["user", "cdn", "GET q=ne"], ["cdn", "svc", "miss"]], "hit": ["svc"], "win": ["cdn"], "note": "Most short-prefix requests are answered by the browser cache or the CDN. Misses hit any suggest server, which does one in-memory lookup and returns in a few ms."}, {"title": "Build", "flow": [["logs", "batch", "consume"], ["batch", "build", "counts"], ["build", "snap", "publish v42"], ["snap", "svc", "load + swap"]], "hit": ["svc"], "win": ["batch", "build", "snap"], "note": "Hourly: aggregate counts with time decay, filter by blocklist and thresholds, compute top-10 per prefix, publish a versioned snapshot. Servers load it in the background and swap a pointer."}, {"title": "Trending", "flow": [["logs", "trend", "stream"], ["trend", "svc", "overlay"]], "hit": ["svc"], "win": ["trend"], "note": "A streaming job detects queries spiking against their baseline and pushes a small overlay that servers merge into results for a few hours, until the batch index catches up."}]}, "answer": "- **Serving:** browser cache → CDN → stateless suggest servers each holding the full index in memory; one lookup per request.\n- **Batch pipeline:** logs → decayed counts → filtered top-K per prefix → versioned snapshot → atomic swap on all servers.\n- **Streaming overlay** for trending queries, merged at read time.\n- Index versions make rollouts and rollbacks simple, and a bad build can be caught by validation before it ships.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "structure", "q": "Trie or prefix hash map? How do you keep memory reasonable?", "answer": "- **Naive trie** walking all completions per request is too slow for popular short prefixes (millions of descendants). Cache the top-K at every node, so a lookup is O(prefix length).\n- **Prefix → top-K map** is the flattened version: one hash lookup, trivially sharded, easy to build in a batch job, larger in memory because prefixes aren't shared.\n- **Save memory:** store query strings once and reference them by integer ID in top-K lists; cap indexed prefix length (e.g. 20 chars, beyond that fall back to search); drop rare queries below a count threshold (also a privacy measure).\n"}, {"id": "ranking", "q": "How do you rank suggestions, and how does freshness work?", "answer": "- Score = time-decayed popularity (e.g. exponential decay with a half-life of days), so last year's spike fades.\n- Blend signals: click-through on the suggestion, query success (did the user click a result), locale. Keep the formula simple and offline.\n- **Trending:** compare a query's last-hour rate with its baseline; spikes enter the overlay with a boost that decays.\n- **Personalization:** merge the user's recent searches matching the prefix on top, client-side or in a separate call, keeping the shared response cacheable.\n"}, {"id": "caching", "q": "Where does caching pay off most?", "answer": "- **Short prefixes dominate traffic and have few distinct values** (36 one-char, ~1,300 two-char per language). Cache them at the CDN and in the browser with a TTL of minutes.\n- The client reuses results: \"new y\" results filtered locally may already answer \"new yo\".\n- Server-side, everything is already in memory; a CDN hit simply saves the round trip and the server capacity.\n- Invalidate by index version: include the version in the cache key, or just let short TTLs expire.\n"}, {"id": "scaling", "q": "The index grows to 2 TB with many languages and regions. How do you shard?", "answer": "- **Shard by (lang, region) first**: requests already carry them, and each shard is independent.\n- Within a huge locale, shard by **prefix range** with a routing table built from traffic, not alphabetically (prefixes starting with \"s\" or \"a\" are far heavier than \"x\").\n- Replicate each shard for availability and QPS; any replica can answer.\n- Avoid hashing the full prefix if you want the client to reuse results across keystrokes from one server; routing by the first 2–3 characters keeps a user's typing on one shard.\n"}, {"id": "safety", "q": "How do you stop offensive or harmful suggestions, including sudden ones?", "answer": "- **Build-time filtering**: blocklists, classifiers, and minimum-popularity thresholds (rare queries can be personal data or manipulation).\n- **Serve-time kill switch**: a small denylist pushed to servers within minutes that filters results at read time, for incidents that can't wait for the next build.\n- Watch for **manipulation** (bots searching a phrase to make it trend): count distinct users, not raw queries, and rate-limit per client.\n- Separate rules for sensitive categories (names of private people, medical, legal).\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10×:** index size with more locales and personalization, and the build pipeline's duration. Shard by locale, cap prefixes, and make builds incremental.\n\n**Monitor:** server p99, CDN and browser hit ratio, suggestion click-through rate, index build success and age (staleness), denylist propagation time, empty-result rate.\n\n**Staff-level signals**\n- Precomputes top-K per prefix and does one lookup per request.\n- Notices that 50 GB fits in RAM and keeps full replicas instead of sharding prematurely.\n- Uses the client and CDN aggressively for short prefixes.\n- Treats safety and manipulation as first-class, with a fast kill switch.\n\n**Common mistakes**\n- Walking the trie and sorting completions on every request.\n- Updating the serving index in place on every search.\n- Ignoring debouncing and cancellation on the client.\n"}]}, {"id": "web-crawler", "name": "Web Crawler", "prompt": "Design a web crawler for a search engine that fetches about 1 billion pages a month, respects robots.txt and per-site politeness, avoids duplicates and traps, and keeps important pages fresh.", "blocks": ["queues", "partitioning", "storage-engines", "cdn-blob", "reliability", "estimation"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- What does the crawler produce, and for whom?\n- What are the politeness and safety constraints?\n- How do you decide what to crawl next, and how often to recrawl?\n", "answer": "**Functional**\n- Start from seed URLs; fetch pages, store raw content, extract links, and add new URLs to the crawl.\n- Respect `robots.txt` and crawl-delay; limit concurrent requests per host.\n- Deduplicate URLs (normalized) and near-duplicate content.\n- Prioritize important pages; recrawl based on how often pages change.\n- Output: stored pages and a link graph for the indexing pipeline (indexing itself out of scope).\n\n**Non-functional**\n- Scalable to billions of pages; robust to malformed HTML, slow servers, spider traps and huge files.\n- **Polite:** never overload a site; identify the crawler with a user agent and contact URL.\n- Extensible: new content types and parsers without redesign.\n\n**Scale (assumed)**\n- 1B pages fetched per month, average 100 KB per page, 10B URLs known.\n"}, {"id": "estimation", "title": "Estimation", "min": 5, "ask": "1B pages per month, 100 KB per page, 10B known URLs with an 8-byte fingerprint each, and a Bloom filter at 10 bits per URL.\n", "given": {"pages": "1e9", "month": "30 * 86400", "kb": 100, "urls": "10e9"}, "calc": [{"name": "rate", "ask": "Average fetch rate", "unit": "pages/s", "expr": "pages / month", "show": "≈ 400/s", "value": 385.8024691358025}, {"ask": "Download bandwidth", "unit": "MB/s", "expr": "rate * kb / 1000", "show": "≈ 40 MB/s", "value": 38.58024691358025}, {"ask": "Raw content per month", "unit": "TB", "expr": "pages * kb * 1000 / 1e12", "show": "100 TB", "value": 100.0}, {"ask": "URL-seen set as 8-byte fingerprints", "unit": "GB", "expr": "urls * 8 / 1e9", "show": "80 GB", "value": 80.0}, {"ask": "URL-seen set as a Bloom filter", "unit": "GB", "expr": "urls * 10 / 8 / 1e9", "show": "12.5 GB", "value": 12.5}], "answer": "- **400 pages/s** is modest in aggregate. The difficulty is politeness: those fetches must spread over millions of hosts, each fetched slowly.\n- **40 MB/s** (~320 Mbps) download is easy; DNS lookups and slow servers dominate latency, so fetchers need high concurrency (thousands of in-flight requests).\n- **100 TB/month** raw: compress (HTML compresses ~5×) and store in object storage, deduped by content hash.\n- **URL dedup** fits in memory as a Bloom filter (12.5 GB) or a sharded fingerprint set.\n"}, {"id": "api", "title": "Component interfaces", "min": 4, "ask": "There's no public API. Define the interfaces between the frontier, fetchers and parsers.", "answer": "```\nFrontier\n  add(urls[], source, priority_hint)             # dedup + enqueue\n  lease(fetcher_id, n) → [ {url, host, not_before} ]   # only hosts ready to be fetched\n  complete(url, status, next_crawl_at)           # releases the host slot\n\nFetcher → content store\n  put(url, fetched_at, status, headers, content_hash, body_ref)\n\nParser\n  on_page(page) → { links[], canonical_url?, simhash, metadata }\n```\n- Leases with timeouts let a crashed fetcher's URLs return to the frontier automatically.\n- The frontier returns URLs grouped so that one fetcher owns a host at a time, which makes politeness a local decision.\n"}, {"id": "data-model", "title": "Data model", "min": 5, "ask": "What do you store per URL, per host and per page?", "answer": "```\nurls     url_fingerprint PK · url · host · priority · last_crawled · next_crawl_at\n         · last_status · content_hash · change_rate_estimate       → sharded by host\nhosts    host PK · robots rules + fetched_at · crawl_delay · ip\n         · next_allowed_fetch · error_rate                         → sharded by host\npages    content_hash → compressed body in object storage (deduped)\nlinks    (from_fingerprint, to_fingerprint) edges                  → for ranking (PageRank-like)\n```\n- **Shard everything by host**: a host's URLs, robots rules and politeness state live together, so one worker can schedule that host without coordination.\n- Content is addressed by hash, so identical pages under different URLs are stored once.\n"}, {"id": "high-level", "title": "High-level design", "min": 8, "ask": "Draw the crawl loop and show where politeness, dedup and recrawl scheduling happen.", "diagram": {"type": "arch", "caption": "the crawl loop, partitioned by host", "nodes": {"seeds": {"label": "Seeds", "at": [0, 0], "kind": "client"}, "front": {"label": "Frontier", "sub": "per host", "at": [1, 0], "kind": "queue"}, "fetch": {"label": "Fetchers", "sub": "robots · DNS", "at": [2, 0]}, "store": {"label": "Content store", "sub": "by hash", "at": [3, 0], "kind": "db"}, "parse": {"label": "Parsers", "sub": "links · simhash", "at": [3, 1]}, "dedup": {"label": "URL filter", "sub": "dedup · seen set", "at": [2, 1]}, "sched": {"label": "Recrawl sched", "sub": "change rate", "at": [1, 1]}}, "edges": [["seeds", "front"], ["front", "fetch"], ["fetch", "store"], ["store", "parse"], ["parse", "dedup"], ["dedup", "front"], ["sched", "front"]], "frames": [{"title": "Fetch", "flow": [["seeds", "front", "add"], ["front", "fetch", "lease"], ["fetch", "store", "put"]], "hit": ["store"], "win": ["front", "fetch"], "note": "Fetchers lease URLs only from hosts whose next allowed time has passed, check cached robots rules, resolve DNS through a local cache, and fetch with strict timeouts and size limits."}, {"title": "Extract", "flow": [["store", "parse", "new page"], ["parse", "dedup", "links"], ["dedup", "front", "new URLs"]], "hit": ["front"], "win": ["parse", "dedup"], "note": "Parsers extract links and a SimHash; links are normalized and checked against the seen set. Only new URLs reach the frontier, routed to the shard that owns their host."}, {"title": "Recrawl", "flow": [["sched", "front", "due URLs"]], "hit": ["front"], "win": ["sched"], "note": "Each URL has a next-crawl time from its importance and observed change rate. The scheduler re-enqueues URLs as they come due."}]}, "answer": "- **Frontier:** prioritized, and per-host queues enforce politeness (one in-flight request per host, crawl-delay between fetches).\n- **Fetchers:** async I/O with thousands of concurrent connections, robots and DNS caches, timeouts, size caps, redirect limits.\n- **Parsers and URL filter:** extract links, normalize, dedupe against the seen set, apply trap heuristics.\n- **Recrawl scheduler:** importance × change rate decides when to fetch again.\n- **Partition by host hash** across crawler nodes: each node owns its hosts end to end.\n"}, {"id": "deep-dives", "title": "Deep dives", "min": 15, "ask": "Pick 2–3. Answer each before revealing it.", "items": [{"id": "frontier", "q": "Design the URL frontier so it enforces both priority and politeness.", "answer": "The classic **Mercator** design:\n- **Front queues** by priority (e.g. 10 levels from PageRank-like importance and freshness need); a selector draws from them, biased toward high priority.\n- **Back queues**, one per host (or per IP), each holding only that host's URLs. A host is in exactly one back queue.\n- A **min-heap of (next_allowed_time, host)** decides which back queue a fetcher may pull from next; after a fetch, the host's next time = now + max(crawl-delay, k × last response time).\n- Back queues refill from front queues when they empty. Persist the frontier (RocksDB / Kafka-backed) since it holds billions of URLs.\n"}, {"id": "dedup", "q": "How do you avoid fetching the same thing twice: same URL, different URLs for the same page, and near-copies?", "answer": "- **URL normalization:** lowercase scheme and host, remove default ports and fragments, sort or strip tracking query parameters, resolve relative paths; honor `rel=canonical`.\n- **Seen set:** a Bloom filter (no false negatives, ~1% false positives that skip a few URLs) or exact fingerprints in a sharded KV, partitioned by host like everything else.\n- **Exact content dupes:** hash the body; identical content under different URLs is stored once and linked.\n- **Near-duplicates:** SimHash (64-bit) with Hamming distance ≤ 3 flags mirrors and boilerplate-variant pages; keep the canonical one and lower the others' recrawl priority.\n"}, {"id": "traps", "q": "How does the crawler avoid spider traps and hostile servers?", "answer": "- **Limits:** max URL length, path depth, redirects, page size, and fetch time; max pages per host per crawl cycle.\n- **Pattern detection:** repeating path segments (`/a/b/a/b/…`), infinite calendars, session IDs in URLs, huge numbers of query-parameter permutations on one host.\n- **Budgets by importance:** low-value hosts get small budgets, so a trap can't consume much.\n- **Hostile responses:** timeouts for slow-loris servers, content-type checks, decompression-bomb limits, sandboxed parsers.\n"}, {"id": "freshness", "q": "How do you decide when to recrawl a page?", "answer": "- Estimate each page's **change rate** from history (changed / unchanged on recent fetches, `Last-Modified`, ETags) and its **importance**.\n- Schedule next crawl ≈ a function of both: important, fast-changing pages (news home pages) every few minutes; static, unimportant pages every few months.\n- Use **conditional GETs** (`If-Modified-Since`, `If-None-Match`) so unchanged pages cost a 304 and no transfer.\n- Sitemaps and feeds (RSS, sitemap `lastmod`) give cheap change hints for sites that provide them.\n"}, {"id": "distribution", "q": "How do you distribute the crawler across hundreds of machines?", "answer": "- **Partition by host hash** (consistent hashing) so each node owns a set of hosts: politeness, robots caching and dedup for those hosts are all local, no cross-node locking.\n- Discovered links for hosts owned elsewhere are batched and sent to the owning node (via a queue per partition).\n- Very large hosts (Wikipedia-sized) get their own dedicated partition and a negotiated higher crawl rate.\n- Node failure: reassign its host ranges; the frontier and seen set are persisted, so the new owner resumes.\n"}]}, {"id": "wrap-up", "title": "Wrap-up", "min": 3, "ask": "- What breaks first at 10×?\n- What do you monitor?\n- What makes this a staff-level answer?\n", "answer": "**At 10× (10B pages/month):** frontier size and the seen set (100B URLs), DNS volume, and storage. Tier the frontier to disk, shard the seen set, run local recursive resolvers.\n\n**Monitor:** pages/s, error rates by type (DNS, timeout, 4xx, 5xx), per-host politeness violations (should be zero), duplicate rate, freshness lag for top pages, frontier size by priority, complaint emails.\n\n**Staff-level signals**\n- Treats politeness as the core scheduling constraint and designs the frontier around it.\n- Partitions by host so most decisions are local.\n- Separates URL dedup, exact content dedup and near-duplicate detection.\n- Has a principled recrawl policy (importance × change rate) and conditional GETs.\n\n**Common mistakes**\n- A single global FIFO queue (hammers sites, ignores importance).\n- No trap defenses or size limits.\n- Recrawling everything on a fixed schedule.\n"}]}, {"id": "video-streaming", "name": "Video Streaming", "prompt": "Design a video platform like YouTube. Creators upload videos; the platform processes them; hundreds of millions of viewers watch with quick start-up and smooth playback on any network.", "blocks": ["cdn-blob", "queues", "datastores", "caching", "reliability", "estimation"], "steps": [{"id": "requirements", "title": "Requirements", "min": 5, "ask": "- Which flows are core: upload, processing, playback, and what else?\n- What quality-of-experience targets matter for playback?\n- What scale on both the upload and viewing sides?\n", "answer": "**Functional**\n- Upload videos (up to many GB, resumable), with title, description and visibility.\n- Process: transcode into multiple resolution
